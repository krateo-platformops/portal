# core-provider's table of a composition's Ready reasons, as this portal was written against it, and
# how the portal shows each one.
#
# core-provider GENERATES the complete, closed list (docs/ready-reasons.md on its main, from code:
# core-provider#515). The portal hardcodes reasons in several charts, so a reason added or reclassified
# there would render wrongly here with nothing saying so: HelmOperationInProgress and Deleting read red
# NotReady for exactly that reason until 2026-11-15. scripts/test-ready-reasons.py (its own workflow, on
# every PR, on main and daily) fails when:
#   - core-provider's table differs from `table` below in any row (a reason added, removed, or given a
#     new status or parent verdict). Decide how the portal shows the change, update the charts, then
#     update this file;
#   - the Ready=False rows with parent verdict `converging` are not exactly the keys of
#     readyFalseConverging in helm/portal/templates/_ready-reasons.tpl, the one definition every chart
#     uses (its copies are kept byte-identical by test-copied-helpers.py).
#
# `portal` says what the portal shows for the reason, for the reader of this file; it is not parsed.
source: https://raw.githubusercontent.com/krateo-platformops/core-provider/main/docs/ready-reasons.md
table:
  - {reason: Available, status: "True", writer: composition-dynamic-controller, verdict: healthy, portal: Ready (green)}
  - {reason: AvailablePartialCoverage, status: "True", writer: composition-dynamic-controller, verdict: healthy, portal: Ready (green)}
  - {reason: ReconcileGracefullyPaused, status: "True", writer: composition-dynamic-controller, verdict: healthy, portal: Paused}
  - {reason: Creating, status: "False", writer: composition-dynamic-controller, verdict: converging, portal: Creating (orange), state pending}
  - {reason: Unavailable, status: "False", writer: composition-dynamic-controller, verdict: failed, portal: NotReady (red), state failed}
  - {reason: HelmOperationInProgress, status: "False", writer: composition-dynamic-controller, verdict: converging, portal: Pending (orange), state pending}
  - {reason: PendingHelmOperation, status: "False", writer: composition-dynamic-controller, verdict: converging, portal: Pending (orange), state pending}
  - {reason: ZeroEvidence, status: Unknown, writer: composition-dynamic-controller, verdict: "unevaluated (rolls up as healthy)", portal: not assessable, set aside}
  - {reason: ChildrenForbidden, status: Unknown, writer: composition-dynamic-controller, verdict: converging, portal: Children unreadable}
  - {reason: InventoryNotRecorded, status: Unknown, writer: composition-dynamic-controller, verdict: converging, portal: "pending; failed when Synced=False (#439)"}
  - {reason: ReconcilePaused, status: "True", writer: unstructured-runtime, verdict: healthy, portal: Paused}
  - {reason: Creating, status: "False", writer: unstructured-runtime, verdict: converging, portal: Creating (orange), state pending}
  - {reason: ObserveFailed, status: Unknown, writer: unstructured-runtime, verdict: "unevaluated (rolls up as healthy)", portal: "pending; failed when Synced=False (#439)"}
  - {reason: Deleting, status: "False", writer: unstructured-runtime, verdict: converging, portal: Deleting (orange), state pending}
