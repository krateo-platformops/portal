# @schema
# description: The namespace this chart CREATES and installs its page objects into. It is the RBAC boundary the chart exists for — a group with no RoleBinding here cannot `list` the page roots, so the portal sidebar never shows them and the page body 403s on a deep link. The release itself stays in the portal's namespace (the shell), and only these objects live here.
# type: string
# default: "krateo-dashboard"
# @schema
namespace: krateo-dashboard

# @schema
# description: Groups granted read of these pages in `namespace`. A group listed here sees /dashboard in the sidebar and can open it; a group absent cannot list the page roots, so the entry never renders.
# type: array
# @schema
readerGroups:
  - admins
  - devs

# @schema
# description: The page each Dashboard inbox source belongs to, as its root Flex (`root`) in the namespace its page chart installs into (`namespace`, that chart's own `namespace` value). The inbox reads a source only for a caller who may GET that root, the object the sidebar must read for the page's entry to show, so a source whose page the caller cannot open is left out rather than drawn as having nothing waiting. Set a namespace here when that page chart is installed with a non-default `namespace`. No schema default: the default lives here.
# type: object
# @schema
inboxPages:
  incidents:
    namespace: krateo-incidents
    root: page-incidents
  alerts:
    namespace: krateo-alerts
    root: page-alerts
  agents:
    namespace: krateo-agents
    root: page-agents
  reviews:
    namespace: krateo-reviews
    root: page-reviews
  compositions:
    namespace: krateo-compositions
    root: page-compositions
