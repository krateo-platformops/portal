kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: lists-row
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
{{/* Recent activity and Recent blueprints side by side (12 / 12) from 768 px (antd `md`), one per */}}
{{/* row below it (`xs`, antd's base span). Decision of 2026-11-11: with fixed spans a 390 px phone */}}
{{/* gave each ~171 px and their text wrapped word by word. No `size`: `xs` would override it. */}}
spec:
  widgetData:
    allowedResources:
    - cards
    alignment: top
    items:
    - resourceRefId: activity-card
      xs: 24
      md: 12
    - resourceRefId: blueprints-card
      xs: 24
      md: 12
  resourcesRefs:
    items:
    - id: activity-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: activity-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: blueprints-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprints-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
