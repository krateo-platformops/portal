kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: charts-row
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
{{/* The throughput chart and Condition coverage side by side (16 / 8) from 992 px (antd `lg`), one */}}
{{/* per row below it (`xs`, antd's base span). Decision of 2026-11-11: with fixed spans a 390 px */}}
{{/* phone squeezed Condition coverage into ~114 px and cut its title to "CO…". No `size`: `xs` */}}
{{/* would override it at every width anyway. */}}
spec:
  widgetData:
    allowedResources:
    - cards
    alignment: stretch
    items:
    - resourceRefId: throughput-card
      xs: 24
      lg: 16
    - resourceRefId: status-card
      xs: 24
      lg: 8
  resourcesRefs:
    items:
    - id: throughput-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: throughput-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: status-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: status-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
