{{/* The applied filters as chips: one per picked source, each removing itself (its href is the URL
     without that value, computed by portal.facets), then "Clear all", which keeps only the shell's
     ?projects. Hidden when nothing is applied. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: dashboard-active-filters
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, source]
  apiRef:
    name: dashboard-inbox
    namespace: {{ $.Values.namespace }}
  widgetData:
    hideWhenEmpty: true
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{href}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .chips // [] }'
  resourcesRefs:
    items: []
