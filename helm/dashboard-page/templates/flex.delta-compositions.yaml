kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: delta-compositions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, q, scope, status]
  apiRef:
    name: compositions-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    allowedResources:
    - tags
    - paragraphs
    align: baseline
    {{/* #1: pin the range-pill + "past 7d" delta row flush-LEFT under the big Statistic value. */}}
    {{/* antd Flex is display:flex so this Flex already spans the stat-card body full width; */}}
    {{/* justify: flex-start makes the pill+caption unambiguously left-aligned (the default was */}}
    {{/* implicit and read mid-card). The Flex CR has no width field — full-card width comes */}}
    {{/* from the card body it fills, so flex-start is all that's needed to left-anchor it. */}}
    justify: flex-start
    gap: 4
    items:
    - resourceRefId: delta-tag-compositions
    - resourceRefId: delta-cap-compositions
  {{/* When some compositions are not assessable (Ready=Unknown, reason ZeroEvidence) the subline */}}
  {{/* says how many instead of the "N new · past 24h" pair; with none it is that pair, as before. */}}
  widgetDataTemplate:
  - forPath: items
    expression: '${ if .assessment.notAssessable > 0 then [ { resourceRefId: "delta-cap-not-assessable" } ] else [ { resourceRefId: "delta-tag-compositions" }, { resourceRefId: "delta-cap-compositions" } ] end }'
  resourcesRefs:
    items:
    - id: delta-tag-compositions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: delta-tag-compositions
      namespace: {{ $.Values.namespace }}
      resource: tags
      verb: GET
    - id: delta-cap-compositions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: delta-cap-compositions
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: delta-cap-not-assessable
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: delta-cap-not-assessable
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
