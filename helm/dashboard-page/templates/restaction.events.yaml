{{/* Dashboard recent-activity — real events from the events-presenter (krateo-sse-proxy), */}}
{{/* the canonical krateo events source (k8s -> OTel -> ClickHouse -> sse-proxy), NOT raw */}}
{{/* k8s core events. No composition filter here: the dashboard shows ALL recent activity. */}}
{{/* Thin/generic: raw GET + exportJwt; the EventList shapes/caps. DEPENDS ON the platform's */}}
{{/* `sse-proxy-internal-endpoint` Endpoint + the sse-proxy stack; absent that, getEvents fails */}}
{{/* gracefully (continueOnError) and the card is empty. */}}
{{/* */}}
{{/* Per-row deep-link: sse-proxy (>= 1.5.0) returns, on every event that belongs to a */}}
{{/* composition, `composition: {id, namespace, name}` — the name and namespace stamped by the */}}
{{/* otel-collector's compositionresolver next to the krateo.io/composition-id label. The row */}}
{{/* links to that composition directly, so this RA lists no compositions at all: no */}}
{{/* CompositionDefinitions walk, no fan-out over every composition kind, and so no re-run of */}}
{{/* this RA when compositions change. Rows ingested before the collector stamped names carry */}}
{{/* the id only (sse-proxy then omits namespace and name) and fall to the inert fallback; */}}
{{/* there is deliberately no by-id route. */}}
{{/* */}}
{{/* No userAccessFilter either. The ones on the removed composition lists never scoped the */}}
{{/* EVENTS — they only decided which rows got a link. The events are scoped by sse-proxy */}}
{{/* itself: the exported JWT, then (RBAC_SCOPING_ENABLED, as krateo-057 runs it) a */}}
{{/* SubjectAccessReview per namespace, failing closed. */}}
{{/* */}}
{{/* Feedback: the row DISPLAYS its involvedObject (Kind/Name) and then navigated somewhere */}}
{{/* else — the owning composition — so clicking a blueprint's event landed on a composition */}}
{{/* page, and an event with no composition tag did nothing at all. The route is now resolved */}}
{{/* from the object the row is actually about, falling back to the composition: */}}
{{/*   CompositionDefinition → /blueprints/<ns>/<name>   (the object's OWN detail page) */}}
{{/*   an event naming its composition → /compositions/<ns>/<name>   (its owner) */}}
{{/*   otherwise → ""  (inert; ListView only marks a row clickable when navigateTo is set, so */}}
{{/*                    an unroutable row is visibly inert rather than a dead click) */}}
{{/* Kinds with no detail page in the portal stay inert deliberately — inventing a route to a */}}
{{/* page that does not exist trades a dead click for a 404, which is worse. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: events
  namespace: {{ $.Values.namespace }}
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    - name: getEvents
      endpointRef:
        name: sse-proxy-internal-endpoint
        namespace: {{ .Release.Namespace }}
      path: /events
      verb: GET
      headers:
        - 'Accept: application/json'
      exportJwt: true
      continueOnError: true
  filter: >
    {
      list: (
        ( .getEvents | if type == "array" then . elif type == "object" then (.resources // .items // []) else [] end )
        | group_by((.involvedObject.uid // "") + "|" + (.reason // "") + "|" + (.message // ""))
        | map(max_by(.lastTimestamp // .eventTime // .firstTimestamp // ""))
        | sort_by(.lastTimestamp // .eventTime // .firstTimestamp // "")
        | reverse
        | .[0:50]
        | map(. + { route: ( (if (.composition | type) == "object" then .composition else {} end) as $c
                             | ($c.namespace // "") as $cns
                             | ($c.name // "") as $cn
                             | (.involvedObject.kind // "") as $k
                             | (.involvedObject.name // "") as $n
                             | (.involvedObject.namespace // "") as $ons
                             | if $k == "CompositionDefinition" and $n != "" and $ons != ""
                               then ("/blueprints/" + $ons + "/" + $n)
                               elif $cns != "" and $cn != "" then ("/compositions/" + $cns + "/" + $cn)
                               else "" end ) })
      )
    }
