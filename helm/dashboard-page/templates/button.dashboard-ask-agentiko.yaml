{{/* "Ask Agentiko →" on /dashboard: "brief me on what needs me". It navigates to THIS page with an
     ?ask seed the rail consumes on mount, keeping ?source and ?projects.

     Same object as service-desk-page's button.request-ask-agentiko; read the comment there. The
     label and `intent: agentiko` are fixed (A4); "New composition" keeps the header's one primary
     (P6), and this sits immediately left of it.

     IT READS dashboard-inbox, whose `askHref` describes the inbox on screen: the sources in view
     (only the picked ones under ?source=), what each has waiting, and first of all any read that
     failed. A failed read is asked about, never described as nothing waiting, and a source whose
     page the caller cannot open is not mentioned. The click is a plain literal navigate. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: dashboard-ask-agentiko
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, source]
  apiRef:
    name: dashboard-inbox
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /dashboard
  widgetDataTemplate:
    {{/* Server-built self-page href with the ?ask seed; falls back to the dashboard, never a 404. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.askHref // "") != "" then .askHref else "/dashboard" end) } ] } }'
  resourcesRefs:
    items: []
