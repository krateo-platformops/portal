{{/* Trial countdown — a one-card strip at the top of the dashboard, shown ONLY when this */}}
{{/* Krateo is a time-limited trial (restaction.tenant-trial finds the `tenant-trial` */}}
{{/* ConfigMap). Same self-hiding mechanism as onboarding-empty: the template emits [] when */}}
{{/* there is no trial and `hideWhenEmpty` renders nothing. */}}
{{/* */}}
{{/* Colour tracks urgency: blue with more than 2 days left, orange inside the last 2 days, */}}
{{/* red once it has ended. */}}
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Listy
metadata:
  name: dashboard-trial
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: tenant-trial
    namespace: {{ $.Values.namespace }}
  widgetData:
    hideWhenEmpty: true
    bordered: true
    grid:
      gutter: 16
      column: 1
    dataSource: []
    itemTemplate:
      rowVariant: card
      iconVariant: tile
      icon: '{icon}'
      primaryText: '{name}'
      description: '{description}'
      color:
        value: '{color}'
        default: blue
  widgetDataTemplate:
    - forPath: dataSource
      expression: >-
        ${ if (.trial == null) then []
           else
             .trial as $t
             | ($t.expiresAt | sub("T"; " ") | sub(":[0-9]{2}Z$"; " UTC")) as $when
             | if $t.expired then
                 [ { name: "Your trial has ended", icon: "fa-hourglass-end", color: "red",
                     description: ("It ended on " + $when + ". Contact your platform admin to keep this environment.") } ]
               else
                 [ { name: ("Trial: "
                       + (if $t.days > 0 then ($t.days | tostring) + (if $t.days == 1 then " day " else " days " end) else "" end)
                       + ($t.hours | tostring) + (if $t.hours == 1 then " hour" else " hours" end)
                       + " left"),
                     icon: "fa-hourglass-half",
                     color: (if $t.secondsLeft < 172800 then "orange" else "blue" end),
                     description: ("Ends on " + $when + ". When it ends, this environment and its data are deleted.") } ]
               end
           end }
  resourcesRefs:
    items: []
