kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: stats-row
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
{{/* The four stat cards: 4 across from 768 px (antd `md`), 2 x 2 from 576 px (`sm`), one per row */}}
{{/* below that (`xs`, antd's base span, which applies at every width a larger key does not cover). */}}
{{/* The decision of 2026-11-10 put the one-per-row cut at 400 px; antd's grid has no breakpoint */}}
{{/* there (xs ends at 575), so phones up to 575 px stack too. A fixed `size: 6` kept four ~86 px */}}
{{/* columns on a 390 px phone and wrapped the labels letter by letter. No `size`: `xs` would */}}
{{/* override it at every width anyway. */}}
spec:
  widgetData:
    allowedResources:
    - cards
    items:
    - resourceRefId: stat-card-compositions
      xs: 24
      sm: 12
      md: 6
    - resourceRefId: stat-card-healthy
      xs: 24
      sm: 12
      md: 6
    - resourceRefId: stat-card-reconciles
      xs: 24
      sm: 12
      md: 6
    - resourceRefId: stat-card-failed
      xs: 24
      sm: 12
      md: 6
  resourcesRefs:
    items:
    - id: stat-card-compositions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: stat-card-compositions
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: stat-card-healthy
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: stat-card-healthy
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: stat-card-reconciles
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: stat-card-reconciles
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: stat-card-failed
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: stat-card-failed
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
