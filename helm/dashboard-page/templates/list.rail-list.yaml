{{/* Reconciliation rail — per-composition desired-vs-actual bars. Real data, no */}}
{{/* hardcoding: fed by the compositions-list RA, each row a composed antd Progress */}}
{{/* line whose percent (.healthPercent) + colour (.railState → green/violet/orange/ */}}
{{/* orange/red) are derived server-side from the composition's Ready×Synced conditions */}}
{{/* (+ workloadHealthy when the blueprint projects it). RED is reserved for Ready=False */}}
{{/* (genuine apply/reconcile failure); a reconciled composition whose PROJECTED */}}
{{/* workloadHealthy is false shows GOLD "degraded" (rolling out / workload unready), */}}
{{/* NOT red — so a normal rolling Deployment update no longer flashes the rail red. */}}
{{/* Non-healthy compositions sort first (a paused/drifting composition surfaces at */}}
{{/* the top). Per-composition (cheap, composition-level Ready×Synced); the per- */}}
{{/* managed-resource rail lives on the detail page (composition-resources RA). */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: rail-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, q, scope, status]
  apiRef:
    name: compositions-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: false
    itemTemplate:
      primaryText: '{name}'
      subPrimaryText: '{ns}'
      {{/* D4: each rail row is clickable → that composition's detail page (logs/manifest/relations). */}}
      navigateTo: '/compositions/{ns}/{name}'
      {{/* `rail` is the RA's bar for this row: healthPercent / railState / "N%", except for a */}}
      {{/* composition that is not assessable, whose bar is percent 0 (the whole trail hatched): */}}
      {{/*   Ready=Unknown/ZeroEvidence       state notAssessable, gray, "No signal" (nobody's defect) */}}
      {{/*   Ready=Unknown/ChildrenForbidden  state unreadable, the palette's `warning` (attention) */}}
      {{/*                                    colour, "Children unreadable": an RBAC defect to fix */}}
      bar:
        percent: '{rail.percent}'
        color:
          value: '{rail.state}'
          map:
            healthy: green
            drift: violet
            pending: orange
            degraded: orange
            paused: gray
            notAssessable: gray
            unreadable: warning
            failed: red
        label: '{rail.label}'
        {{/* The reason behind "No signal" / "Children unreadable", on hover or focus (for the */}}
        {{/* latter the controller's message names the refused children). The RA sets `rail.reason` only on a */}}
        {{/* not assessable row; on any other row it is absent, and the label has no tooltip. */}}
        {{/* Needs frontend-crds 1.8.33 (the Listy CRD's bar.tooltip). */}}
        tooltip: '{rail.reason}'
        variant: rail
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ (.list // []) | sort_by(if .railState == "healthy" then 1 else 0 end) | .[0:12] }'
  resourcesRefs:
    items: []
