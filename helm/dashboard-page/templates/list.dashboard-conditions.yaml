{{/* Per-condition COVERAGE gauges — the honest aggregate of the REAL status.conditions across all */}}
{{/* compositions (replaces the invented Healthy/Pending/Failed donut). For each distinct condition */}}
{{/* TYPE (Ready, Synced, …) a bar shows how many compositions have it True ("N/M"), cyan fill; the */}}
{{/* unfilled trail is the gap. Straight off `.conditions[].type`/`.status`, except that the Ready */}}
{{/* row leaves out the compositions that are not assessable and says how many it left out. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: dashboard-conditions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, q, scope, status]
  apiRef:
    name: compositions-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    itemTemplate:
      {{/* ONLY the Ready row is clickable (route baked server-side): its unfilled trail */}}
      {{/* IS the failed set, so it drills into /compositions?status=failed. The other */}}
      {{/* condition types have no equivalent pre-filtered view — route:"" keeps them */}}
      {{/* inert (never a broken link). */}}
      navigateTo: '{route}'
      primaryText: '{type}'
      {{/* Ready row only, and only when some compositions are not assessable: */}}
      {{/* "+ N not assessable (no readiness signal)". Empty otherwise, so nothing renders. */}}
      subPrimaryText: '{note}'
      bar:
        percent: '{percent}'
        label: '{label}'
        color:
          value: cyan
        variant: line
    dataSource: []
  widgetDataTemplate:
    {{/* One row per condition type, computed in compositions-list (`conditionCoverage`). The Ready */}}
    {{/* row counts assessable compositions only: one with Ready=Unknown/ZeroEvidence has no */}}
    {{/* readiness signal, so it is neither part of the fraction nor its gap. */}}
    - forPath: dataSource
      expression: '${ .conditionCoverage }'
  resourcesRefs:
    items: []
