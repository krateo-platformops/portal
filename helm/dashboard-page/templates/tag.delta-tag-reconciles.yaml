kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: delta-tag-reconciles
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, q, scope, status]
  widgetData:
    label: 0%
    color: orange
    style:
      fontSize: '13px'
      fontWeight: 700
      lineHeight: '18px'
    {{/* live-refresh: watch the composition kinds so the % updates with the count Statistic */}}
    {{/* (which already watches) — keeps count + % consistent without a reload. Computed, not hardcoded. */}}
    watch: []
  widgetDataTemplate:
  - forPath: watch
    expression: '${ [ .list[] | { apiVersion: .av, kind: .kind } ] | unique }'
  - forPath: label
    {{/* Over the ASSESSABLE compositions, the same as the Healthy tag; computed in the RA. */}}
    expression: '${ (.assessment.pendingPercent | tostring) + "%" }'
  apiRef:
    name: compositions-list
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
