{{/* /dashboard: the platform's "needs you" inbox (root-pages UX, build plan §3.1; mockup screen 01).
     Top to bottom: the greeting header with Ask Agentiko and New composition; the trial banner and
     the first-run onboarding (each hides itself); the inbox body (filter bar, active filters, the
     strip, "Needs you" and the calm line, all from dashboard-inbox); and Recent changes from the
     audit trail. No table link: each card opens its page, and that page carries the table.

     The body is its own Flex so the header and banners paint without waiting for the inbox's reads.

     krateo.io/filter-keys names the URL params this page's widgets receive. scripts/lint-keyextras.py
     fails any widget reachable from here whose keyExtras misses one, because snowplow declines to
     cache a widget that receives an extra it does not declare (F6). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-dashboard
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Operations"
    "krateo.io/nav-icon": "fa-gauge"
    "krateo.io/nav-label": "Dashboard"
    "krateo.io/nav-order": "1"
    "krateo.io/nav-path": "/dashboard"
    "krateo.io/filter-keys": "projects,source"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, source]
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - listies
    - collapses
    vertical: true
    {{/* P9: page-root section rhythm is one step, `middle`, across every nav-declared root. */}}
    gap: middle
    items:
    - resourceRefId: dashboard-page-header
    {{/* Trial countdown: hides itself unless this Krateo is a trial (tenant-trial ConfigMap). */}}
    - resourceRefId: dashboard-trial
    {{/* First-run onboarding: hides itself once the user owns a composition. */}}
    - resourceRefId: onboarding-empty
    - resourceRefId: dashboard-inbox-body
    - resourceRefId: dashboard-recent-changes
  resourcesRefs:
    items:
    - id: dashboard-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: dashboard-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: dashboard-trial
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: dashboard-trial
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: onboarding-empty
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: onboarding-empty
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: dashboard-inbox-body
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: dashboard-inbox-body
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: dashboard-recent-changes
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: dashboard-recent-changes
      namespace: {{ $.Values.namespace }}
      resource: collapses
      verb: GET
