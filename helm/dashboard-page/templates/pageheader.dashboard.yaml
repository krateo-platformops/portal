{{/* The dashboard page header — the greeting, what it is showing, "Ask Agentiko →" and the create CTA, in one CR. */}}
{{/* */}}
{{/* Replaces SIX: row.header-row, flex.header-greeting-flex, flex.header-actions-flex, */}}
{{/* paragraph.greeting-eyebrow, paragraph.greeting-title and paragraph.greeting-subtitle. */}}
{{/* */}}
{{/* THIS DELETES THE LAST EYEBROW IN THE CHART. Paragraph.tsx returns null for `variant: eyebrow`, */}}
{{/* and its comment says the canonical source is the chart's *-eyebrow CRs — so the frontend hack */}}
{{/* could not go until the last CR did. With this one gone, it can. */}}
{{/* */}}
{{/* There is no range any more: the inbox is "now", and Recent changes keeps a fixed 7 days, so the */}}
{{/* subtitle is a literal and the header reads no RESTAction. */}}
{{/* */}}
{{/* The greeting keeps its frontend-resolved placeholders for the time of day and display name; */}}
{{/* those are substituted by the frontend, not by jq, and a PageHeader title renders through the */}}
{{/* same path a Paragraph did. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: dashboard-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Every widget on /dashboard receives the page's filter params (krateo.io/filter-keys on */}}
  {{/* page-dashboard); one it does not declare makes snowplow decline to cache it (F6). */}}
  keyExtras: [projects, source]
  widgetData:
    title: "Good {localTimeOfDay}, {displayName}"
    subtitle: Here's what's happening across your platform
    allowedResources:
    - buttons
    items:
    - resourceRefId: dashboard-ask-agentiko
    - resourceRefId: new-composition
  resourcesRefs:
    items:
    - id: dashboard-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: dashboard-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    {{/* SHELL-owned: the Button lives in helm/portal because BOTH this page and the
         other one use it, so neither page chart can own it. The shell is readable by
         anything holding the chrome grant, so the release namespace is correct here --
         and scripts/lint-ref-namespace.py CROSS_CHART records it as the exception. */}}
    - id: new-composition
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: new-composition
      namespace: {{ $.Release.Namespace }}
      resource: buttons
      verb: GET
