{{/* The calm line: one sentence for everything in view that is fine, from the sources that were read
     (a failed read says nothing here; its card says it failed). With nothing needing anyone it opens
     "All quiet:"; beside "Needs you" it opens "The rest is fine:", because "All quiet" next to open
     incidents would contradict the page. With no source in view it says why instead. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: dashboard-quiet
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, source]
  apiRef:
    name: dashboard-inbox
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
  - forPath: text
    expression: '${ . as $r | ([ (.sources // [])[] | select(.inView) ]) as $view | ([ $view[] | { key: .key, value: . } ] | from_entries) as $v | def ok($k): ($v[$k] != null) and ($v[$k].failed | not); def n($k; $one; $many): ($k | tostring) + " " + (if $k == 1 then $one else $many end); ([ (if ok("compositions") and $r.compositions.total > 0 then n($r.compositions.ready; "composition Ready"; "compositions Ready") else empty end), (if ok("alerts") and $r.alerts.total > 0 then n($r.alerts.ok; "alert OK"; "alerts OK") else empty end), (if ok("compositions") and (($r.compositions.blueprintsReady // 0) > 0) then n($r.compositions.blueprintsReady; "blueprint Ready"; "blueprints Ready") else empty end), (if ok("agents") and $r.agents.gatewayKnown and $r.agents.total > 0 then ($r.agents.registered | tostring) + " of " + n($r.agents.total; "agent"; "agents") + " registered at the gateway" else empty end), (if ok("incidents") and $r.incidents.open == 0 then "no open incident" else empty end), (if ok("reviews") and $r.reviews.waiting == 0 then "no proposal waiting for a decision" else empty end), (if ok("compositions") and $r.compositions.total == 0 then "no compositions yet" else empty end) ]) as $fine | (if ($r.sources // []) == [] then "None of the pages this inbox reads (Incidents, Alerts, Agents, Platform review, Compositions) is open to you." elif ($view | length) == 0 then "No source in this filter is in your inbox." elif ($fine | length) == 0 then "" elif any($view[]; .failed or .items > 0) then "The rest is fine: " + ($fine | join(" · ")) + "." else "All quiet: " + ($fine | join(" · ")) + "." end) }'
  resourcesRefs:
    items: []
