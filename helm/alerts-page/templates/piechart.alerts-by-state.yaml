{{/* The alerts by state, every alert, a slice per state that has any, coloured as the cards. */}}
kind: PieChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-by-state
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    angleField: count
    colorField: state
    colorMap:
      Firing: red
      Not evaluated: orange
      Pending: blue
      OK: green
    innerRadius: 60
    legend: true
    legendPosition: right
    height: 180
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ .byState // [] }'
  resourcesRefs:
    items: []
