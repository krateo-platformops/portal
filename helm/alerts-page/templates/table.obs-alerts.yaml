{{/* HyperDX alerts status — lists the Alert CRs (observability.krateo.io) with their live state, */}}
{{/* from restaction.obs-alerts. state is a filled Tag (status-pill spec): ALERT→red "Alert", */}}
{{/* PENDING→orange "Pending", OK→green "OK" ("OK" kept verbatim — it is the literal HyperDX state */}}
{{/* word, and "Ok"/"Healthy" would be prettier but less truthful). The numbers/threshold are the */}}
{{/* real alert config; state is mirrored from HyperDX by the reconciler. */}}
{{/* A paused alert (krateo.io/paused: "true") keeps its state word, suffixed "· paused", in gray. */}}
{{/* An alert with no HyperDX alert behind it reads "Not evaluated", in gray, whatever its last */}}
{{/* mirrored state: nothing evaluates it, so a "Pending" or "OK" there would be a claim nobody made. */}}
{{/* Incidents says whether a firing opens an incident: "Yes", or "No · metric" / "· value" / */}}
{{/* "· paused" in gray, off alert-provider's OpensIncidents condition. */}}
{{/* The ?status= chip above filters the rows server-side (obs-alerts). */}}
{{/* Lives on the /alerts rule catalog. Row click → the per-alert detail page */}}
{{/* /alerts/{namespace}/{name} (item 25); the "Investigate with Autopilot" ask flow the row used */}}
{{/* to own now rides that page's pagehead button (the seed is still built server-side, just one */}}
{{/* hop further in). Routed via routeNs/routeName cells (the CR's real identity, not displayName). */}}
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-alerts
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, status]
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    {{/* No-scroll: fit the columns to the width (a long description ellipsis-truncates, full text */}}
    {{/* on hover) instead of a horizontal scrollbar. */}}
    fitContent: true
    {{/* Row click → the ENRICHED per-alert detail page /alerts/{ns}/{name} (flex.page-alert-detail), */}}
    {{/* which carries the pagehead actions — Investigate with Autopilot · Edit · Delete — built off the */}}
    {{/* live CRD schema. NOT the generic /resources/{ns}/{group}/{version}/{plural}/{name} manifest view: */}}
    {{/* that shows the raw CR but none of those actions, which regressed feedback G ("see alert details */}}
    {{/* on open — not only 'diagnose with Autopilot'"). Matches this file's header + button.incident- */}}
    {{/* alert-link, which both route to /alerts/{ns}/{name}. */}}
    {{/* Route params ride in hidden routeNs/routeName cells (the CR's metadata.namespace/name, NOT the */}}
    {{/* emoji-bearing displayName); the Table URI-encodes each interpolated cell. */}}
    rowNavigateTo: /alerts/{routeNs}/{routeName}
    pagination:
      defaultPageSize: 10
    columns:
    - valueKey: name
      title: Alert
    {{/* Description gets a floor: it says what each alert catches, and under fitContent it would */}}
    {{/* otherwise be the first column to ellipsise. The short columns give up their slack instead. */}}
    - valueKey: description
      title: Description
      minWidth: 380
    - valueKey: threshold
      title: Threshold
      minWidth: 110
    - valueKey: interval
      title: Every
      minWidth: 80
    - valueKey: state
      title: State
      minWidth: 90
    {{/* Whether a firing opens an incident (obs-alerts' incidents): "Yes", or "No" with the reason */}}
    {{/* in a word, gray, so the alerts that never reach /incidents are told apart at a glance. */}}
    - valueKey: incidents
      title: Incidents
      minWidth: 120
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ [ (.rows // [])[] | [ {valueKey:"name",kind:"jsonSchemaType",type:"string",stringValue:.name}, {valueKey:"routeNs",kind:"jsonSchemaType",type:"string",stringValue:(.routeNs // "")}, {valueKey:"routeName",kind:"jsonSchemaType",type:"string",stringValue:(.routeName // "")}, {valueKey:"description",kind:"jsonSchemaType",type:"string",stringValue:(.description // "-")}, {valueKey:"threshold",kind:"jsonSchemaType",type:"string",stringValue:((.thresholdType // "") + " " + (.threshold // ""))}, {valueKey:"interval",kind:"jsonSchemaType",type:"string",stringValue:(.interval // "-"),color:"var(--gray-color)"}, {valueKey:"state",kind:"tag",stringValue:((if .evaluated == false then "Not evaluated" else ((.state // "PENDING") | if . == "ALERT" then "Alert" elif . == "PENDING" then "Pending" else . end) end) + (if (.paused // false) then " · paused" else "" end)),color:(if (.paused // false) or .evaluated == false then "gray" else ((.state // "PENDING") | if . == "ALERT" then "red" elif . == "PENDING" then "orange" elif . == "OK" then "green" else "gray" end) end)}, ({valueKey:"incidents",kind:"jsonSchemaType",type:"string",stringValue:(.incidents // "—")} + (if (.incidents // "—") == "Yes" then {} else {color:"var(--gray-color)"} end)) ] ] }'
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
