{{/* Convention page root for /alerts (IA incidents-deepdive D/4) — the alerting CONFIGURATION */}}
{{/* surface. Alert *rules* (thresholds/intervals/watching, incl. quiet OK ones) are config, not */}}
{{/* incidents, so they moved OFF the /incidents triage page to here. /incidents keeps only the */}}
{{/* firing signal (awaiting strip) + the per-alert investigation feed; this page owns the full */}}
{{/* rule catalog. Header + the obs-alerts rules table. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-alerts
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Observability"
    "krateo.io/nav-icon": "fa-bell"
    "krateo.io/nav-label": "Alerts"
    "krateo.io/nav-order": "13"
    "krateo.io/nav-path": "/alerts"
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - tables
    - listies
    - rows
    vertical: true
    gap: middle
    items:
    {{/* Title, subtitle and BOTH create routes in one CR — see pageheader.alerts. */}}
    - resourceRefId: alerts-page-header
    {{/* The summary band. "Is anything firing?" was answered by scanning a STATE column for a red */}}
    {{/* chip — workable at 8 rows, not at 30 — and two of the three counts (a rule evaluated by */}}
    {{/* NOTHING, an investigation that produced nothing) have no column at all. */}}
    - resourceRefId: alerts-stats
    - resourceRefId: obs-alerts
  resourcesRefs:
    items:
    - id: alerts-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: alerts-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-stats
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
    - id: obs-alerts
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-alerts
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
