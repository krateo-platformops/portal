{{/* /alerts (alerts dashboard, the incidents dashboard's layout, mockup A4). Top to bottom:
       - the header, with Ask Agentiko and New alert (no subtitle: the breadcrumb above it says
         where this is);
       - the time range (24h, 7d, 30d): the window of the incidents-opened chart and of "Most
         incidents";
       - the five figures: Firing, Not evaluated, Pending, OK, With open incidents;
       - one row: the alerts on the left two thirds (the state chips, Firing by default, then one
         card per alert, or with ?view=table the full table), the charts on the right third (by
         state, by signal, incidents opened, the alerts that opened the most).

     krateo.io/filter-keys names the URL params this page's widgets receive. scripts/lint-keyextras.py
     fails any widget reachable from here whose keyExtras misses one, because snowplow declines to
     cache a widget that receives an extra it does not declare (F6). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-alerts
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Observability"
    "krateo.io/nav-icon": "fa-bell"
    "krateo.io/nav-label": "Alerts"
    "krateo.io/nav-order": "13"
    "krateo.io/nav-path": "/alerts"
    "krateo.io/filter-keys": "projects,status,range,view"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view]
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - listies
    - rows
    vertical: true
    gap: middle
    items:
    - resourceRefId: alerts-page-header
    - resourceRefId: alerts-range-group
    - resourceRefId: alerts-stats
    - resourceRefId: alerts-main
  resourcesRefs:
    items:
    - id: alerts-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: alerts-range-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-range-group
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: alerts-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: alerts-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
