{{/* The /alerts page header — the title and both create routes, in one CR. No subtitle: the */}}
{{/* shell's breadcrumb (Observability / Alerts) sits above the title, and the figures say the rest. */}}
{{/* */}}
{{/* Replaces five: flex.alerts-header (a vertical Flex), paragraph.alerts-eyebrow, */}}
{{/* paragraph.alerts-title, paragraph.alerts-subtitle, and flex.alerts-header-actions (a */}}
{{/* justify:flex-end Flex wrapping the two buttons). The buttons themselves stay as Button CRs — */}}
{{/* they carry actions, which is their job; PageHeader only places them. */}}
{{/* */}}
{{/* THE EYEBROW IS GONE, and that is a deletion rather than a regression: `Paragraph.tsx` already */}}
{{/* returns null for `variant: eyebrow`, with a comment saying the canonical source is the chart's */}}
{{/* `*-eyebrow` CRs and that returning null "avoids touching the cluster". This CR is the cluster */}}
{{/* being touched, so the frontend hack can eventually go too. P2 — the title names the page; the */}}
{{/* eyebrow restated the nav. */}}
{{/* */}}
{{/* `counter` is deliberately unset here. The alert count belongs to the stats band below, which */}}
{{/* shows firing-vs-quiet — a bare total beside the title would be a third place the same number */}}
{{/* lives. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Every widget on /alerts receives the page's params (krateo.io/filter-keys on
       page-alerts); one it does not declare makes snowplow decline to cache it (F6). */}}
  keyExtras: [projects, status, range, view, q]
  widgetData:
    title: Alerts
    allowedResources:
    - buttons
    {{/* Right-aligned by the widget, so the page composition no longer needs a justify:flex-end */}}
    {{/* wrapper to place them. `alerts-new` is the page's primary, and P6 allows exactly one. */}}
    items:
    {{/* Two buttons (Diego, 2026-11-14, after the live check): "Ask Agentiko →" and "New alert". There */}}
    {{/* were three, but design rule A4 labels every Agentiko entry point "Ask Agentiko →", so the */}}
    {{/* conversational create route arrived as a second, identical button nobody could tell apart. Its */}}
    {{/* prompt moved into Ask's (obs-alerts viewAskHref), which now also offers to author a new alert. */}}
    - resourceRefId: alerts-ask-agentiko
    - resourceRefId: alerts-new
  resourcesRefs:
    items:
    - id: alerts-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    - id: alerts-new
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-new
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
