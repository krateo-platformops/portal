{{/* Search: an alert's display name, name and description, case-insensitive, written to ?q= on Enter
     (not per keystroke, hence the placeholder) and removed when cleared. obs-alerts applies it as
     one more filter, so the facet counts follow it. */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-search
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, signal, hasIncidents, q, view]
  widgetData:
    name: q
    queryParam: q
    placeholder: Search alerts · press Enter
    allowClear: true
    size: small
  resourcesRefs:
    items: []
