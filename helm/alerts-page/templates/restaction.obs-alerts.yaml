{{/* /alerts data source (alerts dashboard, the incidents dashboard's layout, mockup A4): the Krateo
     Alert CRs (observability.krateo.io), read through the apiserver as the caller, and the Incidents
     in the same namespace, read as the caller too, for each alert's unresolved incidents and the
     incidents it opened in the range.

     THE PARAMS. The state is the page's one filter:
       status  alert (Firing), not-evaluated, pending, ok, all, or open-incidents (not a state: the
               alerts, in any state, with an unresolved incident; nothing when the incidents could not be
               read). Absent, it is alert: the page opens on what is firing. Read case-insensitively;
               a value that is no state matches nothing, and the chips are still drawn so the reader
               can pick another. An alert with no HyperDX alert behind it is not-evaluated, whatever
               .status.state says;
       range   24h, 7d (absent) or 30d: the window of the incidents-opened chart and of "Most
               incidents";
       view    `table`: the full table instead of the cards;
       q       the search: an alert whose name, description, signal type or resource name contains
               it (case-insensitive) is kept, every other one is left out of the whole page (the
               chips, the figures, the donuts), as on /compositions. The incident charts are about
               incidents and are not searched.

     OUTPUT.
       rows      the alerts in the picked state, triage order then by name: name, routeName/routeNs
                 (the row link), description, threshold, interval, state, stateKey, stateLabel,
                 type, incidents (the Incidents column, off the OpensIncidents condition: "Yes",
                 "No · <why>", "—"), openIncidents, okSince, stateSince and stateSinceUtc (when the
                 state last changed, alert-provider 0.2.83; "" when the provider has not written it),
                 foot (the card's footer: since when, and how often it is evaluated);
       counts    per state, over every alert (the chips, the donut, the figures);
       stats     Firing, Not evaluated, Pending, OK, With unresolved incidents; a failed read is "—". Each
                 tile's tone is the state it counts, so it wears the colour the cards give that
                 state (With unresolved incidents: the cards' red incident mark); `unread` on a failed read.
                 route: each tile opens the list filtered to what it counts, the same route as its
                 chip (With unresolved incidents: ?status=open-incidents); "" (not clickable) on a failed read;
       chips / viewChips / rangeChips   each a label, a count where it has one, active, and the
                 route that keeps the other params; the state chips end with With unresolved incidents
                 (left out while the incidents could not be read);
       byState / bySignal   the donuts;
       incidentTrend   incidents opened per hour (24h) or per day (7d, 30d), ending now;
       topIncidents    the five alerts that opened the most incidents in the range;
       failed / readError, incidentsFailed;
       viewAskHref  "Ask Agentiko →": a prompt about the alerts on screen that also offers to author a
                    new alert, keeping every param. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: obs-alerts
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: alerts
      path: /apis/observability.krateo.io/v1alpha1/namespaces/{{ $.Release.Namespace }}/alerts
      verb: GET
      continueOnError: true
      errorKey: alertsError
    {{/* An Incident is ~26 KB; this keeps three strings of each, so the filter below never holds */}}
    {{/* the analysis text. */}}
    - name: incidents
      path: /apis/observability.krateo.io/v1alpha1/namespaces/{{ $.Release.Namespace }}/incidents
      verb: GET
      continueOnError: true
      errorKey: incidentsError
      filter: '[ (.incidents.items // [])[] | { alert: ((.metadata.labels // {})["observability.krateo.io/alert"] // .spec.alertRef.name // ""), state: (.status.state // "Analyzing"), at: (.spec.triggeredAt // .metadata.creationTimestamp // "") } ]'
  filter: |
    def errtext: if . == null then "" elif type == "array" then map(if type == "object" then (.message // tojson) else tostring end) | join("; ") elif type == "object" then (.message // tojson) else tostring end;
    # fromdateiso8601 takes `...SSZ` only: drop a fractional part and fold a +00:00 offset to Z.
    # status.stateSince (alert-provider 0.2.83; RFC 3339): when .status.state last CHANGED, never moved
    # by a re-read. Normalized to UTC whatever offset it carries, and shown as the page shows a time
    # ("2026-11-14 08:22 UTC"). "" when absent, empty or unparseable: an alert already firing before
    # 0.2.83 (until its next transition) or a cluster on an older provider. Nothing stands in for it,
    # not stateObservedAt (the last observation) and not now: the card says "since: unknown".
    def utcstamp:
      if type != "string" or . == "" then ""
      else (capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})[Tt ](?<t>[0-9]{2}:[0-9]{2}:[0-9]{2})(\\.[0-9]+)?(?<z>[Zz]|(?<sg>[+-])(?<oh>[0-9]{2}):?(?<om>[0-9]{2}))$")? // null) as $m
        | if $m == null then ""
          else ((($m.d + "T" + $m.t + "Z") | fromdateiso8601?) // null) as $local
          | if $local == null then ""
            else ($local - (if ($m.sg // "") == "" then 0
                            else (if $m.sg == "-" then -1 else 1 end) * (($m.oh | tonumber) * 3600 + ($m.om | tonumber) * 60) end))
                 | strftime("%Y-%m-%d %H:%M UTC") end end end;
    def epoch: (if type == "string" then (sub("\\.[0-9]+"; "") | sub("(\\+00:?00)$"; "Z")) else "" end) | (fromdateiso8601? // null);
    . as $in
    # Triage order: the order of the chips, the donut, the figures and the cards.
    | [ "alert", "not-evaluated", "pending", "ok" ] as $keys
    | { alert: "Firing", "not-evaluated": "Not evaluated", pending: "Pending", ok: "OK" } as $stateNames
    | ((($in.status // "") | tostring | ascii_downcase) | if . == "" then "alert" else . end) as $sel
    | ((($in.range // "") | tostring) | if IN("24h", "30d") then . else "7d" end) as $range
    | ({ "24h": 86400, "7d": 604800, "30d": 2592000 }[$range]) as $window
    | ({ "24h": "the last 24 hours", "7d": "the last 7 days", "30d": "the last 30 days" }[$range]) as $rangeText
    | ((($in.view // "") | tostring) == "table") as $tableView
    | ((.projects // "") | tostring) as $projects
    | (($in.q // "") | tostring | sub("^\\s+"; "") | sub("\\s+$"; "")) as $qRaw
    | ($qRaw | ascii_downcase) as $q
    # The params every link on the page carries, in the page's order; one is set by each link.
    | def href($status; $rng; $view):
        [ (if $projects != "" then "projects=" + ($projects | @uri) else empty end),
          (if $status != "alert" then "status=" + ($status | @uri) else empty end),
          (if $rng != "7d" then "range=" + $rng else empty end),
          (if $view then "view=table" else empty end),
          (if $qRaw != "" then "q=" + ($qRaw | @uri) else empty end) ]
        | if length == 0 then "/alerts" else "/alerts?" + join("&") end;
      (.incidentsError != null) as $incidentsFailed
    | ((.incidents // []) | if type == "array" then . else [] end) as $incidents
    | ([ $incidents[] | select(.state != "Resolved" and .state != "Closed") | .alert ]
       | group_by(.) | map({ key: .[0], value: length }) | from_entries) as $openBy
    | now as $now
    | ([ ((.alerts.items) // [])[] | {
        name: (.spec.displayName // .metadata.name // ""),
        # A namespace-scoped list omits .metadata.namespace per item and snowplow does not
        # backfill it, so the release namespace just listed stands in.
        routeName: (.metadata.name // ""),
        routeNs: (.metadata.namespace // "{{ $.Release.Namespace }}"),
        description: .spec.description,
        threshold: ((.spec.threshold // 0) | tostring),
        interval: (.spec.interval // ""),
        thresholdType: (.spec.thresholdType // ""),
        state: (.status.state // "PENDING"),
        # An Alert with no HyperDX alert behind it is evaluated by nothing, whatever .status.state
        # last said: it was just created, HyperDX refused it, or the provider released a shared one.
        evaluated: (((.status.hyperdxAlertId) // "") != ""),
        paused: (((.metadata.annotations // {})["krateo.io/paused"] // "") == "true"),
        type: (.status.type // ""),
        okSince: (.status.okSince // ""),
        stateSince: (.status.stateSince // ""),
        stateSinceUtc: ((.status.stateSince // "") | utcstamp),
        openIncidents: (if $incidentsFailed then null else ($openBy[.metadata.name // ""] // 0) end),
        opens: ([ (.status.conditions // [])[] | select(.type == "OpensIncidents") ] | .[0] // {})
      } | .stateKey = (if .evaluated then (.state | ascii_downcase) else "not-evaluated" end)
        | .stateLabel = (($stateNames[.stateKey] // .state) + (if .paused then " · paused" else "" end))
        # The card's colour: the state's, gray while paused.
        | .tone = (if .paused then "paused" else .stateKey end)
        | .opensNone = (.opens.status == "False")
        # The reason in a word: an aggregated Alert is a metric or a value read from rows.
        | .incidents = (if .opens.status == "True" then "Yes"
            elif .opens.status == "False" then "No" + ({ AggregatedValue: (if .type == "Metric" then " · metric" else " · value" end),
                                                         Paused: " · paused",
                                                         OutsideHomeNamespace: " · other namespace" }[.opens.reason // ""] // "")
            else "—" end)
        | del(.opens)
        | .foot = ((if .stateKey == "alert" then (if .stateSinceUtc != "" then "Firing since " + .stateSinceUtc else "since: unknown" end)
                    elif .stateKey == "ok" and ((.okSince | utcstamp) != "") then "OK since " + (.okSince | utcstamp)
                    else "" end) as $s
                   | ([ $s, (if .interval != "" then "every " + .interval else empty end) ] | map(select(. != "")) | join(" · ")))
        | .incidentIcon = (if (.openIncidents // 0) > 0 then "fa-triangle-exclamation" else "" end)
        | .incidentTip = (if (.openIncidents // 0) == 1 then "1 unresolved incident" elif (.openIncidents // 0) > 1 then (.openIncidents | tostring) + " unresolved incidents" else "" end)
        | .stateKey as $sk | .order = (($keys | index($sk)) // 9) ]
      | sort_by(.order, .name)) as $allRows
    | ($allRows | map(select($q == "" or ([ .name, (.description // ""), .type, .routeName ] | map(tostring | ascii_downcase) | any(contains($q)))))) as $rows
    | ($rows | map(select($sel == "all" or .stateKey == $sel or ($sel == "open-incidents" and (.openIncidents // 0) > 0)))) as $shown
    | ((.alertsError // null) | errtext) as $err
    | ($err != "") as $failed
    | ($keys | map(. as $k | { key: $k, value: ([ $rows[] | select(.stateKey == $k) ] | length) }) | from_entries + { all: ($rows | length) }) as $counts
    | ([ $rows[] | select((.openIncidents // 0) > 0) ]) as $withOpen
    # Each tile routes as its chip does (href, every other param kept).
    | [ { title: "Firing", value: ($counts.alert | tostring), caption: (if $counts.alert > 0 then "of " + ($counts.all | tostring) + " alerts" else "" end), tone: "alert", route: href("alert"; $range; $tableView) },
        { title: "Not evaluated", value: ($counts["not-evaluated"] | tostring), caption: (if $counts["not-evaluated"] > 0 then "no HyperDX alert behind it" else "" end), tone: "not-evaluated", route: href("not-evaluated"; $range; $tableView) },
        { title: "Pending", value: ($counts.pending | tostring), caption: (if $counts.pending > 0 then "not decided yet" else "" end), tone: "pending", route: href("pending"; $range; $tableView) },
        { title: "OK", value: ($counts.ok | tostring), caption: "", tone: "ok", route: href("ok"; $range; $tableView) },
        (if $incidentsFailed then { title: "With unresolved incidents", value: "", caption: "the incidents could not be read", tone: "unread", route: "" }
         else { title: "With unresolved incidents", value: ($withOpen | length | tostring),
                caption: (([ $withOpen[] | .openIncidents ] | add // 0) as $n | if $n == 0 then "" else ($n | tostring) + " not resolved" end), tone: "incident",
                route: href("open-incidents"; $range; $tableView) } end) ]
      | map(if $failed then { title, value: "", caption: "could not be read", tone: "unread", route: "" } else . end) as $stats
    # INCIDENTS OPENED, per bucket over the range, the newest bucket the current hour or day.
    | (if $range == "24h" then { size: 3600, n: 24, unit: "hour" } elif $range == "30d" then { size: 86400, n: 30, unit: "day" } else { size: 86400, n: 7, unit: "day" } end) as $b
    | ((($now / $b.size) | floor) * $b.size - ($b.n - 1) * $b.size) as $start
    | ([ $incidents[] | { alert, t: (.at | epoch) } | select(.t != null and .t >= $start) ]) as $inRange
    | ([ $inRange[] | ((.t - $start) / $b.size | floor) ]) as $openedB
    | ([ range(0; $b.n) as $i | { t: ($start + $i * $b.size), series: "Incidents opened", v: ([ $openedB[] | select(. == $i) ] | length) } ]) as $incidentTrend
    | ($allRows | map({ key: .routeName, value: { name, href: ("/alerts/" + .routeNs + "/" + .routeName) } }) | from_entries) as $byRoute
    | ([ $inRange | group_by(.alert)[] | { alert: .[0].alert, count: length } ] | sort_by(-.count, .alert) | .[0:5]) as $top
    | (([ $top[] | .count ] | max) // 1) as $topMax
    | ([ $top[] | ($byRoute[.alert] // null) as $r
         | { name: (if $r != null then $r.name elif .alert != "" then .alert else "(no alert)" end),
             count: (.count | tostring), percent: ((.count * 100 / $topMax) | round),
             href: (if $r != null then $r.href else "" end) } ]) as $topIncidents
    # "Ask Agentiko →" (button.alerts-ask-agentiko) describes the alerts on screen and keeps every
    # param. A failed read of the alerts is asked about, never described as a quiet platform; an
    # unread incident list is said, never "no unresolved incidents".
    | ([ (if $sel == "all" then empty elif $sel == "open-incidents" then "With unresolved incidents" else "State: " + ($stateNames[$sel] // $sel) end),
         (if $qRaw != "" then "Search: \"" + $qRaw + "\"" else empty end) ] | join(", ")) as $desc
    | ([ $shown[] | select(.stateKey == "ok" and (.openIncidents // 0) > 0) ] | sort_by(-.openIncidents, .name)) as $okOpen
    | ([ $shown[] | select(.stateKey == "ok" and ((.okSince | epoch) as $t | $t != null and ($now - $t) < 86400)) ]) as $back
    | def names($l): [ $l[0:8][] | .name + (if (.openIncidents // 0) > 0 then " (" + (.openIncidents | tostring) + " unresolved)" else "" end) ] | join(", ");
      def n($k; $one; $many): ($k | tostring) + " " + (if $k == 1 then $one else $many end);
      ([ $shown[] | select(.stateKey == "alert") ]) as $firing
    | ((if $failed then
         "The observability alerts on this page could not be read (" + $err + "). Explain what that error means and what to check."
       elif ($shown | length) == 0 then
         (if $desc != "" then "No alert is in the view on screen (" + $desc + "); " + n($rows | length; "alert is"; "alerts are") + " outside it. Tell me whether anything among them needs attention."
          else "There are no observability alerts on this platform. Explain what I should alert on first, given what runs here." end)
       else
         "Review my observability alerts" + (if $desc != "" then " in the view on screen (" + $desc + ")" else "" end) + ": "
         + n($shown | length; "alert"; "alerts") + " — " + ($firing | length | tostring) + " firing, "
         + ($back | length | tostring) + " back to OK in the last 24 hours, "
         + (if $incidentsFailed then "and the incidents could not be read, so which have unresolved incidents is unknown."
            else ([ $shown[] | select((.openIncidents // 0) > 0) ] | length | tostring) + " with unresolved incidents ("
                 + n([ $shown[] | .openIncidents // 0 ] | add // 0; "incident"; "incidents") + " between them)." end)
         + (if ($firing | length) > 0 then " Firing now: " + names($firing) + "." else "" end)
         + (if ($back | length) > 0 then " Back to OK: " + names($back) + "." else "" end)
         + (if ($okOpen | length) > 0 then " OK but still with unresolved incidents: " + names($okOpen) + "." else "" end)
         + " Tell me which alert to look at first and why, whether any of them is noisy or mis-tuned, and the next step for each — grounded in the evidence on this page."
       end)
       # One Ask button on the header (Diego, 2026-11-14): the alert-authoring route that used to be a
       # second, identically labelled "Ask Agentiko →" button is offered here instead. Not on a failed read.
       + (if $failed then "" else " If I want a new alert instead, help me author it: what to watch (the telemetry query), the threshold and comparison, and the evaluation interval, then create it once I confirm." end)) as $viewPrompt
    | {
        rows: $shown,
        matched: ($shown | length),
        total: ($rows | length),
        status: $sel,
        q: $qRaw,
        range: $range,
        view: (if $tableView then "table" else "" end),
        counts: $counts,
        stats: $stats,
        chips: (([ ($keys[] | { key: ., label: $stateNames[.] }), { key: "all", label: "All" } ]
                 | map({ label, count: ($counts[.key] // 0), active: (.key == $sel), route: href(.key; $range; $tableView) }))
                + (if $incidentsFailed then []
                   else [ { label: "With unresolved incidents", count: ($withOpen | length), active: ($sel == "open-incidents"), route: href("open-incidents"; $range; $tableView) } ] end)),
        viewChips: [ { label: "Summary", active: ($tableView | not), route: href($sel; $range; false) },
                     { label: "Full list", active: $tableView, route: href($sel; $range; true) } ],
        rangeChips: ([ "24h", "7d", "30d" ] | map({ label: ., active: (. == $range), route: href($sel; .; $tableView) })),
        byState: (if $failed then [] else [ $keys[] | { state: $stateNames[.], count: $counts[.] } | select(.count > 0) ] end),
        bySignal: (if $failed then [] else [ $rows | group_by(.type)[] | { signal: (if .[0].type == "" then "Unknown" else .[0].type end), count: length } ] | sort_by(-.count, .signal) end),
        incidentTrend: (if $incidentsFailed then [] else $incidentTrend end),
        trendUnit: $b.unit,
        rangeText: $rangeText,
        topIncidents: (if $incidentsFailed then [] else $topIncidents end),
        incidentsFailed: $incidentsFailed,
        failed: $failed,
        readError: $err,
        projects: $projects,
        viewAskHref: (href($sel; $range; $tableView) as $h | $h + (if ($h | contains("?")) then "&" else "?" end) + "ask=" + ($viewPrompt | @uri))
      }
