{{/* /alerts data source — the Krateo Alert CRs (observability.krateo.io), read through the apiserver */}}
{{/* as the caller, shaped server-side: */}}
{{/* rows     : one per Alert, filtered by the ?status= chip (extras). state is the live HyperDX */}}
{{/*            state (OK / ALERT / PENDING) the alert-provider mirrors into .status.state; stateKey */}}
{{/*            is the chip it falls under. routeName/routeNs are the CR's own identity, for the row */}}
{{/*            link to /alerts/{namespace}/{name}. */}}
{{/* counts   : per-chip totals over the full set, so every chip shows its live count. */}}
{{/* status   : the chip in force, for the chips' active flag. */}}
{{/* projects : echo of the shell scope param, so the chips can carry it into their routes. */}}
{{/* askHref  : the header's "Ask Agentiko →" link, seeded with the alert-authoring flow. It keeps */}}
{{/*            the chip and the scope, so opening the rail does not reset the view. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: obs-alerts
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: alerts
      path: /apis/observability.krateo.io/v1alpha1/namespaces/{{ $.Release.Namespace }}/alerts
      verb: GET
      continueOnError: true
      errorKey: alertsError
  filter: |
    (.status // "all" | tostring | ascii_downcase) as $sel
    | ((.projects // "") | tostring) as $projects
    | [ "alert", "ok", "pending", "not-evaluated" ] as $keys
    | ([ ((.alerts.items) // [])[] | {
        name: (.spec.displayName // .metadata.name // ""),
        # A namespace-scoped list omits .metadata.namespace per item and snowplow does not
        # backfill it, so the release namespace just listed stands in.
        routeName: (.metadata.name // ""),
        routeNs: (.metadata.namespace // "{{ $.Release.Namespace }}"),
        description: .spec.description,
        threshold: ((.spec.threshold // 0) | tostring),
        interval: (.spec.interval // ""),
        thresholdType: (.spec.thresholdType // ""),
        state: (.status.state // "PENDING"),
        # An Alert with no HyperDX alert behind it is evaluated by nothing, whatever .status.state
        # last said: it was just created, HyperDX refused it, or the provider released a shared one.
        evaluated: (((.status.hyperdxAlertId) // "") != ""),
        paused: (((.metadata.annotations // {})["krateo.io/paused"] // "") == "true")
      } | .stateKey = (if .evaluated then (.state | ascii_downcase) else "not-evaluated" end) ]) as $rows
    # A ?status= that is no chip shows no rows, as on /incidents, and the link drops it.
    | ($keys | any(. == $sel)) as $filtered
    | {
        rows: (if $sel == "all" then $rows else [ $rows[] | select(.stateKey == $sel) ] end),
        counts: ({ all: ($rows | length) }
          + ($keys | map({ key: ., value: (. as $k | [ $rows[] | select(.stateKey == $k) ] | length) }) | from_entries)),
        status: $sel,
        projects: $projects,
        askHref: ("/alerts?"
          + ([ (if $filtered then "status=" + $sel else empty end),
               (if $projects != "" then "projects=" + ($projects | @uri) else empty end) ] | map(. + "&") | join(""))
          + "ask=" + ("I want to create a new observability alert. Help me define what to watch (the telemetry query), the threshold and comparison, and the evaluation interval, then create it once I confirm." | @uri))
      }
