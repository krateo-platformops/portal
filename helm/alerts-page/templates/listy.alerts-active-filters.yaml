{{/* The applied filters as chips: one per picked value ("State: Alert", "Signal: Logs"), each
     removing itself, then "Clear all", which keeps only the shell's ?projects. Hidden when nothing
     is applied. The search box clears itself. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-active-filters
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, signal, hasIncidents, q, view]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    hideWhenEmpty: true
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{href}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .chips // [] }'
  resourcesRefs:
    items: []
