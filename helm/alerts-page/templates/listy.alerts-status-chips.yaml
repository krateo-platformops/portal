{{/* The state chips, the page's filter: Firing (the default), Not evaluated, Pending, OK, All,
     each with its count over every alert, then With unresolved incidents (alerts in any state with an
     unresolved incident; left out while the incidents could not be read). Each route keeps ?range, ?view,
     ?q and the ?projects= scope. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-status-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .chips // [] }'
  resourcesRefs:
    items: []
