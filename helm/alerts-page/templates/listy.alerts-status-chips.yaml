{{/* Alert state filter chips (All · Alert · OK, plus Pending and Not evaluated while any alert is in */}}
{{/* them) as one data-driven Listy(chip). The state is URL state (?status=…): each chip navigates to */}}
{{/* /alerts?status=<k>, which reaches obs-alerts as an extra; the RESTAction filters `.rows` and */}}
{{/* echoes `.status` + `.counts` (over the full set), so every chip shows its live count and active */}}
{{/* flag. Not evaluated (an alert with no HyperDX alert behind it) appears only when there is one: */}}
{{/* it is the one chip that means something is broken. The shell scope (?projects) is carried into */}}
{{/* each chip's route. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-status-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell — `status` drives */}}
  {{/* the active flag, `projects` is carried into the routes. */}}
  keyExtras: [projects, status]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ ((.status // "all") | tostring) as $sel | (.counts // {}) as $counts | ((.projects // "") | tostring) as $projects | (if $projects != "" then ("&projects=" + ($projects | @uri)) else "" end) as $carry | [{key: "all", label: "All", always: true}, {key: "alert", label: "Alert", always: true}, {key: "ok", label: "OK", always: true}, {key: "pending", label: "Pending", always: false}, {key: "not-evaluated", label: "Not evaluated", always: false}] | map(select(.always or (($counts[.key] // 0) > 0) or (.key == $sel))) | map({label: .label, count: ($counts[.key] // 0), active: (.key == $sel), route: ("/alerts?status=" + .key + $carry)}) }'
  resourcesRefs:
    items: []
