{{/* The alerts in view, grouped by what they need (mockup screen 07; decisions of 2026-11-14). A card
     per alert, at most six a group, then "See all N →" to the table filtered to that group (Q1):
       - Firing (red): firing now, with its open incidents. The Alert CR records no time it started
         firing (only stateObservedAt, the last observation), so the card claims none;
       - Not evaluated (orange): no HyperDX alert behind it, so nothing evaluates it;
       - Pending: HyperDX has not decided yet;
       - Back to OK in the last 24 hours: newest first, with when (okSince) and any open incidents;
       - OK, with open incidents: most open incidents first;
       - OK: the rest, folded, one card per signal (Logs, Metric, Traces), each opening the table
         of that signal's OK alerts.
     A card says "No incidents" when the alert opens none (a metric or a value), and opens the alert.
     Every group but OK starts open. */}}
kind: Collapse
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-groups
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, signal, hasIncidents, q, view]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    defaultActiveKey: []
    grid: { gutter: 16, xs: 1, sm: 1, md: 2, lg: 3, xl: 3, xxl: 3 }
    itemTemplate:
      rowVariant: card
      primaryText: '{title}'
      secondaryText: '{tag}'
      description: '{body}'
      subSecondaryText: '{foot}'
      cardCta: '{cta}'
      navigateTo: '{href}'
      color:
        value: '{tone}'
        map:
          bad: red
          warn: orange
    items: []
  widgetDataTemplate:
  - forPath: defaultActiveKey
    expression: '${ [ ("firing", "notEvaluated", "pending", "backToOk", "okOpen") as $k | select(((.groups // {})[$k] // []) | length > 0) | $k ] }'
  - forPath: items
    expression: '${ . as $r | def n($k; $one; $many): ($k | tostring) + " " + (if $k == 1 then $one else $many end); def opened: if .openIncidents == null then "Its incidents could not be read." elif .openIncidents == 0 then "No open incident." else n(.openIncidents; "open incident"; "open incidents") + "." end; def card($tag; $tone; $foot): { title: .name, tag: (if .opensNone and $tag == "" then "No incidents" else $tag end), tone: $tone, body: opened, foot: $foot, cta: "Open", href: ("/alerts/" + .routeNs + "/" + .routeName) }; def every: .routeName + (if .type != "" then " · " + .type else "" end) + (if (.interval // "") != "" then " · every " + .interval else "" end); def okat: "OK since " + ((.okSince // "") | .[0:10] + " " + .[11:16]) + " UTC"; def panel($k; $label; $status; $extra; cards; $href): ((($r.groups // {})[$k]) // []) as $m | if ($m | length) == 0 then empty else { key: $k, label: $label, count: ($m | length), extra: $extra, dataSource: [ $m[0:6][] | cards ] } + (if $status != "" then { status: $status } else {} end) + (if ($m | length) > 6 then { footer: ("See all " + ($m | length | tostring) + " →"), footerNavigateTo: $href } else {} end) end; [ panel("firing"; "Firing"; "error"; "firing now"; card("Alert"; "bad"; every); ($r.stateTableHrefs.alert // "/alerts")), panel("notEvaluated"; "Not evaluated"; "warning"; "no HyperDX alert evaluates it"; card("Not evaluated"; "warn"; every); ($r.stateTableHrefs["not-evaluated"] // "/alerts")), panel("pending"; "Pending"; ""; "not decided yet"; card(""; ""; every); ($r.stateTableHrefs.pending // "/alerts")), panel("backToOk"; "Back to OK in the last 24 hours"; ""; "newest first"; card(""; ""; (okat + " · " + every)); ($r.stateTableHrefs.ok // "/alerts")), panel("okOpen"; "OK, with open incidents"; ""; "most open incidents first"; card(""; ""; (okat + " · " + every)); ($r.groups.okOpenHref // "/alerts")) ] + ((($r.groups.okBySignal // [])) as $s | if ($s | length) == 0 then [] else [ { key: "ok", label: "OK", count: ([ $s[] | .count ] | add), extra: "by signal", dataSource: [ $s[] | { title: .signal, tag: "", tone: "", body: ((.names | join(", ")) + (if .count > 3 then " and " + ((.count - 3) | tostring) + " more" else "" end)), foot: (n(.count; "alert"; "alerts") + " · OK, no open incident"), cta: ("See all " + (.count | tostring)), href: .href } ] } ] end) }'
  resourcesRefs:
    items: []
