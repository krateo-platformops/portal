{{/* The range chips (24h, 7d, 30d; 7d when ?range is absent). Each route keeps ?status, ?view and
     the ?projects= scope; obs-alerts builds them. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-range-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .rangeChips // [] }'
  resourcesRefs:
    items: []
