{{/* "Author with Autopilot" — the second way to create an alert, promoted into the header beside */}}
{{/* "New alert". */}}
{{/* */}}
{{/* It used to live at the BOTTOM of the page as listy.alerts-hint, described in the page as an */}}
{{/* "empty-state hint (shown only while zero alerts exist)". That description was wrong: the RA emits */}}
{{/* `hint` as an unconditional one-item list, so `hideWhenEmpty` never fires and the block rendered on */}}
{{/* every visit — permanent chrome, below the table, as far from the other create route as the layout */}}
{{/* allows. Two ways to do the same thing, separated by the whole page. */}}
{{/* */}}
{{/* `default`, not `primary`: the form is the main route and describing an alert in prose is the */}}
{{/* alternative, so they should not compete. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-author-autopilot
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the link keeps the chip and the scope, so the same keys as the table. */}}
  keyExtras: [projects, status]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    {{/* A4: the canonical label. This CTA was authored before that decision landed and arrived as a */}}
    {{/* FOURTH variant ("Author with Autopilot") in the same merge window that unified the other six — */}}
    {{/* which is the drift the rule exists to stop, reproducing itself while the fix was in flight. */}}
    {{/* A4: every agent entry point is the same object — a button (never a link) labelled */}}
    {{/* "Ask Agentiko →" with `intent: agentiko`. The intent draws it filled with the Agentiko */}}
    {{/* gradient and mark (outlined with a lock when the agent is not licensed) and ignores */}}
    {{/* type/icon/color, so those are not set here. (Until 2026-11-09: type: primary and the wand, */}}
    {{/* spelled out per CR.) The arrow says the button takes you into the agent rail. Enforced by */}}
    {{/* the design lint (autopilot-button). */}}
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: author-alert
    actions:
      navigate:
        - id: author-alert
          path: /alerts
          type: navigate
  widgetDataTemplate:
    {{/* The seed is built server-side by the action (same shape as the alert-detail askHref) and used */}}
    {{/* VERBATIM as a navigate path — a Button path is not re-encoded, so it must arrive pre-encoded. */}}
    - forPath: actions
      expression: >-
        ${ { navigate: [ { id: "author-alert", type: "navigate", path: (.askHref // "/alerts") } ] } }
  resourcesRefs:
    items: []
