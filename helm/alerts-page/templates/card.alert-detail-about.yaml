{{/* Frame for alert-detail-about. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-detail-about-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    variant: outlined
    title: About this alert
    items:
    - resourceRefId: alert-detail-about
  resourcesRefs:
    items:
    - id: alert-detail-about
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-about
      namespace: {{ $.Values.namespace }}
      resource: markdowns
      verb: GET
