{{/* "By state": the alerts in each state, as a donut (piechart.alerts-by-state). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-by-state-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view]
  widgetData:
    title: "By state"
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - piecharts
    items:
    - resourceRefId: alerts-by-state
  resourcesRefs:
    items:
    - id: alerts-by-state
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-by-state
      namespace: {{ $.Values.namespace }}
      resource: piecharts
      verb: GET
