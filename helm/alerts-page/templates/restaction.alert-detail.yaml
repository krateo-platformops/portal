{{/* Data source for ONE Alert CR — /alerts/{namespace}/{name} (route params ride in as */}}
{{/* ?extras .name/.namespace, same mechanism as composition-detail / incident-detail). */}}
{{/* Two reads, both continueOnError so a missing/RBAC-blocked read degrades honestly: */}}
{{/* alert   : the per-name Alert CR (observability.krateo.io) — its rule config lives in */}}
{{/* .spec (displayName / description / where / threshold+thresholdType / interval) */}}
{{/* and its live HyperDX-mirrored state in .status (state / phase */}}
{{/* / hyperdxAlertId / hyperdxDashboardId), reconciled by krateo-alert-provider. */}}
{{/* incidents : the alert namespace's Incidents — this alert's are the ones labelled */}}
{{/* observability.krateo.io/alert: <name>. Several can be open at once, one per problem, so */}}
{{/* the page lists every open one, then the latest ended ones. */}}
{{/* Everything is derived server-side (nothing-hardcoded): */}}
{{/* the State tag label+colour (ALERT→red/PENDING→orange/OK→green — palette: green=health, so */}}
{{/* the healthy quiet state OK reads green), the "above N" threshold prose, the */}}
{{/* Autopilot seed sentence (the "Investigate with Autopilot" button on the detail page), and */}}
{{/* the HyperDX console deep-links (built only when the deployer set .Values.observabilityConsoleUrl */}}
{{/* AND the reconciler recorded the id — no default URL is invented, so the link is simply */}}
{{/* absent otherwise; same honesty as button.obs-console-link). */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: alert-detail
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{/* Both paths are `${ jq }` expressions over the ?extras (route params) — the ONLY templating */}}
    {{/* snowplow applies to api[].path (same as composition-detail / resource-detail). It does NOT */}}
    {{/* substitute `{name}`-style brace placeholders: the former literal `.../alerts/{name}` reached */}}
    {{/* the apiserver verbatim (`alerts.observability.krateo.io "{name}" not found`), the read */}}
    {{/* degraded via continueOnError and EVERY alert rendered the honest-empty branch below */}}
    {{/* (Manifest "No data", State "Pending", stage errors on the title/tag/buttons). */}}
    {{/* Namespace comes off the route too (.namespace); the release ns is only the fallback when */}}
    {{/* the extras carry none — so nothing changes where the alert already lives there. */}}
    {{/* GATED ON ?extras name (the input gate, scripts/lint-ra-paths.py): without one the step makes */}}
    {{/* no call — it used to GET `…/alerts/`, the whole list, and read it as this alert. */}}
    - name: alert
      dependsOn:
        name: ""
        iterator: '[ { namespace: (.namespace // "{{ $.Release.Namespace }}"), name: (.name // "") } | select(.name != "") ]'
      path: ${ "/apis/observability.krateo.io/v1alpha1/namespaces/" + .namespace + "/alerts/" + .name }
      verb: GET
      continueOnError: true
      errorKey: alertError
    {{/* Incidents live in their alert's namespace. */}}
    - name: incidents
      path: ${ "/apis/observability.krateo.io/v1alpha1/namespaces/" + (.namespace // "{{ $.Release.Namespace }}") + "/incidents" }
      verb: GET
      continueOnError: true
      errorKey: incidentsError
  filter: >
    ({{ .Values.observabilityConsoleUrl | default "" | quote }} | rtrimstr("/")) as $console
    | (.name // "") as $n
    | (.namespace // "{{ $.Release.Namespace }}") as $ns
    | (.alert.spec // {}) as $sp
    | (.alert.status // {}) as $st
    | ($sp.displayName // .alert.metadata.name // $n) as $dn
    | ($st.state // "PENDING") as $state
      # Metric and value Alerts open no incidents; only counted rows do.
    | (($sp.metricRef.name // "") == "" and ($sp.value // "") == "") as $opensIncidents
      # krateo.io/paused: "true" — the alert-provider skips this alert's firings.
    | (((.alert.metadata.annotations // {})["krateo.io/paused"] // "") == "true") as $paused
    | ($st.hyperdxAlertId // "") as $haid
    | ($st.hyperdxDashboardId // "") as $hdid
      # This alert's incidents, newest first: the ones carrying its label.
    | ([ ((.incidents.items) // [])[]
         | select(((.metadata.labels // {})["observability.krateo.io/alert"] // .spec.alertRef.name // "") == $n) ]) as $incs
    | ([ $incs[]
         | { name: (.metadata.name // ""), namespace: (.metadata.namespace // $ns),
             title: (if (.status.rootCause.statement // "") != "" then .status.rootCause.statement else ("Incident " + (.metadata.name // "")) end),
             state: (.status.state // "Analyzing"),
             error: (.status.error // ""),
             reportText: ((.status.report // "") | if type == "string" then . else "" end),
             structured: ((.status.rootCause.statement // "") != ""),
             when: (.spec.triggeredAt // .metadata.creationTimestamp // "") } ]
       | sort_by(.when) | reverse
       | map(. + { open: (.state != "Resolved" and .state != "Closed"),
                   route: ("/incidents/" + .namespace + "/" + .name) })) as $shaped
    | ($shaped[0] // null) as $rep
    | [ $shaped[] | select(.open) ] as $open
    | [ $shaped[] | select(.open | not) ] as $ended
      # Did the analysis produce a result, fail (status.error, or a provider error in the report), or produce nothing?
      | (if $rep == null then "" else ($rep.reportText // "") end) as $repText
      | ($rep != null and ((($rep.error // "") != "") or ($repText | test("Bad Request|Too Many Requests|STREAM_ERROR|token count|exceeds the maximum")))) as $repFailed
      | (if $rep == null then false elif $repFailed then false else (($rep.structured // false) or (($repText | length) > 0)) end) as $repProduced
      # The About card: the description, then a warning for each failure the page would otherwise
      # hide. A healthy alert shows its description alone.
    | ([ ($sp.description // ""),
         (if $haid == "" then ("**Not running.** HyperDX hasn't accepted this alert, so nothing checks it."
                               + (if ($st.error // "") != "" then " The manifest below shows the error." else "" end))
          elif $state == "ALERT" and ($paused | not) and $opensIncidents and ($open | length) == 0
          then "**Firing, but no incident has opened.** One normally opens within a minute; if none does, check the alert-provider's logs."
          else "" end),
         (if $rep == null or ($rep.state // "") == "Analyzing" or $repProduced then ""
          elif $repFailed then "**The latest analysis failed.** Open its incident below to see the error."
          else "**The latest analysis produced no result.** Open its incident below." end)
       ] | map(select(. != "")) | join("\n\n")) as $about
    | {
        displayName: $dn,
        where: ($sp.where // "all logs"),
        # "above 1" — thresholdType + threshold, empty-safe (never a bare " " or leading space).
        thresholdText: ((($sp.thresholdType // "") + " " + (($sp.threshold // 0) | tostring)) | ltrimstr(" ")),
        interval: ($sp.interval // ""),
        description: ($sp.description // ""),
        state: $state,
        phase: ($st.phase // "Pending"),
        paused: $paused,
        # State tag — same map as the /alerts table, but OK→green (palette: green=health only,
        # and a quiet-OK alert IS the healthy default), ALERT→red (failure), PENDING→orange
        # (transitional). "OK" kept verbatim — the literal HyperDX state word.
        stateLabel: ($state | if . == "ALERT" then "Alert" elif . == "PENDING" then "Pending" else . end),
        stateColor: ($state | if . == "ALERT" then "red" elif . == "PENDING" then "orange" elif . == "OK" then "green" else "gray" end),
        hyperdxAlertId: $haid,
        hyperdxDashboardId: $hdid,
        # HyperDX console deep-links — absent unless BOTH the deployer configured a console URL
        # AND the reconciler recorded the id (no default URL invented; nothing-hardcoded).
        alertLink: (if ($console != "" and $haid != "") then ($console + "/alerts/" + $haid) else "" end),
        dashboardLink: (if ($console != "" and $hdid != "") then ($console + "/dashboards/" + $hdid) else "" end),
        hasConsole: (($console != "") and (($haid != "") or ($hdid != ""))),
        # Autopilot seed for the detail-page "Investigate with Autopilot" button (the ask flow
        # the OLD /alerts row-click used, preserved here now the row deep-links to this page).
        # The button navigates to a LITERAL server-built /incidents?ask= href (the seed @uri-
        # encoded once, here — same pattern as composition-detail's diagnoseHref; a Button
        # navigate path is used verbatim, NOT re-encoded like a Table cell, so it must be
        # pre-encoded exactly once). The raw `ask` is also emitted for any raw consumer.
        ask: ("Investigate the \"" + $dn + "\" observability alert — it is currently " + $state + "; explain what it watches, why it is in this state, and give me the concrete next steps."),
        askHref: ("/incidents?ask=" + (("Investigate the \"" + $dn + "\" observability alert — it is currently " + $state + "; explain what it watches, why it is in this state, and give me the concrete next steps.") | @uri)),
        aboutMd: $about,
        # The Incidents card: every open incident, then the five latest ended ones, newest first within each.
        incidents: ($open + $ended[0:5] | map({ name, namespace, title, state, when, route })),
        incidentsTitle: ("Incidents · " + ($open | length | tostring) + " open"
          + (if ($ended | length) > 0 then (" · " + ($ended | length | tostring) + " ended" + (if ($ended | length) > 5 then ", the latest 5 shown" else "" end)) else "" end)),
        sections: {
          incident: ($rep != null),
          about: ($about != ""),
          console: (($console != "") and (($haid != "") or ($hdid != "")))
        },
        # Static GVR for the plain Alert CRD — the DELETE target for button.alert-detail-delete
        # (mirrors composition-detail's .gvr feeding composition-detail-delete). name/namespace come
        # from the fetched CR (falls back to the route params when the read degraded). resource/
        # apiVersion are constant: an Alert is always alerts.observability.krateo.io/v1alpha1.
        gvr: {
          apiVersion: "observability.krateo.io/v1alpha1",
          resource: "alerts",
          name: (.alert.metadata.name // $n),
          namespace: (.alert.metadata.namespace // $ns)
        },
        # The raw Alert CR as a JSON string for the Manifest YamlViewer (managedFields +
        # last-applied stripped; YamlViewer converts JSON → YAML). Empty when the read degraded so
        # the viewer shows its honest empty state, not "{}". Same shape as resource-detail.
        manifestJson: ((.alert // {}) | if (.metadata.name // "") != "" then ((del(.metadata.managedFields, .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"])) | tojson) else "" end)
      }
