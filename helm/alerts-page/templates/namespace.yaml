{{/* The chart creates its own target namespace rather than requiring one to pre-exist.

     A Helm release cannot create the namespace it is installed INTO, so the release stays where the
     composition is created (krateo-system) and every page object is rendered into
     `.Values.namespace`, which this creates. Same arrangement the portal chart uses for
     demo-system. */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    krateo.io/page-set: alerts
