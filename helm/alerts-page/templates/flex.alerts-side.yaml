{{/* The charts, one third of the row, top to bottom: the alerts by state, by signal, the incidents
     they opened in the range, and the alerts that opened the most (only while there are any). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-side
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: alerts-by-state-card
    - resourceRefId: alerts-by-signal-card
    - resourceRefId: alerts-incident-trend-card
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "alerts-by-state-card" }, { resourceRefId: "alerts-by-signal-card" }, { resourceRefId: "alerts-incident-trend-card" } ] + (if ((.topIncidents // []) | length) > 0 then [ { resourceRefId: "alerts-top-incidents-card" } ] else [] end) }'
  resourcesRefs:
    items:
    - id: alerts-by-state-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-by-state-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: alerts-by-signal-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-by-signal-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: alerts-incident-trend-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-incident-trend-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: alerts-top-incidents-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-top-incidents-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
