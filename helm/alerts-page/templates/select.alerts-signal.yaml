{{/* The Signal facet, written to ?signal=: what an alert watches (.status.type: Logs, Metric,
     Traces). Each option counts its alerts under the other filters (portal.facets), largest first.
     The mockup draws it as a Segmented; the facets are Selects on every overview page (build plan
     §1). */}}
kind: Select
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-signal
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, signal, hasIncidents, q, view]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    name: signal
    label: Signal
    queryParam: signal
    mode: multiple
    prefix: Signal
    placeholder: All
    size: small
    panelFooter: Counted in alerts, under the other filters
    options: []
  widgetDataTemplate:
  - forPath: options
    expression: '${ [ ((.facets // [])[] | select(.key == "signal") | .values[]) | { label: .label, value: .value, count: .count } ] }'
  resourcesRefs:
    items: []
