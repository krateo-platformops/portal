{{/* Convention page root for /alerts/{namespace}/{name} — the per-alert detail. Strict top to */}}
{{/* bottom, facts first (audit ALD-1, approved mockup 2026-11-25): pagehead (H1 + State tag + */}}
{{/* actions) → the warnings, each an amber Alert (whether it runs; whether its latest analysis went */}}
{{/* wrong) → Details card (description, what it watches, when it fires, how often it is checked */}}
{{/* and when it last was, since when it is in its state, whether it opens incidents) → a Tabs card */}}
{{/* (the incidents as a one-line table, while there are any; the manifest) → Console card (HyperDX */}}
{{/* external links). */}}
{{/* */}}
{{/* The warnings, the Incidents tab and the Console card are templated SERVER-SIDE off */}}
{{/* alert-detail's `sections` flags: each renders ONLY when its data exists, so nothing ever */}}
{{/* renders as fabricated empty structure (exception-only, honest data). resourcesRefs stay static */}}
{{/* (the full pool); unreferenced children are simply never fetched. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-alert-detail
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-order": "935"
    "krateo.io/nav-path": "/alerts/{namespace}/{name}"
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: alert-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - pageheaders
    - alerts
    - flexes
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: alert-detail-page-header
    - resourceRefId: alert-detail-details-card
    - resourceRefId: alert-detail-tabs-card
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ (.sections // {}) as $s
        | [ { resourceRefId: "alert-detail-page-header" } ]
        + (if ($s.runWarning // false) then [ { resourceRefId: "alert-detail-run-warning" } ] else [] end)
        + (if ($s.analysisWarning // false) then [ { resourceRefId: "alert-detail-analysis-warning" } ] else [] end)
        + [ { resourceRefId: "alert-detail-details-card" }, { resourceRefId: "alert-detail-tabs-card" } ]
        + (if ($s.console // false) then [ { resourceRefId: "card-alert-detail-console" } ] else [] end) }
  resourcesRefs:
    items:
    - id: alert-detail-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: alert-detail-run-warning
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-run-warning
      namespace: {{ $.Values.namespace }}
      resource: alerts
      verb: GET
    - id: alert-detail-analysis-warning
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-analysis-warning
      namespace: {{ $.Values.namespace }}
      resource: alerts
      verb: GET
    - id: alert-detail-details-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-details-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: alert-detail-tabs-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-tabs-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: card-alert-detail-console
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: card-alert-detail-console
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
