{{/* "Ask Agentiko →" on /alerts: about the alerts on screen (Diego, 2026-11-14, Q4 (a)). It navigates
     to THIS page with an ?ask seed the rail consumes on mount, keeping every filter param (?status,
     ?signal, ?hasIncidents, ?q), ?view and the ?projects= scope, so the conversation starts on the
     same view. The prompt (obs-alerts `viewAskHref`) names the filter and what is firing, what went
     back to OK in the last 24 hours and what still has open incidents; a failed read of the alerts
     is asked about, and an unread incident list is said, never "no open incidents".

     Same object as service-desk-page's button.request-ask-agentiko: the label and `intent: agentiko`
     are fixed (A4). It sits left of "Author with Autopilot", which keeps its own, authoring, prompt. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-ask-agentiko
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, signal, hasIncidents, q, view]
  apiRef:
    name: obs-alerts
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /alerts
  widgetDataTemplate:
    {{/* Server-built self-page href with the ?ask seed; falls back to the page, never a 404. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.viewAskHref // "") != "" then .viewAskHref else "/alerts" end) } ] } }'
  resourcesRefs:
    items: []
