{{/* The two lines of a builder dashboard's list card that are not rows:
       <key>-builder-empty  in place of the list when nothing is in the picked state (builder-overview
                            emptyText says why: nothing at all yet, nothing needing you, a search
                            that matched nothing, a state that is not one);
       <key>-builder-more   under the first 48 cards: how many more the Full list holds;
       <key>-builder-published-label
                            the eyebrow over the caller's published drafts (list.my-drafts), under the
                            Summary when there are any. */}}
{{- range $key, $b := include "builders.overviews" . | fromYaml }}
---
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: {{ $key }}-builder-empty
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{- include "builders.overviewReader" (dict "ctx" $ "key" $key) | nindent 2 }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
  - forPath: text
    expression: '${ .emptyText // "" }'
  resourcesRefs:
    items: []
---
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: {{ $key }}-builder-more
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{- include "builders.overviewReader" (dict "ctx" $ "key" $key) | nindent 2 }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
  - forPath: text
    expression: '${ "48 of " + ((.matched // 0) | tostring) + " shown here. Full list has all " + ((.matched // 0) | tostring) + "." }'
  resourcesRefs:
    items: []
---
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: {{ $key }}-builder-published-label
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: {{ include "builders.overviewKeys" $ }}
  widgetData:
    text: Published drafts · kept until you remove them
    variant: eyebrow
  resourcesRefs:
    items: []
{{- end }}
