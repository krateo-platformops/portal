{{/* The five figures of a builder dashboard (builders.overviews tiles), each in the colour the cards
     give the state it counts, but grey at zero for a state that needs attention; the title names the
     state too, so colour is never the only signal. A figure that counts one state opens its chip;
     one that could not be read says so, and opens nothing. */}}
{{- range $key, $b := include "builders.overviews" . | fromYaml }}
---
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: {{ $key }}-builder-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{- include "builders.overviewReader" (dict "ctx" $ "key" $key) | nindent 2 }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      navigateTo: '{route}'
      {{- /* The colour and the border come computed (builder-overview stats): a zero that would need
           attention is neutral ink and not highlighted (frontend 1.8.93 `highlight`). */}}
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
{{- end }}
