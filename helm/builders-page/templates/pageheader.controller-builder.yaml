{{/* The /controller-builder page header — title and both routes into Compose, in */}}
{{/* one CR: pageheader.blueprint-builder's shape, with a controller's words. Replaces */}}
{{/* pageheader.kog-builder (title and subtitle only) and flex.kog-builder-ask-cta, the wrapper */}}
{{/* whose only job was to right-align the Autopilot button — which this action row already does. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: controller-builder-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: {{ include "builders.overviewKeys" $ }}
  widgetData:
    title: Controller Builder
    {{/* NO SUBTITLE, as on /incidents and /compositions (mockup A4): the breadcrumb above says */}}
    {{/* where this is, and what the builder makes is what the dashboard below shows. The words */}}
    {{/* that said it moved to the builder itself, as the guide at the top of Compose */}}
    {{/* (card.builder-guides). */}}
    {{/* TWO actions, ONE primary, in the /blueprint-builder order: the Autopilot link first, the */}}
    {{/* builder last as the filled primary. */}}
    allowedResources:
      - buttons
    items:
      - resourceRefId: controller-builder-ask
      - resourceRefId: controller-builder-compose
  resourcesRefs:
    items:
      - id: controller-builder-ask
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: controller-builder-ask
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
      - id: controller-builder-compose
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: controller-builder-compose
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
