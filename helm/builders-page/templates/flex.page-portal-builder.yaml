{{/* /portal-builder, the Portal Builder's page, as a dashboard in the layout of /incidents and
     /compositions (mockup A4). Top to bottom:
       - the header, with Ask Agentiko and Compose a page (no subtitle: the breadcrumb says where
         this is);
       - the time range and, on the same row, the search;
       - the five figures: Publish failed, Needs a step, Change request open, Drafts, Merged;
       - one row: the caller's drafts and the builder's page publishes on the left two thirds (the
         state chips, Needs attention by default, then one card each, or with ?view=table the Full
         list), the charts on the right third (by state, published vs merged, time to merge,
         waiting longest, and the unowned drafts).

     ONE WAY TO BUILD, and it is the builder. The page used to offer three tiles that looked alike:
     the builder, plus `author-widget` and `compose-page` — two Forms that could only emit a FLAT
     page of widgets with STATIC widgetData, while 212 of 425 shipped widget templates compute their
     data server-side. The builder does nesting, layout and live data binding, so it is the only path.

     WHERE THE STEPS WENT. "How a page gets built" sat here above the drafts; it is now the guide at
     the top of Compose, where the building happens (the Builder's spec.guide). The change requests of
     every builder, which this page listed, are now each on their own builder's dashboard.

     Every widget below reads portal-builder-overview (restaction.builder-overview) as the caller,
     and declares the page's filter keys (krateo.io/filter-keys, scripts/lint-keyextras.py). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-portal-builder
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Builders"
    "krateo.io/nav-icon": "fa-hammer"
    "krateo.io/nav-label": "Portal Builder"
    "krateo.io/nav-order": "21"
    "krateo.io/nav-path": "/portal-builder"
    "krateo.io/filter-keys": "state,range,view,q"
    "krateo.io/verbose": "true"
spec:
  keyExtras: {{ include "builders.overviewKeys" $ }}
  widgetData:
    allowedResources:
    - pageheaders
    - rows
    - listies
    vertical: true
    gap: middle
    items:
    - resourceRefId: portal-builder-page-header
    - resourceRefId: portal-builder-toolbar
    - resourceRefId: portal-builder-stats
    - resourceRefId: portal-builder-main
  resourcesRefs:
    items:
    {{- include "builders.ref" (dict "ctx" $ "id" "portal-builder-page-header" "resource" "pageheaders") | nindent 4 }}
    {{- include "builders.ref" (dict "ctx" $ "id" "portal-builder-toolbar" "resource" "rows") | nindent 4 }}
    {{- include "builders.ref" (dict "ctx" $ "id" "portal-builder-stats" "resource" "listies") | nindent 4 }}
    {{- include "builders.ref" (dict "ctx" $ "id" "portal-builder-main" "resource" "rows") | nindent 4 }}
