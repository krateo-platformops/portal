{{/* /blueprint-builder, the Blueprint Builder's page, as a dashboard in the layout of /incidents
     and /compositions (mockup A4): the header (Ask Agentiko, Compose a blueprint; no subtitle), the
     time range and the search, the five figures (Failed, To install, Change request open, Drafts, Registered),
     then the caller's drafts and the blueprints this builder published on the left two thirds (the
     state chips, Needs attention by default, then one card each, or with ?view=table the Full list)
     and the charts on the right third.

     Authoring does not happen on this page. It happens at /blueprint-builder/compose, the
     frontend's builder, whose guide says how a blueprint gets built (the Builder's spec.guide); this
     page is the way in and the record of what shipped and what waits on someone. ONE WAY TO BUILD A
     BLUEPRINT: the builder. card.author-blueprint, a Form whose only chart control was a JSON
     textarea, went when the builder could start a chart from a name.

     Every widget below reads blueprint-builder-overview (restaction.builder-overview) as the caller,
     and declares the page's filter keys (krateo.io/filter-keys, scripts/lint-keyextras.py). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-blueprint-builder
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Builders"
    "krateo.io/nav-icon": "fa-pen-ruler"
    "krateo.io/nav-label": "Blueprint Builder"
    "krateo.io/nav-order": "22"
    "krateo.io/nav-path": "/blueprint-builder"
    "krateo.io/filter-keys": "state,range,view,q"
    "krateo.io/verbose": "true"
spec:
  keyExtras: {{ include "builders.overviewKeys" $ }}
  widgetData:
    allowedResources:
    - pageheaders
    - rows
    - listies
    vertical: true
    gap: middle
    items:
    - resourceRefId: blueprint-builder-page-header
    - resourceRefId: blueprint-builder-toolbar
    - resourceRefId: blueprint-builder-stats
    - resourceRefId: blueprint-builder-main
  resourcesRefs:
    items:
    {{- include "builders.ref" (dict "ctx" $ "id" "blueprint-builder-page-header" "resource" "pageheaders") | nindent 4 }}
    {{- include "builders.ref" (dict "ctx" $ "id" "blueprint-builder-toolbar" "resource" "rows") | nindent 4 }}
    {{- include "builders.ref" (dict "ctx" $ "id" "blueprint-builder-stats" "resource" "listies") | nindent 4 }}
    {{- include "builders.ref" (dict "ctx" $ "id" "blueprint-builder-main" "resource" "rows") | nindent 4 }}
