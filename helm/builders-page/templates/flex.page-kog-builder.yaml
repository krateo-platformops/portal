{{/* /controller-builder, the Controller Builder's page, as a dashboard in the layout of /incidents
     and /compositions (mockup A4): the header (Ask Agentiko, Build a controller; no subtitle), the
     time range and the search, the five figures (Failed, Needs a step, In review, Drafts, Ready),
     then the caller's drafts and the controllers this builder published on the left two thirds (the
     state chips, Needs attention by default, then one card each, or with ?view=table the Full list)
     and the charts on the right third, the last of which is the cluster's RestDefinitions by API
     group.

     Authoring does not happen on this page. It happens at /controller-builder/compose, the
     frontend's composer, whose guide says how a controller gets built (card.builder-guides). The two
     Forms that used to author here are gone: they committed a single resources/<kind>.yaml while
     the rail published a chart, so the same controller came out as two artifacts.

     The CR keeps its name (the page slug has been kog-builder since /kog-builder) and its aliases,
     so old /kog-builder and /api-builder links still land here.

     Every widget below reads controller-builder-overview (restaction.builder-overview) as the
     caller, and declares the page's filter keys (krateo.io/filter-keys, scripts/lint-keyextras.py). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-kog-builder
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-alias": "/kog-builder,/api-builder"
    "krateo.io/nav-group": "Builders"
    "krateo.io/nav-icon": "fa-plug"
    "krateo.io/nav-label": "Controller Builder"
    "krateo.io/nav-order": "23"
    "krateo.io/nav-path": "/controller-builder"
    "krateo.io/filter-keys": "state,range,view,q"
    "krateo.io/verbose": "true"
spec:
  keyExtras: {{ include "builders.overviewKeys" $ }}
  widgetData:
    allowedResources:
    - pageheaders
    - rows
    - listies
    vertical: true
    gap: middle
    items:
    - resourceRefId: controller-builder-page-header
    - resourceRefId: controller-builder-toolbar
    - resourceRefId: controller-builder-stats
    - resourceRefId: controller-builder-main
  resourcesRefs:
    items:
    {{- include "builders.ref" (dict "ctx" $ "id" "controller-builder-page-header" "resource" "pageheaders") | nindent 4 }}
    {{- include "builders.ref" (dict "ctx" $ "id" "controller-builder-toolbar" "resource" "rows") | nindent 4 }}
    {{- include "builders.ref" (dict "ctx" $ "id" "controller-builder-stats" "resource" "listies") | nindent 4 }}
    {{- include "builders.ref" (dict "ctx" $ "id" "controller-builder-main" "resource" "rows") | nindent 4 }}
