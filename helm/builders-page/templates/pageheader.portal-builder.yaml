{{/* The /portal-builder page header — its title and actions, in one CR. */}}
{{/* */}}
{{/* Replaces four: flex.portal-builder-header plus the eyebrow, title and subtitle Paragraphs. */}}
{{/* */}}
{{/* THE EYEBROW IS GONE, and that is a deletion rather than a regression: Paragraph.tsx already */}}
{{/* returns null for `variant: eyebrow`, so that line has been rendering as nothing. */}}
{{/* */}}
{{/* Two actions, as on the sibling builders: "Ask Agentiko →" (A4/A5 — the entry point beside the */}}
{{/* page's primary, not counted against it, P6) and the builder. It used to sit in the "How a */}}
{{/* page gets built" card, the only builder where it did. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: portal-builder-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: {{ include "builders.overviewKeys" $ }}
  {{/* NO COUNTER. It read "N drafts in progress" from preview-drafts, every author's previews */}}
  {{/* at once. The figures below count the caller's drafts, beside the cards they count. */}}
  widgetData:
    title: Portal Builder
    {{/* NO SUBTITLE, as on /incidents and /compositions (mockup A4): the breadcrumb above says */}}
    {{/* where this is, and what the builder makes is what the dashboard below shows. The words */}}
    {{/* that said it moved to the builder itself, as the guide at the top of Compose */}}
    {{/* (the Builder's spec.guide). */}}
    allowedResources:
      - buttons
    items:
      - resourceRefId: portal-builder-ask
      - resourceRefId: portal-builder-compose
  resourcesRefs:
    items:
      - id: portal-builder-ask
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: portal-builder-ask
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
      - id: portal-builder-compose
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: portal-builder-compose
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
