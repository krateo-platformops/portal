# @schema
# description: The namespace this chart CREATES and installs its page objects into. It is the RBAC boundary the chart exists for — a group with no RoleBinding here cannot `list` the page roots, so the portal sidebar never shows them and the page body 403s on a deep link. The release itself stays wherever the composition is created; only the page objects live here.
# type: string
# default: "krateo-builders"
# @schema
namespace: krateo-builders

# @schema
# description: Groups granted read of these pages in `namespace`. A group listed here sees the three Builder pages in the sidebar and can open it; a group absent cannot list the page roots, so the entry never renders. `devs` is deliberately NOT a default — keeping it out is the point of the split (#261).
# type: array
# @schema
readerGroups:
  - admins

# @schema
# description: Where the builders keep drafts and page previews. MUST match the frontend chart's previewSandbox, which OWNS the namespace and its RBAC. This chart creates nothing there.
# type: object
# @schema
previewSandbox:
  namespace: krateo-preview

# @schema
# description: Where these pages read the blueprint/operator catalog, read in the release namespace. MUST match the portal chart's marketplace.source.
# type: object
# @schema
marketplace:
  source: configmap
  configMapName: blueprints-catalog-index
  liveIndex: true
