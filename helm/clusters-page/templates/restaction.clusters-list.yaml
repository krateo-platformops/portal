{{/* Cluster registry data source (hub-and-spoke Phase 1, design §2.1 + §1.3 Option 2). */}}
{{/* */}}
{{/* Lists the registered KubernetesTargets (the spokes a CompositionDefinition can deploy */}}
{{/* to) and derives each target's HEALTH by AGGREGATING CompositionDefinition.status.target */}}
{{/* across the blueprints that reference it — NO engine change (design §1.3 option 2): */}}
{{/* - stage `targets`  : collection LIST of KubernetesTargets (they live on the hub). */}}
{{/* KubernetesTarget is NAMESPACED (core-provider 2.8.0), but the collection endpoint */}}
{{/* (/apis/.../kubernetestargets, no namespace segment) returns every namespace the caller */}}
{{/* may see — same all-namespaces LIST shape the compdefs stage below relies on — so the */}}
{{/* list works unchanged after the scope migration. */}}
{{/* - stage `compdefs` : LIST of CompositionDefinitions (the same hub read the compositions */}}
{{/* page uses) — each carries spec.deploy.targetRef.name (the spoke it targets) and */}}
{{/* status.target.{connectionStatus,version} (per-blueprint reachability, probed each */}}
{{/* reconcile by core-provider). */}}
{{/* The `filter` JOINs them: for each target, collect the compdefs whose targetRef.name == it, */}}
{{/* roll their connectionStatus up to a single per-cluster health cell (railState-style — */}}
{{/* any Down ⇒ failed/red, all Healthy ⇒ healthy/green, otherwise unknown/gray) and count them. */}}
{{/* Robust to absent status (a freshly-registered target with no referencing blueprint, or a */}}
{{/* blueprint whose status.target hasn't been populated yet, reads "unknown"). Both list steps */}}
{{/* continueOnError so the page degrades (empty rows) rather than failing the whole widget. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: clusters-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{/* KubernetesTarget is namespaced (core.krateo.io/v1alpha1) as of core-provider 2.8.0, but */}}
    {{/* this is the collection LIST endpoint (no namespace segment → all visible namespaces). */}}
    {{/* UAF gates the LIST by the user's list grant on kubernetestargets; a narrow-RBAC user */}}
    {{/* simply sees fewer/no rows. */}}
    - name: targets
      path: /apis/core.krateo.io/v1alpha1/kubernetestargets
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: targetsError
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: kubernetestargets
      {{/* Project the LIST body's .items to the fields the final JOIN needs (status.target may be */}}
      {{/* absent on a freshly-registered target — read defensively). The step key then holds THIS */}}
      {{/* array (a step WITH a filter yields the filter output, not the raw body). */}}
      {{/* A KubernetesTarget's OWN status is FLAT (core-provider probes it directly): */}}
      {{/* .status.connectionStatus / .status.version / .status.lastProbeTime — NOT nested under */}}
      {{/* .status.target (that nesting is the CompositionDefinition's shape). Read the target's own */}}
      {{/* probe as the primary health signal; the compdef roll-up (below) is a fallback. */}}
      filter: >
        [ .targets.items[]?
          | { name: .metadata.name,
              secretRef: (.spec.kubeconfigRef.name // ""),
              conn: (.status.connectionStatus // ""),
              version: (.status.version // ""),
              lastProbe: (.status.lastProbeTime // .metadata.creationTimestamp // "") } ]
    {{/* CompositionDefinitions carry the per-blueprint target reachability we roll up. This is a */}}
    {{/* cluster-scope LIST (compositiondefinitions is namespaced, but the cluster-scope LIST */}}
    {{/* endpoint returns all namespaces the caller may see — same shape compositions-list relies */}}
    {{/* on for its per-item UAF); we only read spec.deploy.targetRef + status.target here. */}}
    - name: compdefs
      path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: compdefsError
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: compositiondefinitions
        namespaceFrom: .metadata.namespace
      {{/* Project the LIST body's .items to (targetRef.name, per-blueprint reachability). Only the */}}
      {{/* blueprints that actually target a spoke matter for the roll-up (drop the target-less/local */}}
      {{/* ones). The step key then holds THIS array. */}}
      filter: >
        [ .compdefs.items[]?
          | { target: (.spec.deploy.targetRef.name // ""),
              conn: (.status.target.connectionStatus // ""),
              ver: (.status.target.version // "") }
          | select(.target != "") ]
  {{/* Build the registry rows. For each KubernetesTarget, JOIN the CompositionDefinitions whose */}}
  {{/* spec.deploy.targetRef.name == target.metadata.name, roll their status.target.connectionStatus */}}
  {{/* up to a health verdict, and count them. `counts` summarises the fleet for an optional header. */}}
  {{/* */}}
  {{/* `failed`/`readError` say when the targets read itself failed: under continueOnError an absent */}}
  {{/* step and an empty registry were the same empty table. `askHref` is the "Ask Agentiko →" link */}}
  {{/* (button.clusters-ask-agentiko): this page's route with an ?ask seed about the clusters on it, */}}
  {{/* built here and @uri-encoded so the Button is a plain literal navigate. A failed read asks */}}
  {{/* what the error means instead of describing a registry nobody managed to read. */}}
  {{/* */}}
  {{/* This filter is a FOLDED scalar (`>`): a line at its own indentation is joined onto the next, */}}
  {{/* so the jq below carries no `#` comments. */}}
  filter: >
    def cap($n): if length > $n then (.[0:($n - 1)] + "…") else . end;
    def errText($e): if $e == null then "" else ([ $e | if type == "array" then .[] else . end | if type == "object" then (.message // .reason // tojson) else tostring end ] | map(select(. != "")) | unique | join("; ")) end;
    def numbered: .[0:8] | to_entries | map(((.key + 1) | tostring) + ". " + .value) | join(" ");
    errText(.targetsError) as $tErr
    | errText(.compdefsError) as $cErr
    | (.compdefs // []) as $cd
    | ([ (.targets // [])[]
        | . as $t
        | ($t.name) as $name
        | ([ $cd[] | select(.target == $name) ]) as $refs
        | ($refs | length) as $count
        | ($t.conn // "") as $tconn
        | ([ $refs[] | .conn ]) as $conns
        | (if $tconn == "Healthy" then "healthy"
           elif $tconn == "Down" then "failed"
           elif ($conns | any(. == "Down")) then "failed"
           elif ($count > 0 and ($conns | all(. == "Healthy"))) then "healthy"
           else "unknown" end) as $health
        | { name: $name,
            health: $health,
            healthPercent: (if $health == "healthy" then 100 elif $health == "failed" then 20 else 50 end),
            healthColor: (if $health == "healthy" then "green" elif $health == "failed" then "red" else "gray" end),
            version: (($t.version // "") as $tv | if $tv != "" then $tv else (([ $refs[] | .ver ] | map(select(. != "")))[0] // "") end),
            blueprintCount: $count,
            secretRef: ($t.secretRef // ""),
            lastProbe: ($t.lastProbe // "") } ]) as $rows
    | ($rows | map(select(.health == "failed"))) as $down
    | ($rows | map(select(.health == "unknown"))) as $unk
    | ($rows | length) as $total
    | (if $tErr != "" then
         "The cluster registry could not be read (" + ($tErr | cap(300)) + "). Explain what that error means and what an administrator has to fix."
       elif $total == 0 then
         "No cluster is registered on this platform yet. Explain what registering one does, what it needs, and how compositions are then deployed to it."
       elif ($down | length) == 0 and ($unk | length) == 0 then
         "Check my registered clusters: " + ($total | tostring) + " registered, all healthy. Tell me whether anything about them still needs attention."
       else
         "Check my registered clusters: " + ($total | tostring) + " registered — "
         + (($total - ($down | length) - ($unk | length)) | tostring) + " healthy, "
         + ($down | length | tostring) + " down"
         + (if ($down | length) > 0 then " (" + ($down | map(.name + " — " + (if .lastProbe != "" then "last probe " + .lastProbe else "no probe recorded" end)) | numbered) + ")" else "" end)
         + ", " + ($unk | length | tostring) + " unknown"
         + (if ($unk | length) > 0 then " (" + ($unk | map(.name) | numbered) + ")" else "" end)
         + ". For each one that is not healthy, explain what its connection probe says and how to restore it."
       end
       + (if $tErr == "" and $cErr != "" then " The blueprints that target them could not be read (" + ($cErr | cap(200)) + "), so each cluster's health here comes from its own probe alone." else "" end)) as $prompt
    | {
        list: $rows,
        counts: {
          total: $total,
          healthy: ($rows | map(select(.health == "healthy")) | length),
          failed:  ($down | length),
          unknown: ($unk | length)
        },
        failed: ($tErr != ""),
        readError: $tErr,
        askHref: ("/clusters?ask=" + ($prompt | @uri))
      }
