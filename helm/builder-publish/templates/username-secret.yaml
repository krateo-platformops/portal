{{/*
  THE LEGACY PER-PUBLISH USERNAME SECRET — a migration shim with its own end of life.

  Until 1.8.28 this chart rendered one of these per publish and pointed toRepo.credentials.usernameRef
  at it. 1.8.28 moved the username to an install-level Secret, which was right: a per-publish Secret
  cannot outlive the publish, and deleting a claim stranded its own children on the Secret they
  needed in order to finalize (core-provider#108).

  toRepo is IMMUTABLE, so 1.8.29 froze an existing LocalResource's usernameRef rather than mutate it.
  That created a third state neither release accounted for, reported as portal#223: the freeze keeps
  pointing at <name>-git-username while the same upgrade stops rendering it, so Helm deletes the
  Secret and the LocalResource is pinned to something that no longer exists. Silently — the preflight
  guard passes a Secret that is absent entirely.

  So the Secret is rendered again, but ONLY while an existing LocalResource still names it. A publish
  created under <=1.8.28 keeps a valid reference; a publish created from now on never renders one,
  because its LocalResource carries the install-level ref and this lookup finds nothing to preserve.
  The shim disappears on its own as old publishes are deleted — no flag to remember to turn off.

  Freezing a reference while dropping its referent is the same mistake as pointing at a renamed repo
  or a moved directory: the pointer looks fine and resolves to nothing.
*/}}
{{- $cred := .Values.credentials | default dict -}}
{{- $ns := .Release.Namespace -}}
{{- $legacyName := printf "%s-git-username" .Values.name | trunc 63 | trimSuffix "-" -}}
{{- $stillReferenced := false -}}
{{- range $i, $f := (include "builder-publish.files" $ | fromYamlArray) -}}
{{- $lrName := printf "%s-%03d" $.Values.name (int $i) | trunc 63 | trimSuffix "-" -}}
{{- $live := lookup "git.krateo.io/v1alpha1" "LocalResource" $ns $lrName -}}
{{- if $live -}}
{{- if eq (dig "spec" "toRepo" "credentials" "usernameRef" "name" "" $live) $legacyName -}}
{{- $stillReferenced = true -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $stillReferenced }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $legacyName }}
  namespace: {{ $ns }}
  labels:
    krateo.io/builder: {{ .Values.builder }}
    krateo.io/publish: {{ .Values.name }}
  annotations:
    krateo.io/legacy-shim: "kept only while a pre-1.8.29 LocalResource still references it (portal#223)"
type: Opaque
stringData:
  # Not a credential: the git server authenticates on the token in the password position and ignores
  # this. It only has to be present — an empty username fails basic auth outright.
  username: {{ $cred.username | default "x-access-token" | quote }}
{{- end }}
