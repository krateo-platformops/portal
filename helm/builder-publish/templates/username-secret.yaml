{{/*
  THE USERNAME SIDE OF BASIC AUTH.

  git-provider's `toRepo.credentials.usernameRef` is a SecretKeySelector — there is no field for a
  literal — so a username has to live in a Secret even though it is not secret. Rather than make
  every install add a key to whatever secret holds the git token (which is usually provisioned
  outside this chart), the chart renders its own one-key Secret and points at that.

  Skipped when the install supplies `credentials.usernameRef`: that install already keeps the
  username somewhere, and we must not shadow it.
*/}}
{{- $cred := .Values.credentials | default dict -}}
{{- if and (eq ($cred.authMethod | default "basic") "basic") (not $cred.usernameRef) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-git-username" .Values.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    krateo.io/builder: {{ .Values.builder }}
    krateo.io/publish: {{ .Values.name }}
type: Opaque
stringData:
  # Not a credential: GitHub authenticates on the token in the password position and ignores this.
  # It only has to be present — an empty username fails basic auth outright.
  username: {{ required "credentials.username must be set when authMethod is basic and no usernameRef is given" $cred.username | quote }}
{{- end }}
