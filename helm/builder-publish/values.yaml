# PER-PUBLISH — supplied by the BuilderPublish claim (see values.schema.json). The values below are
# EXAMPLES (schema-valid so `helm lint`/smoke-render pass); every real claim overrides them.
name: example
builder: controller   # page | blueprint | controller  (krateo.io/builder discriminator)
branch: builder/example
target:
  namespace: example  # org / group[/subgroup] / workspace
  repo: example        # repository / project
  base: main           # base branch the builder branch is cut from
files:                 # [{ path, content }] — each becomes one LocalResource
  - path: README.md
    content: |
      # placeholder — overridden by the BuilderPublish claim

# INSTALL-LEVEL — the real per-install defaults (set once; override via the CompositionDefinition or
# the installer). The claim never carries these, so a git token never rides in a per-publish CR.
git:
  scheme: https    # http for self-hosted git without TLS (host may include :port)
  host: github.com
  insecure: false  # true for Azure DevOps
  # Which SCM this install targets. Drives WHICH repository kind is rendered (see
  # templates/repository.yaml) — the write itself is scm-blind and goes through git-provider
  # regardless. Only "github" has a provider today; any other value fails the render rather than
  # silently skipping repository creation.
  scm: github

# DESTINATION REPOSITORY — created by this composition, so a brand-new blueprint no longer needs a
# repo someone made by hand first. Requires github-provider-kog (it owns github.krateo.io/Repository).
repository:
  # false = the destination is pre-provisioned; render only the file commits, exactly as this chart
  # did before. Use it on installs that create repositories out of band.
  create: true
  private: true
  # Do NOT set false. Without an initial commit the repo has no default branch, so the file
  # commits have nothing to clone from and the whole publish fails.
  autoInit: true
  description: "Created by Krateo"
credentials:
  # basic (token as password, username alongside) | bearer | cookiefile.
  #
  # DEFAULT IS basic, DELIBERATELY. `bearer` looks like the natural choice for a token and is not:
  #   - git-provider exercises `toRepo` with `basic` in every one of its own test fixtures and with
  #     `bearer` in none of them, so bearer is the untested path;
  #   - git-provider 0.14.1 cannot reconcile a bearer LocalResource at all — Connect() resolves
  #     usernameRef BEFORE it reads authMethod and a nil ref is fatal, so every publish fails with
  #     "connect failed: retrieving .toRepo username: no credentials secret referenced". That
  #     contradicts both its CRD field description and docs/local-resource.md, which promise the
  #     field is ignored for bearer. Until that is fixed, bearer cannot push at all.
  #   - `githttp.TokenAuth` sends `Authorization: Bearer`, which is not how a token is presented to
  #     git-over-HTTPS on GitHub; the token belongs in the password position of basic auth.
  authMethod: basic
  secretRef:
    name: git-provider-credentials   # the install's git-token secret (namespace = release ns)
    key: token
  # THE USERNAME IS NOT A SECRET. GitHub authenticates on the token in the password position and
  # does not use this value — it only has to be present and non-empty. So the chart renders its own
  # one-key Secret for it (templates/username-secret.yaml) rather than requiring whoever provisions
  # `git-provider-credentials` to add a key to it. Set `usernameRef` below to override that and
  # point at an existing secret instead (self-hosted git / gitea, where the username IS meaningful).
  username: x-access-token
  # usernameRef: { name: git-provider-credentials, key: username }
