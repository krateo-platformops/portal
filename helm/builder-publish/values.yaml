# PER-PUBLISH — supplied by the BuilderPublish claim (see values.schema.json). The values below are
# EXAMPLES (schema-valid so `helm lint`/smoke-render pass); every real claim overrides them.
name: example
builder: controller   # page | blueprint | controller  (krateo.io/builder discriminator)
branch: builder/example
target:
  namespace: example  # org / group[/subgroup] / workspace
  repo: example        # repository / project
  base: main           # base branch the builder branch is cut from
files:                 # [{ path, content }] — each becomes one LocalResource
  - path: README.md
    content: |
      # placeholder — overridden by the BuilderPublish claim

# OPTIONAL SOURCE REPOSITORY — when `url` is set the destination is SEEDED from it (a git-provider
# Repo, fromRepo -> toRepo) before the held files are committed. Use it to scaffold a brand-new
# repository from a template. Leave `url` empty and the chart behaves exactly as it did before: an
# auto-init'd repo with a README, and the held files on a branch cut from it.
source:
  url: ""              # e.g. https://github.com/krateo-blueprints/blueprint-builder.git
  branch: main         # branch in the SOURCE to copy from
  path: ""             # subdirectory of the source; whole repository if empty
  intoBranch: ""       # branch in the DESTINATION to seed; defaults to target.base — seeding the
                       # base is what keeps the pull request diff to the authored files alone
  krateoIgnorePath: "" # path to a .krateoignore in the source; provider default if empty

# INSTALL-LEVEL — the real per-install defaults (set once; override via the CompositionDefinition or
# the installer). The claim never carries these, so a git token never rides in a per-publish CR.
git:
  scheme: https    # http for self-hosted git without TLS (host may include :port)
  host: github.com
  insecure: false  # true for Azure DevOps
  # Which SCM this install targets. Drives WHICH repository kind is rendered (see
  # templates/repository.yaml) — the write itself is scm-blind and goes through git-provider
  # regardless. Only "github" has a provider today; any other value fails the render rather than
  # silently skipping repository creation.
  scm: github

# DESTINATION REPOSITORY — created by this composition, so a brand-new blueprint no longer needs a
# repo someone made by hand first. Requires github-provider-kog (it owns github.krateo.io/Repository).
repository:
  # The auth kind the Repository authenticates with. INSTALL-LEVEL and referenced, never rendered
  # here: it carries nothing per-publish (only a tokenRef to the install's git secret), and when the
  # chart rendered its own copy per publish, deleting a claim removed the configuration that the
  # Repository's OWN delete handler resolves — "delete failed: repositoryconfigurations.github.krateo.io
  # \"...\" not found" — so the finalizer never cleared and the Repository was stranded. Four on
  # krateo-057 have been stuck that way since 2026-09-10 (core-provider#108).
  #
  # Provision it once, alongside github-provider-kog. Leave namespace empty for the release namespace.
  configurationRef:
    name: github-blueprints-config
    namespace: ""
  # false = the destination is pre-provisioned; render only the file commits, exactly as this chart
  # did before. Use it on installs that create repositories out of band.
  create: true
  private: true
  # Do NOT set false. Without an initial commit the repo has no default branch, so the file
  # commits have nothing to clone from and the whole publish fails.
  autoInit: true
  description: "Created by Krateo"
# THE CHANGE REQUEST — opened by the composition once every file is committed, instead of being
# left to a human clicking the portal's deep link. Requires github-provider-kog >= 0.3.0, the
# release that restores the PullRequest kind natively; set create=false on older installs.
pullRequest:
  create: true
  title: ""            # defaults to "feat(<builder>): <name>"
  body: ""             # defaults to a line naming the builder, the file count and the claim

credentials:
  # basic (token as password, username alongside) | bearer | cookiefile.
  #
  # DEFAULT IS basic, DELIBERATELY. `bearer` looks like the natural choice for a token and is not:
  #   - git-provider exercises `toRepo` with `basic` in every one of its own test fixtures and with
  #     `bearer` in none of them, so bearer is the untested path;
  #   - git-provider 0.14.1 cannot reconcile a bearer LocalResource at all — Connect() resolves
  #     usernameRef BEFORE it reads authMethod and a nil ref is fatal, so every publish fails with
  #     "connect failed: retrieving .toRepo username: no credentials secret referenced". That
  #     contradicts both its CRD field description and docs/local-resource.md, which promise the
  #     field is ignored for bearer. Until that is fixed, bearer cannot push at all.
  #   - `githttp.TokenAuth` sends `Authorization: Bearer`, which is not how a token is presented to
  #     git-over-HTTPS on GitHub; the token belongs in the password position of basic auth.
  authMethod: basic
  secretRef:
    name: git-provider-credentials   # the install's git-token secret (namespace = release ns)
    key: token
  # THE USERNAME IS NOT A SECRET. GitHub authenticates on the token in the password position and
  # does not use this value — it only has to be present and non-empty (conventionally
  # `x-access-token`). It lives in a Secret at all only because git-provider's `usernameRef` is a
  # SecretKeySelector with no field for a literal.
  #
  # IT MUST OUTLIVE ANY ONE PUBLISH. The chart used to render it per publish
  # (templates/username-secret.yaml, now deleted), which put it inside each publish's own Helm
  # release. Deleting a claim then destroyed the Secret that claim's own children still needed IN
  # ORDER TO FINISH DELETING — a LocalResource must connect before it can finalize, connecting
  # needs this username, and the finalizer never cleared. Four publishes on krateo-057 were
  # stranded that way for six days, reconcile-erroring the whole time (core-provider#108).
  #
  # So it is install-level now, in the SAME Secret as the token: whoever provisions
  # `git-provider-credentials` adds a `username` key beside `token`. One Secret, both halves of
  # basic auth, owned by the install and by no publish.
  usernameRef:
    name: git-provider-credentials
    key: username
