apiVersion: v2
name: builder-publish
description: >-
  Krateo composition for Autopilot builder publishing (page / blueprint / controller). A
  BuilderPublish claim commits the builder's held files verbatim to a builder/<slug> branch on
  ANY SCM, via git-provider LocalResources — no PR/MR is created (the UI opens one via a
  host-aware deep link). It also CREATES the destination repository, so a brand-new blueprint no
  longer needs one made by hand. Requires git-provider (git.krateo.io) >= appVersion 0.10.0, the
  release that ships the LocalResource CRD (chart git-provider >= 0.14.0 in krateo-platformops);
  and, unless repository.create=false, github-provider-kog, which owns github.krateo.io/Repository.
type: application
version: CHART_VERSION
appVersion: CHART_VERSION
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - autopilot
  - git
  - publish
