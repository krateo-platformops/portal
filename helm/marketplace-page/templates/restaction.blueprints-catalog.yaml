{{/* Marketplace catalog — the INSTALLABLE items, merged from TWO helm-repo */}}
{{/* indexes: /charts/blueprints/index.yaml (~311 CompositionDefinition blueprints) AND */}}
{{/* /charts/operators/index.yaml (~18 Kubernetes operators). Every entry is stamped with */}}
{{/* `source: blueprint|operator` so the grid can tell them apart (the footer word) and */}}
{{/* a type toggle can filter them. Honest fields straight off each index: name/description/ */}}
{{/* version/url. Categories are NOT a curated annotation any more — each card's `tags` are */}}
{{/* its raw helm `keywords` (multi-tag: a card lives under EVERY one of its keywords), and */}}
{{/* the `categories` array (distinct keyword + count, the popular ones) drives the chips */}}
{{/* data-driven. `?category=<kw>` keeps a card if <kw> is in its keywords; `?source=<src>` */}}
{{/* filters by type; `?q=` matches name/description/keywords. */}}
{{/* */}}
{{/* REQUIRES snowplow >= 1.4.0: the external `endpointRef` GET returns text/yaml, which */}}
{{/* snowplow converts YAML->JSON (external_fetch.go) before the jq filter runs. */}}
{{/* */}}
{{/* A compdefs api-step LISTs installed CompositionDefinitions and the filter LEFT-JOINs them onto */}}
{{/* the catalog by chart identity (portal.marketplaceInstalledDefs, _installed.tpl, the rule the */}}
{{/* detail page shares): a helm-repo CD by its repo + chart, an OCI CD by the chart name, the last */}}
{{/* segment of oci://…/<name> (same name counts, UX audit MKT-2) → `installed` + */}}
{{/* `installedVersion` + `installedNs`/`installedName` (detail link) + the card's primary action */}}
{{/* (`actionLabel`/`actionIcon`/`actionPath`: Configure when installed, else Install). */}}
{{/* `continueOnError` everywhere: a missing index or a UAF-denied compdef list degrades to an */}}
{{/* empty/partial catalog, not a broken page. */}}
{{/* */}}
{{/* The catalogLive step (marketplace.liveIndex) reads the live blueprints index too, and withLive */}}
{{/* adds the charts a blueprint repository released there since the ConfigMap was rendered */}}
{{/* (portal.catalogLiveDefs, _catalog.tpl): a blueprint merged from the Blueprint Builder gets its */}}
{{/* card on the next read, not on the next catalog release. Such a card installs from the channel's */}}
{{/* base URL (its repoBase), where index.yaml lives. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: blueprints-catalog
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{- include "portal.catalogStep" (dict "ctx" $ "name" "catalog" "index" "blueprints") | nindent 4 }}
    {{- include "portal.catalogLiveStep" $ | nindent 4 }}
    {{- include "portal.catalogStep" (dict "ctx" $ "name" "operators" "index" "operators") | nindent 4 }}
    - name: compdefs
      path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
      verb: GET
      continueOnError: true
      errorKey: compdefsError
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: compositiondefinitions
        namespaceFrom: .metadata.namespace
      {{/* Project each installed CD down to just what the join needs. For a HELM-REPO install the */}}
      {{/* core-provider ChartInfo carries `spec.chart.repo` = the chart NAME and `spec.chart.url` = */}}
      {{/* the helm-repo BASE URL; OCI/tgz installs leave `repo` empty (url = full oci/tgz path). The */}}
      {{/* marketplace catalog only lists helm-repo blueprints, so the honest installed-match is against */}}
      {{/* helm-repo CDs (non-empty .repo). `ns`+`name` ride along for the installed-detail link. */}}
      filter: '[.compdefs.items[]? | {name: .metadata.name, ns: .metadata.namespace, version: (.spec.chart.version // ""), repo: (.spec.chart.repo // ""), url: (.spec.chart.url // "")}]'
  {{/* Literal block (|) NOT folded (>): the jq carries inline `#` comments, and a folded */}}
  {{/* scalar would join a comment line onto the following code line (commenting the code out). */}}
  filter: |
    {{- include "portal.catalogLiveDefs" . | nindent 4 }}
    {{- include "portal.marketplaceInstalledDefs" . | nindent 4 }}
    {{- include "portal.marketplaceCategoryDefs" . | nindent 4 }}
    def qstr($p): ([ $p | to_entries[] | select(.value != null and .value != "") | (.key + "=" + .value) ] | join("&")) as $s
      | (if $s == "" then "/marketplace" else "/marketplace?" + $s end);
    def errmsg: (if type == "array" then .[0] else . end) | if type == "object" then (.message // .reason // tojson) elif type == "string" then . else tojson end;
    def failed: . != null and . != [] and . != "";
    def cap($n): if length > $n then (.[0:($n - 1)] + "…") else . end;
    # THE TILE'S GLYPH says its category (UX audit MKT-5, approved mockup 2026-11-25): one glyph per
    # category (portal.marketplaceCategoryDefs, the rule its tag and the chips use), so the icon and
    # the tag beside it say the same thing; a chart with no category gets its type's glyph. It
    # replaced a first-substring-hit keyword table (24 glyphs over the same charts, "kubernetes"
    # giving every ACK operator the wheel). The charts' own index icons cannot serve: 793 of 820
    # blueprints point at the Krateo logo and 68 operators at the AWS logo.
    def categoryGlyph: { "network": "fa-network-wired", "compute": "fa-server", "database": "fa-database",
      "application": "fa-cubes", "security": "fa-shield-halved", "observability": "fa-chart-line",
      "storage": "fa-hard-drive", "generator": "fa-code" };
    # INSTALLED: portal.marketplaceInstalledDefs (_installed.tpl), the ONE rule this grid and the
    # chart's detail page share: chart identity, the helm repo + chart for a helm-repo install and
    # the chart name for an OCI one (same name counts, UX audit MKT-2), never the CD's own name.
    # withLive first: the live index's newly published blueprints join the catalog (_catalog.tpl).
    withLive
    | (.compdefs // []) as $cds
    | ((.category) // "all") as $sel
    | ((.source) // "all") as $src
    | ((.q) // "") as $q
    | ((.spotlight) // "") as $spot
    # ?sort= reorders the grid. Only two orders the helm index actually supports:
    #   "name"   -> chart name A->Z (the default; every entry has a name)
    #   "recent" -> most-recently-published first (index `created` RFC3339, desc)
    # The index carries NO downloads/popularity/rating field, so no "trending"/"popular"
    # sort is offered (would be fabricated). Unknown ?sort= values fall back to name.
    | (((.sort) // "name") | if . == "recent" then "recent" else "name" end) as $sort
    | ($q | ascii_downcase) as $ql
    | (
        [ (((.catalog // {}).entries) // {}) | to_entries[] | (.value[0] + {source: "blueprint", versions: .value}) ]
        + [ (((.operators // {}).entries) // {}) | to_entries[] | (.value[0] + {source: "operator", versions: .value}) ]
      ) as $raw
    | ( [ $raw[]
          # helm-repo base URL for THIS card (its own tarball URL with the filename stripped; for a
          # card withLive added, the channel's base it carries as repoBase): the install form's repo.
          | (.repoBase // ((.urls[0] // "") | sub("/[^/]+$"; ""))) as $repoBase
          # The CompositionDefinition this chart is installed as, or null (installedOf, _installed.tpl),
          # over every version's base, so an install from an older version's base counts.
          | installedOf(.name; .versions; $cds) as $match
          | {
              name: .name,
              description: (.description // ""),
              keywords: (.keywords // []),
              tags: (.keywords // []),
              source: .source,
              typeLabel: (if .source == "operator" then "Operator" else "Blueprint" end),
              # CATEGORY (portal.marketplaceCategoryDefs, _category.tpl, the rule the detail page
              # shares): the krateo.io/category annotation, else the first keyword the fixed table
              # lists, else "" -> the card renders no tag (never "uncategorized"). `category` is the
              # printed word (Database), `categoryKey` the key (database).
              categoryKey: marketplaceCategory,
              category: (marketplaceCategory | marketplaceCategoryLabel),
              # Per-card glyph: its category's, else its type's (fa-gears an operator, fa-layer-group a blueprint).
              icon: (categoryGlyph[marketplaceCategory] // (if .source == "operator" then "fa-gears" else "fa-layer-group" end)),
              maturity: ((.annotations // {})["krateo.io/maturity"] // ""),
              version: (.version // ""),
              # helm index publish timestamp (RFC3339); drives the "recently updated" sort.
              created: (.created // ""),
              url: (.urls[0] // ""),
              repoUrl: $repoBase,
              # INSTALLED-ness — the honest catalog<->cluster join ($match, keyed by repoBase|name;
              # helm-repo CDs only). true only when a CD was installed from THIS repo+chart.
              installed: ($match != null),
              installedVersion: ($match.version // ""),
              # namespace + name of the matched CompositionDefinition (for the installed-detail
              # link); empty strings when not installed.
              installedNs: ($match.ns // ""),
              installedName: ($match.name // ""),
              # at-a-glance "already installed" glyph on the tile (reuses the Listy status channel);
              # empty icon when not installed -> the card renders no glyph (exception-only badge).
              installedIcon: (if $match != null then "fa-circle-check" else "" end),
              installedColor: (if $match != null then "green" else "" end),
              installedTooltip: (if $match != null then ("Installed" + ($match.version // "" | if . == "" then "" else " · v" + . end)) else "" end),
              # The card's primary action, the detail page's: Configure (the installed blueprint's
              # page) when installed, else Install. The grid's rowAction reads the label and icon
              # (frontend: a card action's {path} label) and its navigate action the route, written
              # without the leading slash because a path that STARTS with "${" is a jq expression
              # over the widget, not the row: the action's path is "/${actionPath}".
              actionLabel: (if $match != null then "Configure" else "Install" end),
              actionIcon: (if $match != null then "fa-sliders" else "fa-download" end),
              actionPath: (if $match != null then ("blueprints/" + ($match.ns // "") + "/" + ($match.name // ""))
                           else ("marketplace/" + .name + "/install") end)
            }
        ] ) as $cards
    # The cards matching the ACTIVE facets (source + category + free-text) — computed once so
    # BOTH the head-stat count and the rendered grid stay in sync (the head-stat reflects what
    # is actually shown, never a fabricated total).
    | ( [ $cards[] | select(
            ($src == "all" or .source == $src)
            and ($sel == "all" or ((.keywords | index($sel)) != null))
            and ($ql == ""
                 or (.name | ascii_downcase | contains($ql))
                 or (.description | ascii_downcase | contains($ql))
                 or ((.keywords | join(" ")) | ascii_downcase | contains($ql)))
        ) ] ) as $shown
    # Head-stat noun: reflects the active source facet so the eyebrow reads honestly
    # ("blueprints" / "operators" / "charts" when the catalog is mixed).
    | (if $src == "blueprint" then "blueprints"
       elif $src == "operator" then "operators"
       else "charts" end) as $countLabel
    # ASK AGENTIKO (button.marketplace-ask-agentiko): the prompt is about the cards the active
    # facets show, and the link keeps ?category, ?source, ?q and ?sort. "Not at the catalog's
    # latest" is a STRING INEQUALITY between the installed CompositionDefinition's chart version
    # and the catalog entry's version — nothing here compares versions, so it never says "newer"
    # or "behind". The two index reads and the installed-CD read each fail open under
    # continueOnError (an empty catalog, or nothing installed), so a prompt over a failed read says
    # it failed rather than "the catalog offers 0 charts" or "none are installed".
    | ([ (if (.catalogError | failed) then "the blueprints index could not be read (" + (.catalogError | errmsg | cap(200)) + ")" else empty end),
         (if (.operatorsError | failed) then "the operators index could not be read (" + (.operatorsError | errmsg | cap(200)) + ")" else empty end) ]) as $indexErrors
    | (if (.compdefsError | failed) then (.compdefsError | errmsg | cap(200)) else "" end) as $installError
    | ([ (if $src != "all" then (if $src == "operator" then "operators only" else "blueprints only" end) else empty end),
         (if $sel != "all" then "keyword " + ($sel | tostring) else empty end),
         (if $q != "" then "matching \"" + ($q | tostring | cap(60)) + "\"" else empty end) ] | join("; ")) as $view
    | ([ $shown[] | select(.installed) ]) as $inst
    | ([ $inst[] | select(.installedVersion != .version) ] | sort_by(.name)) as $stale
    | (if ($cards | length) == 0 and ($indexErrors | length) > 0 then
         "The Marketplace catalog could not be read: " + ($indexErrors | join("; ")) + ". Explain what that means and what to check."
       else
         "Help me choose from the Marketplace: "
         + (if $view != "" then "this view (" + $view + ") shows " + ($shown | length | tostring) + " of the catalog's " + ($cards | length | tostring) + " charts"
            else "the catalog offers " + ($cards | length | tostring) + " charts" end)
         + " (" + ([ $shown[] | select(.source == "blueprint") ] | length | tostring) + " blueprints, " + ([ $shown[] | select(.source == "operator") ] | length | tostring) + " operators)"
         + (if $installError != "" then "; which of them are installed here could not be read (" + $installError + ")."
            else "; " + ($inst | length | tostring) + " " + (if ($inst | length) == 1 then "is" else "are" end) + " installed here, and " + ($stale | length | tostring) + " of those " + (if ($stale | length) == 1 then "is" else "are" end) + " not at the catalog's latest version"
              + (if ($stale | length) > 0 then " (" + ($stale | .[0:8] | map(.name + " " + (if .installedVersion != "" then .installedVersion else "unknown" end) + " → " + .version) | join(", ")) + ")" else "" end) + "." end)
         + (if ($indexErrors | length) > 0 then " The catalog may be incomplete: " + ($indexErrors | join("; ")) + "." else "" end)
         + " What should I install or upgrade for this platform, and why?"
       end) as $prompt
    | {
        askHref: (qstr({category: (if $sel == "all" then "" else ($sel | @uri) end), source: (if $src == "all" then "" else $src end), q: ($q | @uri), sort: (if $sort == "name" then "" else $sort end)})
                  | . + (if test("\\?") then "&" else "?" end) + "ask=" + ($prompt | @uri)),
        selectedCategory: $sel,
        selectedSource: $src,
        selectedSort: $sort,
        # Head-stat: real catalog cardinality. `total` = every card fetched from both indexes
        # (unfiltered); `count` = the cards the active facets show (what the grid renders).
        total: ($cards | length),
        count: ($shown | length),
        countLabel: $countLabel,
        # A facet with one value filters nothing: with no popular keyword (and none selected) the
        # row would be a lone "All" chip repeating the source toggle's "All" above it (P3), so it
        # is empty and the Listy hides it.
        categories: (
          ( [ $cards[] | .keywords[] ] | group_by(.)
            | map({key: .[0], label: .[0], count: length, active: (.[0] == $sel),
                   route: qstr({category: .[0], source: (if $src == "all" then "" else $src end), q: $q, sort: (if $sort == "name" then "" else $sort end)})})
            | map(select(.count >= 5)) | sort_by(.count) | reverse ) as $popular
          | if ($popular | length) == 0 and $sel == "all" then []
            else
              [ {key: "all", label: "All", count: ($cards | length), active: ($sel == "all"),
                 route: qstr({category: "", source: (if $src == "all" then "" else $src end), q: $q, sort: (if $sort == "name" then "" else $sort end)})} ]
              + $popular
            end
        ),
        sources: [
          {key: "all", label: "All", active: ($src == "all"),
           route: qstr({source: "", category: (if $sel == "all" then "" else $sel end), q: $q, sort: (if $sort == "name" then "" else $sort end)})},
          {key: "blueprint", label: "Blueprints", active: ($src == "blueprint"),
           route: qstr({source: "blueprint", category: (if $sel == "all" then "" else $sel end), q: $q, sort: (if $sort == "name" then "" else $sort end)})},
          {key: "operator", label: "Operators", active: ($src == "operator"),
           route: qstr({source: "operator", category: (if $sel == "all" then "" else $sel end), q: $q, sort: (if $sort == "name" then "" else $sort end)})}
        ],
        # Sort facet — ONLY the orders the helm index data supports (name, created). Each
        # chip's route preserves the active source/category/q filter so sort composes.
        sorts: [
          {key: "name", label: "Name (A–Z)", active: ($sort == "name"),
           route: qstr({sort: "", source: (if $src == "all" then "" else $src end), category: (if $sel == "all" then "" else $sel end), q: $q})},
          {key: "recent", label: "Recently updated", active: ($sort == "recent"),
           route: qstr({sort: "recent", source: (if $src == "all" then "" else $src end), category: (if $sel == "all" then "" else $sel end), q: $q})}
        ],
        cards: (
          # Base order per ?sort=: name A->Z (default) or created desc (most recent first).
          ( if $sort == "recent" then ($shown | sort_by(.created) | reverse)
            else ($shown | sort_by(.name)) end )
          # ?spotlight=<name> (a global-search catalog hit's hand-off): sort the matching
          # card FIRST and mark it via the EXISTING status-glyph channel (orange star +
          # tooltip) — search always lands on installable-only hits, so the installed
          # check (which this channel normally carries) is guarded, never overwritten.
          | (if $spot == "" then .
             else ( map(if (.name == $spot) and (.installed | not)
                        then . + { installedIcon: "fa-star", installedColor: "orange", installedTooltip: "Matched your search" }
                        else . end)
                    | ([ .[] | select(.name == $spot) ] + [ .[] | select(.name != $spot) ]) )
             end)
        )
      }
