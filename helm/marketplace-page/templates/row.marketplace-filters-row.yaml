{{/* The Marketplace search line (UX audit MKT-4, approved mockup 2026-11-25): the search opens the */}}
{{/* filters at full width with the order beside it, and the chips and the Keyword select follow on */}}
{{/* their own line (flex.marketplace-facets). A Row (NOT a Flex) so the two slots get deterministic */}}
{{/* 24-grid widths (#86, fedepini: a Flex let the search collapse under flex-shrink): */}}
{{/* search-wrap      LEFT  = size 18 (≈ 75%) */}}
{{/* marketplace-sort RIGHT = size 6  (≈ 25%) */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-filters-row
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - flexes
    - selects
    alignment: middle
    items:
    - resourceRefId: marketplace-search-wrap
      size: 18
    - resourceRefId: marketplace-sort
      size: 6
  resourcesRefs:
    items:
    - id: marketplace-search-wrap
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-search-wrap
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: marketplace-sort
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-sort
      namespace: {{ $.Values.namespace }}
      resource: selects
      verb: GET
