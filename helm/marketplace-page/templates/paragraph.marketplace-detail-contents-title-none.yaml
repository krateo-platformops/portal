{{/* card.marketplace-detail-contents: the title when there is no list: no contents recorded yet, or none at default values. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-detail-contents-title-none
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: marketplace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
    strong: true
  widgetDataTemplate:
    - forPath: text
      expression: '${ .contents.title // "" }'
  resourcesRefs:
    items: []
