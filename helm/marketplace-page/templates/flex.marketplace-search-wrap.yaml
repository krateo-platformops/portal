{{/* #86 (fedepini): a thin one-item Flex around the catalog search. WHY it exists: the outer */}}
{{/* facet container is a Row (row.marketplace-filters-row) so the two slots get DETERMINISTIC */}}
{{/* 24-grid widths that don't collapse under flex-shrink — but Row.allowedResources had no */}}
{{/* `inputs` at this chart's first floors, only `flexes`. So the search Input rides inside this */}}
{{/* flex, a valid Row child. The search fills this wrapper (and its span-18 column). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-search-wrap
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - inputs
    items:
    - resourceRefId: marketplace-search
  resourcesRefs:
    items:
    - id: marketplace-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-search
      namespace: {{ $.Values.namespace }}
      resource: inputs
      verb: GET
