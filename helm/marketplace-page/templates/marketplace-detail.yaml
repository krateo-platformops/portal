{{/* ============================================================================= */}}
{{/* Marketplace blueprint DETAIL page — route /marketplace/{name} (page-<slug>). */}}
{{/* Mirrors the installed-blueprint detail page (flex.page-blueprint-detail) but the */}}
{{/* data source is the helm-repo index entry for THIS chart (not an installed */}}
{{/* CompositionDefinition). Surfaces the honest index.yaml metadata: description, the full */}}
{{/* version list, appVersion, type, the krateo.io category/maturity/supported-version */}}
{{/* annotations, keywords, home/sources/chart-package links, published date + digest. The */}}
{{/* header action is Install (→ /marketplace/{name}/install) or, if the blueprint is already */}}
{{/* installed, Configure (→ its installed-blueprint detail). All fields are server-shaped by */}}
{{/* the marketplace-detail RA below; widgets only slice their view. Needs snowplow >= 1.4.0 */}}
{{/* (external YAML fetch), same as blueprints-catalog / blueprint-detail. */}}
{{/* */}}
{{/* Grouped in one multi-doc template (vs one file per CR) because they're a single cohesive */}}
{{/* feature; snowplow indexes by kind+name, so file layout is cosmetic. */}}
{{/* ============================================================================= */}}
---
{{/* DATA SOURCE — resolve ONE catalog entry by ?extras.name (route /marketplace/{name}). */}}
{{/* Fetches the helm index + the installed CompositionDefinitions (to mark installed/Configure). */}}
{{/* The live blueprints index too (catalogLive, marketplace.liveIndex): withLive leads with the live */}}
{{/* versions a krateo-blueprints repository published, so this page shows what the grid shows (_catalog.tpl). */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: marketplace-detail
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{- include "portal.catalogStep" (dict "ctx" $ "name" "catalog" "index" "blueprints") | nindent 4 }}
    {{- include "portal.catalogLiveStep" $ | nindent 4 }}
    {{/* The operators index too, as the grid and the install form read it: an operator's tile opens */}}
    {{/* this page, which without it said the operator "is not in the Marketplace catalog". */}}
    {{- include "portal.catalogStep" (dict "ctx" $ "name" "operators" "index" "operators") | nindent 4 }}
    - name: compdefs
      path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
      verb: GET
      continueOnError: true
      errorKey: compdefsError
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: compositiondefinitions
        namespaceFrom: .metadata.namespace
      {{/* `status` is kept for "What it creates" (status.contents), read the same way on the blueprint page; */}}
      {{/* repo and url for chart identity (portal.marketplaceInstalledDefs), projected as the grid projects them. */}}
      filter: '[.compdefs.items[]? | {name: .metadata.name, ns: .metadata.namespace, version: (.spec.chart.version // ""), repo: (.spec.chart.repo // ""), url: (.spec.chart.url // ""), status: {contents: (.status.contents // null)}}]'
  {{/* NULL-SAFE. With no ?extras.name — the background prewarm resolves this RESTAction with no */}}
  {{/* route — `.entries[null]` raised "expected a string for object key but got: null" and every */}}
  {{/* widget on it failed (~670/h on krateo-057). An absent name is found: false. */}}
  {{/* INSTALLED is chart identity, the rule the grid's tile uses (portal.marketplaceInstalledDefs, */}}
  {{/* _installed.tpl), not the CompositionDefinition's name: the matched CD's namespace, name and */}}
  {{/* version are what this page shows and Configure opens (UX audit MKT-2). */}}
  {{/* LATEST is the newest version by version number (withLiveVer), the order the blueprint page */}}
  {{/* picks its "Latest version" by (restaction.blueprint-detail), so the two pages cannot disagree */}}
  {{/* over an index that is not newest-first (UX audit BP-2). CATEGORY is the chart's */}}
  {{/* krateo.io/category, title-cased, as its Marketplace card shows it (restaction.blueprints-catalog), */}}
  {{/* or "" — never its first keyword ("krateo") or a made-up "uncategorized" (MKT-5). A name the */}}
  {{/* catalog does not hold says so in the description and has no About rows: it showed "Category */}}
  {{/* uncategorized, Installed yes" for a platform component that only shares the name (MKT-3). */}}
  filter: >
    {{- include "portal.catalogLiveDefs" . | nindent 4 }}
    {{- include "portal.blueprintContentsDefs" . | nindent 4 }}
    {{- include "portal.marketplaceInstalledDefs" . | nindent 4 }}
    def titlecase: if . == "" then "" else (.[0:1] | ascii_upcase) + .[1:] end;
    withLive
    | ((.name // "") | tostring) as $n
    | ( ((.catalog // {}).entries[$n]) // ((.operators // {}).entries[$n]) // [] | [ .[] | objects ] | sort_by(.version // "" | withLiveVer) | reverse ) as $vers
    | (if $n == "" then null else installedOf($n; $vers; (.compdefs // [])) end) as $inst
    | ( $vers[0] // {} ) as $latest
    | ( [ $vers[] | .version | select(. != null and . != "") ] | unique ) as $availableVersions
    | ( ($latest.annotations // {}) ) as $ann
    | ( ($ann["krateo.io/category"] // "") | tostring | ascii_downcase | titlecase ) as $cat
    | {
        name: $n,
        found: ($vers | length > 0),
        description: (if ($vers | length) > 0 then ($latest.description // "")
                      else ($n + " is not in the Marketplace catalog."
                            + (if $inst != null then " A blueprint with this name is installed in " + ($inst.ns // "{{ $.Release.Namespace }}") + ": Configure opens it." else "" end)) end),
        category: $cat,
        maturity: ($ann["krateo.io/maturity"] // ""),
        version: ($latest.version // ""),
        availableVersions: $availableVersions,
        availableVersionsText: ($availableVersions | join(", ")),
        appVersion: ($latest.appVersion // ""),
        type: ($latest.type // ""),
        krateoSupportedVersion: ($ann["krateoSupportedVersion"] // ""),
        keywords: ($latest.keywords // []),
        keywordsText: (($latest.keywords // []) | join(", ")),
        home: ($latest.home // ""),
        sources: ($latest.sources // []),
        sourcesText: (($latest.sources // []) | join("   ")),
        icon: ($latest.icon // ""),
        chartUrl: ($latest.urls[0] // ""),
        created: ($latest.created // ""),
        digest: ($latest.digest // ""),
        installed: ($inst != null),
        installedVersion: ($inst.version // ""),
        installedNamespace: ($inst.ns // "{{ $.Release.Namespace }}"),
        installedName: ($inst.name // ""),
        contents: (if ((.compdefsError // null) | . != null and . != [] and . != "")
                   then { state: "none", extra: "—", kinds: [], stale: false, foot: "", title: "Not known here.",
                          body: "Whether this blueprint is installed on this cluster could not be read, so neither could what it creates." }
                   else ($inst | blueprintContents($inst.version // "")) end),
        askHref: (if ($vers | length) > 0 then
          ("/marketplace/" + $n + "?ask="
           + (("Tell me about the \"" + $n + "\" chart in the Marketplace ("
               + ([ ($latest.version // "" | if . == "" then empty else "v" + . end), (if $cat != "" then $cat else empty end),
                    (if ($ann["krateo.io/maturity"] // "") != "" then $ann["krateo.io/maturity"] else empty end) ] | join(", "))
               + "; " + (if ((.compdefsError // null) | . != null and . != [] and . != "") then "whether it is installed here could not be read"
                         elif $inst != null then "installed here" + ($inst.version // "" | if . == "" then "" else " at v" + . end)
                         else "not installed here" end) + "): what it provisions, "
               + (if $inst != null then "what it has created in my namespace" else "what installing it would create in my namespace" end)
               + ", and whether it fits this platform.") | @uri))
          else "" end)
      }
---
{{/* PAGE ROOT — header block over a 2-column grid (mirrors page-blueprint-detail). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-marketplace-detail
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-order": "912"
    "krateo.io/nav-path": "/marketplace/{name}"
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  widgetData:
    vertical: true
    {{/* P9: one section step across every nav-declared page root — see G10, the gap between
         sections is frame and stays thin. The `small` and `middle` gaps further down this file
         belong to NON-root widgets (the action cluster, the left column) and are untouched:
         P9 governs rhythm BETWEEN sections, not within one. */}}
    gap: middle
    allowedResources:
      - pageheaders
      - rows
    items:
      - resourceRefId: marketplace-detail-page-header
      - resourceRefId: marketplace-detail-grid
  resourcesRefs:
    items:
      - id: marketplace-detail-page-header
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-detail-page-header
        namespace: {{ $.Values.namespace }}
        resource: pageheaders
        verb: GET
      - id: marketplace-detail-grid
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-detail-grid
        namespace: {{ $.Values.namespace }}
        resource: rows
        verb: GET
---
{{/* Header actions — "Ask Agentiko →", then Install (catalog) or Configure (already installed), the primary. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-detail-actions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  widgetData:
    allowedResources:
      - buttons
    vertical: false
    gap: small
    items:
      - resourceRefId: marketplace-detail-ask-agentiko
      - resourceRefId: marketplace-detail-action
  resourcesRefs:
    items:
      - id: marketplace-detail-ask-agentiko
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-detail-ask-agentiko
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
      - id: marketplace-detail-action
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-detail-action
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
---
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-detail-action
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  apiRef:
    name: marketplace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Install
    icon: fa-download
    type: primary
    {{/* #82 §0.5: middle (was small) — matches the blueprint-detail action buttons (#78 §0.4). */}}
    size: middle
    clickActionId: act
    actions:
      navigate:
        - id: act
          type: navigate
          path: /marketplace
  widgetDataTemplate:
    - forPath: label
      expression: '${ if .installed then "Configure" else "Install" end }'
    - forPath: icon
      expression: '${ if .installed then "fa-sliders" else "fa-download" end }'
    - forPath: actions
      expression: '${ if .installed then { navigate: [ { id: "act", type: "navigate", path: ("/blueprints/" + (.installedNamespace) + "/" + (if (.installedName // "") != "" then .installedName else .name end)) } ] } else { navigate: [ { id: "act", type: "navigate", path: ("/marketplace/" + (.name) + "/install") } ] } end }'
  resourcesRefs:
    items: []
---
{{/* #82 §0.6: ONE full-width panel (was a 15:9 two-column grid). The right "Source & links" column */}}
{{/* had too little content for its own panel, so the single meaningful facts folded into the About */}}
{{/* card: an "Installed" row + the home/sources/package links. The right column, its Source card and */}}
{{/* its keywords/versions Descriptions are removed. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-detail-grid
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  widgetData:
    allowedResources:
      - flexes
    alignment: top
    items:
      - resourceRefId: marketplace-detail-col-left
        size: 24
  resourcesRefs:
    items:
      - id: marketplace-detail-col-left
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-detail-col-left
        namespace: {{ $.Values.namespace }}
        resource: flexes
        verb: GET
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-detail-col-left
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  widgetData:
    vertical: true
    gap: middle
    allowedResources:
      - cards
    items:
      - resourceRefId: card-marketplace-detail-about
      {{/* "What it creates" (UX review round 3): Known once installed, else the blueprint page's states. */}}
      - resourceRefId: card-marketplace-detail-contents
  resourcesRefs:
    items:
      - id: card-marketplace-detail-contents
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-marketplace-detail-contents
        namespace: {{ $.Values.namespace }}
        resource: cards
        verb: GET
      - id: card-marketplace-detail-about
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-marketplace-detail-about
        namespace: {{ $.Values.namespace }}
        resource: cards
        verb: GET
---
{{/* "About" card — description paragraph + the chart-metadata Descriptions. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-marketplace-detail-about
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  widgetData:
    title: About
    {{/* #82 §0.6: description + metadata rows + the home/sources/package links (moved here from the */}}
    {{/* deleted "Source & links" panel), so it's one panel instead of two. */}}
    items:
      - resourceRefId: marketplace-detail-description
      - resourceRefId: descriptions-marketplace-detail-about
      - resourceRefId: marketplace-detail-links
  resourcesRefs:
    items:
      - id: marketplace-detail-description
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-detail-description
        namespace: {{ $.Values.namespace }}
        resource: paragraphs
        verb: GET
      - id: descriptions-marketplace-detail-about
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: descriptions-marketplace-detail-about
        namespace: {{ $.Values.namespace }}
        resource: descriptions
        verb: GET
      - id: marketplace-detail-links
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-detail-links
        namespace: {{ $.Values.namespace }}
        resource: paragraphs
        verb: GET
---
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-detail-description
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  apiRef:
    name: marketplace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
  widgetDataTemplate:
    - forPath: text
      expression: '${ .description // "No description provided in the chart index." }'
  resourcesRefs:
    items: []
---
{{/* Chart metadata rows from the index entry. No "Published" row: the header says "published 49d */}}
{{/* ago" from the same `created`, and the row printed it again as a raw RFC 3339 timestamp (UX */}}
{{/* audit MKT-5). No rows at all for a name the catalog does not hold (MKT-3): the description */}}
{{/* says so, and "Installed yes" there named another chart that only shares the name. */}}
kind: Descriptions
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: descriptions-marketplace-detail-about
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [category, name]
  apiRef:
    name: marketplace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    column: 1
    bordered: true
    size: small
    items: []
  widgetDataTemplate:
    - forPath: items
      expression: '${ if .found == false then [] else [ { label: "Latest version", value: (.version // "") }, { label: "App version", value: (.appVersion // "") }, { label: "Category", value: (.category // "") }, { label: "Maturity", value: (.maturity // "") }, { label: "Krateo supported", value: (.krateoSupportedVersion // "") }, { label: "Type", value: (.type // "") }, { label: "Digest", value: ((.digest // "")[0:19]) }, { label: "Installed", value: (if .installed then ("yes" + (.installedVersion // "" | if . == "" then "" else " · v" + . end)) else "no" end) } ] | map(select(.value != "" and .value != null)) end }'
  resourcesRefs:
    items: []
---
{{/* Home + sources + chart package URLs — Paragraph auto-linkifies raw URLs. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-detail-links
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  apiRef:
    name: marketplace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ ([ (if (.home // "") != "" then ("Home   " + .home) else empty end), (if ((.sources // []) | length) > 0 then ("Sources   " + (.sources | join("   "))) else empty end), (if (.chartUrl // "") != "" then ("Package   " + .chartUrl) else empty end) ] | join("\n")) }'
  resourcesRefs:
    items: []
---
{{/* "Ask Agentiko →" on /marketplace/{name}, immediately left of Install/Configure, which keeps the
     container's one primary (P6). Same object as service-desk-page's button.request-ask-agentiko —
     read the comment there: label and `intent: agentiko` fixed (A4), a plain navigate to the
     server-built marketplace-detail `.askHref` (the chart's version, category, maturity and whether
     it is installed here), falling back to the catalog — never a 404 — for a chart the catalog does
     not hold, where askHref is "". */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-detail-ask-agentiko
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: marketplace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /marketplace
  widgetDataTemplate:
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.askHref // "") != "" then .askHref else "/marketplace" end) } ] } }'
  resourcesRefs:
    items: []
