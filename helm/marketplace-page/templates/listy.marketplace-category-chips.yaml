{{/* Marketplace category chips (UX audit MKT-4, approved mockup 2026-11-25): "Any category", then the */}}
{{/* categories the catalog's charts have — eight today — each with the cards it shows under the other */}}
{{/* filters. blueprints-catalog emits `.categoryFacets` ({label, count, active, route}); a card's */}}
{{/* category is the one rule its tile tag and its page use (portal.marketplaceCategoryDefs). The ~77 */}}
{{/* keyword chips this row used to hold are the Keyword select now (select.marketplace-keyword). Each */}}
{{/* chip navigates to its `route` (?category=, keeping the other filters); the active one is solid. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-category-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell — every filter, as each */}}
  {{/* chip's count and route carry them. */}}
  keyExtras: [category, keyword, q, source, sort]
  apiRef:
    name: blueprints-catalog
    namespace: {{ $.Values.namespace }}
  widgetData:
    {{/* The RA emits no chips when no chart has a category (and none is selected): render nothing. */}}
    hideWhenEmpty: true
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ .categoryFacets }'
  resourcesRefs:
    items: []
