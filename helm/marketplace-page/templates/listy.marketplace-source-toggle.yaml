{{/* Marketplace type chips — All | Blueprints | Operators, each with the cards it shows under the */}}
{{/* other filters (UX audit MKT-4). A 3-chip data-driven row from the catalog RA's `.sources`; each */}}
{{/* chip's `route` keeps the other filters so they compose. The active source renders solid. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-source-toggle
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell — every filter, as */}}
  {{/* each chip's count and route carry them. */}}
  keyExtras: [category, keyword, q, source, sort]
  apiRef:
    name: blueprints-catalog
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ .sources }'
  resourcesRefs:
    items: []
