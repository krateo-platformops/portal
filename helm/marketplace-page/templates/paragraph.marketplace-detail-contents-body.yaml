{{/* card.marketplace-detail-contents: why there is no list, in core-provider's words when it gave any. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-detail-contents-body
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
