  # The first frontend-crds that admits what this chart ships: Listy itemTemplate.highlight (frontend 1.8.93), the computed tile border of compositions-stats, whose colour is now `color` straight from the data (no map). Before it, the Form's notices[].type (frontend 1.8.71), for the migrated-values warning on the Edit form. Before it, `notices` itself (1.8.68). Before it, the Dropdown kind (the composition header menu) set 1.8.54.
  # Installer's check-chart-requires-floors refuses a pin below it; lint-pinned-crds checks it still holds.
  krateo.io/requires-frontend-crd: ">= 1.8.93"
