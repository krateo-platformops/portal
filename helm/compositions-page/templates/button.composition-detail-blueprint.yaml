{{/* "Blueprint" — the reverse correlation link (IA followup F2): from a running composition */}}
{{/* back to the blueprint (CompositionDefinition) it was created from. composition-detail */}}
{{/* reverse-joins the composition's kind to the owning CD (.blueprintHref, server-built); */}}
{{/* the click is a plain literal navigate to /blueprints/{ns}/{name} — same pattern as the */}}
{{/* Diagnose button. Defensive: if the CD can't be resolved, blueprintHref falls back to the */}}
{{/* /blueprints index (never a 404). Kept type:default (secondary) so Sync stays primary. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-detail-blueprint
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Blueprint
    {{/* COMPOSITION DETAIL REDESIGN, step 2 (approved): the blueprint and the version this composition
         runs are part of its identity, so they sit in the header as a link, not as one more button. */}}
    type: link
    size: middle
    icon: fa-layer-group
    clickActionId: blueprint
    actions:
      navigate:
        - id: blueprint
          type: navigate
          path: /blueprints
  widgetDataTemplate:
    - forPath: label
      {{/* The version is the chart the controller installed (status.helmChartVersion). The label
           krateo.io/composition-installed-version names the PARENT's version on a composition another one
           created: every component of the installer read the installer's ("frontend 0.3.705"). */}}
      expression: >-
        ${ (.detail.status.helmChartVersion // "") as $v
        | "Blueprint" + (if (.blueprintName // "") != "" then " " + .blueprintName else "" end) + (if $v != "" then " " + $v else "" end) }
    - forPath: actions
      expression: '${ { navigate: [ { id: "blueprint", type: "navigate", path: (if (.blueprintHref // "") != "" then .blueprintHref else "/blueprints" end) } ] } }'
  resourcesRefs:
    items: []
