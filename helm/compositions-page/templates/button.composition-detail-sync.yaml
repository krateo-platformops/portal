{{/* "Refresh" = re-read the page's data (NOT a cluster mutation, and it does not make the */}}
{{/* controller reconcile, so it is not called "Sync"). A lightweight rest GET */}}
{{/* of this composition; on completion the action engine invalidates the ['widgets'] */}}
{{/* query cache, so every detail widget refetches live cluster state. The GET target */}}
{{/* (GVR + name/namespace) is resolved server-side from composition-detail (.gvr). */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-detail-sync
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Refresh
    icon: fa-arrows-rotate
    {{/* Secondary since the approved redesign: "Edit values" is the one primary action. */}}
    {{/* metadata.name stays composition-detail-sync: the actions Flex references it by name. */}}
    type: default
    size: middle
    clickActionId: sync
    actions:
      rest:
        - id: sync
          type: rest
          resourceRefId: refresh-composition
          headers:
            - 'Accept: application/json'
          successMessage: Composition refreshed
          loading:
            display: true
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: refresh-composition
        apiVersion: ${ .gvr.apiVersion }
        resource: ${ .gvr.resource }
        name: ${ .gvr.name }
        namespace: ${ .gvr.namespace }
        verb: GET
