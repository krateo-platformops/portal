{{/* "Back to Compositions" on the not-found page (portal#577). The Compositions list takes the
     namespace as its ?projects= scope (the param the project selector writes and compositions-list
     reads), so the link opens the list narrowed to the composition's namespace; with no namespace
     known it opens the plain list. No "create a new one" link: once the object is gone, the blueprint
     it came from is unknown. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-detail-gone-back
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: composition-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Back to Compositions
    type: link
    size: middle
    icon: fa-arrow-left
    clickActionId: back
    actions:
      navigate:
        - id: back
          type: navigate
          path: /compositions
  widgetDataTemplate:
    - forPath: actions
      expression: '${ { navigate: [ { id: "back", type: "navigate", path: ((.gvr.namespace // "") as $ns | if $ns == "" then "/compositions" else "/compositions?projects=" + ($ns | @uri) end) } ] } }'
  resourcesRefs:
    items: []
