{{/* Paragraph links a URL by itself, which is why the not-openable case uses Descriptions. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-detail-access-url
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: composition-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
  widgetDataTemplate:
    - forPath: text
      expression: '${ .access.url // "" }'
  resourcesRefs:
    items: []
