{{/* The /compositions body: the compositions on the left two thirds, the charts on the right
     third. At narrow widths, or with the Agentiko rail open, both take the full width and the
     charts go below. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compositions-main
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, namespace, scope, status, kind, q, view]
  widgetData:
    allowedResources:
    - cards
    - flexes
    alignment: top
    items:
    - resourceRefId: compositions-list-card
      size: 16
      xs: 24
      lg: 16
    - resourceRefId: compositions-side
      size: 8
      xs: 24
      lg: 8
  resourcesRefs:
    items:
    - id: compositions-list-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-list-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: compositions-side
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-side
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
