{{/* Related resources — the composition's composed children (its managed resources) */}}
{{/* WITH live reconcile state. Fed by the composition-resources RA (which fetches */}}
{{/* each managed resource and derives Ready×Synced / Available / ready-by-presence */}}
{{/* → state), so each row mirrors the mockup `.rel-row`: a state-colored tree dot + */}}
{{/* the resource Kind (· name) + a right-aligned FILLED state Tag (status-pill spec: */}}
{{/* single PascalCase tokens "Healthy"/"Drift"/"Pending"/"Failed", green/violet/orange/red */}}
{{/* — K8s-native vocabulary rule, no spaced/sentence-cased state words). */}}
{{/* Honest: rows ARE the real .status.managed children, state IS the live object's */}}
{{/* condition read — no ownerReferences (those point at the parent, usually empty). */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: list-composition-detail-relations
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-resources
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemLayout: horizontal
    split: false
    dataSource: []
    itemTemplate:
      {{/* IA followup F5: composition-group children carry a non-empty {navHref} → the row */}}
      {{/* becomes clickable into that child's own composition detail; core-k8s children have */}}
      {{/* navHref "" → the row stays inert (interpolate() treats "" as falsy). Honest partial */}}
      {{/* drill-down — only children that HAVE a first-class detail page link onward. */}}
      navigateTo: '{navHref}'
      rowVariant: tree
      iconVariant: dot
      {{/* THE MAP IS THE DECOUPLING, and it must list EVERY state the RA can emit. A state absent
           from it falls through to the raw state string as a colour NAME, and getColorCode returns
           near-black for a name it does not know — so adding a state to the RA without adding it
           here renders dark ink and nothing reports it.
           scripts/test-composition-resources.py asserts the two sets are equal, because that is
           the failure this comment cannot prevent on its own.
           Palette names per the status-pill spec: green = health ONLY, red = failure, violet =
           drift, orange = warning, gray = non-health. Neither Unknown case is red: nothing is
           claimed broken. `readyNotSet` is orange because it will not resolve on its own and
           someone must fix the provider; `notObserved` is gray because we genuinely do not know,
           and the Synced failure beside it already carries the alarm. */}}
      color:
        value: '{state}'
        map:
          healthy: green
          drift: violet
          pending: orange
          failed: red
          {{/* A managed Secret: declared, never read (restaction.composition-resources). */}}
          unread: gray
          {{/* Ready=Unknown, split by reason — these used to be counted and coloured as `pending`,
               which reads as progress about something that may be permanently stuck. */}}
          notObserved: gray
          readyNotSet: orange
          unknown: gray
          {{/* Ready=False split by reason: `converging` (Pending/Updating) is progress and must not
               be red; `terminal` (DriftNotConverging/AuthorizationDenied) is a stopped controller
               waiting on a human, so it is red like any failure but ranks below one. */}}
          converging: orange
          terminal: red
          {{/* Conditions present, none that says ready for this kind: not claimed broken. */}}
          noReadiness: gray
      primaryText: '{kind}'
      subPrimaryText: '{name}'
      {{/* Single-token label computed server-side (stateLabel); a filled Tag, not bare text. */}}
      secondaryText: '{stateLabel}'
      secondaryTextAsTag: true
  widgetDataTemplate:
    - forPath: dataSource
      {{/* stateLabel is taken VERBATIM from the RA, not built by upper-casing the state's first
           letter. Re-casing in the chart is what the status-pill rule forbids — a label describing
           a Kubernetes resource state is a single PascalCase token from the object, and
           `ReadyNotSetAfterObserve` cannot be produced by capitalising anything. */}}
      expression: '${ (.resources // []) | map({ kind: .kind, name: .name, ns: .ns, state: .state, stateLabel: .stateLabel, navHref: .navHref }) }'
  resourcesRefs:
    items: []
