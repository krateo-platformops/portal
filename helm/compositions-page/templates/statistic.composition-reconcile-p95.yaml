{{/* p95 reconcile duration for THIS composition (trace-span Duration, ms). Honest-empty: */}}
{{/* with zero reconciles in the window the value is an em dash — never a fabricated 0 ms. */}}
{{/* The value is the WHOLE label from duration.label ("830 ms", "1.2 s"), with no suffix: */}}
{{/* antd groups a value that looks like a number, and "1,189 ms" read as 1.189 in Italian. */}}
kind: Statistic
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-reconcile-p95
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-reconcile-perf
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: p95 duration
    value: '—'
  widgetDataTemplate:
    - forPath: value
      expression: '${ {{ include "duration.label" . }} .p95 | durationLabel }'
  resourcesRefs:
    items: []
