{{/* /compositions (compositions dashboard, the /incidents dashboard's layout, mockup A4). Top to
     bottom:
       - the header, with Ask Agentiko and Create composition (no subtitle: the breadcrumb above it
         says where this is);
       - the scope (My workloads, Platform, Everything) and, on the same row, the search; the kind
         or search the page is narrowed to, as removable chips;
       - the five figures: NotReady, Degraded, Drift, Paused, Ready;
       - one row: the compositions on the left two thirds (the state chips, Needs attention by
         default, then one card per composition, or with ?view=table the server-paged table), the
         charts on the right third (by state, by kind, needing attention longest).

     #68: this page-root is tenant-readable — a namespace-scoped tenant must see the Compositions
     menu item and its OWN Krateos, so it may never move to an admin-only namespace (#261). Every
     figure, chip and card comes from compositions-list, server-side tenant-scoped.

     krateo.io/filter-keys names the URL params this page's widgets receive. scripts/lint-keyextras.py
     fails any widget reachable from here whose keyExtras misses one, because snowplow declines to
     cache a widget that receives an extra it does not declare (F6). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-compositions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-alias": "/compositions/{namespace}"
    "krateo.io/nav-group": "Operations"
    "krateo.io/nav-icon": "fa-cubes"
    "krateo.io/nav-label": "Compositions"
    "krateo.io/nav-order": "2"
    "krateo.io/nav-path": "/compositions"
    "krateo.io/filter-keys": "projects,namespace,scope,status,kind,q,view"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, namespace, scope, status, kind, q, view]
  apiRef:
    name: compositions-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - listies
    - rows
    vertical: true
    gap: middle
    items:
    - resourceRefId: compositions-page-header
    - resourceRefId: compositions-toolbar
    - resourceRefId: compositions-stats
    - resourceRefId: compositions-main
  {{/* A link that narrows the page by kind or search (Observability's by-kind rows, this page's
       By kind chart) gets its removable chips under the scope; nothing else does. */}}
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "compositions-page-header" }, { resourceRefId: "compositions-toolbar" } ] + (if ((.chips // []) | length) > 0 then [ { resourceRefId: "compositions-active-filters" } ] else [] end) + [ { resourceRefId: "compositions-stats" }, { resourceRefId: "compositions-main" } ] }'
  resourcesRefs:
    items:
    - id: compositions-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: compositions-toolbar
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-toolbar
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
    - id: compositions-active-filters
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-active-filters
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: compositions-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: compositions-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
