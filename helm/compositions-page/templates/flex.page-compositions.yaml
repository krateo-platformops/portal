{{/* Convention page root for /compositions — header (H1 + subtitle) above the */}}
{{/* compositions table. The nav (`menu.sidebar-nav`) points its `compositions` ref here */}}
{{/* (was the bare table) so the page gains a header like the mockup. */}}
{{/* #68: this page-root is tenant-readable — a namespace-scoped tenant must see the Compositions */}}
{{/* menu item and its OWN Krateos, so it may never move to an admin-only namespace (#261). */}}
{{/* Safe: its children (compositions-header/toolbar/table) already live here, and compositions-table */}}
{{/* is server-side tenant-scoped (compositions-list RA), so a tenant sees only its own compositions. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-compositions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-alias": "/compositions/{namespace}"
    "krateo.io/nav-group": "Operations"
    "krateo.io/nav-icon": "fa-cubes"
    "krateo.io/nav-label": "Compositions"
    "krateo.io/nav-order": "2"
    "krateo.io/nav-path": "/compositions"
    "krateo.io/filter-keys": "projects,namespace,scope,status,kind,q,view"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, namespace, scope, status, kind, q, view]
  apiRef:
    name: compositions-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - listies
    - paragraphs
    - collapses
    - buttons
    - tables
    vertical: true
    gap: middle
    items:
    - resourceRefId: compositions-page-header
    - resourceRefId: compositions-filter-bar
    - resourceRefId: compositions-table
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "compositions-page-header" }, { resourceRefId: "compositions-filter-bar" } ] + (if ((.chips // []) | length) > 0 then [ { resourceRefId: "compositions-active-filters" } ] else [] end) + (if .view == "table" then [ { resourceRefId: "compositions-view-toggle" }, { resourceRefId: "compositions-table" } ] else [ { resourceRefId: "compositions-strip" } ] + (if (.readError // "") != "" or (.matched // 0) == 0 or (((.strip.notReady // 0) + (.strip.degraded // 0) + (.strip.drift // 0)) == 0) then [ { resourceRefId: "compositions-calm" } ] else [] end) + (if (.matched // 0) > 0 then [ { resourceRefId: "compositions-groups" }, { resourceRefId: "compositions-view-toggle" } ] else [] end) end) }'
  resourcesRefs:
    items:
    - id: compositions-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: compositions-filter-bar
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-filter-bar
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: compositions-active-filters
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-active-filters
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: compositions-strip
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-strip
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: compositions-calm
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-calm
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: compositions-groups
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-groups
      namespace: {{ $.Values.namespace }}
      resource: collapses
      verb: GET
    - id: compositions-view-toggle
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-view-toggle
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    - id: compositions-table
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-table
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
      slice:
        page: 1
        perPage: 50
