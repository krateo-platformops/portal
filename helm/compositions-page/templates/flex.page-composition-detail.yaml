{{/* Convention page root for /compositions/{namespace}/{name}. Matches the */}}
{{/* enterprise-detail mockup: a pagehead (title + status Tag + subtitle) over a */}}
{{/* 2-column grid (Row, 1.7fr:1fr ≈ size 15/9): left = Specification/Events/Manifest, */}}
{{/* right = Health/Relations/Metadata. Every field is shaped server-side by the */}}
{{/* composition-detail RA. Deferred: object-level live-refresh. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-composition-detail
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-order": "900"
    "krateo.io/nav-path": "/compositions/{namespace}/{name}"
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    vertical: true
    gap: middle
    allowedResources:
      - pageheaders
      - rows
      - listies
      - cards
      - tabs
    items:
      - resourceRefId: composition-detail-page-header
      {{/* COMPOSITION DETAIL REDESIGN, step 1 (approved): the Status card leads, right under the
           header, and holds this composition's incidents, so they no longer sit apart above it. */}}
      - resourceRefId: composition-detail-status-row
      {{/* (was) #6: Incidents strip — troubleshooting reports that analyzed THIS composition. Sits */}}
      {{/* directly under the pagehead so an active incident is visible up front. EXCEPTION-ONLY: */}}
      {{/* the Listy hideWhenEmpty renders nothing for a healthy composition (no incidents), and */}}
      {{/* the vertical Flex gap collapses around the absent child — the calm default shows no strip. */}}
      {{/* The composition's topology and where it is in it (mockup 14), first thing under the */}}
      {{/* header because it answers "what is this made of, and what is it waiting for". Only for a */}}
      {{/* composition whose chart renders an architecture ConfigMap: for every other one the Row's */}}
      {{/* items resolve to [] and it renders nothing, so this page looks exactly as it did before. */}}
      {{/* Step 3 (approved): everything below the Status card sits in four tabs. */}}
      - resourceRefId: composition-detail-tabs
  {{/* The Access card mounts only for a composition that publishes status.url or status.plan, so */}}
  {{/* every other composition neither shows it nor fetches it. The list otherwise matches the */}}
  {{/* static items above, which are what renders if the RESTAction can't be read. */}}
  apiRef:
    name: composition-detail
    namespace: {{ $.Values.namespace }}
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ [ { resourceRefId: "composition-detail-page-header" }, { resourceRefId: "composition-detail-status-row" } ]
        + (if (.access.visible // false) then [ { resourceRefId: "composition-detail-access" } ] else [] end)
        + [ { resourceRefId: "composition-detail-tabs" } ] }
  resourcesRefs:
    items:
      - id: composition-detail-access
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-access
        namespace: {{ $.Values.namespace }}
        resource: cards
        verb: GET
      - id: composition-detail-page-header
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-page-header
        namespace: {{ $.Values.namespace }}
        resource: pageheaders
        verb: GET
      - id: composition-detail-status-row
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-status-row
        namespace: {{ $.Values.namespace }}
        resource: rows
        verb: GET
      - id: composition-detail-tabs
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-tabs
        namespace: {{ $.Values.namespace }}
        resource: tabs
        verb: GET
