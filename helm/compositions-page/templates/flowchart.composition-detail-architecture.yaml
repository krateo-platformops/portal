{{/* The composition's resources as its chart declares them, each drawn in the state the composition */}}
{{/* is in. ONE NODE PER RESOURCE, NEVER A GROUP: a forEach declaration (eight files) is eight nodes, */}}
{{/* uid "arch:<id>/<name>"; any other declaration is one node, uid "arch:<id>". Grouping siblings into */}}
{{/* one "LOCALRESOURCE ×8" node made eight objects read as one, gave them one state and one detail */}}
{{/* ("targetCommitId · 8 of 8") where each has its own, and hid which of them was the exception. */}}
{{/* An edge per ACTIVE dependsOn, drawn from each node of the dependency to each node that waits for */}}
{{/* it (a file waits on the Repository and the Repo; the PullRequest waits on every file). A resource */}}
{{/* whose `when` is false for this composition is not drawn at all — it is not part of this */}}
{{/* composition. A forEach that resolved to no instance is drawn once, named "none", so its edges */}}
{{/* still read. */}}
{{/* EXCEPTION-ONLY (P14): a done node is neutral and carries no marker. The one red on the canvas is */}}
{{/* `exception`, set only for a NotSynced or NotReady condition (Kubernetes' own tokens), and now on */}}
{{/* the very instance that carries it. */}}
{{/* The detail line says what the node is waiting on in the person's terms — the readiness field and */}}
{{/* its value, or what it waits for — and says plainly when this person could not read it: a denied */}}
{{/* object is "not readable with your access", never "not ready". Each instance's `phase` comes from */}}
{{/* the RESTAction, so the rules that decide a state are written once. */}}
{{/* THE NAME IS THE RESOURCE'S FULL NAME. It used to drop the composition's own prefix ("…-source") */}}
{{/* and write a range first … last ("…-000 … 007"); Diego's decision (2026-11-13) is every resource */}}
{{/* by its full name, never trimmed here. Fitting it to the card is the widget's job: the card */}}
{{/* discloses `names` (the full name) and `version` on hover, and its accessible name carries it. */}}
kind: FlowChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: flowchart-composition-detail-architecture
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-architecture
    namespace: {{ $.Values.namespace }}
  widgetData:
    variant: architecture
    data: []
  widgetDataTemplate:
    - forPath: data
      expression: '${ . as $r | def uids($n): if $n.forEach and ($n.instances | length) > 0 then [ $n.instances[] | "arch:" + $n.id + "/" + .name ] else [ "arch:" + $n.id ] end; if .readable != true then [] else [ .nodes[] | select(.present == true) | . as $n | ((.readyWhen // "") | if . == "" then "exists" else ltrimstr(".status.") end) as $field | [ $n.parents[] as $p | ([ $r.nodes[] | select(.id == $p) ][0]) as $pn | if $pn == null then "arch:" + $p else uids($pn)[] end | { uid: . } ] as $parentRefs | (if (.instances | length) == 0 then [ { uid: ("arch:" + .id), kind, name: "none", names: [], version: (.apiVersion // ""), state: .phase, detail: "", parentRefs: $parentRefs } ] else [ .instances[] | . as $i | { uid: (if $n.forEach then "arch:" + $n.id + "/" + .name else "arch:" + $n.id end), kind: $n.kind, name: .name, names: [ .name ], version: ($n.apiVersion // ""), state: .phase, detail: (if .phase == "done" and .read != "ok" then (if .read == "unreadable" then "not readable with your access" else "could not be read" end) elif .phase == "done" then (if $n.readyWhen == null then "" else ($field + " · " + (.value | tostring | if test("^[0-9a-f]{40}$") then .[0:7] else . end)) end) elif .phase == "waiting" then ($field + " · 0 of 1") elif .phase == "withheld" and $n.gateOpen == true then (if $r.compositionNotSynced != null then "not created — the composition is not synced" else "not created yet — its gate is open; the next reconcile creates it" end) elif .phase == "withheld" then ("waits for " + ([ $n.waits[] as $w | $r.nodes[] | select(.id == $w.ref) | (if $w.all then "all " + (.expected | tostring) + " " else "" end) + .kind ] | join(", "))) elif .phase == "unreadable" then "not readable with your access" elif .phase == "unavailable" then "could not be read" else "" end), exception: (.exception // (if $n.gateOpen == true then $r.compositionNotSynced else null end)), parentRefs: $parentRefs } | if .exception == null then del(.exception) else . end ] end)[] ] end }'
