kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-detail-access-plan
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: composition-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: plan
    color: blue
  widgetDataTemplate:
    - forPath: label
      expression: '${ .access.plan // "" }'
    - forPath: color
      expression: '${ .access.planColor // "blue" }'
  resourcesRefs:
    items: []
