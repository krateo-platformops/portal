{{/* The five compositions in an attention state the longest, measured from the transition of
     the condition that put them there (Ready, or Synced for Drift; Degraded has no such time and is
     left out); each row names the state and for how long, and opens the composition. The dot wears
     the colour the cards give that state (compositions-cards): a paused composition is gray, as
     everywhere else, never red (visual audit CMP-9). */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compositions-longest
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, namespace, scope, status, kind, q, view]
  apiRef:
    name: compositions-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    size: small
    split: true
    itemTemplate:
      iconVariant: dot
      color:
        value: '{tone}'
        map:
          failed: red
          degraded: red
          unreadable: orange
          drift: orange
          paused: gray
        default: gray
      primaryText: '{name}'
      subPrimaryText: '{why}'
      navigateTo: '{href}'
      ellipsis: true
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .longest // [] }'
  resourcesRefs:
    items: []
