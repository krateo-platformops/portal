{{/* The five compositions in an attention state the longest, measured from the transition of
     the condition that put them there (Ready, or Synced for Drift; Degraded has no such time and is
     left out); each row names the state and for how long, and opens the composition. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compositions-longest
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, namespace, scope, status, kind, q, view]
  apiRef:
    name: compositions-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    size: small
    split: true
    itemTemplate:
      iconVariant: dot
      color:
        value: red
      primaryText: '{name}'
      subPrimaryText: '{why}'
      navigateTo: '{href}'
      ellipsis: true
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .longest // [] }'
  resourcesRefs:
    items: []
