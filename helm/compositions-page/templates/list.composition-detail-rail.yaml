{{/* Reconciliation convergence band (detail page signature gauge). Fed by the */}}
{{/* composition-resources RA — a SINGLE aggregate gauge: match% fill + orange */}}
{{/* target-tick at 100% + the "NN% match · M/N resources" readout (mirrors the */}}
{{/* mockup `.rail-panel`). The per-managed-resource breakdown lives in the */}}
{{/* Relations card (same RA). Nothing hardcoded: convergencePercent + state derive */}}
{{/* server-side from every managed resource's Ready×Synced / Available / ready-by- */}}
{{/* presence. Reuses the Petrol `bar.variant: rail` engine (cyan fill + orange tick). */}}
{{/* Workload projection outranks resource-match, but MIRRORS the compositions-list rail's */}}
{{/* severity split (the two rails must agree): when the RA says workloadUnhealthy AND the */}}
{{/* managed resources genuinely fail (healthyCount != total) the gauge goes failed-red, fill */}}
{{/* caps at 20, label leads "Unhealthy". When workloadUnhealthy but the resources all MATCH */}}
{{/* (healthyCount == total > 0) — a reconciled composition whose workload is merely rolling */}}
{{/* out / unready — the gauge goes GOLD "degraded" at the true match% (not red-20), matching */}}
{{/* the list rail so clicking a orange row doesn't land on red. "100% match" alone over a down */}}
{{/* workload is still not a green all-clear (orange, with the healthMessage on the sub-line). */}}
{{/* A paused composition's gauge is gray (Krateo is not changing it: nothing is converging), as its */}}
{{/* pill and the list's card are; so is one nothing can assess (Unknown, ZeroEvidence) whose */}}
{{/* resources show no failure. A missing resource (NotFound) is a failure (visual audit CMP-2, CMP-7). */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: list-composition-detail-rail
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-resources
    namespace: {{ $.Values.namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: false
    itemTemplate:
      primaryText: '{name}'
      subPrimaryText: '{ns}'
      bar:
        percent: '{healthPercent}'
        color:
          value: '{railState}'
          map:
            healthy: green
            drift: violet
            pending: orange
            degraded: orange
            failed: red
            paused: gray
            unknown: gray
        label: '{label}'
        variant: rail
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ [ (.workloadUnhealthy == true) as $whBad | (((.total > 0) and (.healthyCount == .total))) as $resOk | { name: "", ns: (if $whBad then (.workloadMessage // "") else "" end), healthPercent: (if ($whBad and ($resOk | not)) then ([.convergencePercent, 20] | min) else .convergencePercent end), railState: (((.composition // {}).state // "") as $cs | if $cs == "paused" then "paused" elif $whBad then (if $resOk then "degraded" else "failed" end) elif .converged then "healthy" elif ((.failedCount // 0) + (.terminalCount // 0) + (.notFoundCount // 0)) > 0 then "failed" elif (.driftCount > 0) then "drift" elif $cs == "unknown" then "unknown" else "pending" end), label: ((if $whBad then (if $resOk then "Degraded · " else "Unhealthy · " end) else "" end) + (.convergencePercent | tostring) + "% match · " + (.healthyCount | tostring) + "/" + (.total | tostring) + " resources" + (if (.unreadCount // 0) > 0 then (" · " + (.unreadCount | tostring) + " not read") else "" end)) } ] }'
  resourcesRefs:
    items: []
