{{/* The Kind facet, written to ?kind= (comma-joined kinds). Each option counts the compositions of
     that kind in this scope under the other filters (portal.facets), largest first, at most 12 plus
     any picked. */}}
kind: Select
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compositions-kind
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, namespace, scope, status, kind, q, view]
  apiRef:
    name: compositions-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    name: kind
    label: Kind
    queryParam: kind
    mode: multiple
    prefix: Kind
    placeholder: All
    size: small
    panelFooter: Counted in compositions in this scope, under the other filters
    options: []
  widgetDataTemplate:
  - forPath: options
    expression: '${ [ ((.facets // [])[] | select(.key == "kind") | .values[]) | { label: .label, value: .value, count: .count } ] }'
  resourcesRefs:
    items: []
