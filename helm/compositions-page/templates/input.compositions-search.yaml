{{/* Search: a composition's name or kind, case-insensitive, written to ?q= on Enter and removed when
     cleared. compositions-list applies it as one more filter, so the facet counts follow it. */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compositions-search
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, namespace, scope, status, kind, q, view]
  widgetData:
    name: q
    queryParam: q
    {{/* The filter applies on SUBMIT (Enter), not per keystroke: say so in the placeholder or the */}}
    {{/* box reads as broken while the user types. */}}
    placeholder: Search by name or kind · press Enter
    allowClear: true
    size: small
  resourcesRefs:
    items: []
