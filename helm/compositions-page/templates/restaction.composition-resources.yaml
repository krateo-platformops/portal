{{/* Per-resource reconciliation rail data (detail page signature). Resolves the */}}
{{/* target composition's managed resources (from ?extras .name/.namespace) and */}}
{{/* FETCHES each to read its live ready state. */}}
{{/* */}}
{{/* Snowplow execution contract (verified against source): a step `filter` sees */}}
{{/* that step's response and the request extras (.extras); the `iterator` expression is evaluated */}}
{{/* against the FULL dict (extras + prior stages) and must yield a JSON array; the */}}
{{/* `path` template is evaluated per yielded element. So: */}}
{{/* crds      → list composition.krateo.io CRDs. */}}
{{/* found     → per CRD, emit THIS composition's managed entries (the step */}}
{{/* filter selects it by the extras' name/ns), each TAGGED with its parent name/ns */}}
{{/* (_cn/_cns) + a reconstructed fetchable GET path (_getpath). */}}
{{/* core-provider's .status.managed[].path now INCLUDES /namespaces/ */}}
{{/* <ns>/ for namespaced kinds (it used to omit it), so _getpath uses */}}
{{/* .path as-is when it already carries /namespaces/ and injects only */}}
{{/* when absent (idempotent for both shapes; issue #152 — double-inject */}}
{{/* → 404 → healthy-by-presence). Cluster-scoped kinds keep .path. */}}
{{/* resources → ITERATOR (full dict) filters _cn/_cns to the target (only the */}}
{{/* target's ~N resources are fetched), GETs each at _getpath, and */}}
{{/* its filter shapes the live object to {kind,name,ns,conditions}. */}}
{{/* Final filter derives per-resource state (Ready×Synced / Available / ready-by- */}}
{{/* presence) + aggregate, folding in the composition's own workload projection */}}
{{/* (workloadUnhealthy/workloadMessage from .status.workloadHealthy/.healthMessage, */}}
{{/* ridden through `found` as _wh/_whMsg) so `converged` can't claim full */}}
{{/* convergence over a crashlooping workload. Nothing hardcoded (the cluster-scoped */}}
{{/* kind list is static k8s API scoping, not derived data). */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: composition-resources
  namespace: {{ $.Values.namespace }}
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    {{/* #72: discover composition TYPES from CompositionDefinitions under a userAccessFilter — NOT a */}}
    {{/* cluster-wide customresourcedefinitions list. The CRD list runs as the CALLER (no UAF → caller */}}
    {{/* token, internal/dynamic/sa_client.go); a namespace-scoped tenant can't list CRDs cluster-wide */}}
    {{/* → 403 → empty → blank rail. Listing CompositionDefinitions cluster-wide under a UAF on */}}
    {{/* `compositiondefinitions` has snowplow list as its SA (cluster-wide grant) then refilter to the */}}
    {{/* CDs the CALLER can list — so every namespace the caller is granted is covered, no hardcoded ns. */}}
    {{/* {plural, version} shape unchanged (found iterates it). */}}
    - name: crds
      path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
      verb: GET
      headers:
        - 'Accept: application/json'
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: compositiondefinitions
        namespaceFrom: .metadata.namespace
      filter: "[.crds.items[]? | select(.status.resource != null and .status.apiVersion != null) | {plural: .status.resource, version: (.status.apiVersion | split(\"/\")[1])}]"
      continueOnError: true
    - name: found
      dependsOn:
        name: crds
        iterator: 'if (.namespace // "") == "" or (.name // "") == "" then [] else [ .crds | arrays | .[] | objects ] | unique_by([.version, .plural]) end'
      {{/* One CLUSTER-SCOPE list per composition kind under a userAccessFilter, as composition-detail */}}
      {{/* reads them (see its `found` for why not a per-namespace list: snowplow's cluster-list collapse */}}
      {{/* read only the first kind for an admin, so nothing resolved on portal 1.8.56). snowplow lists */}}
      {{/* as its SA and keeps the items in namespaces where the CALLER may list that kind, so a */}}
      {{/* namespace-scoped tenant still resolves its own compositions (#72/#74). */}}
      {{/* GATED ON ?extras namespace + name (the input gate, scripts/lint-ra-paths.py): without them */}}
      {{/* the step makes no call. */}}
      path: ${ "/apis/composition.krateo.io/" + (.version) + "/" + (.plural) }
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      userAccessFilter:
        verb: list
        group: composition.krateo.io
        resourcesFrom: "[ (.crds // [])[] | .plural ]"
        namespaceFrom: .metadata.namespace
      {{/* Emit THIS composition's managed entries (the list holds every composition of */}}
      {{/* the kind the caller may list), each tagged with parent _cn/_cns + reconstructed */}}
      {{/* _getpath; the resources iterator still selects the target by _cn/_cns. */}}
      filter: >
        (["clusterroles","clusterrolebindings","namespaces","customresourcedefinitions","clusterissuers","persistentvolumes","storageclasses","nodes","priorityclasses","validatingwebhookconfigurations","mutatingwebhookconfigurations","apiservices","certificatesigningrequests","podsecuritypolicies","ingressclasses","runtimeclasses","csidrivers","csinodes","volumeattachments"]) as $clusterKinds
        | (.extras.name // "") as $n | (.extras.namespace // "") as $ns
        | [ .found.items[]?
            | select(.metadata.name == $n and .metadata.namespace == $ns)
            | . as $comp
            | ($comp.metadata.name) as $cn
            | ($comp.metadata.namespace) as $cns
            | ($comp.status.managed // [])[]
            | . as $m
            | ($m.path | split("/")) as $p
            | ($p[-2]) as $res | ($p[-1]) as $nm | ($p[0:-2] | join("/")) as $pre
            | ($clusterKinds | index($res)) as $cluster
            # core-provider's .status.managed[].path now ALREADY carries /namespaces/<ns>/ for
            # namespaced kinds (verified live: /api/v1/namespaces/<ns>/serviceaccounts/<n>), so
            # inject it ONLY when absent — else the URL doubles the namespace segment → 404, and
            # the fetch-miss silently defaults the resource to healthy (issue #152). Idempotent
            # for both path shapes (old omitted-ns and new included-ns).
            # A path without /namespaces/ is the entry's own answer when the entry says its
            # namespace: core-provider reads namespaced-ness from discovery and records namespace ""
            # for a cluster-scoped child (managedPath, composition-dynamic-controller support.go).
            # The static $clusterKinds list is only for an entry with no namespace field at all: a
            # cluster-scoped kind missing from it (trust-manager's Bundle) had the composition's
            # namespace spliced in, 404'd, and read "Pending" forever (visual audit CMP-7).
            | (if ($m.path | contains("/namespaces/")) then $m.path
               elif ($m | has("namespace")) then
                 (if (($m.namespace // "") | tostring) == "" then $m.path
                  else ($pre + "/namespaces/" + ($m.namespace | tostring) + "/" + $res + "/" + $nm) end)
               elif $cluster != null then $m.path
               else ($pre + "/namespaces/" + $cns + "/" + $res + "/" + $nm) end) as $getpath
            # THE CHILD'S OWN NAMESPACE, read from the path it is fetched at: .../namespaces/<ns>/<res>/<name>,
            # or "" for a cluster-scoped child. It is NOT the composition's namespace. A page chart's
            # composition lives in krateo-system and its widgets in the page's own namespace
            # (krateo-alerts), and portal's demo-system Roles sit beside krateo-system ones. Joining the
            # fetched objects on the composition's namespace matched none of those, so every one read
            # "Pending" although it was fetched (alerts-page on krateo-057: 44 of 45).
            | ($getpath | split("/")) as $q
            | (if ($q | length) >= 4 and $q[-4] == "namespaces" then $q[-3] else "" end) as $rns
            # The parent's workload projection rides on every row (_wh/_whMsg): the final
            # aggregate folds it in, and this step filter is the only place that sees $comp.
            # The parent's own Ready and Synced ride along too (_conds): the final filter reads the
            # composition's state from them (portal.compositionStateDefs), so the verdict says
            # Paused or Unknown of a paused or unassessable composition, never "converging".
            | { _cn: $cn, _cns: $cns, _rns: $rns, _kind: $res, _name: $nm,
                _wh: $comp.status.workloadHealthy, _whMsg: ($comp.status.healthMessage // ""),
                _conds: [ ($comp.status.conditions // [])[] | select(.type == "Ready" or .type == "Synced") ],
                # Real group/version for the resource-view route ($p[1] = "api" for the core group
                # → group "core", version $p[2]; "apis" → group $p[2], version $p[3]) + cluster-scope.
                _grp: (if ($p[1] // "") == "apis" then ($p[2] // "") else "core" end),
                _ver: (if ($p[1] // "") == "apis" then ($p[3] // "v1") else ($p[2] // "v1") end),
                _getpath: $getpath,
                # The group/version's discovery path (the apiresources stage), "" for the core group.
                _gvpath: (if ($p[1] // "") == "apis" then ("/apis/" + ($p[2] // "") + "/" + ($p[3] // "")) else "" end) } ]
    {{/* THE KIND EACH CHILD IS SERVED AS, from the apiserver's discovery of its group/version
         (/apis/<group>/<version>: .resources[] with .name, the plural, and .kind). status.managed
         names a child by its plural only, and a child that was not fetched (missing, refused) has no
         object to read a kind from: the row used to make one up from the plural ("restdefinitions"
         became "Restdefinition", the served kind being RestDefinition; visual audit REL-2). One call
         per group/version this composition's children use, as composition-events resolves its
         plurals; k8s binds system:discovery to system:authenticated, so it answers for any caller.
         Core-group kinds keep the static map in the final filter. Only enriches: continueOnError,
         and a group it cannot read prints the plural as recorded, never a guess. */}}
    - name: apiresources
      dependsOn:
        name: found
        {{/* fetchableTarget over a discovery path (no resource segment) yields its group and
             version, so the path is portal.targetPath over it like every data-driven path here. */}}
        iterator: |
          {{- include "portal.fetchableDefs" . | nindent 10 }}
          .name as $n | .namespace as $ns | [ .found[] | select(._cn == $n and ._cns == $ns and (._gvpath // "") != "") ] | unique_by(._gvpath) | [ .[] | (._gvpath | fetchableTarget) ]
      path: ${ {{ include "portal.targetPath" . }} }
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: discoveryErr
      filter: '[ .apiresources as $r | $r.resources[]? | select(((.name // "") | test("/")) | not) | {group: (($r.groupVersion // "") | split("/")[0]), kind: (.kind // ""), plural: (.name // "")} | select(.group != "" and .kind != "" and .plural != "") ]'
    - name: resources
      dependsOn:
        name: found
        {{/* full-dict context: bind extras then select this composition's entries — only those */}}
        {{/* fetchablePath accepts (_fetchable.tpl): a managed Secret is listed from status.managed */}}
        {{/* but never GET, since snowplow would serve that from a cluster-wide Secrets informer. */}}
        iterator: |
          {{- include "portal.fetchableDefs" . | nindent 10 }}
          .name as $n | .namespace as $ns | [ .found[] | select(._cn == $n and ._cns == $ns) | (._getpath | fetchableTarget) ]
      path: ${ {{ include "portal.targetPath" . }} }
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: resErr
      {{/* Shape each fetched live object to {rkind,rname,rns,conditions} (1-elem */}}
      {{/* array; 404s/Status drop to []). (.resources // .) tolerates either */}}
      {{/* dict-keyed or root-bound response shapes across dispatch paths. */}}
      filter: >
        [ (.resources // .)
          | select(type == "object" and (.kind // "") != "Status" and (.metadata.name // "") != "")
          | { rkind: (.kind // ""), rname: .metadata.name, rns: (.metadata.namespace // ""), conditions: (.status.conditions // []), phase: ((.status.phase // "") | tostring) } ]
  {{/* Authoritative row list = the composition's DECLARED managed resources (.found, */}}
  {{/* target-filtered) → total is always the true managed count, independent of */}}
  {{/* whether every per-resource GET round-tripped (the informer dispatch can drop */}}
  {{/* core kinds). Live state is JOINED from the fetched objects (.resources) by */}}
  {{/* name(+ns); kind prefers the fetched object's kind, falls back to the managed */}}
  {{/* plural. A managed resource with no fetched conditions = healthy-by-presence. */}}
  {{/* LITERAL block (|), not folded (>): folding joins same-indent lines with spaces, */}}
  {{/* so a base-indent jq `#` comment would swallow the code joined after it (the */}}
  {{/* composition-events filter shipped broken exactly this way). */}}
  {{/* A managed resource fetchablePath refuses (a Secret) is a row in state "unread": declared by the */}}
  {{/* composition, never fetched, so neither healthy nor pending — and outside the convergence */}}
  {{/* count (total/healthyCount are of the resources that were checked; unreadCount says how many */}}
  {{/* were not). It does not link to /resources, which would not read it either. */}}
  filter: |
    {{- include "portal.fetchableDefs" . | nindent 4 }}
    {{- include "portal.readyReasonDefs" . | nindent 4 }}
    {{- include "portal.compositionStateDefs" . | nindent 4 }}
    (.name) as $n | (.namespace) as $ns
    | ({"serviceaccounts":"ServiceAccount","configmaps":"ConfigMap","secrets":"Secret","services":"Service","endpoints":"Endpoints","persistentvolumeclaims":"PersistentVolumeClaim","deployments":"Deployment","replicasets":"ReplicaSet","statefulsets":"StatefulSet","daemonsets":"DaemonSet","pods":"Pod","jobs":"Job","cronjobs":"CronJob","clusterroles":"ClusterRole","clusterrolebindings":"ClusterRoleBinding","roles":"Role","rolebindings":"RoleBinding","ingresses":"Ingress","networkpolicies":"NetworkPolicy","namespaces":"Namespace"}) as $kindMap
    | ( [ .found[]? | select(._cn == $n and ._cns == $ns) ] ) as $managed
    # The kind each group's plural is served as (the apiresources stage): "group|plural" -> Kind.
    | ( [ (.apiresources // empty) | .. | objects | select(has("group") and has("kind") and has("plural")) | { key: (.group + "|" + .plural), value: .kind } ] | from_entries ) as $served
    # A child that is NOT THERE: the apiserver's own NotFound for it, among the resources stage's
    # errors (resErr, a list: snowplow records a definite NotFound as a Status with code 404 and the
    # apiserver's message, any other failure as its text). The message names the object exactly,
    # `<plural>[.<group>] "<name>" not found`, so a row is NotFound only on that answer; a fetch
    # that failed any other way (refused, not served) stays Pending, as before.
    | ( [ (.resErr // []) | (if type == "array" then .[] else . end)
          | if type == "object" then (select((.code // 0) == 404) | (.message // "") | tostring) elif type == "string" then . else empty end ] ) as $notFoundMsgs
    | ( [ .resources ] | flatten | map(select(type == "object" and (.rname // "") != "")) ) as $fetched
    | ( $managed | map(
          . as $m
          {{/* A fetched object is this row's when its name and the CHILD's namespace match. The join used
               to take the COMPOSITION's namespace, or any cluster-scoped object of the same name: a child
               in another namespace never matched (read "Pending" though fetched), and a ClusterRole could
               stand in for a Role of the same name.
               Not joined on group or kind: an object snowplow serves from an informer carries no
               apiVersion or kind (dispatchViaInformer marshals obj.Object without TypeMeta), so either
               would drop exactly those rows. Two children with one name in one namespace and different
               kinds (a Role and its RoleBinding) therefore still share the first fetched object. */}}
          | ( [ $fetched[] | select(.rname == $m._name and .rns == $m._rns) ][0] ) as $obj
          | ($obj != null) as $found
          | ($m._kind + (if $m._grp == "core" then "" else "." + $m._grp end) + " \"" + $m._name + "\" not found") as $nfMsg
          | (($found | not) and any($notFoundMsgs[]; . == $nfMsg or endswith(" " + $nfMsg))) as $missing
          | (($obj.conditions) // []) as $c
          | ([ $c[]? | select(.type == "Ready" or .type == "Available") ][0]) as $rc
          {{/* A CRD HAS NO Ready. Its readiness conditions are `Established` and `NamesAccepted`, so it
               used to have conditions (not "conditionless → healthy") and no $rc, and fell through
               every branch to "pending" — forever, whatever its real state (krateo-057's authn-crd).
               The arms are the composition's own rule for a CRD child, in ITS evaluation order
               (core-provider#473, crdReady in childhealth.go), so the portal and the composition's
               Ready never disagree:
                 1. NamesAccepted=False                     → failed, its reason verbatim. Checked
                    FIRST: a name conflict is terminal, even while Established or terminating.
                 2. Established=True and Terminating≠True   → healthy
                 3. anything else                           → converging: Established False/Unknown,
                    no conditions yet (a just-created CRD carries none for a moment), or
                    Terminating=True (still Established). The cdc reports it as Ready=False reason
                    `Creating`; a fresh install must not flash "failed". */}}
          | ($m._kind == "customresourcedefinitions") as $isCrd
          | ([ $c[]? | select(.type == "Established") ][0]) as $established
          | ([ $c[]? | select(.type == "NamesAccepted") ][0]) as $namesAccepted
          | ([ $c[]? | select(.type == "Terminating") ][0]) as $terminating
          | ($isCrd and $namesAccepted.status == "False") as $crdNameConflict
          | ($isCrd and ($crdNameConflict | not) and $established.status == "True" and $terminating.status != "True") as $crdReady
          | ($isCrd and ($crdNameConflict | not) and ($crdReady | not)) as $crdConverging
          | ($rc.status == "True") as $ready
          | ($rc.status == "False") as $notready
          {{/* THE THIRD STATE. A Ready condition is True, False or Unknown, and Unknown used to
               fall off the end of the chain below into "pending" — which reads as PROGRESS about
               something that may be permanently stuck. provider-runtime's words, and the reason
               this is worth changing: a stuck resource looked like it was still working, so an
               operator waited instead of looking.

               Split by REASON, because the two Unknown cases have different causes and different
               fixes. `NotObserved` with Synced=False is "we cannot observe it"; the same reason
               with Synced=TRUE is a contract breach — the provider finished its Observe and never
               set Ready — for which the runtime also records a Warning event, verbatim
               `ReadyNotSetAfterObserve` (reconciler.ReasonReadyNotSetAfterObserve, v1.8.1). */}}
          | ($rc.status == "Unknown") as $unknownReady
          | ($rc.reason // "") as $reason
          {{/* NotObserved and ObserveFailed ARE THE SAME FACT FROM TWO RUNTIMES, and which word
               arrives depends only on whether the provider was built on provider-runtime
               (markNotObserved, pkg/reconciler/ready.go:60, from a failed Connect or Observe) or on
               unstructured-runtime (ObserveFailed, pkg/tools/unstructured/condition/condition.go:50).
               That is an implementation detail no portal user can see, so both get the same STATE
               and the same RANK — otherwise the identical failure sorts differently depending on
               whether the resource came from oasgen-provider or rest-dynamic-controller.

               The LABEL stays verbatim per reason, because the status-pill rule is to print what the
               object says and greppability is the point: an operator reading `ObserveFailed` can
               find that string. Same treatment, own word. */}}
          | (($reason == "NotObserved") or ($reason == "ObserveFailed")) as $observeFailed
          {{/* Ready=False IS NOT ONE THING EITHER, and treating it as one was the mirror of the
               Unknown defect above: `Pending` and `Updating` are genuinely in progress and were
               rendering RED, while `DriftNotConverging` and `AuthorizationDenied` are terminal —
               the controller has stopped and a human must act — and rendered as a transient
               failure. All four come from rest-dynamic-controller and the set is OPEN, so an
               unrecognised Ready=False still falls to `failed` rather than to progress. */}}
          | (($reason == "Pending") or ($reason == "Updating")) as $converging
          | (($reason == "DriftNotConverging") or ($reason == "AuthorizationDenied")) as $terminal
          | (any($c[]?; .type == "Synced" and .status == "False")) as $unsynced
          | (($c | length) == 0) as $noconds
          {{/* EXISTING IS NOT BEING HEALTHY (portal#230). A kind whose existence IS its whole state
               (configuration, access, routing objects) is healthy by presence. Any other kind that
               publishes no conditions reports its health some other way, which this page cannot
               read: a Failed MongoDBCommunity (status.phase) read green "Healthy", 100% match. It is
               now "noReadiness", grey and outside the healthy count, labelled with its own
               status.phase when it has one ("Failed"), verbatim, else NoReadyCondition. A
               PersistentVolumeClaim's phase is Kubernetes' own: Bound is healthy, Pending
               converging, Lost failed; a Namespace's: Active healthy, Terminating converging. */}}
          | ({ "core": ["configmaps", "secrets", "serviceaccounts", "services", "endpoints", "limitranges", "resourcequotas"],
               "rbac.authorization.k8s.io": ["roles", "rolebindings", "clusterroles", "clusterrolebindings"],
               "networking.k8s.io": ["networkpolicies", "ingresses", "ingressclasses"],
               "discovery.k8s.io": ["endpointslices"],
               "scheduling.k8s.io": ["priorityclasses"],
               "storage.k8s.io": ["storageclasses"],
               "admissionregistration.k8s.io": ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"] }[$m._grp] // []
             | index($m._kind) != null) as $presenceKind
          | ($m._grp == "core" and $m._kind == "persistentvolumeclaims") as $isPvc
          | ($m._grp == "core" and $m._kind == "namespaces") as $isNs
          | (($obj.phase) // "") as $phase
          | ($m._getpath | fetchablePath) as $readable
          | {
              {{/* The kind as served: the fetched object's own, else discovery's for its group and
                   plural, else the core map; a group discovery could not read prints the plural as
                   status.managed records it, never a kind made up from it (REL-2). */}}
              kind: (if (($obj.rkind) // "") != "" then $obj.rkind else ($served[$m._grp + "|" + $m._kind] // $kindMap[$m._kind] // $m._kind) end),
              name: $m._name,
              ns: $m._rns,
              # healthy-by-presence applies ONLY to a child we actually FETCHED (a conditionless kind
              # like ServiceAccount/ConfigMap that exists). A managed child we could NOT fetch
              # ($found=false — 404 / API error) is NOT healthy: report it "pending" (issue #152), so
              # it neither shows a green tag nor counts toward convergence.
              state: (if ($readable | not) then "unread"
                      elif $missing then "notFound"
                      elif ($found | not) then "pending"
                      elif $crdNameConflict then "failed"
                      elif $crdReady then "healthy"
                      elif $crdConverging then "converging"
                      elif $noconds and $isPvc and $phase == "Bound" then "healthy"
                      elif $noconds and $isPvc and $phase == "Lost" then "failed"
                      elif $noconds and $isPvc then "converging"
                      elif $noconds and $isNs then (if $phase == "Terminating" then "converging" else "healthy" end)
                      elif $noconds and $presenceKind then "healthy"
                      elif $noconds then "noReadiness"
                      elif $ready and ($unsynced | not) then "healthy"
                      elif $ready and $unsynced then "drift"
                      elif $notready and $converging then "converging"
                      elif $notready and $terminal then "terminal"
                      elif $notready then "failed"
                      elif $unknownReady and $observeFailed and $unsynced then "notObserved"
                      elif $unknownReady and $observeFailed then "readyNotSet"
                      elif $unknownReady then "unknown"
                      {{/* Conditions, but none that says ready for this kind (no Ready/Available, and
                           not a CRD): say so, rather than "pending", which reads as progress. */}}
                      elif $rc == null then "noReadiness"
                      else "unknown" end),
              {{/* LABEL AND COLOUR ARE COMPUTED HERE, not derived from `state` by the widget.
                   The list used to bind `color: value: '{state}'` through a `map:` of five entries
                   and build the label by upper-casing the state's first letter. Both work only for
                   a state the map happens to list: a state with no entry falls through to the raw
                   string as a colour NAME, and getColorCode returns near-black for a name it does
                   not know — so a new state renders as dark ink and nothing reports it.

                   `cluster-compositions` already computes readyLabel/readyColor server-side for
                   exactly this reason. Doing the same here makes the vocabulary and the palette one
                   decision in one place, and the label verbatim rather than re-cased: the status
                   pill rule is a single PascalCase K8s-native token, taken from the object where
                   possible, and `NotObserved` / `ReadyNotSetAfterObserve` / `Unknown` all are. */}}
              stateLabel: (if ($readable | not) then "Unread"
                           elif $missing then "NotFound"
                           elif ($found | not) then "Pending"
                           elif $crdNameConflict then ($namesAccepted.reason // "NamesNotAccepted")
                           elif $crdReady then "Healthy"
                           elif $crdConverging then (if $terminating.status == "True" then "Terminating" else "Creating" end)
                           elif $noconds and $isPvc then (if $phase != "" then $phase else "Pending" end)
                           elif $noconds and $isNs and $phase == "Terminating" then "Terminating"
                           elif $noconds and $isNs then "Healthy"
                           elif ($noconds and $presenceKind) or ($ready and ($unsynced | not)) then "Healthy"
                           elif $noconds then (if $phase != "" then $phase else "NoReadyCondition" end)
                           elif $ready and $unsynced then "Drift"
                           {{/* Verbatim from the object for every reason the runtimes define, so
                                the pill and `kubectl get -o yaml` read the same. */}}
                           elif $notready and ($converging or $terminal) then $reason
                           elif $notready then "NotReady"
                           elif $unknownReady and $observeFailed and $unsynced then $reason
                           {{/* ReadyNotSetAfterObserve IS NOT A REASON — do not look for a const.
                                It is synthesised here from the condition PAIR: a successful Observe
                                that left Ready at the marker breaks provider-runtime's contract, and
                                the runtime records it as a Warning EVENT whose reason is this
                                string (reconciler.ReasonReadyNotSetAfterObserve, v1.8.1). Printing
                                it means the pill matches the event an operator will find. */}}
                           elif $unknownReady and $observeFailed then "ReadyNotSetAfterObserve"
                           elif $unknownReady then "Unknown"
                           elif $rc == null then "NoReadyCondition"
                           else "Unknown" end),
              {{/* notObserved is scored BELOW drift, per provider-runtime: a child we cannot
                   observe is a weaker claim than one we can see has drifted. */}}
              healthPercent: (if ($readable | not) then 0
                              elif $missing then 0
                              elif ($found | not) then 50
                              elif $crdNameConflict then 20
                              elif $crdReady then 100
                              elif $crdConverging then 50
                              elif $noconds and $isPvc then (if $phase == "Bound" then 100 elif $phase == "Lost" then 20 else 50 end)
                              elif $noconds and $isNs then (if $phase == "Terminating" then 50 else 100 end)
                              elif ($noconds and $presenceKind) or ($ready and ($unsynced|not)) then 100
                              elif $ready and $unsynced then 70
                              elif $notready and $converging then 50
                              {{/* Terminal scores BELOW an unrecognised failure: the controller has
                                   stopped and nothing will change it without a human. */}}
                              elif $notready and $terminal then 15
                              elif $notready then 20
                              elif $unknownReady and $observeFailed and $unsynced then 40
                              elif $unknownReady and $observeFailed then 60
                              elif $unknownReady then 50
                              else 50 end),
              # IA F5 + F5-full: composition.krateo.io children drill into the first-class
              # /compositions detail; EVERY other kind drills into the generic /resources view
              # (namespaced → its ns; cluster-scoped → the "cluster" filler; core group → "core").
              # The last-mile is now closed for every managed child, whatever its kind.
              navHref: (if ($readable | not) then ""
                        elif ($m._grp == "composition.krateo.io")
                        then ("/compositions/" + $m._cns + "/" + $m._name)
                        else ("/resources/" + (if $m._rns == "" then "cluster" else $m._rns end) + "/" + $m._grp + "/" + $m._ver + "/" + $m._kind + "/" + $m._name) end)
            } )
      ) as $rows
    | ($rows | map(select(.state != "unread"))) as $checked
    | ($checked | length) as $total
    | ($checked | map(select(.state == "healthy")) | length) as $healthy
    # Workload projection of the COMPOSITION itself (ridden in on _wh/_whMsg): resources can
    # all match declared-vs-actual while the pods behind them crashloop — `converged` must not
    # claim full convergence then, and the rail widget caps/annotates from these two keys.
    # ($managed[0] on an empty list is null → null._wh == false → false: safe when the comp
    # declares no managed resources.)
    | ($managed[0]._wh == false) as $whBad
    | (if $whBad then ($managed[0]._whMsg // "") else "" end) as $whMsg
    # THE COMPOSITION'S OWN STATE, the one every page prints (portal.compositionStateDefs), from the
    # Ready and Synced that ride on every row: the verdict says Paused or Unknown from it. Paused
    # since: when a condition took the ReconcilePaused reason (the annotation carries no time).
    | ({ conditions: ($managed[0]._conds // []), wh: $managed[0]._wh } | compositionVerdict) as $cv
    | ([ ($managed[0]._conds // [])[] | select(.reason == "ReconcilePaused" or .reason == "ReconcileGracefullyPaused") | .lastTransitionTime // empty ] | min) as $pausedAt
    | ([ ($managed[0]._conds // [])[] | select(.type == "Ready") ][0] // {}) as $cready
    | {
        resources: $rows,
        total: $total,
        healthyCount: $healthy,
        unreadCount: (($rows | length) - $total),
        driftCount: ($rows | map(select(.state == "drift")) | length),
        failedCount: ($rows | map(select(.state == "failed")) | length),
        pendingCount: ($rows | map(select(.state == "pending")) | length),
        notFoundCount: ($rows | map(select(.state == "notFound")) | length),
        {{/* Each state counted by its OWN predicate rather than by subtraction, so a state added
             later cannot land in an existing bucket silently — which is how Ready=Unknown ended up
             reported as pending in the first place. The test asserts the counts PARTITION the
             checked rows, which is the only assertion that catches a state counted twice or not at
             all. */}}
        {{/* A state maps to exactly ONE count, and the test asserts the counts sum to total. The
             two new Ready=False states fold into the buckets that match what they MEAN —
             `converging` is progress, `terminal` is a failure — rather than earning chips of their
             own, because the chip row answers "how much of this is wrong", not "how". */}}
        notObservedCount: ($rows | map(select(.state == "notObserved")) | length),
        terminalCount: ($rows | map(select(.state == "terminal")) | length),
        convergingCount: ($rows | map(select(.state == "converging")) | length),
        readyNotSetCount: ($rows | map(select(.state == "readyNotSet")) | length),
        unknownCount: ($rows | map(select(.state == "unknown")) | length),
        noReadinessCount: ($rows | map(select(.state == "noReadiness")) | length),
        convergencePercent: (if $total > 0 then (($healthy * 100 / $total) | floor) else 0 end),
        converged: (($rows | length) > 0 and $healthy == $total and ($whBad | not)),
        workloadUnhealthy: $whBad,
        workloadMessage: $whMsg,
        composition: {
          state: (if ($managed | length) == 0 then "" else $cv.state end),
          stateLabel: (if ($managed | length) == 0 then "" else ($cv.state | compositionStateName) end),
          pausedSince: (if $pausedAt == null then "" else (try ($pausedAt | fromdateiso8601 | ((strftime("%d") | tonumber | tostring) + " " + strftime("%b %H:%M") + " UTC")) catch "") end),
          readyReason: (($cready.reason // "") | tostring),
          readyMessage: (($cready.message // "") | tostring | ltrimstr("Composition health is unknown: "))
        }
      }
