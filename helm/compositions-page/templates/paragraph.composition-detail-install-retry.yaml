{{/* The automatic retries of the first install, while it is not Ready (_install-recovery.tpl). The Status card lists it only then. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-detail-install-retry
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: composition-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ {{ include "portal.installRecoveryDefs" . }} (.detail // {}) | installRetryLine }'
  resourcesRefs:
    items: []
