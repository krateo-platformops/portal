{{/* The composition's REAL status.conditions — NOT a derived "Healthy/Drift/Pending/converged" label. */}}
{{/* Every condition is shown (Ready, Synced, …) with its type + status (True/False) + reason·message; */}}
{{/* a leading dot and a right-aligned status Tag share one colour, chosen by what the condition MEANS */}}
{{/* (see `color` below), not by its raw truth value (this card is the one sanctioned dot+label spot). */}}
{{/* Honest: the raw k8s conditions, all of them, the True/False word kept — PLUS the */}}
{{/* Workload condition the detail RA synthesizes from .status.workloadHealthy == false (same idiom */}}
{{/* as compositions-list), so a CrashLoopBackOff comp shows Workload=False here instead of an */}}
{{/* all-green Ready/Synced pair that hides the failing pods. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: list-composition-detail-conditions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace, status]
  apiRef:
    name: composition-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      {{/* One line per condition, the whole reason · message on hover (P19). The True/False word */}}
      {{/* stays: without it the state would be the dot's colour alone. */}}
      ellipsis: true
      iconVariant: dot
      primaryText: '{type}'
      secondaryText: '{status}'
      secondaryTextAsTag: true
      {{/* reason·message rides on subPrimaryText (the Item.Meta description line the DEFAULT */}}
      {{/* row variant actually renders) — `description` is only painted by the `card` variant */}}
      {{/* (ListView.tsx), so it would silently drop here. */}}
      subPrimaryText: '{desc}'
      {{/* COLOURED BY MEANING, not by the raw True/False (UX review round 3, approved mockup */}}
      {{/* https://claude.ai/artifact/2DzX7yxTtVAb72mTgs1YE7): a pause made Ready=True green and */}}
      {{/* Synced=False red, both ReconcilePaused. The True/False word stays; the colour is `tone`, */}}
      {{/* computed below: ReconcilePaused → paused (gray, both rows); a Ready=False reason core-provider */}}
      {{/* classes as converging (portal.readyReasonDefs) → orange, never red; otherwise True green, */}}
      {{/* False red, anything else gray. 'red' is the palette's crimson failed-hex. */}}
      color:
        value: '{tone}'
        map:
          healthy: green
          failed: red
          converging: orange
          paused: gray
        default: gray
    dataSource: []
  widgetDataTemplate:
    - forPath: dataSource
      {{/* .conditions = raw status.conditions + the synthesized Workload condition (RA-side). */}}
      expression: '${ {{ include "portal.readyReasonDefs" . }} [ (.conditions // [])[] | (.status | tostring) as $s | (.reason // "") as $r | { type: .type, status: $s, desc: ($r + (if ((.message // "") | length) > 0 then (" · " + .message) else "" end)), tone: (if $r == "ReconcilePaused" then "paused" elif .type == "Ready" and $s == "False" and ($r | isConvergingFalse) then "converging" elif $s == "True" then "healthy" elif $s == "False" then "failed" else "unknown" end) } ] }'
  resourcesRefs:
    items: []
