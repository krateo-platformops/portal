{{/* "By kind": the eight largest kinds in scope (listy.compositions-by-kind). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compositions-by-kind-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, namespace, scope, status, kind, q, view]
  widgetData:
    title: "By kind"
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - listies
    items:
    - resourceRefId: compositions-by-kind
  resourcesRefs:
    items:
    - id: compositions-by-kind
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-by-kind
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
