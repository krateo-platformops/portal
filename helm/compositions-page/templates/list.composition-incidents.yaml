{{/* "Incidents" strip on the composition-detail page: one row per Incident whose analysis touched */}}
{{/* this composition (composition-incidents, filtered by the route's .name/.namespace extras). */}}
{{/* hideWhenEmpty removes the strip for a composition with no ACTIVE incidents. Each row opens the */}}
{{/* incident's detail page. */}}
{{/* */}}
{{/* It used to list every incident ever, resolved ones included, each titled by its whole root-cause */}}
{{/* sentence under a line explaining that the rows could be clicked: five 200-character rows */}}
{{/* before the composition's own status. Now: the active ones only, one line each (the full title */}}
{{/* on hover), a header that counts them, and the resolved ones behind a link to /incidents. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-incidents
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell — the composition */}}
  {{/* identity (route params) scopes which incidents this list resolves. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-incidents
    namespace: {{ $.Values.namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: false
    hideWhenEmpty: true
    header: Incidents
    footer: See all incidents →
    footerNavigateTo: /incidents
    itemTemplate:
      ellipsis: true
      navigateTo: '{route}'
      iconVariant: dot
      color:
        value: '{stateColor}'
      primaryText: '{title}'
      secondaryText: '{state}'
      secondaryTextAsTag: true
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .rows // [] }'
  - forPath: header
    expression: '${ "Incidents · " + ((.activeCount // 0) | tostring) + " active" }'
  - forPath: footer
    expression: '${ (.resolvedCount // 0) as $r | if $r > 0 then ($r | tostring) + " resolved · see all incidents →" else "See all incidents →" end }'
  resourcesRefs:
    items: []
