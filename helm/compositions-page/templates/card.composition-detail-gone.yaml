{{/* The body of /compositions/{namespace}/{name} when the composition is not there (portal#577): one
     sentence and the way back, in place of every card the page draws for a live composition. Only
     the page root mounts it, and only when composition-detail says `gone` or `unreadable`. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-composition-detail-gone
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    variant: outlined
    allowedResources:
      - paragraphs
      - buttons
    items:
      - resourceRefId: paragraph-composition-detail-gone
      - resourceRefId: button-composition-detail-gone-back
  resourcesRefs:
    items:
      - id: paragraph-composition-detail-gone
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-gone
        namespace: {{ $.Values.namespace }}
        resource: paragraphs
        verb: GET
      - id: button-composition-detail-gone-back
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-gone-back
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
