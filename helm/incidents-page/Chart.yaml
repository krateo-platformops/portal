apiVersion: v2
name: incidents-page
description: The Krateo Composable Portal /incidents pages, as their own chart in their own namespace
type: application
version: CHART_VERSION
appVersion: CHART_VERSION
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - portal
  - pages
  - incidents
sources:
  - https://github.com/krateo-platformops/portal
annotations:
  krateo.io/category: application
  krateo.io/maturity: stable
  krateoSupportedVersion: ">= 2.5.1"
  # The first frontend-crds that admits what this chart ships: RENDERING, not storage: PageHeader progress and note are filled by a widgetDataTemplate, so no stored field needs them, but a frontend below 1.8.61 draws no progress line and one below 1.8.97 no note, which says a flagged precondition (the frontend line moves in lockstep with frontend-crd).
  # The first frontend-crds that admits what this chart ships: Listy itemTemplate.highlight (frontend 1.8.93), the computed tile border of incidents-stats, whose colour is now `color` straight from the data (no map). Before it, RENDERING, not storage: PageHeader progress is filled by a widgetDataTemplate, so no stored field needs it, but a frontend below 1.8.61 draws no progress line (the frontend line moves in lockstep with frontend-crd).
  # Installer's check-chart-requires-floors refuses a pin below it; lint-pinned-crds checks it still holds.
  krateo.io/requires-frontend-crd: ">= 1.8.97"
