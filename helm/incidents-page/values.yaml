# @schema
# description: The namespace this chart CREATES and installs its page objects into. It is the RBAC boundary the whole chart exists for — a group with no RoleBinding here cannot `list` the page roots, so the portal's sidebar never shows them and the page body 403s on a deep link. The release itself stays wherever the composition is created (krateo-system on the platform install); only the page objects live here. Changing it after install orphans the previous namespace's objects, which Helm will not prune because it no longer renders them.
# type: string
# default: "krateo-incidents"
# @schema
namespace: krateo-incidents

# @schema
# description: Groups granted read of these pages in `namespace`. A group listed here sees /incidents in the sidebar and can open it; a group absent cannot list the page roots, so the entry never renders. `devs` is deliberately NOT a default — keeping it out is the point of the split (#261).
# type: array
# @schema
readerGroups:
  - admins

# @schema
# description: The namespace service-desk-page keeps its tickets in — that chart's `namespace` value. The incident page lists the tickets raised for an incident there (by the `krateo.io/incident-uid` label the raise form writes), as the caller, so only the desk sees them. Set it to the same value as service-desk-page's `namespace`, or the Tickets card reads an empty namespace and says "No ticket yet" for incidents that have tickets. An install with no service desk needs nothing here: the list then 404s and the card does not render.
# type: string
# @schema
serviceDeskNamespace: krateo-service-desk
