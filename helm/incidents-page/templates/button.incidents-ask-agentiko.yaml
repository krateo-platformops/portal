{{/* "Ask Agentiko →" on /incidents — the assistant entry point for the incidents the person is
     looking at. It navigates to THIS page with an ?ask seed the rail consumes on mount, keeping every
     filter param (?status, ?alert, ?age, ?owner, ?q), ?group, ?view and the ?projects= scope, so the
     conversation starts on the same view: with a filter applied the prompt names it and is about
     the incidents it matches, not every incident.

     Same object as service-desk-page's button.request-ask-agentiko — read the comment there. The
     label and `intent: agentiko` are fixed (A4); `type` and `icon` are ignored, so they are not
     set. The header has no primary, so it sits on its own.

     The href is built server-side (incidents-list `.askHref`, @uri-encoded) from the counts, the
     open incidents' titles and root causes, and the alerts firing with no incident, all of which
     the list already read. On a failed read of the incidents it asks what the error means instead
     of describing a quiet platform. The per-alert links in the "Firing alerts with no incident"
     section are separate (`awaiting[].askHref`) and unchanged. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-ask-agentiko
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the prompt differs per filter, and every filter param rides the href. */}}
  keyExtras: [projects, status, alert, age, owner, q, group, view]
  apiRef:
    name: incidents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /incidents
  widgetDataTemplate:
    {{/* Server-built self-page href with the ?ask seed. Falls back to the list — never a 404 —
         if askHref is empty, which incidents-list never makes it, but a render with no data does. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.askHref // "") != "" then .askHref else "/incidents" end) } ] } }'
  resourcesRefs:
    items: []
