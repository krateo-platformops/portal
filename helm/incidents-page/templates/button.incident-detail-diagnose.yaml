{{/* "Diagnose with Autopilot" — a copilot entry-point in the incident-detail action cluster. It */}}
{{/* navigates to THIS incident's own page with an ?ask seed the AutopilotProvider consumes on mount */}}
{{/* (opens the rail pre-seeded with a grounded investigation prompt describing what the incident */}}
{{/* contains, what happened, the likely root cause and how to fix it). The concrete href is baked */}}
{{/* server-side by incident-detail (.diagnoseHref, @uri-encoded), so the click is a plain literal */}}
{{/* navigate — same pattern as button.composition-detail-diagnose. Graceful: if Autopilot is disabled, */}}
{{/* frontend >= 1.3.76 shows an honest "Autopilot is not enabled on this portal" notice and strips the */}}
{{/* ?ask. */}}
{{/* A4 (decided 2026-10-08): every Autopilot entry point is the same object — filled, the wand, */}}
{{/* "Ask Autopilot →". This one was "Diagnose", outlined, and the design lint could not see it: */}}
{{/* its ?ask= link is built in the RESTAction as `diagnoseHref`, not `askHref`. Being filled does */}}
{{/* not take the container's one primary (P6, decided 2026-10-13): it sits beside it. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-diagnose
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Ask Autopilot →
    type: primary
    size: middle
    icon: fa-wand-magic-sparkles
    clickActionId: diagnose
    actions:
      navigate:
        - id: diagnose
          type: navigate
          path: /incidents
  widgetDataTemplate:
    {{/* Server-built self-page href with the ?ask seed. Defensive fallback to the bare /incidents list */}}
    {{/* (never a 404) if diagnoseHref is somehow empty. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "diagnose", type: "navigate", path: (if (.diagnoseHref // "") != "" then .diagnoseHref else "/incidents" end) } ] } }'
  resourcesRefs:
    items: []
