{{/* The second section of /incidents: its title and the firing-alerts-with-no-incident table. The */}}
{{/* page Flex includes it only while incidents-list has such alerts. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-awaiting-section
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - paragraphs
    - tables
    vertical: true
    gap: small
    items:
    - resourceRefId: incidents-awaiting-title
    - resourceRefId: incidents-awaiting
  resourcesRefs:
    items:
    - id: incidents-awaiting-title
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-awaiting-title
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: incidents-awaiting
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-awaiting
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
