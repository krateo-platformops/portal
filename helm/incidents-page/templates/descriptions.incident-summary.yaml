{{/* The Summary card's rows: Why (the root cause), Fix (the apply script's first comment line) and, */}}
{{/* once the analysis assessed it, Who fixes it. Shaped by incident-detail (.summaryItems). */}}
kind: Descriptions
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-summary-desc
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    column: 1
    bordered: false
    size: small
    items: []
  widgetDataTemplate:
    - forPath: items
      expression: '${ .summaryItems // [] }'
  resourcesRefs:
    items: []
