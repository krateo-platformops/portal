{{/* SUMMARY: the incident in three rows at the top of the page (Why, Fix, Who fixes it), so the */}}
{{/* answer comes before the reasoning. Shown only for a structured analysis (sections.summary); a */}}
{{/* prose report shows the prose card instead. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-summary-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    title: Summary
    titleVariant: eyebrow
    variant: outlined
    icon:
      name: fa-clipboard-list
      color: cyan
    items:
    - resourceRefId: incident-summary-desc
  resourcesRefs:
    items:
    - id: incident-summary-desc
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-summary-desc
      namespace: {{ $.Values.namespace }}
      resource: descriptions
      verb: GET
