{{/* REASONING: how the analysis reached the Summary's Why, as one Tabs widget: the reasoning trace, */}}
{{/* the evidence its steps cite by number (log lines, then the resources read), and what it could */}}
{{/* not see or assumed. The page Flex includes it when any tab has data (sections.reasoning). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-why-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    anchorId: incident-why
    title: Reasoning
    titleVariant: eyebrow
    variant: outlined
    icon:
      name: fa-magnifying-glass
      color: cyan
    items:
    - resourceRefId: incident-why-tabs
  resourcesRefs:
    items:
    - id: incident-why-tabs
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-why-tabs
      namespace: {{ $.Values.namespace }}
      resource: tabs
      verb: GET
