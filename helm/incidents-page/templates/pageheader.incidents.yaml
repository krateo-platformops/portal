{{/* The /incidents page header. No counter: the counts live in the strip below it. Its one
     action is "Ask Agentiko →" (button.incidents-ask-agentiko), which carries its own apiRef, so the
     header itself reads nothing. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Every widget on /incidents receives the page's filter params (krateo.io/filter-keys on
       page-incidents); one it does not declare makes snowplow decline to cache it (F6). */}}
  keyExtras: [projects, status, alert, age, owner, q, group, view]
  widgetData:
    title: Incidents
    subtitle: >-
      Each incident tracks one problem an alert caught, from finding its cause until it is fixed or someone closes it.
    allowedResources:
    - buttons
    items:
    - resourceRefId: incidents-ask-agentiko
  resourcesRefs:
    items:
    - id: incidents-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
