{{/* The /incidents page header: the title and "Ask Agentiko →" (button.incidents-ask-agentiko),
     which carries its own apiRef, so the header itself reads nothing. No subtitle: the shell's
     breadcrumb (Observability / Incidents) sits above the title, and the figures below say the
     rest. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Every widget on /incidents receives the page's params (krateo.io/filter-keys on
       page-incidents); one it does not declare makes snowplow decline to cache it (F6). */}}
  keyExtras: [projects, status, range, view, q]
  widgetData:
    title: Incidents
    allowedResources:
    - buttons
    items:
    - resourceRefId: incidents-ask-agentiko
  resourcesRefs:
    items:
    - id: incidents-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
