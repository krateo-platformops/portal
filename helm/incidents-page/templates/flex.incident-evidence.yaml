{{/* The Evidence tab: "Log lines & metrics" (quoted, in full) above "Resources" (a table), one */}}
{{/* numbering across both, the one the reasoning trace cites. Each block shows only with rows. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-evidence
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - paragraphs
    - listies
    - tables
    vertical: true
    gap: middle
    items: []
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ (.sections // {}) as $s
        | (if ($s.evidenceLogs // false) then [ { resourceRefId: "incident-evidence-logs-title" }, { resourceRefId: "incident-evidence-logs" } ] else [] end)
        + (if ($s.evidenceResources // false) then [ { resourceRefId: "incident-evidence-resources-title" }, { resourceRefId: "incident-evidence-resources" } ] else [] end) }
  resourcesRefs:
    items:
    - id: incident-evidence-logs-title
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-evidence-logs-title
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: incident-evidence-logs
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-evidence-logs
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: incident-evidence-resources-title
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-evidence-resources-title
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: incident-evidence-resources
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-evidence-resources
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
---
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-evidence-logs-title
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    text: Log lines & metrics
    variant: eyebrow
  resourcesRefs:
    items: []
---
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-evidence-resources-title
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    text: Resources
    variant: eyebrow
  resourcesRefs:
    items: []
