{{/* The Reasoning trace tab: antd Steps, vertical, one step per reasoningTrace entry, each */}}
{{/* naming the evidence it rests on by the numbers the Evidence tab shows ("Evidence 1, 3"). */}}
{{/* Shaped by incident-detail (.traceItems). */}}
kind: Steps
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-trace
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    orientation: vertical
    size: small
    items: []
  widgetDataTemplate:
  - forPath: items
    expression: '${ .traceItems // [] }'
  - forPath: current
    expression: '${ .traceCurrent // 0 }'
  resourcesRefs:
    items: []
