{{/* The five figures over every incident: Open, Analyzing, Verifying (now), Resolved and the median
     Time to resolve (in the range). The colour and the highlighted border come computed
     (incidents-list `color`, `highlight`; portal.tileDefs, frontend >= 1.8.93): an incident not
     resolved yet is an exception, so Open (red), Analyzing (blue) and Verifying (orange), the
     cards' colours, are coloured and highlighted above 0 only; a 0, Resolved and Time to resolve
     are neutral. The title says the state too, so colour is never the only signal. A failed read
     of the incidents is an empty value (drawn as a muted "—") captioned "could not be read" on
     every tile, never a 0, in orange and highlighted. A state tile opens the list filtered to that state (the
     route of its state chip, every other param kept; Resolved's lists what it counts, the
     incidents resolved in the range); Time to resolve and a failed read are plain. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  apiRef:
    name: incidents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      navigateTo: '{route}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
