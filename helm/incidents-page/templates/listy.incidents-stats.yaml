{{/* The five figures over every incident: Open, Analyzing, Verifying (now), Resolved and the median
     Time to resolve (in the range). Each tile wears the colour the cards give the state it counts
     (incidents-cards), zero or not, so a figure and its cards read as one; Time to resolve is
     Resolved's. The title says the state too, so colour is never the only signal. A failed read
     of the incidents is an empty value (drawn as a muted "—") captioned "could not be read" on
     every tile, never a 0, in orange. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  apiRef:
    name: incidents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      color:
        value: '{tone}'
        map:
          open: red
          analyzing: blue
          verifying: orange
          resolved: green
          unread: orange
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
