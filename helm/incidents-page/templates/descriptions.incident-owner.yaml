{{/* WHOSE FIX IT IS — the owner verdict under "Why did it happen" (card.incident-why.yaml), shaped
     server-side by incident-detail from status.rootCause.owner and ownerEvidence (incident-provider
     0.10.0). The approved mockup's frames A (Krateo), E (your organization) and F (not determined).

     Every part is included by the card only when its data exists: an incident from an older CRD, or
     one whose owner was never assessed, renders exactly as before. */}}

{{/* Category, confidence and owner, one per row. */}}
kind: Descriptions
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-owner-desc
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    column: 1
    bordered: false
    size: small
    items: []
  widgetDataTemplate:
    - forPath: items
      expression: '${ .ownerItems // [] }'
  resourcesRefs:
    items: []
---
{{/* Owner not determined: one quiet line, and the reason next to the verdict — what the analysis
     could not see (status.missingContext). No proposal follows from it. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-owner-unknown
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ' '
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ if (.ownerUnknownText // "") != "" then .ownerUnknownText else " " end }'
  resourcesRefs:
    items: []
---
{{/* "Why Krateo · 2 pieces of evidence" — the caption over the evidence list. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-owner-evidence-title
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ' '
    variant: eyebrow
  widgetDataTemplate:
    - forPath: text
      expression: '${ if (.ownerEvidenceTitle // "") != "" then .ownerEvidenceTitle else " " end }'
  resourcesRefs:
    items: []
---
{{/* What the verdict rests on, one row per piece: the agent's note, the reference it points at (a
     mono pill: `group/Kind/namespace/name`, or a trace id) and its kind as a neutral tag —
     component, config, trace or log. A kind is not a status, so the tag is faint. The note is the
     agent's own sentence about the evidence, never a copied log line (incident-provider docs/api.md). */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-owner-evidence
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: true
    hideWhenEmpty: true
    itemTemplate:
      primaryText: '{title}'
      subPrimaryText: '{ref}'
      subPrimaryTextMono: true
      secondaryText: '{kind}'
      secondaryTextAsTag: true
      color:
        value: faint
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ .ownerEvidenceRows // [] }'
  resourcesRefs:
    items: []
