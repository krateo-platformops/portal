{{/* The Evidence tab's "Log lines & metrics" block: every source that is not one readable object, */}}
{{/* numbered as the reasoning trace cites it. Its ref is the line, the excerpt sits under it in */}}
{{/* full (no ellipsis), and its kind is the tag: Logs, Events, Metrics, or Resource for an object */}}
{{/* ref in no readable format. Shaped by incident-detail (.logRows). */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-evidence-logs
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: true
    hideWhenEmpty: true
    itemTemplate:
      primaryText: '{title}'
      subPrimaryText: '{excerpt}'
      secondaryText: '{kind}'
      secondaryTextAsTag: true
      color:
        value: faint
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ .logRows // [] }'
  resourcesRefs:
    items: []
