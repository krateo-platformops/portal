kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-reanalyze
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    vertical: true
    gap: middle
    allowedResources:
      - paragraphs
      - forms
    items:
      - resourceRefId: incident-reanalyze-intro
      - resourceRefId: incident-reanalyze-form
  resourcesRefs:
    items:
      - id: incident-reanalyze-intro
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: incident-reanalyze-intro
        namespace: {{ $.Values.namespace }}
        resource: paragraphs
        verb: GET
      - id: incident-reanalyze-form
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: incident-reanalyze-form
        namespace: {{ $.Values.namespace }}
        resource: forms
        verb: GET
