{{/* Discard: deletes the Incident CR (the controller's finalizer removes its check pods first). */}}
{{/* Destructive, so requireConfirmation gates it; RBAC is the user's token. On success the page */}}
{{/* returns to /incidents. The target comes from incident-detail (.incidentGvr). */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-discard
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Discard
    icon: fa-trash
    type: default
    danger: true
    size: middle
    clickActionId: discard
    actions:
      rest:
        - id: discard
          type: rest
          resourceRefId: delete-incident
          headers:
            - 'Accept: application/json'
          requireConfirmation: true
          successMessage: Incident discarded
          onSuccessNavigateTo: /incidents
          loading:
            display: true
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: delete-incident
        apiVersion: ${ .incidentGvr.apiVersion }
        resource: ${ .incidentGvr.resource }
        name: ${ .incidentGvr.name }
        namespace: ${ .incidentGvr.namespace }
        verb: DELETE
