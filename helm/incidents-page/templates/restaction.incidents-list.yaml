{{/* /incidents data source (incidents dashboard, mockup A4): one row per Incident
     (incidents.observability.krateo.io, owned by incident-controller), shaped server-side. An
     incident belongs to the alert named by its observability.krateo.io/alert label.

     THE PARAMS. The state is the page's one filter:
       status  analyzing, open, verifying, resolved, closed, or all. Absent, it is open: the page
               opens on what needs someone. Read case-insensitively; a value that is no state
               matches nothing, and its chip set is still drawn so the reader can pick another.
               resolved lists only the incidents RESOLVED IN THE RANGE (resolvedin below), so the
               Resolved figure, its chip's count and the rows are one number; closed, likewise,
               only the incidents CLOSED IN THE RANGE (closedin). The live states (open,
               analyzing, verifying) are what is so now, whenever it began; all is every incident;
       range   24h, 7d (absent) or 30d: the window of the two states an incident ends in (the
               Resolved and Time to resolve figures, the Resolved and Closed chips, lists and donut
               slices) and of the opened-vs-resolved chart;
       view    `table`: the full table instead of the cards;
       q       the search: an incident whose title, cause, target, alert, category or name contains
               it (case-insensitive) is kept, every other one is left out of the whole page (the
               chips, the figures, the charts), as on /compositions. The awaiting alerts are not
               incidents and are not searched.

     OUTPUT.
       rows      the incidents in the picked state (resolved, closed: in the range), newest first: title, cause, state, target (the
                 composition the analysis read, else the first object it read), category (the root
                 cause's), fixReady (an Open incident whose fix can be applied), stateIcon (the
                 card tile's mark for the state);
       counts    per state, the chips' and the donut's: the live states over every incident,
                 Resolved and Closed in the range, as their lists are; all over every incident;
       stats     the five figures: Open, Analyzing, Verifying, Resolved in the range, the median time
                 to resolve in the range; a failed read is "—", never 0. Each tile's tone is the
                 state it counts (the time to resolve is resolved's); `unread` on a failed read.
                 `color` and `highlight` (portal.tileDefs): Open, Analyzing and Verifying in the
                 colour the cards give that state, highlighted, above 0 only; a 0, Resolved and
                 Time to resolve "" and false; a failed read orange and true. route: a state tile (Open, Analyzing,
                 Verifying, Resolved) opens the list filtered to its state, the same route as that
                 state's chip; Time to resolve and a failed read have "" (not clickable);
       chips / viewChips / rangeChips   the state chips, Summary | Full list, the range chips: each a
                 label, a count where it has one, active, and the route that keeps the other params;
       byState   the donut: one slice per state that has incidents;
       trend     opened and resolved per hour (24h) or per day (7d, 30d), one point per bucket;
       ttrWeekly the median time to resolve of each of the last 8 weeks, in `ttrUnit`;
       ttrUnit   the unit the weekly medians are in, the largest that keeps the longest one readable:
                 minutes under 2 h, hours under 3 days, else days (visual audit CHART-3: a chart in
                 minutes ran to 40,000 under a "20 h 49 min" figure);
       awaiting  firing Alerts (state ALERT, not paused) with no open incident, each with an
                 /incidents?ask= Autopilot deep-link and `why`, off alert-provider's OpensIncidents
                 condition: a metric or value Alert never opens one, a counting Alert has not
                 opened one yet. The not-yet ones come first;
       failed    the Incident list could not be read (incidentsError), and readError says why;
       askHref   the header's "Ask Agentiko →": a prompt about the state on screen, keeping every
                 param. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: incidents-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: incidents
      path: /apis/observability.krateo.io/v1alpha1/namespaces/{{ $.Release.Namespace }}/incidents
      verb: GET
      continueOnError: true
      errorKey: incidentsError
    - name: alerts
      path: /apis/observability.krateo.io/v1alpha1/namespaces/{{ $.Release.Namespace }}/alerts
      verb: GET
      continueOnError: true
      errorKey: alertsError
  filter: |
    {{ include "portal.tileDefs" . }}
    def alertlabel: ((.metadata.labels // {})["observability.krateo.io/alert"] // .spec.alertRef.name // "");
    # snowplow ACCUMULATES an errorKey (resolve.go accumulateErrorKey): a list, each element a
    # message string or the apiserver's Status object, so the text is read from either.
    def errtext: if . == null then "" elif type == "array" then map(if type == "object" then (.message // tojson) else tostring end) | join("; ") elif type == "object" then (.message // tojson) else tostring end;
    def epoch: ((tostring | .[0:19] + "Z") | fromdateiso8601?) // null;
    # An alert's display name, as a title. It may open with a decorative emoji (7f414fb stripped it
    # from the page title): drop emoji (symbols, skin tones, the joiner and the emoji variation
    # selector) and keep everything else, an em dash or an accented letter included. Then whitespace
    # runs become one space, trimmed. Same regex on jq and gojq.
    def dispname: gsub("[\\p{So}\\x{1F3FB}-\\x{1F3FF}\\x{200D}\\x{FE0F}]"; "") | gsub("\\s+"; " ") | sub("^ "; "") | sub(" $"; "");
    # A duration in minutes, as the figures show it: "42 min", "2 h 10 min", "3 d 4 h".
    def durlabel: (. | round) as $m
      | if $m < 60 then ($m | tostring) + " min"
        elif $m < 1440 then (($m / 60 | floor) | tostring) + " h" + (if $m % 60 == 0 then "" else " " + (($m % 60) | tostring) + " min" end)
        else (($m / 1440 | floor) | tostring) + " d" + (if ($m % 1440) < 60 then "" else " " + ((($m % 1440) / 60 | floor) | tostring) + " h" end) end;
    def median: sort | length as $n | if $n == 0 then null elif $n % 2 == 1 then .[($n - 1) / 2] else (.[$n / 2 - 1] + .[$n / 2]) / 2 end;
    . as $in
    # Open first: the order of the chips, the donut and the figures (most urgent first).
    | ["open", "analyzing", "verifying", "resolved", "closed"] as $states
    | { analyzing: "Analyzing", open: "Open", verifying: "Verifying", resolved: "Resolved", closed: "Closed" } as $stateNames
    | ((($in.status // "") | tostring | ascii_downcase) | if . == "" then "open" else . end) as $sel
    | ((($in.range // "") | tostring) | if IN("24h", "30d") then . else "7d" end) as $range
    | ({ "24h": 86400, "7d": 604800, "30d": 2592000 }[$range]) as $window
    | ({ "24h": "the last 24 hours", "7d": "the last 7 days", "30d": "the last 30 days" }[$range]) as $rangeText
    | ((($in.view // "") | tostring) == "table") as $tableView
    | ((.projects // "") | tostring) as $projects
    | (($in.q // "") | tostring | sub("^\\s+"; "") | sub("\\s+$"; "")) as $qRaw
    | ($qRaw | ascii_downcase) as $q
    # The params every link on the page carries, in the page's order; one is set by each link.
    | def href($status; $rng; $view):
        [ (if $projects != "" then "projects=" + ($projects | @uri) else empty end),
          (if $status != "open" then "status=" + ($status | @uri) else empty end),
          (if $rng != "7d" then "range=" + $rng else empty end),
          (if $view then "view=table" else empty end),
          (if $qRaw != "" then "q=" + ($qRaw | @uri) else empty end) ]
        | if length == 0 then "/incidents" else "/incidents?" + join("&") end;
      ((.incidents.items) // []) as $items
    | ((.alerts.items) // []) as $alerts
    | (.alertsError != null) as $alertsFailed
    | ($alerts | map({ key: (.metadata.name // ""), value: ((.spec.displayName // "") | dispname) }) | from_entries) as $alertBy
    | now as $now
    | ($items | map(
        (.status.state // "Analyzing") as $state
        | alertlabel as $alert
        | ($alertBy[$alert] // "") as $dn
        | (.spec.triggeredAt // .metadata.creationTimestamp // "") as $at
        | (.status.rootCause.statement // "") as $rc
        | (.status.analyzedResources // []) as $analyzed
        | (([ $analyzed[] | select((.gvr // "") | contains("composition")) ] | first) // $analyzed[0] // null) as $t
        | (.status.howToFix // {}) as $fix
        | {
            name: (.metadata.name // ""),
            # A namespaced list omits .metadata.namespace per item; these incidents are in the namespace just listed.
            namespace: "{{ $.Release.Namespace }}",
            title: (if $dn != "" then $dn elif $alert != "" then $alert elif $rc != "" then $rc else (.metadata.name // "") end),
            # An incident no model analyses is not a failed analysis: its alert is analysed by a person
            # (label observability.krateo.io/analysis=human; alert-provider still writes its reason into
            # status.error), or no analysis agent is installed.
            cause: (if $rc != "" then $rc
                    elif ((.metadata.labels // {})["observability.krateo.io/analysis"] // "") == "human" then "analyzed by a person"
                    elif ($state == "Open" or $state == "Verifying") and ([ (.status.conditions // [])[]? | select(.type == "AnalysisUnavailable" and .status == "True") ] | length) > 0 then "no analysis agent"
                    elif (.status.error // "") != "" then "analysis failed"
                    elif $state == "Analyzing" then "analyzing"
                    else "—" end),
            state: $state,
            stateKey: ($state | ascii_downcase),
            age: (.metadata.creationTimestamp // .spec.triggeredAt // ""),
            triggeredAt: $at,
            sevColor: ({ Open: "var(--red-color)", Verifying: "var(--orange-color)", Resolved: "var(--green-color)" }[$state] // "var(--gray-color)"),
            # The card tile's mark, one per state (audit INC-7): a Resolved card shows a check, never
            # the warning triangle of an Open one. A state this map does not know gets the circle.
            stateIcon: ({ Open: "fa-triangle-exclamation", Analyzing: "fa-magnifying-glass", Verifying: "fa-hourglass-half",
                          Resolved: "fa-circle-check", Closed: "fa-circle-xmark" }[$state] // "fa-circle"),
            alert: $alert,
            # The root cause's category (config, capacity, image, network, dependency, permission,
            # other), capitalized for the card and the table.
            category: ((.status.rootCause.category // "") | if . == "" then "" else (.[0:1] | ascii_upcase) + .[1:] end),
            target: (if $t == null or ($t.name // "") == "" then "" else ((($t.gvr // "") | split("/") | last) as $r | (if $r == "" then "" else $r + "/" end) + $t.name) end),
            # Verifying, but incident-provider gave up: ChecksUnknown=True after its no-verdict runs, and
            # no check runs any more. The state stays Verifying, so the caption must not say one is.
            noVerdict: ($state == "Verifying" and ([ (.status.conditions // [])[]? | select(.type == "ChecksUnknown" and .status == "True") ] | length) > 0),
            fixReady: ($state == "Open" and ((($fix.applyAction // null) | type) == "object" or ($fix.apply // "") != "")),
            resolvedAt: (if $state == "Resolved" then (.status.resolution.at // "") else "" end),
            # When a person or the controller closed it (status.resolution.at, as for Resolved).
            closedAt: (if $state == "Closed" then (.status.resolution.at // "") else "" end)
          }
      ) | sort_by(.triggeredAt) | reverse) as $allRows
    | ($allRows | map(select($q == "" or ([ .title, .cause, .target, .alert, .category, .name ] | map(tostring | ascii_downcase) | any(contains($q)))))) as $rows
    # RESOLVED IN THE RANGE, the one rule of the Resolved figure, its chip and its list: Resolved,
    # resolution.at and triggeredAt both read, resolved no earlier than triggered, within the window.
    | def resolvedin: .stateKey == "resolved"
        and ((.resolvedAt | epoch) as $a | (.triggeredAt | epoch) as $f
             | $a != null and $f != null and $a >= $f and $a >= $now - $window);
      # CLOSED IN THE RANGE, the same rule for the other state an incident ends in: Closed, with a
      # readable resolution.at within the window. One closed with none is in no range.
      def closedin: .stateKey == "closed" and ((.closedAt | epoch) as $a | $a != null and $a >= $now - $window);
      # A row in state $k as its chip counts and lists it: the two ending states in the range.
      def instate($k): if $k == "resolved" then resolvedin elif $k == "closed" then closedin else .stateKey == $k end;
      ([ $rows[] | select(resolvedin) ]) as $resolvedIn
    | ($rows | map(select($sel == "all" or instate($sel)))) as $shown
    | ((.incidentsError // null) | errtext) as $err
    # A FAILED READ IS NOT A QUIET PLATFORM. `continueOnError` plus `// []` turns a refused or
    # failed Incident list into zero rows. The page says so, and the Agentiko prompt must not claim
    # a quiet platform, so the failure is carried out.
    | ($err != "") as $failed
    | ($states | map(. as $k | { key: $k, value: ([ $rows[] | select(instate($k)) ] | length) }) | from_entries
       + { all: ($rows | length) }) as $counts
    # TIME TO RESOLVE: triggered to resolved, in minutes, for each Resolved incident that says when.
    | ([ $rows[] | select(.resolvedAt != "")
         | { at: (.resolvedAt | epoch), from: (.triggeredAt | epoch) }
         | select(.at != null and .from != null and .at >= .from)
         | { at, m: ((.at - .from) / 60) } ]) as $ttr
    | ([ $resolvedIn[] | ((.resolvedAt | epoch) - (.triggeredAt | epoch)) / 60 ] | median) as $ttrMedian
    | ([ $rows[] | select(.stateKey == "open") | .triggeredAt | epoch | select(. != null and . >= $now - 86400) ] | length) as $openedToday
    | ([ $rows[] | select(.noVerdict) ] | length) as $noVerdict
    # A state tile routes as its state's chip does (href, every other param kept); the metric does not.
    | [ { title: "Open", value: $counts.open, caption: (if $openedToday > 0 then ($openedToday | tostring) + " opened in the last 24 hours" else "" end), tone: "open", route: href("open"; $range; $tableView) },
        { title: "Analyzing", value: $counts.analyzing, caption: (if $counts.analyzing > 0 then "root-cause analysis running" else "" end), tone: "analyzing", route: href("analyzing"; $range; $tableView) },
        { title: "Verifying", value: $counts.verifying, caption: (if $counts.verifying == 0 then "" elif $noVerdict == 0 then "fix applied, checks running" elif $noVerdict == $counts.verifying then "fix applied, checks gave no verdict" else (($counts.verifying - $noVerdict) | tostring) + " with checks running, " + ($noVerdict | tostring) + " with no verdict" end), tone: "verifying", route: href("verifying"; $range; $tableView) },
        { title: "Resolved", value: ($resolvedIn | length), caption: ("in " + $rangeText), tone: "resolved", route: href("resolved"; $range; $tableView) },
        { title: "Time to resolve", value: (if $ttrMedian == null then "—" else ($ttrMedian | durlabel) end),
          caption: (if $ttrMedian == null then "nothing resolved in " + $rangeText else "median over " + $rangeText end), tone: "resolved", route: "" } ]
      | map(if $failed then { title, value: "", caption: "could not be read", tone: "unread", route: "" } else . + { value: (.value | tostring) } end)
    # Colour marks an exception (portal.tileDefs): Open, Analyzing and Verifying (an incident not
    # resolved yet) in their colour and highlighted above 0 only; Resolved and Time to resolve neutral.
      | map(tilePaint({ open: "red", analyzing: "blue", verifying: "orange" }; {})) as $stats
    # THE TREND: opened (by triggeredAt) and resolved (by resolution.at) per bucket, the newest
    # bucket the current hour or day, so the chart ends now.
    | (if $range == "24h" then { size: 3600, n: 24, unit: "hour" } elif $range == "30d" then { size: 86400, n: 30, unit: "day" } else { size: 86400, n: 7, unit: "day" } end) as $b
    | ((($now / $b.size) | floor) * $b.size - ($b.n - 1) * $b.size) as $start
    | ([ $rows[] | .triggeredAt | epoch | select(. != null and . >= $start) | ((. - $start) / $b.size | floor) ]) as $openedB
    | ([ $ttr[] | .at | select(. >= $start) | ((. - $start) / $b.size | floor) ]) as $resolvedB
    | ([ range(0; $b.n) as $i | ($start + $i * $b.size) as $t
         | { t: $t, series: "Opened", v: ([ $openedB[] | select(. == $i) ] | length) },
           { t: $t, series: "Resolved", v: ([ $resolvedB[] | select(. == $i) ] | length) } ]) as $trend
    # THE WEEKLY TIME TO RESOLVE: the last 8 weeks, a week with nothing resolved left out.
    | (((($now / 604800) | floor) - 7) * 604800) as $w0
    | ([ range(0; 8) as $i | ($w0 + $i * 604800) as $t
         | ([ $ttr[] | select(.at >= $t and .at < $t + 604800) | .m ] | median) as $m
         | select($m != null) | { t: $t, m: $m } ]) as $ttrWeeks
    | (([ $ttrWeeks[] | .m ] | max) // 0) as $ttrMax
    | (if $ttrMax < 120 then { unit: "minutes", per: 1 } elif $ttrMax < 4320 then { unit: "hours", per: 60 } else { unit: "days", per: 1440 } end) as $ttrU
    | ([ $ttrWeeks[] | { t, v: (if $ttrU.per == 1 then (.m | round) else ((.m / $ttrU.per * 10 | round) / 10) end) } ]) as $ttrWeekly
    | ([ $allRows[] | select(.stateKey != "resolved" and .stateKey != "closed") | .alert ] | unique) as $openAlerts
    | ([ $alerts[]
         | select((.status.state // "") == "ALERT")
         | select(((.metadata.annotations // {})["krateo.io/paused"] // "") != "true")
         | select((.metadata.name // "") as $a | ($openAlerts | index($a)) == null)
         | ([ (.status.conditions // [])[] | select(.type == "OpensIncidents") ] | .[0] // {}) as $c
         # never: the condition says this Alert opens no incidents (a metric or a value), so this
         # list is the only place it is seen; otherwise its incident is not opened yet.
         | ($c.status == "False") as $never
         | { name: (.spec.displayName // .metadata.name // ""),
             state: (.status.state // "ALERT"),
             never: $never,
             why: (if $never then (if $c.reason == "AggregatedValue" then (if .status.type == "Metric" then "Metric · opens no incidents" else "Value · opens no incidents" end)
                                   else "Opens no incidents" end)
                   elif $c.status == "True" then "Incident not opened yet"
                   else "" end),
             askHref: ("/incidents?ask=" + (("Investigate the \"" + (.spec.displayName // .metadata.name // "this alert") + "\" observability alert — it is firing but has no open incident."
               + (if $never and ($c.message // "") != "" then " It never opens one: " + $c.message else "" end)
               + " Run a root-cause analysis and give me the concrete next steps.") | @uri)) }
       ] | sort_by(.never) | .[0:8]) as $awaiting
    | def n($k; $one; $many): ($k | tostring) + " " + (if $k == 1 then $one else $many end);
      def cap($k): if length > $k then (.[0:($k - 1)] + "…") else . end;
      # One incident in a prompt: its title, its root cause when there is one, and the DAY it was
      # triggered — not an age, which this cached string would go on repeating.
      def item: "\"" + (.title | cap(110)) + "\""
        + (if .cause != "" and .cause != "—" and .cause != .title then " — " + (.cause | cap(160)) else "" end)
        + (if .triggeredAt != "" then " (triggered " + .triggeredAt[0:10] + ")" else "" end);
      def numbered: .[0:8] | to_entries | map(((.key + 1) | tostring) + ". " + (.value | item)) | join(" ");
      ([ $awaiting[] | .name ] | join(", ")) as $awaitingNames
    # The alerts are a second read: when it failed, "no alert is firing" would be a claim nobody
    # checked, so the prompt says the alerts were not read instead.
    | (if $alertsFailed then "an unknown number of alerts firing with no incident (the alerts could not be read)"
       elif ($awaiting | length) == 0 then "no alert firing without an incident"
       else n($awaiting | length; "alert"; "alerts") + " firing with no incident (" + $awaitingNames + ")" end) as $awaitingText
    | ([ { key: "analyzing", noun: "incidents still being analyzed", active: true },
         { key: "open", noun: "open incidents", active: true },
         { key: "verifying", noun: "incidents being verified", active: true },
         { key: "resolved", noun: ("incidents resolved in " + $rangeText), active: false },
         { key: "closed", noun: ("incidents closed in " + $rangeText), active: false } ]
       | map(select(.key == $sel)) | first) as $st
    # THE PROMPT IS ABOUT THE STATE ON SCREEN, and the link keeps every param.
    | (if $failed then
         "The incidents on this page could not be read (" + ($err | cap(300)) + "). Explain what that error means and what to check."
       elif ($allRows | length) == 0 then
         "There are no incidents on this platform, and " + $awaitingText + "."
         + (if ($awaiting | length) > 0 then " Tell me which alert to investigate first and why — grounded in the evidence on this page."
            else " Tell me whether anything on this page needs attention." end)
       elif ($rows | length) == 0 then
         "No incident matches the search \"" + ($qRaw | cap(80)) + "\"; " + n($allRows | length; "incident does"; "incidents do") + " not, with "
         + $awaitingText + ". Tell me whether anything on this page needs attention."
       elif $sel == "all" then
         ([ $rows[] | select(.stateKey == "open") ]) as $openAll
         | "Triage my incidents: " + ($counts.open | tostring) + " open, " + ($counts.verifying | tostring) + " verifying, "
           + ($counts.analyzing | tostring) + " still being analyzed, and " + $awaitingText + "."
           + (if ($openAll | length) == 0 then ""
              elif ($openAll | length) == 1 then " The open one is: " + ($openAll | numbered) + "."
              else " The open ones are: " + ($openAll | numbered) + "." end)
           + " Tell me which to work on first, whether any share a cause, and the next step for each — grounded in the evidence on this page."
       elif $st == null then
         "No incident is in the state \"" + ($sel | cap(40)) + "\"; my " + n($rows | length; "incident is"; "incidents are")
         + " in other states, with " + $awaitingText + ". Tell me whether anything here needs attention — grounded in the evidence on this page."
       elif ($shown | length) == 0 and ($sel == "resolved" or $sel == "closed") then
         "No incident was " + $sel + " in " + $rangeText + "; my " + n($rows | length; "incident is"; "incidents are")
         + " in other states or " + $sel + " before that, with " + $awaitingText + ". Tell me whether anything here needs attention — grounded in the evidence on this page."
       elif ($shown | length) == 0 then
         "I have no " + $st.noun + "; my " + n($rows | length; "incident is"; "incidents are") + " in other states, with "
         + $awaitingText + ". Tell me whether anything here needs attention — grounded in the evidence on this page."
       elif $st.active then
         "Triage my " + $st.noun + ": " + ($shown | length | tostring) + " of " + n($rows | length; "incident"; "incidents") + ". "
         + (if ($shown | length) == 1 then "It is: " else "They are: " end) + ($shown | numbered) + "."
         + " Tell me which to work on first, whether any share a cause, and the next step for each — grounded in the evidence on this page."
       else
         "Review my " + $st.noun + ": " + ($shown | length | tostring) + " of " + n($rows | length; "incident"; "incidents") + ". "
         + (if ($shown | length) == 1 then "It is: " else "They are: " end) + ($shown | numbered) + "."
         + " Tell me whether any looks " + $st.key + " without its cause being fixed, and whether any is likely to come back — grounded in the evidence on this page."
       end
       + (if $q != "" and ($rows | length) > 0 then " These are only the incidents matching the search \"" + ($qRaw | cap(80)) + "\"." else "" end)) as $prompt
    | {
        rows: $shown,
        matched: ($shown | length),
        total: ($rows | length),
        status: $sel,
        q: $qRaw,
        range: $range,
        view: (if $tableView then "table" else "" end),
        counts: $counts,
        stats: $stats,
        chips: ([ ($states[] | { key: ., label: $stateNames[.] }), { key: "all", label: "All" } ]
                | map({ label, count: ($counts[.key] // 0), active: (.key == $sel), route: href(.key; $range; $tableView) })),
        viewChips: [ { label: "Summary", active: ($tableView | not), route: href($sel; $range; false) },
                     { label: "Full list", active: $tableView, route: href($sel; $range; true) } ],
        rangeChips: ([ "24h", "7d", "30d" ] | map({ label: ., active: (. == $range), route: href($sel; .; $tableView) })),
        byState: ([ $states[] | { state: $stateNames[.], count: $counts[.] } | select(.count > 0) ]),
        trend: $trend,
        trendUnit: $b.unit,
        ttrWeekly: $ttrWeekly,
        ttrUnit: $ttrU.unit,
        ttrMedian: (if $ttrMedian == null then "" else ($ttrMedian | durlabel) end),
        projects: $projects,
        awaiting: $awaiting,
        awaitingCount: ($awaiting | length),
        alertsFailed: $alertsFailed,
        failed: $failed,
        readError: $err,
        askHref: (href($sel; $range; $tableView) as $h | $h + (if ($h | contains("?")) then "&" else "?" end) + "ask=" + ($prompt | @uri))
      }
