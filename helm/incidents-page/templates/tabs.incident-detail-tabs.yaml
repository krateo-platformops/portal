{{/* The incident page's reference material, one tab open at a time so the page stays short: the */}}
{{/* Incident, the Alert that opened it (while it exists), Apply runs (once Run apply ran) and */}}
{{/* Similar incidents (when there are any), gated on incident-detail's sections. */}}
kind: Tabs
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-tabs
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - yamlviewers
    - flexes
    - listies
    items:
    - label: Incident
      resourceRefId: incident-manifest
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ (.sections // {}) as $s
        | [ { label: "Incident", resourceRefId: "incident-manifest" } ]
        + (if ($s.alertManifest // false) then [ { label: "Alert", resourceRefId: "incident-alert-manifest" } ] else [] end)
        + (if ($s.applyRuns // false) then [ { label: (.applyRunsLabel // "Apply runs"), resourceRefId: "incident-apply-runs-flex" } ] else [] end)
        + (if ($s.similar // false) then [ { label: "Similar incidents", resourceRefId: "incident-similar" } ] else [] end) }
  resourcesRefs:
    items:
    - id: incident-manifest
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-manifest
      namespace: {{ $.Values.namespace }}
      resource: yamlviewers
      verb: GET
    - id: incident-alert-manifest
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-alert-manifest
      namespace: {{ $.Values.namespace }}
      resource: yamlviewers
      verb: GET
    - id: incident-apply-runs-flex
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-apply-runs-flex
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: incident-similar
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-similar
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
