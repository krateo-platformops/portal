{{/* Page root for /incidents: page header, state filter chips (live counts), the incident table */}}
{{/* (one row per Incident, row click → detail) and, only while there are any, the "Firing alerts */}}
{{/* with no incident" section (a second table, each alert saying why it has none). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-incidents
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Observability"
    "krateo.io/nav-icon": "fa-triangle-exclamation"
    "krateo.io/nav-label": "Incidents"
    "krateo.io/nav-order": "12"
    "krateo.io/nav-path": "/incidents"
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. `awaitingCount` */}}
  {{/* does not follow the ?status= chip. */}}
  keyExtras: [projects]
  apiRef:
    name: incidents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - tables
    - listies
    vertical: true
    gap: middle
    items:
    - resourceRefId: incidents-page-header
    - resourceRefId: incidents-status-chips
    - resourceRefId: incidents-table
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "incidents-page-header" }, { resourceRefId: "incidents-status-chips" }, { resourceRefId: "incidents-table" } ] + (if ((.awaitingCount // 0) > 0) then [ { resourceRefId: "incidents-awaiting-section" } ] else [] end) }'
  resourcesRefs:
    items:
    - id: incidents-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: incidents-status-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-status-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: incidents-table
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-table
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
    - id: incidents-awaiting-section
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-awaiting-section
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
