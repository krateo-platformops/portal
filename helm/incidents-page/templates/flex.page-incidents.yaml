{{/* /incidents (incidents dashboard, mockup A4). Top to bottom:
       - the header, with Ask Agentiko (no subtitle: the breadcrumb above it says where this is);
       - the time range (24h, 7d, 30d): the window of the Resolved and Time to resolve figures and
         of the opened-vs-resolved chart;
       - the five figures: Open, Analyzing, Verifying, Resolved, Time to resolve;
       - one row: the incidents on the left two thirds (the state chips, default Open, then one
         card per incident, or with ?view=table the full table), the charts on the right third
         (by state, opened vs resolved, time to resolve per week, the alerts firing with no
         incident).

     krateo.io/filter-keys names the URL params this page's widgets receive. scripts/lint-keyextras.py
     fails any widget reachable from here whose keyExtras misses one, because snowplow declines to
     cache a widget that receives an extra it does not declare (F6). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-incidents
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Observability"
    "krateo.io/nav-icon": "fa-triangle-exclamation"
    "krateo.io/nav-label": "Incidents"
    "krateo.io/nav-order": "12"
    "krateo.io/nav-path": "/incidents"
    "krateo.io/filter-keys": "projects,status,range,view"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view]
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - listies
    - rows
    vertical: true
    gap: middle
    items:
    - resourceRefId: incidents-page-header
    - resourceRefId: incidents-range-group
    - resourceRefId: incidents-stats
    - resourceRefId: incidents-main
  resourcesRefs:
    items:
    - id: incidents-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: incidents-range-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-range-group
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: incidents-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: incidents-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
