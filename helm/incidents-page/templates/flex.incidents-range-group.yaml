{{/* The /incidents time range: "Time range" and the 24h / 7d / 30d chips, as on /observability
     (obs-range-group). It sets the window of the Resolved and Time to resolve figures and of the
     opened-vs-resolved chart, and of the two states an incident ends in: the Resolved and Closed
     chips, their cards and table, and their slices of the donut. The live states (Open,
     Analyzing, Verifying) are what is so now, so they are not windowed. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-range-group
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  widgetData:
    allowedResources:
    - listies
    - paragraphs
    gap: small
    align: center
    wrap: true
    items:
    - resourceRefId: incidents-range-label
    - resourceRefId: incidents-range-chips
  resourcesRefs:
    items:
    - id: incidents-range-label
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-range-label
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: incidents-range-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-range-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
