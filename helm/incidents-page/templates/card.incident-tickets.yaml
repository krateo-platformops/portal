{{/* "Zendesk requests for this incident" — the requests raised for it through the service desk, and
     "Raise a Zendesk request". (The objects keep their `incident-tickets…` names: renaming a widget
     buys nothing a reader sees, and every reference to it would move with it.)

     The rows are the ZendeskRequests carrying `krateo.io/incident-uid: <this incident's uid>`, listed
     by incident-detail across the namespaces the CALLER may list (a userAccessFilter, refiltered as
     the caller), so each person sees their own organisation's requests for it. With none the card
     says so and offers the raise. A read that failed says that, never "No Zendesk request yet". A
     cluster that does not serve the kind (a 404) gets no card.

     "Raise a Zendesk request" is always there, for a reader who disagrees with the verdict or wants
     one anyway: the same pre-filled raise form the proposal opens. Who may raise one is the
     organisation's own RBAC on zendeskrequests, not this page. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-tickets-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Zendesk requests for this incident
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - listies
    - buttons
    extraRefId: incident-raise-ticket
    items: []
  widgetDataTemplate:
    - forPath: items
      expression: '${ if ((.sections // {}).ticketRows // false) then [ { resourceRefId: "incident-tickets-list" } ] else [] end }'
    - forPath: headerLeft
      expression: '${ .ticketsNote // "" }'
  resourcesRefs:
    items:
    - id: incident-tickets-list
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-tickets-list
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: incident-raise-ticket
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-raise-ticket
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
---
{{/* One row per request, most recently updated first: its subject, its Zendesk number (mono), its
     status pill — word and colour from incident-detail, which reads them through the same
     _zendesk.tpl as the service desk — and when it last changed. A row opens the request's page in
     the service desk. No link to Zendesk itself: the requester Zendesk records is the organisation's
     support account, so a person could not open it there. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-tickets-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: true
    hideWhenEmpty: true
    itemTemplate:
      primaryText: '{subject}'
      subPrimaryText: '{zendesk}'
      subPrimaryTextMono: true
      secondaryText: '{label}'
      secondaryTextAsTag: true
      subSecondaryText: '{updated}'
      navigateTo: /service-desk/{namespace}/{name}
      {{/* The colour is already chosen (_zendesk.tpl); this map only hands each palette name through. */}}
      color:
        value: '{color}'
        map:
          slate: slate
          gold: gold
          faint: faint
          red: red
          orange: orange
          gray: gray
        default: gray
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ .ticketRows // [] }'
  resourcesRefs:
    items: []
---
{{/* "Raise a Zendesk request" — the card header's action: the service desk's raise form, pre-filled
     from this incident (`raiseHref`). A default button: the proposal, when there is one, holds the
     primary. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-raise-ticket
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Raise a Zendesk request
    icon: fa-plus
    type: default
    size: small
    clickActionId: raise
    actions:
      navigate:
        - id: raise
          type: navigate
          path: /service-desk/new
  widgetDataTemplate:
    - forPath: actions
      expression: '${ { navigate: [ { id: "raise", type: "navigate", path: (if (.raiseHref // "") != "" then .raiseHref else "/service-desk/new" end) } ] } }'
  resourcesRefs:
    items: []
