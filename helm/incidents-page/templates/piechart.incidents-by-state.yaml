{{/* The incidents by state, every incident (not the picked state alone), a slice per state that has
     any, coloured as the cards and the table colour the state. */}}
kind: PieChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-by-state
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  apiRef:
    name: incidents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    angleField: count
    colorField: state
    colorMap:
      Open: red
      Analyzing: blue
      Verifying: orange
      Resolved: green
      Closed: gray
    innerRadius: 60
    legend: true
    legendPosition: right
    height: 180
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ if .failed then [] else (.byState // []) end }'
  resourcesRefs:
    items: []
