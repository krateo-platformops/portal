{{/* The incident meta line as a Descriptions list: Started, Analyzed and how it ended, each */}}
{{/* shaped server-side by incident-detail (.metaItems, absolute times) and omitted when unknown. */}}
kind: Descriptions
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-meta-desc
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    {{/* Label/value pairs inline under the title and chips, not a stacked table. */}}
    column: 3
    variant: default
    bordered: false
    size: small
    items: []
  widgetDataTemplate:
    - forPath: items
      expression: '${ .metaItems // [] }'
  resourcesRefs:
    items: []
