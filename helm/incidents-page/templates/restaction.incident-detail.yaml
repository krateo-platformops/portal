{{/* Data source for ONE Incident (incidents.observability.krateo.io, owned by incident-controller) */}}
{{/* — /incidents/{namespace}/{name}; the route params ride in as ?extras .name/.namespace. */}}
{{/* Reads the incident, its alert (spec.alertRef), the namespace's incidents (for "#N of this */}}
{{/* alert" and Similar incidents) and its Run apply runs, and shapes every section server-side. */}}
{{/* `sections` gates which sections the page renders, so none renders over empty data. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: incident-detail
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: incident
      dependsOn:
        name: ""
        iterator: '[ { namespace: (.namespace // "{{ $.Release.Namespace }}"), name: (.name // "") } | select(.name != "") ]'
      path: ${ "/apis/observability.krateo.io/v1alpha1/namespaces/" + .namespace + "/incidents/" + .name }
      verb: GET
      continueOnError: true
      errorKey: incidentError
    {{/* Incidents live in their alert's namespace, so this list holds every incident of the same */}}
    {{/* alert (label observability.krateo.io/alert, matched in the filter). */}}
    - name: incidents
      path: ${ "/apis/observability.krateo.io/v1alpha1/namespaces/" + (.namespace // "{{ $.Release.Namespace }}") + "/incidents" }
      verb: GET
      continueOnError: true
      errorKey: incidentsError
    {{/* The incident's Run apply runs (incidentapplies.observability.krateo.io, incident-controller): */}}
    {{/* one object per click, in the incident's namespace, matched on spec.incidentRef.name in the */}}
    {{/* filter (they carry no label). A missing CRD or a 403 leaves the list empty and hides Run apply. */}}
    - name: incidentApplies
      path: ${ "/apis/observability.krateo.io/v1alpha1/namespaces/" + (.namespace // "{{ $.Release.Namespace }}") + "/incidentapplies" }
      verb: GET
      continueOnError: true
      errorKey: incidentAppliesError
    {{/* The Zendesk requests raised for this incident: service-desk-page's raise form labels a
         request raised from here `krateo.io/incident-uid: <this incident's uid>` (a uid and not the
         name, because an incident name can pass the 63 characters a label value may hold).
         Requests live in each organisation's own namespace, so this lists the cluster-scope
         collection under a userAccessFilter, as service-desk-page's queue does: snowplow lists with
         its own ServiceAccount and keeps only the objects in namespaces where the CALLER may list
         zendeskrequests. That refilter is snowplow's RBAC evaluator, not jq; the filter below then
         only picks this incident's requests out of what the caller may already see. A literal path:
         nothing to gate, and a cluster without the kind answers 404, which hides the card. */}}
    - name: zendeskRequests
      path: /apis/zendesk.ogen.krateo.io/v2/zendeskrequests
      verb: GET
      userAccessFilter:
        verb: list
        group: zendesk.ogen.krateo.io
        resource: zendeskrequests
        namespaceFrom: .metadata.namespace
      continueOnError: true
      errorKey: zendeskRequestsError
    - name: alert
      dependsOn:
        name: incident
        iterator: '[ { namespace: ((.incident.spec.alertRef.namespace)? // .namespace // "{{ $.Release.Namespace }}"), name: ((.incident.spec.alertRef.name)? // "") } | select(.name != "") ]'
      path: ${ "/apis/observability.krateo.io/v1alpha1/namespaces/" + .namespace + "/alerts/" + .name }
      verb: GET
      continueOnError: true
      errorKey: alertError
  {{/* Literal `|` block: the filter carries `#` comments, which a folded block would join into */}}
  {{/* one line and so comment out the rest of the program. */}}
  filter: |
    {{- include "servicedesk.requestDefs" . | nindent 4 }}
    # fromdateiso8601 takes `...SSZ` only: drop a fractional part and fold a +00:00 offset to Z.
    def epoch: (if type == "string" then (sub("\\.[0-9]+"; "") | sub("(\\+00:?00)$"; "Z")) else "" end) | (fromdateiso8601? // null);
    # An absolute time, never one relative to now: the page is cached until the incident changes, and
    # an Incident that does not change is not written, so "2m ago" would stay "2m ago".
    def stamp: (. // "") as $s | ($s | epoch) as $t
      | if $t == null then ($s | tostring | .[0:10]) else ($t | strftime("%Y-%m-%d %H:%M UTC")) end;
    def clean: gsub("[^ -~]"; "") | sub("^ +"; "") | sub(" +$"; "");
    def alertlabel: ((.metadata.labels // {})["observability.krateo.io/alert"] // .spec.alertRef.name // "");
    def when: (.spec.triggeredAt // .metadata.creationTimestamp // "");
    def isnum: (type == "number");
    # A result's outcome in words; exit is absent for a timeout, a pod that never ran, and a hand-run apply.
    def outcome: (.script // "") as $sc | (.exit // null) as $x
      | if $sc == "apply" then (if ($x | isnum) | not then "applied by hand" elif $x == 0 then "applied" else "apply failed" end)
        elif ($x | isnum) | not then "unknown: timed out or never ran"
        elif $x == 0 then (if $sc == "verify" then "fixed" else "gone" end)
        elif $x == 1 then "still holds"
        else "unknown" end;
    def fence: (if test("```") then "````" else "```" end);
    # 1 → "1st", 12 → "12th", 23 → "23rd".
    def ordinal: (. % 100) as $h | (. % 10) as $u
      | tostring + (if $h >= 11 and $h <= 13 then "th" elif $u == 1 then "st" elif $u == 2 then "nd" elif $u == 3 then "rd" else "th" end);
    # A source ref naming one object as <gvr>/<namespace>/<name> (the RCA prompt's format; namespace
    # empty for a cluster-scoped object) → {gvr, namespace, name}; anything else → null. A leading
    # "k8s:", a "core/" group and a cluster-scoped object written without the empty namespace are
    # read too, since analyses written before the format used them.
    def objref:
      def gvrok: test("^([a-z0-9]([-a-z0-9.]*[a-z0-9])?/)?v[0-9][a-z0-9-]*/[a-z0-9]+$");
      def nameok: test("^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$");
      (if type == "string" then (sub("^k8s:"; "") | sub("^core/"; "") | split("/")) else [] end) as $p
      | if ($p | length) < 3 or (($p[-1] | nameok) | not) then null
        elif ($p[:-2] | join("/") | gvrok) and ($p[-2] == "" or ($p[-2] | nameok)) then { gvr: ($p[:-2] | join("/")), namespace: $p[-2], name: $p[-1] }
        elif ($p[:-1] | join("/") | gvrok) then { gvr: ($p[:-1] | join("/")), namespace: "", name: $p[-1] }
        else null end;
    # An object's page: its composition page for a composition.krateo.io kind, else /resources.
    def objroute: (.gvr | split("/")) as $g
      | (if ($g | length) >= 3 then $g[0] else "core" end) as $grp
      | (if ($g | length) >= 3 then $g[1] else $g[0] end) as $ver
      | if (.name // "") == "" or ($g | length) < 2 then ""
        elif $grp == "composition.krateo.io" and (.namespace // "") != "" then ("/compositions/" + .namespace + "/" + .name)
        else ("/resources/" + (if (.namespace // "") != "" then .namespace else "cluster" end) + "/" + $grp + "/" + $ver + "/" + $g[-1] + "/" + .name) end;
    # One payload leaf as Markdown: a merge patch's `null` removes the key; long values are cut.
    def leafval: if . == null then "removed" else (if type == "string" then . else tojson end) | gsub("`"; "'") | (if length > 80 then (.[0:80] + "…") else . end) | ("`" + . + "`") end;
    def leaves($p): if type == "object" and length > 0 then to_entries[] | .key as $k | .value | leaves($p + [$k]) else { path: ($p | map(tostring) | join(".")), value: . } end;
    (.name // "") as $n
    | (.namespace // "{{ $.Release.Namespace }}") as $ns
    | ((.incident // {}) | if type == "object" and ((.metadata.name // "") != "") then . else {} end) as $r
    | (($r | length) > 0) as $exists
    | ($r.spec // {}) as $sp
    | ($r.status // {}) as $st
    | ($r | alertlabel) as $alertName
    | ($sp.alertRef.namespace // $ns) as $alertNs
    | ((.alert // {}) | if type == "object" and ((.metadata.name // "") != "") and (.metadata.name == $alertName) then . else null end) as $alert
    | ($st.state // "Analyzing") as $state
    | ([ ($st.conditions // [])[] | select(.type == "Reproduced" and .status == "False") ] | length > 0) as $flagged
    # ApplyActionStale (incident-provider): howToFix.applyAction targets an apiVersion or resource this
    # cluster no longer serves, e.g. a composition version that was removed. True until a new analysis
    # replaces the fix; its message names the target and what IS served. The provider requests that
    # analysis itself (status.reanalysis.cause ApplyActionStale), so nobody has to ask for it.
    | ([ ($st.conditions // [])[] | select(.type == "ApplyActionStale" and .status == "True") ] | first) as $staleCond
    | ($st.rootCause // {}) as $rc
    | ($st.sources // []) as $sources
    | ($st.analyzedResources // []) as $analyzed
    | ($st.missingContext // []) as $gaps
    | ($st.assumptions // []) as $assump
    | (($st.reasoningTrace // []) | sort_by(.step // 0)) as $trace
    | ($st.howToFix // {}) as $fix
    # status.lastChecks: the latest result of each script, {exit, since, output}, tagged with its script for outcome.
    | ($st.lastChecks // {}) as $lc
    | (["precondition", "apply", "verify"] | map(. as $k | ($lc[$k] // null) | if . == null then null else . + { script: $k } end)) as $lastResults
    | ($st.error // "") as $err
    | ($st.report // "") as $rpt
    # status.howToFix.applyAction: the fix as ONE Kubernetes API write (alert-provider >= 0.2.45). Actionable
    # only with a known verb, a target, and a payload object unless it deletes; the verb maps to the
    # HTTP method the portal's Apply sends it with, as the signed-in user.
    | ($fix.applyAction // null) as $aa
    | (if ($aa | type) == "object" then ({ patch: "PATCH", create: "POST", post: "POST", put: "PUT", delete: "DELETE" }[(($aa.verb // "") | ascii_downcase)] // null) else null end) as $aaVerb
    | ($aaVerb != null and ($aa.apiVersion // "") != "" and ($aa.resource // "") != "" and ($aa.name // "") != ""
       and ($aaVerb == "DELETE" or (($aa.payload // null) | type) == "object")) as $aaOk
    | ([ ($fix.precondition // ""), ($fix.apply // ""), ($fix.verify // "") ] | any(. != "") or $aaOk) as $hasFix
    | ((($analyzed | length) > 0) or (($sources | length) > 0) or (($trace | length) > 0) or (($rc.statement // "") != "") or $hasFix) as $structured
    | ((if $alert then ($alert.spec.displayName // "") else "" end) | clean) as $alertDisplay
    | (if $alertDisplay != "" then $alertDisplay elif ($rc.statement // "") != "" then $rc.statement elif $alertName != "" then $alertName else $n end) as $title
    | ((.incidents.items) // [] | map(. + { metadata: (.metadata + { namespace: (.metadata.namespace // $ns) }) })) as $all
    | ([ $all[] | select(alertlabel == $alertName and $alertName != "") ] | sort_by([when, .metadata.name])) as $siblings
    | (($siblings | map(.metadata.name) | index($n)) // null) as $ordinal
    | ($sp.applied // false) as $appliedPending
    # spec.reanalysis: a request for a new analysis, until alert-provider consumes it.
    | (($sp.reanalysis // null) != null) as $reanalysisPending
    | ($st.reanalysis // null) as $reanalysis
    # A re-analysis the provider started because the fix went stale, not one a person asked for (cause
    # Person, or absent).
    | ($state == "Analyzing" and (($reanalysis // {}).cause // "") == "ApplyActionStale") as $reanalysingStale
    # Apply sends applyAction; "I applied it" stays for an incident whose fix is only a script.
    | ($state == "Open" and $aaOk and ($appliedPending | not)) as $canApplyAction
    | ($state == "Open" and ($fix.apply // "") != "" and ($appliedPending | not) and ($aaOk | not)) as $canApply
    # Run apply: this incident's IncidentApplies, newest first. A list that did not come back (no CRD, a 403) is no list.
    | (.incidentApplies | type == "object" and (((.items // null) | type) == "array" or ((.kind // "") | endswith("List")))) as $runsOk
    | ([ (if $runsOk then (.incidentApplies.items // []) else [] end)[] | select((.spec.incidentRef.name // "") == $n and $n != "") ]
       | map(. + { _when: (.status.startedAt // .metadata.creationTimestamp // "") }) | sort_by([._when, .metadata.name]) | reverse) as $runs
    # A run the controller has not finished: no phase yet, or Running. It rejects a second one, so Run apply hides.
    | ([ $runs[] | select((.status.phase // "") == "" or .status.phase == "Running") ] | first) as $runActive
    | ($canApply and $runsOk and $runActive == null) as $canRunApply
    # The newest run, when it Failed or was Rejected after the last recorded apply: the step's last run names it.
    | (($runs | first) as $r0
       | if $r0 != null and (($r0.status.phase // "") | IN("Failed", "Rejected"))
            and ((($lastResults[1].since // "") | epoch) // 0) < (($r0._when | epoch) // 0)
         then $r0 else null end) as $runMissed
    # What Apply writes, in words: the verb, the object and, for a patch, each field it sets.
    | (if $aaOk then
        ("`" + $aa.resource + "/" + $aa.name + "`" + (if ($aa.namespace // "") != "" then (" in `" + $aa.namespace + "`") else " (cluster-scoped)" end)) as $obj
        | ({ PATCH: "update", PUT: "replace", POST: "create", DELETE: "delete" }[$aaVerb]) as $word
        | (if $aaVerb == "PATCH" then [ $aa.payload | leaves([]) | select(.path != "") ] else [] end) as $lv
        | "**" + $word + "** " + $obj
          + (if ($lv | length) > 0 then (", setting " + ($lv | map("`" + .path + "` to " + (.value | leafval)) | join(", "))) else "" end)
      else "" end) as $applyWrite
    | $lastResults[0] as $lastPre
    | $lastResults[1] as $lastApply
    | $lastResults[2] as $lastVerify
    # A flagged precondition no longer runs, so it is neither a pass nor a failure.
    | (if $flagged then "wait"
       elif ($lastPre.exit // null) == 1 then "error"
       elif ($lastPre.exit // null) == 0 then "finish"
       elif $state == "Open" then "process" else "wait" end) as $preStatus
    | (if $canApply or $canApplyAction or ($state == "Open" and $appliedPending) then "process" elif $lastApply != null then "finish" else "wait" end) as $applyStatus
    | (if $state == "Verifying" then "process"
       elif ($lastVerify.exit // null) == 0 then "finish"
       elif ($lastVerify.exit // null) == 1 then "error" else "wait" end) as $verifyStatus
    | (if $state == "Verifying" or $state == "Resolved" then 2 elif $state == "Open" then 1 else 0 end) as $fixCurrent
    # "still holds · since 2026-10-09 09:47 UTC": a check that keeps giving the same result keeps its
    # since. An apply result is one run, so it reads "at".
    | ($lastResults | map(if . == null then null else
        (outcome + (if .script == "apply" then " · at " else " · since " end) + (.since | stamp)) end)) as $lastLines
    # Each step is its last run and its script. The one sentence kept says what Apply writes, which
    # the page shows nowhere else before the click.
    | ([ { key: "precondition", title: "Precondition", status: $preStatus, last: $lastLines[0], lead: "",
           note: (if $flagged then "\n\n**Flagged:** its first run already passed, so it cannot see the problem and no longer runs. Apply the fix, re-run the analysis, or close the incident." else "" end) },
         { key: "apply", title: "Review & apply", status: $applyStatus,
           last: (if $appliedPending then "applied, waiting for the controller to verify"
                  elif $runActive != null then ("Run apply in progress, as " + ($runActive.spec.requestedBy.username // "you") + " · " + ($runActive._when | stamp))
                  elif $runMissed != null then ("Run apply " + ($runMissed.status.phase | ascii_downcase)
                    + (if ($runMissed.status.exitCode // null) | isnum then (" · exit " + ($runMissed.status.exitCode | tostring)) else "" end)
                    + " · " + ($runMissed._when | stamp) + " · see Apply runs")
                  else $lastLines[1] end),
           lead: (if $aaOk then ("Apply will " + $applyWrite + ".") else "" end),
           note: "" },
         { key: "verify", title: "Verify", status: $verifyStatus, last: $lastLines[2], lead: "", note: "" } ]
       # Rollback, only when the analysis wrote one: a human runs it to revert an applied fix. No check records it and it moves no state, so it has no last run.
       + (if ($fix.rollback // "") != "" then [
         { key: "rollback", title: "Rollback", status: "wait", last: null, lead: "", note: "" } ] else [] end)
       | to_entries | map(.key as $i | .value as $s
         | (($fix[$s.key] // "") | rtrimstr("\n")) as $script
         # What an unknown precondition or verify run printed: why it gave no verdict.
         | ((($lc[$s.key] // {}).output // "") | rtrimstr("\n")) as $printed
         | $s + {
             i: $i,
             eyebrow: (if $s.key == "rollback" then "optional" else ("step " + (($i + 1) | tostring)) end),
             md: (([ (if $s.lead != "" then $s.lead else empty end),
                     (if $s.key == "rollback" then empty else ("**Last run:** " + ($s.last // (if $s.key == "apply" then "not applied yet" else "never" end))) end) ]
                   | join("\n\n"))
               + (if $printed != "" and $s.key != "apply" then ("\n\nIt printed:\n\n" + ($printed | fence) + "text\n" + $printed + "\n" + ($printed | fence)) else "" end)
               + $s.note
               + (if $script != "" then ("\n\n" + ($script | fence) + "bash\n" + $script + "\n" + ($script | fence)) else "\n\n_No " + $s.key + " script._" end)
               | ltrimstr("\n\n")) })) as $fixSteps
    # Apply runs: a row per Run apply click, then each run's message, output and, when it is not the apply step's, script.
    | ($runs | map({
        when: ._when,
        who: (.spec.requestedBy.username // "—"),
        phase: (.status.phase // "Pending"),
        exit: (if (.status.exitCode // null) | isnum then (.status.exitCode | tostring) else "—" end),
        message: (.status.message // ""),
        color: ({ Succeeded: "var(--green-color)", Failed: "var(--red-color)", Rejected: "var(--orange-color)", Running: "var(--info-color)" }[.status.phase // ""] // "var(--gray-color)") })) as $runRows
    | ((($fix.apply // "") | rtrimstr("\n")) as $applyScript
       | $runs[0:10] | map(
        (.status // {}) as $rs
        | (($rs.output // "") | rtrimstr("\n")) as $out
        | (($rs.script // "") | rtrimstr("\n")) as $rsc
        | "#### " + ($rs.phase // "Pending")
          + (if ($rs.exitCode // null) | isnum then (" · exit " + ($rs.exitCode | tostring)) else "" end)
          + " · " + (.spec.requestedBy.username // "unknown user") + " · " + (._when | stamp)
          + (if ($rs.message // "") != "" then ("\n\n" + $rs.message)
             elif ($rs.phase // "") == "" then "\n\n_Waiting for the controller to start it._"
             elif $rs.phase == "Running" then "\n\n_Running._" else "" end)
          + (if $out != "" then ("\n\n**Output** (up to its last 4 KiB):\n\n" + ($out | fence) + "text\n" + $out + "\n" + ($out | fence)) else "" end)
          + (if $rsc != "" and $rsc != $applyScript then ("\n\n**Script** (not the apply step's current one):\n\n" + ($rsc | fence) + "bash\n" + $rsc + "\n" + ($rsc | fence)) else "" end))
       | join("\n\n")
       + (if ($runs | length) > 10 then "\n\n_The 10 most recent runs; the table lists all of them._" else "" end)) as $runsMd
    | ([ $all[] | select(.metadata.name != $n) ]) as $others
    | ( ([ $others[] | select($alertName != "" and alertlabel == $alertName) ] | sort_by(when) | reverse | map(. + { _why: "same alert" }))
      + (if ($rc.category // "") != "" then
          ([ $others[] | select(alertlabel != $alertName and (.status.rootCause.category // "") == $rc.category) ] | sort_by(when) | reverse | map(. + { _why: ("same category · " + $rc.category) }))
        else [] end)
      | .[0:6]
      | map({ name: .metadata.name, namespace: .metadata.namespace,
              title: (if (.status.rootCause.statement // "") != "" then .status.rootCause.statement else alertlabel end),
              state: (.status.state // "Analyzing"),
              reason: ._why,
              when: when }) ) as $similar
    # WHOSE FIX IT IS: status.rootCause.owner (incident-provider 0.10.0), one Summary row. Absent
    # means not assessed (an older CRD, or an analysis from before it), and then there is no row.
    # `unknown` is assessed and undecided, and never leads to a proposal. A value outside the enum is
    # not an owner.
    | (($rc.owner // "") | tostring | if IN("customer", "krateo", "unknown") then . else "" end) as $owner
    | ({ customer: "your organization", krateo: "Krateo" }[$owner] // "") as $ownerNoun
    # THE ZENDESK REQUESTS RAISED FOR IT, from the `zendeskRequests` step. Its errorKey is a LIST —
    # snowplow appends one entry per failure (resolve.go accumulateErrorKey), each a message string
    # or, for an HTTP failure, the apiserver's Status object — so each entry is read in either shape,
    # by its `code` first and its words second. 404 = the ZendeskRequest kind is not served here.
    # A caller with no grant anywhere gets an empty list, not a 403 (the refilter drops objects).
    | ((.zendeskRequestsError // null) | if . == null then [] elif type == "array" then . else [.] end) as $tErrs
    | ($tErrs | map(if type == "object" then ((.message // .reason // tojson) | tostring) else tostring end) | join("; ")) as $tErrText
    | ([ $tErrs[] | objects | (.code // empty) ]) as $tCodes
    | ([ $tErrs[] | objects | (.reason // empty) ]) as $tReasons
    | (((.zendeskRequests // null) | type) == "object" and (((.zendeskRequests.items // null) | type) == "array")) as $ticketsRead
    | (if $ticketsRead then "read"
       elif ($tErrs | length) == 0 then "none"
       elif ($tCodes | index(404)) != null or ($tReasons | index("NotFound")) != null
            or ($tErrText | test("could not find the requested resource|no matches for"; "i")) then "absent"
       elif ($tCodes | index(403)) != null or ($tReasons | index("Forbidden")) != null
            or ($tErrText | test("forbidden"; "i")) then "denied"
       else "error" end) as $ticketsState
    | ($r.metadata.uid // "") as $uid
    # The state, label and colour of each request come from _zendesk.tpl — a byte-for-byte copy of
    # service-desk-page's, so this card and the service desk cannot disagree about a request.
    | ([ (if $ticketsRead then .zendeskRequests.items else [] end)[]
         | select(type == "object" and (((.metadata.labels // {})["krateo.io/incident-uid"] // "") == $uid) and $uid != "")
         | requestView
         | . + { sortKey: (if .updated != "" then .updated elif .created != "" then .created else .portalCreated end) } ]
       | sort_by(.sortKey) | reverse
       | map({ name, namespace,
               subject: (if .subject != "" then .subject else .name end),
               label, color,
               zendesk: (if .id != "" then ("#" + .id) else "No Zendesk # yet" end),
               updated: ("Updated " + (.sortKey | stamp)) })) as $tickets
    # "Raise a Zendesk request", here and in the proposal: the service desk's own raise form,
    # pre-filled from this incident by its request-raise-context RESTAction, which reads these two
    # parameters as the caller.
    | ("/service-desk/new?incidentName=" + ($n | @uri) + "&incidentNamespace=" + ($ns | @uri)) as $raiseHref
    | (((($r.metadata.annotations // {})["krateo.io/ticket-proposal"]) // "") == "dismissed") as $dismissed
    # AGENTIKO'S PROPOSAL, COMPUTED, NOT STORED: an owner who must act (customer or krateo), an
    # incident still open to action, a request list that came back and holds none for it, and no one
    # having dismissed it. A list that did not come back is not "no request": a reader whose list
    # failed gets no proposal, rather than one to raise a duplicate. (The dismiss annotation keeps
    # its name, krateo.io/ticket-proposal, so incidents already dismissed stay dismissed.)
    | ($exists and ($owner | IN("customer", "krateo")) and ($state | IN("Open", "Verifying"))
       and $ticketsState == "read" and ($tickets | length) == 0 and ($dismissed | not)) as $propose
    # THE EVIDENCE TAB, one numbering shared with the reasoning trace. A source of type object whose
    # ref reads as one object (objref) is a Resources row; every other source is a "Log lines &
    # metrics" row, its ref and excerpt as written. Log rows take the first numbers. $num maps a
    # 0-based evidenceRefs index (into status.sources) to the number shown.
    | ($sources | to_entries | map(.value as $v
        | { i: .key, src: $v,
            obj: (if (($v.type // "") | tostring | ascii_downcase) == "object" then (($v.ref // "") | objref) else null end) })) as $srcs
    | ([ $srcs[] | select(.obj == null) ] + [ $srcs[] | select(.obj != null) ]) as $ordered
    | ($ordered | to_entries | map({ key: (.value.i | tostring), value: (.key + 1) }) | from_entries) as $num
    | ([ $ordered[] | select(.obj == null)
         | ((.src.type // "") | tostring | ascii_downcase) as $tl
         | { title: (($num[.i | tostring] | tostring) + ". " + (if (.src.ref // "") != "" then .src.ref else "(no reference)" end)),
             excerpt: (.src.excerpt // ""),
             kind: ({ logs: "Logs", log: "Logs", events: "Events", event: "Events", metrics: "Metrics", metric: "Metrics", object: "Resource" }[$tl]
                    // (if $tl == "" then "Resource" else ($tl[0:1] | ascii_upcase) + $tl[1:] end)) } ]) as $logRows
    # A Resources row per cited object, then each object in status.analyzedResources that no source
    # names (read, not relied on), numbered on after the last source.
    | ([ $ordered[] | select(.obj != null) | .obj + { num: ($num[.i | tostring] | tostring) } ]) as $citedRows
    | ($citedRows | map([.gvr, .namespace, .name])) as $citedKeys
    | ($citedRows
       + ([ $analyzed[] | { gvr: ((.gvr // "") | sub("^core/"; "")), namespace: (.namespace // ""), name: (.name // "") }
            | select(.gvr != "" and .name != "")
            | select([.gvr, .namespace, .name] as $k | any($citedKeys[]; . == $k) | not) ]
          | to_entries | map(.value + { num: (($sources | length) + .key + 1 | tostring) }))
       | map(. + { type: (.gvr | split("/") | last), route: objroute })) as $resourceRows
    | ($r | if length > 0 then del(.metadata.managedFields) else null end) as $incidentObj
    | ($alert | if . != null then del(.metadata.managedFields) else null end) as $alertObj
    | {
        title: $title,
        state: $state,
        flagged: $flagged,
        headerTags: (if ($exists | not) then [ { label: "Not found", color: "gray" } ] else [ { label: $state, color: ({ Analyzing: "gray", Open: "red", Verifying: "orange", Resolved: "green", Closed: "gray" }[$state] // "gray") } ]
          + (if $flagged then [ { label: "Flagged", color: "orange" } ] else [] end) end),
        # The alert chip under the title: a link to the exact alert, its live state, how long it has been OK, and this incident's number among the alert's incidents.
        alertName: (if $alertDisplay != "" then $alertDisplay else $alertName end),
        alertRoute: (if $alert != null then ("/alerts/" + $alertNs + "/" + $alertName) else "" end),
        alertStateLabel: (if $alert == null then (if $alertName != "" then "not found" else "" end) else ($alert.status.state // "PENDING") end),
        alertStateColor: (if $alert == null then "gray" else ({ OK: "green", ALERT: "red", PENDING: "orange" }[$alert.status.state // "PENDING"] // "gray") end),
        alertOkFor: (if $alert != null and ($alert.status.state // "") == "OK" and ($alert.status.okSince // "") != "" then ("since " + ($alert.status.okSince | stamp)) else "" end),
        # Only earlier incidents count, so the number never changes once the page is cached.
        ordinalLabel: (if $ordinal == null then "" elif $ordinal == 0 then "First incident from this alert" else ((($ordinal + 1) | ordinal) + " incident from this alert") end),
        diagnoseHref: ("/incidents/" + $ns + "/" + $n + "?ask="
          + (("Diagnose this incident (\"" + $n + "\" in namespace \"" + $ns
             + "\"). Explain what it contains, what happened, the most likely root cause,"
             + " and how to fix it — grounded in the evidence on this page.") | @uri)),
        # Target of Close, "I applied it" and Discard, and what Run apply names, written with the user's own token.
        incidentGvr: { apiVersion: "observability.krateo.io/v1alpha1", resource: "incidents", name: $n, namespace: $ns },
        # A Resolved incident was proven fixed by its verify script; the portal offers Close only before that.
        canClose: ($exists and $state != "Closed" and $state != "Resolved"),
        canDiscard: $exists,
        # Re-run analysis: an Open or Verifying incident, while no request waits for alert-provider.
        canReanalyze: ($exists and ($state == "Open" or $state == "Verifying") and ($reanalysisPending | not)),
        canApply: $canApply,
        # Run apply: the same incidents as "I applied it", while no run of this incident is unfinished.
        canRunApply: $canRunApply,
        # Apply: status.howToFix.applyAction, normalized (verb as the HTTP method), for the button that sends it.
        canApplyAction: $canApplyAction,
        # A stale applyAction keeps Apply visible but disabled, with the reason under it: a write to a
        # version the cluster does not serve can only fail.
        applyStale: ($aaOk and $staleCond != null),
        applyStaleNotice: (if $aaOk and $staleCond != null then
          (((($staleCond.message // "") | rtrimstr(".")) | if . == "" then "Apply targets an apiVersion or resource this cluster does not serve" else . end)
           + ". A new analysis has been requested automatically.") else "" end),
        applyAction: (if $aaOk then { verb: $aaVerb, apiVersion: $aa.apiVersion, resource: $aa.resource, namespace: ($aa.namespace // ""), name: $aa.name, payload: (if $aaVerb == "DELETE" then null else $aa.payload end) } else null end),
        metaItems: ([ (if ($r | when) != "" then { label: "Started", value: ($r | when | stamp) } else empty end),
                      (if ($st.completedAt // "") != "" then { label: "Analyzed", value: ($st.completedAt | stamp) } else empty end),
                      (if $reanalysisPending then { label: "Re-analysis", value: "requested, waiting to start" }
                       elif $reanalysingStale then { label: "Re-analysing", value: "previous fix targeted an unserved version" }
                       elif $reanalysis != null then { label: "Re-analysis", value: ("#" + (($reanalysis.count // 1) | tostring) + " · " + ($reanalysis.at | stamp)
                         + (if ($reanalysis.feedback // "") != "" then (" · \"" + ($reanalysis.feedback | if length > 200 then (.[0:200] + "…") else . end) + "\"") else "" end)) }
                       else empty end),
                      # Who ended it, from status.resolution.by (incident-controller): "verify" proves it fixed (Resolved); every other value closes it.
                      # "alert-gone" (incident-provider 0.8.0) and "analysis-failed" (alert-provider) are automated closes, not a person.
                      # A value this map does not know yet reads as itself in parentheses rather than being attributed to anyone.
                      (if ($st.resolution.at // "") != "" then { label: (if $st.resolution.by == "verify" then "Resolved" else "Closed" end), value: (($st.resolution.at | stamp) + ({ verify: " by the verify script", user: " by a person", "alert-gone": " automatically: its Alert was deleted", "analysis-failed": " automatically: the analysis failed" }[$st.resolution.by // "" | tostring] // (" (" + (if ($st.resolution.by // "") == "" then "unknown" else ($st.resolution.by | tostring) end) + ")"))) } else empty end) ]),
        # The Summary card: the root cause, the fix in one line, and whose fix it is.
        summaryItems: ([
          { label: "Why",
            value: (if ($rc.statement // "") != "" then $rc.statement
                    elif $err != "" then "Not determined: the analysis failed."
                    elif ($st.completedAt // "") != "" then "Not determined."
                    else "Not determined yet: the analysis may still be running." end) },
          { label: "Fix",
            value: (if ($fix.apply // "") != "" then
                      ((($fix.apply | split("\n") | map(select(test("^\\s*#") and (test("^#!") | not))) | first) // null) as $c
                       | if $c != null then ($c | sub("^\\s*#+\\s*"; "")) else "See the apply script under How to fix." end)
                    elif $err != "" then "None: the analysis failed."
                    else "None proposed yet." end) } ]
          + (if $owner == "" then [] else [ { label: "Who fixes it",
              value: ({ krateo: "Krateo: the fix belongs in a component Krateo ships",
                        customer: "Your organization: the fix belongs in your own configuration or services",
                        unknown: "Not determined" }[$owner]) } ] end)),
        evidenceLabel: ("Evidence · " + (($logRows | length) + ($resourceRows | length) | tostring)),
        logRows: $logRows,
        resourceRows: $resourceRows,
        gapsMd: ([ (if ($gaps | length) > 0 then ("**Could not see**\n\n" + ($gaps | map("- " + tostring) | join("\n"))) else empty end),
                   (if ($assump | length) > 0 then ("**Assumed**\n\n" + ($assump | map("- " + tostring) | join("\n"))) else empty end) ]
                 | join("\n\n")),
        # A step's evidenceRefs as the numbers the Evidence tab shows; an index outside status.sources is dropped.
        traceItems: ($trace | to_entries | map(
          ([ (.value.evidenceRefs // [])[] | select(isnum and . >= 0 and . < ($sources | length)) | $num[tostring] ] | unique | map(tostring)) as $cited
          | { eyebrow: ("step " + ((.value.step // (.key + 1)) | tostring)),
              title: (.value.statement // ""),
              description: (if ($cited | length) > 0 then ("Evidence " + ($cited | join(", "))) else "" end),
              status: "finish" })),
        traceCurrent: (if ($trace | length) > 0 then (($trace | length) - 1) else 0 end),
        fixSteps: $fixSteps,
        fixCurrent: $fixCurrent,
        fixStepsForWidget: ($fixSteps | map({ eyebrow, title, status, resourceRefId: ("incident-rem-step-" + (.i | tostring)) })),
        applyRunRows: $runRows,
        applyRunsMd: $runsMd,
        applyRunsLabel: ("Apply runs · " + ($runRows | length | tostring)),
        similar: $similar,
        # The incident and its alert, each as the object `kubectl get -o json` prints, minus
        # managedFields. JSON strings, which is what the YamlViewer `json` field takes.
        incidentManifestJson: (if $incidentObj != null then ($incidentObj | tojson) else "" end),
        alertManifestJson: (if $alertObj != null then ($alertObj | tojson) else "" end),
        errorText: $err,
        # Agentiko's proposal. Both owners go to the organisation's Zendesk, through the service
        # desk's raise form: sending a Krateo-owned incident to Krateo support waits for the support
        # relay, so the callout states the verdict and offers the same request the customer case does.
        proposalTitle: "Agentiko suggests raising a Zendesk request for this incident",
        proposalText: (if $propose then ("Owner: " + $ownerNoun + ". The request goes to your organisation’s Zendesk, from the service desk.") else "" end),
        # Dismiss: one annotation on the Incident, written with the caller's token — the grant Close needs.
        dismissPatch: { metadata: { annotations: { "krateo.io/ticket-proposal": "dismissed" } } },
        raiseHref: $raiseHref,
        ticketRows: $tickets,
        # The requests card's one line, when it has no rows to show: none yet, a refused read, or a
        # read that failed — three different things, never drawn as one.
        ticketsNote: (if $ticketsState == "read" then (if ($tickets | length) == 0 then "No Zendesk request yet." else "" end)
                      elif $ticketsState == "denied" then "Your access to Zendesk requests could not be confirmed."
                      elif $ticketsState == "error" then ("The Zendesk requests raised for this incident could not be read: " + $tErrText)
                      else "" end),
        ticketsState: $ticketsState,
        # Shown only for an incident with no structured analysis: the report text, a provider error that stands in for one, or where the analysis is.
        proseMd: (
          ($rpt | test("Bad Request|token count|exceeds the maximum|no output|^ *[0-9][0-9][0-9] ")) as $dump
          | if ($exists | not) then "This incident does not exist, or you cannot read it."
            elif $structured then ""
            elif $dump then ("**Analysis could not complete.** The run ended in a provider error instead of a report. This is what the provider said:\n\n```\n"
                + ($rpt | if (. | length) > 1200 then (.[0:1200] + "\n… truncated") else . end) + "\n```")
            elif $rpt != "" then $rpt
            elif $err != "" then ""
            elif $state == "Analyzing" then "_Analysis in progress — the root cause will appear here when it completes._"
            else "The analysis produced no report and recorded no error." end),
        sections: {
          # An assessed owner is a Summary row even when the analysis left nothing else structured.
          summary: ($structured or $owner != ""),
          evidence: ((($logRows | length) > 0) or (($resourceRows | length) > 0)),
          evidenceLogs: (($logRows | length) > 0),
          evidenceResources: (($resourceRows | length) > 0),
          gaps: ((($gaps | length) > 0) or (($assump | length) > 0)),
          trace: (($trace | length) > 0),
          # The Reasoning card: any of its three tabs has data.
          reasoning: ((($trace | length) > 0) or (($logRows | length) > 0) or (($resourceRows | length) > 0) or (($gaps | length) > 0) or (($assump | length) > 0)),
          fix: $hasFix,
          error: ($err != ""),
          applyRuns: (($runRows | length) > 0),
          similar: (($similar | length) > 0),
          manifests: ($incidentObj != null or $alertObj != null),
          alertManifest: ($alertObj != null),
          prose: (($exists | not) or (($structured | not) and (($rpt != "") or ($err == "")))),
          proposal: $propose,
          # The requests card, wherever this cluster serves ZendeskRequest: not on a 404, and not for
          # an incident that does not exist.
          tickets: ($exists and ($ticketsState | IN("read", "denied", "error"))),
          ticketRows: (($tickets | length) > 0)
        }
      }
