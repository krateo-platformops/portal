{{/* Opened (by triggeredAt) and resolved (by resolution.at) per bucket over the range: per hour for
     24h, per day for 7d and 30d, the newest bucket the current one. */}}
{{/* COUNTS AS BARS (charts mockup, CHART-3): whole-number ticks, the top of the axis the smallest
     multiple of 4 at or above the largest count (at least 4: 0..4, 0..8, ...), so a single incident is
     never a bump on a 0.2 axis; a measured 0 is the BarChart's grey hairline on the baseline, so a red
     series never paints a zero. The newest bucket is the one still filling: slot "partial" (a hatched
     bar, "so far"). */}}
kind: BarChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-trend
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  apiRef:
    name: incidents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    xField: t
    yField: v
    colorField: series
    slotField: slot
    group: true
    colorMap:
      Opened: red
      Resolved: gray
    legend: true
    height: 180
    xTimeUnit: day
    scale:
      "y":
        zero: true
        domainMin: 0
        domainMax: 4
        tickCount: 5
    axis:
      "y":
        tickCount: 5
        title: incidents
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ (if .failed then [] else (.trend // []) end) as $rows | (($rows | last) // {} | .t) as $cur | [ $rows[] | . + (if .t == $cur then { slot: "partial" } else {} end) ] }'
  - forPath: scale
    expression: '${ ([ (if .failed then [] else (.trend // []) end)[] | (.v // 0) ] | max // 0) as $m | { "y": { zero: true, domainMin: 0, domainMax: (if $m <= 4 then 4 else (($m / 4) | ceil) * 4 end), tickCount: 5 } } }'
  - forPath: xTimeUnit
    expression: '${ if .trendUnit == "hour" then "hour" else "day" end }'
  resourcesRefs:
    items: []
