{{/* The row under the header: the time range on the left, the search on the right in a quarter of the row,
     as on /marketplace (row.marketplace-filters-row); stacked when narrow. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-toolbar
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  widgetData:
    allowedResources:
    - flexes
    alignment: middle
    items:
    - resourceRefId: incidents-range-group
      size: 18
      xs: 24
      lg: 18
    - resourceRefId: incidents-search-wrap
      size: 6
      xs: 24
      lg: 6
  resourcesRefs:
    items:
    - id: incidents-range-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-range-group
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: incidents-search-wrap
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-search-wrap
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
