kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-reanalyze-intro
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    type: secondary
    text: >-
      The agent analyzes the incident again from the live cluster. It sees the previous analysis,
      its scripts and what their last runs gave, and your note. The previous analysis and its
      checks are replaced, and the incident is Analyzing until the new one is written.
  resourcesRefs:
    items: []
