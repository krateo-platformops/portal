{{/* "Firing with no incident" strip — firing Alerts (state ALERT, not paused) with no open */}}
{{/* incident, off incidents-list. Each row's tag says why: a metric or value Alert opens no */}}
{{/* incidents (alert-provider's OpensIncidents condition), a counting Alert has not opened one yet. */}}
{{/* hideWhenEmpty removes the strip when every firing alert has one. Each row opens the Autopilot */}}
{{/* rail seeded to investigate that alert. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-awaiting
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6: the extras keys that partition this widget's cache cell. Undeclared keys still */}}
  {{/* reach the jq dict but do NOT vary the key, so a content-bearing key left out here */}}
  {{/* serves one scope's content from another's cell. */}}
  keyExtras: [projects]
  apiRef:
    name: incidents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: false
    hideWhenEmpty: true
    header: Firing with no incident — select one to have Agentiko investigate it →
    itemTemplate:
      navigateTo: '{askHref}'
      iconVariant: dot
      color:
        value: '{state}'
        map:
          ALERT: red
        default: gray
      primaryText: '{name}'
      {{/* Why the alert has no incident; the red dot already says it is firing. */}}
      secondaryText: '{why}'
      secondaryTextAsTag: true
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .awaiting // [] }'
  resourcesRefs:
    items: []
