{{/* The Reasoning card's tabs, each only when its data exists: Reasoning trace (first, so open by */}}
{{/* default), Evidence (log lines and the resources read, numbered as the trace cites them) and */}}
{{/* Gaps & assumptions. */}}
kind: Tabs
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-why-tabs
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - steps
    - flexes
    - markdowns
    items:
    - label: Reasoning trace
      resourceRefId: incident-trace
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ (.sections // {}) as $s
        | (if ($s.trace // false) then [ { label: "Reasoning trace", resourceRefId: "incident-trace" } ] else [] end)
        + (if ($s.evidence // false) then [ { label: (.evidenceLabel // "Evidence"), resourceRefId: "incident-evidence" } ] else [] end)
        + (if ($s.gaps // false) then [ { label: "Gaps & assumptions", resourceRefId: "incident-gaps" } ] else [] end) }
  resourcesRefs:
    items:
    - id: incident-trace
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-trace
      namespace: {{ $.Values.namespace }}
      resource: steps
      verb: GET
    - id: incident-evidence
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-evidence
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: incident-gaps
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-gaps
      namespace: {{ $.Values.namespace }}
      resource: markdowns
      verb: GET
