{{/* The incidents, two thirds of the row: "Cards | Table · all columns" top right, then the state
     chips (the page's filter, Open by default), then one card per incident in that state, or with
     ?view=table the full table. When there is nothing to list, or the read failed, a line says so
     instead of an empty list. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-list-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view]
  apiRef:
    name: incidents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Incidents
    titleVariant: eyebrow
    variant: outlined
    extraRefId: incidents-view-chips
    allowedResources:
    - listies
    - tables
    - paragraphs
    items:
    - resourceRefId: incidents-status-chips
    - resourceRefId: incidents-cards
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "incidents-status-chips" } ] + (if .failed or (.matched // 0) == 0 then [ { resourceRefId: "incidents-empty" } ] elif .view == "table" then [ { resourceRefId: "incidents-table" } ] else [ { resourceRefId: "incidents-cards" } ] end) }'
  resourcesRefs:
    items:
    - id: incidents-view-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-view-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: incidents-status-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-status-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: incidents-cards
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-cards
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: incidents-table
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-table
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
    - id: incidents-empty
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incidents-empty
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
