{{/* The Gaps & assumptions tab: what the analysis could not see (status.missingContext) and what it */}}
{{/* assumed because of that (status.assumptions), as two plain lists (incident-detail .gapsMd). */}}
kind: Markdown
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-gaps
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    markdown: ''
  widgetDataTemplate:
  - forPath: markdown
    expression: '${ .gapsMd // "" }'
  resourcesRefs:
    items: []
