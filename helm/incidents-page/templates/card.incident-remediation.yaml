{{/* HOW TO FIX: the scripts (precondition · apply · verify · rollback) as one Steps widget. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-sec-remediation-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    anchorId: incident-how-to-fix
    title: How to fix
    titleVariant: eyebrow
    variant: outlined
    {{/* #103: fa-screwdriver-wrench's glyph sits low-right within its own viewBox, so it touched */}}
    {{/* the tile's edge; fa-wrench is well centred at the same weight. */}}
    icon:
      name: fa-wrench
      color: cyan
    items:
    - resourceRefId: incident-rem-widget
  resourcesRefs:
    items:
    - id: incident-rem-widget
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-rem-widget
      namespace: {{ $.Values.namespace }}
      resource: steps
      verb: GET
