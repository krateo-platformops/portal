{{/* Search: an incident's title (its alert's display name) and root cause, case-insensitive, written
     to ?q= on Enter and removed when cleared. incidents-list applies it as one more filter, so the
     facet counts follow it. */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-search
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, alert, age, owner, q, group, view]
  widgetData:
    name: q
    queryParam: q
    placeholder: Search root causes
    allowClear: true
    size: small
  resourcesRefs:
    items: []
