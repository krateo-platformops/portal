{{/* Search: an incident's title, cause, target, alert or category, case-insensitive, written to
     ?q= on Enter and removed when cleared. incidents-list applies it to the whole page. */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-search
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, status, range, view, q]
  widgetData:
    name: q
    queryParam: q
    {{/* The filter applies on SUBMIT (Enter), not per keystroke: say so in the placeholder or the */}}
    {{/* box reads as broken while the user types. */}}
    placeholder: Search incidents · press Enter
    allowClear: true
    size: middle
  resourcesRefs:
    items: []
