{{/* The caption of the Involved-resources tab: "2 objects — the incident and the alert that */}}
{{/* opened it. managedFields stripped; status kept." */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-manifests-legend
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Values.namespace }}
  {{/* Static fallback: true of every incident and claims no specific count. */}}
  widgetData:
    text: The custom resources this incident is made of.
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ .involvedManifestsDesc // "The custom resources this incident is made of." }'
  resourcesRefs:
    items: []
