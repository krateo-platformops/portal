# Default values for composable-portal-starter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# @schema
# description: Enable admin user (basic authentication) with cluster-admin permissions
# type: boolean
# default: true
# @schema
enableAdminUser: true

# @schema
# description: Enable cyberjoker user (basic authentication) with namespace-scoped permissions
# type: boolean
# default: true
# @schema
enableCyberjokerUser: true

# @schema
# description: enabling the demo creates the demo-system namespace, deploys two Route resources within it, and grants permissions to the cyberjoker user if that user is enabled
# type: boolean
# default: true
# @schema
enableDemoSystemNamespace: true

# @schema
# description: Display name of the platform tenant — shown in the sider tenant chip and the page eyebrows (dashboard greeting, compositions, observability). A deployer-set label, not derived data; defaults to krateo-enterprise.
# type: string
# default: krateo-enterprise
# @schema
tenant: krateo-enterprise

# @schema
# description: Optional URL of the external observability console (e.g. the clickstack/HyperDX UI). When set, a "View in console" link appears on the /observability page and opens it in a new tab; empty hides the link. No default target is invented — a deployer must point this at their own console.
# type: string
# default: ""
# @schema
observabilityConsoleUrl: ""

# @schema
# description: W3-3 spoke read-back binding — the ONE registered spoke cluster whose /clusters/{name} detail page shows LIVE compositions read directly from the spoke apiserver (restaction cluster-compositions). snowplow endpointRef references are static (not jq-templated), so the read-back is bound per-install; generating a per-spoke RESTAction + endpoint Secret pair at registration time is the follow-up that removes this value.
# type: string
# default: "krateo-spoke-demo"
# @schema
spokeReadbackCluster: krateo-spoke-demo

# @schema
# description: Name of the DERIVED endpoint Secret for the spoke read-back — snowplow endpoint shape {server-url, token, insecure, certificate-authority-data}, derived from the registered spoke's kubeconfig Secret (NOT the kubeconfig Secret itself, which snowplow cannot consume). The server-url deliberately carries the /apis suffix; see restaction.cluster-compositions.yaml for why.
# type: string
# default: "krateo-spoke-demo-endpoint"
# @schema
spokeReadbackEndpointSecret: krateo-spoke-demo-endpoint

# @schema
# description: Namespace of the derived spoke endpoint Secret (must be readable by snowplow's ServiceAccount; the authn namespace krateo-system is the canonical home, same place the registration flow keeps the kubeconfig Secret).
# type: string
# default: "krateo-system"
# @schema
spokeReadbackEndpointNamespace: krateo-system

# @schema
# description: RBAC namespace tiers for portal page widgets. Each page-root Flex is placed in one tier; the sidebar Menu references it there, so snowplow resolves visibility AS THE USER and the frontend hides pages the user's Role cannot GET. Empty string = .Release.Namespace (the default single-namespace layout, no RBAC tiering). Set `admin` (and optionally `tenant`) to distinct namespaces to split page visibility by audience.
# type: object
# @schema
tiers:
  # Shared chrome + pages every authenticated user sees (Dashboard). Empty = release namespace.
  common: ""
  # Pages a tenant persona sees (Blueprints). Empty = release namespace (collapsed onto common).
  tenant: ""
  # Admin-only pages (Compositions, Clusters, Observability, Incidents, Alerts, Marketplace, Settings, the three Builders). Empty = release namespace.
  admin: ""

# @schema
# description: Where the portal reads the blueprint/operator marketplace catalog. `configmap` (default) reads the two indexes from the in-cluster ConfigMap that the krateo-marketplace-catalog composition renders — no external fetch, mirror-friendly, air-gap-safe. `external` keeps the legacy endpointRef GET of the blueprints-endpoint Helm repo (one-release rollback fallback). All catalog RESTActions switch together via templates/_catalog.tpl; the blueprints-endpoint Secret is only rendered when source=external.
# type: object
# @schema
marketplace:
  # @schema
  # description: configmap (in-cluster ConfigMap, default) | external (legacy Helm-repo endpointRef)
  # type: string
  # enum: [configmap, external]
  # default: configmap
  # @schema
  source: configmap
  # @schema
  # description: Name of the ConfigMap the krateo-marketplace-catalog composition renders (holds blueprints-index.json + operators-index.json). Only used when source=configmap.
  # type: string
  # default: blueprints-catalog-index
  # @schema
  configMapName: blueprints-catalog-index

# NO LONGER READ BY ANYTHING — kept so installs that set it do not fail schema validation.
#
# It existed because the sidebar was static: a nav entry for a page in the portal-agents chart had
# to be gated on whether that chart was installed, since a ref whose target is missing stays
# visible and 404s rather than hiding itself. A human kept this flag in step with reality, and it
# was wrong whenever they did not.
#
# The sidebar is now assembled from the page roots the cluster actually has
# (restaction.sidebar-nav), so the agents entries appear exactly when portal-agents is installed
# and vanish when it is not. The flag has nothing left to gate. Removing the key outright would
# fail any install that still passes it, so it goes in a later major.
agents:
  enabled: false

# S6 ACCEPTANCE PROBE — off everywhere except a bench cluster running the snowplow live-refresh
# acceptance harness. Adds ONE route-only (label-less) nav entry, /s6-probe, whose content resolves
# by the page:<slug> convention to flexes/page-s6-probe — a page CR the harness creates and deletes
# per run. Nothing renders in the sidebar and no page ships with this; without the harness the route
# simply resolves to a page that does not exist.
#
# It is separate from observability.snowplowSli (which shows the SLI dashboard) because they answer
# different questions: that one is a dashboard an operator may want, this one is test scaffolding.
acceptance:
  s6Probe: false

# --- Preview sandbox ---------------------------------------------------------
# Where the Autopilot live preview applies its draft widget CRs. MUST match the frontend chart's
# previewSandbox (which owns the namespace, its quota and its RBAC); the portal chart only READS it,
# to list in-flight drafts on the Portal Builder page so a person can resume one.
previewSandbox:
  namespace: krateo-preview

# --- SRE / MSP alert catalogue -----------------------------------------------
# The Kubernetes checks an operator is expected to have — crash loops, OOM kills, unschedulable
# pods, node pressure, failing probes, stuck volumes, dead telemetry — shipped as Alert CRs so a
# fresh install is not silent. See templates/alerts.catalogue.yaml for the full list, the observed
# baseline behind each threshold, and the three rules that decide whether an Alert can fire at all.
#
# OFF BY DEFAULT ON PURPOSE. Two reasons, both about not surprising a deployer:
#   - it needs alerts.observability.krateo.io, which only exists where the observability component
#     is installed; templating these without the CRD fails the install
#   - every firing alert starts a model-driven RCA and opens a TroubleshootingReport (one per
#     alert, 1:1), so switching this on has a running cost that should be chosen, not inherited.
alerts:
  # @schema
  # description: Ship the SRE alert catalogue. Requires the observability component (the Alert CRD). Each firing alert starts a model-driven RCA and opens a TroubleshootingReport, so this has a running cost — off by default so a deployer opts in deliberately.
  # type: boolean
  # default: false
  # @schema
  enabled: false

  # @schema
  # description: Also ship the extended tier — catch-all and baseline-relative alerts (warning-event bursts, authorization-failure bursts, upstream timeouts, Krateo external-resource failures). These have a non-zero steady rate on a busy cluster and their thresholds mean "far above normal", so they need retuning per cluster; the core tier is the set that should be quiet when nothing is wrong.
  # type: boolean
  # default: false
  # @schema
  extended: false

  # @schema
  # description: Catalogue entries to skip, by name (e.g. [loadbalancer-failure]). Lets a deployer drop an alert that does not apply — a cluster with no LoadBalancers, no preemptible nodes, no persistent volumes — without forking the chart.
  # type: array
  # default: []
  # @schema
  disabled: []

  # @schema
  # description: Per-alert threshold overrides keyed by catalogue name (e.g. {probe-failing 20}). Thresholds are the one field that always needs retuning, because the right number depends on a baseline only the target cluster knows; the shipped defaults come from a real cluster and are a starting point, not a claim about yours.
  # type: object
  # default: {}
  # @schema
  thresholds: {}
