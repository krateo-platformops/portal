# The Controller Builder, DECLARED — the third builder, the first written for the engine rather than
# migrated onto it (T3, frontend#409; its composer T8, frontend#412).
#
# THE ENGINE RUNS IT (T8): builderRegistry.ts loads it beside the page and blueprint Builders, and the
# composer host mounts it at its route with the plugins it names — the `openapi` palette, the
# `restdef-graph` canvas and the `restdef-mapping` inspector (pages/ControllerComposer/controllerSlots),
# over the controller workbench (useControllerWorkbench). A controller draft is held, autosaved as
# `draft-controller-<owner>-<slug>`, resumed, linted and published by the same engine code as the others.
#
# PREVIEW RUNS IT TOO (T9, frontend#413): preview.restActionRef is the RESTAction the provider calls
# (useBlueprintAuthoringBuses → pages/ControllerComposer/controllerRender.ts), and only a render with
# CRDs and zero problems arms Publish.
apiVersion: builders.templates.krateo.io/v1alpha1
kind: Builder
metadata:
  name: controller-builder
spec:
  label: Controller Builder
  # builderRoutes.tsx serves it: its three plugins ship.
  route: /controller-builder/compose
  # draftRecord.ts: `draft-controller-<owner>-<slug>`, label krateo.io/draft-kind=controller. The
  # portal's my-drafts lists it (portal.draftBuilders, portal#274).
  draftKind: controller
  # StartControllerModal.tsx reads these labels, helps and placeholders; controllerChart.ts
  # validateStartController holds what a value means (a name core-provider can serve, a DNS group, a
  # document that reads as OpenAPI 3.x, an absolute base URL).
  start:
    fields:
      - name: name
        label: Controller name
        required: true
        help: Lower-case, dashes. It becomes the chart, the repository and the CompositionDefinition name.
        placeholder: petstore
      - name: apiGroup
        label: API group
        required: true
        help: The group the Kinds are served in, as <group>/v1alpha1.
        placeholder: petstore.example.io
      - name: spec
        label: OpenAPI spec
        required: true
        help: Paste it, upload it, or read it from a URL. It is held in the chart's ConfigMap, verbatim.
      - name: baseUrl
        label: Base URL the controller calls
        required: true
        help: Written into the document's servers entry — every request the controller sends goes here.
        placeholder: https://petstore3.swagger.io/api/v3
    # Mirrors blueprintDraftStore.ts BLUEPRINT_DRAFT_MAX_BYTES, which is what the store enforces for
    # every draft kind; the store does not read this value.
    maxDraftBytes: 524288
  # controllerSlots.tsx `openapi`: the held document's operations, grouped by resource path
  # (T7's paletteModel.ts).
  palette:
    plugin: openapi
  # controllerSlots.tsx `restdef-graph`: the Kinds and, when the document declares security schemes,
  # the Configuration they authenticate through.
  canvas:
    plugin: restdef-graph
  # controllerSlots.tsx `restdef-mapping`: verbs, identifiers, status fields, auth (T7's
  # operationMapping.ts / restDefinitionBuild.ts).
  inspector:
    plugin: restdef-mapping
  # frontend#405: a controller preview RENDERS (oasgen-render generates the CRDs), it never applies.
  # The MODE is read (an edit disarms Publish); Preview writes the draft (RestDefinitions + the OAS
  # documents, `draft.json`) into the preview sandbox and calls this RESTAction by name over /call
  # (T9, frontend#413; portal#277).
  preview:
    mode: render
    restActionRef:
      name: controller-render-draft
  # A controller is a chart: N templates/restdefinition-<kind>.yaml plus
  # templates/configmap-oas-<name>.yaml (controllerChart.ts), registered by a CompositionDefinition.
  files:
    required:
      - Chart.yaml
      - values.yaml
      - values.schema.json
    # publishDraft.ts REGISTRATION_PATH, written at publish.
    locked:
      - compositiondefinition.yaml
    heldBytes: 524288
  # proposedChart.ts lintHeldDraft(files, 'controller'): the chart lint, then the controller's own —
  # the document reads, no verb conflict is unsettled, T7's validator passes every RestDefinition.
  lint:
    - chart-lint
    - restdef-validate
  gates:
    - preview-before-publish
    - publish-name
  # publishDraft.ts runDraftPublish: the held tree, one BuilderPublish claim to a repository named for
  # the controller under AUTOPILOT_KOG_BUILDER_REPO's owner, seeded from AUTOPILOT_KOG_BUILDER_TEMPLATE
  # (krateo-blueprints/builder-scaffold), with compositiondefinition.yaml written at publish.
  publish:
    builder: controller
    targetKey: AUTOPILOT_KOG_BUILDER_REPO
    templateKey: AUTOPILOT_KOG_BUILDER_TEMPLATE
    registration:
      kind: CompositionDefinition
      path: compositiondefinition.yaml
  # actionBridge.ts previewRestDef, publishRestDef — publishRestDef is this Builder's publish verb, for
  # the composer's Publish and the rail's alike.
  verbs:
    allowed:
      - previewRestDef
      - publishRestDef
  # The portal chart's /controller-builder hub (portal#274).
  portal:
    draftsCard:
      name: controller-builder-drafts-card
