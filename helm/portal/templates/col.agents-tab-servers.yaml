# Tab pane: Tool servers: the server list, the who-may-call-what matrix and the binding detail.
#
# A Col, not a Flex, and that is forced rather than stylistic: the Tabs allowedResources enum
# carries `cols` but NOT `flexes` (verified on the live CRD), so a Flex cannot be a tab pane.
# Col DOES allow `flexes`, so this is the one-level wrapper that lets the existing section
# render unchanged inside a tab.
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-tab-servers
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - flexes
    items:
    - resourceRefId: agents-servers
  resourcesRefs:
    items:
    - id: agents-servers
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
