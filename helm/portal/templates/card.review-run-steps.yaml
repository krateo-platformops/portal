kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-run-steps
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-run
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Steps
    titleVariant: eyebrow
    variant: outlined
    size: small
    items:
    - resourceRefId: review-run-steps-list

  resourcesRefs:
    items:
    - id: review-run-steps-list
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: review-run-steps-list
      namespace: {{ .Release.Namespace }}
      resource: steps
      verb: GET
