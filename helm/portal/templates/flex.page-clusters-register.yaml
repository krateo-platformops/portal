{{/* Register page — the route /clusters/register renders here (page-<slug> convention). */}}
{{/* Hosts the register-cluster Form, which POSTs a KubernetesTarget (registers a spoke). */}}
{{/* Mirrors flex.page-blueprint-install. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-clusters-register
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
      - pageheaders
      - forms
    vertical: true
    {{/* P9: page-root section rhythm is one step, `middle`, across every nav-declared root. */}}
    {{/* This root previously declared its own value; see design/03-composition.md P9. */}}
    gap: middle
    items:
      - resourceRefId: clusters-register-page-header
      - resourceRefId: register-cluster-form
  resourcesRefs:
    items:
      - id: clusters-register-page-header
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: clusters-register-page-header
        namespace: {{ .Release.Namespace }}
        resource: pageheaders
        verb: GET
      - id: register-cluster-form
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: register-cluster
        namespace: {{ .Release.Namespace }}
        resource: forms
        verb: GET
