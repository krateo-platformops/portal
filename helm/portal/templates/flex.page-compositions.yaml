# Convention page root for /compositions — header (H1 + subtitle) above the
# compositions table. The nav (`menu.sidebar-nav`) points its `compositions` ref here
# (was the bare table) so the page gains a header like the mockup.
# #68: this page-root lives in the COMMON tier (the release namespace, tenant-readable) — NOT the
# admin tier — so a namespace-scoped tenant sees the Compositions menu item and its OWN Krateos.
# Safe: its children (compositions-header/toolbar/table) already live here, and compositions-table
# is server-side tenant-scoped (compositions-list RA), so a tenant sees only its own compositions.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-compositions
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [namespace]
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - tables
    vertical: true
    gap: middle
    items:
    - resourceRefId: compositions-page-header
    - resourceRefId: compositions-toolbar
    - resourceRefId: compositions-table
  resourcesRefs:
    items:
    # #4: compositions-header is now a Flex (space-between), not a Row — resolve it as `flexes`
    # so the CTA pins flush-right reliably (the Row/Col grid rendered it ~2/3 across live).
    - id: compositions-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: compositions-toolbar
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-toolbar
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: compositions-table
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-table
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
