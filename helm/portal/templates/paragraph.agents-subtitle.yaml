# Subtitle for the /agents pagehead. Deliberately says WHERE the data comes from — every number in
# the table below is read from the kagent.dev CRs, not from a catalogue.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-subtitle
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      Every agent on this cluster, the model it resolves to, the tools and tool servers it may call,
      and who it delegates to — read from the Agent, ModelConfig and RemoteMCPServer resources.
    type: secondary
  resourcesRefs:
    items: []
