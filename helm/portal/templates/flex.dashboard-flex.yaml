kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-dashboard
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/nav-group": "Operations"
    "krateo.io/nav-icon": "fa-gauge"
    "krateo.io/nav-label": "Dashboard"
    "krateo.io/nav-order": "1"
    "krateo.io/nav-path": "/dashboard"
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - rows
    - cards
    - statistics
    - tags
    - paragraphs
    - buttons
    - linecharts
    - piecharts
    - listies
    vertical: true
    {{/* Petrol density (D5/O1): tighten the inter-section vertical rhythm (stats/charts/rail/lists) */}}
    {{/* from `middle` to `small` so the dashboard reads closer to the dense one-screen mockup. */}}
    {{/* P9: page-root section rhythm is one step, `middle`, across every nav-declared root. */}}
    {{/* This root previously declared its own value; see design/03-composition.md P9. */}}
    gap: middle
    items:
    - resourceRefId: dashboard-page-header
    - resourceRefId: dashboard-range-chips
    {{/* First-run onboarding — self-hides once the user owns a composition (hideWhenEmpty */}}
    {{/* gate on compositions-list). Sits under the greeting header, above the stats. */}}
    - resourceRefId: onboarding-empty
    - resourceRefId: stats-row
    - resourceRefId: charts-row
    - resourceRefId: rail-row
    - resourceRefId: lists-row
    {{/* #14: Platform inventory (installed blueprints · composition kinds · active projects) — */}}
    {{/* the three real obs-stat-* Statistics wrapped in a card, moved onto the dashboard (the */}}
    {{/* observability agent removes it from the obs page). Bottom of the flow, under the lists. */}}
    - resourceRefId: dashboard-inventory
  resourcesRefs:
    items:
    - id: dashboard-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: dashboard-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: dashboard-range-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: dashboard-range-chips
      namespace: {{ .Release.Namespace }}
      resource: listies
      verb: GET
    - id: onboarding-empty
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: onboarding-empty
      namespace: {{ .Release.Namespace }}
      resource: listies
      verb: GET
    - id: stats-row
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: stats-row
      namespace: {{ .Release.Namespace }}
      resource: rows
      verb: GET
    - id: charts-row
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: charts-row
      namespace: {{ .Release.Namespace }}
      resource: rows
      verb: GET
    - id: rail-row
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: rail-row
      namespace: {{ .Release.Namespace }}
      resource: rows
      verb: GET
    - id: lists-row
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: lists-row
      namespace: {{ .Release.Namespace }}
      resource: rows
      verb: GET
    - id: dashboard-inventory
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: dashboard-inventory
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
