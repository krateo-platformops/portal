# Edit — opens a Drawer hosting the schema-driven alert-edit Form. The form resolves the Alert
# from the detail route params (?extras) via alert-editdef, pre-fills its current spec, and submits
# a merge-PATCH. No apiRef/.gvr needed on the button itself — it just points the drawer at the form
# (the form owns the per-alert resolution + the PATCH target). Mirrors button.composition-detail-edit.
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-detail-edit
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    label: Edit
    icon: fa-pen
    type: default
    size: middle
    clickActionId: open-edit
    actions:
      openDrawer:
        - id: open-edit
          type: openDrawer
          resourceRefId: edit-form
          title: Edit alert
          size: large
  resourcesRefs:
    items:
      - id: edit-form
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: alert-edit
        namespace: {{ .Release.Namespace }}
        resource: forms
        verb: GET
