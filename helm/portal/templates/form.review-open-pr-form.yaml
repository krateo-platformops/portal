{{/* Writes the BuilderPublish claim for one proposal: builder review, one file, repository.create */}}
{{/* false (a model-chosen repository is never created). Repository and File are pre-filled from */}}
{{/* spec.target and editable; everything else is fixed and templated from review-proposal. The */}}
{{/* POST target is the discovered BuilderPublish GVR (it tracks the portal chart version). */}}
{{/* */}}
{{/* TWO WRITES, ONE CONFIRM (`ops`, applied in order, stopping at the first failure): the claim, */}}
{{/* then spec.decision {phase: PrOpen, claim} on the proposal by merge-PATCH as the caller. The */}}
{{/* decision is recorded only once the claim exists. decidedBy/decidedAt are not sent: */}}
{{/* nightly-review's admission policy stamps them from the request identity. A 403 on either write, */}}
{{/* or a CRD that does not serve spec.decision yet, reaches the person as the apiserver's message. */}}
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-open-pr-form
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-proposal
    namespace: {{ .Release.Namespace }}
  widgetData:
    layout: vertical
    submitActionId: open-pr
    schema:
      type: object
      required: [repository, file]
      properties:
        repository:
          type: string
          title: Repository
          description: Proposed by the model. Correct it if the change belongs elsewhere.
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
        file:
          type: string
          title: File
          description: Path of the file in that repository.
          pattern: '^[^/].*[^/]$'
    buttonConfig:
      primary:
        label: Open change request
    actions:
      rest:
        - id: open-pr
          type: rest
          {{/* Required by the dispatcher; with `ops` the entries carry everything. */}}
          resourceRefId: create-builder-publish
          headers:
            - 'Content-Type: application/json'
          successMessage: The change request was requested. Its pull request opens when the publish chain has run.
          ops:
            - resourceRefId: create-builder-publish
              payload: {}
              {{/* The two fields a person may correct, from the form (`.json`, all this jq can see). */}}
              payloadToOverride:
                - { name: spec.target.namespace, value: '${ .json.repository | split("/")[0] }' }
                - { name: spec.target.repo,      value: '${ .json.repository | split("/")[1] }' }
                - { name: 'spec.files[0].path',  value: '${ .json.file }' }
            - resourceRefId: decide-pr-open
              payload: {}
  widgetDataTemplate:
    - forPath: initialValues
      expression: '${ { repository: (.repository // ""), file: (.file // "") } }'
    - forPath: actions.rest[0].ops[1].payload
      expression: '${ { spec: { decision: { phase: "PrOpen", claim: (.claimName // "") } } } }'
    {{/* The fixed half of the claim, from the proposal. */}}
    - forPath: actions.rest[0].ops[0].payload
      expression: >-
        ${ { metadata: { name: (.claimName // ""), namespace: "{{ .Release.Namespace }}",
                         labels: { "review.krateo.io/proposal": (.name // "") } },
             spec: { name: (.claimName // ""),
                     builder: "review",
                     branch: (.branch // ""),
                     target: { namespace: "", repo: "", base: "main" },
                     files: [ { path: "", content: (.content // "") } ],
                     repository: { create: false },
                     pullRequest: { title: (.prTitle // ""), body: (.prBody // "") } } } }
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: create-builder-publish
        apiVersion: '${ .bpApiVersion }'
        resource: '${ .bpResource }'
        {{/* The claim's own name. REQUIRED even though a POST creates into the collection, and */}}
        {{/* omitting it broke this form in two ways at once (frontend#475): snowplow derives the */}}
        {{/* ref's synthesised payload from these fields, so a missing name produced */}}
        {{/* metadata.name: "" — and buildPayload merges the REF payload OVER the op's, so that */}}
        {{/* empty string overwrote the metadata.name this widget templates just below. The same */}}
        {{/* omission left name= off the /call path, which snowplow rejects with */}}
        {{/* `400 missing 'name' query parameter` on every verb, a collection POST included. */}}
        {{/* Result: builder: review had never once produced a BuilderPublish. */}}
        name: '${ .claimName }'
        namespace: {{ .Release.Namespace }}
        verb: POST
    - template:
        id: decide-pr-open
        apiVersion: review.krateo.io/v1alpha1
        resource: proposals
        name: '${ .name }'
        namespace: {{ .Release.Namespace }}
        verb: PATCH
