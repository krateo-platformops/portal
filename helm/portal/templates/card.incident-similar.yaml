{{/* #86 §0.7: SIMILAR INCIDENTS as a section CARD (was a bare "strong Paragraph label + */}}
{{/* loose Listy" footer pair — incident-sec-similar-label + incident-similar). Promoting it to the */}}
{{/* same Card family as Evidence/Why/Remediation (titleVariant: eyebrow + variant: outlined) so the */}}
{{/* whole incident page reads as ONE section language, top to bottom, with no loose-label exceptions. */}}
{{/* Mirrors card.component-detail-events.yaml: a title + eyebrow variant wrapping a single Listy. */}}
{{/* The page Flex still gates this card on `sections.similar`, so it renders only when the RA matched */}}
{{/* past incidents (self excluded, ≤4); the inner Listy also carries hideWhenEmpty. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-similar-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    title: Similar incidents
    titleVariant: eyebrow
    variant: outlined
    extra: 'past investigations · same root-cause category'
    items:
      - resourceRefId: incident-similar
  resourcesRefs:
    items:
      - id: incident-similar
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: incident-similar
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
