# The /agents/policies/new page header — title and subtitle in one CR.
#
# Replaces four: flex.agents-policy-create-header plus the eyebrow, title and subtitle Paragraphs.
#
# THE EYEBROW IS GONE, and that is a deletion rather than a regression: Paragraph.tsx already
# returns null for `variant: eyebrow`, so "Agent control plane" has been rendering as nothing.
#
# No actions. Submit belongs to the Form below, and the ownership rules this page has to respect
# are explained by agents-policy-ownership-card rather than compressed into a header control.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policy-create-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Add a policy
    subtitle: >-
      An AgentgatewayPolicy attaches to one Gateway, HTTPRoute or Service and carries one block of
      enforcement. Role picks which block — identity, limits, resiliency and cors all write under
      spec.traffic; guardrail and passthrough under spec.backend; observability under spec.frontend
      — and the JSON body is written under it.
  resourcesRefs:
    items: []
