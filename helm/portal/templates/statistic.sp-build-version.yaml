{{- if (.Values.observability | default dict).snowplowSli }}
kind: Statistic
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-build-version
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  apiRef:
    name: sp-build-version
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Running build
    value: 0
  widgetDataTemplate:
  - forPath: value
    expression: '${ ([ (.rows // [])[] | .version ] | first // "—") }'
  resourcesRefs:
    items: []
{{- end }}
