{{/* The composition's resources as its chart declares them, each drawn in the state the composition */}}
{{/* is in. One node per descriptor resource (uid "arch:<id>"); an edge per ACTIVE dependsOn, drawn */}}
{{/* from the dependency to the node that waits for it. A resource whose `when` is false for this */}}
{{/* composition is not drawn at all — it is not part of this composition. */}}
{{/* EXCEPTION-ONLY (P14): a done node is neutral and carries no marker. The one red on the canvas is */}}
{{/* `exception`, set only for a NotSynced or NotReady condition (Kubernetes' own tokens). */}}
{{/* The detail line says what the node is waiting on in the person's terms — the readiness field and */}}
{{/* its value, a count, or what it waits for — and says plainly when this person could not read it: */}}
{{/* a denied object is "not readable with your access", never "not ready". */}}
kind: FlowChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: flowchart-composition-detail-architecture
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-architecture
    namespace: {{ .Release.Namespace }}
  widgetData:
    variant: architecture
    data: []
  widgetDataTemplate:
    - forPath: data
      expression: '${ . as $r | if .readable != true then [] else [ .nodes[] | select(.present == true) | ((.readyWhen // "") | if . == "" then "exists" else ltrimstr(".status.") end) as $field | { uid: ("arch:" + .id), kind: (.kind + (if .forEach then " ×" + (.expected | tostring) else "" end)), name: (if .expected == 0 then "none" elif .expected == 1 then .instances[0].name else (.instances[0].name + " … " + (.instances[-1].name | split("-") | last)) end), state: .phase, detail: (if .phase == "done" and .inferred then (if .unreadable > 0 then "not readable with your access" else "could not be read" end) elif .phase == "done" then (if .readyWhen == null then "" elif .forEach then ($field + " · " + (.satisfied | tostring) + " of " + (.expected | tostring)) else ($field + " · " + (.instances[0].value | tostring | if test("^[0-9a-f]{40}$") then .[0:7] else . end)) end) elif .phase == "waiting" then ($field + " · " + (.satisfied | tostring) + " of " + (.expected | tostring)) elif .phase == "withheld" then ("waits for " + ([ .waits[] as $w | $r.nodes[] | select(.id == $w.ref) | (if $w.all then "all " + (.expected | tostring) + " " else "" end) + .kind ] | join(", "))) elif .phase == "unreadable" then "not readable with your access" elif .phase == "unavailable" then "could not be read" else "" end), exception: .exception, parentRefs: [ .parents[] | { uid: ("arch:" + .) } ] } | if .exception == null then del(.exception) else . end ] end }'
