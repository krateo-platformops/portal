# Title for the /agents pagehead — the page H1.
#
# `level: 1`, NOT `strong: true`. Both reach a title in the SPA, but `strong` renders a body
# Paragraph that CSS promotes to a flat 26px/600 (Paragraph.module.css `.paragraph:has(strong)`),
# and the two section titles below used the same prop — so the page title, "Tool servers" and
# "Who may call what" all rendered at exactly the same size and the page had no hierarchy to read.
# `level` is the CRD's real heading axis (enum 1-5 → antd Typography.Title → a true <h1>), which
# gives this the display face at h1 scale AND makes the section titles' h2/h3 subordinate in the
# document outline, not just in pixels. Same prop the sibling detail page uses
# (paragraph.agent-detail-title, level 1); the size comes from antd's heading ramp, so nothing here
# hardcodes a px value. Dropping `strong` is not a loss: the Title path ignores it (Paragraph.tsx
# passes `strong` only on the Paragraph branch), so leaving it would imply an effect it cannot have.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-title
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: Agent control plane
    level: 1
  resourcesRefs:
    items: []
