# "Events" card → recent k8s Events for this component (Deployment + its
# ReplicaSets + its live pods), newest-first, capped at 20 by the RA. No
# `extra` subtext — title alone.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-component-detail-events
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name]
  widgetData:
    title: Events
    titleVariant: eyebrow
    variant: outlined
    items:
      - resourceRefId: list-component-detail-events
  resourcesRefs:
    items:
      - id: list-component-detail-events
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: list-component-detail-events
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
