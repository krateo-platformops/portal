# The gateway-topology section of /agents — a SECTION, not a page root.
#
# Like flex.agents-servers it has no route of its own: it answers the question the agent table above
# it raises ("15 agents, 9 tool servers, one model — what connects them?") off the same kagent.dev
# kinds plus the Gateway API ones, and it is one picture. The lead composes it by appending ONE item
# to flex.page-agents.
#
# Lives in .Release.Namespace like the other /agents children; only the page ROOT sits in the admin
# tier namespace, because only the root is addressed by the nav.
#
# `flowcharts` IS in the Flex allowedResources enum on the live CRD (verified on krateo-057:
# flexes.widgets.templates.krateo.io v1beta1 lists it between `flexes` and `forms`), so a FlowChart
# can be a Flex child without any CRD change. It is NOT in the Tabs enum — which is why this section
# is a Flex, as the Tool servers section is.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-topology
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - flexes
    - flowcharts
    - paragraphs
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-topology-head
    - resourceRefId: agents-topology-graph
  resourcesRefs:
    items:
    - id: agents-topology-head
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-topology-head
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: agents-topology-graph
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-topology
      namespace: {{ .Release.Namespace }}
      resource: flowcharts
      verb: GET
