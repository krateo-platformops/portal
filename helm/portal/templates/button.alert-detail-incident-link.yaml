{{/* Alert→incident back-link: this alert's newest Incident (label observability.krateo.io/alert). */}}
{{/* The label (its root cause, or its name) and the path come from alert-detail */}}
{{/* (.linkedIncident / .linkedRoute); the page includes it only when one exists. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-detail-incident-link
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: alert-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    label: View incident
    type: link
    size: small
    icon: fa-arrow-up-right-from-square
    clickActionId: open-incident
    actions:
      navigate:
        - id: open-incident
          type: navigate
          path: /incidents
  widgetDataTemplate:
    - forPath: label
      expression: '${ (.linkedIncident.title // "View incident") + " · " + (.linkedIncident.state // "Analyzing") + (if (.incidentCount // 0) > 1 then (" · latest of " + (.incidentCount | tostring)) else "" end) }'
    {{/* Defensive fallback to the /incidents list (never a 404) if linkedRoute is somehow empty. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "open-incident", type: "navigate", path: (if (.linkedRoute // "") != "" then .linkedRoute else "/incidents" end) } ] } }'
  resourcesRefs:
    items: []
