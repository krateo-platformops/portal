{{/* #84 §0.1: right-aligned holder for the /api-builder "Ask Autopilot →" primary CTA. Button has no */}}
{{/* justify/alignment field of its own, so a flush-right Flex row (justify: flex-end) wrapping just the */}}
{{/* button gives the header CTA its right alignment. Mirrors flex.obs-troubleshooting-cta. (Widget name */}}
{{/* stays kog-builder — internal — though the route is /api-builder.) */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: kog-builder-ask-cta
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - buttons
    justify: flex-end
    items:
    - resourceRefId: kog-builder-ask
  resourcesRefs:
    items:
    - id: kog-builder-ask
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: kog-builder-ask
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
