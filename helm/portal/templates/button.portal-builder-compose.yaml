{{/* THE PAGE'S PRIMARY ACTION, and the one that cannot fail. */}}
{{/*                                                                                              */}}
{{/* It used to be "Ask Autopilot". That button navigates to ?ask=, and when Autopilot is not     */}}
{{/* enabled on an install the click produces a warning notice and strips the param — so the      */}}
{{/* page's top-ranked action, its headline and its subtitle all described a capability that was  */}}
{{/* not there. Meanwhile /portal-builder/compose is a static frontend route behind no feature    */}}
{{/* flag, and it was presented as an outlined card with an eyebrow heading: the quietest         */}}
{{/* treatment the widget set offers, given to the only door that always opens.                   */}}
{{/*                                                                                              */}}
{{/* This is not a second door. It is the SAME door Autopilot delivers into — the composer claims */}}
{{/* the preview surface and the rail defers to it, so both routes end at one canvas and one      */}}
{{/* publish gate. What changes is which one the page ranks first.                                */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: portal-builder-compose
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    label: Open the composer
    icon: fa-table-cells-large
    size: middle
    type: primary
    clickActionId: portal-builder-compose
    actions:
      navigate:
        - id: portal-builder-compose
          type: navigate
          path: /portal-builder/compose
  resourcesRefs:
    items: []
