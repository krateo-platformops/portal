# Both ways to create an alert, paired in the header band — the treatment the agents page uses.
# Replaces flex.alerts-new-cta in the page composition (that CR stays for anything else using it).
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-header-actions
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - buttons
    justify: flex-end
    gap: small
    items:
    - resourceRefId: alerts-author-autopilot
    - resourceRefId: alerts-new
  resourcesRefs:
    items:
    - id: alerts-author-autopilot
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-author-autopilot
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
    - id: alerts-new
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-new
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
