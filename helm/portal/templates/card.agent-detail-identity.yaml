# "Identity" — what this object IS: GVK, namespace, agent type, runtime, who owns it, when it was
# created, its conditions, and the gateway route that makes it reachable over A2A. The Flex
# allowedResources enum has no `descriptions`, so the Descriptions list must be nested in a Card
# (same reason as card-blueprint-detail-info).
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-agent-detail-identity
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): the route params this widget's resolution varies by.
  keyExtras: [name, namespace]
  widgetData:
    title: Identity
    titleVariant: eyebrow
    variant: outlined
    items:
    - resourceRefId: descriptions-agent-detail-identity
  resourcesRefs:
    items:
    - id: descriptions-agent-detail-identity
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: descriptions-agent-detail-identity
      namespace: {{ .Release.Namespace }}
      resource: descriptions
      verb: GET
