{{/* Convention page root for /blueprint-builder — the Blueprint builder's home: a */}}
{{/* how-it-works header, the always-visible "Ask Autopilot →" CTA (the page's own entry */}}
{{/* into the flow), and the published-blueprints deliverables table (each row links to its */}}
{{/* blueprint detail). The authoring flow itself lives in the Autopilot rail (previewBlueprint */}}
{{/* → gated git publish); this page is the deliverables surface. The redundant "author with */}}
{{/* Autopilot" hint strip was removed — the three builder pages share the single Ask-Autopilot CTA. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-blueprint-builder
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - tables
    {{/* B4: the authoring card. Without this the Flex refuses to mount it. */}}
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: blueprint-builder-page-header
    {{/* #84 §0.1: CTA rides in a right-aligned wrapper Flex (was a bare left-aligned button). */}}
    - resourceRefId: blueprint-builder-ask-cta
    {{/* B4: authoring on the page. Placed ABOVE the deliverables table for the same reason the
         KOG builder places its author cards above its registry — the table answers "what did I
         ship?", so it belongs after the thing that ships. */}}
    - resourceRefId: author-blueprint-card
    - resourceRefId: blueprint-builder-deliverables
  resourcesRefs:
    items:
    - id: blueprint-builder-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprint-builder-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: blueprint-builder-ask-cta
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprint-builder-ask-cta
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: author-blueprint-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: author-blueprint-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: blueprint-builder-deliverables
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprint-builder-deliverables
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
