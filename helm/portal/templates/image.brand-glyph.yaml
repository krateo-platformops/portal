{{/* The compact brand mark for the collapsed icon rail: the app-shell Layout's */}}
{{/* `sider.collapsedHeader`, shown in place of brand-logo while the Sider is 80px wide. */}}
{{/* `preview: false` because a logo is decorative (no click-to-zoom). */}}
{{/* */}}
{{/* `src` is the Krateo glyph in Agentiko lilac (#DCD8F1), inlined as a data URI, the same way */}}
{{/* and in the same colour as brand-logo. Source: frontend ui/src/assets/images/logo_glyph.svg */}}
{{/* with every fill="#fff" set to #DCD8F1 (opacities and viewBox kept). 28px, centred in the */}}
{{/* rail's 64px header band. */}}
kind: Image
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: brand-glyph
  namespace: {{ .Release.Namespace }}
spec:
  widgetData:
    src: data:image/svg+xml;base64,
    alt: Krateo PlatformOps
    width: 28
    preview: false
