{{/* Ask Autopilot about this proposal. ?ask= is consumed on any route, so it stays on this page. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-proposal-ask
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-proposal
    namespace: {{ .Release.Namespace }}
  widgetData:
    {{/* A4, decided 2026-10-08 (frontend 1.7.0): every Autopilot entry point is the same object — */}}
    {{/* a FILLED button (type: primary, never a link) labelled "Ask Autopilot →" with the wand. */}}
    {{/* The arrow is back: it says the button takes you into the Autopilot rail. Enforced by the */}}
    {{/* design lint (autopilot-button). */}}
    label: Ask Autopilot →
    type: primary
    icon: fa-wand-magic-sparkles
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /reviews
  widgetDataTemplate:
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.askHref // "") != "" then .askHref else "/reviews" end) } ] } }'
  resourcesRefs:
    items: []
