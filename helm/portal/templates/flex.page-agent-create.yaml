{{/* Convention page root for /agents/new (nav item `page: agent-create` → resource `flexes`, name */}}
{{/* `page-<slug>`). Sibling of page-alert-create; no route params/extras, since the Agent GVR is */}}
{{/* static and agent-formdef needs no route identity. */}}
{{/* */}}
{{/* ORDER IS THE DESIGN. The gateway card sits BETWEEN the pagehead and the configuration card, so the */}}
{{/* sentence "this form cannot make the agent reachable" is read before a single field is typed — not */}}
{{/* discovered in a toast after the POST has already landed. That ordering is the whole reason this */}}
{{/* page has three sections instead of two; do not move the card below the form to "tidy up". */}}
{{/* */}}
{{/* NAMESPACE: the release namespace, NOT the admin tier namespace, and that is load-bearing rather */}}
{{/* than tidy. The `page:` convention resolves flexes/page-<slug> in the namespace the FRONTEND is */}}
{{/* configured with — Menu.tsx reads config.params.FRONTEND_NAMESPACE and hands it to buildNavModel, */}}
{{/* which builds the endpoint from it (navModel.ts resolveContentEndpoint). The tier namespace never */}}
{{/* reaches that lookup. A root parked in the admin tier therefore resolves only while */}}
{{/* .Values.tiers.admin is "" and 404s the moment an install tiers its pages — which is the layout */}}
{{/* the tier helper exists for. page-agent-detail carries the same note for the same reason. */}}
{{/* (page-agents CAN live in the tier namespace: its nav entry uses resourceRefId, and that */}}
{{/* resourcesRefs row carries an explicit namespace. This one, reached by `page:`, cannot.) */}}
{{/* It mattered less while /agents/new was URL-only; the /agents CTA now points here. */}}
{{/* */}}
{{/* Moving out of the tier loosens nothing: /agents/new is a label-less nav entry, so there is no */}}
{{/* sidebar item for tier-RBAC to hide, and the real gate on creating an Agent is the Form's own POST, */}}
{{/* which snowplow authorizes as the caller. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-agent-create
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
      - pageheaders
      - cards
    vertical: true
    gap: large
    items:
      - resourceRefId: agent-create-page-header
      - resourceRefId: agent-create-gateway-card
      - resourceRefId: agent-create-form-card
  resourcesRefs:
    items:
      - id: agent-create-page-header
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: agent-create-page-header
        namespace: {{ .Release.Namespace }}
        resource: pageheaders
        verb: GET
      - id: agent-create-gateway-card
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: agent-create-gateway-card
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: agent-create-form-card
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: agent-create-form-card
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
