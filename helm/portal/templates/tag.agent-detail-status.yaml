# Exception-only condition chip. Never rendered for a healthy agent — flex.agent-detail-titleline
# only references it when agent-detail computed a non-empty statusLabel, so there is no green
# "Ready" pill anywhere on this page. Label + colour come from the RA: red when a Ready/Accepted
# condition is False, orange for an advisory (UnsupportedFeatures=True), and the label reads in
# Kubernetes vocabulary (NotReady / UnsupportedFeatures / <Type>Unknown), never invented words.
kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agent-detail-status
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): the route params this widget's resolution varies by.
  keyExtras: [name, namespace]
  apiRef:
    name: agent-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    label: ""
    color: orange
  widgetDataTemplate:
    - forPath: label
      expression: '${ .statusLabel // "" }'
    - forPath: color
      expression: '${ if ((.statusColor // "") == "") then "orange" else .statusColor end }'
  resourcesRefs:
    items: []
