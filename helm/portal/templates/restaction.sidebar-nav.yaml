{{/*
  THE SIDEBAR, ASSEMBLED FROM WHAT IS INSTALLED.

  Until now the nav was two static sources, and neither survived a second portal chart: items
  written out in menu.sidebar-nav.yaml, plus a BUILD-TIME `.Files.Glob` over nav fragments inside
  THIS chart. A page shipped by another chart could never contribute an entry, which is why
  portal-agents needs a `.Values.agents.enabled` flag in the BASE chart — a flag a human keeps in
  step with what is actually installed, and which shows an entry that 404s when they do not.

  This lists page roots and lets each one declare its own entry through `krateo.io/nav-*`
  annotations. Install a page chart and its entries appear; uninstall it and they are gone. No edit
  to this chart, no flag.

  IT ALSO EMITS `refs`, AND THAT IS LOAD-BEARING TWICE. `$roots` is bound BEFORE the slug and alias
  fan-out, so refs are one-per-page-root: an alias cannot produce a duplicate, and a synthesised
  divider cannot produce a ref-less entry. menu.sidebar-nav feeds it to resourcesRefsTemplate, which
  lands in status.resourcesRefs.items[] — the edge snowplow re-derives `allowed` on per identity,
  and the edge the prewarm walker follows.

  Every entry now carries `resourceRefId` too. Without it the frontend's nav gate is UNREACHABLE:
  navModel.isNavEntryAllowed fail-opens for any item with no resourceRefId, which since the
  annotation migration has been every item, so every user sees every entry regardless of what they
  can open (krateo-platformops/frontend#284). The three changes are inseparable — a resourceRefId
  with no matching ref hides the entry, so shipping it without the refs array blanks the sidebar for
  everyone.

  WHICH NAMESPACES IT LOOKS IN IS DISCOVERED, NOT CONFIGURED (#261).

  It used to be one step per `.Values.tiers.<tier>` — three deployer-set namespace strings this
  chart invented and resolved through a `portal.tierNamespace` helper. That helper was not an RBAC
  mechanism and no RBAC object ever referenced it: it was a name for a namespace, and the pages it
  named were reachable or not purely by the Role bindings in those namespaces. Worse, it could only
  ever see the namespaces THIS chart was told about, so a page chart installed into a fourth
  namespace was invisible to the sidebar no matter what the caller could read.

  A CLUSTER-SCOPED LIST IS STILL NOT THE ANSWER, for the reason the tiered version documented: it
  403s for any caller without cluster-wide read on flexes — the namespace-scoped tenant persona
  this portal ships is exactly that — and a 403 here means a portal with NO NAVIGATION AT ALL.

  So the namespaces are DERIVED FROM THE CALLER'S OWN RBAC. snowplow lists namespaces under its own
  ServiceAccount (the caller cannot list namespaces, and granting that to everyone would publish
  the cluster's namespace inventory, tenant names included) and a `userAccessFilter` narrows the
  answer to the namespaces where THE CALLER may list flexes — which is exactly the question the
  sidebar is asking. `blueprint-formdef`'s own `namespaces` step is this same shape, and has been in
  production for as long as the install form has offered a namespace picker.

  Install a page chart anywhere the caller can read and its entries appear. Nothing to configure.

  THE `pages` STEP CARRIES NO userAccessFilter, DELIBERATELY. It has no endpointRef either, and
  that pair is what makes it the caller's own read: `resolveStageEndpoint` sends a UAF stage to
  snowplow's SA endpoint and a non-UAF stage "through the per-user clientconfig" (its own words,
  resolvers/restactions/api/resolve.go:386), so a nil ref resolves to the CALLER's
  `<user>-clientconfig` — which holds that user's own k8s credential, a client cert or their own
  token. The apiserver evaluates THAT USER. So the apiserver stays the authority on which page
  roots this caller may see, exactly as the tiered version had it, and the nav adds no
  authorisation surface of its own.

  IT IS THE ENDPOINT THAT CARRIES THIS, NOT A FORWARDED TOKEN, and the distinction is worth the
  line because the obvious place to look is wrong. snowplow does append the caller's Krateo authn
  JWT to some stages — but `bearerAppendForStage` (api/self_host.go:171) DROPPED the nil-ref case
  in #292: that JWT is not a k8s credential, and putting it on an apiserver dial only leaks it
  (cert auth presents it on the wire) or suppresses the real token (client-go will not overwrite an
  existing Authorization header). It survives only for `exportJWT: true` and the self-loopback back
  at snowplow's own /call. Anyone tracing "what authorizes this read?" through the bearer append
  will find #292 removed it and conclude nothing does. The clientconfig does. Only the namespace DISCOVERY depends on snowplow's own
  userAccessFilter re-gate, which is a path with live defects (snowplow#777, #659) — so that one
  step is `continueOnError` AND falls back to the release namespace in the iterator below. A
  snowplow-side failure then costs the pages in other namespaces, never the whole sidebar.
*/}}
{{- $ns := .Release.Namespace -}}
kind: RESTAction
apiVersion: templates.krateo.io/v1
metadata:
  name: sidebar-nav
  namespace: {{ $ns }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{/* The namespaces where THIS CALLER may list page roots. A userAccessFilter stage dials */}}
    {{/* snowplow's OWN SA endpoint by design (resolveStageEndpoint, api/resolve.go:386) and is */}}
    {{/* narrowed downstream instead — here, by SubjectAccessReview per namespace. So the caller */}}
    {{/* needs no cluster-wide grant of any kind; see the header on what authorizes `pages`. */}}
    - name: namespaces
      path: /api/v1/namespaces
      verb: GET
      headers:
        - 'Accept: application/json'
      userAccessFilter:
        verb: list
        group: widgets.templates.krateo.io
        resource: flexes
        namespaceFrom: .metadata.name
      {{/* A snowplow-side failure here must cost the pages in OTHER namespaces, not the sidebar. */}}
      continueOnError: true
      errorKey: namespacesError
      filter: "[.namespaces.items[]? | .metadata.name]"
    {{/* One namespaced LIST per discovered namespace, dialled AS THE CALLER (no userAccessFilter, */}}
    {{/* no endpointRef). The iterator is also the input gate (scripts/lint-ra-paths.py): it can */}}
    {{/* never yield an element without a namespace, so the path is never half-built. */}}
    {{/* */}}
    {{/* THE FALLBACK IS LOAD-BEARING, and it is what makes the step above safe to depend on. An */}}
    {{/* empty `.namespaces` — snowplow's UAF failed, or really no namespace is listable — would */}}
    {{/* otherwise yield an empty iterator, which snowplow turns into ZERO requests and so a blank */}}
    {{/* sidebar. With it the nav degrades to "the pages in the release namespace", which is what */}}
    {{/* every single-namespace install has today, and the caller's own RBAC still decides whether */}}
    {{/* that LIST is served. It is also what the Phase-1 prewarm walk (no extras, no upstream */}}
    {{/* output) dials, so the common namespace is warmed rather than skipped. */}}
    - name: pages
      dependsOn:
        name: namespaces
        iterator: >-
          [ ((.namespaces // []) | if length > 0 then . else ["{{ $ns }}"] end)[]
            | { ns: . } | select(.ns != "") ]
      path: ${ "/apis/widgets.templates.krateo.io/v1beta1/namespaces/" + .ns + "/flexes" }
      verb: GET
      headers:
        - 'Accept: application/json'
      {{/* A namespace this caller cannot read must cost them the pages in it, not the whole */}}
      {{/* sidebar. The per-iteration results are concatenated into one flat `.pages` array. */}}
      continueOnError: true
      errorKey: pagesError
      filter: >
        [ .pages.items[]?
          | { metadata: { name: .metadata.name,
                          namespace: .metadata.namespace,
                          annotations: (.metadata.annotations // {}) } } ]
  filter: >
    [ (.pages // [])[]
      | select(((.metadata.annotations // {})["krateo.io/nav-path"] // "") != "")
    ] as $roots
    | ( [ $roots[]
      | (.metadata.annotations // {}) as $a
      | (.metadata.name) as $root
      | (.metadata.name | sub("^page-"; "")) as $slug
      | (($a["krateo.io/nav-order"] // "100") | tonumber) as $ord
      | ( { path: $a["krateo.io/nav-path"], page: $slug, order: $ord, resourceRefId: $root }
          + (if $a["krateo.io/nav-label"] then { label: $a["krateo.io/nav-label"] } else {} end)
          + (if $a["krateo.io/nav-icon"]  then { icon:  $a["krateo.io/nav-icon"]  } else {} end)
          + (if $a["krateo.io/nav-group"] then { group: $a["krateo.io/nav-group"] } else {} end) ),
        ( ($a["krateo.io/nav-alias"] // "") | split(",")[] | select(length > 0)
          | { path: ., page: $slug, order: $ord, resourceRefId: $root } )
    ] ) as $entries
    | ( [ $entries[] | select(.label != null and .group != null) ]
        | group_by(.group) | map({ group: .[0].group, min: (map(.order) | min) })
        | sort_by(.min) | .[1:]
        | map({ type: "divider", order: (.min - 1) }) ) as $dividers
    | { items: ( ($entries | map(del(.group)) | unique) + $dividers | sort_by(.order) ),
        refs:  ( [ $roots[] | { id: .metadata.name, name: .metadata.name, namespace: .metadata.namespace } ] | unique ) }
