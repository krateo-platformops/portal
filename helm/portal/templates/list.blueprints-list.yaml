{{/* Dashboard "Recent blueprints" — real, no hardcoded data. Fed from the SAME */}}
{{/* blueprints-cards RA the marketplace uses (self-registered blueprint Cards), so */}}
{{/* the dashboard and the marketplace agree on the blueprint set + categories. */}}
{{/* Honest-data: there is no backable per-blueprint "installs" metric, so the */}}
{{/* mockup's install counts are dropped; we show the 5 most-recently-registered */}}
{{/* blueprints with their real tags as the category line. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprints-list
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, q]
  apiRef:
    name: blueprints-cards
    namespace: {{ .Release.Namespace }}
  widgetData:
    itemLayout: horizontal
    split: false
    dataSource: []
    itemTemplate:
      icon: fa-cube
      primaryText: '{name}'
      {{/* version badge (mono pill) + category as a colour tag — mirrors the Blueprints-page */}}
      {{/* tile elements; row click → the blueprint detail page (like the Blueprints grid). */}}
      subPrimaryText: 'v{version}'
      subPrimaryTextMono: true
      secondaryText: '{category}'
      secondaryTextAsTag: true
      {{/* Feedback: the row showed the AGE only ("3 days ago"), and the question a reader */}}
      {{/* actually has is WHEN the blueprint became available — the age alone cannot answer */}}
      {{/* "was that before or after the incident?". Both now ride in one slot as */}}
      {{/* "2026-09-12 · 3d". */}}
      {{/* */}}
      {{/* The `relative` FORMAT is gone deliberately, and it is a real trade rather than an */}}
      {{/* oversight: that format reformats the WHOLE slot at render time (live, not */}}
      {{/* fetch-stale), so it cannot coexist with any other text in the same slot — a */}}
      {{/* composed string falls through Date parsing and renders raw. The four row slots are */}}
      {{/* all taken (name / version / category tag / this one) and `description` renders only */}}
      {{/* in the CARD variant, not in rows, so there is nowhere else to put the second value. */}}
      {{/* Composing server-side costs live ticking; on a dashboard that refetches, a day-grain */}}
      {{/* age does not tick meaningfully anyway. */}}
      {{/* */}}
      {{/* The age falls back to HOURS below a day. Flooring elapsed-seconds/86400 renders */}}
      {{/* anything under 24h as "today", so a blueprint registered 22 hours ago — yesterday, */}}
      {{/* to the reader — claimed to be today's. */}}
      {{/* */}}
      {{/* The date format is %Y-%m-%d and NOT "%d %b %Y" on purpose: strftime's %b is LOCALE */}}
      {{/* dependent, and this string is built server-side — the same expression rendered */}}
      {{/* "12 Set 2026" under an Italian locale during testing. An ISO-shaped date cannot */}}
      {{/* drift with the server's locale and sorts correctly if anyone ever reads the column. */}}
      subSecondaryText: '{registered}'
      navigateTo: '/blueprints/{namespace}/{name}'
  {{/* D3: sort by creationTimestamp DESC → the genuinely most-recently-registered 5 (honest */}}
  {{/* "Recent blueprints"), not the alphabetical first-5 that blueprints-cards' name-sort gave. */}}
  {{/* `created` rides along only for the sort; the itemTemplate renders name + version + category */}}
  {{/* tag. version (.spec.chart.version) + namespace ride along for the badge + row navigateTo. */}}
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ (now) as $now | [ .cards[]? | (.metadata.creationTimestamp // "") as $c | { name: .metadata.name, namespace: .metadata.namespace, version: (.version // ""), category: (if ((.tags // []) | length) > 0 then (.tags | join(" · ")) else "blueprint" end), created: $c, registered: (if $c == "" then "" else (($c | fromdateiso8601) as $t | ($c | fromdateiso8601 | strftime("%Y-%m-%d")) + " · " + (($now - $t) as $age | if $age < 3600 then "<1h" elif $age < 86400 then ((($age / 3600) | floor | tostring) + "h") else ((($age / 86400) | floor | tostring) + "d") end)) end) } ] | sort_by(.created) | reverse | .[0:5] }'
  resourcesRefs:
    items: []
