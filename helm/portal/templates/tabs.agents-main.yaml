{{/* The agents page is TABBED, not a single scroll — this is the mockup's architecture and the */}}
{{/* thing the first implementation missed. Each section had been built and verified; they were */}}
{{/* simply stacked. Stacking is also why "sections are not clearly divided" was reported: the */}}
{{/* mockup never divided them, it separated them. */}}
{{/* */}}
{{/* Every pane is a `cols` wrapper because the Tabs allowedResources enum has no `flexes` — */}}
{{/* see col.agents-tab-*. */}}
{{/* */}}
{{/* Tab ORDER follows the reading order the page already had: what exists, how it is wired, what */}}
{{/* it may call, what one request does. The inventory stays first because it is the answer most */}}
{{/* visits want. */}}
kind: Tabs
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-main
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - cols
    items:
    - label: Agents
      resourceRefId: agents-tab-inventory
    - label: Topology
      resourceRefId: agents-tab-topology
    - label: Tool servers
      resourceRefId: agents-tab-servers
    - label: Request flow
      resourceRefId: agents-tab-flow
  resourcesRefs:
    items:
    - id: agents-tab-inventory
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-tab-inventory
      namespace: {{ .Release.Namespace }}
      resource: cols
      verb: GET
    - id: agents-tab-topology
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-tab-topology
      namespace: {{ .Release.Namespace }}
      resource: cols
      verb: GET
    - id: agents-tab-servers
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-tab-servers
      namespace: {{ .Release.Namespace }}
      resource: cols
      verb: GET
    - id: agents-tab-flow
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-tab-flow
      namespace: {{ .Release.Namespace }}
      resource: cols
      verb: GET
