{{/* The /reviews page header. The subtitle carries the page's one essential fact: nothing listed has */}}
{{/* been applied, and a proposal becomes a change request only when someone opens one. The counter */}}
{{/* is the undecided proposals, the only number anyone acts on. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: platform-reviews
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Platform review
    counterLabel: open
    subtitle: >-
      Changes the nightly review suggests after reading this platform's telemetry and agent
      sessions. Nothing here has been applied. A proposal becomes a change request only when someone
      opens one from it, and its pull request is where the change is decided.
    allowedResources: []
    items: []
  widgetDataTemplate:
    - forPath: counter
      expression: '${ .open // 0 }'
  {{/* REQUIRED even when empty: the apiserver rejects a PageHeader without spec.resourcesRefs. */}}
  resourcesRefs:
    items: []
