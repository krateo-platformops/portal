{{- if (.Values.observability | default dict).snowplowSli }}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-card-log-levels
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: ERROR and WARN lines
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - linecharts
    items:
    - resourceRefId: sp-log-levels
  resourcesRefs:
    items:
      - id: sp-log-levels
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-log-levels
        namespace: {{ .Release.Namespace }}
        resource: linecharts
        verb: GET
{{- end }}
