{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Snowplow SLI — "Informers & refresh" tab. Panels are Cards, one per query; see portal#201. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-tab-informers
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - cards
    items:
    - resourceRefId: sp-card-informer-states
    - resourceRefId: sp-card-informer-freshness
    - resourceRefId: sp-card-queue-depth
    - resourceRefId: sp-card-authz-memo
    - resourceRefId: sp-card-refresher-outcomes
  resourcesRefs:
    items:
      - id: sp-card-informer-states
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-card-informer-states
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: sp-card-informer-freshness
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-card-informer-freshness
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: sp-card-queue-depth
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-card-queue-depth
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: sp-card-authz-memo
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-card-authz-memo
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: sp-card-refresher-outcomes
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-card-refresher-outcomes
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
{{- end }}
