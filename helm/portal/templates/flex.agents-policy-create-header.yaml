# Eyebrow + H1 + lede for /agents/policies/new, mirroring flex.agent-create-header.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policy-create-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - paragraphs
    vertical: true
    gap: small
    items:
    - resourceRefId: agents-policy-create-eyebrow
    - resourceRefId: agents-policy-create-title
    - resourceRefId: agents-policy-create-subtitle
  resourcesRefs:
    items:
{{- range (list "agents-policy-create-eyebrow" "agents-policy-create-title" "agents-policy-create-subtitle") }}
    - id: {{ . }}
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: {{ . }}
      namespace: {{ $.Release.Namespace }}
      resource: paragraphs
      verb: GET
{{- end }}
