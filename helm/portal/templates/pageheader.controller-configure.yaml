{{/* The /controller-builder/configure/{namespace}/{name} header: which kind, and where. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: controller-configure-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    title: Configure credentials
    subtitle: Store the credential this controller calls its API with, and the configuration that points at it
  widgetDataTemplate:
    - forPath: subtitle
      expression: '${ "Store the credential " + (.name // "this kind") + " calls its API with, in " + (.namespace // "its namespace") + ", and the configuration that points at it" }'
  resourcesRefs:
    items: []
