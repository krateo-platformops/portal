{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Mean server request duration. /refreshes is excluded — it is the SSE stream (~4 h per connection) and would set the axis. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-http-mean
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "/call": cyan
    shapeField: smooth
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: (.route|tostring), v: (.mean_s|tonumber) } ] }'
  apiRef:
    name: sp-http-mean
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
{{- end }}
