{{/* The incident list — one row per Incident, off incidents-list (which applies the ?status= */}}
{{/* filter server-side): severity dot, title, state, firings, age. Row click → the incident */}}
{{/* detail page; the {namespace}/{name} placeholders fill from hidden cells. */}}
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-table
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, status]
  widgetData:
    {{/* fitContent: shrink columns to the container instead of the default horizontal scrollbar. */}}
    {{/* A wide cell ellipsis-truncates and carries its full value on hover (P19), which reads far */}}
    {{/* better than a sideways scroll inside a card. Unset is NOT neutral — it sets */}}
    {{/* scroll.x: max-content, so leaving it out chooses the scrollbar by omission. */}}
    fitContent: true
    allowedResources: []
    bordered: false
    size: small
    rowNavigateTo: /incidents/{namespace}/{name}
    pagination:
      defaultPageSize: 15
    columns:
    - valueKey: sev
      title: ' '
    - valueKey: title
      title: Incident
    - valueKey: state
      title: State
    - valueKey: firings
      title: Firings
    - valueKey: age
      title: Age
    dataSource: []
  widgetDataTemplate:
  {{/* The title can be a long root-cause sentence; it is capped at ~110 chars so it does not */}}
  {{/* crush the trailing columns (the Table columns carry no width knobs). */}}
  - forPath: dataSource
    expression: '${ [ (.rows // [])[] | [ {valueKey:"sev",kind:"jsonSchemaType",type:"string",stringValue:"●",color:(.sevColor // "#8c8c8c")}, {valueKey:"title",kind:"jsonSchemaType",type:"string",stringValue:((.title // "") | if length > 110 then (.[0:109] + "…") else . end)}, {valueKey:"state",kind:"tag",stringValue:(.state // "Analyzing"),color:({ Open: "red", Verifying: "orange", Resolved: "green" }[.state // ""] // "gray")}, {valueKey:"firings",kind:"jsonSchemaType",type:"string",stringValue:((.firings // 0) | tostring)}, {valueKey:"age",kind:"jsonSchemaType",type:"string",stringValue:(.age // ""),format:"relative"}, {valueKey:"name",kind:"jsonSchemaType",type:"string",stringValue:(.name // "")}, {valueKey:"namespace",kind:"jsonSchemaType",type:"string",stringValue:(.namespace // "")} ] ] }'
  apiRef:
    name: incidents-list
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
