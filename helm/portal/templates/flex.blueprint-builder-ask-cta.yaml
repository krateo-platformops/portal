{{/* #84 §0.1: right-aligned holder for the /blueprint-builder "Ask Autopilot →" primary CTA. Button has */}}
{{/* no justify/alignment field of its own, so a flush-right Flex row (justify: flex-end) wrapping just */}}
{{/* the button gives the header CTA its right alignment. Mirrors flex.obs-troubleshooting-cta. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-builder-ask-cta
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - buttons
    justify: flex-end
    items:
    - resourceRefId: blueprint-builder-ask
  resourcesRefs:
    items:
    - id: blueprint-builder-ask
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprint-builder-ask
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
