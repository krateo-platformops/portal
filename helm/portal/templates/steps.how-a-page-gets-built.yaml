{{/* WHAT IT COSTS AND WHAT YOU GET — the section the page did not have.                          */}}
{{/*                                                                                              */}}
{{/* A first-time visitor could not tell from this page that there is a drag-and-drop composer at */}}
{{/* all, that there are forty-four widget kinds, that RESTActions are authorable, or that the    */}}
{{/* preview is a real render by the real server rather than a mockup. The one sentence that      */}}
{{/* described the composer promised binding "without writing jq", which the shipped form         */}}
{{/* explicitly does not claim — it takes the expression and lets the server judge it.            */}}
{{/*                                                                                              */}}
{{/* Four steps answer the question faster than a paragraph, and Steps items carry eyebrow, title */}}
{{/* and description, so the copy fits the widget rather than being squeezed into one.            */}}
kind: Steps
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: how-a-page-gets-built
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    {{/* VERTICAL, because of what the copy IS. Horizontal gives each of four steps a quarter of */}}
    {{/* the card's width, and these descriptions are forty words each — they cramp, wrap hard,  */}}
    {{/* and collide with the card's `extra` slot, which is where the Ask Autopilot button sits.  */}}
    {{/* Reported from the rendered page, not theorised.                                         */}}
    {{/*                                                                                         */}}
    {{/* Shortening the copy to fit horizontal was the other option and it is the wrong trade:    */}}
    {{/* this section exists BECAUSE the page previously said nothing about what the composer     */}}
    {{/* does. Vertical gives each step the full width, reads as the sequence it is, and leaves   */}}
    {{/* the head row to the button.                                                             */}}
    orientation: vertical
    items:
      - eyebrow: Step 1
        title: Start a draft
        icon: fa-file-circle-plus
        description: >-
          Name the page and drag widgets onto the canvas — the same kinds this portal is built
          from, nested in rows, columns, cards and tabs. A drop a parent cannot legally hold is
          refused, so a draft that assembles is a draft that renders.
      - eyebrow: Step 2
        title: Give the widgets their data
        icon: fa-plug
        description: >-
          Point a widget at a RESTAction already on this cluster, or write a new one into the
          draft — several API steps, chained with dependsOn, and your own jq filter. apiRef,
          widgetDataTemplate and resourcesRefsTemplate are all yours to edit.
      - eyebrow: Step 3
        title: Preview it for real
        icon: fa-eye
        description: >-
          The draft is applied to a quarantined sandbox namespace and rendered by the live server
          under your identity and your permissions. It is not a mockup: the same service that
          serves this page compiles your draft.
      - eyebrow: Step 4
        title: Publish as a change request
        icon: fa-code-pull-request
        description: >-
          Publishing commits every file — the page root, each widget, each RESTAction — to the
          portal's git repo and opens a change request. Review it, merge it, release the chart.
          Nothing reaches this portal before that.
  resourcesRefs:
    items: []
