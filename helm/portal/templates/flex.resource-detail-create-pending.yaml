# The stuck-create block: the warning, then the action that resolves it. Composed by
# flex.page-resource-detail ONLY when the annotation is present, so a healthy resource shows
# nothing at all.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: resource-detail-create-pending-block
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6: this page is a parameterized route (/resources/{namespace}/{group}/{version}/{plural}/{name}),
  # so every widget on it must partition its cache cell by the full key set or it serves another
  # resource's block. scripts/lint-keyextras.py fails the build without this.
  keyExtras: [namespace, group, version, plural, name]
  widgetData:
    allowedResources:
    - cards
    - buttons
    vertical: true
    gap: small
    items:
    - resourceRefId: resource-detail-create-pending-card
    - resourceRefId: resource-detail-clear-create-pending
  resourcesRefs:
    items:
    - id: resource-detail-create-pending-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: resource-detail-create-pending-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: resource-detail-clear-create-pending
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: resource-detail-clear-create-pending
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
