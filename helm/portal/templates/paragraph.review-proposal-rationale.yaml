kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-proposal-rationale
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-proposal
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: No rationale recorded.
  widgetDataTemplate:
    - forPath: text
      expression: '${ .rationale // "No rationale recorded." }'
  resourcesRefs:
    items: []
