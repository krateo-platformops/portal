{{/* Beside "Run review now": the latest review run, so a manual start can be followed from the page. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-last-run
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: platform-reviews
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: No review has run yet
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ if (.lastRun // null) == null then "No review has run yet" else ("Last run " + .lastRun.name + " · " + .lastRun.phase + " · " + .lastRun.started) end }'
  resourcesRefs:
    items: []
