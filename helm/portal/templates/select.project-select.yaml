{{/* Project (= namespace) scope selector for the shell sider. A URL-query-bound MULTI-select */}}
{{/* (mode: multiple, queryParam: projects): picking one or more projects writes ?projects=<ns,ns> */}}
{{/* (comma-joined), which the frontend forwards into extras; compositions-list (dashboard */}}
{{/* stats/donut/rail + the compositions table) and blueprints-cards read `.projects` and scope */}}
{{/* to those namespaces server-side. An EMPTY selection = All projects (cluster-wide) — there is */}}
{{/* no "All projects" option; the placeholder shows it. allowClear ✕ resets to all. Options come */}}
{{/* from the `projects` RA (UAF-gated namespaces, minus the installer's own namespace). */}}
kind: Select
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: project-select
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6: the shell scope selector writes ?projects= which rides EVERY route's extras; */}}
  {{/* declare it so this chrome widget stays cacheable instead of guard-declining on */}}
  {{/* each navigation (the west4 dashboard first-nav 98.4%->89.6% regression). */}}
  keyExtras: [projects]
  widgetData:
    name: projects
    queryParam: projects
    {{/* Wording (Diego, 2026-11-24): a namespace is a place, a tenant is a customer, "project" is */}}
    {{/* not used. `label` is the panel's eyebrow, `placeholder` the master row and the closed */}}
    {{/* control with nothing picked; several picked read as one line (`summary`). */}}
    label: Namespaces
    mode: multiple
    placeholder: All namespaces
    summary: '{count} namespaces'
    panelFooter: kept from page to page
    size: small
    allowClear: true
    options: []
  widgetDataTemplate:
    - forPath: options
      expression: '${ .options }'
  apiRef:
    name: projects
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
