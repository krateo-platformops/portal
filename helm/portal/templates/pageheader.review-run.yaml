kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-run-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-run
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Review run
    allowedResources: []
    items: []
  widgetDataTemplate:
    - forPath: title
      expression: '${ if (.found // false) then .name else (.title // "Review run") end }'
    - forPath: subtitle
      expression: '${ if (.found // false) then .subtitle else "" end }'
    - forPath: tags
      expression: '${ if (.found // false) then [ { label: .phase, color: .phaseColor } ] else [] end }'
  resourcesRefs:
    items: []
