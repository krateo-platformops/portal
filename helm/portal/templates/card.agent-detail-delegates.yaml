# "Delegation" — the sub-agents this agent may hand a task to. Rendered only when the agent
# actually declares tools[].type=Agent, so a leaf specialist gets no empty table.
#
# Caption is TEMPLATED for the same reason as the Tools card: a caller who cannot LIST agents can
# still read this one (the detail read only needs `get`), and in that case the target-state column
# is unavoidably blank — the caption says why instead of implying every delegate is fine.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-agent-detail-delegates
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): the route params this widget's resolution varies by.
  keyExtras: [name, namespace]
  apiRef:
    name: agent-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Delegation
    titleVariant: eyebrow
    variant: outlined
    headerLeft: Sub-agents this agent may hand a task to.
    items:
    - resourceRefId: agent-detail-delegates
  widgetDataTemplate:
    - forPath: headerLeft
      expression: '${ .delegatesCaption // "" }'
  resourcesRefs:
    items:
    - id: agent-detail-delegates
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agent-detail-delegates
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
