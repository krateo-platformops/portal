{{/* Settings → Users tab — the platform users the cluster KNOWS, read without a Secret. */}}
{{/* */}}
{{/* NO SECRETS. This used to LIST the release namespace's Secrets for the per-user */}}
{{/* `<username>-clientconfig` that authn writes at every login. A RESTAction must never read */}}
{{/* Secrets (scripts/lint-ra-secrets.py): snowplow serves such a read from a cluster-wide */}}
{{/* informer it registers on first touch, data included and the Accept header ignored, so */}}
{{/* even a names-only filter pulled every Secret's data into snowplow. authn writes nothing */}}
{{/* else per login (its CSR is deleted once the certificate is issued — authn 0.27.3 */}}
{{/* kube/config/gen.go), so "everyone who has authenticated" has no other source. */}}
{{/* */}}
{{/* The users are now the union of: */}}
{{/*   - the basic-strategy User CRs (users.basic.authn.krateo.io), with their groups; */}}
{{/*   - the User subjects of the RoleBindings the Access page manages */}}
{{/*     (krateo.io/managed-by=portal-access; subjects[] keeps the RAW name). */}}
{{/* An OIDC/LDAP/OAuth identity is listed once it holds a managed grant; one that has only */}}
{{/* logged in is not. "Issued" and "Certificate expires" are gone: both came from the */}}
{{/* Secret's creationTimestamp alone (and under-reported a refreshed session anyway). */}}
{{/* */}}
{{/* `.personas`: username, groups (the User CR's; "—" for an identity without one — */}}
{{/* OIDC/LDAP groups live in the IdP), the count of managed grants, joined on the */}}
{{/* slugified subject label exactly as form.access-grant writes it, and `source` — which of */}}
{{/* the two sets listed the user: "User CR", "Grant" (a raw User subject of a managed */}}
{{/* grant) or "User CR · Grant". Both steps are reads a non-admin may be denied: */}}
{{/* continueOnError, so the table degrades to what can be read (and so does `source`). */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: settings-users
  namespace: {{ .Release.Namespace }}
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    {{/* Basic-strategy User CRs — users and the only cluster-readable groups source (W3-2). */}}
    {{/* Cluster-wide list; absent CRD (OIDC/LDAP-only clusters) degrades via */}}
    {{/* continueOnError to grant subjects alone. */}}
    - name: basicUsers
      path: /apis/basic.authn.krateo.io/v1alpha1/users
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: basicUsersError
      filter: >
        [ .basicUsers.items[]?
          | { name: (.metadata.name // ""), groups: (.spec.groups // []) } ]
    {{/* Managed access grants — RoleBindings the Access page created (label-selected, */}}
    {{/* cluster-wide list of the namespaced objects). The subject label (the grant count's */}}
    {{/* join key) and the raw User subject names (users known only by a grant). */}}
    - name: grantBindings
      path: /apis/rbac.authorization.k8s.io/v1/rolebindings?labelSelector=krateo.io%2Fmanaged-by%3Dportal-access
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: grantBindingsError
      filter: >
        [ .grantBindings.items[]?
          | { subject: (((.metadata.labels // {})["krateo.io/subject"]) // ""),
              namespace: (.metadata.namespace // ""),
              users: [ (.subjects // [])[] | select((.kind // "") == "User") | (.name // "") | select(. != "") ] } ]
  filter: >
    def slug: ascii_downcase | gsub("[^a-z0-9-]"; "-");
    ((if (.basicUsers // []) | type == "array" then .basicUsers else [] end) // []) as $users
    | ((if (.grantBindings // []) | type == "array" then .grantBindings else [] end) // []) as $grants
    | [ $users[] | .name ] as $crNames
    | [ $grants[] | (.users // [])[] ] as $grantNames
    | {
      personas: (
        ($crNames + $grantNames) | map(select(. != "")) | unique
        | map(. as $u
              | { username: $u,
                  groups: ((([ $users[] | select(.name == $u) ] | first) | .groups) // []),
                  grants: ([ $grants[] | select(.subject == ($u | slug)) ] | length),
                  source: ([ (if any($crNames[]; . == $u) then "User CR" else empty end),
                             (if any($grantNames[]; . == $u) then "Grant" else empty end) ]
                           | join(" · ")) })
      )
    }
