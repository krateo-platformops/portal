{{/* The closing line of "Your drafts" on /blueprint-builder, from the approved mockup. It is the */}}
{{/* lifecycle in one sentence — no janitor and no TTL: a record goes only when its person */}}
{{/* discards it, or removes it once published. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: drafts-no-timer-note
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    type: secondary
    text: Nothing here is deleted on a timer. A draft stays until you publish and remove it, or discard it.
  resourcesRefs:
    items: []
