# Subtitle for the Tool servers table. Says exactly where each column comes from, because the two
# most surprising numbers on the page (Discovered vs In use) are only meaningful if the reader
# knows one is the server's own report and the other is the union of what agents bind.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-subtitle
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      Every MCP server the agents on this cluster can reach — endpoint, protocol and timeout from the
      RemoteMCPServer spec, Discovered from the tools that server reports, In use from how many of
      them at least one agent binds. Status fills in only when something needs attention: a
      RemoteMCPServer that is not Accepted, or an endpoint with no agentgateway route in front of it.
    type: secondary
  resourcesRefs:
    items: []
