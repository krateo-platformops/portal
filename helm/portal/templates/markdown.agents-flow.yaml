# The seven hops themselves. Each item is one authored sentence followed by one derived line.
#
# WHY ONE STRING AND NOT A TABLE. The two halves have to interleave per hop to be read at all — a
# prose list above a 7-row table is the same seven things said twice, and the derived half is one
# long sentence per hop ("passthrough, resiliency-a2a (10 of 13) · gateway-wide: accesslog, authz,
# cors, jwt, metrics, tracing"), which is a paragraph, not a cell. Only one widget can own one
# string, so the composition happens in the RESTAction, where the seven authored sentences sit in a
# single named array beside the predicates that resolve their routes — both halves auditable in one
# file. The widget formats nothing.
#
# CommonMark only: the renderer loads no remark-gfm (Markdown.tsx), so no tables and no
# strikethrough. The hop lines use an ordered list, a two-space hard break, and code spans — all of
# which plain react-markdown renders.
#
# allowCopy is ON here, unlike the attention roll-up: this is the answer to "explain how a request
# reaches the apiserver", it is the thing people paste into an issue or a review, and the route and
# policy names in it are exactly what makes such a paste checkable.
kind: Markdown
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-flow
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-gateway
    namespace: {{ .Release.Namespace }}
  widgetData:
    allowCopy: true
    # Empty until the apiRef resolves. Never a written-down fallback: a hardcoded seven hops shown
    # while the read is in flight is indistinguishable from the real thing once it lands.
    markdown: ''
  widgetDataTemplate:
  - forPath: markdown
    expression: '${ .flow // "" }'
  resourcesRefs:
    items: []
