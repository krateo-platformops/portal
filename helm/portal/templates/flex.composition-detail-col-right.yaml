{{/* Right column (narrower): Reconcile activity, Relations, Metadata. (Conditions/Health */}}
{{/* promoted to the page top.) */}}
{{/* Reconcile activity is left out when there was no reconcile in its window (0 · — · —): three */}}
{{/* empty figures said nothing. composition-reconcile-perf is the RA its statistics read. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-detail-col-right
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-reconcile-perf
    namespace: {{ .Release.Namespace }}
  widgetData:
    vertical: true
    gap: middle
    allowedResources:
      - cards
    items:
      - resourceRefId: card-composition-detail-reconcile
      - resourceRefId: card-composition-detail-relations
      - resourceRefId: card-composition-detail-metadata
  widgetDataTemplate:
    - forPath: items
      expression: '${ [ (if (.n // 0) > 0 then { resourceRefId: "card-composition-detail-reconcile" } else empty end), { resourceRefId: "card-composition-detail-relations" }, { resourceRefId: "card-composition-detail-metadata" } ] }'
  resourcesRefs:
    items:
      - id: card-composition-detail-reconcile
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-composition-detail-reconcile
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: card-composition-detail-relations
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-composition-detail-relations
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: card-composition-detail-metadata
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-composition-detail-metadata
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
