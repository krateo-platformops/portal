# Page wrapper for /settings: a vertical Flex stacking the page header (title + subtitle)
# above the Users table. User administration is now the ONLY thing Settings hosts — the
# Krateo control-plane status tab moved to Observability (Components tab; it was platform
# health, not configuration), which also dropped the need for a Tabs wrapper around a
# single remaining tab. The nav `id: settings` is repointed here.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-settings
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - flexes
    - tables
    vertical: true
    gap: large
    items:
    - resourceRefId: settings-title-stack
    - resourceRefId: settings-users
  resourcesRefs:
    items:
    - id: settings-title-stack
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: settings-title-stack
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: settings-users
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: settings-users
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
