{{/* Page wrapper for /settings: a vertical Flex stacking the page header (title + subtitle) */}}
{{/* above the Users table. User administration is now the ONLY thing Settings hosts — the */}}
{{/* Krateo control-plane status tab moved to Observability (Components tab; it was platform */}}
{{/* health, not configuration), which also dropped the need for a Tabs wrapper around a */}}
{{/* single remaining tab. The nav `id: settings` is repointed here. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-settings
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - tables
    - paragraphs
    - buttons
    vertical: true
    {{/* P9: page-root section rhythm is one step, `middle`, across every nav-declared root. */}}
    {{/* This root previously declared its own value; see design/03-composition.md P9. */}}
    gap: middle
    items:
    - resourceRefId: settings-page-header
    {{/* Add user — the CTA sits above the table it adds a row to. */}}
    - resourceRefId: settings-user-create-cta
    - resourceRefId: settings-users
    {{/* Audit log — the browsable trail of gated mutations (AuditRecord CRs). Emitted for every */}}
    {{/* gated write but previously shown only per-incident; surfaced here so it is actually visible. */}}
    - resourceRefId: settings-audit-log-title
    - resourceRefId: settings-audit-log
  resourcesRefs:
    items:
    - id: settings-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: settings-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: settings-user-create-cta
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: settings-user-create-cta
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
    - id: settings-users
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: settings-users
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
    - id: settings-audit-log-title
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-log-title
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    - id: settings-audit-log
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-log
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
