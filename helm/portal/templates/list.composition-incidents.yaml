{{/* "Incidents" strip on the composition-detail page: one row per Incident whose analysis touched */}}
{{/* this composition (composition-incidents, filtered by the route's .name/.namespace extras). */}}
{{/* hideWhenEmpty removes the strip for a composition with no incidents. Each row opens the */}}
{{/* incident's detail page. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-incidents
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell — the composition */}}
  {{/* identity (route params) scopes which incidents this list resolves. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-incidents
    namespace: {{ .Release.Namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: false
    hideWhenEmpty: true
    header: Incidents whose analysis touched this composition; select one to open it →
    itemTemplate:
      navigateTo: '{route}'
      iconVariant: dot
      color:
        value: '{stateColor}'
      primaryText: '{title}'
      secondaryText: '{state}'
      secondaryTextAsTag: true
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .rows // [] }'
  resourcesRefs:
    items: []
