{{/* A Table cannot render a heading — the CRD has no title field and Listy's header/footer have */}}
{{/* no equivalent here — so a Table that needs to say what it is must be wrapped. That is the   */}}
{{/* whole reason this Card exists; it is structure, not decoration.                             */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: your-drafts-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Your unfinished drafts
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
      - paragraphs
      - tables
    items:
      - resourceRefId: your-drafts-note
      - resourceRefId: preview-drafts
  resourcesRefs:
    items:
      - id: your-drafts-note
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: your-drafts-note
        namespace: {{ .Release.Namespace }}
        resource: paragraphs
        verb: GET
      - id: preview-drafts
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: preview-drafts
        namespace: {{ .Release.Namespace }}
        resource: tables
        verb: GET
