kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-open-caption
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: platform-reviews
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: Open proposals, newest first
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ .openCaption // "Open proposals, newest first" }'
  resourcesRefs:
    items: []
