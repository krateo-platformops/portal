{{/* Summary panel body (#69 reiteration) — the incident TL;DR as three labelled bullets whose LABELS */}}
{{/* are in-page anchor links (a mini table-of-contents): "What happened" → the What-happened panel, */}}
{{/* "Why" → the Why-did-it-happen panel, "How to fix" → the How-to-fix panel (each panel carries the */}}
{{/* matching Card `anchorId`; the Markdown widget smooth-scrolls on a `#anchor` click). Replaces the */}}
{{/* plain Descriptions rows — same three server-side values (.summary, from restaction.incident-detail), */}}
{{/* same labelled-bullet format fedepini asked to keep, now navigable. Values degrade to "—" honestly. */}}
kind: Markdown
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-summary-md
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    markdown: ""
  widgetDataTemplate:
    - forPath: markdown
      expression: '${ "- **[What happened](#incident-what-happened):** " + (.summary.whatHappened // "—") + "\n- **[Why](#incident-why):** " + (.summary.why // "—") + "\n- **[How to fix](#incident-how-to-fix):** " + (.summary.howToFix // "—") }'
  resourcesRefs:
    items: []
