{{/* Object metadata (namespace / uid / created + labels) as label/value rows. */}}
{{/* Shaped server-side by the composition-detail RA (.metadataItems). */}}
kind: Descriptions
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: descriptions-composition-detail-metadata
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: composition-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    column: 1
    {{/* Form-style (read-only mirror of the create Form): connector-rail fields grouped into sections — */}}
    {{/* Namespace/UID/Created ungrouped at the top, the object's labels under a "labels" section. */}}
    variant: form
    bordered: false
    size: small
    items: []
  widgetDataTemplate:
    - forPath: items
      {{/* Only what the page does not already say. Namespace and age are in the header's subtitle and */}}
      {{/* every label is in the Manifest beside this card, so the card was ~1,100px of repetition. */}}
      {{/* It keeps the UID and the three labels a person looks for, under readable names. */}}
      expression: '${ (.detail.metadata.labels // {}) as $l | [ { label: "UID", value: (.detail.metadata.uid // "") }, { label: "Blueprint", value: ($l["krateo.io/composition-definition-name"] // "") }, { label: "Installed version", value: ($l["krateo.io/composition-installed-version"] // "") }, { label: "Managed by", value: ($l["app.kubernetes.io/managed-by"] // "") } ] | map(select(.value != "")) }'
  resourcesRefs:
    items: []
