{{- if (.Values.observability | default dict).snowplowSli }}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-card-dep-marks
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Dirty-marks and dep records
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - linecharts
    items:
    - resourceRefId: sp-dep-marks
  resourcesRefs:
    items:
      - id: sp-dep-marks
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-dep-marks
        namespace: {{ .Release.Namespace }}
        resource: linecharts
        verb: GET
{{- end }}
