# The Agent CR as YAML. agent-detail hands over the object as a JSON string with managedFields and
# the kubectl last-applied annotation stripped (both are noise, and last-applied additionally leaks
# a pre-reconcile copy of the spec); the widget converts JSON to YAML. The string is EMPTY when the
# read degraded, so the viewer shows its own empty state rather than a confident "{}".
kind: YamlViewer
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agent-detail-manifest
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): the route params this widget's resolution varies by.
  keyExtras: [name, namespace]
  apiRef:
    name: agent-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    json: ""
  widgetDataTemplate:
    - forPath: json
      expression: '${ .manifestJson // "" }'
  resourcesRefs:
    items: []
