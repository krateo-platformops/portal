{{/* Settings → Users tab content — the users restaction.settings-users knows WITHOUT reading a */}}
{{/* Secret: the basic-strategy User CRs and the User subjects of portal-managed access grants, */}}
{{/* via the RA's `.personas` (#88 §0.7: merged with the former Access tab — same drill-down). */}}
{{/* Groups join the basic-strategy User CR ("—" for OIDC/LDAP identities, unknowable from the */}}
{{/* cluster); "Managed grants" = count of portal-access RoleBindings for that persona; */}}
{{/* "Source" = which set listed the user (the RA's `source`; paragraph.settings-users-note */}}
{{/* above the table says when an SSO identity shows up). */}}
{{/* "Issued" and "Certificate expires" were dropped with the clientconfig Secret they came from */}}
{{/* (see the RA's header). */}}
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: settings-users
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # snowplow ≥1.12.3 (snowplow#173) strips the identity extras — username, groups,
  # displayName — from a widget's request unless the widget declares them here. This
  # table does not render the CALLER's identity (the .username/.groups below are the
  # iterated personas from the RA), so it is not broken by the strip; the declaration
  # makes the contract explicit: the server injects the caller's authoritative values
  # and folds them into the cache key, so two users on this page get their own cell
  # (portal#130).
  identityContext: [username, groups]
  widgetData:
    {{/* fitContent: shrink columns to the container instead of the default horizontal scrollbar. */}}
    {{/* A wide cell ellipsis-truncates and carries its full value on hover (P19), which reads far */}}
    {{/* better than a sideways scroll inside a card. Unset is NOT neutral — it sets */}}
    {{/* scroll.x: max-content, so leaving it out chooses the scrollbar by omission. */}}
    fitContent: true
    allowedResources: []
    bordered: false
    size: middle
    {{/* Row click → the user's access-detail page (CTA-audit S1: the Users table was a */}}
    {{/* dead-end — informational only, no drill-in). {user} = the username cell. */}}
    rowNavigateTo: /settings/access/{user}
    columns:
    - valueKey: user
      title: User
    - valueKey: groups
      title: Groups
    - valueKey: grants
      title: Managed grants
    - valueKey: source
      title: Source
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: >
      ${ [ (.personas // [])[] | [
          {valueKey:"user",kind:"jsonSchemaType",type:"string",stringValue:(.username // "")},
          {valueKey:"groups",kind:"jsonSchemaType",type:"string",stringValue:(if ((.groups // [])|length) > 0 then (.groups|join(", ")) else "—" end)},
          {valueKey:"grants",kind:"jsonSchemaType",type:"string",stringValue:((.grants // 0)|tostring)},
          {valueKey:"source",kind:"jsonSchemaType",type:"string",stringValue:(.source // "")}
        ] ] }
  apiRef:
    name: settings-users
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
