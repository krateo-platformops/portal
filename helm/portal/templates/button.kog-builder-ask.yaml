# "Ask Autopilot →" header CTA on /api-builder — the page's SOLE entry into the API-onboarding
# flow (the redundant hint strip was removed; the three builder pages now share this single CTA).
# Always visible, so there is always a way to start the next mapping. Carries the ?ask= deep-link
# and prompt text, encoded here with urlquery instead of the RA's jq @uri. (Route renamed
# /kog-builder → /api-builder, issue #29; the widget name + page slug stay kog-builder — internal.)
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: kog-builder-ask
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    label: Ask Autopilot →
    icon: fa-wand-magic-sparkles
    # #84 §0.1: the page's primary CTA — a filled primary button (was an outlined default), a
    # comfortable middle size (was small), right-aligned via flex.kog-builder-ask-cta.
    size: middle
    type: primary
    clickActionId: kog-builder-ask
    actions:
      navigate:
        - id: kog-builder-ask
          type: navigate
          path: /api-builder?ask={{ "I want to onboard a new API with the KOG builder. I will paste an OpenAPI document (or give you its URL): propose the RestDefinition mapping (kind, resourceGroup, verbs, identifiers), preview it with previewRestDef, and publish it only after I confirm." | urlquery }}
  resourcesRefs:
    items: []
