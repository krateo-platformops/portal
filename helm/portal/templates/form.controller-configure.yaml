{{/* CONFIGURE CREDENTIALS — one submit, two writes, as form.settings-user-create does it: the */}}
{{/* Secret FIRST, then the <Kind>Configuration that references it (stop-on-first-error: a failed */}}
{{/* Secret dispatches no Configuration, so nothing ever points at a Secret that is not there). */}}
{{/* Both POST through /call as the caller, into the install's namespace. */}}
{{/* */}}
{{/* The schema comes from restaction.controller-configure-formdef: the Configuration's name, the */}}
{{/* CRD's own spec fields minus the references this form fills, and the Secret's name, key and */}}
{{/* value. */}}
{{/* */}}
{{/* THE CREDENTIAL (frontend >= 1.6.83, krateo-platformops/frontend#424). The value field is */}}
{{/* format: password + writeOnly: masked, never prefilled, and never sent to /jq. #424 refuses */}}
{{/* the whole submit if any override could reach it other than as a plain path, so EVERY */}}
{{/* override here is in #424's local grammar (.json.<field>, or an object of those) or a plain */}}
{{/* string — none goes to /jq at all: */}}
{{/*  - the Secret: name and key from their fields, stringData {(<key field>): <value field>}; */}}
{{/*  - the Configuration: its name; its spec as { <field>: .json.<field>, … } over the fields it */}}
{{/*    shows (none, on every 057 kind); then each first-scheme reference field set on its own — */}}
{{/*    spec.authentication.<scheme>.<ref>.name and .key from the Secret's fields, .namespace */}}
{{/*    the install's — so the reference follows whatever name and key were typed. */}}
{{/* No reviewBeforeSubmit and no draftActionId. No success or error message either: a set of */}}
{{/* ops reports through its own toast (runRestSet), which names the op that failed and says the */}}
{{/* ones before it stay applied; card.controller-configure's note says what to do then. The */}}
{{/* navigate target is a plain string. */}}
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: controller-configure
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: controller-configure-formdef
    namespace: {{ .Release.Namespace }}
  widgetData:
    layout: vertical
    submitActionId: submit
    schema: {}
    buttonConfig:
      primary:
        label: Save credentials
      secondary:
        label: Cancel
        navigateTo: /controller-builder
    actions:
      rest:
        - id: submit
          type: rest
          {{/* Ignored for dispatch when ops is set, but must name a valid ref: the first op's. */}}
          resourceRefId: create-secret
          headers:
            - 'Content-Type: application/json'
          onSuccessNavigateTo: /controller-builder
          loading:
            display: true
          ops:
            - resourceRefId: create-secret
              payload:
                apiVersion: v1
                kind: Secret
                type: Opaque
                metadata:
                  labels:
                    krateo.io/managed-by: controller-builder
              {{/* The referenced resource's payload base is merged over this one with an empty */}}
              {{/* metadata.name, so name and namespace are set here. The namespace is a plain */}}
              {{/* string the widgetDataTemplate writes (the install's namespace). */}}
              payloadToOverride:
                - { name: metadata.name,      value: '${ .json.__secret_name__ }' }
                - { name: metadata.namespace, value: '' }
                - { name: stringData,         value: '${ { (.json.__secret_key__): .json.__secret_value__ } }' }
            - resourceRefId: create-configuration
              payload: {}
              {{/* Written whole by widgetDataTemplate: the ref overrides depend on the kind. */}}
              payloadToOverride: []
  widgetDataTemplate:
    - forPath: schema
      expression: '${ .schemaSpec }'
    - forPath: stringSchema
      expression: '${ .stringSchema }'
    - forPath: initialValues
      expression: '${ .initialValues }'
    - forPath: actions.rest[0].ops[0].payloadToOverride[1].value
      expression: '${ .namespace // "" }'
    - forPath: actions.rest[0].ops[1].payload
      expression: '${ if .ready then { apiVersion: .apiVersion, kind: .kind } else {} end }'
    - forPath: actions.rest[0].ops[1].payloadToOverride
      expression: >-
        ${ (.namespace // "") as $ns
           | [ { name: "metadata.name", value: "${ .json.__configuration_name__ }" },
               { name: "metadata.namespace", value: $ns } ]
           + (if ((.specKeys // []) | length) > 0
              then [ { name: "spec", value: ("${ { " + ([ (.specKeys // [])[] | . + ": .json." + . ] | join(", ")) + " } }") } ]
              else [] end)
           + [ (.refPaths // [])[] as $r
               | { name: ($r + ".name"), value: "${ .json.__secret_name__ }" },
                 { name: ($r + ".key"), value: "${ .json.__secret_key__ }" },
                 { name: ($r + ".namespace"), value: $ns } ] }
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: create-secret
        apiVersion: v1
        resource: secrets
        namespace: '${ .namespace }'
        verb: POST
    - template:
        id: create-configuration
        apiVersion: '${ .apiVersion }'
        resource: '${ .plural }'
        namespace: '${ .namespace }'
        verb: POST
