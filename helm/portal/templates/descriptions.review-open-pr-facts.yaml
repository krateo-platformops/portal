kind: Descriptions
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-open-pr-facts
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-proposal
    namespace: {{ .Release.Namespace }}
  widgetData:
    column: 1
    size: small
    items:
    - label: Branch
      value: '—'
  widgetDataTemplate:
    - forPath: items
      expression: '${ .dialogFacts // [] }'
  resourcesRefs:
    items: []
