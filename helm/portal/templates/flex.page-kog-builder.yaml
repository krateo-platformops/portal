{{/* Convention page root for /api-builder (page slug stays kog-builder — internal; route renamed */}}
{{/* from /kog-builder, issue #29) — the KOG builder's post-publish verification surface */}}
{{/* (w4-kog-builder spec §2.5 + CHART-K1): pagehead, the always-visible "Ask Autopilot →" CTA */}}
{{/* (the page's own entry into the flow), the PR-published DELIVERABLES table (blueprint-builder */}}
{{/* parity, issue #30 — the API mappings shipped via a gated PR, joined to their generated */}}
{{/* RestDefinition Ready status), the RestDefinition REGISTRY table (READY / generated */}}
{{/* kind+apiVersion / OAS source, all derived server-side — the full live-CRD state). The route is */}}
{{/* hidden (label-less nav item) — Autopilot navigates here after a gated publish; the authoring flow */}}
{{/* itself lives in the rail, not on this page (the create Form is the deferred CHART-K2). The */}}
{{/* redundant "author with Autopilot" hint strip was removed — the three builder pages share the */}}
{{/* single Ask-Autopilot CTA. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-kog-builder
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
  annotations:
    "krateo.io/nav-alias": "/kog-builder,/api-builder"
    "krateo.io/nav-group": "Builders"
    "krateo.io/nav-icon": "fa-plug"
    "krateo.io/nav-label": "Controller Builder"
    "krateo.io/nav-order": "23"
    "krateo.io/nav-path": "/controller-builder"
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - tables
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: kog-builder-page-header
    {{/* #84 §0.1: CTA rides in a right-aligned wrapper Flex (was a bare left-aligned button). */}}
    - resourceRefId: kog-builder-ask-cta
    {{/* CHART-K2, delivered: the authoring flow now lives ON THE PAGE, not only in the rail. Two
         steps — store the OpenAPI document (as a ConfigMap the user POSTs themselves), then define
         the controller from the operations parsed out of it. Built entirely from widgets, so the
         authoring knowledge ships in this chart rather than in frontend code.

         This is also what makes A1 satisfiable for KOG: Autopilot must DRIVE a control, never write
         a RestDefinition directly, so the control has to exist before the agent can comply. */}}
    - resourceRefId: kog-author-paste
    - resourceRefId: kog-author-define
    {{/* The PR-published deliverables (KOG API mappings opened via a gated pull request), JOINED */}}
    {{/* to their generated RestDefinition Ready status — the blueprint-builder-parity surface */}}
    {{/* (issue #30). Above the raw restdef registry: the deliverables are the "what did I ship?" */}}
    {{/* answer, the registry below is the full live-CRD state. Empty (zero KOG PRs) until the */}}
    {{/* frontend KOG-publish-via-PR path ships — then it fills like the blueprint table. */}}
    - resourceRefId: kog-deliverables
    - resourceRefId: kog-restdefinitions
  resourcesRefs:
    items:
    - id: kog-builder-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: kog-builder-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: kog-builder-ask-cta
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: kog-builder-ask-cta
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: kog-author-paste
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: kog-author-paste
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: kog-author-define
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: kog-author-define
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: kog-deliverables
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: kog-deliverables
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
    - id: kog-restdefinitions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: kog-restdefinitions
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
