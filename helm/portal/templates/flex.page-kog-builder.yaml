{{/* Convention page root for /controller-builder — the Controller Builder's home, built as */}}
{{/* flex.page-blueprint-builder is: a header that says what a controller is and carries both */}}
{{/* routes into the composer ("Build a controller", primary; "Ask Autopilot", a link that lands */}}
{{/* in the same composer), the person's drafts (each resumes in the composer), and a titled Card */}}
{{/* holding a note and the deliverables table (each row opens its next step). Then one card the */}}
{{/* blueprint page has no counterpart for: the cluster's RestDefinitions, by API group. */}}
{{/* */}}
{{/* Authoring does not happen on this page. It happens at /controller-builder/compose, a static */}}
{{/* frontend route; this page is the way in and the record of what shipped. The two Forms that */}}
{{/* used to author here (store an OpenAPI document, then define one RestDefinition from it) are */}}
{{/* gone: they committed a single resources/<kind>.yaml file while the rail published a chart, */}}
{{/* so the same controller came out as two different artifacts depending on the door. */}}
{{/* */}}
{{/* The CR keeps its name (the page slug has been kog-builder since /kog-builder) and its aliases, */}}
{{/* so old /kog-builder and /api-builder links still land here. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-kog-builder
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
  annotations:
    "krateo.io/nav-alias": "/kog-builder,/api-builder"
    "krateo.io/nav-group": "Builders"
    "krateo.io/nav-icon": "fa-plug"
    "krateo.io/nav-label": "Controller Builder"
    "krateo.io/nav-order": "23"
    "krateo.io/nav-path": "/controller-builder"
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: controller-builder-page-header
    - resourceRefId: controller-builder-drafts-card
    - resourceRefId: controller-builder-deliverables-card
    - resourceRefId: controller-builder-registry-card
  resourcesRefs:
    items:
    - id: controller-builder-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: controller-builder-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: controller-builder-drafts-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: controller-builder-drafts-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: controller-builder-deliverables-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: controller-builder-deliverables-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: controller-builder-registry-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: controller-builder-registry-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
