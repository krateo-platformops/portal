kind: Result
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-decided-empty
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    status: info
    title: Nothing has been decided yet
    subTitle: >-
      A proposal is decided in one of two ways: someone opens a change request from it and the pull
      request is merged or closed, or someone rejects it with a reason. Decided proposals are listed
      here with who decided and when.
  resourcesRefs:
    items: []
