# Error-log digest from ClickHouse (clickstack otel_logs). Component logs carry level+msg
# INSIDE the Body JSON (SeverityText is empty at ingest), so both are parsed with
# JSONExtractString(Body,'level'|'msg'). Only ERROR is surfaced — WARN is ~200x noisier
# (snowplow per-request warns) and drowns the signal. Step `digest` GROUPs the selected window by
# service+msg → the DISTINCT problems with an occurrence count + last-seen (collapses the
# same error repeating every reconcile into one row, ordered most-frequent-first). Step
# `tot` is the headline totals. External-fetch endpointRef, ClickHouse FORMAT JSON.
#
# COUNT-VS-ROWS (Vincenzo R): the grouping message is COALESCEd
# msg-from-Body-JSON → raw Body → 'unlabeled error' (truncated to 160), and `digest` NO LONGER
# filters `msg!=''`. Previously an error line whose Body wasn't the {level,msg} JSON shape
# extracted an empty msg, and the digest-only `AND msg!=''` guard dropped EVERY grouped row →
# digest.data=[] → the list rendered "No data" while the header (from `tot`, which had no such
# guard) still counted e.g. "130185 errors · 97 distinct". `tot`'s distinct_problems now uses the
# SAME coalesced expression so the headline reconciles with the rendered groups.
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: obs-error-log-digest
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: digest
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then "1%20HOUR" elif $r=="24h" then "24%20HOUR" elif $r=="7d" then "7%20DAY" else "24%20HOUR" end) as $iv | "/?query=SELECT%20ServiceName%20AS%20service%2C%20substring%28coalesce%28nullIf%28JSONExtractString%28Body%2C%27msg%27%29%2C%27%27%29%2C%20nullIf%28Body%2C%27%27%29%2C%20%27unlabeled%20error%27%29%2C1%2C160%29%20AS%20msg%2C%20count%28%29%20AS%20occurrences%2C%20formatDateTime%28max%28Timestamp%29%2C%20%27%25Y-%25m-%25dT%25H%3A%25i%3A%25SZ%27%29%20AS%20last_ts%20FROM%20otel_logs%20WHERE%20lower%28JSONExtractString%28Body%2C%27level%27%29%29%3D%27error%27%20AND%20Timestamp%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%20GROUP%20BY%20service%2C%20msg%20ORDER%20BY%20occurrences%20DESC%20LIMIT%2040%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: digestError
    - name: tot
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then "1%20HOUR" elif $r=="24h" then "24%20HOUR" elif $r=="7d" then "7%20DAY" else "24%20HOUR" end) as $iv | "/?query=SELECT%20count%28%29%20AS%20total%2C%20uniqExact%28%28ServiceName%2C%20substring%28coalesce%28nullIf%28JSONExtractString%28Body%2C%27msg%27%29%2C%27%27%29%2C%20nullIf%28Body%2C%27%27%29%2C%20%27unlabeled%20error%27%29%2C1%2C160%29%29%29%20AS%20distinct_problems%20FROM%20otel_logs%20WHERE%20lower%28JSONExtractString%28Body%2C%27level%27%29%29%3D%27error%27%20AND%20Timestamp%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: totError
  # digest => {data:[{service,msg,occurrences,last_ts}]}; tot => {data:[{total,distinct_problems}]}.
  # Each row gains a server-baked `route` into the log stream scoped to its component
  # (/observability?serviceName= — the same hand-off the component-detail logs CTA uses); a row
  # with no ServiceName carries route:"" and stays INERT in the list.
  # diagnoseHref: an on-demand "Diagnose with Autopilot" seed (button.obs-errors-diagnose) — the
  # top-8 errors baked into an /incidents?ask= prompt (@uri-encoded ONCE, navigate uses it verbatim),
  # so the rail opens pre-seeded to RCA the most frequent errors WITHOUT an alert/incident. Empty +
  # hasErrors:false on a clean estate (the button is gated off), so it never links to a bare ask.
  # Literal `|` block (NOT folded `>`) — the seed string carries newlines; folding would mangle them.
  filter: |
    (((.digest.data) // []) | map(. + { route: ((.service // "") as $s | if $s == "" then "" else ("/observability?serviceName=" + ($s | @uri) + "&tab=Telemetry") end) })) as $rows
    | ([ $rows[0:8] | to_entries[] | (((.key) + 1) | tostring) + ". " + (.value.service // "unknown") + " — \"" + (.value.msg // "") + "\" (x" + ((.value.occurrences // 0) | tostring) + ")" ] | join("\n")) as $top
    | ("Diagnose the most frequent errors in my platform's telemetry. The top recurring errors are:\n" + $top + "\n\nFor the most frequent ones, explain the likely root cause and give concrete, ordered recovery steps; where a fix is a safe Kubernetes change, propose it so I can apply it (I will confirm before anything is applied).") as $ask
    | { rows: $rows,
        total: (((.tot.data) // [])[0].total // 0),
        distinct: (((.tot.data) // [])[0].distinct_problems // 0),
        hasErrors: (($rows | length) > 0),
        diagnoseHref: (if ($rows | length) > 0 then ("/incidents?ask=" + ($ask | @uri)) else "" end) }
