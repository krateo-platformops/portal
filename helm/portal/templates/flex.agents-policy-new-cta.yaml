# Right-aligned holder for the Add-policy Button. A Flex, not the Button composed directly: the
# policies page's allowedResources does not list `buttons`, and a Button carries no self-alignment
# field — the same shape flex.agents-new-cta uses on /agents.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policy-new-cta
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
      - buttons
    vertical: false
    justify: flex-end
    items:
      - resourceRefId: agents-policy-new
  resourcesRefs:
    items:
      - id: agents-policy-new
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: agents-policy-new
        namespace: {{ .Release.Namespace }}
        resource: buttons
        verb: GET
