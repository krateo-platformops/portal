# "Manifest" — the raw Agent CR. Everything above this card is a reading of the object; this card
# is the object, so a reader can check the reading. Same closing section as the alert / composition
# / resource detail pages.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-agent-detail-manifest
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): the route params this widget's resolution varies by.
  keyExtras: [name, namespace]
  widgetData:
    title: Manifest
    titleVariant: eyebrow
    variant: outlined
    items:
    - resourceRefId: agent-detail-manifest
  resourcesRefs:
    items:
    - id: agent-detail-manifest
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agent-detail-manifest
      namespace: {{ .Release.Namespace }}
      resource: yamlviewers
      verb: GET
