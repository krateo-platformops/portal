# The /agents/policies page header — title, the live enforcement summary, and the create CTA,
# in one CR.
#
# Replaces FIVE: flex.agents-policies-header (a vertical Flex), paragraph.agents-policies-eyebrow,
# paragraph.agents-policies-title, paragraph.agents-policies-subtitle and
# flex.agents-policy-new-cta.
#
# THE CTA WRAPPER GOES, AND SO DOES THE REASON FOR IT. flex.agents-policy-new-cta was a
# `justify: flex-end` Flex around ONE Button, and its own comment explained why it existed:
# "`buttons` is not in this page's allowedResources and a Button carries no self-alignment field".
# PageHeader allows buttons and right-aligns them by construction, so the wrapper and the
# constraint that forced it both disappear.
#
# THE EYEBROW IS GONE — Paragraph.tsx returns null for `variant: eyebrow`.
#
# The subtitle keeps its whole expression, including the branch that matters most: when
# AgentgatewayPolicy cannot be read it says so in full, rather than letting an empty page read as
# "nothing is enforced". That sentence is the reason this subtitle is computed at all.
#
# No `counter`: the subtitle already opens with the policy count and its breakdown by role, so a
# bare total beside the title would be the same number in a less useful form.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policies-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-policies
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: What the gateway enforces
    subtitle: ' '
    allowedResources:
    - buttons
    items:
    - resourceRefId: agents-policy-new
  widgetDataTemplate:
    # Was paragraph.agents-policies-subtitle's `forPath: text`, lifted verbatim and re-indented.
    - forPath: subtitle
      expression: >-
        ${ (.total // 0) as $n | (.roleCount // 0) as $r | (.gatewayCount // 0) as $g
        | (.routeCount // 0) as $rt | (.serviceCount // 0) as $sv | (.selectorCount // 0) as $sel
        | if .policiesReadable == false then
        "AgentgatewayPolicy could not be read on this cluster, so this page is showing nothing — it is not proving that nothing is enforced. The gateway may well be enforcing every policy it always did. Check that your account may list agentgateway.dev/agentgatewaypolicies, then reload."
        elif $n == 0 then
        "No AgentgatewayPolicy is visible here — either none is installed on this cluster, or your account cannot list agentgateway.dev/agentgatewaypolicies. Krateo cannot tell the two apart: a caller without the grant is served an empty list, not an error. Confirm your grant before concluding the gateway enforces nothing."
        else ($n|tostring) + (if $n == 1 then " policy" else " policies" end)
        + " in " + ($r|tostring) + (if $r == 1 then " role" else " roles" end)
        + ", attached to " + ($g|tostring) + (if $g == 1 then " gateway" else " gateways" end)
        + ", " + ($rt|tostring) + (if $rt == 1 then " route" else " routes" end)
        + " and " + ($sv|tostring) + (if $sv == 1 then " backend service" else " backend services" end)
        + (if $sel > 0 then "; " + ($sel|tostring) + (if $sel == 1 then " policy also attaches" else " policies also attach" end) + " by label selector, whose targets are not counted here" else "" end)
        + ". Every value below is read from the live AgentgatewayPolicy resources, not from the chart that shipped them."
        + (if .routesReadable == false then " HTTPRoutes could not be read, so the URL space each policy governs is missing from the rows below — the attachments shown are the policies' own targetRefs." else "" end)
        end }
  resourcesRefs:
    items:
    - id: agents-policy-new
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-policy-new
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
