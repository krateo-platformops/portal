{{- if (.Values.observability | default dict).snowplowSli }}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-card-http-p95
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: p95 request duration by route
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - tables
    items:
    - resourceRefId: sp-http-p95
  resourcesRefs:
    items:
      - id: sp-http-p95
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-http-p95
        namespace: {{ .Release.Namespace }}
        resource: tables
        verb: GET
