{{/* Page composer, step 2 — arrange EXISTING widgets into a page and publish it. */}}
{{/* */}}
{{/* This composes; it does not author widgets. That is the whole point. 209 of 481 chart templates */}}
{{/* compute their widgetData from a RESTAction via widgetDataTemplate jq at serve time, so an */}}
{{/* editor that authored NEW widgets from static widgetData could only ever produce the trivial */}}
{{/* ones — a header, some text, one table — while looking finished. Composing from widgets that are */}}
{{/* ALREADY data-bound has no such gap: every option in the list is a widget that already works. */}}
{{/* */}}
{{/* The multi-select is `type: array` + `items.enum`, the one array control Form renders as a closed */}}
{{/* picker (SchemaFields controlFor). Option values are "resource/name" so the submit can rebuild */}}
{{/* both halves of a resourcesRefs entry; getOptionsFromEnum sets label = value, so the value has to */}}
{{/* read well AND parse. */}}
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compose-page
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: page-composable
    namespace: {{ .Release.Namespace }}
  widgetData:
    layout: vertical
    reviewBeforeSubmit: true
    submitActionId: submit
    schema: {}
    buttonConfig:
      primary:
        label: Publish page
      secondary:
        label: Cancel
        navigateTo: /portal-builder
    actions:
      rest:
        - id: submit
          type: rest
          resourceRefId: create-builder-publish
          headers:
            - 'Content-Type: application/json'
          successMessage: Page published — a change request is open
          payloadToOverride:
            - { name: metadata.name,      value: '${ "page-" + .json.__slug__ }' }
            - { name: metadata.namespace, value: '{{ .Release.Namespace }}' }
            - name: spec
              {{/* One file: the page-root Flex. Rendered as YAML by hand so the published artifact
                   reads as though a person wrote it, and so resourcesRefs lines up with items. */}}
              value: >
                ${ .json as $f
                 | ($f.widgets // []) as $sel
                 | { name: ("page-" + $f.__slug__),
                     builder: "page",
                     branch: ($f.__target_branch__ // ("builder/page-" + $f.__slug__)),
                     target: { namespace: $f.__target_org__,
                               repo: $f.__target_repo__,
                               base: ($f.__target_base__ // "main") },
                     files: [ { path: ("helm/portal/templates/flex.page-" + $f.__slug__ + ".yaml"),
                                content: (
                                  "kind: Flex\napiVersion: widgets.templates.krateo.io/v1beta1\nmetadata:\n  name: page-"
                                  + $f.__slug__
                                  + "\n  namespace: {{ "{{ .Release.Namespace }}" }}\nspec:\n  widgetData:\n    allowedResources:\n"
                                  + ( $sel | map(split("/")[0]) | unique
                                      | map("    - " + . + "\n") | join("") )
                                  + "    vertical: true\n    gap: middle\n    items:\n"
                                  + ( $sel | map("    - resourceRefId: " + (split("/")[1]) + "\n") | join("") )
                                  + "  resourcesRefs:\n    items:\n"
                                  + ( $sel | map(split("/") as $p
                                       | "    - id: " + $p[1]
                                       + "\n      apiVersion: widgets.templates.krateo.io/v1beta1"
                                       + "\n      name: " + $p[1]
                                       + "\n      namespace: {{ "{{ .Release.Namespace }}" }}"
                                       + "\n      resource: " + $p[0]
                                       + "\n      verb: GET\n") | join("") ) ) } ] } }
  widgetDataTemplate:
    - forPath: schema
      expression: >
        ${ [ (.widgets // [])[] | .id ] as $opts
         | { type: "object",
             required: ["__slug__","widgets","__target_org__","__target_repo__"],
             properties: {
               __slug__: { type: "string", title: "Page slug",
                           description: "Lower-case, dashes. The page becomes /<slug> and the CR page-<slug>.",
                           pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" },
               widgets:  { type: "array", title: "Widgets on this page",
                           description: "Existing widgets, in the order they should appear. Each one is already wired to its own data.",
                           items: { enum: $opts } },
               __target_org__:    { type: "string", title: "Target org",
                                    description: "GitHub org (GitLab group, Bitbucket workspace) the change request is opened in.",
                                    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" },
               __target_repo__:   { type: "string", title: "Target repository",
                                    description: "Created automatically if it does not exist yet.",
                                    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" },
               __target_base__:   { type: "string", title: "Base branch",
                                    description: "The branch the change request is cut from. Defaults to main." },
               __target_branch__: { type: "string", title: "Branch to commit onto",
                                    description: "Defaults to builder/page-<slug>." } } } }
    - forPath: initialValues
      {{/* Prefilled from the install's configured page repo, but EDITABLE — the target is a
           per-publish decision, and repository.create defaults true. */}}
      expression: >
        ${ { __target_org__:  "{{ (splitList "/" (((.Values.pageBuilder | default dict).repo) | default "krateo-platformops/portal")) | first }}",
             __target_repo__: "{{ (splitList "/" (((.Values.pageBuilder | default dict).repo) | default "krateo-platformops/portal")) | last }}",
             __target_base__: "main" } }
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: create-builder-publish
        apiVersion: '${ .bpApiVersion }'
        resource: '${ .bpResource }'
        namespace: {{ .Release.Namespace }}
        verb: POST
