# The exception roll-up block of /agents — heading + findings, both empty on a healthy cluster.
#
# Grouped in a Flex rather than appended as two items to flex.page-agents so the heading sits tight
# against its own list (`gap: small`) instead of inheriting the page's `gap: middle`, and so the
# page root gains ONE item — the same shape agents-servers uses for its section.
#
# It sits directly under the pagehead, ABOVE the inventory table, because it is the only thing on
# this page that is not an inventory: a reader who opens /agents to check whether anything is wrong
# must not have to scroll a 15-row table and a 9-row table to find out. On a healthy cluster both
# children render nothing and the reader is straight into the table.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-attention-block
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - markdowns
    - paragraphs
    vertical: true
    gap: small
    items:
    - resourceRefId: agents-attention-head
    - resourceRefId: agents-attention
  resourcesRefs:
    items:
    - id: agents-attention-head
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-attention-head
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-attention
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-attention
      namespace: {{ .Release.Namespace }}
      resource: markdowns
      verb: GET
