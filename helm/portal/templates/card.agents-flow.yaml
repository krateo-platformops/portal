# The bordered frame around the seven hops.
#
# A Card and not a bare Markdown because this section is the only prose on /agents: without an edge
# it reads as a footnote trailing off the bottom of two tables. `borderless` would defeat the point;
# the title is deliberately absent because paragraph.agents-flow-title already carries the section
# heading in the same style the Tool servers section uses, and a card title here would be the third
# heading in a row.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-flow-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: outlined
    items:
    - resourceRefId: agents-flow
  resourcesRefs:
    items:
    - id: agents-flow
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-flow
      namespace: {{ .Release.Namespace }}
      resource: markdowns
      verb: GET
