# In-flight builder pull requests — ONE row per pullrequests.github.krateo.io CR (every builder
# PR: portal + blueprint + API-mapping). A sortable Table (blueprint-builder-deliverables parity,
# #84 §0.2 — was a Listy). Columns: Pull request / Repo / Branch / Status chip / PR # / Opened.
#
# LINKABLE to the real GitHub PR: rowNavigateTo is the whole-placeholder `{url}`. A single
# `{key}` rowNavigateTo now passes the cell value THROUGH verbatim (no encodeURIComponent) and
# routes an http(s) target via navigateOrExternal — the frontend fix that made this safe is
# krateo-frontend@aee40c3 (Table whole-placeholder rowNavigateTo, UX #21). Before it, a Table
# percent-mangled a full https:// URL, which is why this started life as a Listy (#26/#27); that
# constraint is gone, so the richer sortable Table shape is now the right widget. A pre-reconcile
# PR has no url yet (row link is empty until the provider writes status.html_url).
#
# STATE chip is GitHub-domain vocabulary (NOT k8s status): open→blue "Open", merged→green
# "Merged" (a genuinely-landed deliverable earns the health colour), closed→gray "Closed",
# pre-reconcile→gold. Colour + label + the "#N" cell are all derived server-side in
# restaction.builder-prs (stateColor / stateLabel / pr).
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: builder-prs
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: builder-prs
    namespace: {{ .Release.Namespace }}
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    # Whole-placeholder → opens the real GitHub PR verbatim (safe per aee40c3). The url rides as a
    # hidden cell below (bound to no column) so the row carries the link without a visible column.
    rowNavigateTo: '{url}'
    pagination:
      defaultPageSize: 15
    columns:
    - valueKey: title
      title: Change request
    - valueKey: repo
      title: Repo
    - valueKey: head
      title: Branch
    - valueKey: status
      title: Status
    - valueKey: pr
      title: Ref
    - valueKey: opened
      title: Opened
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ [ (.rows // [])[] | [ {valueKey:"title",kind:"jsonSchemaType",type:"string",stringValue:(.title // "")}, {valueKey:"repo",kind:"jsonSchemaType",type:"string",stringValue:(.repo // "")}, {valueKey:"head",kind:"jsonSchemaType",type:"string",stringValue:(.head // "—"),color:"#8c8c8c"}, {valueKey:"status",kind:"tag",stringValue:(.stateLabel // ""),color:(.stateColor // "gold")}, {valueKey:"pr",kind:"jsonSchemaType",type:"string",stringValue:(.pr // ""),color:"#8c8c8c"}, {valueKey:"opened",kind:"jsonSchemaType",type:"string",stringValue:(.created // ""),format:"relative"}, {valueKey:"url",kind:"jsonSchemaType",type:"string",stringValue:(.url // "")} ] ] }'
  resourcesRefs:
    items: []
