kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-open-pr-intro
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    type: secondary
    text: >-
      The platform's publish chain commits this file to a new branch and opens a pull request.
      Nothing is applied, the portal holds no merge authority, and the repository is not created if
      it does not exist: the change lands only if someone merges it there.
  resourcesRefs:
    items: []
