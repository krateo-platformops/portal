{{/* The /blueprints page header — title and subtitle in one CR. */}}
{{/* */}}
{{/* Replaces three: flex.blueprints-header (a vertical Flex whose only job was to stack them), */}}
{{/* paragraph.blueprints-title and paragraph.blueprints-subtitle. */}}
{{/* */}}
{{/* There is no right-side action here and that is deliberate, carried over from the Flex it */}}
{{/* replaces: on this page the blueprint IS the entry point (selecting a tile starts "Configure"), */}}
{{/* so a generic header button would be a second, weaker route to the same thing. */}}
{{/* */}}
{{/* No `counter` either. The count belongs to blueprints-filterbar directly below, which already */}}
{{/* shows it per category — a bare total beside the title would be the same number twice, and the */}}
{{/* two would disagree the moment a filter is applied. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprints-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Blueprints
    subtitle: >-
      Reusable templates — install a blueprint to create a composition (a running instance) in
      your namespace.
  resourcesRefs:
    items: []
