{{/* /reviews/proposals/{name} — one Proposal, read as the caller, plus what the page needs around it: */}}
{{/* the proposals it superseded (and the one that superseded it), the kind check, and the change */}}
{{/* request, if one was opened. */}}
{{/* */}}
{{/* DECISIONS. Reject and Open change request record the decision in spec.decision by a merge-PATCH */}}
{{/* of the proposal as the caller (snowplow's /call cannot address the status subresource). It is */}}
{{/* read before status (portal.reviewDefs rv_phase / rv_decision), so the page changes at once. */}}
{{/* The claim is also found by name, and its PullRequest by the krateo.io/publish label, so an */}}
{{/* opened change request shows even where spec.decision is not served yet; the claim's presence */}}
{{/* retires Open change request, since a second POST of the same name is a 409. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: review-proposal
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: proposal
      path: ${ "/apis/review.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/proposals/" + (.name // "") }
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: proposalError
    - name: all
      path: /apis/review.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/proposals
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: allError
    {{- include "portal.reviewDiscoverySteps" (dict "source" "proposal") | nindent 4 }}
    {{/* The BuilderPublish CRD's served version tracks the portal chart, so it is discovered from the */}}
    {{/* CompositionDefinition's status (as restaction.kog-oas-operations does), never hardcoded. */}}
    - name: bp
      path: /apis/core.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/compositiondefinitions/builder-publish
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: bpError
    - name: claim
      dependsOn:
        name: bp
      path: ${ "/apis/" + (.bp.status.apiVersion // "composition.krateo.io/v1") + "/namespaces/{{ .Release.Namespace }}/" + (.bp.status.resource // "builderpublishes") + "/review-" + ((.name // "") | ltrimstr("p-")) }
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: claimError
    - name: prs
      path: /apis/github.krateo.io/v2022-11-28/namespaces/{{ .Release.Namespace }}/pullrequests
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: prsError
  filter: |
    {{- include "portal.reviewDefs" . | nindent 4 }}
    rv_served_gvs as $served
    | rv_kinds_by_gv as $kinds
    | (.name // "") as $name
    | (if (.proposal.kind // "") == "Proposal" then .proposal else null end) as $p
    | ((.proposalError // null) | if . == null then "" else tostring end) as $perr
    | ([ ((.all.items) // [])[] ]) as $all
    | ([ $all[] | select((.status.phase // "") == "Superseded" and (.status.supersededBy // "") != "")
         | { key: .metadata.name, value: .status.supersededBy } ] | from_entries) as $up
    | ([ $all[] | select((.metadata.name | rv_root($up; 0)) == $name and .metadata.name != $name) ]
       | sort_by(.metadata.creationTimestamp // "") | reverse) as $earlier
    | (if $p == null then null else ($p.status.supersededBy // "") end) as $by
    | ([ $all[] | select(.metadata.name == $by) ][0] // null) as $byP
    | (if (.claim.kind // "") != "" and (.claim.metadata.name // "") != "" then .claim else null end) as $claim
    | (if $p == null then "" else ($p.spec.decision.claim // ($p | rv_claim)) end) as $claimRef
    | ([ ((.prs.items) // [])[] | select(((.metadata.labels["krateo.io/publish"]) // "") == $claimRef) ][0] // null) as $pr
    | if $p == null then
        { found: false, name: $name,
          title: (if ($perr | test("403|forbidden"; "i")) then "You cannot read this proposal"
                  else "Proposal not found" end),
          message: (if ($perr | test("403|forbidden"; "i")) then "Reading review.krateo.io proposals was refused for your account."
                    else ("No proposal named " + $name + " exists. It may have expired after being decided.") end) }
      else
        ($p | rv_phase) as $ph
        | ($p | rv_decision) as $d
        | ($p | rv_kindcheck($served; $kinds)) as $kc
        | ($p | rv_target) as $tc
        | ($p.spec.target.repo // "") as $repo
        | ($p.spec.change.format // "yaml") as $fmt
        | ($p.spec.change.content // "") as $content
        | (if ($content | test("```")) then "~~~~" else "```" end) as $fence
        | $claimRef as $claimName
        | ("review/" + (($p.spec.kind // "change") | ascii_downcase) + "-" + ($name | ltrimstr("p-") | .[0:12])) as $branch
        | { found: true,
            name: $name,
            title: ($p.spec.title // $name),
            kind: ($p.spec.kind // "—"),
            phase: $ph,
            phaseColor: ($ph | rv_phase_color),
            subject: ($p.spec.subject // ""),
            run: ($p.spec.producedBy.runRef // ""),
            proposedAt: ($p.metadata.creationTimestamp | rv_when),
            runPath: (if ($p.spec.producedBy.runRef // "") == "" then "" else "/reviews/runs/" + $p.spec.producedBy.runRef end),
            rationale: ($p.spec.rationale // "No rationale recorded."),
            {{/* evidence[].query is historical and model-invented: never read, never rendered. */}}
            evidenceRows: [ ($p.spec.evidence // [])[] | { source: (.source // "unknown"), summary: (.summary // "—"),
                            counted: (if .observedCount == null then "—" else ("the model counted " + (.observedCount | rv_num)) end) } ],
            evidenceCount: (($p.spec.evidence // []) | length),
            facts: ([
              { label: "Proposed target", value: (if $repo == "" then "—" else $repo + " · " + ($p.spec.target.path // "no path given") + " (the model's choice; the pull request settles where it lands)" end) },
              { label: "Target check", value: (
                  if $tc.state == "found" then "Repository found (public)"
                  elif $tc.state == "unverified" then "Target unverified: " + $tc.message
                  elif $tc.state == "invalid" then "Target invalid: " + $tc.message
                  elif $tc.state == "unanswered" then "Not answered (" + $tc.reason + ")"
                  else "Not checked (proposal predates the check)" end) },
              { label: "Model says", value: (($p.spec.confidence // "—") + " (unverified)") },
              { label: "Produced by", value: (($p.spec.producedBy.runRef // "—") + (if ($p.spec.producedBy.agent // "") != "" then " · " + $p.spec.producedBy.agent else "" end)) },
              { label: "Decision", value: (
                  if $ph == "Rejected" then ("Rejected" + (if $d.by != "" then " by " + $d.by else "" end)
                                             + (if $d.at != "" then " · " + ($d.at | rv_when) else "" end)
                                             + (if $d.reason != "" then " · " + $d.reason else "" end))
                  elif $ph == "Merged" or $ph == "Failed" then ($ph + (if $d.by != "" then " · change request opened by " + $d.by else "" end))
                  elif $ph == "PrOpen" or $claim != null then ("Change request opened (" + $claimName + ")"
                                             + (if $d.by != "" then " by " + $d.by else "" end)
                                             + (if $d.at != "" then " · " + ($d.at | rv_when) else "" end)
                                             + "; decided when its pull request is merged or closed")
                  elif $ph == "Superseded" then "Superseded before a decision"
                  else "Not decided" end) }
            ] + (if $claim != null then [
              { label: "Change request", value: ($claimName + " · branch " + ($claim.spec.branch // $branch)
                  + (if $pr == null then " · pull request not opened yet"
                     else " · pull request #" + (($pr.status.number // 0) | tostring) + " " + ($pr.status.state // "pending")
                          + (if ($pr.status.html_url // "") != "" then " · " + $pr.status.html_url else "" end) end)) } ] else [] end)
               + (if ($p.status.error // "") != "" then [ { label: "Error", value: $p.status.error } ] else [] end)),
            format: $fmt,
            changeMeta: ("format: " + $fmt + " · " + (($content | utf8bytelength) | tostring) + " bytes"),
            changeMarkdown: (if $fmt == "markdown" then $content
                             else ($fence + (if $fmt == "diff" then "diff" else "yaml" end) + "\n" + $content + "\n" + $fence) end),
            kindCheck: $kc,
            kindAlert: (if $kc.state == "notServed" then
                          ("The change is a " + $kc.gv + " " + $kc.kind + ". This cluster serves no such kind, so applying the file here would fail. The pull request can still be opened for a reviewer to rework.")
                        else "" end),
            targetAlert: (if $tc.state == "unverified" then
                            ("The proposed repository " + $repo + " did not resolve: " + $tc.message + " Correct the repository in the change request dialog if it belongs elsewhere.")
                          elif $tc.state == "invalid" then ("The proposed target " + $repo + " is not an owner/name repository. Correct it in the change request dialog.")
                          else "" end),
            lineageAlert: (if $byP != null then ("Superseded by " + $by + " (" + ($byP.spec.title // $by) + "), a later run's proposal for the same finding. Nothing here is open.")
                           elif $by != "" then ("Superseded by " + $by + ", which no longer exists.")
                           elif ($earlier | length) > 0 then ("Replaces " + (($earlier | length) | tostring) + " earlier proposal" + (if ($earlier | length) > 1 then "s" else "" end) + " for the same finding, listed under Earlier proposals.")
                           else "" end),
            supersededByPath: (if $byP != null then "/reviews/proposals/" + $by else "" end),
            earlierRows: [ $earlier[] | { name: .metadata.name, title: (.spec.title // .metadata.name), run: (.spec.producedBy.runRef // "—"),
                                          created: (.metadata.creationTimestamp // ""), target: (.spec.target.repo // "—") } ],
            {{/* Open change request: offered only while undecided and before a claim exists. */}}
            canOpen: (($ph == "Proposed") and $claim == null and ((.bpError // null) == null)),
            {{/* Reject: while undecided, a proposal whose pull request is open included. */}}
            canReject: ($ph == "Proposed" or $ph == "PrOpen"),
            claimName: $claimName,
            branch: $branch,
            prTitle: ("review: " + ($p.spec.title // $name)),
            prBody: ("Proposed by the Krateo nightly review (" + ($p.spec.producedBy.runRef // "?") + "), proposal " + $name + ".\n\n"
                     + ($p.spec.rationale // "") + "\n\nEvidence, as the model reported it (unverified):\n"
                     + ([ ($p.spec.evidence // [])[] | "- " + (.source // "?") + ": " + (.summary // "") ] | join("\n"))),
            repository: $repo,
            file: ($p.spec.target.path // ""),
            content: $content,
            bpApiVersion: (.bp.status.apiVersion // ""),
            bpResource: (.bp.status.resource // "builderpublishes"),
            dialogFacts: [
              { label: "Branch", value: $branch },
              { label: "Pull request title", value: ("review: " + ($p.spec.title // $name)) },
              { label: "Created as", value: ("BuilderPublish " + $claimName + " · builder: review · repository.create: false") },
              { label: "Change", value: ("format: " + $fmt + " · " + (($content | utf8bytelength) | tostring) + " bytes") } ],
            askHref: ("/reviews/proposals/" + $name + "?ask=" + (("Review the nightly-review proposal " + $name + " (\"" + ($p.spec.title // $name) + "\"): check its evidence against the platform's telemetry, say whether the proposed change fits this platform, and what I should do with it.") | @uri)) }
      end
