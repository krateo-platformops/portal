{{/* THE PAGE'S PRIMARY ACTION, and the one that cannot fail: button.blueprint-builder-compose for */}}
{{/* controllers. /controller-builder/compose is a static frontend route behind no feature flag, */}}
{{/* the same composer Autopilot delivers into. It replaces the page's two Forms (paste an OpenAPI */}}
{{/* document, then define one RestDefinition from it), which committed one resources/<kind>.yaml */}}
{{/* file while the rail published a chart: two routes, two different artifacts. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: controller-builder-compose
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    {{/* A verb and its object, as the approved mockup has it. No icon: the sparkle is the */}}
    {{/* Autopilot link's. */}}
    label: Build a controller
    size: middle
    type: primary
    clickActionId: controller-builder-compose
    actions:
      navigate:
        - id: controller-builder-compose
          type: navigate
          path: /controller-builder/compose
  resourcesRefs:
    items: []
