{{/* Incident state filter chips (All · Analyzing · Open · Verifying · Resolved · Closed) as one */}}
{{/* data-driven Listy(chip). The state is URL state (?status=…): each chip navigates to */}}
{{/* /incidents?status=<k>, which reaches incidents-list as an extra; the RESTAction filters */}}
{{/* `.rows` and echoes `.status` + `.counts` (over the full set), so every chip shows its live */}}
{{/* count and active flag. The shell scope (?projects) is carried into each chip's route. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-status-chips
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell — `status` drives */}}
  {{/* the active flag, `projects` is carried into the routes. */}}
  keyExtras: [projects, status]
  apiRef:
    name: incidents-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ ((.status // "all") | tostring) as $sel | (.counts // {}) as $counts | ((.projects // "") | tostring) as $projects | (if $projects != "" then ("&projects=" + ($projects | @uri)) else "" end) as $carry | [{key: "all", label: "All"}, {key: "analyzing", label: "Analyzing"}, {key: "open", label: "Open"}, {key: "verifying", label: "Verifying"}, {key: "resolved", label: "Resolved"}, {key: "closed", label: "Closed"}] | map({label: .label, count: ($counts[.key] // 0), active: (.key == $sel), route: ("/incidents?status=" + .key + $carry)}) }'
  resourcesRefs:
    items: []
