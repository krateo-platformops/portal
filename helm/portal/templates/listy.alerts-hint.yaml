# Empty-state CTA strip under the /alerts table — shown ONLY while zero Alert CRs exist (the
# obs-alerts RA emits the `hint` item exclusively then; hideWhenEmpty removes the strip the moment
# the first alert lands — exception-only UX, the calm default is just the table). The row
# navigates to the create Form at /alerts/new — NOT an Autopilot deep-link: unlike the
# blueprint/API builders (whose rail backend has authoring tools),
# alerts are authored by the deterministic create Form (form.alert-create off the live CRD schema),
# so the empty-state points there. (A Paragraph cannot carry a link — the Listy item is the house
# pattern for an actionable hint.)
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-hint
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: obs-alerts
    namespace: {{ .Release.Namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: false
    hideWhenEmpty: true
    itemTemplate:
      navigateTo: /alerts/new
      iconVariant: tile
      icon: fa-plus
      color:
        default: blue
      primaryText: '{title}'
      subPrimaryText: '{detail}'
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .hint // [] }'
  resourcesRefs:
    items: []
