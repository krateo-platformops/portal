# The Autopilot authoring route for /alerts — an ALWAYS-VISIBLE CTA strip under the table.
#
# This comment previously described the opposite, and the description outlived the behaviour: the
# strip was empty-state-only until #100 made it permanent and gave it an `askHref`, at which point
# it REPLACED the separate "Ask Autopilot" button in the header. A later audit read this comment,
# compared it to what the page does, and filed the difference as a defect — the comment was the
# defect. (`restaction.obs-alerts` states the current contract: "Always-visible 'author with
# Autopilot' CTA ... this replaces the separate Ask Autopilot button".)
#
# So the page deliberately offers BOTH authoring routes: `button.alerts-new` in the header for the
# deterministic create Form (form.alert-create, off the live CRD schema), and this strip for the
# describe-it-in-prose route through the rail.
#
# Its title reads "Author an alert with Autopilot" rather than the canonical "Ask Autopilot" (A4)
# because this is a described strip with a detail line, not a button — A4 governs button labels.
# (A Paragraph cannot carry a link, so the Listy item is the house pattern for an actionable hint.)
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-hint
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: obs-alerts
    namespace: {{ .Release.Namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: false
    hideWhenEmpty: true
    itemTemplate:
      navigateTo: /alerts/new
      iconVariant: tile
      icon: fa-plus
      color:
        default: blue
      primaryText: '{title}'
      subPrimaryText: '{detail}'
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .hint // [] }'
  resourcesRefs:
    items: []
