{{/* Blueprint INSTALL form — deploys a CompositionDefinition (i.e. installs the blueprint). */}}
{{/* Distinct from blueprint-create (which instantiates an ALREADY-installed blueprint from its */}}
{{/* generated CRD). Schema = the CompositionDefinition CRD spec (full), via blueprint-install */}}
{{/* -formdef; chart.{url,repo,version} are pre-filled from the helm index for the selected */}}
{{/* blueprint. Submit POSTs the CompositionDefinition into the chosen namespace; on success */}}
{{/* it lands on the NEW blueprint's detail page (/blueprints/{ns}/{name} — resolveJq sees the */}}
{{/* built request body as `.json`, whose metadata carries name+namespace via payloadToOverride; */}}
{{/* the exact pattern proven by form.blueprint-create). */}}
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-install
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  apiRef:
    name: blueprint-install-formdef
    namespace: {{ .Release.Namespace }}
  widgetData:
    layout: vertical
    submitActionId: submit
    schema: {}
    buttonConfig:
      primary:
        label: Install blueprint
      secondary:
        label: Cancel
        navigateTo: /marketplace
    actions:
      rest:
        - id: submit
          type: rest
          resourceRefId: create-compdef
          headers:
            - 'Content-Type: application/json'
          onSuccessNavigateTo: '${ "/blueprints/" + .json.metadata.namespace + "/" + .json.metadata.name }'
          successMessage: Blueprint installed
          {{/* Body = metadata (name from the form, namespace fixed to the release ns) + spec */}}
          {{/* (the form values minus the synthetic name). antd registers the hidden-section */}}
          {{/* fields, so an untouched optional object rides along EMPTY (e.g. deploy.targetRef:{}), */}}
          {{/* which the real CRD rejects (targetRef.name required) → 422. RECURSIVELY prune empty */}}
          {{/* values (null / "" / {} / []) bottom-up so only filled objects (chart) remain. */}}
          payload:
            apiVersion: core.krateo.io/v1alpha1
            kind: CompositionDefinition
            metadata:
              namespace: {{ .Release.Namespace }}
          payloadToOverride:
            - { name: metadata.name, value: '${ .json.name }' }
            - { name: metadata.namespace, value: '${ .json.namespace }' }
            - { name: spec, value: '${ (.json | del(.name) | del(.namespace)) | walk(if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != [])) else . end) }' }
        {{/* S12 — a builder blueprint that publishes a status projection installs as TWO writes in one */}}
        {{/* confirmed set: the <chart>-status RESTAction its apiRef names, then the CompositionDefinition */}}
        {{/* carrying that apiRef and its statusDataTemplate rows (decision D1: Install applies it). The */}}
        {{/* RESTAction goes first — a CompositionDefinition whose apiRef names a missing RESTAction puts */}}
        {{/* every composition into ApiRefRBACIncomplete. widgetDataTemplate below fills the RESTAction */}}
        {{/* and the two spec fields from blueprint-install-formdef's `projection`, and picks this action */}}
        {{/* only when there is one; every other install keeps `submit`, byte for byte. The two spec */}}
        {{/* fields are constants, set AFTER the form's spec (overrides apply in order), so they are not */}}
        {{/* form fields a person could drop. Placeholders here; the templates replace them. */}}
        - id: submit-projected
          type: rest
          resourceRefId: create-status-restaction
          headers:
            - 'Content-Type: application/json'
          onSuccessNavigateTo: '/blueprints/${namespace}/${name}'
          successMessage: Blueprint installed, with its status projection
          ops:
            - resourceRefId: create-status-restaction
              payload: {}
            - resourceRefId: create-compdef
              payload:
                apiVersion: core.krateo.io/v1alpha1
                kind: CompositionDefinition
                metadata:
                  namespace: {{ .Release.Namespace }}
              payloadToOverride:
                - { name: metadata.name, value: '${ .json.name }' }
                - { name: metadata.namespace, value: '${ .json.namespace }' }
                - { name: spec, value: '${ (.json | del(.name) | del(.namespace)) | walk(if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != [])) else . end) }' }
                - { name: spec.apiRef, value: '{}' }
                - { name: spec.statusDataTemplate, value: '[]' }
  widgetDataTemplate:
    - forPath: schema
      expression: '${ .schemaSpec }'
    - forPath: initialValues
      expression: '${ .initialValues }'
    - forPath: submitActionId
      expression: '${ if .projection != null then "submit-projected" else "submit" end }'
    - forPath: actions.rest[1].ops[0].payload
      expression: '${ .projection.restaction // {} }'
    - forPath: actions.rest[1].ops[1].payloadToOverride[3].value
      expression: '${ .projection.apiRef // {} }'
    - forPath: actions.rest[1].ops[1].payloadToOverride[4].value
      expression: '${ .projection.statusDataTemplate // [] }'
  resourcesRefs:
    items:
      {{/* POST target — create a CompositionDefinition in the release namespace. snowplow infers */}}
      {{/* apiVersion/kind from this ref; the body carries metadata + spec. */}}
      - id: create-compdef
        apiVersion: core.krateo.io/v1alpha1
        namespace: {{ .Release.Namespace }}
        resource: compositiondefinitions
        verb: POST
      - id: create-status-restaction
        apiVersion: templates.krateo.io/v1
        namespace: {{ .Release.Namespace }}
        resource: restactions
        verb: POST
