{{/* Invisible host for the incident meta Descriptions: a borderless, padding-free Card, since a */}}
{{/* Card's children are not bound by the Flex allowedResources list. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-meta-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    variant: borderless
    size: small
    items:
    - resourceRefId: incident-meta-desc
  resourcesRefs:
    items:
    - id: incident-meta-desc
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-meta-desc
      namespace: {{ .Release.Namespace }}
      resource: descriptions
      verb: GET
