# Policy create Form — the agent-create shape (apiRef -> formdef -> live-CRD-derived schema -> one
# POST), for a STANDALONE AgentgatewayPolicy.
#
# stringSchema, NOT schema. Form.tsx prefers widgetData.stringSchema (a raw JSON string) because
# JSON.parse preserves key insertion order, while a `schema` object arrives from a Go map and is
# alphabetised — which would render Attached-to and the JSON body above the Role that decides what
# the body means. restaction.agents-policy-formdef assembles the string for exactly this reason.
#
# reviewBeforeSubmit: a gateway policy changes ENFORCEMENT — authorization, JWT validation, rate
# limits — for every request crossing the object it attaches to, and nothing on this page undoes it.
# The primary button reveals a read-only summary first; only the Review step's button creates.
#
# NO draft action, unlike agent-create. A draft persists field values to localStorage keyed by the
# authenticated user, and the body of an identity policy can carry issuer URLs and JWKS endpoints.
# Round-tripping that through browser storage to save retyping a short JSON block is not a trade
# worth making, so the button is absent rather than present-and-discouraged.
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policy-create
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-policy-formdef
    namespace: {{ .Release.Namespace }}
  widgetData:
    layout: vertical
    reviewBeforeSubmit: true
    submitActionId: submit
    schema: {}
    buttonConfig:
      primary:
        label: Create policy
      review:
        label: Review →
      secondary:
        label: Cancel
        navigateTo: /agents/policies
    actions:
      rest:
        - id: submit
          type: rest
          resourceRefId: create-policy
          headers:
            - 'Content-Type: application/json'
          onSuccessNavigateTo: /agents/policies
          successMessage: Policy created. It is standalone — the agentgateway-policies composition does not know about it and will not reconcile it, which also means nothing will restore it if it is deleted.
          errorMessage: Policy not created — a policy with that name may already exist in that namespace (409), the JSON body may not satisfy the CRD schema (422), or you may not hold create on agentgatewaypolicies.agentgateway.dev there.
          loading:
            display: true
          # apiVersion/kind travel in the body: buildPayload merges the action payload first, then
          # applies the overrides below, and the frontend derives the /call target namespace + name
          # from body metadata — so the resourceRef stays name-free like every other create form.
          # apiVersion is overridden from the formdef rather than pinned here, so a cluster serving a
          # later version of the CRD posts to the version it actually serves.
          payload:
            kind: AgentgatewayPolicy
          payloadToOverride:
            - name: apiVersion
              value: '${ .apiVersion // "agentgateway.dev/v1alpha1" }'
            - name: metadata.name
              value: '${ .json.__policy_name__ }'
            - name: metadata.namespace
              value: '${ .json.__policy_namespace__ }'
            # spec is built WHOLESALE, not merged, so no reserved __key__ can leak into it and no
            # unselected block is ever emitted half-filled.
            #
            # fromjson is safe HERE and would not be in the RESTAction: payloadToOverride is
            # evaluated client-side by buildPayload against the form's own field values, not by
            # snowplow's gojq — where a parsed object carrying nested numbers panics the resolver.
            # A rate limit is nothing but nested numbers, so this distinction is the whole reason
            # the body is parsed at submit time instead of being pre-parsed server-side.
            #
            # try/catch: malformed JSON yields {} and the apiserver rejects the empty policy with a
            # message, rather than the browser throwing and the submit silently doing nothing.
            - name: spec
              value: >-
                ${ ( .json.__target__ // "" ) as $t
                | ( $t | split("/") ) as $p
                | ( $p[0] // "" ) as $kind
                | ( try ( ( .json.__block__ // "{}" ) | fromjson ) catch {} ) as $blk
                | ( if ($blk | type) == "object" then $blk else {} end ) as $blk
                | ( .json.__role__ // "limits" ) as $role
                | ( { targetRefs: [ ( { group: ( if $kind == "Service" then "" else "gateway.networking.k8s.io" end ),
                                        kind: $kind,
                                        name: ( $p[2:] | join("/") ) } ) ] } )
                  + ( if $role == "guardrail" then { backend: { ai: $blk } }
                      elif $role == "passthrough" then { backend: $blk }
                      elif $role == "observability" then { frontend: $blk }
                      else { traffic: $blk } end ) }
  # WITHOUT THIS THE FORM RENDERS NOTHING. `schema: {}` above is a placeholder — the real one is
  # built by restaction.agents-policy-formdef from the live AgentgatewayPolicy CRD, and a Form with
  # an empty schema has no fields to draw, so the widget falls through to its error state. The
  # apiRef was declared and the action was written, but nothing ever mapped the result INTO the
  # widget, so the page shipped showing a red X below a correct header.
  #
  # `stringSchema`, not `schema`: the action deliberately assembles the properties block as TEXT
  # ("Assembled as TEXT so the properties block never becomes a jq object" — see the filter's own
  # header) because a jq object loses key order through Go's map sort, and this form's fields read
  # in a deliberate sequence. The widget prefers `stringSchema` over `schema` when both are present.
  widgetDataTemplate:
    - forPath: stringSchema
      expression: '${ .schemaString }'
    - forPath: propertiesToHide
      expression: '${ .propertiesToHide }'
    - forPath: initialValues
      expression: '${ .initialValues }'
  resourcesRefs:
    items:
      - id: create-policy
        apiVersion: agentgateway.dev/v1alpha1
        resource: agentgatewaypolicies
        namespace: {{ .Release.Namespace }}
        verb: POST
