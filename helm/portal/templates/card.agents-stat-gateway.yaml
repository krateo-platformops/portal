# Agent gateways — one of the three stat cards above the tabs.
#
# Gateways the agent plane actually crosses — DERIVED from the routes (see
# restaction.agents-topology), not a hardcoded name, so a second mesh gateway counts itself.
#
# The chips are Card `tags` (rendered in the footer), COMPUTED from the same action as the
# number. Static default is an empty list: no chips is honest while the action resolves,
# whereas placeholder chips would be numbers nobody measured.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-stat-card-gateway
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-topology
    namespace: {{ .Release.Namespace }}
  widgetData:
    variant: outlined
    tags: []
    items:
    - resourceRefId: agents-stat-gateway
  widgetDataTemplate:
  - forPath: tags
    expression: '${ [ (((.nodes // []) | length) | tostring) + " nodes in the topology" ] }'
  resourcesRefs:
    items:
    - id: agents-stat-gateway
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-stat-gateway
      namespace: {{ .Release.Namespace }}
      resource: statistics
      verb: GET
