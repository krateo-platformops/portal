{{/* /controller-builder deliverables — one row per controller published from this builder. The */}}
{{/* composer and Autopilot both publish through a BuilderPublish claim with builder: controller, */}}
{{/* whose files are git-provider LocalResources labelled krateo.io/builder: controller (the */}}
{{/* `publishes` step). restaction.blueprint-builder-deliverables is the model, step for step; what */}}
{{/* differs is what comes after the merge, because a controller does not stop at registration: */}}
{{/* */}}
{{/*   claim → PullRequest → CompositionDefinition → install claim → RestDefinitions Ready + GVK */}}
{{/* */}}
{{/* A controller is a chart of N RestDefinitions (plus their OAS ConfigMaps). REGISTER creates its */}}
{{/* CompositionDefinition — the same /marketplace/<chart>/install form the blueprint's Install */}}
{{/* step opens, pre-filled from the publish's root compositiondefinition.yaml. INSTALL creates the */}}
{{/* claim of the kind that CompositionDefinition generates (/blueprints/<ns>/<chart>/new); its */}}
{{/* release renders the RestDefinitions, which core-provider labels with the claim's */}}
{{/* krateo.io/composition-kind/-name/-namespace — that is the join. READY is every one of them */}}
{{/* Ready, and the row shows the kinds oasgen generated from them. CONFIGURE CREDENTIALS is the */}}
{{/* step after Ready for an API with security schemes: oasgen generates a <Kind>Configuration */}}
{{/* next to each kind, and a person has to create one (and its Secret) before the kind can call */}}
{{/* the API. */}}
{{/* */}}
{{/* NO LEGACY PR ROWS, and no krateo-oas filter. restaction.kog-deliverables took PullRequests */}}
{{/* whose spec.repo was "krateo-oas" to be controller change requests; the builder has since */}}
{{/* moved to one repository per controller (the chart), so that repository name matched only */}}
{{/* the pre-claim publishes, which never reached a merge. A publish is a controller's because */}}
{{/* its claim says builder: controller, and for no other reason. */}}
{{/* */}}
{{/* Every step is a plain GET with no endpointRef, so snowplow runs it as the caller; */}}
{{/* continueOnError everywhere, so a narrow-RBAC caller (or an install without git-provider or */}}
{{/* oasgen) degrades to fewer rows or fewer rungs, never a failed widget. */}}
{{/* */}}
{{/* "MERGED NEEDS EVIDENCE" holds here exactly as in the blueprint RA (portal.builderPrEnding). */}}
{{/* So does "RELEASED": the chart is pushed to GHCR as OCI, which no step can read, so no row */}}
{{/* claims a release. A CompositionDefinition that exists and is not Ready yet says Registering */}}
{{/* (core-provider may still be waiting for the chart to be pushed); the first observable proof of */}}
{{/* a release is that definition going Ready — core-provider pulled the chart — and then the row */}}
{{/* says Registered. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: controller-builder-deliverables
  namespace: {{ .Release.Namespace }}
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    {{/* Change requests the claims opened, matched to their publish by krateo.io/publish. As in */}}
    {{/* the blueprint RA, a just-created PR carries no status yet, so every field is defensive. */}}
    - name: prs
      path: /apis/github.krateo.io/v2022-11-28/namespaces/{{ .Release.Namespace }}/pullrequests
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: prsError
      filter: >
        [ (.prs.items // [])[]
          | select(((.metadata.labels["krateo.io/publish"]) // "") != "")
          | { publish: ((.metadata.labels["krateo.io/publish"]) // ""),
              title: ((.spec.title) // ""),
              number: ((.status.number) // 0),
              state: ((.status.state) // "pending"),
              merged: ((.status.merged) == true),
              mergedKnown: (((.status.merged) | type) == "boolean"),
              url: ((.status.html_url) // ""),
              created: ((.metadata.creationTimestamp) // "") } ]
    {{/* The claims' files, one LocalResource per file, grouped per publish in the final filter. */}}
    - name: publishes
      path: /apis/git.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/localresources
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: publishesError
      filter: >
        [ (.publishes.items // [])[]
          | select(((.metadata.labels["krateo.io/builder"]) // "") == "controller")
          | { publish: ((.metadata.labels["krateo.io/publish"]) // ""),
              branch: (((.status.targetBranch) // (.spec.toRepo.branch)) // ""),
              synced: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {} | (.status // "")),
              syncReason: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {} | (.reason // "")),
              reg: {{ include "portal.builderIsRegistrationFile" . }},
              created: ((.metadata.creationTimestamp) // "") } ]
    {{/* The registered controllers. Join key metadata.name == the claim's chart name, as for */}}
    {{/* blueprints; status carries the kind it generates, which the next step lists. */}}
    {{/* Ordered after `publishes` (dependsOn with no iterator only orders): the `installs` iterator */}}
    {{/* reads both, and a sibling with no dependsOn runs in map order. */}}
    - name: cds
      dependsOn:
        name: publishes
      path: /apis/core.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/compositiondefinitions
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: cdsError
      filter: >
        [ (.cds.items // [])[]
          | { name: (.metadata.name // ""),
              namespace: (.metadata.namespace // ""),
              version: ((.spec.chart.version) // ""),
              kind: ((.status.kind) // ""),
              apiVersion: ((.status.apiVersion) // ""),
              resource: ((.status.resource) // ""),
              ready: ([ (.status.conditions // [])[] | select((.type // "") == "Ready") ] | first // {} | (.status // "")),
              # FAILED IS Synced=False ReconcileError, never Ready=False alone: core-provider and
              # oasgen both write Ready=False reason Creating (and Unavailable while the generated
              # CRD does not exist yet) for as long as they are still working.
              failed: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {}
                       | ((.status // "") == "False" and (.reason // "") == "ReconcileError")) } ]
    {{/* The install claims: one CLUSTER-SCOPE list per kind a controller's CompositionDefinition */}}
    {{/* generates (only the claims' charts — listing every CompositionDefinition's kind would be */}}
    {{/* forty calls for one page). Cluster scope, not per namespace: snowplow collapses an */}}
    {{/* iterator of namespaced lists into ONE list of the first element's kind (the portal 1.8.56 */}}
    {{/* composition-detail defect). The claims are matched to their definition by the labels */}}
    {{/* core-provider stamps, never by .kind (an informer-served object may carry none). */}}
    - name: installs
      dependsOn:
        name: cds
        iterator: >-
          ([ (.publishes // [])[] | (.publish // "") | select(startswith("publish-")) | sub("^publish-"; "") ] | unique) as $charts
          | [ (.cds // [])[] | select(.apiVersion != "" and .resource != "")
              | select(.name as $n | $charts | index($n)) ]
          | unique_by([.apiVersion, .resource])
      path: ${ "/apis/" + .apiVersion + "/" + .resource }
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: installsError
      filter: >
        [ (.installs.items // [])[]
          | { cd: ((.metadata.labels["krateo.io/composition-definition-name"]) // ""),
              cdNs: ((.metadata.labels["krateo.io/composition-definition-namespace"]) // ""),
              name: (.metadata.name // ""),
              namespace: (.metadata.namespace // ""),
              ready: ([ (.status.conditions // [])[] | select((.type // "") == "Ready") ] | first // {} | (.status // "")),
              # FAILED IS Synced=False ReconcileError, never Ready=False alone: core-provider and
              # oasgen both write Ready=False reason Creating (and Unavailable while the generated
              # CRD does not exist yet) for as long as they are still working.
              failed: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {}
                       | ((.status // "") == "False" and (.reason // "") == "ReconcileError")) } ]
    {{/* The RestDefinitions, as restaction.kog-restdefinitions reads them (cluster list, filtered */}}
    {{/* to the namespaces the caller may list them in). Joined to an install by the claim labels. */}}
    - name: restdefs
      dependsOn:
        name: installs
      path: /apis/ogen.krateo.io/v1alpha1/restdefinitions
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: restdefsError
      userAccessFilter:
        verb: list
        group: ogen.krateo.io
        resource: restdefinitions
        namespaceFrom: .metadata.namespace
      filter: >
        [ .restdefs.items[]?
          | { name: (.metadata.name // ""),
              namespace: (.metadata.namespace // ""),
              compKind: ((.metadata.labels["krateo.io/composition-kind"]) // ""),
              compName: ((.metadata.labels["krateo.io/composition-name"]) // ""),
              compNs: ((.metadata.labels["krateo.io/composition-namespace"]) // ""),
              genKind: (.status.resource.kind // ""),
              genApiVersion: (.status.resource.apiVersion // ""),
              ready: ([ (.status.conditions // [])[] | select((.type // "") == "Ready") ] | first // {} | (.status // "")),
              failed: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {}
                       | ((.status // "") == "False" and (.reason // "") == "ReconcileError")),
              auth: (.status.hasSecuritySchemes == true),
              cfgKind: (.status.configuration.kind // ""),
              cfgApiVersion: (.status.configuration.apiVersion // "") } ]
    {{/* The <Kind>Configurations that exist, for the RestDefinitions of a controller install whose */}}
    {{/* API declares security schemes. One cluster list per configuration kind; oasgen names the */}}
    {{/* plural as the lower-cased kind plus "s" (actionsvariableorgconfigurations on krateo-057). */}}
    {{/* Attributed by the LIST, not by its items: an informer-served object may carry no kind, */}}
    {{/* but every response is a list envelope whose apiVersion is the group/version asked for and */}}
    {{/* whose kind names what was listed — "<Kind>List" from the apiserver, "<plural>List" when */}}
    {{/* snowplow serves it from its cache (informer_dispatch.go listKindForResource). Both are */}}
    {{/* read, lower-cased, as the configuration kind or its plural. */}}
    - name: configs
      dependsOn:
        name: restdefs
        iterator: >-
          ([ (.installs // [])[] | "\(.namespace)/\(.name)" ]) as $mine
          | [ (.restdefs // [])[]
              | select(.auth and .cfgKind != "" and (.cfgApiVersion | contains("/")))
              | select(("\(.compNs)/\(.compName)") as $k | $mine | index($k))
              | { apiVersion: .cfgApiVersion, plural: ((.cfgKind | ascii_downcase) + "s") } ]
          | unique
      path: ${ "/apis/" + .apiVersion + "/" + .plural }
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: configsError
      {{/* One entry per Configuration: which Secrets its authentication refs NAME — every *Ref object */}}
      {{/* under a scheme of spec.authentication with a name AND a key (bearer.tokenRef on krateo-057); */}}
      {{/* a ref with no namespace means the Configuration's own. Only names: a Configuration holds */}}
      {{/* references, never a credential. NO STEP IN THIS CHART READS A SECRET (scripts/lint-ra-secrets.py): */}}
      {{/* snowplow serves a secrets GET or LIST from a lazily registered cluster-wide informer that */}}
      {{/* ignores the Accept header, so even a metadata-only read would cache every Secret's data. */}}
      filter: >
        [ .configs | objects
          | ((.kind // "") | ascii_downcase | sub("list$"; "")) as $list
          | (.apiVersion // "") as $api
          | (.items // [])[]
          | (.metadata.namespace // "") as $ns
          | { list: $list,
              apiVersion: $api,
              name: (.metadata.name // ""),
              namespace: $ns,
              secrets: [ ((.spec.authentication // {}) | if type == "object" then . else {} end) | to_entries[]
                         | ((.value // {}) | if type == "object" then . else {} end) | to_entries[]
                         | select(.key | endswith("Ref")) | .value
                         | select(type == "object"
                                  and ((.name // "") | type == "string" and . != "")
                                  and ((.key // "") | type == "string" and . != ""))
                         | "\((.namespace // "") | if . == "" then $ns else . end)/\(.name)" ] } ]
  {{/* The ladder, the Next step cell and the per-row destination, computed HERE, server-side. */}}
  {{/* Rows are newest-first. A LITERAL block (|): see restaction.blueprint-builder-deliverables. */}}
  filter: |
    {{- include "portal.builderPrEnding" . | nindent 4 }}
    # Register (create the CompositionDefinition) is offered exactly when the blueprint RA offers
    # Install, for the same reasons: the definitions could be read, the publish carries its root
    # registration file, none exists yet, and the change request ended in a merge (or closed
    # while the provider cannot say whether it merged).
    ((.cdsError // null) == null) as $cdsRead
    | ((.configsError // null) == null) as $configsRead
    | def registerable($cd; $end; $hasReg): $cdsRead and $hasReg and $cd == null and ($end == "merged" or $end == "closed?");
    (.cds // []) as $cds
    | (.prs // []) as $prs
    | (.installs // []) as $installs
    | (.restdefs // []) as $rds
    | ((.installsError // null) == null) as $installsRead
    # The Configurations of a RestDefinition's configuration kind (the list is attributed by its
    # apiVersion and its lower-cased kind or plural), and whether one of them names a Secret.
    # NAMES, NOT EXISTS: whether that Secret exists is not read here — no RESTAction reads Secrets
    # (see the configs step) — so the row says which Secret it relies on, unverified, and the first
    # reconcile is still where a missing one shows.
    | ((.configs // []) | if type == "array" then . else [] end) as $configs
    | def configsOf($rd): ($rd.cfgKind | ascii_downcase) as $k
        | [ $configs[] | select(.apiVersion == $rd.cfgApiVersion and (.list == $k or .list == ($k + "s"))) ];
    def configured($rd): any(configsOf($rd)[]; ((.secrets // []) | length) > 0);
    ([ (.publishes // []) | group_by(.publish)[]
         | select((.[0].publish // "") != "")
         | .[0] as $p0
         | ($p0.publish | sub("^publish-"; "")) as $chart
         | ( [ $cds[] | select(.name == $chart) ] | first ) as $cd
         | (all(.[]; .synced == "True")) as $pushed
         | (any(.[]; .syncReason == "ReconcileError")) as $failed
         | (any(.[]; .reg == true)) as $hasReg
         | ( [ $prs[] | select(((.publish) // "") == ($p0.publish // "")) ] | first ) as $pr
         | ending($pr) as $end
         # The install claims of this controller, and the RestDefinitions each one rendered.
         | ( if $cd == null then []
             else [ $installs[] | select(.cd == $cd.name and (.cdNs == "" or .cdNs == $cd.namespace)) ] end ) as $ins
         | ( [ $ins[] as $i | $rds[]
               | select(.compName == $i.name and .compNs == $i.namespace and (.compKind == "" or .compKind == $cd.kind)) ] ) as $mine
         | (($mine | length) > 0 and all($mine[]; .ready == "True")) as $allReady
         | (any($mine[]; .failed) or any($ins[]; .failed) or ($cd != null and $cd.failed)) as $broken
         # Install is offered only when the install claims could be READ: a denied list is not
         # evidence that there is none (as $cdsRead gates Register).
         | ($installsRead and $cd != null and $cd.ready == "True" and ($ins | length) == 0) as $installable
         # A Ready RestDefinition whose API needs credentials and whose <Kind>Configuration does
         # not exist yet. Only when the configurations could be read: an unread list is not
         # evidence that there are none.
         | ( [ $mine[] | select(.ready == "True" and .auth and .cfgKind != "")
               | select(configured(.) | not) ] ) as $unconfigured
         | ($configsRead and ($unconfigured | length) > 0) as $needsCreds
         # The evidence, in the row: what is missing for the first such kind, or which Secret each
         # credentialed kind relies on once every one names one.
         | ( if $needsCreds then
               ($unconfigured[0]) as $u | configsOf($u) as $cs
               | (if ($cs | length) == 0 then ("no " + $u.cfgKind + " exists yet")
                  else ($u.cfgKind + " " + $cs[0].namespace + "/" + $cs[0].name + " names no Secret") end)
               + (if ($unconfigured | length) > 1 then " (+\(($unconfigured | length) - 1) more)" else "" end)
             elif ($configsRead and $allReady) then
               ([ $mine[] | select(.ready == "True" and .auth and .cfgKind != "") | configsOf(.)[] | .secrets[] ] | unique) as $named
               | (if ($named | length) == 0 then ""
                  elif ($named | length) == 1 then ("credentials configured (Secret " + $named[0] + " not verified)")
                  else ("credentials configured (Secrets " + ($named | join(", ")) + " not verified)") end)
             else "" end ) as $credNote
         | ([ $mine[] | select(.genKind != "") | .genKind + " · " + .genApiVersion ] | unique) as $gvks
         | { chart: $chart,
             title: (($pr.title) // ""),
             pr: (if (($pr.number) // 0) > 0 then ("#" + ($pr.number | tostring)) else ($p0.branch // "") end),
             url: (($pr.url) // ""),
             version: (if $cd != null then ("v" + ($cd.version // "?")) else "—" end),
             status: (if $broken then "Failed"
                      # Not Ready while a credentialed kind has no Configuration naming a Secret:
                      # it would fail at its first reconcile, not here.
                      elif ($allReady and $needsCreds) then "Configure credentials"
                      elif $allReady then "Ready"
                      # Installed while its RestDefinitions are still being created.
                      elif ($ins | length) > 0 then "Installed"
                      elif ($cd != null and $cd.ready == "True") then "Registered"
                      # Any other state of a definition that exists — Creating, Unavailable while
                      # its CRD is generated, no condition yet — is progress.
                      elif ($cd != null) then "Registering"
                      elif $end == "merged" then "Merged"
                      elif ($end == "closed" or $end == "closed?") then "Closed"
                      elif ($pr != null and (($pr.number) // 0) > 0) then "Change request open"
                      elif $pushed then "Pushed"
                      elif $failed then "Publish failed" else "Publishing" end),
             statusColor: (if $broken then "red"
                           elif ($allReady and $needsCreds) then "orange"
                           elif $allReady then "green"
                           elif (($ins | length) == 0 and $cd != null and $cd.ready == "True") then "green"
                           elif ($cd == null and $end == "merged") then "green"
                           elif ($cd == null and ($end == "closed" or $end == "closed?")) then "gray"
                           elif ($cd == null and $failed and ($pr == null)) then "red"
                           else "orange" end),
             # The person's next step, when there is one; empty otherwise (exception-only).
             next: (if registerable($cd; $end; $hasReg) then (if $end == "merged" then "Register" else "Register if merged" end)
                    elif $installable then "Install"
                    elif ($allReady and $needsCreds) then "Configure credentials"
                    else "" end),
             # The credential evidence (the Next step cell shows it beside the step).
             nextNote: $credNote,
             # The generated kinds: the first, and how many more.
             gvk: (if ($gvks | length) == 0 then "—"
                   elif ($gvks | length) == 1 then $gvks[0]
                   else "\($gvks[0]) +\(($gvks | length) - 1)" end),
             ns: "{{ .Release.Namespace }}",
             # Per-row destination, the Table takes it whole. The step the Next cell names first;
             # then the install, once there is one; then the change request; else nothing.
             rowHref: (if registerable($cd; $end; $hasReg) then ("/marketplace/" + $chart + "/install")
                       elif $installable then ("/blueprints/" + $cd.namespace + "/" + $chart + "/new")
                       elif ($allReady and $needsCreds) then ("/controller-builder/configure/" + $unconfigured[0].namespace + "/" + $unconfigured[0].name)
                       elif ($ins | length) > 0 then ("/compositions/" + $ins[0].namespace + "/" + $ins[0].name)
                       elif $cd != null then ("/blueprints/" + $cd.namespace + "/" + $chart)
                       else (($pr.url) // "") end),
             age: ($p0.created // "") } ]) as $claimRows
    | ($claimRows | sort_by(.age // "") | reverse) as $rows
    | { rows: $rows,
        counts: { total: ($rows | length),
                  ready: ([ $rows[] | select(.status == "Ready") ] | length) } }
