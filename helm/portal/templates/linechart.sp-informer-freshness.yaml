{{- if (.Values.observability | default dict).snowplowSli }}
{{/* How stale the informers are. A rising max_event_age means a watch has gone quiet. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-informer-freshness
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "max_event_age_seconds": orange
      "gvrs_stale_over_hour": red
    shapeField: smooth
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: (.stat|tostring), v: (.v|tonumber) } ] }'
  apiRef:
    name: sp-informer-freshness
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
{{- end }}
