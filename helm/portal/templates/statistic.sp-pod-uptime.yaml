{{- if (.Values.observability | default dict).snowplowSli }}
kind: Statistic
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-pod-uptime
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  apiRef:
    name: sp-pod-uptime
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Pod uptime (min)
    value: 0
  widgetDataTemplate:
  - forPath: value
    # uptime_min arrives fractional (the RESTAction's SQL does round(.../60, 1)), and
    # widgetData.value is x-kubernetes-int-or-string, which accepts integer or string
    # and REJECTS float. Floor it, as composition-reconcile-p95 already does.
    expression: '${ ([ (.rows // [])[] | (.uptime_min|tonumber|floor) ] | first // 0) }'
  resourcesRefs:
    items: []
{{- end }}
