{{/* The body of each How-to-fix step (0 precondition · 1 apply · 2 verify): a Flex holding the */}}
{{/* step's Markdown (what the script decides, its last run, the script in a fenced block with */}}
{{/* its own copy control) and, on the apply step only, "I applied it". incident-detail shapes */}}
{{/* the markdown (.fixSteps[i].md) and decides whether the button shows (.canApply: the */}}
{{/* incident is Open, has an apply script and has no click waiting for the controller). */}}
{{- range $i := until 3 }}
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-rem-step-{{ $i }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  {{- if eq $i 1 }}
  apiRef:
    name: incident-detail
    namespace: {{ $.Release.Namespace }}
  {{- end }}
  widgetData:
    allowedResources:
    - markdowns
    - buttons
    gap: small
    vertical: true
    align: flex-start
    items:
    - resourceRefId: incident-rem-step-md-{{ $i }}
  {{- if eq $i 1 }}
  widgetDataTemplate:
    - forPath: items
      expression: '${ [ { resourceRefId: "incident-rem-step-md-1" } ] + (if (.canApply // false) then [ { resourceRefId: "incident-rem-applied" } ] else [] end) }'
  {{- end }}
  resourcesRefs:
    items:
    - id: incident-rem-step-md-{{ $i }}
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-rem-step-md-{{ $i }}
      namespace: {{ $.Release.Namespace }}
      resource: markdowns
      verb: GET
    {{- if eq $i 1 }}
    - id: incident-rem-applied
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-rem-applied
      namespace: {{ $.Release.Namespace }}
      resource: buttons
      verb: GET
    {{- end }}
---
kind: Markdown
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-rem-step-md-{{ $i }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ $.Release.Namespace }}
  widgetData:
    markdown: ''
    {{/* No widget-level allowCopy: every fenced block carries its own copy control, so Copy */}}
    {{/* copies the script alone. */}}
  widgetDataTemplate:
  - forPath: markdown
    expression: '${ ((.fixSteps // [])[{{ $i }}] // {}).md // "" }'
  resourcesRefs:
    items: []
{{- end }}
---
{{/* "I applied it": the human ran the apply script in their own terminal. Sets spec.applied on */}}
{{/* the Incident (merge-patch, the user's token); the controller consumes it — records an apply */}}
{{/* check, moves Open to Verifying, runs the verify script and resets spec.applied. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-rem-applied
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    label: I applied it
    icon: fa-circle-check
    type: primary
    size: middle
    clickActionId: applied
    actions:
      rest:
        - id: applied
          type: rest
          resourceRefId: applied-incident
          headers:
            - 'Content-Type: application/merge-patch+json'
          payload:
            spec:
              applied: true
          successMessage: Recorded — the controller now runs the verify script
          loading:
            display: true
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: applied-incident
        apiVersion: ${ .incidentGvr.apiVersion }
        resource: ${ .incidentGvr.resource }
        name: ${ .incidentGvr.name }
        namespace: ${ .incidentGvr.namespace }
        verb: PATCH
