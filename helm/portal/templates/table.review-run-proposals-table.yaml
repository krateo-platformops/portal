kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-run-proposals-table
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-run
    namespace: {{ .Release.Namespace }}
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    rowNavigateTo: /reviews/proposals/{name}
    columns:
    - valueKey: title
      title: Proposal
      minWidth: 220
    - valueKey: kind
      title: Kind
    - valueKey: phase
      title: Status
    - valueKey: checks
      title: Checks
      minWidth: 140
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: >-
      ${ [ (.proposalRows // [])[] | [
        {valueKey:"name",kind:"jsonSchemaType",type:"string",stringValue:.name},
        {valueKey:"title",kind:"jsonSchemaType",type:"string",stringValue:.title},
        {valueKey:"kind",kind:"tag",stringValue:.kind,color:"gray"},
        {valueKey:"phase",kind:"tag",stringValue:.phase,color:.phaseColor},
        {valueKey:"checks",kind:"conditions",stringValue:.checks} ] ] }
  resourcesRefs:
    items: []
