# Second header row (#105): the chips (affected ref + Alert link) on the left and the action
# button cluster on the right, sharing one line with justify space-between and centre alignment —
# sitting BENEATH the title line (name + Lifecycle/Trigger tags), which
# incident-detail-header-block renders on its own row. Mirrors composition-detail-title-stack.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-title-stack
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    allowedResources:
      - flexes
    vertical: false
    justify: space-between
    align: center
    gap: middle
    wrap: true
    items:
      - resourceRefId: incident-detail-chips
      - resourceRefId: incident-detail-actions
  resourcesRefs:
    items:
      - id: incident-detail-chips
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: incident-detail-chips
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
      - id: incident-detail-actions
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: incident-detail-actions
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
