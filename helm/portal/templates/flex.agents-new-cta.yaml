# Right-aligned holder for the /agents CTA (Buttons have no self-alignment field, so a flush-right
# Flex row wraps them). Mirrors flex.alerts-new-cta. Its own file so the /agents page root gains
# exactly one items entry + one resourcesRefs entry when the CTA is switched on.
#
# WIRED: flex.page-agents carries this as its second items entry, between the pagehead and the
# inventory table. It stayed unreferenced only while /agents/new was not a route; menu.sidebar-nav
# now carries that route (order 936) and page-agent-create sits in the namespace the `page:`
# convention actually looks in, so the Button below lands on the form instead of <Page404/>.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-new-cta
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - buttons
    justify: flex-end
    items:
    - resourceRefId: agents-new
  resourcesRefs:
    items:
    - id: agents-new
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-new
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
