# Right-aligned holder for the /agents CTA (Buttons have no self-alignment field, so a flush-right
# Flex row wraps them). Mirrors flex.alerts-new-cta. Its own file so the /agents page root gains
# exactly one items entry + one resourcesRefs entry when the CTA is switched on.
#
# Like button.agents-new, this is not referenced by any page yet — see flex.page-agents for why
# (/agents/new is not a route on this branch) and for the two-step recipe to enable it.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-new-cta
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - buttons
    justify: flex-end
    items:
    - resourceRefId: agents-new
  resourcesRefs:
    items:
    - id: agents-new
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-new
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
