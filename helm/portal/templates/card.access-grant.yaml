# Access persona grant section (#88 §0.6) — wraps the Role+RoleBinding grant
# Form behind the same unified Card language as every other section-heavy
# detail page (titleVariant: eyebrow + variant: outlined + headerLeft one-line
# desc), replacing the old bare "strong Paragraph label + secondary Paragraph
# desc" pair.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: access-grant-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [username]
  widgetData:
    title: Grant access
    titleVariant: eyebrow
    variant: outlined
    headerLeft: Role + RoleBinding in one gated submit · namespaced only (cluster-wide grants are out of scope in v1)
    items:
    - resourceRefId: access-grant
  resourcesRefs:
    items:
    - id: access-grant
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: access-grant
      namespace: {{ .Release.Namespace }}
      resource: forms
      verb: GET
