# "Pods" card → the component Deployment's live pods (matched by its own selector,
# server-side). The table carries the real per-pod runtime facts. No `extra`
# subtext — title alone.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-component-detail-pods
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name]
  widgetData:
    title: Pods
    titleVariant: eyebrow
    variant: outlined
    items:
      - resourceRefId: component-detail-pods
  resourcesRefs:
    items:
      - id: component-detail-pods
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: component-detail-pods
        namespace: {{ .Release.Namespace }}
        resource: tables
        verb: GET
