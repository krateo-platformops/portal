{{/* The outlined frame around the incident page's tabs, the same surface as the other sections. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-tabs-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    variant: outlined
    items:
    - resourceRefId: incident-detail-tabs
  resourcesRefs:
    items:
    - id: incident-detail-tabs
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-detail-tabs
      namespace: {{ .Release.Namespace }}
      resource: tabs
      verb: GET
