{{/* The Topology card (mockup 14): the chart's resources as it declares them, lit by live state, and */}}
{{/* beside them where the composition is. Titled "Topology" alone (P17): user-facing copy names what */}}
{{/* the person sees, never the file it came from, so the mockup's "· from architecture.yaml" is gone. */}}
{{/* It has no badge: the header's Ready/Synced tags already carry health, and a second marker that is */}}
{{/* present on every composition would carry no signal (exception-only). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-composition-detail-architecture
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    title: Topology
    titleVariant: eyebrow
    variant: outlined
    items:
      - resourceRefId: row-composition-detail-architecture-body
  resourcesRefs:
    items:
      - id: row-composition-detail-architecture-body
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: row-composition-detail-architecture-body
        namespace: {{ .Release.Namespace }}
        resource: rows
        verb: GET
