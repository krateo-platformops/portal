# The /alerts/new page header — title and subtitle in one CR.
#
# Replaces four: flex.alert-create-header plus the eyebrow, title and subtitle Paragraphs.
#
# THE EYEBROW IS GONE, and that is a deletion rather than a regression: Paragraph.tsx already
# returns null for `variant: eyebrow`, so "Observability · tenant …" has been rendering as nothing.
#
# No actions. This is a create page: the only action is Submit, and it belongs to the Form below —
# a header button would either duplicate it or, worse, submit a form the reader cannot see.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-create-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: New alert
    subtitle: >-
      Define a HyperDX alert rule — what to watch, the threshold and the evaluation interval. Fields
      come from the live Alert CRD; a firing alert opens on the Incidents page and auto-triages in
      Autopilot.
  resourcesRefs:
    items: []
