# GUARDED by observability.reconcileTracing, matching col.obs-tab-telemetry.yaml, which wraps
# both the items entry and the resourcesRefs entry that reach this CR. Without the guard here
# the CR rendered, applied and reconciled on every install while nothing could ever reach it.
{{- if (.Values.observability | default dict).reconcileTracing }}
# Full-width strip hosting the per-composition reconcile-latency card (ClickHouse
# otel_traces). Sits below the throughput strip — the "which compositions are slow"
# detail beneath the "how much reconcile traffic overall" trend.
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-latency-row
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - cards
    items:
    - resourceRefId: obs-latency-card
      size: 24
  resourcesRefs:
    items:
    - id: obs-latency-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-latency-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
{{- end }}
