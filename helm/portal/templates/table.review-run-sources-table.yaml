kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-run-sources-table
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-run
    namespace: {{ .Release.Namespace }}
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    columns:
    - valueKey: source
      title: Source
    - valueKey: state
      title: State
    - valueKey: queried
      title: Queries
    - valueKey: returned
      title: Returned
    - valueKey: detail
      title: What happened
      minWidth: 240
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: >-
      ${ [ (.sourceRows // [])[] | [
        {valueKey:"source",kind:"jsonSchemaType",type:"string",stringValue:.source},
        {valueKey:"state",kind:"tag",stringValue:.state,color:.stateColor},
        {valueKey:"queried",kind:"jsonSchemaType",type:"string",stringValue:.queried},
        {valueKey:"returned",kind:"jsonSchemaType",type:"string",stringValue:.returned},
        {valueKey:"detail",kind:"jsonSchemaType",type:"string",stringValue:.detail} ] ] }
  resourcesRefs:
    items: []
