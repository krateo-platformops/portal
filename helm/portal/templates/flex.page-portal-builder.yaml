# Convention page root for /portal-builder (CHART-P1) — the Autopilot builders' home: a
# how-it-works header, the always-visible "Ask Autopilot →" CTA (the page's own entry into
# the build flow), the in-flight builder pull-requests table, and the "build with Autopilot"
# hint strip (#101 — was missing here; blueprint-builder/kog-builder both carry it).
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-portal-builder
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    # #84: the CTA now rides in a right-aligned wrapper Flex (§0.1) and the PR feed is a Table
    # (§0.2, was a Listy) — so the page renders flexes (header + cta wrapper), tables (builder-prs)
    # and listies (portal-builder-hint, #101).
    allowedResources:
    - flexes
    - tables
    - listies
    vertical: true
    gap: middle
    items:
    - resourceRefId: portal-builder-header
    - resourceRefId: portal-builder-ask-cta
    - resourceRefId: builder-prs
    - resourceRefId: portal-builder-hint
  resourcesRefs:
    items:
    - id: portal-builder-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: portal-builder-header
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: portal-builder-ask-cta
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: portal-builder-ask-cta
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: builder-prs
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: builder-prs
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
    - id: portal-builder-hint
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: portal-builder-hint
      namespace: {{ .Release.Namespace }}
      resource: listies
      verb: GET
