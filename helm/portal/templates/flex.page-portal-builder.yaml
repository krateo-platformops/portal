{{/* Convention page root for /portal-builder (CHART-P1): a header whose one action is "Open the */}}
{{/* composer", a how-a-page-gets-built Card whose extra slot carries "Ask Autopilot" (the second */}}
{{/* way into the same composer), the drafts in progress, and the builders' change requests. */}}
{{/* */}}
{{/* The builder pages no longer share one Ask-Autopilot CTA as their entry point. The Portal and */}}
{{/* Blueprint builders each lead with their composer — a static route behind no feature flag, */}}
{{/* whereas ?ask= on an install without Autopilot is a warning and a stripped param — and keep */}}
{{/* Autopilot as the secondary route onto that same canvas. Only the Controller builder, which */}}
{{/* has no composer, still leads with Ask. The redundant "build with Autopilot" hint strip stays */}}
{{/* removed. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-portal-builder
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
  annotations:
    "krateo.io/nav-group": "Builders"
    "krateo.io/nav-icon": "fa-hammer"
    "krateo.io/nav-label": "Portal Builder"
    "krateo.io/nav-order": "21"
    "krateo.io/nav-path": "/portal-builder"
    "krateo.io/verbose": "true"
spec:
  widgetData:
    {{/* #84: the CTA rides in a right-aligned wrapper Flex (§0.1) and the PR feed is a Table */}}
    {{/* (§0.2, was a Listy) — so the page renders flexes (header + cta wrapper) and tables (builder-prs). */}}
    {{/* `flexes` and `tables` go with the children that used them: the ask-CTA wrapper Flex is */}}
    {{/* retired (PageHeader right-aligns its own action) and both Tables now live inside Cards, */}}
    {{/* because a Table cannot render a heading of its own. */}}
    allowedResources:
    - pageheaders
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: portal-builder-page-header
    {{/* ONE WAY TO BUILD, and this is it. The page used to offer three tiles that looked alike:
         the composer, plus `author-widget` and `compose-page` — two Forms. They were kept on the
         grounds that retiring a working surface is its own decision rather than a side effect of
         adding a better one. This IS that decision.

         What the Forms could produce was the problem. A Form cannot express a tree and
         `SchemaFields` has no repeatable-row control, so both could only emit a FLAT page of
         widgets with STATIC widgetData — no Rows, Cols or Tabs, no `apiRef`, no
         `widgetDataTemplate`. That is half the corpus: 212 of 425 shipped widget templates compute
         their data server-side. restaction.page-composable (since retired) predicted the outcome
         in its own header — "an editor that authors NEW widgets from static widgetData can only
         produce the trivial ones — it would look finished and ship pages nobody wants."

         Three peer-looking tiles with no hint which one disappoints is worse than one that works.
         The composer does nesting, layout and live data binding, so it is now the only path. */}}
    - resourceRefId: how-a-page-gets-built-card
    - resourceRefId: your-drafts-card
    - resourceRefId: builder-change-requests-card
  resourcesRefs:
    items:
    - id: portal-builder-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: portal-builder-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: how-a-page-gets-built-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: how-a-page-gets-built-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: your-drafts-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: your-drafts-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: builder-change-requests-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: builder-change-requests-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
