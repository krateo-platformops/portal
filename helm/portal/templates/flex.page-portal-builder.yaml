{{/* Convention page root for /portal-builder (CHART-P1) — the Autopilot builders' home: a */}}
{{/* how-it-works header, the always-visible "Ask Autopilot →" CTA (the page's own entry into */}}
{{/* the build flow), and the in-flight builder pull-requests table. The redundant "build with */}}
{{/* Autopilot" hint strip was removed — the three builder pages (portal / blueprint / controller) */}}
{{/* now share the single Ask-Autopilot CTA as their one consistent entry point. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-portal-builder
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
  annotations:
    "krateo.io/nav-group": "Builders"
    "krateo.io/nav-icon": "fa-hammer"
    "krateo.io/nav-label": "Portal Builder"
    "krateo.io/nav-order": "21"
    "krateo.io/nav-path": "/portal-builder"
    "krateo.io/verbose": "true"
spec:
  widgetData:
    {{/* #84: the CTA rides in a right-aligned wrapper Flex (§0.1) and the PR feed is a Table */}}
    {{/* (§0.2, was a Listy) — so the page renders flexes (header + cta wrapper) and tables (builder-prs). */}}
    allowedResources:
    - pageheaders
    - flexes
    - tables
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: portal-builder-page-header
    - resourceRefId: portal-builder-ask-cta
    {{/* CHART-P2: composing a page is now a control on this page, not only a rail conversation —
         which is what lets Autopilot DRIVE it (A1) instead of writing widget CRs itself. */}}
    {{/* The composer FIRST: it is the path that can build a real page — nesting, layout, and a
         table bound to live data — where the two forms below can only emit a flat page of
         existing widgets with static data. The forms stay because they still work and because
         retiring a working surface is its own decision, not a side effect of adding a better one. */}}
    - resourceRefId: compose-in-ui-card
    {{/* Author first, then compose: the composer can only place widgets that exist. */}}
    - resourceRefId: author-widget-card
    - resourceRefId: compose-page-card
    - resourceRefId: builder-prs
  resourcesRefs:
    items:
    - id: portal-builder-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: portal-builder-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: portal-builder-ask-cta
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: portal-builder-ask-cta
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: compose-in-ui-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compose-in-ui-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: author-widget-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: author-widget-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: compose-page-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compose-page-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: builder-prs
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: builder-prs
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
