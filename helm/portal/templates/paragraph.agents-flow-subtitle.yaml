# Subtitle for the request-flow block, and the place where THE SPLIT IS DECLARED.
#
# The section is half narrative and half live data, and the reader is told which is which before
# reading either. Without this line the derived fact under each hop lends its authority to the
# sentence above it, and the sentence — which is an explanation of a design, not a measurement —
# would read as telemetry. Saying it plainly costs one line and is the difference between an
# explanation and a dashboard that cannot be checked.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-flow-subtitle
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      What a question like "why is this pod crash-looping?" actually crosses, in order. The order and
      the description of each hop are written down — they explain a design and are not measured. The
      line under each one is read from this cluster now: the route that carries the hop, and the
      policies attached to that route and to the gateway it runs on. A hop whose route has gone away
      says so there rather than naming one that no longer exists. Steps 4 to 6 repeat for every model
      turn, delegation and tool call in a session.
    type: secondary
  resourcesRefs:
    items: []
