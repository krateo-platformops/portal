{{/* Incidents — one of the three cards in the alerts summary band. */}}
{{/* */}}
{{/* What the alerts actually caused. The table shows configuration and never outcome, so an */}}
{{/* incident whose analysis failed or produced nothing is otherwise invisible from this page. */}}
{{/* */}}
{{/* Chips are Card `tags`, computed from the same action as the number. Empty list as the static */}}
{{/* default: no chips is honest while the action resolves; placeholder chips would be numbers nobody */}}
{{/* measured. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-stat-card-investigations
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: obs-alerts
    namespace: {{ .Release.Namespace }}
  widgetData:
    variant: outlined
    tags: []
    items:
    - resourceRefId: alerts-stat-investigations
  widgetDataTemplate:
  - forPath: tags
    expression: '${ (if (.incidentsReadable // true) | not then [ "not readable" ] elif ((.incidentsBarren // 0) > 0) then [ ((.incidentsBarren) | tostring) + " produced nothing" ] else [ "all produced an analysis" ] end) }'
  resourcesRefs:
    items:
    - id: alerts-stat-investigations
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-stat-investigations
      namespace: {{ .Release.Namespace }}
      resource: statistics
      verb: GET
