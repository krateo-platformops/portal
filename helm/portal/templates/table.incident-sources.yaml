# EVIDENCE SOURCES table — the verbatim sources the agent read, rendered as a Table for the
# "Sources" tab of the "What happened" Tabs widget. Columns: type (source kind, uppercased),
# ref (the URL/path/object identifier), excerpt (the verbatim text the agent read).
#
# Ask-4 (clickable sources): each row navigates to THIS incident's page with an ?ask seed whose verb
# matches the source type — logs → "retrieve the logs", object/resource → "get object details", event
# → "show the events", else a generic "show this source" — so the click opens Autopilot pre-seeded to
# actually retrieve/get that source (it has the k8s tools). The whole destination is precomputed
# server-side into a hidden `route` cell (incident-detail .sourcesRows[].route); rowNavigateTo is
# `{route}` (frontend Table >= 1.3.78 uses a whole-placeholder cell VERBATIM — the query string is
# preserved). A row with an empty route stays inert.
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-sources-table
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    rowNavigateTo: '{route}'
    columns:
    - valueKey: type
      title: Type
    - valueKey: ref
      title: Reference
    - valueKey: excerpt
      title: Excerpt
    # Ask-4 affordance: a trailing accent cell so a Sources row VISIBLY announces it hands off to
    # Autopilot (vs the Resources tab, whose rows drill into a detail page). Same-looking table rows
    # behaving differently was the confusing bit; this signals the click target before the click.
    - valueKey: action
      title: ''
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ [ (.sourcesRows // [])[] | [ {valueKey:"type",kind:"jsonSchemaType",type:"string",stringValue:(.type // "")}, {valueKey:"ref",kind:"jsonSchemaType",type:"string",stringValue:(.ref // ""),color:"#8c8c8c"}, {valueKey:"excerpt",kind:"jsonSchemaType",type:"string",stringValue:(.excerpt // ""),color:"#595959"}, {valueKey:"action",kind:"jsonSchemaType",type:"string",stringValue:"✨ Ask Autopilot →",color:"#11B2E2"}, {valueKey:"route",kind:"jsonSchemaType",type:"string",stringValue:(.route // "")} ] ] }'
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
