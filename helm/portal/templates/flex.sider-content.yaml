{{/* Declarative Sider content: the nav Menu. The brand moved out to the app-shell Layout's */}}
{{/* `sider.header` / `sider.collapsedHeader` slots (layout.app-shell.yaml), a 64px band level with */}}
{{/* the top bar, so it no longer scrolls with the nav. The tenant chip + project (= namespace) */}}
{{/* selector moved OUT to the app-shell HEADER (flex.header-context, mounted by the frontend */}}
{{/* HeaderChrome) per the multitenancy screenshot — the scope control sits in the topbar, so the */}}
{{/* sider is now just the navigation. The CONSOLE / SCOPE · PROJECTS eyebrows were dropped */}}
{{/* with the scope strip. (The user footer is still engine-injected — per-user identity, not data.) */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sider-content
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    vertical: true
    gap: middle
    allowedResources:
      - menus
    items:
      - resourceRefId: nav
  resourcesRefs:
    items:
      - id: nav
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sidebar-nav
        namespace: {{ .Release.Namespace }}
        resource: menus
        verb: GET
