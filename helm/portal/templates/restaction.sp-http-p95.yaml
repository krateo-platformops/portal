{{- if (.Values.observability | default dict).snowplowSli }}
{{/* VERIFIED against live ClickHouse on krateo-057 before it was written — see portal#201. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: sp-http-p95
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: q
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then "1%20HOUR" elif $r=="24h" then "24%20HOUR" elif $r=="7d" then "7%20DAY" else "24%20HOUR" end) as $iv | (if $r=="1h" then "2%20MINUTE" elif $r=="24h" then "1%20HOUR" elif $r=="7d" then "6%20HOUR" else "1%20HOUR" end) as $bk | "/?query=" + "SELECT%20route%2C%20round%28quantileExactWeighted%280.95%29%28b.1%2C%20b.2%29%2C%204%29%20AS%20p95_s%20FROM%20%28%20SELECT%20Attributes%5B%27http.route%27%5D%20AS%20route%2C%20arrayJoin%28arrayZip%28any%28ExplicitBounds%29%2C%20arrayMap%28%28l%2C%20f%29%20-%3E%20toUInt64%28greatest%28l%20-%20f%2C%200%29%29%2C%20arrayPopBack%28argMax%28BucketCounts%2C%20TimeUnix%29%29%2C%20arrayPopBack%28argMin%28BucketCounts%2C%20TimeUnix%29%29%29%29%29%20AS%20b%20FROM%20otel_metrics_histogram%20WHERE%20ServiceName%3D%27snowplow%27%20AND%20MetricName%3D%27http.server.request.duration%27%20AND%20TimeUnix%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%20AND%20Attributes%5B%27http.route%27%5D%20%21%3D%20%27%2Frefreshes%27%20GROUP%20BY%20route%29%20GROUP%20BY%20route%20ORDER%20BY%20p95_s%20DESC%20LIMIT%2010" + "%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: qError
  filter: >
    { rows: ((.q.data) // []), failed: ((.qError // null) != null) }
{{- end }}
