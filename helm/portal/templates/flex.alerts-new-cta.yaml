# Right-aligned holder for the /alerts "New alert" primary CTA (Button has no self-alignment
# field, so a flush-right Flex row wraps it). Mirrors flex.kog-builder-ask-cta.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-new-cta
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - buttons
    justify: flex-end
    items:
    - resourceRefId: alerts-new
  resourcesRefs:
    items:
    - id: alerts-new
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-new
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
