# Right-aligned holder for the /alerts CTAs (Buttons have no self-alignment field, so a flush-right
# Flex row wraps them). Two paths: "Ask Autopilot →" (conversational, default) then "New alert"
# (deterministic form, primary — rightmost). Mirrors flex.kog-builder-ask-cta.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-new-cta
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - buttons
    justify: flex-end
    # The conversational "Ask Autopilot →" button was replaced by the always-visible "Author an alert
    # with Autopilot" CTA card (listy.alerts-hint); this row now holds only the deterministic form.
    items:
    - resourceRefId: alerts-new
  resourcesRefs:
    items:
    - id: alerts-new
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-new
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET
