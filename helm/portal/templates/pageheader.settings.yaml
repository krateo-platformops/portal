# The /settings page header — title and subtitle in one CR.
#
# Replaces three: flex.settings-title-stack (a vertical Flex whose only job was to stack them),
# paragraph.settings-title and paragraph.settings-subtitle.
#
# `paragraphs` STAYS in page-settings' allowedResources, unlike the other migrations so far: the
# page still has a Paragraph child of its own (settings-audit-log-title, the heading above the
# audit table). Only kinds with no remaining child are pruned.
#
# No actions. User and group management happens inside the Users table below, not from the header,
# and a header button would be a second route to a control that already has one.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: settings-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Settings
    subtitle: Manage local users, groups, and permissions.
  resourcesRefs:
    items: []
