{{/* THE SENTENCE THE SUBTITLE USED TO CARRY, moved to where it is about. The old header ended      */}}
{{/* "Once merged, it publishes an OCI chart and appears below — installable by anyone from the    */}}
{{/* Blueprints page. Each row links to its blueprint." The entry mockup's subtitle is about what  */}}
{{/* a blueprint IS and says nothing about this table, which is right for a header and left the    */}}
{{/* table unexplained. The mockup could drop it because its table named its own contents (filter */}}
{{/* chips, Kind/Architecture/State columns); the shipped one is the publish list, and does not.   */}}
{{/*                                                                                              */}}
{{/* Every clause is what restaction.blueprint-builder-deliverables computes, and no more:        */}}
{{/*  - "from the composer or through Autopilot" — at frontend >= 1.6.59 both routes publish     */}}
{{/*    through a BuilderPublish claim, whose rows the RA selects by krateo.io/builder: blueprint; */}}
{{/*  - "newest first" — the final sort;                                                          */}}
{{/*  - the three destinations — rowHref is the blueprint page once its CompositionDefinition    */}}
{{/*    exists; the install form (/marketplace/<chart>/install) when nothing is registered, the  */}}
{{/*    publish carries its registration file and the change request is merged, or closed while  */}}
{{/*    the provider cannot report a merge; else the change request's URL, else nothing (the row */}}
{{/*    stays inert — which is why the note says "while it is in review" and not "until it       */}}
{{/*    registers"). The note states the merged case; the closed-without-a-signal case is hedged */}}
{{/*    where it happens, in the row's Next step cell ("Install if merged"), rather than in prose */}}
{{/*    every reader has to parse;                                                               */}}
{{/*  - "the form that installs it" — Install is the portal's verb for creating a                 */}}
{{/*    CompositionDefinition, and the word on the form's page and button;                        */}}
{{/*  - "on the Blueprints page" — /blueprints lists the cluster's CompositionDefinitions         */}}
{{/*    (restaction.blueprints-cards), so a registered blueprint is there by construction, and   */}}
{{/*    what people do there is create compositions from it (Create, not a second Install).      */}}
{{/* The OCI chart is not mentioned: the Marketplace column shows it, and the reader's question    */}}
{{/* is where the blueprint goes, not how it is packaged (P17).                                    */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-builder-deliverables-note
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      Every blueprint published from the composer or through Autopilot, newest first. A row opens
      its change request while it is in review, the form that installs it once the change is
      merged, and the blueprint itself once it registers — from then on it is listed on the
      Blueprints page, where people create compositions from it.
  resourcesRefs:
    items: []
