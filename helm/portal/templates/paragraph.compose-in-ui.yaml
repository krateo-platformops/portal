{{/* The card's body. A Card REQUIRES items, so the copy lives in a child rather than in the
     card's own title — and this is the one place the product says what the composer is for. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compose-in-ui-body
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  resourcesRefs:
    items: []
  widgetData:
    text: >-
      Build the page here — place widgets, nest them in rows and cards, and bind a table to live
      cluster data without writing jq. Autopilot can draft one for you or answer as you go, and
      every file is reviewed before it is published as a change request.
