{{/* Convention page root for /resources/{namespace}/{group}/{version}/{plural}/{name} — the */}}
{{/* GENERIC resource-view (IA F5-full). The last-mile drill target for any Kubernetes object: */}}
{{/* composition composed-children (non-composition kinds), incident analyzedResources, etc. */}}
{{/* Header (apiVersion / Kind · name / namespace|cluster-scoped) + conditions (hidden when the */}}
{{/* kind has none) + the full object manifest. All data from restaction.resource-detail, whose */}}
{{/* scope is discovered structurally from the apiserver (namespaced vs cluster-scoped). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-resource-detail
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/nav-order": "960"
    "krateo.io/nav-path": "/resources/{namespace}/{group}/{version}/{plural}/{name}"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [namespace, group, version, plural, name]
  apiRef:
    name: resource-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - listies
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: resource-detail-page-header
    - resourceRefId: card-resource-detail-manifest
  widgetDataTemplate:
    {{/* The stuck-create block is composed ONLY when the annotation is on the object. It sits */}}
    {{/* directly under the header and above the conditions, because it is the one thing on this */}}
    {{/* page a reader can ACT on — and the condition it explains is what they came to read. */}}
    - forPath: items
      expression: >-
        ${ [ { resourceRefId: "resource-detail-page-header" } ]
        + (if (.createPending // false) then [ { resourceRefId: "resource-detail-create-pending-block" } ] else [] end)
        + (if ((.conditionsCount // 0) > 0) then [ { resourceRefId: "resource-detail-conditions" } ] else [] end)
        + [ { resourceRefId: "card-resource-detail-manifest" } ] }
  resourcesRefs:
    items:
    - id: resource-detail-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: resource-detail-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: resource-detail-conditions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: resource-detail-conditions
      namespace: {{ .Release.Namespace }}
      resource: listies
      verb: GET
    - id: resource-detail-create-pending-block
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: resource-detail-create-pending-block
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: card-resource-detail-manifest
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: card-resource-detail-manifest
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
