{{/* B4 — blueprint authoring on the PAGE, not only in the rail. */}}
{{/* The parity gate for this rule is "can a user who never opens the Autopilot rail author and */}}
{{/* publish a blueprint?". Until this card existed the answer was no: /blueprint-builder had a */}}
{{/* header, an Ask-Autopilot CTA and a read-only table. See form.author-blueprint. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: author-blueprint-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Author a blueprint
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - forms
    items:
    - resourceRefId: author-blueprint
  resourcesRefs:
    items:
    - id: author-blueprint
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: author-blueprint
      namespace: {{ .Release.Namespace }}
      resource: forms
      verb: GET
