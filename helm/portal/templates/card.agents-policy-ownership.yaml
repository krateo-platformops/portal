{{/* Frame for the ownership warning, mirroring card.agent-detail-registration / the create page's */}}
{{/* gateway card: the Alert is the page's first block and carries the one thing that is irreversible */}}
{{/* about what follows. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policy-ownership-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: borderless
    items:
    - resourceRefId: agents-policy-ownership
  resourcesRefs:
    items:
    - id: agents-policy-ownership
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-policy-ownership
      namespace: {{ .Release.Namespace }}
      resource: alerts
      verb: GET
