{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Evictions per bucket by route. `delete` is the dependency-tracker path. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-cache-evictions
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "evict_ttl_total": orange
      "evict_lru_total": gold
      "evict_delete_total": cyan
    shapeField: smooth
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: (.stat|tostring), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-cache-evictions
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
{{- end }}
