{{/* The surface the agent inventory sits on. */}}
{{/* */}}
{{/* The table had no frame: it rendered flush on the page ground while every other surface in this */}}
{{/* feature — the agent-detail panels, the policy-by-role cards, the create form — is an outlined */}}
{{/* Card. That reads as an unfinished page rather than as a deliberate difference, so the three */}}
{{/* inventory tables (here, agents-servers-list, agents-servers-bindings) each get the same frame. */}}
{{/* */}}
{{/* NO `title`. The heading and the prose that explain this table already sit directly above it in */}}
{{/* flex.agents-header (page H1 + subtitle); a Card title would print the same words a second time, */}}
{{/* four lines apart. What was missing was the SURFACE — border, panel background, radius, padding — */}}
{{/* and that is all this CR adds. It matches the mockup, where the inventory is */}}
{{/* `<div class="card"><div class="tw"><table>` with the eyebrow/h2/lede stack OUTSIDE the frame. */}}
{{/* */}}
{{/* A titleless Card with items and no cover/footer picks up Card.tsx's `statCard` class, which only */}}
{{/* tightens the body's block padding to 12px — correct for a table that supplies its own row rhythm. */}}
{{/* No `clickActionId`: the frame must stay non-interactive, because the table inside owns the click */}}
{{/* (rowNavigateTo to the per-agent page) and a clickable Card would put a second, competing hit */}}
{{/* target around every row. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-list-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: outlined
    items:
    - resourceRefId: agents-list
  resourcesRefs:
    items:
    - id: agents-list
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-list
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
