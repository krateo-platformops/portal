kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-decided-caption
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: platform-reviews
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: Decided proposals, newest first
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ (.decidedCaption // "") + " · newest first" }'
  resourcesRefs:
    items: []
