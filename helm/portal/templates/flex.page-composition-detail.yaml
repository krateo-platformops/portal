# Convention page root for /compositions/{namespace}/{name}. Matches the
# enterprise-detail mockup: a pagehead (title + status Tag + subtitle) over a
# 2-column grid (Row, 1.7fr:1fr ≈ size 15/9): left = Specification/Events/Manifest,
# right = Health/Relations/Metadata. Every field is shaped server-side by the
# composition-detail RA. Deferred: object-level live-refresh.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-composition-detail
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    vertical: true
    gap: middle
    allowedResources:
      - flexes
      - rows
      - cards
      - listies
    items:
      - resourceRefId: composition-detail-header-block
      # #6: Incidents strip — troubleshooting reports that analyzed THIS composition. Sits
      # directly under the pagehead so an active incident is visible up front. EXCEPTION-ONLY:
      # the Listy hideWhenEmpty renders nothing for a healthy composition (no incidents), and
      # the vertical Flex gap collapses around the absent child — the calm default shows no strip.
      - resourceRefId: composition-incidents
      # Rail wrapped in a full-width Row (composition-detail-rail-row) so it shares the grid's
      # gutter inset and aligns with the Spec/Health cards below (was a bare full-width card).
      - resourceRefId: composition-detail-rail-row
      # Conditions promoted to the top (full-width, under the rail) so the composition's
      # status — including the ReconcileError reason+message — is visible up front, not
      # buried in the Manifest YamlViewer further down the grid. Wrapped in a Row
      # (composition-detail-health-row) so it shares the grid gutter inset and aligns
      # with the rail above and the Spec/Relations cards below (a bare card read wider).
      - resourceRefId: composition-detail-health-row
      - resourceRefId: composition-detail-grid
  resourcesRefs:
    items:
      - id: composition-detail-header-block
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-header-block
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
      - id: composition-incidents
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-incidents
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
      - id: composition-detail-rail-row
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-rail-row
        namespace: {{ .Release.Namespace }}
        resource: rows
        verb: GET
      - id: composition-detail-health-row
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-health-row
        namespace: {{ .Release.Namespace }}
        resource: rows
        verb: GET
      - id: composition-detail-grid
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: composition-detail-grid
        namespace: {{ .Release.Namespace }}
        resource: rows
        verb: GET
