{{/* Composition events via the events-presenter (krateo-sse-proxy): the canonical */}}
{{/* krateo composition-events source (events flow k8s -> OTel -> ClickHouse -> */}}
{{/* sse-proxy), NOT raw k8s core events. */}}
{{/* */}}
{{/* This page is generic/runtime. `found` resolves THIS composition's event-collection id: */}}
{{/* its `krateo.io/composition-id` LABEL when present (installer-created children inherit the */}}
{{/* root/installer id), ELSE its own `metadata.uid` — an editor-created ROOT composition carries */}}
{{/* no such label, and the OTel `compositionresolver` processor stamps a composition's own */}}
{{/* reconcile events (involvedObject = the composition CR) with the composition's uid when it has */}}
{{/* no inherited label, so this uid fallback matches those events. */}}
{{/* That id is what the OTel→ClickHouse pipeline tags events with, and it drives the */}}
{{/* EventList SSE topic/endpoint. `getEvents` asks the presenter to filter SERVER-SIDE */}}
{{/* via ?composition_id=<this composition's own metadata.uid>. */}}
{{/* */}}
{{/* NOTE, because this comment claimed otherwise until #231: sse-proxy's composition_id */}}
{{/* predicate keys on the event's involvedObject UID. It does NOT key on */}}
{{/* LogAttributes['krateo.io/composition-id'] — even though the response PROJECTS that */}}
{{/* label as each event's `compositionId`. The filter and the projection answer different */}}
{{/* questions, so the id sent is the composition's OWN uid, never the inherited label. */}}
{{/* Scope is therefore the composition CR's own events, not its managed children's. */}}
{{/* We still guard list=[] when no id resolves, because an omitted composition_id makes */}}
{{/* the presenter return ALL events unfiltered. */}}
{{/* Path templates read extras+`.found` safely (full */}}
{{/* dict); a per-STEP filter does NOT see extras. exportJwt forwards the user's JWT */}}
{{/* (the proxy validates it only when JWT_SIGN_KEY is set). DEPENDS ON the */}}
{{/* `sse-proxy-internal-endpoint` Endpoint + the krateo-sse-proxy stack; absent it, */}}
{{/* getEvents fails gracefully (continueOnError). */}}
{{/* */}}
{{/* GOTCHA (P0, fixed): the final filter MUST be a LITERAL block (|). A folded block (>) */}}
{{/* joins same-indent lines with spaces, so a base-indent jq `#` comment swallowed the */}}
{{/* rest of the joined line — $builtin/$crdPlural and the result-object opener never */}}
{{/* reached jq, the filter never compiled, and the feed was ALWAYS empty. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: composition-events
  namespace: {{ .Release.Namespace }}
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    {{/* #72: discover composition TYPES from CompositionDefinitions under a userAccessFilter — NOT a */}}
    {{/* cluster-wide customresourcedefinitions list (which runs as the caller and 403s for a namespace- */}}
    {{/* scoped tenant → $cid never resolves → empty feed). snowplow lists CDs as its SA, then refilters */}}
    {{/* to the CDs the CALLER can list, covering every namespace the caller is granted. {plural, version} */}}
    {{/* shape unchanged (found iterates it). */}}
    - name: crds
      path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
      verb: GET
      headers:
        - 'Accept: application/json'
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: compositiondefinitions
        namespaceFrom: .metadata.namespace
      filter: "[.crds.items[]? | select(.status.resource != null and .status.apiVersion != null) | {plural: .status.resource, version: (.status.apiVersion | split(\"/\")[1])}]"
      continueOnError: true
    - name: found
      dependsOn:
        name: crds
        iterator: .crds
      {{/* #72: NAMESPACE-SCOPED to the composition's ns (?extras .namespace) — was a cluster-wide list */}}
      {{/* (no /namespaces/ segment) → 403 for a tenant. This composition is always in .namespace and the */}}
      {{/* final filter selects it by name+namespace, so scoping loses nothing and is tenant-authorizable. */}}
      path: ${ "/apis/composition.krateo.io/" + .version + "/namespaces/" + .namespace + "/" + .plural }
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      filter: "[.found.items[]? | {name: .metadata.name, namespace: .metadata.namespace, uid: .metadata.uid, compositionId: (.metadata.labels[\"krateo.io/composition-id\"] // .metadata.uid)}]"
    - name: getEvents
      endpointRef:
        name: sse-proxy-internal-endpoint
        namespace: {{ .Release.Namespace }}
      dependsOn:
        name: found
      {{/* SERVER-SIDE scoping by this composition's own uid (#231). */}}
      {{/* */}}
      {{/* WAS: a static /events?limit=200 scoped CLIENT-SIDE in the final filter. That cannot */}}
      {{/* work at scale, because 200 is not a page size — it is sse-proxy's HARD CAP */}}
      {{/* (defaultEventsLimit is both the default AND the ceiling, so asking for more does */}}
      {{/* nothing). Every composition therefore shared ONE cluster-wide window of the 200 */}}
      {{/* newest events, and whichever compositions were noisiest consumed it: 51 of 52 */}}
      {{/* rendered "No streamed events" while their events existed, just outside the window. */}}
      {{/* */}}
      {{/* WHY THE UID AND NOT THE `krateo.io/composition-id` LABEL: sse-proxy's composition_id */}}
      {{/* predicate keys on the event's involvedObject UID, NOT on that label. Passing the */}}
      {{/* inherited label would ask for the installer ROOT's events and hand the same feed to */}}
      {{/* every child. Measured on a live cluster: the composition's own uid returned 382 / */}}
      {{/* 178 / 41 events for three compositions where the label returned 0. */}}
      {{/* */}}
      {{/* WHY NOT involvedObject name+namespace, which extras already carry: it conflates. For */}}
      {{/* one composition that matched 809 events across THREE uids — two of them deleted */}}
      {{/* predecessors of the same name — plus 10 belonging to a CompositionDefinition that */}}
      {{/* merely shares the name. The uid is exact. */}}
      {{/* */}}
      {{/* FAIL-SAFE: when the uid does not resolve the param is OMITTED, never sent empty or */}}
      {{/* malformed, so the request degrades to exactly the previous behaviour. It must never */}}
      {{/* go out non-empty and non-UUID: sse-proxy 400s that, and this stage's continueOnError */}}
      {{/* would turn the 400 into an EMPTY feed for everyone — worse than the bug being fixed. */}}
      {{/* SHAPE-AGNOSTIC BY CONSTRUCTION: `.. | objects` walks whatever `.found` turns out to */}}
      {{/* be — the expected list of projections, a dict wrapping `items`, or nested arrays — */}}
      {{/* instead of indexing a shape this template only assumes. That is not defensive */}}
      {{/* padding: a jq ERROR here fails the stage, continueOnError swallows it, and the feed */}}
      {{/* goes empty for EVERY composition. Degrading to the unfiltered path is recoverable; */}}
      {{/* erroring is not. Every branch was exercised against 13 input shapes. */}}
      path: ${ .name as $n | .namespace as $ns | ([(.found // empty) | .. | objects | select(.name? == $n and .namespace? == $ns)] | first | (.uid? // "") | tostring) as $uid | "/events?limit=200" + (if ($uid | test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$")) then "&composition_id=" + $uid else "" end) }
      verb: GET
      headers:
        - 'Accept: application/json'
      exportJwt: true
      continueOnError: true
    {{/* IA F7: kind→plural discovery for per-event deep-links. The involvedObject in an */}}
    {{/* event carries {apiVersion, kind, name, namespace} but NOT the plural, and a */}}
    {{/* lowercase(kind)+"s" guess is WRONG for many kinds — so resolve the plural from */}}
    {{/* the REAL CRD registry (status.acceptedNames.plural, keyed by group+kind). Built-in */}}
    {{/* core/apps/batch kinds (no CRD) are covered by a small static k8s-scoping map in the */}}
    {{/* final filter. Any involvedObject we still can't resolve gets route "" → inert. */}}
    {{/* #72: this stays a cluster-wide customresourcedefinitions list ON PURPOSE — it only ENRICHES */}}
    {{/* event deep-links (plural resolution for arbitrary CRD kinds), and it already degrades gracefully */}}
    {{/* (continueOnError). For a namespace-scoped tenant it 403s → $crdPlural empty → third-party-CRD */}}
    {{/* deep-links go inert, but the events themselves still render (built-in kinds resolve via $builtin, */}}
    {{/* and composition-kind involvedObjects route to /compositions/ directly, needing no plural). A CD */}}
    {{/* list can't replace it (CDs only cover composition kinds, which don't need it), and it must not */}}
    {{/* gate the feed — the tenant-blocking discovery was `crds`/`found` above, now fixed. */}}
    - name: allcrds
      path: /apis/apiextensions.k8s.io/v1/customresourcedefinitions
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      filter: '[.allcrds.items[]? | {group: .spec.group, kind: .status.acceptedNames.kind, plural: .status.acceptedNames.plural}]'
  filter: |
    (.name) as $n
    | (.namespace) as $ns
    | ([ .found[]? | select(.name == $n and .namespace == $ns) ][0].compositionId // "") as $cid
    | ( .getEvents | if type == "array" then . elif type == "object" then (.resources // .items // []) else [] end ) as $all
    # IA F7: (group,kind)->plural resolver. Built-in kinds (no CRD) from a small static
    # k8s-scoping map ($builtin); every CRD kind from the REAL CRD registry (.allcrds).
    # Never a lowercase(kind)+"s" guess.
    | ({"core|Pod":"pods","core|Service":"services","core|ConfigMap":"configmaps","core|Secret":"secrets","core|PersistentVolumeClaim":"persistentvolumeclaims","core|ServiceAccount":"serviceaccounts","core|Endpoints":"endpoints","core|Namespace":"namespaces","core|Node":"nodes","apps|Deployment":"deployments","apps|ReplicaSet":"replicasets","apps|StatefulSet":"statefulsets","apps|DaemonSet":"daemonsets","batch|Job":"jobs","batch|CronJob":"cronjobs","networking.k8s.io|Ingress":"ingresses","rbac.authorization.k8s.io|Role":"roles","rbac.authorization.k8s.io|RoleBinding":"rolebindings","rbac.authorization.k8s.io|ClusterRole":"clusterroles","rbac.authorization.k8s.io|ClusterRoleBinding":"clusterrolebindings"}) as $builtin
    | ( [ (.allcrds // [])[] | { key: (.group + "|" + .kind), value: .plural } ] | from_entries ) as $crdPlural
    | {
        list: (if $cid == "" then []
               else ( [ $all[]?
                        | select((.compositionId // "") == $cid)
                        # Resolve the involvedObject's /resources deep-link (route) BEFORE
                        # reshaping. apiVersion → group/version (1 part ⇒ core group). plural
                        # from $builtin (core/apps/batch/...) or the real CRD registry; unknown
                        # ⇒ route "" (inert, nothing fabricated). ns from involvedObject.
                        | ((.involvedObject.apiVersion // "") | split("/")) as $gv
                        | (if ($gv | length) > 1 then $gv[0] else "core" end) as $grp
                        | (if ($gv | length) > 1 then $gv[1] else ($gv[0] // "v1") end) as $ver
                        | (.involvedObject.kind // "") as $ik
                        | ($builtin[$grp + "|" + $ik] // $crdPlural[$grp + "|" + $ik] // "") as $plural
                        | (.involvedObject.namespace // "") as $ins
                        | (.involvedObject.name // "") as $inm
                        # composition.krateo.io involved objects ARE compositions → drill into
                        # the first-class /compositions detail (mirrors composition-resources'
                        # navHref rule); every other kind → the generic /resources view.
                        | (if ($grp == "composition.krateo.io" and $inm != "" and $ins != "")
                           then ("/compositions/" + $ins + "/" + $inm)
                           elif ($plural != "" and $inm != "")
                           then ("/resources/" + (if $ins == "" then "cluster" else $ins end) + "/" + $grp + "/" + $ver + "/" + $plural + "/" + $inm)
                           else "" end) as $route
                        # conform to the EventList schema (type is enum Normal|Warning,
                        # required metadata/involvedObject/reason/message/type/source);
                        # `route` is an accepted extra field (mirrors the dashboard events RA).
                        | { metadata: (.metadata // {}),
                            involvedObject: (.involvedObject // {}),
                            reason: (.reason // ""),
                            message: (.message // ""),
                            type: (if (.type // "") == "Warning" then "Warning" else "Normal" end),
                            source: (.source // {}),
                            firstTimestamp: (.firstTimestamp // .eventTime),
                            lastTimestamp: (.lastTimestamp // .eventTime),
                            eventTime: (.eventTime),
                            route: $route } ]
                      | .[0:20] )
               end),
        compositionId: $cid,
        # Echo the target back (compositions-list idiom) so the events widget can build its
        # honest empty-state text ("check kubectl events -n <ns>") server-side.
        name: $n,
        namespace: $ns
      }
