{{/* "Unowned drafts" rows — the page previews from before drafts had owners (restaction.unowned-drafts). */}}
{{/* A Listy for the reason list.my-drafts is one: each row carries its own Adopt and Discard. */}}
{{/* */}}
{{/* NO ROW CLICK. Adopting makes a draft yours, which is a choice its own button asks for by name; */}}
{{/* a stray click on a list of other people's leftovers must not do it. */}}
{{/* */}}
{{/* BOTH ACTIONS ARE ROUTES INTO THE PAGE COMPOSER, and Discard being one is deliberate. A legacy */}}
{{/* set is its root plus the children the root names, of varying number and kind (PageHeaders, */}}
{{/* Rows, Cards, Tables, RESTActions). A rest action cannot say "every ref this row names": `ops` */}}
{{/* is a fixed list of refs, and `fanOutPath` fans ONE ref over an array. Deleting the root alone */}}
{{/* would orphan the rest. The composer reads the set, asks through the standard confirm, and */}}
{{/* deletes all of it, as the person. So this list writes nothing itself and carries no refs. */}}
{{/* */}}
{{/* rowActionsDisplay: buttons, Adopt first (primary) — the mockup's order. Discard is a neutral */}}
{{/* button, not `danger`: the composer's confirm, which lists the whole set, is what guards it. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: unowned-drafts
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: unowned-drafts
    namespace: {{ .Release.Namespace }}
  widgetData:
    dataSource: []
    pagination:
      pageSize: 10
    itemTemplate:
      primaryText: '{slug}'
      subPrimaryText: '{widgetsLabel}'
      subSecondaryText: '{created}'
      formats:
        subSecondaryText: datetime
      rowActionsDisplay: buttons
      rowActions:
        - actionId: adopt
          label: Adopt
          icon: fa-hand-holding
        - actionId: discard
          label: Discard
          icon: fa-trash
    actions:
      navigate:
        {{/* The page composer (frontend RoutesContext) with the root's name. ?adopt= turns the */}}
        {{/* set into a record of the person's own and resumes it; ?discard-legacy= reads the set */}}
        {{/* and deletes the root and every child it names, behind the standard confirm. */}}
        - id: adopt
          type: navigate
          path: /portal-builder/compose?adopt=${rootName}
        - id: discard
          type: navigate
          path: /portal-builder/compose?discard-legacy=${rootName}
  widgetDataTemplate:
    - forPath: dataSource
      expression: >
        ${ [ (.items // [])[]
            | { rootName, slug, created,
                widgetsLabel: ("\(.widgets // 0) widget" + (if (.widgets // 0) == 1 then "" else "s" end)) } ] }
  resourcesRefs:
    items: []
