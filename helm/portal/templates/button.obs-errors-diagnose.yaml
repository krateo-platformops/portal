{{/* "Diagnose with Autopilot" — on-demand RCA of the most frequent errors, WITHOUT an incident. */}}
{{/* Navigates to /incidents with an ?ask seed the AutopilotProvider consumes on mount (opens the */}}
{{/* rail pre-seeded to root-cause the top recurring errors and propose recovery steps). The concrete */}}
{{/* href is baked server-side by obs-error-log-digest (.diagnoseHref, @uri-encoded once), so the */}}
{{/* click is a plain literal navigate — the SAME pattern as alert-detail-investigate. Defensive */}}
{{/* fallback to bare /incidents (never a 404) when diagnoseHref is empty. Hosted in the "Top */}}
{{/* recurring errors" card ONLY when there are errors (obs-errors-card gates it on .hasErrors). */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-errors-diagnose
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "20"
spec:
  {{/* Same cache partition as the digest/card — the seed depends on the ?range= window. */}}
  keyExtras: [range]
  apiRef:
    name: obs-error-log-digest
    namespace: {{ .Release.Namespace }}
  widgetData:
    {{/* A4: ONE canonical label for the Autopilot entry point. Six CTAs carried three strings */}}
    {{/* ("Ask Autopilot →", "Investigate with Autopilot", "Diagnose with Autopilot") for the */}}
    {{/* same mechanism — a Button navigating to ?ask=<prompt>. "Ask Autopilot" describes what */}}
    {{/* the BUTTON does; the other two described what the page was about, which is the page's */}}
    {{/* job, not the label's. */}}
    {{/* A4: every agent entry point is the same object — a button labelled "Ask Agentiko →" with */}}
    {{/* `intent: autopilot`. The intent draws it filled with the Agentiko gradient and mark and */}}
    {{/* ignores type/icon/color, so those are not set here. (Until 2026-11-06: "Ask Autopilot →", */}}
    {{/* type: primary and the wand icon, spelled out per CR.) The arrow says the button takes you */}}
    {{/* into the agent rail. Enforced by the design lint (autopilot-button). */}}
    label: Ask Agentiko →
    intent: autopilot
    size: middle
    clickActionId: diagnose
    actions:
      navigate:
        - id: diagnose
          type: navigate
          path: /incidents
  widgetDataTemplate:
    {{/* Server-built /incidents?ask= seed (the top errors). Fallback to bare /incidents if empty. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "diagnose", type: "navigate", path: (if (.diagnoseHref // "") != "" then .diagnoseHref else "/incidents" end) } ] } }'
  resourcesRefs:
    items: []
