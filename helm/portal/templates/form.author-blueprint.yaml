{{/* Blueprint Builder — author a blueprint chart BY HAND and publish it (B4). */}}
{{/* */}}
{{/* This closes the last real UI-parity gap. /blueprint-builder shipped a header, an */}}
{{/* "Ask Autopilot" CTA and a read-only deliverables table: a blueprint is a chart TREE, the */}}
{{/* BuilderPublish claim takes `files` as an array of {path, content}, and SchemaFields renders */}}
{{/* an array only as an enum multi-select — so an array of objects has no control at all and */}}
{{/* only the agent could produce one. A user who never opened the rail could install blueprints */}}
{{/* but never author one. */}}
{{/* */}}
{{/* The fix is server-side, not a new widget kind: builder-publish also accepts `filesBundle`, */}}
{{/* a MAP of in-repo path to file contents, and emits the identical LocalResource set. A map */}}
{{/* because that is exactly what an existing widget produces — SchemaFields gives a */}}
{{/* property-less `type: object` a JSON textarea (JsonValueInput) that submits a real object. */}}
{{/* A `type: string` would render a single-line Input, which is useless for a chart tree. */}}
{{/* */}}
{{/* Deliberately NOT agent-submittable. The agent may draft into this form (prefillForm marks */}}
{{/* the fields it filled), and a human presses Publish. See design/07-ui-parity-programme.md. */}}
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: author-blueprint
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Same RA as compose-page: it resolves the BuilderPublish GVR at serve time, so the form
       does not hardcode a served version that a composition bump would invalidate. */}}
  apiRef:
    name: page-composable
    namespace: {{ .Release.Namespace }}
  widgetData:
    layout: vertical
    {{/* The review step is the point of this form, not a nicety: it is where a human sees what
         is about to be committed, and where Autopilot-drafted fields are tagged as such. */}}
    reviewBeforeSubmit: true
    submitActionId: submit
    schema: {}
    buttonConfig:
      primary:
        label: Publish blueprint
      secondary:
        label: Cancel
        navigateTo: /blueprint-builder
    actions:
      rest:
        - id: submit
          type: rest
          resourceRefId: create-builder-publish
          headers:
            - 'Content-Type: application/json'
          successMessage: Blueprint published — a change request is open
          payloadToOverride:
            - { name: metadata.name,      value: '${ "blueprint-" + .json.__name__ }' }
            - { name: metadata.namespace, value: '{{ .Release.Namespace }}' }
            - name: spec
              {{/* filesBundle goes through verbatim — the composition splits it into one
                   LocalResource per entry, ordered by path. Nothing is re-serialised here, so
                   what the author typed is what gets committed. */}}
              value: >
                ${ .json as $f
                 | { name: ("blueprint-" + $f.__name__),
                     builder: "blueprint",
                     branch: ($f.__target_branch__ // ("builder/" + $f.__name__)),
                     target: { namespace: $f.__target_org__,
                               repo: ($f.__target_repo__ // $f.__name__),
                               base: ($f.__target_base__ // "main") },
                     filesBundle: $f.filesBundle }
                 {{/* `source` is OMITTED rather than sent empty, exactly as in compose-page: a
                      null fails the CRD (the property is type: object) and an empty url renders a
                      Repo CR pointing nowhere. Merged in only when a template URL was typed. */}}
                 | . + (if (($f.__source_url__ // "") | length) > 0
                        then { source: ({ url: $f.__source_url__,
                                          branch: ($f.__source_branch__ // "main") }
                                        + (if (($f.__source_path__ // "") | length) > 0
                                           then { path: $f.__source_path__ } else {} end)) }
                        else {} end) }
  widgetDataTemplate:
    - forPath: schema
      expression: >
        ${ { type: "object",
             required: ["__name__","filesBundle","__target_org__"],
             properties: {
               __name__: { type: "string", title: "Blueprint name",
                           description: "Lower-case, dashes. Becomes the chart name and, by default, the repository and branch.",
                           pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" },
               filesBundle: { type: "object", title: "Chart files",
                              description: "The chart tree as a JSON object: each key is an in-repo path, each value is that file's exact contents. e.g. {\"Chart.yaml\": \"apiVersion: v2\\nname: my-blueprint\\nversion: 0.1.0\\n\"}. Committed verbatim, one file per entry." },
               __target_org__:    { type: "string", title: "Target org",
                                    description: "GitHub org (GitLab group, Bitbucket workspace) the change request is opened in.",
                                    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" },
               __target_repo__:   { type: "string", title: "Target repository",
                                    description: "Defaults to the blueprint name. Created automatically if it does not exist yet.",
                                    pattern: "^$|^[A-Za-z0-9][A-Za-z0-9._-]*$" },
               __target_base__:   { type: "string", title: "Base branch",
                                    description: "The branch the change request is cut from. Defaults to main." },
               __target_branch__: { type: "string", title: "Branch to commit onto",
                                    description: "Defaults to builder/<name>." },
               __source_url__:    { type: "string", title: "Scaffold from (optional)",
                                    description: "Clone URL of a template repository to seed the target from BEFORE the chart is committed. Leave empty unless the repository does not exist yet and you want it scaffolded.",
                                    pattern: "^$|^https?://.+" },
               __source_branch__: { type: "string", title: "Template branch",
                                    description: "Branch in the template repository to copy from. Defaults to main. Ignored when no template is given." },
               __source_path__:   { type: "string", title: "Template subdirectory",
                                    description: "Copy only this subdirectory of the template. Empty copies the whole repository. Ignored when no template is given." } } } }
    - forPath: initialValues
      {{/* Prefilled from the install's configured blueprint repo, but EDITABLE — the destination
           is a per-publish decision. The org prefills; the repo deliberately does not, because it
           defaults to the blueprint's own name (each blueprint gets its own repository). */}}
      expression: >
        ${ { __target_org__:  "{{ (splitList "/" (((.Values.blueprintBuilder | default dict).repo) | default "krateo-blueprints/blueprints")) | first }}",
             __target_base__: "main" } }
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: create-builder-publish
        apiVersion: '${ .bpApiVersion }'
        resource: '${ .bpResource }'
        namespace: {{ .Release.Namespace }}
        verb: POST
