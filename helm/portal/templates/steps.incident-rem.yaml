{{/* HOW TO FIX — the incident's three scripts (status.howToFix) as antd Steps: precondition, */}}
{{/* apply, verify. Each step carries its last run from status.checks (subTitle) and a status: */}}
{{/* · precondition / verify: finish on exit 0, error on exit 1 (or a flagged precondition), */}}
{{/*   process while it is the running check, wait otherwise; */}}
{{/* · apply: process while the incident is Open (a human's turn), finish once applied. */}}
{{/* Every step embeds its Flex (the script, copyable; only apply adds "I applied it"). */}}
kind: Steps
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-rem-widget
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    orientation: vertical
    size: small
    current: 0
    items: []
  widgetDataTemplate:
    - forPath: current
      expression: '${ .fixCurrent // 0 }'
    - forPath: items
      expression: '${ .fixStepsForWidget // [] }'
  resourcesRefs:
    items:
    {{- range $i := until 3 }}
    - id: incident-rem-step-{{ $i }}
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-rem-step-{{ $i }}
      namespace: {{ $.Release.Namespace }}
      resource: flexes
      verb: GET
    {{- end }}
