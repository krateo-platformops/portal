{{/* Two columns from lg up (why, evidence and facts; the change), one column below it. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-proposal-body
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  widgetData:
    alignment: top
    allowedResources:
    - cols
    - cards
    items:
    - resourceRefId: review-proposal-left
      xs: 24
      lg: 12
    - resourceRefId: review-proposal-change
      xs: 24
      lg: 12
  resourcesRefs:
    items:
    - id: review-proposal-left
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: review-proposal-left
      namespace: {{ .Release.Namespace }}
      resource: cols
      verb: GET
    - id: review-proposal-change
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: review-proposal-change
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
