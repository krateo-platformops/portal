# Convention page root for /agents — the agent control plane.
#
# Reached from the sidebar via `resourceRefId: agents` in menu.sidebar-nav, whose resourcesRefs
# entry carries this admin-tier namespace explicitly. That indirection is what makes the entry
# RBAC-aware (snowplow resolves it as the caller, so the nav item disappears for a user who cannot
# GET this Flex) and it is also why this root can live in the tier namespace at all — the bare
# `page:` convention would look for it in the frontend's configured namespace and 404.
#
# Pagehead + the agent inventory table.
#
# THE "New agent" CTA IS NOW ON. It was withheld while the route did not exist: a Button navigating
# to an unrouted path falls through to the shell catch-all (RoutesContext.tsx `{ element:
# <WidgetPage />, path: '*' }`) and WidgetPage renders <Page404/>, so advertising it then would have
# shipped a primary call-to-action that dead-ends — and neither guard catches that (mockup-diff.mjs
# only flags an empty `actions`, lint-keyextras only covers parameterized routes). Both halves are
# in place now: menu.sidebar-nav carries `{ order: 936, path: "/agents/new", page: agent-create }`,
# and page-agent-create was moved to {{ `{{ .Release.Namespace }}` }} so that `page:` convention
# actually resolves it (Menu.tsx passes config.params.FRONTEND_NAMESPACE into buildNavModel, so
# `page: <slug>` looks for flexes/page-<slug> THERE, never in this admin-tier namespace — see the
# header of flex.page-agent-create). Without that move the CTA would 404 on any install that sets
# .Values.tiers.admin, which is the tiered-RBAC layout the tier helper exists for.
#
# WHY THE CTA MATTERS MORE THAN IT LOOKS: until now /agents/new was reachable by URL only. A create
# surface with no entry point anywhere in the product is, in practice, a surface that does not
# exist — the audit found it by reading the chart, not by using the portal.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-agents
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - cards
    - flexes
    - tables
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-header
    # Right-aligned "New agent" → /agents/new. A Flex, not the Button directly: `buttons` is not in
    # this page's allowedResources and Buttons carry no self-alignment field.
    - resourceRefId: agents-new-cta
    # The inventory table, inside its frame (card.agents-list) — the page composes the CARD, and
    # the Card carries its own resourcesRefs entry for the table, so the table is resolved one
    # level down rather than here. `cards` had to join allowedResources for that: the Flex enum is
    # a hard CRD enum with no preserve-unknown-fields, so an unlisted plural is rejected at APPLY
    # time, not at render. `tables` stays listed because this page still composes the Tool servers
    # section, whose own subtree holds two.
    - resourceRefId: agents-list-card
    - resourceRefId: agents-topology
    - resourceRefId: agents-servers
  resourcesRefs:
    items:
    - id: agents-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-header
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: agents-new-cta
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-new-cta
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: agents-list-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-list-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    # The gateway-topology section (flex.agents-topology) — the picture the table cannot draw: the
    # 15 agents, the one gateway every one of their hops crosses, and the backends behind it. Sits
    # between the inventory and the tool-server tables because it is what makes both legible. Like
    # agents-servers it is a `flexes` child, so this page's allowedResources needs nothing new — the
    # FlowChart is nested one level down, inside flex.agents-topology, which declares `flowcharts`.
    - id: agents-topology
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-topology
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    # The Tool servers section (flex.agents-servers) — a SECTION of this page, not a route of its
    # own: it answers the question the table above raises ("5 tools across 2 servers — which ones,
    # and who else can reach them?") off the same kagent.dev kinds. `flexes` is already in this
    # page's allowedResources, so composing it needs nothing else.
    - id: agents-servers
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
