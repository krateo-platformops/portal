{{- if (.Values.observability | default dict).snowplowSli }}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-card-dep-health
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Dep-tracker health
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - flexes
    items:
    - resourceRefId: sp-dep-health-group
  resourcesRefs:
    items:
      - id: sp-dep-health-group
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-dep-health-group
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
{{- end }}
