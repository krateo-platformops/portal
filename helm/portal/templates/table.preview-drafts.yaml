{{/* The in-flight previews table. Row click resumes the draft — see restaction.preview-drafts. */}}
{{/* Every {placeholder} in rowNavigateTo resolves to a cell on the row (design-lint P10): `slug`. */}}
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Table
metadata:
  name: preview-drafts
  namespace: {{ .Release.Namespace }}
spec:
  apiRef:
    name: preview-drafts
    namespace: {{ .Release.Namespace }}
  widgetData:
    {{/* NO title, description OR prefix HERE, and their absence is the fix rather than a loss. */}}
    {{/* The Table CRD declares ten widgetData properties — allowedResources, bordered, columns, */}}
    {{/* dataSource, fitContent, pagination, prefix, rowNavigateTo, size, watch — with no */}}
    {{/* preserve-unknown, so `title` and `description` were PRUNED by the apiserver and never */}}
    {{/* reached a browser. The section rendered as a bare grid reading "proof-a 3 4h": telemetry, */}}
    {{/* to anyone who had not written it. They live in card.your-drafts now, where they render. */}}
    {{/*                                                                                          */}}
    {{/* `prefix` was not a label either: Table passes it to getFilteredData, which looks for a */}}
    {{/* registered Filters widget named "IN PROGRESS", finds none, and returns the rows */}}
    {{/* unchanged. Inert, and it read like a heading in the source. */}}
    allowedResources: []
    {{/* NO rowNavigateTo. It pointed at ?resume={slug}, and nothing consumes that param — */}}
    {{/* resumePreviewDraft.ts is imported by no one, so the click navigated the page to itself */}}
    {{/* and opened nothing. Even wired, the destination was wrong twice: on this route the */}}
    {{/* payload opens the Autopilot drawer rather than the composer, and it carries no `files`, */}}
    {{/* so a resumed draft would render live and be uneditable and unpublishable. A row that */}}
    {{/* silently does nothing is worse than a row that is plainly a list; the Card says so. */}}
    columns:
      - valueKey: slug
        title: Page
      - valueKey: widgets
        title: Widgets
      - valueKey: created
        title: Last previewed
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ [ (.items // [])[] | [ {valueKey:"slug",kind:"jsonSchemaType",type:"string",stringValue:(.slug // "")}, {valueKey:"widgets",kind:"jsonSchemaType",type:"string",stringValue:((.widgets // 0) | tostring)}, {valueKey:"created",kind:"jsonSchemaType",type:"string",stringValue:(.created // ""),format:"relative"} ] ] }'
  resourcesRefs:
    items: []
