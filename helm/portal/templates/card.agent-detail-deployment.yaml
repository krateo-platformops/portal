# "Deployment" — the only card on this page that reads a DIFFERENT object. Everything above it is
# the Agent CR: what someone asked for. This is the workload the kagent controller rendered from it:
# what is actually running. The two disagree often enough to be worth showing side by side — a CR
# edited a minute ago, a pod that never rolled, an env var the controller dropped.
#
# IT IS RENDERED WHENEVER THE AGENT RESOLVED, not when the Deployment read succeeded. Gating it on
# the read would make a denied `list deployments` look exactly like an agent that runs no pod, which
# is the one confusion this page's whole error discipline exists to prevent. So the card is present
# and the Workload row says which of the three it is: routed to a real Deployment with its ready
# count, no Deployment matched, or the read itself failed with the reason quoted.
#
# The env table is dropped when there is nothing to put in it (an agent that declares no
# deployment.env of its own — four of the fifteen here). The caption still states that absence, so
# the missing table never reads as a missing read.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-agent-detail-deployment
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): the route params this widget's resolution varies by.
  keyExtras: [name, namespace]
  apiRef:
    name: agent-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Deployment
    titleVariant: eyebrow
    variant: outlined
    headerLeft: The workload this Agent renders into, and the environment it runs with.
    items:
    - resourceRefId: descriptions-agent-detail-deployment
    - resourceRefId: agent-detail-env
  widgetDataTemplate:
  - forPath: headerLeft
    expression: '${ .deployment.envCaption // "" }'
  - forPath: items
    expression: '${ [ { resourceRefId: "descriptions-agent-detail-deployment" } ] + (if ((.envRows // []) | length) == 0 then [] else [ { resourceRefId: "agent-detail-env" } ] end) }'
  resourcesRefs:
    items:
    - id: descriptions-agent-detail-deployment
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: descriptions-agent-detail-deployment
      namespace: {{ .Release.Namespace }}
      resource: descriptions
      verb: GET
    - id: agent-detail-env
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agent-detail-env
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
