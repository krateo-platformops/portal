{{/* The change-request note on /marketplace/{name}/install, for a chart that came from a builder */}}
{{/* publish: "Published by <PR url>, …" and what the provider knows about how it ended. The text */}}
{{/* is assembled by restaction.blueprint-install-origin; a Paragraph linkifies the url, so the */}}
{{/* person can open the PR from the page where they decide whether to install. For a builder */}}
{{/* publish that shares a marketplace name it says instead that this form installs the */}}
{{/* marketplace chart. The page root composes this only when the text is not empty, so an index */}}
{{/* chart's page is unchanged. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-install-origin
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  apiRef:
    name: blueprint-install-origin
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: ''
  widgetDataTemplate:
    - forPath: text
      expression: '${ .note // "" }'
  resourcesRefs:
    items: []
