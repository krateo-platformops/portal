# The mockup's "+ Add policy" control, on the policies page header.
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policy-new
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    label: Add policy
    icon: fa-plus
    type: primary
    size: middle
    clickActionId: new-policy
    actions:
      navigate:
        - id: new-policy
          type: navigate
          path: /agents/policies/new
  resourcesRefs:
    items: []
