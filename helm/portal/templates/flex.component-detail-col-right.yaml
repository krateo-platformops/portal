# Right column (narrower): Overview only. #88 (fedepini): Conditions moved to the left column.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: component-detail-col-right
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name]
  widgetData:
    vertical: true
    gap: small
    allowedResources:
      - cards
    items:
      - resourceRefId: card-component-detail-overview
  resourcesRefs:
    items:
      - id: card-component-detail-overview
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-component-detail-overview
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
