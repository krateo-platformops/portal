{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Refresh outcomes per bucket. `dropped` is the deterministic-failure path that leaves a stale entry resident. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-refresher-outcomes
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "completed": green
      "failed": red
      "dropped": orange
      "retried": gold
      "skipped_stage_error": magenta
    shapeField: smooth
    area: false
    legend: true
    height: 180
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: (.stat|tostring), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-refresher-outcomes
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
{{- end }}
