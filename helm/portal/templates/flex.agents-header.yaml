# /agents page head — eyebrow + title + subtitle stack (sibling of alerts-header).
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - paragraphs
    vertical: true
    items:
    - resourceRefId: agents-eyebrow
    - resourceRefId: agents-title
    - resourceRefId: agents-subtitle
  resourcesRefs:
    items:
    {{- range (list "agents-eyebrow" "agents-title" "agents-subtitle") }}
    - id: {{ . }}
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: {{ . }}
      namespace: {{ $.Release.Namespace }}
      resource: paragraphs
      verb: GET
    {{- end }}
