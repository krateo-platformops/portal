# Title stack for the Access persona page (W3-2) — persona-name H1 + the
# checked-as honesty line (mirrors the composition-detail title stack). #88 §0.5:
# the "Settings · Access" eyebrow is gone — the breadcrumb above already carries
# that same information, so it was a second, redundant eyebrow line.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: access-detail-title-stack
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [username]
  widgetData:
    allowedResources:
    - paragraphs
    vertical: true
    items:
    - resourceRefId: access-detail-title
    - resourceRefId: access-checked-as
  resourcesRefs:
    items:
    - id: access-detail-title
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: access-detail-title
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    - id: access-checked-as
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: access-checked-as
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
