{{/* Close: sets spec.closed on the Incident (a merge-patch with the user's token). The controller */}}
{{/* then moves it to Closed from any state, even while its scripts say it still holds. Closing */}}
{{/* cannot be undone (the CRD rejects unsetting it), so the click asks for confirmation. The action */}}
{{/* Flex hides this button once the incident is Closed. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-close
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    label: Close
    icon: fa-circle-xmark
    type: default
    size: middle
    clickActionId: close
    actions:
      rest:
        - id: close
          type: rest
          resourceRefId: close-incident
          headers:
            - 'Content-Type: application/merge-patch+json'
          payload:
            spec:
              closed: true
          requireConfirmation: true
          successMessage: Incident closed
          loading:
            display: true
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: close-incident
        apiVersion: ${ .incidentGvr.apiVersion }
        resource: ${ .incidentGvr.resource }
        name: ${ .incidentGvr.name }
        namespace: ${ .incidentGvr.namespace }
        verb: PATCH
