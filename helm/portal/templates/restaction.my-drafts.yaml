{{/* YOUR DRAFTS — the draft records the caller owns, for "Your drafts" on every builder page. */}}
{{/* */}}
{{/* A draft record is ONE ConfigMap per person and draft in the preview sandbox, */}}
{{/* draft-<kind>-<owner>-<slug>, holding the whole held tree in data["draft.json"]. The composer */}}
{{/* writes it as the person edits, so a closed tab or a crash loses nothing; the record IS the */}}
{{/* draft, and every preview object is derived from it. The contract is the frontend's */}}
{{/* ui/src/components/Autopilot/draftRecord.ts — labels, annotations and the owner sanitizer here */}}
{{/* are its, character for character. */}}
{{/* */}}
{{/* THE OWNER IS THE CALLER, AND ONLY THE SERVER SAYS WHO THAT IS. The widgets that read this */}}
{{/* declare identityContext: [username], so snowplow injects the authenticated principal as */}}
{{/* .username (injection wins over any ?extras.username a client sends) and folds it into the */}}
{{/* cache key, so two people on the same page never share a cell. There is no owner parameter: a */}}
{{/* query param would let anyone list anyone's drafts by typing a name. $owner is draftOwner() in */}}
{{/* jq — lower case, each run of anything but [a-z0-9-] one "-", trimmed, 40 characters, then */}}
{{/* "unknown" — so the listing matches exactly the label the browser wrote. */}}
{{/* */}}
{{/* "unknown" IS NOBODY. It is the owner of drafts from before records had owners, and of a */}}
{{/* username the sanitizer empties. Those belong in "Unowned drafts" (restaction.unowned-drafts), */}}
{{/* where a person chooses to adopt one — never silently in whoever's name sanitizes to it. */}}
{{/* */}}
{{/* NULL-SAFE BY CONSTRUCTION. The background prewarm resolves every widget with no identity and */}}
{{/* no extras; that must be an empty list, never a jq error on every widget that reads this (the */}}
{{/* marketplace-detail and blueprint-formdef fixes were the same lesson). So: no username → no rows. */}}
{{/* */}}
{{/* The label selector is applied in jq, not as ?labelSelector=: snowplow's list dispatch does not */}}
{{/* guarantee query-param passthrough (see restaction.component-detail). continueOnError so a */}}
{{/* sandbox that is absent, or that this person may not read, is an empty list rather than an */}}
{{/* errored page. */}}
{{/* */}}
{{/* draft.json is parsed only for three scalars (the publish link, the thread, the file count) and */}}
{{/* the chart version; the body itself — up to 512 KiB of tree — is never returned. `kind` in */}}
{{/* extras narrows to one kind; each page's widgets also select their own. */}}
{{/* */}}
{{/* WHICH KINDS ARE RECORDS, AND WHERE EACH RESUMES, is portal.draftBuilders (_builder.tpl), not */}}
{{/* this filter: a record whose kind no builder declares is not listed (nothing could resume it), */}}
{{/* and Resume opens <route>/compose?resume=<record> for the kind that wrote it. */}}
{{- $routes := dict }}
{{- range $kind, $b := include "portal.draftBuilders" . | fromYaml }}
{{- $_ := set $routes $kind $b.route }}
{{- end }}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: my-drafts
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: records
      path: /api/v1/namespaces/{{ .Values.previewSandbox.namespace }}/configmaps
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: recordsError
  filter: >
    ({{ toJson $routes }}) as $routes
    | ((.username // "") | if type == "string" then . else "" end) as $username
    | ($username | ascii_downcase | gsub("[^a-z0-9-]+"; "-") | gsub("^-+|-+$"; "") | .[0:40] | gsub("-+$"; "")
       | if . == "" then "unknown" else . end) as $owner
    | ((.kind // "") | if type == "string" then . else "" end) as $kind
    | { owner: (if $username == "" then "" else $owner end),
        items: (if $username == "" or $owner == "unknown" then [] else
          [ ((.records.items // [])[]
            | select((.metadata.labels["krateo.io/purpose"] // "") == "draft-record")
            | select((.metadata.labels["krateo.io/draft-owner"] // "") == $owner)
            | select($kind == "" or (.metadata.labels["krateo.io/draft-kind"] // "") == $kind)
            | ((.data["draft.json"] // "") | (try fromjson catch {}) | if type == "object" then . else {} end) as $body
            | ((.metadata.labels["krateo.io/draft-kind"] // $body.kind // "") | tostring) as $recordKind
            | ((.metadata.labels["krateo.io/draft-state"] // $body.state // "open") | tostring) as $state
            | (($body.publish // {}) | if type == "object" then . else {} end) as $publish
            | (($body.files // {}) | if type == "object" then . else {} end) as $files
            | select(($routes[$recordKind] // "") != "")
            | { recordName: (.metadata.name // ""),
                kind: $recordKind,
                name: ((.metadata.annotations["krateo.io/draft-name"] // $body.name // .metadata.name // "") | tostring),
                updatedAt: ((.metadata.annotations["krateo.io/draft-updated-at"] // $body.updatedAt // .metadata.creationTimestamp // "") | tostring),
                state: $state,
                statusLabel: (if $state == "published" then "Published · awaiting merge"
                              elif (.metadata.labels["krateo.io/draft-previewed"] // "") == "true" then "Previewed · ready to publish"
                              else "Preview needed" end),
                prUrl: (($publish.prUrl // "") | if type == "string" then . else "" end),
                repo: (($publish.repo // "") | if type == "string" then . else "" end),
                startedFrom: (if (($body.threadId // "") | type == "string" and . != "") then "Autopilot thread" else "Composed by hand" end),
                files: ($files | length),
                version: ((($files["Chart.yaml"] // "") | if type == "string" then . else "" end)
                          | [match("(?m)^version:[ \t]*[\"']?([^\"'\\s]+)").captures[0].string] | .[0] // ""),
                resumePath: ($routes[$recordKind] + "/compose?resume=" + (.metadata.name // "")) }
          ) ] | sort_by(.updatedAt) | reverse end) }
