# The /blueprint-builder page header — title and subtitle in one CR.
#
# Replaces four: flex.blueprint-builder-header (a vertical Flex whose only job was to stack them),
# paragraph.blueprint-builder-eyebrow, paragraph.blueprint-builder-title and
# paragraph.blueprint-builder-subtitle.
#
# THE EYEBROW IS GONE, and that is a deletion rather than a regression: Paragraph.tsx already
# returns null for `variant: eyebrow`, so "Builders · tenant …" has been rendering as nothing. The
# frontend comment says the canonical source is the chart's *-eyebrow CRs and that returning null
# "avoids touching the cluster" — this CR is the cluster being touched.
#
# No actions in the header. The page's entry point is blueprint-builder-ask-cta directly below,
# which is the Autopilot prompt itself rather than a button that opens one; promoting a duplicate
# into the header would give the same action two homes a few pixels apart.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-builder-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Blueprint Builder
    subtitle: >-
      Describe a blueprint to Autopilot and it drafts the Helm chart, previews a live helm-render,
      and opens a gated change request to the blueprints repository. Once merged, it publishes an
      OCI chart and appears below — installable by anyone from the Blueprints page. Each row links
      to its blueprint.
  resourcesRefs:
    items: []
