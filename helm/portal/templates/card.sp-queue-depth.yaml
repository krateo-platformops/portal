{{- if (.Values.observability | default dict).snowplowSli }}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-card-queue-depth
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Refresher and prewarm depth
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - linecharts
    items:
    - resourceRefId: sp-queue-depth
  resourcesRefs:
    items:
      - id: sp-queue-depth
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-queue-depth
        namespace: {{ .Release.Namespace }}
        resource: linecharts
        verb: GET
{{- end }}
