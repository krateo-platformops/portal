# "New alert" — the /alerts page CTA into the create Form at /alerts/new. Always visible (the
# empty-state hint below the table only shows while zero alerts exist, so this button is the
# entry point once the catalog is populated). Plain literal navigate — the create route is static.
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-new
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    label: New alert
    icon: fa-plus
    type: primary
    size: middle
    clickActionId: new-alert
    actions:
      navigate:
        - id: new-alert
          type: navigate
          path: /alerts/new
  resourcesRefs:
    items: []
