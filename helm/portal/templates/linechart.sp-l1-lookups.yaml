{{- if (.Values.observability | default dict).snowplowSli }}
{{/* L1 dispatch lookups per bucket. After warm-up the invariant is ~100% hit. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-l1-lookups
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "hit": green
      "miss": orange
      "seed_hit": cyan
    shapeField: smooth
    area: false
    legend: true
    height: 180
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: (.outcome|tostring), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-l1-lookups
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
{{- end }}
