{{/* The app brand logo, defined declaratively (antd Image widget) instead of the */}}
{{/* old hardcoded engine "K Krateo" lockup. Swap `src`/`width` to rebrand — no code. */}}
{{/* `preview: false` because a logo is decorative (no click-to-zoom). */}}
{{/* */}}
{{/* `src` is the Krateo PlatformOps logo in Agentiko lilac (#DCD8F1), inlined as a data URI. */}}
{{/* The portal adopts the Agentiko style, whose sidebar is black, and the logo sits on it in */}}
{{/* lilac (it was the remote brand/logo.svg). Source: frontend ui/src/assets/images/logo_big.svg */}}
{{/* with every fill="#fff" set to #DCD8F1 (opacities and viewBox kept). Inlined, so the shell */}}
{{/* no longer fetches raw.githubusercontent.com to draw its own logo. */}}
kind: Image
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: brand-logo
  namespace: {{ .Release.Namespace }}
spec:
  widgetData:
    src: data:image/svg+xml;base64,
    alt: Krateo PlatformOps
    {{/* #80 §0.4: bumped 150 → 180 to give the wordmark more presence in the 236px sider (independent */}}
    {{/* of the sider width in layout.app-shell.yaml, which stays 236). */}}
    width: 180
    preview: false
