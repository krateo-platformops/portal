{{/* The composition has an architecture — the gate saw its ConfigMap in status.managed — and this */}}
{{/* person may not read it, or may not read the composition it describes. Said once, in place of the */}}
{{/* graph (P16: what happened, and what would change it), rather than drawn as a graph of unknowns or */}}
{{/* left as an empty card that reads like "nothing here". */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: paragraph-composition-detail-architecture-unreadable
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    text: This composition's topology is not readable with your access. An administrator can grant read access to its ConfigMaps in this namespace.
    type: secondary
