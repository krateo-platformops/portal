{{/* Page composer, step 1 — what can this user put on a page? */}}
{{/* */}}
{{/* Lists the widget CRs that already EXIST, per composable kind, and returns them as one flat */}}
{{/* option list. This is the design decision that makes a UI-native page builder honest: 209 of */}}
{{/* 481 chart templates compute their widgetData from a RESTAction via widgetDataTemplate jq at */}}
{{/* serve time, so an editor that authors NEW widgets from static widgetData can only produce the */}}
{{/* trivial ones — it would look finished and ship pages nobody wants. Composing pages from widgets */}}
{{/* that are already data-bound has no such gap. */}}
{{/* */}}
{{/* Each step is a plain collection GET under the caller's own RBAC, so the list is exactly what */}}
{{/* this user may read — no extra authorisation surface. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: page-composable
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{/* IT NO LONGER LISTS WIDGETS. Seven collection GETs used to run here on every serve, one per
         hand-written kind, to give the page composer's palette its placeable widgets. That list was
         the problem rather than the mechanism: forty-four widget kinds exist, this named seven, and
         the two artifacts failed silently apart — a kind missing from this file was simply absent
         from the palette, with no error anywhere in the UI.

         frontend 1.6.35 reads snowplow's `/list?category=widgets` instead, which discovers the GVRs
         server-side and lists each under the CALLER'S own client. Every widget CRD declares
         `categories: [widgets, krateo]`, so one request returns everything the user may see with no
         hand-maintained list on either side.

         THE RESTACTION STAYS, because it has a second consumer that has nothing to do with widgets:
         form.author-blueprint resolves the BuilderPublish GVR through it. Deleting the object would
         have broken that form — which is why this removes the seven steps and keeps the one. */}}
    {{/* The page-root Flex is published as a widget CR too, so the composer needs the same
         BuilderPublish GVR the KOG builder discovers — and for the same reason: the CRD's served
         version tracks the portal chart version, so a literal would break on the next release. */}}
    - name: bp
      path: /apis/core.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/compositiondefinitions/builder-publish
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: bpError
  filter: >
    { bpApiVersion: (.bp.status.apiVersion // ""),
      bpResource:   (.bp.status.resource // "builderpublishes") }
