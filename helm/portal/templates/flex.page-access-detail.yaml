{{/* Page wrapper for /settings/access/{username} (W3-2 persona drill-down). A */}}
{{/* vertical Flex stacking: title (persona + the checked-as honesty line) → */}}
{{/* namespace scope Select (?ns= → extras) → capability preview Card (SAR table) */}}
{{/* → grant Card (Role + RoleBinding, ONE gated ops[] submit) → existing-grants */}}
{{/* Card (table + the conditional Revoke row, inert when no managed grant in */}}
{{/* scope). Route-only (hidden from the sidebar) — reached from the Settings → */}}
{{/* Users table. #88 §0.6: each section is now its own Card (titleVariant: */}}
{{/* eyebrow + variant: outlined) instead of a flat label/desc/content run — the */}}
{{/* Cards' own padding plus the larger inter-card gap give the visual separation */}}
{{/* that was missing. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-access-detail
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    {{/* P25 opt-out. This page has no single header to migrate: it resolves TWO apiRefs (the subject */}}
    {{/* and their grants) and its title line is assembled from both, so a PageHeader would have to */}}
    {{/* pick one and drop the other. Kept as a title-stack deliberately, not by omission. */}}
    "krateo.io/no-page-header": "two apiRefs — the title line is assembled from both"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [username]
  widgetData:
    allowedResources:
    - flexes
    - cards
    vertical: true
    {{/* P9: one section step across every nav-declared page root. This page previously used `large`
         for inter-card separation (#88 §0.6); G10 settles it the other way — "spend vertical space
         on rows; spend almost none on the frame around them". The Cards' own padding carries the
         separation, so the gap between them is frame and stays thin. */}}
    gap: middle
    items:
    - resourceRefId: access-detail-title-stack
    - resourceRefId: access-scope-row
    - resourceRefId: access-preview-card
    - resourceRefId: access-grant-card
    - resourceRefId: access-grants-card
  resourcesRefs:
    items:
    - id: access-detail-title-stack
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: access-detail-title-stack
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: access-scope-row
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: access-scope-row
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: access-preview-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: access-preview-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: access-grant-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: access-grant-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: access-grants-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: access-grants-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
