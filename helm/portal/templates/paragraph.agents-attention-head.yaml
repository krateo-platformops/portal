# The one-line heading of the exception roll-up at the top of /agents — EMPTY on a healthy cluster.
#
# It exists as its own Paragraph rather than as an `####` heading inside markdown.agents-attention
# for one reason: colour. A Markdown carries no type, so a roll-up written entirely in it would
# announce "4 things deviate from the intended shape" in body text, indistinguishable at a glance
# from the page's own subtitle. Typography's `warning`/`danger` is the signal; the Markdown
# underneath carries the detail that needs code spans and nested bullets, which a Paragraph cannot.
#
# `type` is computed, not fixed: `danger` only when an agent is delegated to that the gateway has NO
# route for (the delegation cannot be made at all) or when one of the six reads did not answer (the
# list underneath is then incomplete and must not be trusted as exhaustive). Everything else is
# `warning` — see the RESTAction. The CRD enum has no empty member, so the healthy case is carried
# by `text: ''`, not by an empty type.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-attention-head
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-gateway
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: ''
    strong: true
    type: warning
  widgetDataTemplate:
  - forPath: text
    expression: '${ .attentionHead // "" }'
  - forPath: type
    expression: '${ .attentionType // "warning" }'
  resourcesRefs:
    items: []
