{{/* "Not yet investigated" strip — firing Alerts (state ALERT) with no open incident, off */}}
{{/* incidents-list. hideWhenEmpty removes the strip when every firing alert has one. Each row */}}
{{/* opens the Autopilot rail seeded to investigate that alert. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-awaiting
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6: the extras keys that partition this widget's cache cell. Undeclared keys still */}}
  {{/* reach the jq dict but do NOT vary the key, so a content-bearing key left out here */}}
  {{/* serves one scope's content from another's cell. */}}
  keyExtras: [projects]
  apiRef:
    name: incidents-list
    namespace: {{ .Release.Namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: false
    hideWhenEmpty: true
    header: Not yet investigated — firing alerts with no open incident; select one to start it in Autopilot →
    itemTemplate:
      navigateTo: '{askHref}'
      iconVariant: dot
      color:
        value: '{state}'
        map:
          ALERT: red
        default: gray
      primaryText: '{name}'
      {{/* Sentence-cased server-side ("ALERT" → "Alert"); the raw state keys the colour map. */}}
      secondaryText: '{stateLabel}'
      secondaryTextAsTag: true
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ (.awaiting // []) | map(. + { stateLabel: ((.state // "") | ascii_downcase | if . == "" then "" else ((.[0:1] | ascii_upcase) + .[1:]) end) }) }'
  resourcesRefs:
    items: []
