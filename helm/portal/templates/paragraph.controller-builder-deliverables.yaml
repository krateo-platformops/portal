{{/* What the deliverables table lists, in the place paragraph.blueprint-builder-deliverables says */}}
{{/* it for blueprints. Every clause is what restaction.controller-builder-deliverables computes: */}}
{{/*  - "from the composer or through Autopilot" — both publish through a BuilderPublish claim, */}}
{{/*    selected by builder: controller; "newest first" — the final sort; */}}
{{/*  - the three steps, in the words of the Next step cell — Register (the definition, once the */}}
{{/*    change is merged), Install (the controller, once registered), Configure credentials (once */}}
{{/*    Ready, only for an API that needs them); */}}
{{/*  - "Ready once every kind it generates is" — Ready is every RestDefinition of the install. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: controller-builder-deliverables-note
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      Every controller published from the composer or through Autopilot, newest first. A row opens
      its change request while it is in review, then the next step it names: Register once the
      change is merged, Install once it is registered, and Configure credentials when its API needs
      them. A controller is Ready once every kind it generates is.
  resourcesRefs:
    items: []
