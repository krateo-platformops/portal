{{/* The alert's chain, hop by hop — read live, not described. */}}
{{/* */}}
{{/* RESTORES a CR that #149 referenced but never committed. That PR added the RESTAction which */}}
{{/* computes `pipelineMd` and the page composition which references `alert-detail-pipeline-card`, */}}
{{/* and shipped neither the Card nor this Markdown. The page has been rendering nothing there since: */}}
{{/* a dangling resourcesRefs entry is not a render error, so helm rendered, the CRD validated, and CI */}}
{{/* was green. Found by the lint's `missing-target` rule (X13) on its first run. */}}
{{/* */}}
{{/* An alert is not one object. It is: the CR, the HyperDX rule it syncs to, the evaluation, the */}}
{{/* webhook, the investigation that webhook opens, and the incident that investigation becomes. Every */}}
{{/* hop can stop without the hop before it noticing, and this page said nothing about any of them — */}}
{{/* it showed a green "OK" for days while the alert → RCA loop was dead on a tool-schema rejection. */}}
{{/* */}}
{{/* A numbered walk rather than a FlowChart: the chain is LINEAR, and nodes plus edges buy nothing */}}
{{/* without branching. */}}
kind: Markdown
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-detail-pipeline
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: alert-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    markdown: ''
  widgetDataTemplate:
  - forPath: markdown
    expression: '${ .pipelineMd // "" }'
  resourcesRefs:
    items: []
