{{/* Reject: a merge-PATCH of spec.decision {phase: Rejected, reason} on the proposal, as the caller, */}}
{{/* the same way button.incident-detail-resolve writes spec.lifecycle (snowplow's /call cannot */}}
{{/* address the status subresource). decidedBy/decidedAt are not sent: nightly-review's admission */}}
{{/* policy stamps them from the request identity. A refused write (403, or the admission policy: */}}
{{/* only PrOpen -> Rejected is allowed, Rejected is final) reaches the person as the apiserver's */}}
{{/* message. The reason is optional, at most 1000 characters (the CRD's bound). */}}
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-reject-form
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-proposal
    namespace: {{ .Release.Namespace }}
  widgetData:
    layout: vertical
    submitActionId: reject
    schema:
      type: object
      properties:
        reason:
          type: string
          title: Reason (optional)
          description: Why this change should not be made. Kept on the proposal.
          maxLength: 1000
    buttonConfig:
      primary:
        label: Reject proposal
    actions:
      rest:
        - id: reject
          type: rest
          resourceRefId: reject-proposal
          headers:
            - 'Content-Type: application/merge-patch+json'
          successMessage: Proposal rejected
          payload:
            spec:
              decision:
                phase: Rejected
          {{/* An empty reason is omitted rather than sent as "". */}}
          payloadToOverride:
            - name: spec.decision
              value: '${ { phase: "Rejected" } + (if ((.json.reason // "") | length) > 0 then { reason: .json.reason } else {} end) }'
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: reject-proposal
        apiVersion: review.krateo.io/v1alpha1
        resource: proposals
        name: '${ .name }'
        namespace: {{ .Release.Namespace }}
        verb: PATCH
