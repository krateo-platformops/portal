{{/* Compositions filter chip stack — the two facet-chip Listys stacked as TWO separate */}}
{{/* LEFT-ALIGNED rows (scope chips row above the status chips row) rather than sitting on */}}
{{/* one line beside the search box (#79 §0.1). A vertical Flex left-anchors both rows */}}
{{/* (align: flex-start) so the chips read as two distinct filter tiers; the parent */}}
{{/* compositions-toolbar places this whole stack on the LEFT and the search on the RIGHT. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compositions-chip-stack
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [namespace]
  widgetData:
    allowedResources:
    - listies
    vertical: true
    align: flex-start
    gap: small
    items:
    - resourceRefId: compositions-scope-chips
    - resourceRefId: compositions-status-chips
  resourcesRefs:
    items:
    - id: compositions-scope-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-scope-chips
      namespace: {{ .Release.Namespace }}
      resource: listies
      verb: GET
    - id: compositions-status-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-status-chips
      namespace: {{ .Release.Namespace }}
      resource: listies
      verb: GET
