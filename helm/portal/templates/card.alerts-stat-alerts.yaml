# Alerts — one of the three cards in the alerts summary band.
#
# Every alert rule you can read, split by whether it is currently over its threshold.
# "Firing" is the number a reader came for, and today it is found by scanning a column.
#
# Chips are Card `tags`, computed from the same action as the number. Empty list as the static
# default: no chips is honest while the action resolves; placeholder chips would be numbers nobody
# measured.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-stat-card-alerts
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: obs-alerts
    namespace: {{ .Release.Namespace }}
  widgetData:
    variant: outlined
    tags: []
    items:
    - resourceRefId: alerts-stat-alerts
  widgetDataTemplate:
  - forPath: tags
    expression: '${ [ ((.firing // 0) | tostring) + " firing", (((.total // 0) - (.firing // 0)) | tostring) + " quiet" ] }'
  resourcesRefs:
    items:
    - id: alerts-stat-alerts
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-stat-alerts
      namespace: {{ .Release.Namespace }}
      resource: statistics
      verb: GET
