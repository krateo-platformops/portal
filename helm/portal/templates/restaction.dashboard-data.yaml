{{/* Dashboard data source = compositions-list shape, scoped by the active time-range. */}}
{{/* Mirrors compositions-list (CRD discovery -> cluster LIST per kind, UAF-gated), then */}}
{{/* pre-filters the list by creationTimestamp. Returns the SAME shape as compositions-list */}}
{{/* ({list:[...]}) so the dashboard stat/donut/throughput widgets keep their per-widget jq */}}
{{/* unchanged — only their apiRef is repointed here. The range scope is shared across those */}}
{{/* widgets, so it lives once here (a page-level scope) rather than in each widget. The range */}}
{{/* comes from the request `extras` (?range= in the URL, forwarded by the frontend) and is */}}
{{/* read SYNCHRONOUSLY in the filter as `.range` — NOT a persisted ConfigMap. (The earlier */}}
{{/* ConfigMap-PATCH approach lagged snowplow's informer read-after-write and was removed.) */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: dashboard-data
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
  {{/* COMPOSITION KINDS FROM CompositionDefinitions, NOT FROM CRDs. Same {plural, version}
       out; `compositions-list` has read them this way all along. A cluster-scoped CRD LIST is
       dialled AS THE CALLER and so needs a ClusterRole on every persona that loads this page;
       a CompositionDefinition LIST with a userAccessFilter is dialled by snowplow's SA and
       narrowed per item, so it needs none. That is what lets `devs` carry no ClusterRole at
       all (#261) — cyberjoker cannot `list compositiondefinitions` in any namespace but
       demo-system, and the Compositions page has always worked for him regardless. */}}
  - name: crds
    path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
    verb: GET
    userAccessFilter:
      verb: list
      group: core.krateo.io
      resource: compositiondefinitions
      namespaceFrom: .metadata.namespace
    filter: "[.crds.items[]? | select(.status.resource != null and .status.apiVersion != null) | {plural: .status.resource, version: (.status.apiVersion | split(\"/\")[1])}] | unique"
    continueOnError: true
    errorKey: crdsError
  - name: allCompositions
    dependsOn:
      name: crds
      iterator: ".crds"
    path: ${ "/apis/composition.krateo.io/" + (.version) + "/" + (.plural) }
    verb: GET
    continueOnError: true
    errorKey: allCompositionsError
    userAccessFilter:
      verb: list
      group: composition.krateo.io
      resourcesFrom: "[ (.crds // [])[] | .plural ]"
      namespaceFrom: .metadata.namespace
    filter: >
      [.allCompositions.items[]?
       | {uid: .metadata.uid, name: .metadata.name, ns: .metadata.namespace, ts: .metadata.creationTimestamp, kind: .kind, av: .apiVersion, conditions: (.status.conditions // [])}]
  {{/* The range comes from the request `extras` (?range=… in the URL, forwarded by the */}}
  {{/* frontend) and is read here as `.range` — synchronous, no ConfigMap read-after-write */}}
  {{/* lag. Defaults to 24h when the URL carries no ?range. */}}
  filter: >
    ((.range) // "24h") as $range
    | (if $range == "24h" then 86400 elif $range == "7d" then 604800 elif $range == "30d" then 2592000 else 0 end) as $window
    | (now - $window) as $cutoff
    | {
        range: $range,
        list: [ (.allCompositions // [])[] | select($window == 0 or (((.ts // "") | (fromdateiso8601? // 0)) >= $cutoff)) ]
      }
