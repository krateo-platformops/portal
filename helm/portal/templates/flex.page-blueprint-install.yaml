{{/* Install page — the route /marketplace/{name}/install renders here (page-<slug> convention). */}}
{{/* Hosts the blueprint-install Form, which deploys a CompositionDefinition from the CRD schema. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-blueprint-install
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name]
  widgetData:
    allowedResources:
      - pageheaders
      - forms
    vertical: true
    {{/* P9: one section step across every nav-declared page root — see G10, the gap between
         sections is frame and stays thin. */}}
    gap: middle
    items:
      - resourceRefId: blueprint-install-page-header
      - resourceRefId: blueprint-install-form
  resourcesRefs:
    items:
      - id: blueprint-install-page-header
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-install-page-header
        namespace: {{ .Release.Namespace }}
        resource: pageheaders
        verb: GET
      - id: blueprint-install-form
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-install
        namespace: {{ .Release.Namespace }}
        resource: forms
        verb: GET
