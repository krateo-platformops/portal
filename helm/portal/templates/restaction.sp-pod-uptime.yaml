{{- if (.Values.observability | default dict).snowplowSli }}
{{/* VERIFIED against live ClickHouse on krateo-057 before it was written — see portal#201. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: sp-pod-uptime
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: q
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then "1%20HOUR" elif $r=="24h" then "24%20HOUR" elif $r=="7d" then "7%20DAY" else "24%20HOUR" end) as $iv | (if $r=="1h" then "2%20MINUTE" elif $r=="24h" then "1%20HOUR" elif $r=="7d" then "6%20HOUR" else "1%20HOUR" end) as $bk | "/?query=" + "SELECT%20round%28argMax%28Value%2C%20TimeUnix%29%20%2F%2060%2C%201%29%20AS%20uptime_min%20FROM%20otel_metrics_sum%20WHERE%20ServiceName%3D%27snowplow%27%20AND%20MetricName%3D%27k8s.pod.uptime%27%20AND%20TimeUnix%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: qError
  filter: >
    { rows: ((.q.data) // []), failed: ((.qError // null) != null) }
{{- end }}
