# The /clusters/register page header.
#
# This page had NO header at all — it opened straight onto the register Form. Static, because the
# route carries no parameters and the form creates something that does not exist yet: there is
# nothing to resolve a title from.
#
# The subtitle names the object the form actually creates (a KubernetesTarget), which is the thing
# the reader will go looking for on /clusters afterwards.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: clusters-register-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Register cluster
    subtitle: Add a KubernetesTarget that blueprints can deploy to
  resourcesRefs:
    items: []
