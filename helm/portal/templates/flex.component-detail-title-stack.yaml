# The component-detail pagehead: title line (name + ready Tag) over the subtitle
# — same stack as composition-detail. #88 §0.2: the "Back to settings" link is
# gone (dead weight next to the breadcrumb, which already carries that
# navigation). The "View logs" action button that used to sit beside this stack
# is gone too — it only ever redirected to the Observability section, no detail
# page of its own — so this is now the whole pagehead, not a left column.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: component-detail-title-stack
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name]
  widgetData:
    vertical: true
    gap: small
    allowedResources:
      - flexes
      - paragraphs
    items:
      - resourceRefId: component-detail-title-line
      - resourceRefId: component-detail-subtitle
  resourcesRefs:
    items:
      - id: component-detail-title-line
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: component-detail-title-line
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
      - id: component-detail-subtitle
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: component-detail-subtitle
        namespace: {{ .Release.Namespace }}
        resource: paragraphs
        verb: GET
