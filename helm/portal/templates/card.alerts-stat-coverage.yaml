# Evaluated by HyperDX — one of the three cards in the alerts summary band.
#
# An alert with no status.hyperdxAlertId is evaluated by nothing. It looks identical to a
# working one in the table — same columns, same quiet state — so a count is the only place
# it can surface.
#
# Chips are Card `tags`, computed from the same action as the number. Empty list as the static
# default: no chips is honest while the action resolves; placeholder chips would be numbers nobody
# measured.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alerts-stat-card-coverage
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: obs-alerts
    namespace: {{ .Release.Namespace }}
  widgetData:
    variant: outlined
    tags: []
    items:
    - resourceRefId: alerts-stat-coverage
  widgetDataTemplate:
  - forPath: tags
    expression: '${ (((.total // 0) - (.synced // 0))) as $gap | (if $gap > 0 then [ ($gap | tostring) + " NOT evaluated" ] else [ "all rules synced" ] end) }'
  resourcesRefs:
    items:
    - id: alerts-stat-coverage
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alerts-stat-coverage
      namespace: {{ .Release.Namespace }}
      resource: statistics
      verb: GET
