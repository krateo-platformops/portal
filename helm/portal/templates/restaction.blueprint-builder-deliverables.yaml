{{/* /blueprint-builder deliverables — one row per blueprint published from this builder. The */}}
{{/* composer and Autopilot (frontend >= 1.6.59) both publish through a BuilderPublish claim, */}}
{{/* whose files are LocalResources labelled krateo.io/builder: blueprint (the `publishes` step); */}}
{{/* the older rows are sourced from the git PullRequest CRs to the blueprints repo */}}
{{/* (spec.repo == krateo-blueprints, no krateo.io/publish label), */}}
{{/* JOINED to (a) the registered CompositionDefinition — is the merged chart live yet? — and */}}
{{/* (b) the blueprints helm index — is the chart published to the marketplace yet? */}}
{{/* Cluster-native for the CR joins (no GitHub token/endpoint); the catalog step is an external */}}
{{/* endpointRef fetch of the public helm index. continueOnError everywhere so a narrow-RBAC user */}}
{{/* (or a missing index) degrades to a partial/empty table instead of a failed widget. The chart */}}
{{/* name is derived server-side from the PR's `builder/<chart>` branch; the row's ns+chart drive */}}
{{/* the table's rowNavigateTo into the blueprint detail page (the linkable deliverable), while the */}}
{{/* PR number + html_url ride along so the table can surface the opened PR (a "#N" cell). */}}
{{/* */}}
{{/* THE INSTALL STEP. A merged blueprint is not yet installable: somebody has to create its */}}
{{/* CompositionDefinition, and that is a person's decision, taken after the release is green — */}}
{{/* possibly days after the merge. So a row whose change request is merged and which has no */}}
{{/* CompositionDefinition says "Merged", its Next step cell says "Install" — the portal's verb */}}
{{/* for creating a CompositionDefinition, and the word on the page it opens — and the row opens */}}
{{/* /marketplace/<chart>/install: the existing install Form, which the builder publish pre-fills */}}
{{/* (restaction.blueprint-install-formdef) and which POSTs as the caller. The Table cannot carry */}}
{{/* an action in a row (Table.tsx has rowNavigateTo only), so the row IS the control and the */}}
{{/* cell says what it does. */}}
{{/* */}}
{{/* ONLY A PUBLISH THAT CARRIES ITS REGISTRATION FILE. The form pre-fills from the publish's root */}}
{{/* compositiondefinition.yaml and from nothing else of the publish; without that file it falls */}}
{{/* back to a helm-index chart that shares the name, and the person would install that chart */}}
{{/* believing it was theirs. Blueprints published before the composer wrote the file (and every */}}
{{/* legacy PR row, which has no krateo.io/publish label to find one by) keep linking to their */}}
{{/* change request. The file test is portal.builderIsRegistrationFile, the one the form uses. */}}
{{/* */}}
{{/* "MERGED" NEEDS EVIDENCE, and today there is none: the PullRequest CR's status is exactly */}}
{{/* conditions/html_url/number/state (github-provider-kog 0.3.1), so .status.merged is always */}}
{{/* absent and a merged PR reads as state=closed. Guessing would call a rejected change merged. */}}
{{/* So a closed PR whose provider does not REPORT merged says "Closed", and its Next step says */}}
{{/* "Install if merged" — the row still opens the install form, which links the change request */}}
{{/* (restaction.blueprint-install-origin) so the person checks it there, and nothing claims a */}}
{{/* merge that nothing observed. When the provider reports `merged`, the same row becomes */}}
{{/* "Merged" / "Install" on its own, and a closed-unmerged one becomes a plain "Closed" that */}}
{{/* links back to its PR. */}}
{{/* */}}
{{/* NEEDS snowplow >= 1.4.0 for the external helm-index YAML fetch (external_fetch.go YAML->JSON). */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: blueprint-builder-deliverables
  namespace: {{ .Release.Namespace }}
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    {{/* Builder pull requests to the blueprints repo. status.state (open/closed) + merged + number + */}}
    {{/* html_url are written by the KOG github-provider after the PR lands; a just-created PR has */}}
    {{/* none, so read every status field defensively. Filter to the blueprints repo here so the */}}
    {{/* join below only ever considers blueprint deliverables. */}}
    - name: prs
      path: /apis/github.krateo.io/v2022-11-28/namespaces/{{ .Release.Namespace }}/pullrequests
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: prsError
      filter: >
        [ (.prs.items // [])[]
          | { publish: ((.metadata.labels["krateo.io/publish"]) // ""),
              repo: ((.spec.repo) // ""),
              chart: (((.spec.head) // "") | sub("^builder/"; "")),
              title: ((.spec.title) // ""),
              number: ((.status.number) // 0),
              state: ((.status.state) // "pending"),
              merged: ((.status.merged) == true),
              # Whether the provider reports `merged` at all — distinct from reporting false. `// false`
              # folds "absent" into "not merged", and those two need opposite rows (see the header).
              mergedKnown: (((.status.merged) | type) == "boolean"),
              url: ((.status.html_url) // ""),
              created: ((.metadata.creationTimestamp) // "") } ]
    {{/* The registered blueprints (CompositionDefinitions). The join key is metadata.name == */}}
    {{/* the PR's chart name (the builder names the branch, the chart and the CD identically). */}}
    - name: cds
      path: /apis/core.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/compositiondefinitions
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: cdsError
      filter: >
        [ (.cds.items // [])[]
          | { name: (.metadata.name // ""),
              version: ((.spec.chart.version) // ""),
              ready: ([ (.status.conditions // [])[] | select((.type // "") == "Ready") ] | first // {} | (.status // "")),
              syncReason: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {} | (.reason // "")) } ]
    {{/* P1 — SCM-agnostic publish path (AUTOPILOT_PUBLISH_VIA_GIT_PROVIDER): no PullRequest CR, the */}}
    {{/* blueprint's held chart files ride git-provider LocalResources labelled krateo.io/builder: */}}
    {{/* blueprint + krateo.io/publish: <name> (one per file). Grouped per publish in the final filter */}}
    {{/* → a deliverable row alongside the PR rows. continueOnError → empty if git-provider/RBAC absent. */}}
    - name: publishes
      path: /apis/git.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/localresources
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: publishesError
      filter: >
        [ (.publishes.items // [])[]
          | select(((.metadata.labels["krateo.io/builder"]) // "") == "blueprint")
          | { publish: ((.metadata.labels["krateo.io/publish"]) // ""),
              branch: (((.status.targetBranch) // (.spec.toRepo.branch)) // ""),
              synced: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {} | (.status // "")),
              # The final filter has always branched on syncReason == "ReconcileError" — and this step
              # never selected it, so `$failed` was unconditionally false and a publish that died hours
              # ago rendered as the orange present participle forever. That is the exact defect the
              # comments further down this file complain about; it was in the step, not the ladder.
              syncReason: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {} | (.reason // "")),
              syncMsg: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {} | (.message // "")),
              # Is this file the publish's root registration file — the one the install form
              # pre-fills from? A publish without one is never offered Install (see the header).
              reg: {{ include "portal.builderIsRegistrationFile" . }},
              created: ((.metadata.creationTimestamp) // "") } ]
    {{/* The krateo-blueprints blueprints helm index — the marketplace catalog. Mirrors */}}
    {{/* restaction.blueprints-catalog's blueprints step (same endpointRef + path). The index's */}}
    {{/* `entries` map is keyed by chart NAME, so the marketplace-availability join is a simple */}}
    {{/* membership test (does the index list this chart?) — projected to just the chart names here. */}}
    {{- include "portal.catalogStep" (dict "ctx" $ "name" "catalog" "index" "blueprints") | nindent 4 }}
      filter: >
        [ (((.catalog // {}).entries) // {}) | keys[] ]
  {{/* Join PRs → CDs → marketplace catalog. Status verdict (Registered/Reconciling/Merged/Closed/ */}}
  {{/* In review, and for claim rows Pushed/Publish failed/Publishing) + its chip colour, the Next */}}
  {{/* step cell, the marketplace-available chip, and the PR "#N" cell are all computed HERE, */}}
  {{/* server-side. Rows are newest-first. (No Autopilot deep-link is emitted here: the entry points */}}
  {{/* live in the page header — "Compose a blueprint", the primary, and the "Ask Autopilot" link */}}
  {{/* that lands in the same composer — so a row never needs to carry one.) */}}
  {{/* A LITERAL block (|), not folded (>): folding joins every line at the block's base indent */}}
  {{/* into one, so a `#` comment there would swallow the def that follows it. */}}
  filter: |
    # ending($pr): "merged" | "closed?" | "closed" | "" — see portal.builderPrEnding (_builder.tpl),
    # shared with restaction.builder-prs. Legacy and claim rows both use it, so both paths judge a
    # merge on the same evidence.
    {{- include "portal.builderPrEnding" . | nindent 4 }}
    # The Install destination exists only for a row with no CompositionDefinition — once one
    # exists the row goes to the blueprint, and a second POST of the same name would 409. Only
    # when the CompositionDefinitions could be READ: a failed `cds` step (cdsError) is not
    # evidence that there is none. And only for a publish that carries its registration file
    # ($hasReg): that file is the whole pre-fill, and without it the form opens on whatever
    # helm-index chart shares the name.
    ((.cdsError // null) == null) as $cdsRead
    | def registerable($cd; $end; $hasReg): $cdsRead and $hasReg and $cd == null and ($end == "merged" or $end == "closed?");
    (.cds // []) as $cds
    | (.prs // []) as $prs
    | ((.catalog // []) | map({key: ., value: true}) | from_entries) as $inCatalog
    | ([ $prs[]
         | select(((.publish) // "") == "" and ((.repo) // "") == "krateo-blueprints")
         | . as $pr
         | ( [ $cds[] | select(.name == $pr.chart) ] | first ) as $cd
         | ($inCatalog[$pr.chart] // false) as $published
         | ending($pr) as $end
         | { chart: $pr.chart,
             title: $pr.title,
             pr: ("#" + ($pr.number | tostring)),
             url: $pr.url,
             version: (if $cd != null then ("v" + ($cd.version // "?")) else "—" end),
             status: (if ($cd != null and $cd.ready == "True") then "Registered"
                      elif ($cd != null) then "Reconciling"
                      elif $end == "merged" then "Merged"
                      elif ($end == "closed" or $end == "closed?") then "Closed"
                      else "In review" end),
             # Merged is green, the chip the change-request list (restaction.builder-prs) gives the
             # same merged PR: one state, one colour, on both builder pages — and blue there is
             # Open. Registered is still told apart by its label and its empty Next step; a
             # closed change is gray, as on that list.
             statusColor: (if ($cd != null and $cd.ready == "True") then "green"
                           elif ($cd == null and $end == "merged") then "green"
                           elif ($cd == null and ($end == "closed" or $end == "closed?")) then "gray"
                           else "orange" end),
             # What the row click does next, when that is a person's step. Empty otherwise: a
             # row with nothing to do says nothing (exception-only).
             # Legacy rows carry no krateo.io/publish label, so no registration file can be found
             # for them: they are never offered Install ($hasReg false).
             next: (if registerable($cd; $end; false) then (if $end == "merged" then "Install" else "Install if merged" end) else "" end),
             # Marketplace availability — is the chart published to the helm index yet? A chip is
             # rendered ONLY when it is (green "Available"); an unpublished chart shows no chip
             # (exception-only: the calm default is "not yet in the marketplace", no noise).
             marketLabel: (if $published then "Available" else "" end),
             marketColor: (if $published then "green" else "" end),
             ns: "{{ .Release.Namespace }}",
             # Per-row destination, resolved server-side (the Table takes it whole, verbatim).
             # Registered → the blueprint's own page; merged (or closed with no merge signal),
             # unregistered and carrying a registration file → the install form; otherwise the
             # change request; otherwise nothing, and Table.tsx leaves the row inert.
             rowHref: (if $cd != null then ("/blueprints/{{ .Release.Namespace }}/" + $pr.chart)
                       elif registerable($cd; $end; false) then ("/marketplace/" + $pr.chart + "/install")
                       else (($pr.url) // "") end),
             age: $pr.created } ]) as $prRows
    | ([ (.publishes // []) | group_by(.publish)[]
         | select((.[0].publish // "") != "")
         | .[0] as $p0
         | ($p0.publish | sub("^publish-"; "")) as $chart
         | ( [ $cds[] | select(.name == $chart) ] | first ) as $cd
         | ($inCatalog[$chart] // false) as $published
         | (all(.[]; .synced == "True")) as $pushed
         | (any(.[]; .syncReason == "ReconcileError")) as $failed
         # The publish carries its root registration file (portal.builderIsRegistrationFile).
         | (any(.[]; .reg == true)) as $hasReg
         | ( [ $prs[] | select(((.publish) // "") == ($p0.publish // "")) ] | first ) as $pr
         | ending($pr) as $end
         | { chart: $chart,
             title: (($pr.title) // ""),
             # builder-publish 1.8.21 opens the change request itself and its CR carries
             # status.html_url, so a claim row finally has somewhere to link. The branch stays the
             # fallback: pullRequest.create can be off, and the chart's CRD guard renders no
             # PullRequest at all on an install below github-provider-kog 0.3.0.
             pr: (if (($pr.number) // 0) > 0 then ("#" + ($pr.number | tostring)) else ($p0.branch // "") end),
             url: (($pr.url) // ""),
             version: (if $cd != null then ("v" + ($cd.version // "?")) else "—" end),
             status: (if ($cd != null and $cd.ready == "True") then "Registered"
                      elif ($cd != null) then "Reconciling"
                      # A change request that has ENDED outranks "In review" — it was the next rung,
                      # and used to swallow closed PRs whole, so a merged blueprint sat "In review"
                      # forever with no way on to its install.
                      elif $end == "merged" then "Merged"
                      elif ($end == "closed" or $end == "closed?") then "Closed"
                      # "In review" USED TO claim a review that provably could not exist: until
                      # builder-publish 1.8.21 the claim path opened no PullRequest at all, the prs step
                      # 404'd under continueOnError, and every row was a claim row wearing a status no
                      # one could act on. A review is real now when its CR exists — and only then.
                      # Without one a pushed branch is still "Pushed", and a failed publish still says
                      # so rather than wearing a present participle.
                      elif ($pr != null and (($pr.number) // 0) > 0) then "In review"
                      elif $pushed then "Pushed"
                      elif $failed then "Publish failed" else "Publishing" end),
             statusColor: (if ($cd != null and $cd.ready == "True") then "green"
                           elif ($cd == null and $end == "merged") then "green"
                           elif ($cd == null and ($end == "closed" or $end == "closed?")) then "gray"
                           else "orange" end),
             next: (if registerable($cd; $end; $hasReg) then (if $end == "merged" then "Install" else "Install if merged" end) else "" end),
             marketLabel: (if $published then "Available" else "" end),
             marketColor: (if $published then "green" else "" end),
             ns: "{{ .Release.Namespace }}",
             rowHref: (if $cd != null then ("/blueprints/{{ .Release.Namespace }}/" + $chart)
                       elif registerable($cd; $end; $hasReg) then ("/marketplace/" + $chart + "/install")
                       else (($pr.url) // "") end),
             age: ($p0.created // "") } ]) as $claimRows
    | (($prRows + $claimRows) | sort_by(.age // "") | reverse) as $rows
    | { rows: $rows,
        counts: { total: ($rows | length),
                  registered: ([ $rows[] | select(.status == "Registered") ] | length),
                  published: ([ $rows[] | select(.marketLabel == "Available") ] | length) } }
