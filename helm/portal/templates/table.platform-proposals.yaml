{{/* Open proposals, grouped by finding (spec.subject) and newest first, from restaction.platform-reviews. */}}
{{/* A row opens the proposal. The target is the model's claim, so it is plain text, never a link. */}}
{{/* Checks are exception-only pills: Kind not served (yaml only), Target unverified or invalid, and a */}}
{{/* neutral Kind check n/a for markdown and diff. */}}
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: platform-proposals
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    fitContent: true
    rowNavigateTo: /reviews/proposals/{name}
    pagination:
      defaultPageSize: 20
      hideOnSinglePage: true
    columns:
    - valueKey: title
      title: Proposal
      minWidth: 300
    - valueKey: subject
      title: Subject
      minWidth: 180
    - valueKey: kind
      title: Kind
    - valueKey: sources
      title: Evidence sources
      minWidth: 150
    - valueKey: checks
      title: Checks
      minWidth: 150
    - valueKey: phase
      title: Status
    - valueKey: superseded
      title: Superseded
    - valueKey: created
      title: Proposed
      minWidth: 110
    - valueKey: target
      title: Proposed target
      minWidth: 180
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: >-
      ${ [ (.rows // [])[] | [
        {valueKey:"name",kind:"jsonSchemaType",type:"string",stringValue:.name},
        {valueKey:"title",kind:"jsonSchemaType",type:"string",stringValue:.title},
        {valueKey:"subject",kind:"jsonSchemaType",type:"string",stringValue:.subject},
        {valueKey:"kind",kind:"tag",stringValue:.kind,color:"gray"},
        {valueKey:"sources",kind:"jsonSchemaType",type:"string",stringValue:.sources},
        {valueKey:"checks",kind:"conditions",stringValue:.checks},
        {valueKey:"phase",kind:"tag",stringValue:.phase,color:.phaseColor},
        {valueKey:"superseded",kind:"jsonSchemaType",type:"string",stringValue:.superseded},
        {valueKey:"created",kind:"jsonSchemaType",type:"string",stringValue:.created,format:"relative"},
        {valueKey:"target",kind:"jsonSchemaType",type:"string",stringValue:.target,color:"#8c8c8c"} ] ] }
  apiRef:
    name: platform-reviews
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
