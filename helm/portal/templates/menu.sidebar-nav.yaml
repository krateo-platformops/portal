{{/* Sidebar nav — antd Menu hosted in the app-shell Sider; the SINGLE route source (no RoutesLoader). */}}
{{/* Each inline item is a folded nav entry (widget-taxonomy-and-layout.md §H): */}}
{{/* - items with a `label` → a visible sidebar entry AND a route; */}}
{{/* - label-less items → route-only (hidden), e.g. the templated detail/create routes; */}}
{{/* - content endpoint precedence: `resourceRefId` (via resourcesRefs, RBAC-aware) */}}
{{/* → the `flexes/page-<slug>` convention (`page:` overrides the path-derived slug). */}}
{{/* Templated `{param}` segments become :param and reach the page widget via ?extras. */}}
kind: Menu
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sidebar-nav
  namespace: {{ .Release.Namespace }}
spec:
  widgetData:
    mode: inline
    theme: light
    {{/* NOTE: stale — predates the convention; the menu now references flexes/tables, not */}}
    {{/* navmenuitems/pages. Kept until the Menu.schema.json allowedResources enum is updated. */}}
    {{/* Was `navmenuitems` + `pages` — BOTH kinds were removed in the routing refactor, and every */}}
    {{/* child this menu actually holds is a page-root Flex. So the declaration named two things that */}}
    {{/* no longer exist and excluded the one thing it contains. It rendered fine throughout, because */}}
    {{/* nothing enforces allowedResources at runtime; the X5 containment lint is what found it. */}}
    allowedResources:
      - flexes
    {{/* ZERO STATIC ENTRIES. Every item is computed by restaction.sidebar-nav from the
         `krateo.io/nav-*` annotations on the page roots THIS CLUSTER ACTUALLY HAS, so installing a
         page chart adds its entries and uninstalling removes them — with no edit to this file and
         no values flag tracking what is deployed.

         `items: []` stays because the CRD requires the field; widgetDataTemplate fills it. */}}
    items: []
  apiRef:
    name: sidebar-nav
    namespace: {{ .Release.Namespace }}
  {{/* The Menu is fetched again whenever the browser query string changes (useWidgetQuery folds
       it into the cache key), which was free while this was a static CR read and is a RESTAction
       re-resolution now. Declaring NO key extras partitions the cache cell by nothing, so one
       resolution serves every navigation. */}}
  keyExtras: []
  widgetDataTemplate:
    - forPath: items
      expression: '${ .items }'
  {{/* THE GATED EDGE. resourcesRefsTemplate output lands in status.resourcesRefs.items[], which is
       where snowplow re-derives `allowed` PER IDENTITY and where the prewarm walker descends. The
       RESTAction emits one `refs` entry per page root (bound before the alias fan-out, so no
       duplicates and no ref-less rows).

       Until this existed the menu declared no refs at all, so every nav item reached the frontend
       with no resourceRefId, navModel.isNavEntryAllowed fail-opened on all of them, and the sidebar
       showed every page to every user (krateo-platformops/frontend#284). It also left the prewarm
       reaching the app-shell and nothing else, since a refs-following walk had no page edge to
       follow.

       NOTE FOR ANYONE VERIFYING THIS: status.resourcesRefs is resolved request-time into the
       response and is NEVER written back to the CR. `kubectl get menus sidebar-nav -o yaml` will
       show an empty resourcesRefs and that is correct, not evidence this is broken. */}}
  resourcesRefsTemplate:
    - iterator: ${ .refs }
      template:
        id: ${ .id }
        name: ${ .name }
        namespace: ${ .namespace }
        apiVersion: widgets.templates.krateo.io/v1beta1
        resource: flexes
        verb: GET
  resourcesRefs:
    items: []
