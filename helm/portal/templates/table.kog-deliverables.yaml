{{/* The published-API-mappings registry — ONE row per Autopilot-authored KOG deliverable, off */}}
{{/* kog-deliverables. Mirrors the blueprint-builder deliverables table. Columns: RestDefinition */}}
{{/* (name) / Pull request title / Generated kind (GVK) / Ready chip (Ready=green, Failed=red, */}}
{{/* Pending/In review=orange) / PR # / Published age. */}}
{{/* */}}
{{/* ROWS ARE NO LONGER INERT. Two things changed under the old rationale, which said a Table has no */}}
{{/* per-cell href and its rowNavigateTo runs encodeURIComponent, mangling a full https:// URL. */}}
{{/* (1) Table.tsx:35,45 special-cases a WHOLE-placeholder template: `{url}` alone passes the cell */}}
{{/* through verbatim, unencoded — so an external URL is expressible now. (2) Until */}}
{{/* builder-publish 1.8.21 the claim path opened no PullRequest, so `url` was always "" and there */}}
{{/* was nothing to land on anyway; the composition now opens the change request itself and its CR */}}
{{/* carries status.html_url. The other half of the old rationale still stands and is why the */}}
{{/* destination is the CHANGE REQUEST rather than a resource: a RestDefinition's GENERATED kind has */}}
{{/* no single instance to land on, and no per-kind LIST route exists. */}}
{{/* */}}
{{/* A row whose publish has no PR — pullRequest.create off, or an install below */}}
{{/* github-provider-kog 0.3.0 where the chart's CRD guard renders none — resolves `url` to "" and */}}
{{/* Table.tsx:41-47 drops the handlers, leaving that row inert exactly as before. No dead cursor. */}}
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: kog-deliverables
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources: []
    {{/* Whole-placeholder → the value is used verbatim (Table.tsx:35,45), which is what lets a full
         https:// change-request URL survive. Rows with no PR yet resolve to "" and stay inert. */}}
    rowNavigateTo: '{url}'
    bordered: false
    size: small
    pagination:
      defaultPageSize: 15
    columns:
    - valueKey: restdef
      title: RestDefinition
    - valueKey: title
      title: Change request
    - valueKey: gvk
      title: Generated kind
    - valueKey: ready
      title: Ready
    - valueKey: pr
      title: Ref
    - valueKey: age
      title: Published
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ [ (.rows // [])[] | [ {valueKey:"restdef",kind:"jsonSchemaType",type:"string",stringValue:(.restdef // "")}, {valueKey:"title",kind:"jsonSchemaType",type:"string",stringValue:(.title // "")}, {valueKey:"gvk",kind:"jsonSchemaType",type:"string",stringValue:(.gvk // "—")}, {valueKey:"ready",kind:"tag",stringValue:(.ready // "In review"),color:(.readyColor // "orange")}, {valueKey:"pr",kind:"jsonSchemaType",type:"string",stringValue:(.pr // ""),color:"#8c8c8c"}, {valueKey:"age",kind:"jsonSchemaType",type:"string",stringValue:(.age // ""),format:"relative"}, {valueKey:"url",kind:"jsonSchemaType",type:"string",stringValue:(.url // "")} ] ] }'
  apiRef:
    name: kog-deliverables
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
