# Section title for the Tool servers block of /agents.
#
# `level: 2` — one step under the page H1 (paragraph.agents-title) and one step above the binding
# sub-section (paragraph.agents-servers-bindings-title, level 3). It used to be `strong: true`,
# which renders the same flat 26px/600 as the page title, so the reader had no way to tell the
# page from a section inside it. Levels rather than a size: the CRD has no font-size, and an
# unbroken h1 → h2 → h3 chain is what a screen reader walks to skip to this section.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-title
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: Tool servers
    level: 2
  resourcesRefs:
    items: []
