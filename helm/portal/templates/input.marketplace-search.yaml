{{/* #82 §0.1: the marketplace catalog search as a CR Input widget (queryParam-bound), so it sits INLINE */}}
{{/* with the facet controls (via flex.marketplace-category-group) instead of the frontend-chrome */}}
{{/* PageSearch that rendered on its own line above the grid. queryParam:q writes ?q= → request extras */}}
{{/* .q → the marketplace grid (blueprints-catalog RA) filters SERVER-SIDE by name/description — the exact */}}
{{/* mechanism PageSearch used. The '/marketplace' entry is removed from the frontend WidgetPage.PAGE_SEARCH */}}
{{/* map (shipped together with this) so the search isn't rendered twice. Mirrors input.blueprints-search */}}
{{/* (#75 §0.2); the inputs CRD is deployed and the Flex allowedResources enum includes "inputs" — no CRD */}}
{{/* change needed. */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-search
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    {{/* `name` is REQUIRED by the Input CRD schema (widgetData.required). With queryParam set the widget */}}
    {{/* renders as a standalone Input.Search and `name` is unused for the URL binding (queryParam drives */}}
    {{/* ?q=), but the field must be present or the CDC apply is rejected and the portal composition wedges. */}}
    name: q
    queryParam: q
    placeholder: Search the catalog by name or description…
    allowClear: true
    size: middle
  resourcesRefs:
    items: []
