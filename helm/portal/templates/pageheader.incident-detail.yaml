{{/* The /incidents/{namespace}/{name} page header: the incident title, its state pill (plus */}}
{{/* "Flagged" when the first precondition run exited 0), and the page's actions. The alert chip */}}
{{/* and the meta line are content, so they sit below it in incident-detail-header-block. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Incident
    tags:
    - label: Analyzing
      color: gray
    allowedResources:
    - flexes
    items:
    - resourceRefId: incident-detail-actions
  widgetDataTemplate:
    - forPath: title
      expression: '${ .title // "Incident" }'
    {{/* PageHeader takes its pills as one array; the RESTAction emits the whole shape. */}}
    - forPath: tags
      expression: '${ .headerTags // [ { label: "Analyzing", color: "gray" } ] }'
  resourcesRefs:
    items:
    - id: incident-detail-actions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-detail-actions
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
