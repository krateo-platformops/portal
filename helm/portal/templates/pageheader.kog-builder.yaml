# The /controller-builder page header — title and subtitle in one CR.
#
# Replaces four: flex.kog-builder-header plus the eyebrow, title and subtitle Paragraphs.
#
# THE EYEBROW IS GONE, and that is a deletion rather than a regression: Paragraph.tsx already
# returns null for `variant: eyebrow`, so "Platform · tenant …" has been rendering as nothing.
#
# No `counter` beside the title. The RestDefinition count belongs to kog-restdefinitions below,
# which shows readiness per row; a bare total in the header would be the same number twice, and
# the interesting question on this page is how many are READY, not how many exist.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: kog-builder-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Controller Builder
    subtitle: >-
      One row per RestDefinition — OpenAPI mappings compiled into new controllers, with readiness
      and the generated kind straight from their status
  resourcesRefs:
    items: []
