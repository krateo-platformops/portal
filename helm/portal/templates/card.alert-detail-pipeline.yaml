{{/* Frame for the pipeline walk. Titled, because it sits among other cards on this page and a reader */}}
{{/* scanning for "did this alert actually do anything" needs to find it without reading it first. */}}
{{/* */}}
{{/* RESTORES a CR that #149 referenced but never committed — see markdown.alert-detail-pipeline. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-detail-pipeline-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    variant: outlined
    title: What this alert actually does, hop by hop
    items:
    - resourceRefId: alert-detail-pipeline
  resourcesRefs:
    items:
    - id: alert-detail-pipeline
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-pipeline
      namespace: {{ .Release.Namespace }}
      resource: markdowns
      verb: GET
