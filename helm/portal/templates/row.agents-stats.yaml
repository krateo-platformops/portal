# The stat header — three cards across, above the tabs, mirroring the mockup's summary band.
#
# THREE, NOT THE MOCKUP'S FOUR. The mockup's fourth card is "NEEDS ATTENTION 6". That block
# was deliberately removed from this page (see the commit that dropped flex.agents-attention):
# health verdicts belong in Incidents, not on an inventory. A count of deviations is the same
# verdict in a smaller box, so re-adding it as a stat would walk that decision back.
#
# Row/Col rather than a Flex: `statistics` is in the Col allowedResources enum and the Row
# gives the three cards equal, responsive spans instead of content-width boxes.
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-stats
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - cards
    items:
    - resourceRefId: agents-stat-card-agents
      size: 8
    - resourceRefId: agents-stat-card-servers
      size: 8
    - resourceRefId: agents-stat-card-gateway
      size: 8
  resourcesRefs:
    items:
    - id: agents-stat-card-agents
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-stat-card-agents
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: agents-stat-card-servers
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-stat-card-servers
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: agents-stat-card-gateway
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-stat-card-gateway
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
