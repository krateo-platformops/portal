# The number on the Tool servers stat card. Fed by restaction.agents-servers, so it can never
# disagree with the section below it — both read the same resolved action.
kind: Statistic
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-stat-servers
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-servers
    namespace: {{ .Release.Namespace }}
  # A count of zero is a real answer, so the static fallback is 0 rather than a dash: an
  # unresolved action shows the card's own loading state, not a fabricated "none".
  widgetData:
    title: Tool servers
    value: 0
  widgetDataTemplate:
  - forPath: value
    expression: '${ .serverCount // 0 }'
  resourcesRefs:
    items: []
