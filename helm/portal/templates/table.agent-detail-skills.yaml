# One row per declarative.a2aConfig.skills[] entry.
#
# `id` is shown beside the human name because they are not interchangeable: the NAME is what a
# person reads and the ID is what an A2A caller addresses, and on this cluster they differ on every
# skill (krateo-platform-ops / "Krateo Platform Operations"). Showing only one of them leaves the
# reader unable to do the other's job.
#
# `What it does` is the skill's own description, clipped server-side to 150 characters — the string
# a peer agent actually matches a task against. It is clipped rather than wrapped because a Table
# cell is single-line here, and the full text is in the Manifest card at the bottom of the page
# along with the examples this table deliberately omits.
#
# Rows are INERT: a skill is not an object with a page, and a rowNavigateTo pointing nowhere is
# worse than no link.
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agent-detail-skills
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): the route params this widget's resolution varies by.
  keyExtras: [name, namespace]
  apiRef:
    name: agent-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    fitContent: true
    pagination:
      defaultPageSize: 20
      hideOnSinglePage: true
    columns:
    - valueKey: name
      title: Skill
    - valueKey: id
      title: id
    - valueKey: tags
      title: Tags
    - valueKey: description
      title: What it does
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: >-
      ${ [ (.skillRows // [])[]
      | [ { valueKey: "name",        kind: "jsonSchemaType", type: "string", stringValue: (.name // "") },
          { valueKey: "id",          kind: "jsonSchemaType", type: "string", stringValue: (.id // "—"), color: "var(--gray-color)" },
          { valueKey: "tags",        kind: "jsonSchemaType", type: "string", stringValue: (.tags // ""), color: "var(--gray-color)" },
          { valueKey: "description", kind: "jsonSchemaType", type: "string", stringValue: (.description // ""), color: "var(--gray-color)" } ] ] }
  resourcesRefs:
    items: []
