{{/* Right side of the alert-detail pagehead: the action button cluster. */}}
{{/* "Investigate with Autopilot" is now ONE affordance among plain Edit + Delete — Vincenzo's */}}
{{/* feedback (item F/G): opening an alert previously only offered "diagnose with Autopilot"; a real */}}
{{/* detail view gives direct lifecycle controls too. Buttons resolve their per-alert target from the */}}
{{/* alert-detail RA (.gvr) / the edit drawer, so this Flex itself is data-agnostic. Mirrors */}}
{{/* flex.composition-detail-actions. */}}
{{/* Pause or Resume, by the alert's krateo.io/paused annotation (alert-detail's .paused). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-detail-actions
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: alert-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    vertical: false
    gap: small
    align: center
    allowedResources:
      - buttons
    items:
      - resourceRefId: alert-detail-investigate
      - resourceRefId: alert-detail-edit
      - resourceRefId: alert-detail-pause
      - resourceRefId: alert-detail-delete
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ [ { resourceRefId: "alert-detail-investigate" }, { resourceRefId: "alert-detail-edit" },
             { resourceRefId: (if (.paused // false) then "alert-detail-resume" else "alert-detail-pause" end) },
             { resourceRefId: "alert-detail-delete" } ] }
  resourcesRefs:
    items:
      - id: alert-detail-investigate
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: alert-detail-investigate
        namespace: {{ .Release.Namespace }}
        resource: buttons
        verb: GET
      - id: alert-detail-edit
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: alert-detail-edit
        namespace: {{ .Release.Namespace }}
        resource: buttons
        verb: GET
      - id: alert-detail-pause
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: alert-detail-pause
        namespace: {{ .Release.Namespace }}
        resource: buttons
        verb: GET
      - id: alert-detail-resume
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: alert-detail-resume
        namespace: {{ .Release.Namespace }}
        resource: buttons
        verb: GET
      - id: alert-detail-delete
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: alert-detail-delete
        namespace: {{ .Release.Namespace }}
        resource: buttons
        verb: GET
