{{/* The alert that opened the incident, as inert text: used when the Alert no longer exists, so */}}
{{/* the name never becomes a broken link. */}}
kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-alert-text
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    label: 'Alert'
    variant: outlined
  widgetDataTemplate:
    - forPath: label
      expression: '${ "Alert: " + (.alertName // "") }'
  resourcesRefs:
    items: []
