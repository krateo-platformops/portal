{{/* #86 (fedepini): a thin one-item Flex around the catalog search. WHY it exists: the outer */}}
{{/* facet container is a Row (row.marketplace-filters-row) so the two slots get DETERMINISTIC */}}
{{/* 24-grid widths that don't collapse under flex-shrink — but Row.allowedResources has no */}}
{{/* `inputs`, only `flexes`. So the search Input rides inside this flex, which IS a valid Row */}}
{{/* child. The search fills this wrapper (and thus its span-6 column) at the column's left. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-search-wrap
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - inputs
    items:
    - resourceRefId: marketplace-search
  resourcesRefs:
    items:
    - id: marketplace-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-search
      namespace: {{ .Release.Namespace }}
      resource: inputs
      verb: GET
