# The /compositions/{namespace}/{name} page header — the composition's name, its health pill,
# the kind/namespace line and the page's six actions, in one CR.
#
# Replaces SIX: flex.composition-detail-header-block, flex.composition-detail-title-line,
# flex.composition-detail-title-stack, paragraph.composition-detail-header,
# tag.composition-detail-status and paragraph.composition-detail-subtitle. Same three-level Flex
# nest blueprint-detail had, on the busiest page in the portal.
#
# ACTIONS MOVE UP A ROW — they sat beside the subtitle on row two; PageHeader right-aligns them on
# the title line. The actions Flex is kept and referenced: it carries the SIX Buttons' order, and
# reshuffling them is not this migration's business.
#
# ONE COLOUR CHANGED: gold -> orange, which is byte-identical. tokens.ts gives gold and orange the
# same hex in both themes (#8A5C00 light, #FFAA00 dark); PageHeader's tags simply take names from a
# closed enum that has orange and not gold. The Degraded pill is unchanged. The Tag's STATIC
# `color: default` also becomes `gray` — `default` is not a palette key and is not in the enum —
# but the computed expression never emitted it, so only the pre-resolve placeholder differs.
#
# THE TWO TAG TEMPLATES BECOME ONE. Both ran the same branch over the same $c/$r prelude, once for
# `label` and once for `color`, so the pill's word and colour could drift apart under an edit.
# Evaluated once now. Verified branch-by-branch against the original: Degraded/orange,
# Unhealthy/red, Unknown/gray, Ready/green, NotReady/red.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-detail-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # All six absorbed CRs declared exactly [name, namespace] — no union to take, but carried
  # explicitly: without it one composition's header is served from another's cache cell.
  keyExtras: [name, namespace]
  apiRef:
    name: composition-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Composition
    subtitle: ""
    tags:
    - label: Unknown
      color: gray
    allowedResources:
    - flexes
    items:
    - resourceRefId: composition-detail-actions
  widgetDataTemplate:
    - forPath: title
      expression: '${ .detail.metadata.name // "composition" }'
    - forPath: subtitle
      expression: '${ (.detail.kind // "Composition") + " · " + (.detail.metadata.namespace // "?") + " · created " + ((.detail.metadata.creationTimestamp // "") as $ts | if ($ts | length) == 0 then "?" else ((now - ($ts | fromdateiso8601)) as $sec | if $sec < 60 then "just now" elif $sec < 3600 then ((($sec/60)|floor)|tostring) + "m ago" elif $sec < 86400 then ((($sec/3600)|floor)|tostring) + "h ago" else ((($sec/86400)|floor)|tostring) + "d ago" end) end) }'
    - forPath: tags
      expression: '${ (.detail.status.conditions // []) as $c | ($c | map(select(.type == "Ready")) | .[0]) as $r | [ ( if .workloadHealthy == false then (if ($r != null and $r.status == "True") then {label:"Degraded", color:"orange"} else {label:"Unhealthy", color:"red"} end) elif $r == null then {label:"Unknown", color:"gray"} elif $r.status == "True" then {label:"Ready", color:"green"} else {label:"NotReady", color:"red"} end ) ] }'
  resourcesRefs:
    items:
    - id: composition-detail-actions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: composition-detail-actions
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
