{{/* Compositions filter toolbar — the two facet-chip rows stacked on the LEFT and the search */}}
{{/* box on the RIGHT (#79 §0.1 + §0.2). This is the OUTER row: an align:center / */}}
{{/* justify:space-between Flex with exactly two children — [compositions-chip-stack, the */}}
{{/* vertical stack of scope + status chip rows] anchored left, and [compositions-search] */}}
{{/* anchored hard right and vertically centered against the chip stack. (Was: all three items */}}
{{/* — scope chips, status chips, search — on ONE space-between row, which shoved the status */}}
{{/* chips to the far edge.) The search box width is capped by the frontend (query-bound */}}
{{/* Input.Search, max-width 380) — there is no width field on the Input CR, so we only */}}
{{/* POSITION it right here. Decluttered to match the mockup: the time-range apparatus */}}
{{/* (compositions-range-chips + the comp-date-range RangePicker) was removed earlier so only */}}
{{/* search + the chip stack remain. Sits between the page header and the table in */}}
{{/* flex.page-compositions. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compositions-toolbar
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [namespace]
  widgetData:
    allowedResources:
    - flexes
    - inputs
    justify: space-between
    align: center
    gap: small
    wrap: true
    items:
    - resourceRefId: compositions-chip-stack
    - resourceRefId: compositions-search
  resourcesRefs:
    items:
    - id: compositions-chip-stack
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-chip-stack
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: compositions-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compositions-search
      namespace: {{ .Release.Namespace }}
      resource: inputs
      verb: GET
