{{/* Settings → "Add user" CTA. Navigates to the route-only /settings/users/new page, the same */}}
{{/* shape the clusters page uses for "Register cluster". */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: settings-user-create-cta
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    label: Add user
    type: primary
    icon: fa-plus
    clickActionId: settings-user-create-nav
    actions:
      navigate:
        - id: settings-user-create-nav
          path: /settings/users/new
          type: navigate
  resourcesRefs:
    items: []
