# The computed caption for the Involved-resources section: "3 objects — the report, the alert that
# triggered it, and 1 audit record. Server-side managedFields stripped; status kept."
#
# WHY A PARAGRAPH AND NOT THE CARD'S OWN SLOT. It was templated into Card `legend`, which is an
# ARRAY of {color,label} colour swatches — the reconciliation-rail treatment — not a subtitle. A
# string there fails snowplow's schema check at RESOLVE time, and because the static widgetData
# carried no `legend` at all, `kubectl apply --dry-run=server` passed: the CRD validates the static
# object, never the widgetDataTemplate's OUTPUT. The section rendered as "Error while rendering
# widget" on a live cluster while every gate was green.
#
# Card has no subtitle/description property (anchorId, clickActionId, cover, extra, extraRefId,
# extraStatus, extraVariant, footer, headerLeft, icon, items, legend, live, size, tags, title,
# titleVariant, tooltip, variant, watch, widgetActions). A Paragraph sibling inside the card's
# `items` is the pattern already used for a computed caption — see
# paragraph.agents-servers-matrix-legend.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-manifests-legend
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  # Static fallback: true of every incident and claims no specific count.
  widgetData:
    text: The custom resources this incident is made of.
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ .involvedManifestsDesc // "The custom resources this incident is made of." }'
  resourcesRefs:
    items: []
