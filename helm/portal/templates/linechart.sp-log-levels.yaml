{{- if (.Values.observability | default dict).snowplowSli }}
{{/* ERROR and WARN lines per bucket, parsed from the log body (SeverityText is empty until observability#54). */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-log-levels
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "ERROR": red
      "WARN": orange
    shapeField: smooth
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: (.level|tostring), v: (.n|tonumber) } ] }'
  apiRef:
    name: sp-log-levels
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
{{- end }}
