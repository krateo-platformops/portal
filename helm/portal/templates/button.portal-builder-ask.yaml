{{/* "Ask Autopilot →" header CTA on /portal-builder — the page's own entry into the builder */}}
{{/* flow. Unlike the empty-state hint strips this is ALWAYS visible: the change-request table below */}}
{{/* only lists in-flight work, so without it a returning user has no affordance to start a NEW */}}
{{/* build. Navigates to the page's ?ask= deep-link (the house one-shot Autopilot convention — */}}
{{/* the rail opens seeded with the builder prompt; urlquery does the encoding the RAs do */}}
{{/* with jq @uri). */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: portal-builder-ask
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    {{/* A4: ONE canonical label for the Autopilot entry point. Six CTAs carried three strings */}}
    {{/* ("Ask Autopilot →", "Investigate with Autopilot", "Diagnose with Autopilot") for the */}}
    {{/* same mechanism — a Button navigating to ?ask=<prompt>. "Ask Autopilot" describes what */}}
    {{/* the BUTTON does; the other two described what the page was about, which is the page's */}}
    {{/* job, not the label's. The trailing arrow went with them: it implied navigation away. */}}
    label: Ask Autopilot
    icon: fa-wand-magic-sparkles
    {{/* #84 §0.1: the page's primary CTA — a filled primary button (was an outlined default), a */}}
    {{/* comfortable middle size (was small), right-aligned via flex.portal-builder-ask-cta. */}}
    size: middle
    {{/* SECONDARY, and deliberately. This button navigates to ?ask=, and on an install where */}}
    {{/* Autopilot is not enabled the click produces a warning notice and strips the param — so */}}
    {{/* it cannot be the action a page ranks first. The composer route behind no feature flag */}}
    {{/* now holds that position; this stays as the other way IN to the same surface. */}}
    type: link
    clickActionId: portal-builder-ask
    actions:
      navigate:
        - id: portal-builder-ask
          type: navigate
          path: /portal-builder/compose?ask={{ "I want to build a new portal page with the Portal builder. Help me compose it from the widget catalog, preview the draft live in the portal, and publish it as a gated change request to the portal chart once I confirm." | urlquery }}
  resourcesRefs:
    items: []
