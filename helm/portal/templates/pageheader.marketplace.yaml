{{/* The /marketplace page header — title, the live count with its noun, and the subtitle, in one CR. */}}
{{/* */}}
{{/* Replaces FIVE: flex.marketplace-header (a vertical Flex), flex.marketplace-title-line (a */}}
{{/* baseline-aligned Flex inside it), paragraph.marketplace-eyebrow, paragraph.marketplace-title and */}}
{{/* paragraph.marketplace-count. */}}
{{/* */}}
{{/* THE COUNT KEEPS ITS NOUN, and that needed a widget change to do honestly. The old */}}
{{/* paragraph.marketplace-count rendered "(23 charts)" beside the title, and the noun is not */}}
{{/* decoration: restaction.blueprints-catalog computes it from the ACTIVE SOURCE FACET — */}}
{{/* "blueprints", "operators", or "charts" when the catalog is mixed. PageHeader's `counter` renders */}}
{{/* a bare "(23)", so migrating this page as-is would have replaced a sentence with a number and */}}
{{/* called it a cleanup. frontend#220 added `counterLabel` for exactly this, and 1.6.2 carries it. */}}
{{/* */}}
{{/* `count` is the FILTERED number — what the grid below actually shows — not `total`. That is the */}}
{{/* same value the Paragraph used, and the right one: a header that counts things the page is not */}}
{{/* showing is worse than no count. */}}
{{/* */}}
{{/* THE EYEBROW IS GONE — Paragraph.tsx returns null for `variant: eyebrow`. */}}
{{/* */}}
{{/* keyExtras carries all four facet keys from paragraph.marketplace-count. The title is invariant */}}
{{/* under them but the counter is not, and the cache key partitioning is not invariant at all: */}}
{{/* without them one facet's count is served for another's grid. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [category, q, source, sort]
  apiRef:
    name: blueprints-catalog
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Marketplace
    subtitle: The full blueprint and operator catalog, installable as governed compositions
  widgetDataTemplate:
    {{/* Was the number inside paragraph.marketplace-count's "(23 charts)". */}}
    - forPath: counter
      expression: '${ .count // 0 }'
    {{/* Was the noun inside the same brackets — it tracks the active source facet. */}}
    - forPath: counterLabel
      expression: '${ .countLabel // "charts" }'
  resourcesRefs:
    items: []
