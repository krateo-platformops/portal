{{/* Convention page root for /blueprints — PageHeader above the now-selectable */}}
{{/* blueprints catalog table. The nav (menu.sidebar-nav) points its `blueprints` ref here */}}
{{/* (was the bare table) so the page gains a header like compositions/dashboard. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-blueprints
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "tenant") }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - flexes
    - listies
    vertical: true
    {{/* P9: page-root section rhythm is one step, `middle`, across every nav-declared root. */}}
    {{/* This root previously declared its own value; see design/03-composition.md P9. */}}
    gap: middle
    items:
    - resourceRefId: blueprints-page-header
    {{/* #75 §0.2: category chips + search on one line (blueprints-filterbar), replacing the standalone */}}
    {{/* chips row + the frontend PageSearch above the grid. */}}
    - resourceRefId: blueprints-filterbar
    - resourceRefId: blueprints-grid
  resourcesRefs:
    items:
    - id: blueprints-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprints-page-header
      namespace: {{ .Release.Namespace }}
      resource: pageheaders
      verb: GET
    - id: blueprints-filterbar
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprints-filterbar
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: blueprints-grid
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprints-grid
      namespace: {{ .Release.Namespace }}
      resource: listies
      verb: GET
