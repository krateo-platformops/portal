# Access persona capability-preview section (#88 §0.6) — wraps access-preview's
# SAR table behind the same unified Card language as every other section-heavy
# detail page (titleVariant: eyebrow + variant: outlined), replacing the old
# bare "strong Paragraph label + secondary Paragraph desc" pair. No headerLeft
# subtext — title alone.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: access-preview-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [username]
  widgetData:
    title: What can this persona do?
    titleVariant: eyebrow
    variant: outlined
    items:
    - resourceRefId: access-preview
  resourcesRefs:
    items:
    - id: access-preview
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: access-preview
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
