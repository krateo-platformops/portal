{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Genuine apiserver fall-through against diagnostic hits — expect diagnostic to dominate (~8:1 since 1.12.4). */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-fallthrough
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "snowplow_apiserver_fallthrough_total": orange
      "snowplow_cache_diagnostic_total": cyan
    shapeField: smooth
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: (.series|tostring), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-fallthrough
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
{{- end }}
