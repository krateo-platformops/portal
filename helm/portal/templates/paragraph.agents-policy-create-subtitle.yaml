# NO BARE `spec.backend.ai` IN THIS TEXT. The renderer autolinks it — ".ai" reads as a TLD — so the
# first render put a blue hyperlink to a nonexistent site in the middle of the sentence. The
# role-to-block map is stated by grouping instead; the per-key detail lives in the Role field's own
# description, where it sits inside a form control rather than in prose.
#
# Static, and deliberately claims nothing about the cluster — the counts belong on the policies page
# where they are read. What this says instead is the one thing a reader needs BEFORE filling the
# form in: which spec block the Role field decides, because that is the field the rest depend on.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policy-create-subtitle
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      An AgentgatewayPolicy attaches to one Gateway, HTTPRoute or Service and carries one block of
      enforcement. Role picks which block — identity, limits, resiliency and cors all write under
      spec.traffic; guardrail and passthrough under spec.backend; observability under spec.frontend
      — and the JSON body is written under it.
    type: secondary
  resourcesRefs:
    items: []
