# Static, and deliberately claims nothing about the cluster — the counts belong on the policies page
# where they are read. What this says instead is the one thing a reader needs BEFORE filling the
# form in: which spec block the Role field decides, because that is the field the rest depend on.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policy-create-subtitle
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      An AgentgatewayPolicy attaches to one Gateway, HTTPRoute or Service and carries one block of
      enforcement. Role picks which block — identity writes spec.traffic, guardrail
      spec.backend.ai, limits and resiliency spec.traffic, observability spec.frontend, passthrough
      spec.backend, cors spec.traffic — and the JSON body is written under it.
    type: secondary
  resourcesRefs:
    items: []
