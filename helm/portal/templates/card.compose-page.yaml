{{/* CHART-P2 — the page composer, on the page rather than only in the rail. */}}
{{/* Composes a page from widgets that ALREADY exist and are already data-bound, rather than */}}
{{/* authoring new ones; see form.compose-page for why that distinction is the whole design. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: compose-page-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Compose a page
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - forms
    items:
    - resourceRefId: compose-page
  resourcesRefs:
    items:
    - id: compose-page
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: compose-page
      namespace: {{ .Release.Namespace }}
      resource: forms
      verb: GET
