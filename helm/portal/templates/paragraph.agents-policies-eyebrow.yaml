# Eyebrow for the /agents/policies pagehead. Sibling of paragraph.agents-eyebrow — same tenant
# stamp, so the two /agents surfaces read as one family.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policies-eyebrow
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: 'Agents · Policies · tenant {{ .Values.tenant | default "krateo-enterprise" }}'
    variant: eyebrow
  resourcesRefs:
    items: []
