# Settings page — the admin console, converted from the krateoplatformops-blueprints
# portal-admin-page (TabList → my antd Tabs; Column/Panel → tab content widgets).
# The genuinely-admin tabs: Krateo status + Users (Access merged into Users — same
# clientconfig-Secret dataset, same persona drill-down; Blueprints and Compositions
# already have their own nav pages; FinOps dropped). Each tab's content resolves
# through resourcesRefs, rendered by the Tabs widget's nested WidgetRenderer.
# #88 §0.1: no per-tab `title:` — matches tabs.obs-main's leaner tile look (the
# `title` field rendered an extra heading line under the tab strip).
kind: Tabs
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: settings-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
      - tables
    items:
      - label: Krateo
        resourceRefId: settings-krateo-status
      - label: Users
        resourceRefId: settings-users
  resourcesRefs:
    items:
      - id: settings-krateo-status
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: settings-krateo-status
        namespace: {{ .Release.Namespace }}
        resource: tables
        verb: GET
      - id: settings-users
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: settings-users
        namespace: {{ .Release.Namespace }}
        resource: tables
        verb: GET
