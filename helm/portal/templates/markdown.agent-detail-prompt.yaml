# The systemMessage, verbatim, inside a code fence.
#
# THE FENCE IS FOUR BACKTICKS, NOT THREE. A prompt is prose written for a model, and prose written
# for a model routinely contains a ```-fenced example of the output it should produce; a three-
# backtick fence would end at that inner fence and render the remainder of the agent's instructions
# as live Markdown — headings, lists and all — which both mangles the text and quietly hides part of
# it. CommonMark closes a fence only on a run at least as long as the opening one, so four contains
# three. (It does not contain four, which no live prompt uses.)
#
# A CODE FENCE, not a Paragraph: the text is whitespace-significant (the Go template's include()
# lines and the k8s-agent prompt's "## Deterministic first pass" section both depend on their line
# breaks), and a Paragraph would collapse it into a wall. `allowCopy` is on because the realistic
# thing to do with a prompt is paste it somewhere to diff it against the one you meant to ship.
#
# No `${ }` interpolation around the value beyond the fence itself — the prompt is user-authored
# text and is rendered as data, never spliced into a larger Markdown structure that its own
# characters could then reshape.
kind: Markdown
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agent-detail-prompt
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): the route params this widget's resolution varies by.
  keyExtras: [name, namespace]
  apiRef:
    name: agent-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    markdown: ""
    allowCopy: true
  widgetDataTemplate:
  - forPath: markdown
    expression: '${ ((.prompt.systemMessage // "") | rtrimstr("\n")) as $p | if $p == "" then "" else ("````text\n" + $p + "\n````") end }'
  resourcesRefs:
    items: []
