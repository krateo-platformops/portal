{{/* SAYS WHOSE WORK THIS IS. The feed is cross-builder by design — restaction.builder-prs lists  */}}
{{/* portal, blueprint and API-mapping publishes alike — and nothing on screen said so, leaving a */}}
{{/* returning author to infer it from the Repo column while hunting for their own page.          */}}
{{/*                                                                                             */}}
{{/* The three destinations are restaction.builder-prs's `url`: the PR, the failed LocalResource, */}}
{{/* and — for a Portal/Blueprint publish that merged with nothing registered yet — the Register */}}
{{/* form. A closed PR the provider cannot call merged also goes there, and says "Register if     */}}
{{/* merged" in its own row; the note states the plain case.                                     */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: builder-change-requests-note
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      Every publish from the Portal, Blueprint and Controller builders. A row opens the change
      request on your git host; a failed publish opens the object that failed, and a merged page
      set or blueprint opens the form that registers it.
  resourcesRefs:
    items: []
