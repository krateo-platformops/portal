{{/* SAYS WHOSE WORK THIS IS. The feed is cross-builder by design — restaction.builder-prs lists  */}}
{{/* portal, blueprint and API-mapping publishes alike — and nothing on screen said so, leaving a */}}
{{/* returning author to infer it from the Repo column while hunting for their own page.          */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: builder-change-requests-note
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      Every publish from the Portal, Blueprint and Controller builders. A row opens the change
      request on your git host; a failed publish opens the object that failed.
  resourcesRefs:
    items: []
