{{- if or (eq ((.Values.marketplace | default dict).source | default "configmap") "external") (include "portal.catalogLiveEnabled" .) }}
{{/* External Endpoint for the krateo-blueprints Helm repos. Rendered when marketplace.source=external */}}
{{/* (the one-release rollback path: every catalog step reads the repos through it) and when */}}
{{/* marketplace.liveIndex is on (the default): the blueprint RESTActions then read the live blueprints */}}
{{/* index beside the ConfigMap (portal.catalogLiveStep, _catalog.tpl), so a blueprint published after */}}
{{/* the ConfigMap was rendered still gets its card. Set liveIndex to false for a portal with no */}}
{{/* runtime dependency on the external Pages host: the Secret is then not rendered. */}}
{{/* snowplow's RESTAction `endpointRef` resolves an Endpoint from a Secret keyed by `server-url` (the */}}
{{/* only REQUIRED field; token/ca/etc. optional). Requires snowplow >= 1.4.0 (external-fetch YAML->JSON). */}}
apiVersion: v1
kind: Secret
metadata:
  name: blueprints-endpoint
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
type: Opaque
stringData:
  server-url: {{ include "portal.blueprintsServerUrl" . }}
{{- end }}
