{{- if eq ((.Values.marketplace | default dict).source | default "configmap") "external" }}
# LEGACY external Endpoint for the blueprints helm-repo index — rendered ONLY when
# marketplace.source=external (the one-release rollback path). The default (configmap) reads the
# catalog from the in-cluster ConfigMap the krateo-marketplace-catalog composition renders, so no
# external Endpoint exists and there is no runtime dependency on an external Pages host.
# snowplow's RESTAction `endpointRef` resolves an Endpoint from a Secret keyed by `server-url` (the
# only REQUIRED field; token/ca/etc. optional). Requires snowplow >= 1.4.0 (external-fetch YAML->JSON).
apiVersion: v1
kind: Secret
metadata:
  name: blueprints-endpoint
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
type: Opaque
stringData:
  server-url: https://krateo-blueprints.github.io
{{- end }}
