# Subtitle for the /agents/policies pagehead — the ONLY place the page states its own size, so a
# reader knows the shape before scrolling. Every number is server-side (agents-policies aggregates);
# nothing here is a hardcoded count that could drift when the gateway chart adds a policy.
#
# Like paragraph.agents-subtitle it says WHERE the data comes from, and for the same reason: these
# values are the live spec of the running policies, not the chart defaults someone remembers.
#
# THIS PARAGRAPH IS ALSO THE PAGE'S ERROR CHANNEL, because "not readable" must never render as "not
# there". The agents-policies RESTAction declares continueOnError + errorKey on both steps and
# EXPORTS the outcome (policiesReadable / routesReadable); the three branches below are what makes
# those keys mean something on screen:
#   * policiesReadable=false — the list itself failed (403, 5xx, apiserver down). The page has
#     nothing, and says so. It must never fall through to the count sentence, which would report a
#     failed read as "0 policies" and the gateway as enforcing nothing.
#   * total=0 with a readable list — genuinely ambiguous, and not fixable in jq: snowplow's
#     userAccessFilter refilter DROPS items for a caller without the grant (refilter.go
#     applyUserAccessFilterOnPig) without raising an error, so an ungranted tenant and an empty
#     cluster produce the identical payload. The sentence therefore names both readings instead of
#     asserting the alarming one.
#   * routesReadable=false — policies render fine, but the URL space each one governs is missing
#     from every "Attached to" cell. Said once here rather than 29 times in the table.
#
# The tests below are `== false`, NOT `(.x // true) == false`: jq's `//` treats FALSE as absent, so
# `false // true` is `true` and the alternative-operator form silently never fires — which is how a
# declared-but-unread errorKey looks from the outside. `null == false` is false, so a payload from
# before these keys existed still falls through to the count sentence.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policies-subtitle
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-policies
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: ' '
    type: secondary
  widgetDataTemplate:
  - forPath: text
    expression: >-
      ${ (.total // 0) as $n | (.roleCount // 0) as $r | (.gatewayCount // 0) as $g
      | (.routeCount // 0) as $rt | (.serviceCount // 0) as $sv | (.selectorCount // 0) as $sel
      | if .policiesReadable == false then
      "AgentgatewayPolicy could not be read on this cluster, so this page is showing nothing — it is not proving that nothing is enforced. The gateway may well be enforcing every policy it always did. Check that your account may list agentgateway.dev/agentgatewaypolicies, then reload."
      elif $n == 0 then
      "No AgentgatewayPolicy is visible here — either none is installed on this cluster, or your account cannot list agentgateway.dev/agentgatewaypolicies. Krateo cannot tell the two apart: a caller without the grant is served an empty list, not an error. Confirm your grant before concluding the gateway enforces nothing."
      else ($n|tostring) + (if $n == 1 then " policy" else " policies" end)
      + " in " + ($r|tostring) + (if $r == 1 then " role" else " roles" end)
      + ", attached to " + ($g|tostring) + (if $g == 1 then " gateway" else " gateways" end)
      + ", " + ($rt|tostring) + (if $rt == 1 then " route" else " routes" end)
      + " and " + ($sv|tostring) + (if $sv == 1 then " backend service" else " backend services" end)
      + (if $sel > 0 then "; " + ($sel|tostring) + (if $sel == 1 then " policy also attaches" else " policies also attach" end) + " by label selector, whose targets are not counted here" else "" end)
      + ". Every value below is read from the live AgentgatewayPolicy resources, not from the chart that shipped them."
      + (if .routesReadable == false then " HTTPRoutes could not be read, so the URL space each policy governs is missing from the rows below — the attachments shown are the policies' own targetRefs." else "" end)
      end }
  resourcesRefs:
    items: []
