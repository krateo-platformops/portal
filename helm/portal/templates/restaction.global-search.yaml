# Global search aggregator — feeds the header Search field's results view.
# Returns a unified list of compositions + blueprints + clusters + incidents whose
# title matches the search term `q` (the placeholder promises "resources", so the
# scope spans every top-level entity, not just compositions/blueprints), which the
# frontend forwards as ?extras={"q":"..."} on the
# widget /call. The term is read in the top-level `spec.filter` — snowplow
# >= 1.1.0 (extras-to-widgets / PR #27, Fix-1) forwards request `extras` into a
# widget's apiRef RESTAction jq dict. Filtering is server-side (jq) because the
# k8s API has no free-text search; UAF prunes to what the caller may list.
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: global-search
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    # compositions — discover composition CRDs, then list each cluster-wide
    # (mirrors compositions-list).
    - name: crds
      path: /apis/apiextensions.k8s.io/v1/customresourcedefinitions
      verb: GET
      filter: "[.crds.items[] | select(.spec.group == \"composition.krateo.io\") | {plural: .status.acceptedNames.plural, version: ((([.spec.versions[] | select(.served and .storage)])[0]) // (([.spec.versions[] | select(.served)])[0])).name}]"
      continueOnError: true
      errorKey: crdsError
    - name: comps
      dependsOn:
        name: crds
        iterator: ".crds"
      path: ${ "/apis/composition.krateo.io/" + (.version) + "/" + (.plural) }
      verb: GET
      continueOnError: true
      errorKey: compsError
      userAccessFilter:
        verb: list
        group: composition.krateo.io
        resourcesFrom: "[ (.crds // [])[] | .plural ]"
        namespaceFrom: .metadata.namespace
      filter: >
        [.comps.items[]? | {name: .metadata.name, ns: .metadata.namespace}]
    # blueprints — the INSTALLABLE catalog from the helm index (mirrors
    # blueprints-catalog), so search finds installable blueprints, not just installed ones.
    # Requires snowplow >= 1.4.0 (external YAML fetch). Each entry's version list is newest
    # -first → .value[0]. continueOnError so a missing index degrades to compositions-only.
    {{- include "portal.catalogStep" (dict "ctx" $ "name" "catalog" "index" "blueprints") | nindent 4 }}
      filter: >
        [ ((.catalog.entries) // {}) | to_entries[] | .value[0]
          | {name: .name, category: (((.annotations // {})["krateo.io/category"]) // (.keywords[0]) // "uncategorized")} ]
    # installed CompositionDefinitions — used to decide a blueprint hit's destination: already
    # on the cluster → open its DETAIL page; only installable → the Marketplace (spotlighted).
    - name: compdefs
      path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
      verb: GET
      continueOnError: true
      errorKey: compdefsError
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: compositiondefinitions
        namespaceFrom: .metadata.namespace
      filter: '[.compdefs.items[]? | {name: .metadata.name, ns: .metadata.namespace}]'
    # clusters — registered KubernetesTargets (the fleet), so search finds a spoke by name.
    # UAF prunes to what the caller may list; continueOnError so no-RBAC / no-spokes degrades.
    - name: clusters
      path: /apis/core.krateo.io/v1alpha1/kubernetestargets
      verb: GET
      continueOnError: true
      errorKey: clustersError
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: kubernetestargets
        namespaceFrom: .metadata.namespace
      filter: '[.clusters.items[]? | {name: .metadata.name, ns: .metadata.namespace}]'
    # incidents — TroubleshootingReports (observability), namespaced in the release namespace
    # (mirrors incidents-list). Searchable title = the rootCause one-liner with honest fallbacks.
    - name: incidents
      path: /apis/observability.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/troubleshootingreports
      verb: GET
      continueOnError: true
      errorKey: incidentsError
      filter: >
        [.incidents.items[]? | {
          name: .metadata.name,
          ns: "{{ .Release.Namespace }}",
          title: (if (.status.rootCause.statement // "") != "" then .status.rootCause.statement
                  elif (.spec.alertName // "") != "" then ("Investigation — " + .spec.alertName)
                  else (.metadata.name // "") end)
        }]
  # Merge both sources into one result list, then filter by the `q` extra
  # (case-insensitive substring on the title). Empty/absent q → return all.
  filter: >
    (.q // "" | ascii_downcase) as $q
    | [ (.compdefs // [])[] | .name ] as $instNames
    | {
        q: (.q // ""),
        items: (
          [ (.comps // [])[] | {
              title: (.name // ""),
              subtitle: ("Composition · " + (.ns // "")),
              type: "composition",
              link: ("/compositions/" + (.ns // "") + "/" + (.name // ""))
            } ]
          + [ (.compdefs // [])[] | {
              title: (.name // ""),
              subtitle: "Blueprint · installed",
              type: "blueprint",
              installed: true,
              link: ("/blueprints/" + (.ns // "") + "/" + (.name // ""))
            } ]
          + [ (.catalog // [])[] | .name as $cn | select(any($instNames[]; . == $cn) | not) | {
              title: ($cn // ""),
              subtitle: ("Blueprint · " + (.category // "")),
              type: "blueprint",
              installed: false,
              link: ("/marketplace?q=" + ($cn // "") + "&spotlight=" + ($cn // ""))
            } ]
          + [ (.clusters // [])[] | {
              title: (.name // ""),
              subtitle: ("Cluster · " + (.ns // "")),
              type: "cluster",
              link: ("/clusters/" + (.name // ""))
            } ]
          + [ (.incidents // [])[] | {
              title: (.title // .name // ""),
              subtitle: ("Incident · " + (.ns // "")),
              type: "incident",
              link: ("/incidents/" + (.ns // "") + "/" + (.name // ""))
            } ]
        )
        | map(select($q == "" or ((.title | ascii_downcase) | contains($q))))
      }
