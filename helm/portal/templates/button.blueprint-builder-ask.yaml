# "Ask Autopilot →" header CTA on /blueprint-builder — the page's SOLE entry into the authoring
# flow (the redundant hint strip was removed; the three builder pages now share this single CTA).
# Always visible, so there is always a way to start the next blueprint. Carries the ?ask= deep-link
# and prompt text, encoded here with urlquery instead of the RA's jq @uri.
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-builder-ask
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    label: Ask Autopilot →
    icon: fa-wand-magic-sparkles
    # #84 §0.1: the page's primary CTA — a filled primary button (was an outlined default), a
    # comfortable middle size (was small), right-aligned via flex.blueprint-builder-ask-cta.
    size: middle
    type: primary
    clickActionId: blueprint-builder-ask
    actions:
      navigate:
        - id: blueprint-builder-ask
          type: navigate
          path: /blueprint-builder?ask={{ "I want to author a new blueprint (a Helm chart) with the Blueprint builder. Help me define its Chart.yaml, values.yaml, values.schema.json and templates, preview it with previewBlueprint, and publish it via a gated change request to the blueprints repo once I confirm." | urlquery }}
  resourcesRefs:
    items: []
