# REMEDIATION AUDIT LOG table (feature #7) — the audit trail of gated mutations against THIS
# incident's target resource(s), off restaction.incident-auditrecords. Columns: actor (human/agent
# identity), verb (POST/PUT/PATCH/DELETE, uppercased), resource (group/resource/name · namespace),
# result (OK/FAILED + HTTP status, colour-coded), when (relative age). Table is an EXISTING widget
# kind, so no new widget CRD. Rows are inert (no rowNavigateTo) — this is a read-only receipt.
#
# The page includes this only when there ARE records (incident-auditrecords .hasRecords), so an
# incident with no recorded actions never shows an empty audit section (exception-only convention).
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-auditrecords
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    columns:
    - valueKey: actor
      title: Actor
    - valueKey: verb
      title: Verb
    - valueKey: resource
      title: Resource
    - valueKey: result
      title: Result
    - valueKey: timestamp
      title: When
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ [ (.rows // [])[] | [ {valueKey:"actor",kind:"jsonSchemaType",type:"string",stringValue:(.actor // "")}, {valueKey:"verb",kind:"jsonSchemaType",type:"string",stringValue:(.verb // "")}, {valueKey:"resource",kind:"jsonSchemaType",type:"string",stringValue:(.resource // ""),color:"#8c8c8c"}, {valueKey:"result",kind:"jsonSchemaType",type:"string",stringValue:(.result // ""),color:(.resultColor // "#8c8c8c")}, {valueKey:"timestamp",kind:"jsonSchemaType",type:"string",stringValue:(.timestamp // ""),color:"#8c8c8c"} ] ] }'
  apiRef:
    name: incident-auditrecords
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
