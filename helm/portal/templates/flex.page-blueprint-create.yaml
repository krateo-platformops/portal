{{/* Convention page root for the templated create route /marketplace/{namespace}/{name}/new */}}
{{/* (nav item `page: blueprint-create` → resource `flexes`, name `page-<slug>`). */}}
{{/* */}}
{{/* Renders the ONE generic create Form (forms/blueprint-create) for every blueprint. */}}
{{/* The blueprint identity (namespace/name) arrives via ?extras and flows to the form's */}}
{{/* apiRef (blueprint-formdef), which discovers the composition CRD from the */}}
{{/* CompositionDefinition status and feeds its schema to the form. No per-blueprint form. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-blueprint-create
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/nav-order": "910"
    "krateo.io/nav-path": "/blueprints/{namespace}/{name}/new"
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    allowedResources:
      - pageheaders
      - cards
      - steps
    vertical: true
    {{/* P9: one section step across every nav-declared page root — see G10, the gap between
         sections is frame and stays thin. */}}
    gap: middle
    items:
      - resourceRefId: blueprint-create-page-header
      - resourceRefId: create-wizard
      {{/* The Form is now wrapped in an outlined "Configuration" Card (create-form-card) */}}
      {{/* so it reads as a bounded panel under the stepper, not an edge-to-edge band. */}}
      - resourceRefId: create-form-card
  resourcesRefs:
    items:
      - id: blueprint-create-page-header
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-create-page-header
        namespace: {{ .Release.Namespace }}
        resource: pageheaders
        verb: GET
      - id: create-wizard
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: create-wizard
        namespace: {{ .Release.Namespace }}
        resource: steps
        verb: GET
      - id: create-form-card
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: create-form-card
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
