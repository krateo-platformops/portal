{{/* "Incidents" card: this alert's incidents (alert-detail-incidents), every open one first, then */}}
{{/* the latest ended ones. Several can be open at once, one per problem the alert-provider tells */}}
{{/* apart. The page Flex includes the card only when sections.incident is true (the alert has any). */}}
{{/* To start an investigation, use "Investigate with Autopilot" in the page header. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-alert-detail-incident
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: alert-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Incidents
    titleVariant: eyebrow
    variant: outlined
    items:
      - resourceRefId: alert-detail-incidents
  widgetDataTemplate:
    - forPath: title
      expression: '${ .incidentsTitle // "Incidents" }'
  resourcesRefs:
    items:
      - id: alert-detail-incidents
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: alert-detail-incidents
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
