{{/* "Latest incident" card: the back-link to this alert's newest Incident. The page Flex */}}
{{/* includes it only when sections.incident is true (the alert has one). To start an */}}
{{/* investigation, use "Investigate with Autopilot" in the page header. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-alert-detail-incident
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    title: Latest incident
    titleVariant: eyebrow
    variant: outlined
    items:
      - resourceRefId: alert-detail-incident-link
  resourcesRefs:
    items:
      - id: alert-detail-incident-link
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: alert-detail-incident-link
        namespace: {{ .Release.Namespace }}
        resource: buttons
        verb: GET
