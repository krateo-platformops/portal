{{/* Frame for the stuck-create warning. */}}
{{/* */}}
{{/* It exists because a Flex CANNOT hold an Alert: `alerts` is absent from the Flex */}}
{{/* allowedResources enum (verified — apply --dry-run=server rejects it outright), while Card has no */}}
{{/* allowedResources gate at all. Every other Alert in this chart is wrapped the same way */}}
{{/* (card.agent-create-gateway-card, card.agents-policy-ownership-card). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: resource-detail-create-pending-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [namespace, group, version, plural, name]
  widgetData:
    variant: borderless
    items:
    - resourceRefId: resource-detail-create-pending
  resourcesRefs:
    items:
    - id: resource-detail-create-pending
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: resource-detail-create-pending
      namespace: {{ .Release.Namespace }}
      resource: alerts
      verb: GET
