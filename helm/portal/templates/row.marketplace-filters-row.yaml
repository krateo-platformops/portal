{{/* #86 (fedepini): the Marketplace facet "global-container" as a Row (NOT a Flex) so the two slots */}}
{{/* get DETERMINISTIC 24-grid widths. A plain Flex could not bound the search — the wide 40-chip */}}
{{/* category block squeezed it to flex-shrink min (~99px) or forced a wrap onto its own line. A Row */}}
{{/* uses antd Col spans (percentage widths, no shrink), so (item ORDER = column order, left→right): */}}
{{/* category-group LEFT  = size 18 (≈ 75%, category chips wrap INSIDE the column) */}}
{{/* search-wrap    RIGHT = size 6  (≈ 25%) */}}
{{/* alignment: middle vertically centres the (short) search against the full-height 3-line block. */}}
{{/* fedepini follow-up (comment 5142807677): sides swapped — filters block LEFT, search bar RIGHT. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-filters-row
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - flexes
    alignment: middle
    items:
    - resourceRefId: marketplace-category-group
      size: 18
    - resourceRefId: marketplace-search-wrap
      size: 6
  resourcesRefs:
    items:
    - id: marketplace-search-wrap
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-search-wrap
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: marketplace-category-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-category-group
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
