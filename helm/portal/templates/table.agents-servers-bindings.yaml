# Who may call what — one row per (agent, tool server) binding, from restaction.agents-servers.
#
# THIS IS NOT A MATRIX, AND IT CANNOT BE. The widget set has no matrix/heatmap/pivot kind (verified
# against the live CRDs: the 41 widgets.templates.krateo.io kinds include tables, descriptions,
# cards, listies, charts — nothing two-dimensional). A Table could fake a matrix only by declaring
# one column per server, and `columns` is static widgetData — so that would bake THIS cluster's nine
# server names into the chart and render blank or wrong columns anywhere else. One row per binding
# is the truthful shape: it is exactly the join that exists in the data (agents[].spec.declarative
# .tools[] of type McpServer, each naming one RemoteMCPServer), it needs no schema change per
# cluster, and it has room for the per-binding facts a matrix cell could never hold — the tool
# names and the HITL count.
#
# `Bound` vs `Currently served` IS NOT AN ERROR REPORT. kagent keeps only the tool names the server
# actually discovers, so an agent may legitimately bind a superset. Three live examples, all
# deliberate: clickstack-agent and incident-agent bind BOTH run_select_query and run_query on
# clickhouse-mcp-server because mcp-clickhouse renamed the tool between <=0.4 and 0.5.0 and the
# binding must work across both; and the bench snapshot servers (itbench-snapshot) deliberately
# serve a read-only subset, so k8s-agent-bench binds 20 and 8 are served. Rendering the difference
# as red would flag the correct configuration as broken. Both numbers are plain text, uncoloured,
# and the note under the table says why they differ.
#
# `Currently served` renders "—", not 0, when the server has published no discoveredTools at all —
# a server that has not finished discovery must not make every one of its consumers look empty. It
# also reads "—" for a ref whose kind is not RemoteMCPServer (the row is labelled with that kind:
# this section inventories RemoteMCPServers, so it will not pretend to know what another kind
# serves) and for a ref that omits toolNames, where Bound reads "—" and Tools "not specified"
# rather than an unearned 0 and a blank cell. When the Agent list itself did not answer, the table
# is ONE row saying so — never an empty table, which would read as "no agent binds anything".
#
# Sorted by server then agent so the section reads as "for each server, its consumers", which is
# the question the Tool servers section is asked. defaultPageSize 50 + hideOnSinglePage keeps the
# whole join on one page on a normal cluster (37 bindings on krateo-057) — this table is standing
# in for a matrix, and a matrix split across pages answers nothing.
#
# The `tools` cell — the list of tool names, the one thing a matrix cell could never hold — is muted
# with `var(--gray-color)`, NOT a hex. A cell colour lands in the span's inline style, so a hex is
# frozen against ONE background while the portal has two: the #8c8c8c that used to sit here measured
# 3.25:1 on the light surface (#FBFBFB) against WCAG AA's 4.5:1, so the widest and most specific
# column in the section was unreadable in light mode. No hex satisfies both themes at once
# (table.agents-list carries the luminance arithmetic); the token is re-emitted per mode by
# cssVariables() and measures 6.46:1 light / 7.04:1 dark.
#
# Bound / Currently served / HITL stay LEFT-aligned. The SPA right-aligns a column only when every
# value in it is numeric (tableSorting.ts; there is no `align` on the Table CRD), and all three
# carry "—" for states that are NOT zero — a binding that names no tools, a server that has
# published no discoveredTools, a ref of another kind — plus "not readable" when a list did not
# answer. Those dashes are the distinctions the header above spends four paragraphs protecting;
# collapsing them into 0 to buy a right edge would print numbers the cluster never said.
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-bindings
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    fitContent: true
    pagination:
      defaultPageSize: 50
      hideOnSinglePage: true
    columns:
    - valueKey: server
      title: Tool server
    - valueKey: agent
      title: Agent
    - valueKey: bound
      title: Bound
    - valueKey: served
      title: Currently served
    - valueKey: approvals
      title: HITL
    - valueKey: tools
      title: Tools
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ [ (.bindings // [])[] | [ {valueKey:"server",kind:"jsonSchemaType",type:"string",stringValue:(.server // "—")}, {valueKey:"agent",kind:"jsonSchemaType",type:"string",stringValue:(.agent // "—")}, {valueKey:"bound",kind:"jsonSchemaType",type:"string",stringValue:(.bound // "—")}, {valueKey:"served",kind:"jsonSchemaType",type:"string",stringValue:(.served // "—")}, {valueKey:"approvals",kind:"jsonSchemaType",type:"string",stringValue:(.approvals // "—")}, {valueKey:"tools",kind:"jsonSchemaType",type:"string",stringValue:(.tools // "—"),color:"var(--gray-color)"} ] ] }'
  apiRef:
    name: agents-servers
    namespace: {{ .Release.Namespace }}
  resourcesRefs:
    items: []
