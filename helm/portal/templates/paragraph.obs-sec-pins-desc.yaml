{{/* Observability → Components, second section header — obs-sec-pins-desc. */}}
{{/* Says where the pin actually moves, because the table has no action on it and a reader */}}
{{/* should not be left hunting for one. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-sec-pins-desc
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: "The versions the platform declares, from the Installer. Compare with the running image above — a component whose declared version has moved but whose image has not is a migration that stalled. Versions change by release: edit the installer chart's component pins and upgrade."
    type: secondary
  resourcesRefs:
    items: []
