{{/* "Your drafts" on /controller-builder — the caller's controller draft records */}}
{{/* (restaction.my-drafts, draft-controller-<owner>-<slug>). */}}
{{/* */}}
{{/* card.blueprint-builder-drafts, with the kind changed and nothing else: the same copy, the */}}
{{/* same two lists (open, then published) and the same closing note, because a controller is */}}
{{/* a chart authored in the same kind of composer and its record keeps the whole tree the */}}
{{/* same way. The builders are meant to read as one product; a card that said something */}}
{{/* different here would be the first place they did not. */}}
{{/* */}}
{{/* The Card reads the RA itself only for its count, so it declares the caller's identity for the */}}
{{/* same reason the lists do: the count is of THIS person's drafts, keyed to them. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: controller-builder-drafts-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  identityContext: [username]
  apiRef:
    name: my-drafts
    namespace: {{ .Release.Namespace }}
  widgetData:
    title: Your drafts
    headerLeft: Saved as you work. A closed tab or a crash loses nothing — resume any draft here.
    extra: only you see these
    variant: outlined
    allowedResources:
      - listies
      - paragraphs
    items:
      - resourceRefId: my-drafts-controller
      - resourceRefId: my-drafts-controller-published
      - resourceRefId: drafts-no-timer-note
  widgetDataTemplate:
    - forPath: extra
      expression: '${ ([(.items // [])[] | select(.kind == "controller")] | length) as $n | "\($n) draft\(if $n == 1 then "" else "s" end) · only you see these" }'
  resourcesRefs:
    items:
      - id: my-drafts-controller
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: my-drafts-controller
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
      - id: my-drafts-controller-published
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: my-drafts-controller-published
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
      - id: drafts-no-timer-note
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: drafts-no-timer-note
        namespace: {{ .Release.Namespace }}
        resource: paragraphs
        verb: GET
