{{/* Tenant brand theme (Brand v2, issue #49 §7). A SIDE-EFFECT widget mounted once on the */}}
{{/* app-shell (layout.app-shell `effects` slot): it applies tenant brand overrides app-wide by */}}
{{/* setting CSS custom properties on :root, and renders no UI. */}}
{{/* */}}
{{/* The DEFAULT ships NO overrides, so the frontend's own default style applies (since 2026-11-06 */}}
{{/* the Agentiko style: violet primary, black sidebar, Syne). It used to ship `token.fontFamily` set */}}
{{/* to the then-default Inter stack — a no-op while Inter was the default, but inline on :root it */}}
{{/* would now pin the whole portal to Inter over Syne, so it was removed. It deliberately does NOT */}}
{{/* set `custom.sidebar`: the rail is the frontend default. `custom.sidebar` remains available as */}}
{{/* the issue-#52-sanctioned override for a tenant that wants a rail colour of its own. */}}
{{/* `colorPrimary` is deliberately NOT set here (it is mode-aware in the frontend; a mode-fixed CR */}}
{{/* value would regress that). Only Tier-1 tokens are overridable; Tier-2 (status colours, agent */}}
{{/* Signal Yellow, focus ring, chart palette) is locked by omission from the schema. */}}
kind: Theme
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: app-theme
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Empty on purpose: the widget is still mounted, so a tenant overrides by adding keys here. */}}
  widgetData: {}
