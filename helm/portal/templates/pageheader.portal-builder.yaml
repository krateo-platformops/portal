{{/* The /portal-builder page header — title and subtitle in one CR. */}}
{{/* */}}
{{/* Replaces four: flex.portal-builder-header plus the eyebrow, title and subtitle Paragraphs. */}}
{{/* */}}
{{/* THE EYEBROW IS GONE, and that is a deletion rather than a regression: Paragraph.tsx already */}}
{{/* returns null for `variant: eyebrow`, so that line has been rendering as nothing. */}}
{{/* */}}
{{/* No actions in the header: portal-builder-ask-cta below IS the entry point (the Autopilot prompt */}}
{{/* itself), so a header button would be a second door onto the same room. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: portal-builder-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* NO COUNTER. It read "N drafts in progress" from preview-drafts, every author's previews */}}
  {{/* at once. Drafts now have owners, and "Your drafts" below says how many are yours in its own */}}
  {{/* header, beside the rows it counts (the approved mockup's header carries none); a second */}}
  {{/* count up here would need the caller's identity for a number already on the page. */}}
  widgetData:
    title: Portal Builder
    {{/* NAMES THE MEDIUM, THE GUARANTEE, THE OUTPUT AND THE GATE. The old subtitle opened "Ask */}}
    {{/* Autopilot to build a new page, blueprint, or API mapping" and never mentioned the */}}
    {{/* composer, widgets or layout — on a page whose own decision record says the composer is */}}
    {{/* the only path, and which links only to the PAGE composer while blueprints and API */}}
    {{/* mappings have builders of their own. */}}
    subtitle: >-
      Build a page for this portal out of the widget catalogue — layout, widgets, and the
      RESTActions that feed them. Preview it against your own cluster, with your own permissions,
      then publish the whole set as one change request. Nothing appears in this portal until that
      change request is merged.
    {{/* ONE action, right-aligned in the title row. PageHeader affords exactly one and says so, */}}
    {{/* which is why flex.portal-builder-ask-cta — a wrapper whose only job was justify:flex-end */}}
    {{/* — is retired: it rebuilt one level down the affordance this widget exists to provide. */}}
    allowedResources:
      - buttons
    items:
      - resourceRefId: portal-builder-compose
  resourcesRefs:
    items:
      - id: portal-builder-compose
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: portal-builder-compose
        namespace: {{ .Release.Namespace }}
        resource: buttons
        verb: GET
