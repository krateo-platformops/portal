# Subtitle for the /agents/new pagehead.
#
# It says what the form creates AND what it deliberately leaves undone — the same truth the gateway
# card carries, stated once at the top so the fields cannot be reached without meeting it first.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agent-create-subtitle
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: Define a declarative kagent Agent — its purpose, model, runtime, standing instructions, the tools it may call and the agents it may delegate to. Fields come from the live Agent CRD; the tool and delegation pickers are built from the RemoteMCPServers and Agents on this cluster. Creating the Agent is only half the job — it stays unreachable until it is registered at the gateway.
    type: secondary
  resourcesRefs:
    items: []
