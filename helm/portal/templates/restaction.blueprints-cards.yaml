{{/* Blueprint catalog — lists the cluster's CompositionDefinitions (core.krateo.io), */}}
{{/* the canonical blueprint set, one entry per blueprint. Replaces the retired */}}
{{/* per-blueprint self-registered Card pattern (krateo.io/portal-page=blueprints */}}
{{/* label) — the platform no longer ships one widget CR per blueprint; ONE templated */}}
{{/* tile is iterated over this list. Honest fields straight off each Composition */}}
{{/* Definition: name/namespace, chart version (spec.chart.version), category (the */}}
{{/* krateo.io/tier label: platform/observability), chart url. Feeds BOTH the */}}
{{/* marketplace grid and the dashboard "Top blueprints" (same `.cards` contract). */}}
{{/* UAF gates to compositiondefinitions the user may list; continueOnError so a */}}
{{/* missing grant degrades to an empty catalog, not a broken page. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: blueprints-cards
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: compdefs
      path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
      verb: GET
      continueOnError: true
      errorKey: compdefsError
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: compositiondefinitions
        namespaceFrom: .metadata.namespace
      filter: >
        [.compdefs.items[]?
         | ((.metadata.labels // {})["krateo.io/tier"] // "blueprint") as $cat
         | (([.status.conditions[]? | select(.type == "Ready") | .status][0]) // "Unknown") as $ready
         | (([.status.conditions[]? | select(.type == "Synced") | .status][0]) // "Unknown") as $synced
         | {
             apiVersion,
             kind,
             metadata: {
               name: .metadata.name,
               namespace: .metadata.namespace,
               uid: .metadata.uid,
               creationTimestamp: .metadata.creationTimestamp,
               labels: .metadata.labels
             },
             version: (.spec.chart.version // ""),
             chart: (.spec.chart.url // ""),
             provisions: (.status.kind // .status.managed.kind // ""),
             # green = Ready/Available; red = a genuine reconcile FAILURE (Synced=False); orange = still
             # installing / not yet Ready (a transient Ready=False during reconcile is NOT a failure).
             readyReason: (if $synced == "False" then (([.status.conditions[]? | select(.type == "Synced") | .reason][0]) // "ReconcileError") else (([.status.conditions[]? | select(.type == "Ready") | .reason][0]) // "") end),
             readyIcon: (if $ready == "True" then "fa-circle-check" elif $synced == "False" then "fa-circle-xmark" else "fa-clock" end),
             readyColor: (if $ready == "True" then "green" elif $synced == "False" then "red" else "orange" end),
             category: $cat,
             tags: [ $cat ]
           }]
  {{/* `category` arrives via ?extras (the /blueprints?category=<k> chip navigation). Echo it as */}}
  {{/* selectedCategory (the active-chip read-back) and filter the cards by the blueprint tier */}}
  {{/* (platform/observability/blueprint). "all" / no param shows every blueprint. The dashboard */}}
  {{/* "Top blueprints" reuse passes no ?category, so $sel defaults to "all" → unfiltered. */}}
  {{/* ASK AGENTIKO (blueprints-page button.blueprints-ask-agentiko): `askHref` is /blueprints with
       the current ?category, ?q and ?projects kept and an @uri-encoded ?ask seed about the cards in
       view — how many, how many are ready, which are failing to reconcile (Synced=False, with the
       reason) and how many are still installing. `readError` is the compdefs step's error, which
       continueOnError used to hide: a refused list looked like a platform with no blueprints. With
       nothing read the prompt asks what the error means instead of saying there are none. The
       dashboard's "Top blueprints" reads only `.cards` and is unchanged. */}}
  filter: >
    def errmsg: (if type == "array" then .[0] else . end) | if type == "object" then (.message // .reason // tojson) elif type == "string" then . else tojson end;
    def cap($n): if length > $n then (.[0:($n - 1)] + "…") else . end;
    def qs($p): [ $p[] | select(.[1] != "") | .[0] + "=" + (.[1] | @uri) ] | join("&") | if . == "" then "" else . + "&" end;
    ((.category) // "all") as $sel
    | ((.q // "") | ascii_downcase) as $q
    | ((.projects // "") | split(",") | map(select(. != ""))) as $projects
    | ((.compdefsError // null) | if . == null or . == [] or . == "" then "" else (errmsg | cap(300)) end) as $readError
    | ((.compdefs // []) | sort_by(.metadata.name // "")) as $all
    | ($all
        | map(select(($sel == "all" or .category == $sel)
            and ($q == "" or ((.metadata.name // "") | ascii_downcase | contains($q)) or ((.provisions // "") | ascii_downcase | contains($q)))
            and (($projects | length) == 0 or (([.metadata.namespace] - $projects) | length == 0))))) as $cards
    | ([ (if $sel != "all" then "category " + ($sel | tostring) else empty end),
         (if ($projects | length) > 0 then ("namespace" + (if ($projects | length) > 1 then "s " else " " end) + ($projects | join(", "))) else empty end),
         (if $q != "" then "name or kind matching \"" + ((.q // "") | tostring | cap(60)) + "\"" else empty end) ] | join("; ")) as $view
    | ([ $cards[] | select(.readyColor == "red") ]) as $failing
    | (if $readError != "" and ($all | length) == 0 then
         "The blueprints on this platform could not be read (" + $readError + "). Explain what that error means and what to check."
       elif ($cards | length) == 0 then
         (if $view != "" then "No installed blueprint is in view (" + $view + "); " + (($all | length) | tostring) + (if ($all | length) == 1 then " is" else " are" end) + " installed outside it. Tell me whether that is expected."
          else "No blueprint is installed on this platform yet. Explain how a blueprint is installed from the Marketplace and what it lets me create." end)
       else
         "Review the blueprints installed on this platform" + (if $view != "" then " (" + $view + ")" else "" end) + ": "
         + ($cards | length | tostring) + (if ($cards | length) == 1 then " blueprint — " else " blueprints — " end)
         + ([ $cards[] | select(.readyColor == "green") ] | length | tostring) + " ready, "
         + ($failing | length | tostring) + " failing to reconcile"
         + (if ($failing | length) > 0 then " (" + ($failing | .[0:8] | map((.metadata.name // "") + " · " + (.metadata.namespace // "") + " — " + (if (.readyReason // "") != "" then .readyReason else "Synced=False" end)) | join("; ")) + ")" else "" end)
         + ", " + ([ $cards[] | select(.readyColor == "orange") ] | length | tostring) + " still installing."
         + (if ($failing | length) > 0 then " Explain what the failing ones are stuck on and how to fix them."
            else " None is failing to reconcile. Tell me whether any still installing looks stuck, and what each blueprint lets me create." end)
       end
       + (if $readError != "" and ($all | length) > 0 then " Part of the list could not be read (" + $readError + "), so this may not be all of them." else "" end)) as $prompt
    | {
        selectedCategory: $sel,
        cards: $cards,
        readError: $readError,
        askHref: ("/blueprints?" + qs([["category", (if $sel == "all" then "" else ($sel | tostring) end)], ["q", ((.q // "") | tostring)], ["projects", ((.projects // "") | tostring)]]) + "ask=" + ($prompt | @uri))
      }
