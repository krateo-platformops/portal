# Portal-builder repo state (CHART-P1): the in-flight builder PullRequest CRs — one row per
# pullrequests.github.krateo.io CR the Portal/Blueprint builder created (the git-publish set's
# PR op). Cluster-native (lists the CRs directly), so no GitHub token/endpoint; continueOnError
# so a narrow-RBAC (non-author) user degrades to an empty table instead of a failed widget.
#
# STATE is GitHub-domain vocabulary, NOT k8s: a PR is open / merged / closed. The status
# subresource the KOG github-provider writes carries state (open|closed), merged (bool) and
# number/html_url; a MERGED PR reports state=closed + merged=true, so merged is derived HERE
# (closed && merged → "merged") ahead of a plain close. The list.builder-prs Listy maps each
# state to a domain chip (open→blue Open / merged→green Merged / closed→slate Closed); green is
# reserved for a genuinely-landed deliverable (merged), matching the health=green rule.
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: builder-prs
  namespace: {{ .Release.Namespace }}
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    - name: prs
      path: /apis/github.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/pullrequests
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: prsError
    # P1 — SCM-agnostic publish path (AUTOPILOT_PUBLISH_VIA_GIT_PROVIDER): a publish opens NO
    # PullRequest CR — it commits held files via git-provider LocalResources labelled
    # krateo.io/builder (any of page|blueprint|controller) + krateo.io/publish: <name> (one per
    # file). This general feed shows ALL builders' publishes, grouped per publish in the final
    # filter → a "branch pushed, awaiting PR" row alongside the PR rows (continueOnError → empty
    # if git-provider/RBAC absent). The repo is parsed from the LocalResource toRepo URL.
    - name: publishes
      path: /apis/git.krateo.io/v1alpha1/namespaces/{{ .Release.Namespace }}/localresources
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: publishesError
      filter: >
        [ (.publishes.items // [])[]
          | select(((.metadata.labels["krateo.io/publish"]) // "") != "")
          | { publish: ((.metadata.labels["krateo.io/publish"]) // ""),
              branch: (((.status.targetBranch) // (.spec.toRepo.branch)) // ""),
              repo: (((.spec.toRepo.url) // "") | rtrimstr(".git") | split("/")
                     | (if length >= 2 then (.[-2] + "/" + .[-1]) else "" end)),
              synced: ([ (.status.conditions // [])[] | select((.type // "") == "Synced") ] | first // {} | (.status // "")),
              created: ((.metadata.creationTimestamp) // "") } ]
  filter: >
    ([ ((.prs.items) // [])[]
        | (((.spec.owner) // "") + "/" + ((.spec.repo) // "")) as $repo
        | ((.spec.head) // "") as $head
        | ((.status.state) // "pending") as $rawState
        | ((.status.merged) // false) as $merged
        # Domain state: a closed PR that landed is "merged" (green), a closed-unmerged one is
        # "closed" (slate); anything still open is "open" (blue); pre-reconcile is "pending".
        | (if $rawState == "closed" and $merged then "merged" else $rawState end) as $state
        | {
            name:  (.metadata.name // ""),
            repo:  $repo,
            head:  $head,
            # Identity pill: "<owner>/<repo> · #<N>" (+ the head branch when present). The PR
            # number rides from status.number (written after the provider opens the PR).
            sub:   ($repo
                    + (if ((.status.number) // 0) > 0 then (" · #" + ((.status.number) | tostring)) else "" end)
                    + (if $head != "" then (" · " + $head) else "" end)),
            title: ((.spec.title) // ""),
            state: $state,
            # Sentence-cased chip label ("Open"/"Merged"/"Closed"/"Pending") — the raw lowercase
            # `state` stays for the colour-map keys.
            stateLabel: (if $state == "" then "" else ((($state)[0:1] | ascii_upcase) + ($state)[1:]) end),
            # #84 §0.2: the Table's Status cell takes a single colour (the Listy used a colour-map);
            # resolve it server-side — open→blue / merged→green (a landed deliverable) / closed→gray /
            # pending→gold. Same vocabulary the Listy's map used.
            stateColor: (if $state == "open" then "blue" elif $state == "merged" then "green" elif $state == "closed" then "gray" else "gold" end),
            # #84 §0.2: the PR "#N" cell (same derivation as blueprint-builder-deliverables); "" until
            # the provider writes status.number.
            pr:    (if ((.status.number) // 0) > 0 then ("#" + ((.status.number) | tostring)) else "" end),
            # PR open age — the raw creationTimestamp; the Table formats it `relative` ("14d ago").
            created: (.metadata.creationTimestamp // ""),
            # The GitHub PR URL (status.html_url) — the Listy row's external navigateTo. A PR
            # with no URL yet (freshly created, pre-reconcile) gets "" → the row is inert.
            url:   ((.status.html_url) // "")
          } ]) as $prRows
    | ([ (.publishes // []) | group_by(.publish)[]
         | select((.[0].publish // "") != "")
         | .[0] as $p0
         | (all(.[]; .synced == "True")) as $pushed
         # Claim-path row: the branch is pushed; the PR/MR is opened by the human (Option A), so
         # there is no PR number/URL/merge-state — state is "pushed" (gold) until then.
         | { name: $p0.publish,
             repo: $p0.repo,
             head: $p0.branch,
             sub: ($p0.repo + (if ($p0.branch // "") != "" then (" · " + $p0.branch) else "" end)),
             title: ($p0.publish | sub("^publish-"; "")),
             state: (if $pushed then "pushed" else "pending" end),
             stateLabel: (if $pushed then "Pushed" else "Pending" end),
             stateColor: "gold",
             pr: "",
             created: ($p0.created // ""),
             url: "" } ]) as $claimRows
    | { rows: (($prRows + $claimRows) | sort_by(.created // "") | reverse) }
