{{/* The alert that opened the incident, as a link to /alerts/{ns}/{name}. The label is the */}}
{{/* alert's display name; the path comes from incident-detail (.alertRoute, built from */}}
{{/* spec.alertRef), which is empty when the Alert no longer exists — the chips Flex then shows */}}
{{/* incident-alert-text instead. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-alert-link
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    label: 'Alert'
    type: link
    size: small
    icon: fa-bell
    clickActionId: open-alert
    actions:
      navigate:
        - id: open-alert
          type: navigate
          path: /alerts
  widgetDataTemplate:
    - forPath: label
      expression: '${ "Alert: " + (.alertName // "") }'
    {{/* Falls back to the alerts list, never a 404, should it render without a route. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "open-alert", type: "navigate", path: (if (.alertRoute // "") != "" then .alertRoute else "/alerts" end) } ] } }'
  resourcesRefs:
    items: []
