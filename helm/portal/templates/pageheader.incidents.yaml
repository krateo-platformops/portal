{{/* The /incidents page header. No counter: the per-state counts live in the chips below it. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incidents-page-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Incidents
    subtitle: >-
      One row per incident: an alert's problem from its root-cause analysis until its checks resolve it or someone closes it
  resourcesRefs:
    items: []
