{{- $roles := include "portal.agentPolicyRoles" . | fromJsonArray -}}
{{/* The ROLE SECTIONS of /agents/policies — one outlined Card per role in portal.agentPolicyRoles */}}
{{/* (eight; seven have members on krateo-057), each wrapping a Table of */}}
{{/* just that role's policies. Generated by ranging over portal.agentPolicyRoles so the Card, its */}}
{{/* Table and the groups Flex that references them cannot drift apart. */}}
{{/* */}}
{{/* WHY CARDS AND NOT ONE TABLE: 29 policies in one grid is a wall — every row looks alike, and the */}}
{{/* only question the page exists to answer ("what class of thing does this gateway enforce, and is */}}
{{/* any of it missing?") needs a scan of 7 headings, not 29 rows. The card title + count IS the */}}
{{/* summary; there is deliberately no separate summary table above, because a roll-up that repeats */}}
{{/* the same headings underneath it is the same information twice. */}}
{{/* */}}
{{/* The count in `extra` is server-side (byRole) and singular-aware, so it stays true when the gateway */}}
{{/* chart adds a policy — no hardcoded "13" to rot. It is plain text, NOT a tag or badge: a count is */}}
{{/* not a status, and a coloured chip on every card would read as a health signal per role. */}}
{{/* */}}
{{/* STATUS IS EXCEPTION-ONLY, and the predicate is TYPE-AWARE. An AgentgatewayPolicy reports per */}}
{{/* ancestor (a policy attached to two Gateways has two ancestors) with types Accepted and Attached; */}}
{{/* a healthy policy has nothing to report. `.status != "True"` would be wrong here for the same */}}
{{/* reason it is wrong on agents-list: a future advisory condition whose True means "there IS a */}}
{{/* problem" would be silently dropped. */}}
{{/* */}}
{{/* Exception-only means the COLUMN goes, not just the value. There is no way to render an empty */}}
{{/* jsonSchemaType cell — an empty stringValue renders a literal "-" (Table.tsx: `if (!stringValue) */}}
{{/* return '-'`), and so does a missing cell, and so does type "null". So a healthy cluster used to */}}
{{/* show 29 dashes in a column taking real width for a value that was always the same. `columns` is */}}
{{/* therefore templated off the same payload as `dataSource`: the Status column exists only when at */}}
{{/* least one policy IN THIS ROLE has something to report, which is the same server-side rule that */}}
{{/* already drops an empty role card. The status cell is still emitted on every row (antd renders */}}
{{/* only declared columns, and a MISSING cell logs a console error), so when one policy in a role */}}
{{/* breaks, its siblings correctly show "-" beside it: nothing to report, in a column that now exists. */}}
{{/* */}}
{{/* NO fitContent HERE, unlike table.agents-list. fitContent maps to antd `ellipsis` on EVERY column */}}
{{/* and drops the horizontal scroll (Table.tsx:75,96), so the longest `enforces` strings on */}}
{{/* krateo-057 — 152 chars for tracing, 112 for cors — would clip to hover-only title text at any */}}
{{/* realistic card width. That is truncation moved out of jq (deliberate, visible) into CSS */}}
{{/* (invisible, unreachable on touch), on the one column this page exists to show. Nine narrow */}}
{{/* columns made fitContent right on agents-list; four columns with one long sentence make it wrong. */}}
{{- range $i, $r := $roles }}
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policies-card-{{ $r.key }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-policies
    namespace: {{ $.Release.Namespace }}
  widgetData:
    title: {{ $r.label | quote }}
    titleVariant: eyebrow
    variant: outlined
    headerLeft: {{ $r.desc | quote }}
    {{/* Empty until the apiRef resolves — falsy, so the header renders without a dangling node. */}}
    extra: ''
    items:
    - resourceRefId: agents-policies-table-{{ $r.key }}
  widgetDataTemplate:
  - forPath: extra
    expression: '${ (.byRole.{{ $r.key }} // 0) as $n | ($n | tostring) + (if $n == 1 then " policy" else " policies" end) }'
  resourcesRefs:
    items:
    - id: agents-policies-table-{{ $r.key }}
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-policies-table-{{ $r.key }}
      namespace: {{ $.Release.Namespace }}
      resource: tables
      verb: GET
---
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policies-table-{{ $r.key }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-policies
    namespace: {{ $.Release.Namespace }}
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    pagination:
      {{/* No role holds more than ~13 policies, so the pager is chrome over nothing on every card. */}}
      hideOnSinglePage: true
      defaultPageSize: 20
    columns:
    {{/* `Policy` is the object name with the chart's shared `agentgateway-policies-` prefix stripped */}}
    {{/* server-side: it is identical on all 29 and would push the one distinguishing word off-screen. */}}
    - valueKey: name
      title: Policy
    {{/* `Attached to` is the attachment plus the URL space it governs — "/llm/v1" is what a reader can */}}
    {{/* reason about; "agentgateway-policies-llm" is not. A bare "/" is never appended (it would claim */}}
    {{/* the gateway root); a label-selector attachment renders as its selector. Composed server-side. */}}
    - valueKey: attaches
      title: Attached to
    {{/* The whole point of the page: the policy's live values as one readable sentence, composed in */}}
    {{/* jq. The widget does no formatting — no unit maths, no pluralisation, no truncation. */}}
    - valueKey: enforces
      title: What it enforces
    dataSource: []
  widgetDataTemplate:
  {{/* Status is appended ONLY when a policy in this role is not healthy — see the header. */}}
  - forPath: columns
    expression: '${ ( [ (.rows // [])[] | select(.role == "{{ $r.key }}") | select((.statusLabel // "") != "") ] | length ) as $exc | [ {valueKey:"name",title:"Policy"}, {valueKey:"attaches",title:"Attached to"}, {valueKey:"enforces",title:"What it enforces"} ] + (if $exc > 0 then [ {valueKey:"status",title:"Status"} ] else [] end) }'
  - forPath: dataSource
    expression: '${ [ (.rows // [])[] | select(.role == "{{ $r.key }}") | [ {valueKey:"name",kind:"jsonSchemaType",type:"string",stringValue:(.name // "-")}, {valueKey:"attaches",kind:"jsonSchemaType",type:"string",stringValue:(.attaches // "not attached"),color:"var(--gray-color)"}, {valueKey:"enforces",kind:"jsonSchemaType",type:"string",stringValue:(if (.enforces // "") == "" then "—" else .enforces end)}, (if (.statusLabel // "") == "" then {valueKey:"status",kind:"jsonSchemaType",type:"string",stringValue:""} else {valueKey:"status",kind:"tag",stringValue:.statusLabel,color:(.statusColor // "orange")} end) ] ] }'
  resourcesRefs:
    items: []
{{- end }}
