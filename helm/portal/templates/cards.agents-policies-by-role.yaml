{{- $roles := include "portal.agentPolicyRoles" . | fromJsonArray -}}
# The seven ROLE SECTIONS of /agents/policies — one outlined Card per role, each wrapping a Table of
# just that role's policies. Generated by ranging over portal.agentPolicyRoles so the Card, its
# Table and the groups Flex that references them cannot drift apart.
#
# WHY CARDS AND NOT ONE TABLE: 29 policies in one grid is a wall — every row looks alike, and the
# only question the page exists to answer ("what class of thing does this gateway enforce, and is
# any of it missing?") needs a scan of 7 headings, not 29 rows. The card title + count IS the
# summary; there is deliberately no separate summary table above, because a roll-up that repeats
# the seven headings underneath it is the same information twice.
#
# The count in `extra` is server-side (byRole) and singular-aware, so it stays true when the gateway
# chart adds a policy — no hardcoded "13" to rot. It is plain text, NOT a tag or badge: a count is
# not a status, and a coloured chip on every card would read as seven health signals.
#
# STATUS IS EXCEPTION-ONLY, and the predicate is TYPE-AWARE. An AgentgatewayPolicy reports per
# ancestor (a policy attached to two Gateways has two ancestors) with types Accepted and Attached;
# a healthy policy renders an EMPTY status cell, never a green pill. `.status != "True"` would be
# wrong here for the same reason it is wrong on agents-list: a future advisory condition whose True
# means "there IS a problem" would be silently dropped. All 29 policies on krateo-057 are
# Accepted=True + Attached=True today, so this column is empty on a healthy cluster BY DESIGN — it
# exists to make the one broken policy impossible to miss, not to decorate the healthy 28.
{{- range $i, $r := $roles }}
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policies-card-{{ $r.key }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-policies
    namespace: {{ $.Release.Namespace }}
  widgetData:
    title: {{ $r.label | quote }}
    titleVariant: eyebrow
    variant: outlined
    headerLeft: {{ $r.desc | quote }}
    # Empty until the apiRef resolves — falsy, so the header renders without a dangling node.
    extra: ''
    items:
    - resourceRefId: agents-policies-table-{{ $r.key }}
  widgetDataTemplate:
  - forPath: extra
    expression: '${ (.byRole.{{ $r.key }} // 0) as $n | ($n | tostring) + (if $n == 1 then " policy" else " policies" end) }'
  resourcesRefs:
    items:
    - id: agents-policies-table-{{ $r.key }}
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-policies-table-{{ $r.key }}
      namespace: {{ $.Release.Namespace }}
      resource: tables
      verb: GET
---
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policies-table-{{ $r.key }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: agents-policies
    namespace: {{ $.Release.Namespace }}
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    fitContent: true
    pagination:
      # No role holds more than ~13 policies, so the pager is chrome over nothing on every card.
      hideOnSinglePage: true
      defaultPageSize: 20
    columns:
    # `Policy` is the object name with the chart's shared `agentgateway-policies-` prefix stripped
    # server-side: it is identical on all 29 and would push the one distinguishing word off-screen.
    - valueKey: name
      title: Policy
    # `Attached to` is the joined HTTPRoute path, not the route's object name — "/llm/v1" is the
    # enforcement surface a reader can reason about; "agentgateway-policies-llm" is not.
    - valueKey: attaches
      title: Attached to
    # The whole point of the page: the policy's live values as one readable sentence, composed in
    # jq. The widget does no formatting — no unit maths, no pluralisation, no truncation.
    - valueKey: enforces
      title: What it enforces
    - valueKey: status
      title: Status
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ [ (.rows // [])[] | select(.role == "{{ $r.key }}") | [ {valueKey:"name",kind:"jsonSchemaType",type:"string",stringValue:(.name // "-")}, {valueKey:"attaches",kind:"jsonSchemaType",type:"string",stringValue:(.attaches // "—"),color:"#8c8c8c"}, {valueKey:"enforces",kind:"jsonSchemaType",type:"string",stringValue:(if (.enforces // "") == "" then "—" else .enforces end)}, (if (.statusLabel // "") == "" then {valueKey:"status",kind:"jsonSchemaType",type:"string",stringValue:""} else {valueKey:"status",kind:"tag",stringValue:.statusLabel,color:(.statusColor // "gold")} end) ] ] }'
  resourcesRefs:
    items: []
{{- end }}
