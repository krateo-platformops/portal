{{/* Endpoint for oasgen-render, the Controller Builder's preview service (POST /render). snowplow's */}}
{{/* RESTAction `endpointRef` resolves it from this Secret (server-url key). Consumed by */}}
{{/* restaction.controller-render-draft. The Service is the oasgen-provider chart's */}}
{{/* `<fullname>-render` on port 80 (render.service.port), rendered only with oasgen-provider */}}
{{/* >= 0.25.0 and render.enabled=true; the installer's release is `oasgen-provider`, so its fullname */}}
{{/* is `oasgen-provider`. No auth: the service reads nothing from the cluster and mounts no token. */}}
apiVersion: v1
kind: Secret
metadata:
  name: oasgen-render-endpoint
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
type: Opaque
stringData:
  server-url: http://oasgen-provider-render.{{ .Release.Namespace }}.svc:80
