# Frame for the involved-manifests viewer — the same outlined surface every other panel on the
# incident page uses. Titled, unlike the agents-page frames: this section sits at the BOTTOM of a
# long page, below the interpretation, so it needs a heading a reader can scan to rather than one
# that only makes sense in sequence.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-manifests-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    variant: outlined
    title: Involved resources
    items:
    - resourceRefId: incident-detail-manifests
  widgetDataTemplate:
    # The subtitle is COMPUTED and names what is actually in the List — "3 objects — the report, the
    # alert that triggered it, and 1 audit record" — so the reader knows what to expect before
    # unfolding it, and knows when something they expected is absent.
    - forPath: legend
      expression: '${ .involvedManifestsDesc // "" }'
  resourcesRefs:
    items:
    - id: incident-detail-manifests
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-detail-manifests
      namespace: {{ .Release.Namespace }}
      resource: yamlviewers
      verb: GET
