# Frame for the involved-manifests viewer — the same outlined surface every other panel on the
# incident page uses. Titled, unlike the agents-page frames: this section sits at the BOTTOM of a
# long page, below the interpretation, so it needs a heading a reader can scan to rather than one
# that only makes sense in sequence.
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-manifests-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    variant: outlined
    title: Involved resources
    items:
    # The computed line first, then the manifests. It used to be templated into the Card's `legend`
    # — which is an ARRAY of {color,label} colour swatches, not a subtitle, so snowplow rejected the
    # whole widget at RESOLVE time ("legend in body must be of type array") and the section rendered
    # as "Error while rendering widget". Card has no subtitle/description slot; a Paragraph sibling
    # is the pattern this codebase already uses for a computed caption
    # (paragraph.agents-servers-matrix-legend).
    - resourceRefId: incident-detail-manifests-legend
    - resourceRefId: incident-detail-manifests
  resourcesRefs:
    items:
    - id: incident-detail-manifests-legend
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-detail-manifests-legend
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    - id: incident-detail-manifests
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-detail-manifests
      namespace: {{ .Release.Namespace }}
      resource: yamlviewers
      verb: GET
