{{/* THE SENTENCE THE TABLE COULD NOT SAY.                                                        */}}
{{/*                                                                                              */}}
{{/* table.preview-drafts carried `title` and `description` for months and neither ever reached a */}}
{{/* browser: the Table CRD declares ten widgetData properties and neither is among them, with no */}}
{{/* preserve-unknown, so the apiserver pruned both. The section rendered as a bare, unlabelled   */}}
{{/* grid reading "proof-a 3 4h" — telemetry, to anyone who had not written it.                   */}}
{{/*                                                                                              */}}
{{/* The copy is also narrower than what was pruned. The old text promised "closing the tab does  */}}
{{/* not lose it", which is true of the sandbox objects and false of the held file tree — the     */}}
{{/* composer keeps that in memory. The platform was protected from its own over-promise by a     */}}
{{/* pruning bug; rendering the sentence without narrowing it would have shipped the promise.     */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: your-drafts-note
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      These pages are already applied to the preview sandbox, so they outlive a closed tab and are
      not swept on a timer. Discarding a draft in the composer deletes them; walking away does not.
      Reopening one in the composer is not wired yet — start again, or ask Autopilot for the same
      page.
  resourcesRefs:
    items: []
