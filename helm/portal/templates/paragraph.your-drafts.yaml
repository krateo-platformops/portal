{{/* THE SENTENCE THE TABLE COULD NOT SAY.                                                        */}}
{{/*                                                                                              */}}
{{/* table.preview-drafts carried `title` and `description` for months and neither ever reached a */}}
{{/* browser: the Table CRD declares ten widgetData properties and neither is among them, with no */}}
{{/* preserve-unknown, so the apiserver pruned both. The section rendered as a bare, unlabelled   */}}
{{/* grid reading "proof-a 3 4h" — telemetry, to anyone who had not written it.                   */}}
{{/*                                                                                              */}}
{{/* The copy is also narrower than what was pruned. The old text promised "closing the tab does  */}}
{{/* not lose it", which is true of the sandbox objects and false of the held file tree — the     */}}
{{/* composer keeps that in memory. The platform was protected from its own over-promise by a     */}}
{{/* pruning bug; rendering the sentence without narrowing it would have shipped the promise.     */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: your-drafts-note
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    {{/* P17 — the reader manages drafts, not sandboxes and timers. "applied to the preview    */}}
    {{/* sandbox", "swept on a timer" and "not wired yet" were our vocabulary for their          */}}
    {{/* situation; what they need to know is that closing the tab is safe and reopening is not  */}}
    {{/* yet possible. The mechanism stays in the decision record, where whoever can act on it    */}}
    {{/* will look.                                                                              */}}
    text: >-
      A draft survives a closed tab — these are waiting for you, and nothing removes them on a
      timer. Discarding one in the composer removes it; leaving it alone does not. You cannot
      reopen a draft here yet: start it again in the composer, or ask Autopilot for the same page.
  resourcesRefs:
    items: []
