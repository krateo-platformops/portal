{{/* Evidence sources beside the proposals the run wrote, stacking below lg. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-run-body
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  widgetData:
    alignment: top
    allowedResources:
    - cards
    items:
    - resourceRefId: review-run-sources
      xs: 24
      lg: 13
    - resourceRefId: review-run-proposals
      xs: 24
      lg: 11
  resourcesRefs:
    items:
    - id: review-run-sources
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: review-run-sources
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: review-run-proposals
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: review-run-proposals
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
