# Incident detail pagehead — a space-between row (mirrors composition-detail-header-block):
#   [ title-stack: H2 title (UX-17 short alert name) + lifecycle/trigger tags / chips / meta ]
#   [ actions:    Diagnose (Autopilot ?ask) · Discard (delete report, confirmed) ]
# The title stack + chips + meta moved into incident-detail-title-stack so the action cluster can
# dock top-right. align:flex-start keeps the buttons pinned to the top of the (taller) title column.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-header-block
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    allowedResources:
    - flexes
    vertical: false
    justify: space-between
    align: flex-start
    gap: middle
    items:
    - resourceRefId: incident-detail-title-stack
    - resourceRefId: incident-detail-actions
  resourcesRefs:
    items:
    - id: incident-detail-title-stack
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-detail-title-stack
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: incident-detail-actions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-detail-actions
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
