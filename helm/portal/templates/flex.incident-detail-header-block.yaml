# Incident detail pagehead — a vertical stack of three rows (#105, mirrors the
# composition-detail-header-block fix in frontend#98):
#   [ title-line: H2 title (UX-17 short alert name) + Lifecycle/Trigger tags ]
#   [ title-stack: chips (affected ref + Alert link) (left) · actions (right) ]
#   [ meta card: Started / Updated / Analysis stage — its own full-width row ]
# Was a single space-between row [title-stack | actions] with align:flex-start — that put the
# actions level with the top of the (taller) title-stack column instead of the chips line right
# under the title, AND left incident-meta-card nested inside the shrink-wrapped title-stack
# column (sharing horizontal space with the action buttons), so its Started/Updated/Analysis
# stage bar never reached full width. Pulling meta-card out to its own row fixes both.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-detail-header-block
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    allowedResources:
    - flexes
    - cards
    vertical: true
    gap: small
    items:
    - resourceRefId: incident-detail-titleline
    - resourceRefId: incident-detail-title-stack
    - resourceRefId: incident-meta-card
  resourcesRefs:
    items:
    - id: incident-detail-titleline
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-detail-titleline
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: incident-detail-title-stack
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-detail-title-stack
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: incident-meta-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: incident-meta-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
