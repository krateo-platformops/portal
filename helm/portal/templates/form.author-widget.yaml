{{/* B5 — author a NEW widget CR and publish it (Portal Builder). */}}
{{/* */}}
{{/* compose-page can only ARRANGE widgets that already exist: its options come from a live list */}}
{{/* of widget CRs, so a page can never contain anything nobody has authored yet. Authoring one */}}
{{/* was a chart-edit-and-release step, which meant the agent was the only way to get a new */}}
{{/* widget — the same gap B4 closed for blueprints, one level down. */}}
{{/* */}}
{{/* The kinds offered are exactly page-composable's composable set, so the loop closes: author a */}}
{{/* widget here, then place it with Compose a page. Kinds that only make sense as containers */}}
{{/* (Flex/Col/Row/Tabs) are deliberately absent — those are what compose-page itself emits. */}}
{{/* */}}
{{/* Not agent-submittable. Autopilot may draft a widget here; a human presses Publish. */}}
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: author-widget
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Same RA as compose-page: it resolves the BuilderPublish GVR at serve time so the form does
       not hardcode a served version a composition bump would invalidate. */}}
  apiRef:
    name: page-composable
    namespace: {{ .Release.Namespace }}
  widgetData:
    layout: vertical
    reviewBeforeSubmit: true
    submitActionId: submit
    schema: {}
    buttonConfig:
      primary:
        label: Publish widget
      secondary:
        label: Cancel
        navigateTo: /portal-builder
    actions:
      rest:
        - id: submit
          type: rest
          resourceRefId: create-builder-publish
          headers:
            - 'Content-Type: application/json'
          successMessage: Widget published — a change request is open
          payloadToOverride:
            - { name: metadata.name,      value: '${ "widget-" + .json.__name__ }' }
            - { name: metadata.namespace, value: '{{ .Release.Namespace }}' }
            - name: spec
              {{/* One file: the widget CR, rendered as YAML by hand so the published artifact
                   reads as though a person wrote it — the same choice compose-page makes. */}}
              value: >
                ${ .json as $f
                 | ($f.__kind__ | ascii_downcase) as $prefix
                 | { name: ("widget-" + $f.__name__),
                     builder: "page",
                     {{/* LENGTH-checked, not `//`: jq's alternative operator fires only on
                          null/false, so a CLEARED optional text field submits "" and sails past
                          it — publishing to an unnamed branch or repo. */}}
                     branch: (if (($f.__target_branch__ // "") | length) > 0
                              then $f.__target_branch__ else ("builder/widget-" + $f.__name__) end),
                     target: { namespace: $f.__target_org__,
                               repo: $f.__target_repo__,
                               base: (if (($f.__target_base__ // "") | length) > 0
                                      then $f.__target_base__ else "main" end) },
                     files: [ { path: ("helm/portal/templates/" + $prefix + "." + $f.__name__ + ".yaml"),
                                content: (
                                  "kind: " + $f.__kind__
                                  + "\napiVersion: widgets.templates.krateo.io/v1beta1\nmetadata:\n  name: "
                                  + $f.__name__
                                  + "\n  namespace: {{ "{{ .Release.Namespace }}" }}\n  annotations:\n    \"krateo.io/verbose\": \"true\"\nspec:\n  widgetData:\n"
                                  {{/* Each TOP-LEVEL widgetData key on its own line with a JSON
                                       value. JSON is valid YAML, so this is correct for nested
                                       structures while still reading as ordinary YAML for the
                                       scalar keys that make up most widgetData. A single
                                       `tojson` of the whole object would be valid too but would
                                       commit an unreadable one-liner. */}}
                                  + ( ($f.widgetData // {}) | to_entries
                                      | map("    " + .key + ": " + (.value | tojson) + "\n") | join("") )
                                  + "  resourcesRefs:\n    items: []\n" ) } ] }
                 {{/* `source` OMITTED rather than sent empty — a null fails the CRD (the property
                      is type: object) and an empty url renders a Repo CR pointing nowhere. */}}
                 | . + (if (($f.__source_url__ // "") | length) > 0
                        then { source: ({ url: $f.__source_url__,
                                          branch: (if (($f.__source_branch__ // "") | length) > 0
                                                   then $f.__source_branch__ else "main" end) }
                                        + (if (($f.__source_path__ // "") | length) > 0
                                           then { path: $f.__source_path__ } else {} end)) }
                        else {} end) }
  widgetDataTemplate:
    - forPath: schema
      expression: >
        ${ { type: "object",
             required: ["__name__","__kind__","widgetData","__target_org__","__target_repo__"],
             properties: {
               __name__: { type: "string", title: "Widget name",
                           description: "Lower-case, dashes. Becomes the CR name and the template filename — this is the id you reference when placing it on a page.",
                           pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" },
               __kind__: { type: "string", title: "Kind",
                           description: "What the widget renders. These are the kinds Compose a page can place, so anything authored here can go straight onto a page.",
                           enum: ["Card","Table","Listy","LineChart","Statistic","Paragraph","Markdown"] },
               widgetData: { type: "object", title: "Widget data",
                             description: "The widget's own configuration, as JSON — the fields the chosen kind accepts. e.g. for a Paragraph: {\"text\": \"Hello\", \"strong\": true}. Committed as the CR's spec.widgetData." },
               __target_org__:    { type: "string", title: "Target org",
                                    description: "GitHub org (GitLab group, Bitbucket workspace) the change request is opened in.",
                                    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" },
               __target_repo__:   { type: "string", title: "Target repository",
                                    description: "The repository holding the portal chart." },
               __target_base__:   { type: "string", title: "Base branch",
                                    description: "The branch the change request is cut from. Defaults to main." },
               __target_branch__: { type: "string", title: "Branch to commit onto",
                                    description: "Defaults to builder/widget-<name>." },
               __source_url__:    { type: "string", title: "Scaffold from (optional)",
                                    description: "Clone URL of a template repository to seed the target from first. Leave empty unless the repository does not exist yet.",
                                    pattern: "^$|^https?://.+" },
               __source_branch__: { type: "string", title: "Template branch",
                                    description: "Branch in the template repository. Defaults to main. Ignored when no template is given." },
               __source_path__:   { type: "string", title: "Template subdirectory",
                                    description: "Copy only this subdirectory. Empty copies the whole repository. Ignored when no template is given." } } } }
    - forPath: initialValues
      {{/* Prefilled from the install's configured portal repo, but EDITABLE — the destination is
           a per-publish decision. Mirrors compose-page. */}}
      expression: >
        ${ { __target_org__:  "{{ (splitList "/" (((.Values.pageBuilder | default dict).repo) | default "krateo-platformops/portal")) | first }}",
             __target_repo__: "{{ (splitList "/" (((.Values.pageBuilder | default dict).repo) | default "krateo-platformops/portal")) | last }}",
             __target_base__: "main",
             __kind__: "Paragraph" } }
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: create-builder-publish
        apiVersion: '${ .bpApiVersion }'
        resource: '${ .bpResource }'
        namespace: {{ .Release.Namespace }}
        verb: POST
