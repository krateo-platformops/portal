{{/* Root shell — the INIT target (config.INIT = /call?resource=layouts&name=app-shell&namespace=<ns>). */}}
{{/* antd Layout with a Sider that hosts the sidebar-nav Menu; the Content slot renders the routed */}}
{{/* page <Outlet/>. Replaces the legacy NavMenu/RoutesLoader shell (widget-taxonomy-and-layout.md §H). */}}
kind: Layout
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: app-shell
  namespace: {{ .Release.Namespace }}
spec:
  widgetData:
    hasSider: true
    sider:
      resourceRefId: sider-content
      {{/* The brand sits in the Sider's own header slot, not in its scrolling content: a 64px band */}}
      {{/* level with the top bar (the frontend's Layout draws it). In the collapsed icon rail the */}}
      {{/* compact glyph takes its place. */}}
      header: brand
      collapsedHeader: brand-glyph
      theme: light
      width: 236
    {{/* Global side-effect widgets rendered invisibly once for the whole app (issue #49 §7): */}}
    {{/* the tenant Theme applies brand overrides (CSS custom properties) app-wide. */}}
    effects:
      - app-theme
  resourcesRefs:
    items:
      - id: sider-content
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sider-content
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
      - id: brand
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: brand-logo
        namespace: {{ .Release.Namespace }}
        resource: images
        verb: GET
      - id: brand-glyph
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: brand-glyph
        namespace: {{ .Release.Namespace }}
        resource: images
        verb: GET
      - id: app-theme
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: app-theme
        namespace: {{ .Release.Namespace }}
        resource: themes
        verb: GET
