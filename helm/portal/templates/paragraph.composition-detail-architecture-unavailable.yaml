{{/* The composition has an architecture — the gate saw its ConfigMap in status.managed — yet no graph */}}
{{/* came back, and nothing said this person was denied. A read that failed or timed out, a ConfigMap */}}
{{/* gone (404) before status.managed caught up, one another composition rendered, a graph shape this */}}
{{/* portal does not know, a composition moved to a version its ConfigMap does not name yet: none of */}}
{{/* them is about access, so this makes no claim about access. "Could not be read" is the page's own */}}
{{/* wording for a node it could not read, and the second sentence says what would change it (P16): */}}
{{/* most of these clear on the chart's next render. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: paragraph-composition-detail-architecture-unavailable
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    text: This composition's topology could not be read right now. It usually returns once the composition's chart has rendered again; if it does not, an administrator can check the composition's controller.
    type: secondary
