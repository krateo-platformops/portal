# "New agent" — the /agents page CTA into the create Form at /agents/new. Plain literal navigate;
# the create route is static (2 segments, so it never collides with a future 3-segment
# /agents/{namespace}/{name} detail route). Mirrors button.alerts-new.
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-new
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    label: New agent
    icon: fa-plus
    type: primary
    size: middle
    clickActionId: new-agent
    actions:
      navigate:
        - id: new-agent
          type: navigate
          path: /agents/new
  resourcesRefs:
    items: []
