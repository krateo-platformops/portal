{{/* "New agent" — the /agents CTA into the create Form. Plain literal navigate; the target is static */}}
{{/* (2 segments, so it never collides with a future 3-segment /agents/{namespace}/{name} detail */}}
{{/* route). Mirrors button.alerts-new. */}}
{{/* */}}
{{/* WIRED, and both halves of the wiring are real. menu.sidebar-nav is the single route source (there */}}
{{/* is no RoutesLoader) and it carries `{ order: 936, path: "/agents/new", page: agent-create }`; the */}}
{{/* `page:` convention resolves flexes/page-agent-create in the frontend's configured namespace, which */}}
{{/* is why that Flex was moved out of the admin tier. Navigating to a path with no route entry does */}}
{{/* not error — it falls through to the shell catch-all and renders <Page404/> — so if this button */}}
{{/* ever stops working, check the route entry before suspecting the action. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-new
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    label: New agent
    icon: fa-plus
    type: primary
    size: middle
    clickActionId: new-agent
    actions:
      navigate:
        - id: new-agent
          type: navigate
          path: /agents/new
  resourcesRefs:
    items: []
