{{/* Marketplace facet bar — the type toggle (Blueprints | Operators | All) stacked over the */}}
{{/* DATA-DRIVEN category chip row, with the sort control (Name A–Z | Recently updated) below. */}}
{{/* All three are Listy(chip) widgets bound to the blueprints-catalog RA (.sources / .categories */}}
{{/* / .sorts). Replaces the old hardcoded krateo.io/category Button chips — the facet now mirrors */}}
{{/* whatever the live catalog actually carries. */}}
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Flex
metadata:
  name: marketplace-category-group
  namespace: {{ .Release.Namespace }}
spec:
  widgetData:
    vertical: true
    gap: small
    {{/* #86 (fedepini): the pure 3-line "filters-container" — source toggle / category chips / sort */}}
    {{/* toggle, all Listy(chip) widgets. Search was lifted OUT of the middle row into the new outer */}}
    {{/* marketplace-filters-row (search left, this block right), so the old space-between chips-row Flex */}}
    {{/* is gone and the category chips are referenced directly here — all three children are listies now. */}}
    allowedResources:
      - listies
    items:
      - resourceRefId: marketplace-source-toggle
      - resourceRefId: marketplace-category-chips
      - resourceRefId: marketplace-sort-toggle
  resourcesRefs:
    items:
      - id: marketplace-source-toggle
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-source-toggle
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
      - id: marketplace-category-chips
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-category-chips
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
      - id: marketplace-sort-toggle
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-sort-toggle
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
