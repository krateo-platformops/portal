{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Snowplow SLI — "Invalidation" tab. Panels are Cards, one per query; see portal#201. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-tab-invalidation
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - cards
    items:
    - resourceRefId: sp-card-dep-evictions
    - resourceRefId: sp-card-dep-health
    - resourceRefId: sp-card-dep-marks
    - resourceRefId: sp-card-uaf-declines
  resourcesRefs:
    items:
      - id: sp-card-dep-evictions
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-card-dep-evictions
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: sp-card-dep-health
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-card-dep-health
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: sp-card-dep-marks
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-card-dep-marks
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: sp-card-uaf-declines
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-card-uaf-declines
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
{{- end }}
