# Access-page paragraphs (W3-2): the persona-page header pieces (H1 / the
# honesty line). #88 §0.5/§0.6: the Settings-tab intro (merged into the Users
# table), the "Settings · Access" eyebrow (redundant with the breadcrumb) and
# the three section label+caption pairs (their text now lives in the section
# Cards' title — see card.access-*) are gone. The honesty line is LOAD-BEARING
# UX: the capability preview is a run-as-admin SubjectAccessReview about the
# persona — it must say exactly which identity+groups were checked, and that
# IdP-managed (OIDC/LDAP) groups are unknowable from the cluster (user-only
# check understates group-granted access).

# H1 — the persona name, echoed server-side from the route's ?extras by
# access-grants (never parsed client-side).
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: access-detail-title
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [username]
  apiRef:
    name: access-grants
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: persona
    level: 2
  widgetDataTemplate:
    - forPath: text
      expression: '${ .username // "persona" }'
  resourcesRefs:
    items: []
---
# The honesty line: exactly which identity+groups the preview checked, and how.
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: access-checked-as
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [username, ns]
  apiRef:
    name: access-preview
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: capability preview runs as the calling admin (SubjectAccessReview), not as the persona's live session
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: >
        ${ "Checked as user " + (.username // "?")
          + (if ((.groups // []) | length) > 0
             then " + groups [" + (.groups | join(", ")) + ", system:authenticated]"
             else " — groups unknown (IdP-managed identity): user-only check, group-granted access may be understated" end)
          + " · run as the calling admin via SubjectAccessReview, in namespace " + (.ns // "") }
  resourcesRefs:
    items: []
