{{- if .Values.enableCyberjokerUser }}
{{/* krateo-system permissions */}}
{{- /* Preserve an existing password across re-renders (see rbac.admin-rbac.yaml): an
       unguarded randAlphaNum regenerates every reconcile and churns a helm revision each
       cycle. lookup the live Secret and reuse its password; generate only on first create. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "cyberjoker-password" }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 12 }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: cyberjoker-password
  namespace: {{ .Release.Namespace }}
{{/* `data` with an explicit b64enc, NOT `stringData`. stringData is WRITE-ONLY: the apiserver */}}
{{/* converts it to `data` and drops the field, so a rendered object declaring stringData can */}}
{{/* never match the object that comes back. CDC's three-way merge therefore saw drift on EVERY */}}
{{/* reconcile and ran a real helm upgrade each cycle — a release-record write roughly every two */}}
{{/* minutes, which at HELM_MAX_HISTORY=3 rotated every rollback target out within six. */}}
{{/* */}}
{{/* This was diagnosed as the randAlphaNum re-rendering. It was not: release records v36 and v37 */}}
{{/* on krateo-057 hold BYTE-IDENTICAL manifests, so the lookup guard above was already doing its */}}
{{/* job and the password was stable. The perpetual diff was this field the whole time. */}}
data:
  password: {{ $password | b64enc | quote }}
---
apiVersion: basic.authn.krateo.io/v1alpha1
kind: User
metadata:
  name: cyberjoker
  namespace: {{ .Release.Namespace }}
spec:
  displayName: Cyber Joker
  avatarURL: https://i.pravatar.cc/256?img=70
  groups:
    - devs
  passwordRef:
    namespace: {{ .Release.Namespace }}
    name: cyberjoker-password
    key: password
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devs-get-list-any-template-in-krateo-namespace
