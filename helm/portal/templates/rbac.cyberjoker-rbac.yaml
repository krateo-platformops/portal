  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devs-get-list-any-template-in-krateo-namespace
subjects:
- kind: Group
  name: devs
  apiGroup: rbac.authorization.k8s.io
