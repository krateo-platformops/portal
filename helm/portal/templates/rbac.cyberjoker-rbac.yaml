{{- /*
  THE `cyberjoker` DEMO USER — a sample account for demos and walkthroughs, not a platform role.

  This file creates a `basic.authn.krateo.io` User named `cyberjoker` ("Cyber Joker", avatar from
  i.pravatar.cc) in group `devs` with a generated password, plus namespace-scoped Roles letting that
  group read widgets and templates and self-serve the demo application kinds in `demo-system`.

  So `devs` is NOT a platform group. It is the group a sample user happens to belong to, and every
  grant below exists to make a demo work.

  `enableCyberjokerUser` defaults to FALSE. It used to default to true, which shipped this sample
  user — pravatar avatar and all — on every install unless an operator knew to turn it off.

  Written down because its absence had a measurable cost: an RBAC investigation in one session and a
  false-negative probe in another, both spent establishing what this file is for.
*/}}
{{- if .Values.enableCyberjokerUser }}
{{/* krateo-system permissions */}}
{{- /* Preserve an existing password across re-renders (see rbac.admin-rbac.yaml): an
       unguarded randAlphaNum regenerates every reconcile and churns a helm revision each
       cycle. lookup the live Secret and reuse its password; generate only on first create. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "cyberjoker-password" }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 12 }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: cyberjoker-password
  namespace: {{ .Release.Namespace }}
{{/* `data` with an explicit b64enc, NOT `stringData`. stringData is WRITE-ONLY: the apiserver */}}
{{/* converts it to `data` and drops the field, so a rendered object declaring stringData can */}}
{{/* never match the object that comes back. CDC's three-way merge therefore saw drift on EVERY */}}
{{/* reconcile and ran a real helm upgrade each cycle — a release-record write roughly every two */}}
{{/* minutes, which at HELM_MAX_HISTORY=3 rotated every rollback target out within six. */}}
{{/* */}}
{{/* This was diagnosed as the randAlphaNum re-rendering. It was not: release records v36 and v37 */}}
{{/* on krateo-057 hold BYTE-IDENTICAL manifests, so the lookup guard above was already doing its */}}
{{/* job and the password was stable. The perpetual diff was this field the whole time. */}}
data:
  password: {{ $password | b64enc | quote }}
---
apiVersion: basic.authn.krateo.io/v1alpha1
kind: User
metadata:
  name: cyberjoker
  namespace: {{ .Release.Namespace }}
spec:
  displayName: Cyber Joker
  avatarURL: https://i.pravatar.cc/256?img=70
  groups:
    - devs
  passwordRef:
    namespace: {{ .Release.Namespace }}
    name: cyberjoker-password
    key: password
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devs-get-list-any-template-in-krateo-namespace
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - widgets.templates.krateo.io
  resources:
  - '*'
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devs-get-list-any-template-in-krateo-namespace
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devs-get-list-any-template-in-krateo-namespace
subjects:
- kind: Group
  name: devs
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devs-get-any-restaction-in-krateo-namespace
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - templates.krateo.io
  resources:
  - restactions
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devs-get-any-restaction-in-krateo-namespace
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devs-get-any-restaction-in-krateo-namespace
subjects:
- kind: Group
  name: devs
  apiGroup: rbac.authorization.k8s.io
---
{{/* NO CLUSTER-SCOPED PERMISSIONS. `devs` carries no ClusterRole and no ClusterRoleBinding (#261).

     It used to carry two, and both existed to satisfy a portal read rather than to express
     anything about the persona:

       devs-list-any-namespace-in-cluster                      list namespaces
       devs-get-list-any-customresourcedefinition-in-cluster   get,list customresourcedefinitions

     `restaction.projects` asked "may I list namespaces" in its userAccessFilter — a CLUSTER-SCOPED
     question, so a namespaced Role could never answer it and the only way to make the header's
     project picker non-empty was a cluster-wide grant. It now asks where the caller may list
     COMPOSITIONS, which is both the truer meaning of a project and a question a Role can carry.

     Four steps LISTED CRDs to discover the composition kinds. They now read CompositionDefinitions
     cluster-scope under a userAccessFilter — dialled by snowplow's SA, narrowed per item — which is
     how compositions-list has always done it, and why cyberjoker's Compositions page worked while
     he could not `list compositiondefinitions` in any namespace but demo-system.

     `blueprint-formdef` GOT a CRD by name for the create form at /blueprints/{ns}/{name}/new. The
     CRD read stays and still degrades through continueOnError, but it is no longer REQUIRED: the
     not-ready gate now accepts the namespaced jsonschema ConfigMap on its own, which is the source
     `stringSchema` (the Form's preferred input) was always built from, and which exists for every
     reconciled CompositionDefinition — 55 of 55 on krateo-057.

     The form steps on the ADMIN pages (alert, agent, agents-policy, controller-configure, the
     marketplace install) still read a CRD by name and still need cluster read. That is now a
     property of those pages rather than of the platform: `admins` is bound to cluster-admin, and
     nothing a dev reaches requires a ClusterRole. scripts/lint-caller-cluster-reads.py holds the
     line, and lists them with the page each belongs to.

     A grant added back here should be a Role in a namespace. If something appears to need cluster
     scope, the question it asks is probably the wrong one — that was true of both of these. */}}
---
{{- if .Values.enableDemoSystemNamespace }}
{{/* demo-system permissions */}}
