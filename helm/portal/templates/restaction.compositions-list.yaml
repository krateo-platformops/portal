apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: compositions-list
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
  {{/* RBAC-native type discovery — list CompositionDefinitions (NOT CRDs), scoped by userAccessFilter. */}}
  {{/* */}}
  {{/* A no-userAccessFilter api step is dispatched AS THE CALLER (internal/dynamic/sa_client.go). The */}}
  {{/* original shape listed /apis/apiextensions.k8s.io/v1/customresourcedefinitions cluster-wide → a */}}
  {{/* narrowed-RBAC tenant (no cluster CRD-list grant) got empty discovery → the whole list came back */}}
  {{/* blank for any non-admin (reproduced live). */}}
  {{/* */}}
  {{/* #72 / #70-migration SHAPE: list core.krateo.io CompositionDefinitions cluster-wide UNDER a */}}
  {{/* userAccessFilter on `compositiondefinitions`. snowplow lists as its SA (which holds the cluster- */}}
  {{/* wide grant), then REFILTERS to the CDs in namespaces where the CALLER can list them. So a tenant */}}
  {{/* discovers types in EVERY namespace it is granted (krateo-system, krateo-blueprints per acmp#53, */}}
  {{/* its own ns, …) — with NO hardcoded namespaces and NO tenant ClusterRole (the cluster read is the */}}
  {{/* SA's; the tenant needs only its plain namespaced CD-list Roles). This SUPERSEDES the earlier */}}
  {{/* namespaced-enumeration shape (crds=release-ns + crdsBlueprints=blueprint-ns union), which covered */}}
  {{/* only two fixed namespaces. The `name: crds` key + {plural, version} output are UNCHANGED, so */}}
  {{/* allCompositions's dependsOn/iterator + resourcesFrom are untouched; per-INSTANCE visibility stays */}}
  {{/* gated by allCompositions' own userAccessFilter. See snowplow #118 (UAF cache/refilter fidelity). */}}
  - name: crds
    path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
    verb: GET
    userAccessFilter:
      verb: list
      group: core.krateo.io
      resource: compositiondefinitions
      namespaceFrom: .metadata.namespace
    filter: "[.crds.items[]? | select(.status.resource != null and .status.apiVersion != null) | {plural: .status.resource, version: (.status.apiVersion | split(\"/\")[1])}] | unique"
    continueOnError: true
    errorKey: crdsError
  - name: allCompositions
    {{/* Phase 3' / portal-chart 0.30.177 — namespace-dim REMOVED from iterator. */}}
    {{/* */}}
    {{/* PRIOR SHAPE (portal-chart 0.30.176): iterator was the K×N (CRDs × */}}
    {{/* namespaces) cross-product emitted by compositions-get-ns-and-crd. The */}}
    {{/* per-(CRD,ns) LIST then ran through snowplow's cluster_list collapse to */}}
    {{/* a single cluster-scope LIST per CRD (Ship D.5 / 0.30.152). */}}
    {{/* */}}
    {{/* NEW SHAPE: iterator is just the K CRD entries. Each iteration hits the */}}
    {{/* cluster-scope LIST endpoint /apis/composition.krateo.io/<version>/<plural> */}}
    {{/* directly (no /namespaces/<ns>/ segment). The per-item UAF gates by */}}
    {{/* .metadata.namespace, so narrow-RBAC users receive only items in */}}
    {{/* namespaces where they hold the grant — byte-equivalent to today's */}}
    {{/* runtime collapse + per-item refilter. */}}
    dependsOn:
      name: crds
      iterator: ".crds"
    path: ${ "/apis/composition.krateo.io/" + (.version) + "/" + (.plural) }
    verb: GET
    continueOnError: true
    errorKey: allCompositionsError
    userAccessFilter:
      verb: list
      group: composition.krateo.io
      resourcesFrom: "[ (.crds // [])[] | .plural ]"
      namespaceFrom: .metadata.namespace
    filter: >
      [.allCompositions.items[]?
       | {uid: .metadata.uid, name: .metadata.name, ns: .metadata.namespace, ts: .metadata.creationTimestamp, kind: .kind, av: .apiVersion, conditions: (.status.conditions // []), evaluated: .status.healthEvaluatedChildren, managed: .status.managedChildrenCount, unreadable: .status.unreadableChildrenCount, wh: .status.workloadHealthy, whMsg: (.status.healthMessage // ""), platform: ((((.metadata.labels // {})["krateo.io/composition-name"]) == "installer") or (((.metadata.labels // {})["krateo.io/composition-definition-name"]) == "installer"))}]
  {{/* Final shape. `list` stays the FULL (ns-scoped) set — the dashboard stat/donut/delta */}}
  {{/* widgets share this RA and read `.list` for totals, so it must NOT be date/status */}}
  {{/* filtered. The compositions PAGE reads `.filtered` (status + time-window applied) and */}}
  {{/* `.counts` (per-status totals for the toolbar chips). All scope params come from the */}}
  {{/* request `extras` (?status, ?range, ?from, ?to in the URL, read synchronously — same */}}
  {{/* mechanism as dashboard-data's ?range). Each item gains a derived `.state` */}}
  {{/* (healthy/pending/failed from the Ready condition) so filtering/counting is one pass. */}}
  {{/* A composition still Creating is converging, so it is pending and not failed: counting it as */}}
  {{/* failed put every new composition on the dashboard's failure count. A paused one reports */}}
  {{/* Ready=True and Synced=False on purpose, which is why railState checks it first: it would */}}
  {{/* otherwise read as Drift. Reasons are the values core-provider emits. */}}
  {{/* NOT ASSESSABLE. Ready=Unknown with reason exactly `ZeroEvidence` means none of the */}}
  {{/* composition's managed children has readiness semantics the controller can read */}}
  {{/* (unstructured-runtime condition.go). That is permanent and healthy, so `assessable: false` */}}
  {{/* takes it out of the dashboard's Pending figures. The match is on the REASON: Unknown also */}}
  {{/* comes with ChildrenForbidden and InventoryNotRecorded (cdc childhealth.go), which are */}}
  {{/* defects, and the set of reasons is open, so any other Unknown stays assessable. `.state` and */}}
  {{/* `.railState` are unchanged (the Compositions and Observability pages read them); `rail` is */}}
  {{/* the dashboard rail's bar, and `assessment` + `conditionCoverage` are its card and coverage */}}
  {{/* figures, computed over `list` (the same set the cards count). */}}
  {{/* ?status=drift is the ONE railState-backed value (Ready+Unsynced — a healthy-state */}}
  {{/* OVERLAY, so counts.drift overlaps counts.healthy): it powers the Drift chip and the */}}
  {{/* reconcile-breakdown drill-down; the other status values keep filtering on .state. */}}
  {{/* The scope params (status/range/q/from/to/projects) are ECHOED back so the toolbar */}}
  {{/* chip Listys (compositions-status-chips) can rebuild query-merged routes and their */}}
  {{/* active flag server-side — chip navigateTo does not client-merge like Buttons did. */}}
  filter: >
    (((.projects // "") | split(",") | map(select(. != ""))) as $projSel
     | ((.project // .namespace) // "") as $proj
     | if ($projSel | length) > 0 then $projSel elif $proj != "" then [$proj] else [] end) as $projects
    | (.status // "all") as $status
    | (.scope // "workloads") as $scope
    | ((.q // "") | ascii_downcase) as $q
    | now as $now
    | ((.allCompositions // []) | map(select(($projects | length) == 0 or (([.ns] - $projects) | length == 0))) | map(. + ((.conditions // []) as $c | (any($c[]?; .type == "Ready" and .status == "True")) as $ready | (any($c[]?; .type == "Ready" and .status == "False" and .reason != "Creating")) as $notready | (any($c[]?; .type == "Ready" and (.reason == "ReconcilePaused" or .reason == "ReconcileGracefullyPaused"))) as $paused | (any($c[]?; .type == "Synced" and .status == "False")) as $unsynced | ($ready and (.wh == false)) as $degraded | (any($c[]?; .type == "Ready" and .status == "Unknown" and .reason == "ZeroEvidence")) as $silent | (if $paused then "paused" elif $notready then "failed" elif $degraded then "degraded" elif $ready and ($unsynced | not) then "healthy" elif $ready and $unsynced then "drift" else "pending" end) as $railState | (if $notready then 20 elif $degraded then 50 elif $ready and ($unsynced | not) then 100 elif $ready and $unsynced then 50 else 50 end) as $healthPercent | {conditions: ((.conditions // []) + (if .wh == false then [{type: "Workload", status: "False", reason: "Unhealthy", message: (.whMsg // "")}] else [] end)), state: (if $notready then "failed" elif $degraded then "degraded" elif $ready then "healthy" else "pending" end), railState: $railState, healthPercent: $healthPercent, coverage: (if (.evaluated != null and .managed != null and .evaluated != .managed) then ((.evaluated | tostring) + "/" + (.managed | tostring)) else "" end), assessable: ($silent | not), rail: (if $silent then {percent: 0, state: "notAssessable", label: "No signal"} else {percent: $healthPercent, state: $railState, label: (($healthPercent | tostring) + "%")} end)}))) as $all
    | $all as $dated
    | ($dated | map(select(if $scope == "all" then true elif $scope == "platform" then .platform else (.platform | not) end))) as $scoped
    | ($all | map(select(.assessable | not)) | length) as $na
    | (($all | length) - $na) as $assessable
    | {
        list: $all,
        assessment: {
          total: ($all | length),
          assessable: $assessable,
          notAssessable: $na,
          pending: ($all | map(select(.assessable and .state == "pending")) | length),
          healthyPercent: (if $assessable > 0 then (($all | map(select(.state == "healthy")) | length) * 100 / $assessable | floor) else 0 end),
          pendingPercent: (if $assessable > 0 then (($all | map(select(.assessable and ((.conditions // []) | any(.type == "Ready" and (.status == "True" or .status == "False")) | not))) | length) * 100 / $assessable | floor) else 0 end)
        },
        conditionCoverage: (([ $all[].conditions[]?.type ] | unique) as $types | [ $types[] | . as $t | ($all | map(select($t != "Ready" or .assessable))) as $l | ([ $l[] | select(any(.conditions[]?; .type == $t and .status == "True")) ] | length) as $tc | ([ $l[] | select(any(.conditions[]?; .type == $t)) ] | length) as $n | { type: $t, percent: (if $n > 0 then ($tc * 100 / $n | floor) else 0 end), label: (($tc | tostring) + "/" + ($n | tostring)), route: (if $t == "Ready" then "/compositions?status=failed" else "" end), note: (if $t == "Ready" and $na > 0 then ("+ " + ($na | tostring) + " not assessable (no readiness signal)") else "" end) } ]),
        filtered: ($scoped | map(select((if $status == "drift" then (.railState == "drift") else ($status == "all" or .state == $status) end) and ($q == "" or ((.name // "") | ascii_downcase | contains($q)) or ((.kind // "") | ascii_downcase | contains($q)))))),
        counts: {all: ($scoped | length), healthy: ($scoped | map(select(.state == "healthy")) | length), drift: ($scoped | map(select(.railState == "drift")) | length), pending: ($scoped | map(select(.state == "pending")) | length), degraded: ($scoped | map(select(.state == "degraded")) | length), failed: ($scoped | map(select(.state == "failed")) | length)},
        scopeCounts: {workloads: ($dated | map(select(.platform | not)) | length), platform: ($dated | map(select(.platform)) | length), all: ($dated | length)},
        scope: $scope,
        status: $status,
        q: ((.q // "") | tostring),
        projects: ((.projects // "") | tostring)
      }
