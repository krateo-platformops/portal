apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: compositions-list
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
  {{/* RBAC-native type discovery — list CompositionDefinitions (NOT CRDs), scoped by userAccessFilter. */}}
  {{/* */}}
  {{/* A no-userAccessFilter api step is dispatched AS THE CALLER (internal/dynamic/sa_client.go). The */}}
  {{/* original shape listed /apis/apiextensions.k8s.io/v1/customresourcedefinitions cluster-wide → a */}}
  {{/* narrowed-RBAC tenant (no cluster CRD-list grant) got empty discovery → the whole list came back */}}
  {{/* blank for any non-admin (reproduced live). */}}
  {{/* */}}
  {{/* #72 / #70-migration SHAPE: list core.krateo.io CompositionDefinitions cluster-wide UNDER a */}}
  {{/* userAccessFilter on `compositiondefinitions`. snowplow lists as its SA (which holds the cluster- */}}
  {{/* wide grant), then REFILTERS to the CDs in namespaces where the CALLER can list them. So a tenant */}}
  {{/* discovers types in EVERY namespace it is granted (krateo-system, krateo-blueprints per acmp#53, */}}
  {{/* its own ns, …) — with NO hardcoded namespaces and NO tenant ClusterRole (the cluster read is the */}}
  {{/* SA's; the tenant needs only its plain namespaced CD-list Roles). This SUPERSEDES the earlier */}}
  {{/* namespaced-enumeration shape (crds=release-ns + crdsBlueprints=blueprint-ns union), which covered */}}
  {{/* only two fixed namespaces. The `name: crds` key + {plural, version} output are UNCHANGED, so */}}
  {{/* allCompositions's dependsOn/iterator + resourcesFrom are untouched; per-INSTANCE visibility stays */}}
  {{/* gated by allCompositions' own userAccessFilter. See snowplow #118 (UAF cache/refilter fidelity). */}}
  - name: crds
    path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
    verb: GET
    userAccessFilter:
      verb: list
      group: core.krateo.io
      resource: compositiondefinitions
      namespaceFrom: .metadata.namespace
    filter: "[.crds.items[]? | select(.status.resource != null and .status.apiVersion != null) | {plural: .status.resource, version: (.status.apiVersion | split(\"/\")[1])}] | unique"
    continueOnError: true
    errorKey: crdsError
  - name: allCompositions
    {{/* Phase 3' / portal-chart 0.30.177 — namespace-dim REMOVED from iterator. */}}
    {{/* */}}
    {{/* PRIOR SHAPE (portal-chart 0.30.176): iterator was the K×N (CRDs × */}}
    {{/* namespaces) cross-product emitted by compositions-get-ns-and-crd. The */}}
    {{/* per-(CRD,ns) LIST then ran through snowplow's cluster_list collapse to */}}
    {{/* a single cluster-scope LIST per CRD (Ship D.5 / 0.30.152). */}}
    {{/* */}}
    {{/* NEW SHAPE: iterator is just the K CRD entries. Each iteration hits the */}}
    {{/* cluster-scope LIST endpoint /apis/composition.krateo.io/<version>/<plural> */}}
    {{/* directly (no /namespaces/<ns>/ segment). The per-item UAF gates by */}}
    {{/* .metadata.namespace, so narrow-RBAC users receive only items in */}}
    {{/* namespaces where they hold the grant — byte-equivalent to today's */}}
    {{/* runtime collapse + per-item refilter. */}}
    dependsOn:
      name: crds
      iterator: ".crds"
    path: ${ "/apis/composition.krateo.io/" + (.version) + "/" + (.plural) }
    verb: GET
    continueOnError: true
    errorKey: allCompositionsError
    userAccessFilter:
      verb: list
      group: composition.krateo.io
      resourcesFrom: "[ (.crds // [])[] | .plural ]"
      namespaceFrom: .metadata.namespace
    filter: >
      [.allCompositions.items[]?
       | {uid: .metadata.uid, name: .metadata.name, ns: .metadata.namespace, ts: .metadata.creationTimestamp, kind: .kind, av: .apiVersion, conditions: (.status.conditions // []), evaluated: .status.healthEvaluatedChildren, managed: .status.managedChildrenCount, unreadable: .status.unreadableChildrenCount, wh: .status.workloadHealthy, whMsg: (.status.healthMessage // ""), platform: ((((.metadata.labels // {})["krateo.io/composition-name"]) == "installer") or (((.metadata.labels // {})["krateo.io/composition-definition-name"]) == "installer"))}]
  {{/* Final shape. `list` stays the FULL (ns-scoped) set — the dashboard stat/donut/delta */}}
  {{/* widgets share this RA and read `.list` for totals, so it must NOT be date/status */}}
  {{/* filtered. The compositions PAGE reads `.filtered` (status + time-window applied) and */}}
  {{/* `.counts` (per-status totals for the toolbar chips). All scope params come from the */}}
  {{/* request `extras` (?status, ?range, ?from, ?to in the URL, read synchronously — same */}}
  {{/* mechanism as dashboard-data's ?range). Each item gains a derived `.state` */}}
  {{/* (healthy/pending/failed from the Ready condition) so filtering/counting is one pass. */}}
  {{/* A composition still Creating is converging, so it is pending and not failed: counting it as */}}
  {{/* failed put every new composition on the dashboard's failure count. A paused one reports */}}
  {{/* Ready=True and Synced=False on purpose, which is why railState checks it first: it would */}}
  {{/* otherwise read as Drift. Reasons are the values core-provider emits. */}}
  {{/* NOT ASSESSABLE. Two Ready=Unknown reasons mean the controller could judge NOT ONE of the */}}
  {{/* composition's managed children, so the composition cannot be judged either, and counting */}}
  {{/* it as Pending says it is converging, which it is not. `assessable: false` takes both out */}}
  {{/* of the dashboard's Pending figures and puts them in its "not assessable" count: */}}
  {{/*   ZeroEvidence       the children publish no readiness semantics the controller can read */}}
  {{/*                      (unstructured-runtime condition.go). Permanent, and nobody's defect, */}}
  {{/*                      so its rail row is neutral: gray, "No signal". */}}
  {{/*   ChildrenForbidden  at least one read was REFUSED by RBAC and nothing else was assessed */}}
  {{/*                      (cdc childhealth.go, core-provider#318). A defect in the generated */}}
  {{/*                      RBAC an operator can fix, so its rail row is the attention colour, */}}
  {{/*                      "Children unreadable" (rail.state `unreadable`): set aside like */}}
  {{/*                      ZeroEvidence, but not passed off as a quiet one. */}}
  {{/* This used to keep ChildrenForbidden assessable (Pending) for being a defect; Diego's */}}
  {{/* decision of 2026-11-10 replaced that: a defect is shown as one, not as progress. The */}}
  {{/* match is on those two REASONS, exactly as core-provider emits them: Unknown also comes */}}
  {{/* with InventoryNotRecorded (transient by design), and the set of reasons is open, so any */}}
  {{/* other Unknown stays assessable and Pending. `.state` and `.railState` are `unreadable` for */}}
  {{/* ChildrenForbidden too (Diego, 2026-11-10, the same day), so the Compositions page says */}}
  {{/* "Children unreadable" rather than "Pending" and the Pending counts there and on the */}}
  {{/* Observability page leave it out; ?status=unreadable filters to them (counts.unreadable). */}}
  {{/* ZeroEvidence keeps `.state` pending on those pages: it is not a defect to point at. `rail` */}}
  {{/* is the dashboard rail's bar, and `assessment` + `conditionCoverage` are its card and */}}
  {{/* coverage figures, computed over `list` (the same set the cards count). `rail.reason` is */}}
  {{/* set on a not assessable row only, and the rail shows it on hover over its label: */}}
  {{/* "Ready=Unknown · <reason>: <message>". The message is the controller's, less its opening */}}
  {{/* "Composition health is unknown: " (both reasons' messages start with it), which says */}}
  {{/* again what Ready=Unknown says; for ChildrenForbidden it names the refused children. Any */}}
  {{/* other row has no `rail.reason`, so its label has no tooltip. */}}
  {{/* `assessment.pendingPercent` is `pending` over `assessable`, from the one `$pending` count, so */}}
  {{/* the Pending card's figure and its tag cannot disagree. It used to count rows whose Ready was */}}
  {{/* neither True nor False, which left out Ready=False/Creating (Pending, above): the card could */}}
  {{/* say 3 beside a tag computed from 2. */}}
  {{/* ?status=drift is the ONE railState-backed value (Ready+Unsynced — a healthy-state */}}
  {{/* OVERLAY, so counts.drift overlaps counts.healthy): it powers the Drift chip and the */}}
  {{/* reconcile-breakdown drill-down; the other status values keep filtering on .state. */}}
  {{/* The scope params (status/range/q/from/to/projects) are ECHOED back so the toolbar */}}
  {{/* chip Listys (compositions-status-chips) can rebuild query-merged routes and their */}}
  {{/* active flag server-side — chip navigateTo does not client-merge like Buttons did. */}}
  {{/* ASK AGENTIKO. `askHref` for /compositions (compositions-page button.compositions-ask-agentiko),
       @uri-encoded server-side so its Button is a plain navigate. /compositions shows `.filtered`
       (status, scope, search and namespace applied) and counts it, so the prompt is about THAT view
       and its link keeps the same ?status/?scope/?q/?projects. It lists the unhealthy compositions,
       failed first, at most eight. (The Dashboard's link used to be built here too, as
       `dashboardAskHref`; the Dashboard is now the platform inbox and its prompt comes from
       dashboard-page's dashboard-inbox.)
       `readError` is the first error of the two list stages, which used to be swallowed: with
       continueOnError, a refused or failed read looked like a platform with no compositions. A
       prompt never says "no compositions" over a failed read: with nothing read it asks what the
       error means, and with part of the list read it says the list may be incomplete. The
       Observability staleness RESTAction treats the same two error keys the same way. */}}
  filter: >
    {{- include "portal.facets" . | nindent 4 }}
    def errmsg: (if type == "array" then .[0] else . end) | if type == "object" then (.message // .reason // tojson) elif type == "string" then . else tojson end;
    def cap($n): if length > $n then (.[0:($n - 1)] + "…") else . end;
    def nn($k; $one; $many): ($k | tostring) + " " + (if $k == 1 then $one else $many end);
    def attention: if .state == "failed" then 0 elif .state == "degraded" then 1 elif .state == "unreadable" then 2 elif .railState == "drift" then 3 elif .state == "paused" then 4 else null end;
    def why: if .state == "failed" then "failed" elif .state == "degraded" then "degraded" elif .state == "unreadable" then "children unreadable" elif .state == "paused" then "reconcile paused" else "drifted" end;
    def unhealthy: [ .[] | select(attention != null) ] | sort_by(attention, .kind, .name) | .[0:8] | to_entries | map(((.key + 1) | tostring) + ". " + (.value | (.kind // "") + "/" + (.name // "") + " · " + (.ns // "") + " — " + why)) | join(" ");
    (first([.crdsError, .allCompositionsError][] | select(. != null and . != [] and . != "") | errmsg) // "" | cap(300)) as $readError
    | (((.projects // "") | split(",") | map(select(. != ""))) as $projSel
     | ((.project // .namespace) // "") as $proj
     | if ($projSel | length) > 0 then $projSel elif $proj != "" then [$proj] else [] end) as $projects
    | . as $in
    | ["projects", "scope", "status", "kind", "q", "view"] as $keys
    | ($in | fx_filters(["status", "kind"])) as $flt0
    | ([ $flt0.status[] | ascii_downcase | select(. != "all") ] | unique) as $statusSel
    | (if ($statusSel | length) == 1 then $statusSel[0] elif ($statusSel | length) == 0 then "all" else "several" end) as $status
    | (.scope // "workloads") as $scope
    | ((.q // "") | tostring | gsub("^\\s+|\\s+$"; "") | ascii_downcase) as $q
    | ($flt0 + { status: $statusSel, q: (if $q == "" then [] else ["1"] end) }) as $flt
    | fx_set(($in | fx_params($keys)); "status"; ($statusSel | join(","))) as $p
    | ((($in.view // "") | tostring) == "table") as $tableView
    | now as $now
    | ((.allCompositions // []) | map(select(($projects | length) == 0 or (([.ns] - $projects) | length == 0))) | map(. + ((.conditions // []) as $c | (any($c[]?; .type == "Ready" and .status == "True")) as $ready | (any($c[]?; .type == "Ready" and .status == "False" and .reason != "Creating")) as $notready | (any($c[]?; .type == "Ready" and (.reason == "ReconcilePaused" or .reason == "ReconcileGracefullyPaused"))) as $paused | (any($c[]?; .type == "Synced" and .status == "False")) as $unsynced | ($ready and (.wh == false)) as $degraded | (any($c[]?; .type == "Ready" and .status == "Unknown" and .reason == "ZeroEvidence")) as $silent | (any($c[]?; .type == "Ready" and .status == "Unknown" and .reason == "ChildrenForbidden")) as $unreadable | (if $paused then "paused" elif $notready then "failed" elif $degraded then "degraded" elif $ready and ($unsynced | not) then "healthy" elif $ready and $unsynced then "drift" elif $unreadable then "unreadable" else "pending" end) as $railState | (if $notready then 20 elif $degraded then 50 elif $ready and ($unsynced | not) then 100 elif $ready and $unsynced then 50 else 50 end) as $healthPercent | {conditions: ((.conditions // []) + (if .wh == false then [{type: "Workload", status: "False", reason: "Unhealthy", message: (.whMsg // "")}] else [] end)), state: (if $paused then "paused" elif $notready then "failed" elif $degraded then "degraded" elif $ready then "healthy" elif $unreadable then "unreadable" else "pending" end), railState: $railState, healthPercent: $healthPercent, coverage: (if (.evaluated != null and .managed != null and .evaluated != .managed) then ((.evaluated | tostring) + "/" + (.managed | tostring)) else "" end), assessable: (($silent or $unreadable) | not), rail: (if ($silent or $unreadable) then {percent: 0, state: (if $silent then "notAssessable" else "unreadable" end), label: (if $silent then "No signal" else "Children unreadable" end), reason: (first($c[]? | select(.type == "Ready" and .status == "Unknown" and (.reason == "ZeroEvidence" or .reason == "ChildrenForbidden")) | ((.message // "") | ltrimstr("Composition health is unknown: ")) as $m | "Ready=" + .status + " · " + .reason + (if $m != "" then ": " + $m else "" end)) // "")} else {percent: $healthPercent, state: $railState, label: (($healthPercent | tostring) + "%")} end)}))) as $all
    | $all as $dated
    | ($dated | map(select(if $scope == "all" then true elif $scope == "platform" then .platform else (.platform | not) end))) as $scoped
    | ($all | map(select(.assessable | not)) | length) as $na
    | (($all | length) - $na) as $assessable
    | ($all | map(select(.assessable and .state == "pending")) | length) as $pending
    {{/* THE FACETS (portal.facets). One state per composition, its railState (paused first, then
         NotReady, Degraded, Ready, Drift, Children unreadable, Pending), so ?status= takes the values
         the old chips wrote (healthy, failed, degraded, drift, pending, unreadable) plus paused; it is
         read in any case, `all` is no filter, and it takes several values now. Search matches name or
         kind. The base set is the scope (My workloads, Platform, Everything): the facets count and hide
         over it. No # comments in this filter: it is a folded block, which would join them to the
         code that follows. */}}
    | { healthy: "Ready", paused: "Paused", degraded: "Degraded", drift: "Drift", failed: "NotReady", unreadable: "Children unreadable", pending: "Pending" } as $stateNames
    | ($scoped | map(. + { f: { status: .railState, kind: ((.kind // "") | gsub(","; "")),
                                q: (if $q == "" then "" elif (((.name // "") + " " + (.kind // "")) | ascii_downcase | contains($q)) then "1" else "0" end) } })) as $scopedF
    | ($scopedF | fx_apply($flt)) as $filtered
    | [ fx_facet($scopedF; $flt; "status"; "State"; $stateNames), fx_facet($scopedF; $flt; "kind"; "Kind"; {}) ] as $facets
    | ([ $facets[] | select((.active | length) > 0) | .label + ": " + ([ .values[] | select(.active) | .label ] | join(", ")) ] | join("; ")) as $facetDesc
    | ([ (if $facetDesc != "" then $facetDesc else empty end),
         (if $scope == "platform" then "platform components only" elif $scope == "all" then "workloads and platform components" else empty end),
         (if ($projects | length) > 0 then ("namespace" + (if ($projects | length) > 1 then "s " else " " end) + ($projects | join(", "))) else empty end),
         (if $q != "" then "name or type matching \"" + ((.q // "") | tostring | cap(60)) + "\"" else empty end) ] | join("; ")) as $view
    | (if $readError != "" then " Part of the list could not be read (" + $readError + "), so this may not be all of them." else "" end) as $partial
    | (if $readError != "" and ($all | length) == 0 then
         "My compositions could not be read (" + $readError + "). Explain what that error means and what to check."
       elif ($filtered | length) == 0 then
         "No composition is in view" + (if $view != "" then " (" + $view + ")" else "" end)
         + (if ($all | length) > 0 then "; " + nn($all | length; "other composition is"; "other compositions are") + " outside it. Tell me whether that is expected, and whether anything in my other compositions needs attention."
            else ". Explain how a composition is created on this platform from an installed blueprint." end)
       else
         ($filtered | unhealthy) as $bad
         | "Review my compositions" + (if $view != "" then " (" + $view + ")" else "" end) + ": "
           + ($filtered | length | tostring) + " in view — "
           + ($filtered | map(select(.state == "healthy")) | length | tostring) + " healthy, "
           + ($filtered | map(select(.state == "failed")) | length | tostring) + " failed, "
           + ($filtered | map(select(.state == "degraded")) | length | tostring) + " degraded, "
           + ($filtered | map(select(.railState == "drift")) | length | tostring) + " drifted, "
           + ($filtered | map(select(.state == "paused")) | length | tostring) + " paused, "
           + ($filtered | map(select(.state == "pending")) | length | tostring) + " pending, "
           + ($filtered | map(select(.state == "unreadable")) | length | tostring) + " with unreadable children."
           + (if $bad != "" then " The ones that need attention are: " + $bad + ". For each, explain what is wrong from its conditions and managed resources, and what to fix first."
              else " None of them is failed, degraded, drifted, paused or unreadable. Check their conditions and managed resources and tell me whether anything still needs attention." end)
       end + (if ($all | length) > 0 then $partial else "" end)) as $askPrompt
    | {
        readError: $readError,
        askHref: fx_href("/compositions"; $p + [["ask", $askPrompt]]),
        list: $all,
        assessment: {
          total: ($all | length),
          assessable: $assessable,
          notAssessable: $na,
          pending: $pending,
          healthyPercent: (if $assessable > 0 then (($all | map(select(.state == "healthy")) | length) * 100 / $assessable | floor) else 0 end),
          pendingPercent: (if $assessable > 0 then ($pending * 100 / $assessable | floor) else 0 end)
        },
        conditionCoverage: (([ $all[].conditions[]?.type ] | unique) as $types | [ $types[] | . as $t | ($all | map(select($t != "Ready" or .assessable))) as $l | ([ $l[] | select(any(.conditions[]?; .type == $t and .status == "True")) ] | length) as $tc | ([ $l[] | select(any(.conditions[]?; .type == $t)) ] | length) as $n | { type: $t, percent: (if $n > 0 then ($tc * 100 / $n | floor) else 0 end), label: (($tc | tostring) + "/" + ($n | tostring)), route: (if $t == "Ready" then "/compositions?status=failed" else "" end), note: (if $t == "Ready" and $na > 0 then ("+ " + ($na | tostring) + " not assessable (no readiness signal)") else "" end) } ]),
        filtered: $filtered,
        counts: {all: ($scoped | length), healthy: ($scoped | map(select(.state == "healthy")) | length), drift: ($scoped | map(select(.railState == "drift")) | length), pending: ($scoped | map(select(.state == "pending")) | length), unreadable: ($scoped | map(select(.state == "unreadable")) | length), degraded: ($scoped | map(select(.state == "degraded")) | length), failed: ($scoped | map(select(.state == "failed")) | length)},
        scopeHrefs: { workloads: fx_href("/compositions"; fx_set($p; "scope"; "")), platform: fx_href("/compositions"; fx_set($p; "scope"; "platform")), all: fx_href("/compositions"; fx_set($p; "scope"; "all")) },
        scopeCounts: {workloads: ($dated | map(select(.platform | not)) | length), platform: ($dated | map(select(.platform)) | length), all: ($dated | length)},
        scope: $scope,
        status: $status,
        {{/* THE OVERVIEW (root-pages UX slice 3a, build plan §3.4; mockup screen 02), over the */}}
        {{/* filtered set: the facets and their chips, the strip, every composition in view by */}}
        {{/* state (the widgets cap and place them), Ready by kind, and the table view's hrefs. */}}
        facets: $facets,
        filteredBy: $facetDesc,
        filteredAny: ([ $flt[] | select(length > 0) ] | length > 0),
        view: (if $tableView then "table" else "" end),
        chips: fx_chips("/compositions"; $p; $facets),
        tableHref: fx_href("/compositions"; fx_set($p; "view"; "table")),
        cardsHref: fx_href("/compositions"; fx_set($p; "view"; "")),
        stateTableHrefs: ($stateNames | keys | map({ key: ., value: fx_seeall("/compositions"; $p; "status"; .) }) | from_entries),
        matched: ($filtered | length),
        strip: { total: ($scoped | length),
                 notReady: ($filtered | map(select(.railState == "failed")) | length),
                 degraded: ($filtered | map(select(.railState == "degraded")) | length),
                 drift: ($filtered | map(select(.railState == "drift")) | length),
                 paused: ($filtered | map(select(.railState == "paused")) | length),
                 ready: ($filtered | map(select(.railState == "healthy")) | length),
                 readyKinds: ($filtered | map(select(.railState == "healthy") | .kind) | unique | length) },
        byState: ($filtered | group_by(.railState)
                  | map({ key: .[0].railState, value: [ sort_by(.ts) | reverse | .[] | { name, ns, kind, ts,
                      reason: ((.conditions // []) | map(select(.type == "Ready")) | .[0].reason // ""),
                      message: (((.conditions // []) | map(select(.type == "Ready" or .type == "Synced" or .type == "Workload") | select(.status != "True" or (.reason // "") == "ReconcilePaused" or (.reason // "") == "ReconcileGracefullyPaused")) | .[0].message // "") | tostring | cap(220)),
                      notAssessable: (.assessable | not) } ] }) | from_entries),
        readyByKind: ($filtered | map(select(.railState == "healthy")) | group_by(.kind)
                      | map((sort_by(.ts) | reverse) as $k
                            | { kind: $k[0].kind, count: ($k | length), newest: $k[0].ts, names: [ $k[0:3][] | .name ],
                                reasons: ([ $k[] | (.conditions // []) | map(select(.type == "Ready")) | .[0].reason // "" | select(. != "Available" and . != "") ]
                                          | group_by(.) | map({ reason: .[0], count: length })),
                                href: (if ($k | length) == 1 then "/compositions/" + $k[0].ns + "/" + $k[0].name
                                       else fx_href("/compositions"; fx_set(fx_set(fx_set($p; "status"; "healthy"); "kind"; $k[0].kind); "view"; "table")) end) })
                      | sort_by(-.count, .kind)),
        q: ((.q // "") | tostring),
        projects: ((.projects // "") | tostring)
      }
