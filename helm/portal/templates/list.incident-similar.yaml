{{/* Similar incidents: the same alert's other incidents first (newest first), then incidents with */}}
{{/* the same root-cause category, at most 6, matched server-side (incident-detail .similar). */}}
{{/* Rows open the sibling incident. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-similar
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    dataSource: []
    itemLayout: horizontal
    split: false
    hideWhenEmpty: true
    itemTemplate:
      navigateTo: '/incidents/{namespace}/{name}'
      iconVariant: dot
      color:
        value: '{state}'
        map:
          Open: red
          Verifying: orange
          Resolved: green
        default: gray
      primaryText: '{title}'
      subPrimaryText: '{reason}'
      secondaryText: '{state}'
      secondaryTextAsTag: true
      subSecondaryText: '{when}'
      formats:
        subSecondaryText: relative
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .similar // [] }'
  resourcesRefs:
    items: []
