{{/* The composition the analysis isolated, as a link to its detail page. The label and the */}}
{{/* path come from incident-detail (.ref / .refRoute); the chips Flex includes this button only */}}
{{/* when refRoute is non-empty. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-ref-link
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: incident-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    label: '—'
    type: link
    size: small
    icon: fa-arrow-up-right-from-square
    clickActionId: open-composition
    actions:
      navigate:
        - id: open-composition
          type: navigate
          path: /compositions
  widgetDataTemplate:
    - forPath: label
      expression: '${ .ref // "—" }'
    {{/* Defensive fallback: the chips Flex only renders this widget when refRoute is */}}
    {{/* non-empty, but if it ever renders without one the click lands on the */}}
    {{/* compositions LIST, never a 404. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "open-composition", type: "navigate", path: (if (.refRoute // "") != "" then .refRoute else "/compositions" end) } ] } }'
  resourcesRefs:
    items: []
