kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-trend
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, from, to]
  widgetData:
    title: Spend over time
    titleVariant: eyebrow
    tooltip: US dollars per interval (UTC), stacked by the five callers who spent most in the range; the rest are "others". Priced with the agent gateway's price list.
    variant: outlined
    allowedResources:
    - barcharts
    items:
    - resourceRefId: agents-cost-trend
  resourcesRefs:
    items:
    - id: agents-cost-trend
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-trend
      namespace: {{ $.Values.namespace }}
      resource: barcharts
      verb: GET
