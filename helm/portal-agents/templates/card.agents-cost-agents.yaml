kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-agents
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, from, to]
  widgetData:
    title: By agent
    titleVariant: eyebrow
    tooltip: Each agent's model calls, matched to the agent gateway's record of the same call, for the agents you can read. Incident comparison is the one call the alert provider makes per alert firing, without an agent, to match it with an open incident. Other calls are the rest of the gateway's calls.
    variant: outlined
    allowedResources:
    - tables
    items:
    - resourceRefId: agents-cost-agents
  resourcesRefs:
    items:
    - id: agents-cost-agents
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-agents
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
