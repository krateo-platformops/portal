{{/* The spend view, stacked: the time range, the exception line (empty when all is well), the */}}
{{/* figures, the trend beside the model split, spend per agent, then per user beside per group. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, from, to]
  widgetData:
    allowedResources:
    - flexes
    - paragraphs
    - listies
    - rows
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-cost-range
    - resourceRefId: agents-cost-notice
    - resourceRefId: agents-cost-stats
    - resourceRefId: agents-cost-trend-row
    - resourceRefId: agents-cost-agents-card
    - resourceRefId: agents-cost-people-row
  resourcesRefs:
    items:
    - id: agents-cost-range
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-range
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: agents-cost-notice
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-notice
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-cost-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-cost-trend-row
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-trend
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
    - id: agents-cost-agents-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-agents
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: agents-cost-people-row
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-people
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
