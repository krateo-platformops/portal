{{/* The spend view, top to bottom: the time range, the exception line (empty when all is well), the */}}
{{/* figures, then the main row (who spent it on two thirds, the charts on one third). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  widgetData:
    allowedResources:
    - flexes
    - paragraphs
    - listies
    - rows
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-cost-range
    - resourceRefId: agents-cost-notice
    - resourceRefId: agents-cost-stats
    - resourceRefId: agents-cost-main
  resourcesRefs:
    items:
    - id: agents-cost-range
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-range
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: agents-cost-notice
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-notice
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-cost-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-cost-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
