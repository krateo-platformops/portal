kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-groups
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, from, to]
  widgetData:
    title: By group
    titleVariant: eyebrow
    tooltip: A call counts once for every group its caller is in, so the shares can add up to more than 100%.
    variant: outlined
    allowedResources:
    - tables
    items:
    - resourceRefId: agents-cost-groups
  resourcesRefs:
    items:
    - id: agents-cost-groups
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-groups
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
