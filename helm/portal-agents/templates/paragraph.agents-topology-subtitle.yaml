{{/* Subtitle for the gateway-topology section — LIVE, because it is the only place the graph's */}}
{{/* exceptions can be stated in words. */}}
{{/* */}}
{{/* A node that is ABSENT explains nothing: a tool server this gateway has no route for is simply not */}}
{{/* drawn, an unreadable Gateway list leaves an empty canvas, and a reachability answer the action had */}}
{{/* to withhold looks identical to one it never had. restaction.agents-topology names all four cases */}}
{{/* (unrouted agents, withheld reachability, off-hub tool servers, failed reads) and computes the antd */}}
{{/* `type` alongside the text (server-side-computation rule); this widget renders both verbatim. */}}
{{/* */}}
{{/* The static fallback below is what renders before the action resolves. It states the DERIVATION and */}}
{{/* no counts — the counts are exactly the part that would be a lie if the reads behind them failed. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-topology-subtitle
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    text: >-
      One internal gateway carries a route for every agent and every tool server the agents dial,
      each selected by an x-kagent-host header naming the in-cluster host the calling agent dialled
      — read live from the Agent, Gateway, HTTPRoute, AgentgatewayBackend and RemoteMCPServer
      objects. The bench agents and the smaller tool servers are collapsed into one node each; drag
      and scroll to zoom.
    type: secondary
  apiRef:
    name: agents-topology
    namespace: {{ .Release.Namespace }}
  widgetDataTemplate:
  - forPath: text
    expression: '${ .subtitle }'
  - forPath: type
    expression: '${ .subtitleType }'
  resourcesRefs:
    items: []
