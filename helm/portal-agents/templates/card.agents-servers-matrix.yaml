{{/* The surface the agent x server matrix sits on — the fourth inventory frame on the agents pages */}}
{{/* (card.agents-list, card.agents-servers-list, card.agents-servers-bindings, this one), so every */}}
{{/* table on the page presents the same treatment instead of framed panels beside unframed ones. */}}
{{/* */}}
{{/* NO `title`: flex.agents-servers composes the head (the "Who may call what" h3 and the computed */}}
{{/* legend) immediately above this frame, exactly as the mockup does — its matrix lives in */}}
{{/* `<div class="card matrix">` with the heading stack outside the frame. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-matrix-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: outlined
    items:
    - resourceRefId: agents-servers-matrix
  resourcesRefs:
    items:
    - id: agents-servers-matrix
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-matrix
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
