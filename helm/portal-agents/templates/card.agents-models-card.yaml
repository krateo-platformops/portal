{{/* "By model": the agents in view by the model their ModelConfig resolves to (listy.agents-models). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-models-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    title: By model
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - listies
    items:
    - resourceRefId: agents-models
  resourcesRefs:
    items:
    - id: agents-models
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-models
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
