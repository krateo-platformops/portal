{{/* The tool servers, two thirds of the row: "Summary | Full list" top right, then the state chips
     (Needs attention, Healthy, Accepted, NotAccepted, Advisories, All), then one card per server in
     that state, or with ?view=table the full server table (table.agents-servers-list: endpoint,
     protocol, timeout, Discovered, In use, Agents, Status). When there is nothing to list, or the read failed, a line says so. The tooltip
     carries what the old section subtitle said about Status. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-list-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-servers
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Tool servers
    titleVariant: eyebrow
    tooltip: Every MCP server the agents on this cluster can reach. A server needs attention when it is not Accepted, when its endpoint leaves the cluster, or when an in-cluster endpoint has no agentgateway route in front of it; where the routing cannot be read, nothing is called unrouted and the line above says so.
    variant: outlined
    extraRefId: agents-servers-view-chips
    allowedResources:
    - listies
    - tables
    - paragraphs
    items:
    - resourceRefId: agents-servers-chips
    - resourceRefId: agents-servers-cards
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "agents-servers-chips" } ] + (if (.listCount // 0) == 0 then [ { resourceRefId: "agents-servers-empty" } ] elif .view == "table" then [ { resourceRefId: "agents-servers-list" } ] else [ { resourceRefId: "agents-servers-cards" } ] end) }'
  resourcesRefs:
    items:
    - id: agents-servers-view-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-view-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-servers-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-servers-cards
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-cards
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-servers-list
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-list
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
    - id: agents-servers-empty
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-empty
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
