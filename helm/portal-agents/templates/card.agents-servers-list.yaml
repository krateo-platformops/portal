{{/* The surface the tool-server inventory sits on — the sibling of card.agents-list, for the same */}}
{{/* reason: this table rendered flush on the page ground while every other surface in the feature is */}}
{{/* an outlined Card. */}}
{{/* */}}
{{/* NO `title`: flex.agents-servers-head puts "Tool servers" and its caption immediately above, so a */}}
{{/* Card title would repeat the section heading a few lines under itself. The frame is the whole */}}
{{/* contribution. */}}
{{/* */}}
{{/* The frame starts BELOW paragraph.agents-servers-notice on purpose (see flex.agents-servers): the */}}
{{/* notice is what the section says when a read did not answer, and a "could not read it" line boxed */}}
{{/* inside the panel it is qualifying reads as a property of the table's contents rather than a */}}
{{/* warning about them. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-list-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: outlined
    items:
    - resourceRefId: agents-servers-list
  resourcesRefs:
    items:
    - id: agents-servers-list
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-list
      namespace: {{ .Release.Namespace }}
      resource: tables
      verb: GET
