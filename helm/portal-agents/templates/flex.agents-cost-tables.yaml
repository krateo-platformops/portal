{{/* Spend per agent, per user, per group, top to bottom. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-tables
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  widgetData:
    allowedResources:
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-cost-agents-card
    - resourceRefId: agents-cost-users-card
    - resourceRefId: agents-cost-groups-card
  resourcesRefs:
    items:
    - id: agents-cost-agents-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-agents
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: agents-cost-users-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-users
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: agents-cost-groups-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-groups
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
