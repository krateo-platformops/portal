{{/* Search: an agent's or tool server's name and description, case-insensitive, written to ?q= on
     Enter (not per keystroke, hence the placeholder) and removed when cleared. agents-list applies
     it as one more filter, so the facet counts, the figures, the chips, the cards and the charts
     follow it, and every route it builds keeps it. It sits on the right of the toolbar. */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-search
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    name: q
    queryParam: q
    placeholder: Search agents and tool servers · press Enter
    allowClear: true
    size: middle
  resourcesRefs:
    items: []
