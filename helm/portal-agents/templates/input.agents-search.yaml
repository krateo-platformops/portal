{{/* Search: an agent's or tool server's name and description, case-insensitive, written to ?q= on
     Enter (not per keystroke, hence the placeholder) and removed when cleared. agents-list applies
     it as one more filter, so the facet counts follow it. */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-search
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view]
  widgetData:
    name: q
    queryParam: q
    placeholder: Search agents and servers · press Enter
    allowClear: true
    size: small
  resourcesRefs:
    items: []
