{{/* The five Tool servers figures (agents-servers `stats`): Tool servers, Accepted, NotAccepted,
     Advisories (an external endpoint, no gateway route, a condition Unknown), Tools discovered. The
     colour and the highlighted border come computed (`color`, `highlight`; portal.tileDefs, frontend
     >= 1.8.93): NotAccepted (red) and Advisories (orange), the cards' colours, are coloured and
     highlighted above 0 only; a 0 and the other three are neutral. A failed server read is "—",
     "could not be read", in orange and highlighted. A state tile (Accepted, NotAccepted,
     Advisories) opens the list filtered to that state (?group=accepted, notaccepted, advisory); the two
     totals and a failed read are plain tiles. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-servers
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      navigateTo: '{route}'
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
