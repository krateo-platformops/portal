{{/* The five Token usage figures over the range (agents-token-timeseries `stats`): Tokens (input plus
     output, cyan as the input line), LLM calls (blue), Cached input (gold, as the cached line), Errors
     (red: calls not answered 200), First token (violet: the average time to the first token, over the
     calls that report one). Every tile is coloured, zero or not; a failed ClickHouse read is "—",
     "could not be read", in orange. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-usage-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-token-timeseries
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      color:
        value: '{tone}'
        map:
          tokens: cyan
          calls: blue
          cached: gold
          errors: red
          ttft: violet
          unread: orange
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
