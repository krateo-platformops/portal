{{/* A one-item Flex around the Overview search, because a Row takes no `inputs` (as flex.incidents-
     search-wrap). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-search-wrap
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    allowedResources:
    - inputs
    items:
    - resourceRefId: agents-search
  resourcesRefs:
    items:
    - id: agents-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-search
      namespace: {{ $.Values.namespace }}
      resource: inputs
      verb: GET
