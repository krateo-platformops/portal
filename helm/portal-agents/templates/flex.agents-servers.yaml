{{/* The Tool servers tab, in the A4 format (as /incidents): the notice (what a failed read leaves out,
     outside every frame), the five figures, then one row: the servers on the left two thirds (the
     state chips, Needs attention by default while a server needs it, then a card per server, or with
     ?view=table the full server table) and the charts on the right third (by state, tools per server,
     agents per server). Below the row, full width, who may call what: the agent x server matrix and
     every binding with its tool names, which are bindings rather than servers, so they keep their own
     section. No toolbar: the tab has no filter of its own, and the Overview's search does not narrow
     it (a binding is not searched). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    allowedResources:
    - cards
    - flexes
    - listies
    - paragraphs
    - rows
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-servers-notice
    - resourceRefId: agents-servers-stats
    - resourceRefId: agents-servers-main
    - resourceRefId: agents-servers-bindings-head
    - resourceRefId: agents-servers-matrix-legend
    - resourceRefId: agents-servers-matrix-card
    - resourceRefId: agents-servers-bindings-detail-title
    - resourceRefId: agents-servers-bindings-card
  resourcesRefs:
    items:
    - id: agents-servers-notice
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-notice
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-servers-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-servers-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
    - id: agents-servers-bindings-head
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-bindings-head
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: agents-servers-matrix-legend
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-matrix-legend
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-servers-matrix-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-matrix-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: agents-servers-bindings-detail-title
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-bindings-detail-title
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-servers-bindings-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-bindings-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
