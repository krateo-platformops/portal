{{/* The Tool servers section of /agents — a SECTION, not a page root. */}}
{{/* */}}
{{/* It has no route of its own on purpose. The section answers a question the agent table above it */}}
{{/* raises ("this agent has 5 tools across 2 servers — which ones, and what else can reach them?"), */}}
{{/* it is computed from the same three kagent.dev kinds, and it is nine rows plus a join: too little */}}
{{/* to justify a sidebar entry, and cut off from its context if given one. The lead composes it by */}}
{{/* appending ONE item to flex.page-agents (see the report) — nothing here needs menu.sidebar-nav. */}}
{{/* */}}
{{/* Lives in .Release.Namespace like the other /agents children; only the page ROOT sits in the admin */}}
{{/* tier namespace, because only the root is addressed by the nav. */}}
{{/* */}}
{{/* `flexes`, `paragraphs` and `tables` are all inside the Flex allowedResources enum on the live CRD. */}}
{{/* (Flex's enum is not Tabs' enum — Tabs cannot hold `flexes`, which is why this section is a Flex of */}}
{{/* two labelled tables rather than a two-tab control.) */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - cards
    - flexes
    - paragraphs
    - tables
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-servers-head
    {{/* The notice stays OUTSIDE the frame below it. It is what this section says when a read did not */}}
    {{/* answer, and a "could not read it" line boxed inside the panel it is qualifying reads as a */}}
    {{/* property of that panel's contents rather than a warning about them. */}}
    - resourceRefId: agents-servers-notice
    - resourceRefId: agents-servers-list-card
    - resourceRefId: agents-servers-bindings-head
    {{/* The matrix first, then the pair list. Summary before detail: the matrix answers */}}
    {{/* "who may call what" in one glance across 15x9 cells, and the list under it answers */}}
    {{/* "which tools exactly" for the one binding you then care about. The legend is */}}
    {{/* computed and sits with the matrix it explains, outside the frame like the notice. */}}
    - resourceRefId: agents-servers-matrix-legend
    - resourceRefId: agents-servers-matrix-card
    - resourceRefId: agents-servers-bindings-detail-title
    - resourceRefId: agents-servers-bindings-card
  resourcesRefs:
    items:
    - id: agents-servers-head
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-head
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: agents-servers-notice
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-notice
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    {{/* Both tables are composed through their frames (card.agents-servers-list, */}}
    {{/* card.agents-servers-bindings) — the same outlined surface every other panel in this feature */}}
    {{/* already has. Each Card carries its own resourcesRefs entry for its table, so `tables` stays in */}}
    {{/* the enum above only for the CRs those Cards resolve; `cards` had to be ADDED, because the Flex */}}
    {{/* allowedResources enum is a hard CRD enum and an unlisted plural is rejected at apply time. */}}
    - id: agents-servers-list-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-list-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: agents-servers-bindings-head
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-bindings-head
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: agents-servers-matrix-legend
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-matrix-legend
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-servers-matrix-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-matrix-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
    - id: agents-servers-bindings-detail-title
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-bindings-detail-title
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-servers-bindings-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-bindings-card
      namespace: {{ .Release.Namespace }}
      resource: cards
      verb: GET
