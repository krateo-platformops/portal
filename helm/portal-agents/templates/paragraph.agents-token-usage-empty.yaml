{{/* In place of the consumers table when it would be empty: ClickHouse could not be read (and why, as
     a warning), or no LLM call went through the gateway in the range. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-token-usage-empty
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-token-usage
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
  - forPath: text
    expression: '${ .emptyText // "" }'
  - forPath: type
    expression: '${ if .failed then "warning" else "secondary" end }'
  resourcesRefs:
    items: []
