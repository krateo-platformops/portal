{{/* Who spent it on the left two thirds, the charts on the right third; both full width when the */}}
{{/* page is narrow. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-main
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  widgetData:
    allowedResources:
    - flexes
    alignment: top
    items:
    - resourceRefId: agents-cost-tables
      size: 16
      xs: 24
      lg: 16
    - resourceRefId: agents-cost-side
      size: 8
      xs: 24
      lg: 8
  resourcesRefs:
    items:
    - id: agents-cost-tables
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-tables
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: agents-cost-side
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-side
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
