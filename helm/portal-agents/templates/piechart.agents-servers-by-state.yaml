{{/* Every tool server you can read by state, a slice per state that has any, coloured as the cards and
     the figures colour it (green, orange, red). */}}
kind: PieChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-by-state
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-servers
    namespace: {{ $.Values.namespace }}
  widgetData:
    angleField: count
    colorField: state
    colorMap:
      Healthy: green
      Advisory: orange
      NotAccepted: red
    innerRadius: 60
    legend: true
    legendPosition: right
    height: 180
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ .byState // [] }'
  resourcesRefs:
    items: []
