{{/* The Token usage charts, one third of the row: the totals (input, cached, output) and the average
     per call, charted apart because they differ by orders of magnitude. With nothing to chart, the
     totals card says why and the averages card is left out. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-usage-side
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-token-timeseries
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-token-totals-card
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "agents-token-totals-card" } ] + (if .failed or (.buckets // 0) == 0 then [] else [ { resourceRefId: "agents-token-averages-card" } ] end) }'
  resourcesRefs:
    items:
    - id: agents-token-totals-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-token-totals-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: agents-token-averages-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-token-averages-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
