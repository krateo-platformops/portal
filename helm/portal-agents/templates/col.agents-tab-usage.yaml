{{/* Tab pane: Token usage, in the A4 format of an analytics tab: the time range (1h, 6h, 24h, 7d), the
     five figures (tokens, calls, cached input, errors, time to first token), then the consumers table
     on two thirds and the token charts on one third. A Col because the Tabs carry `cols` panes (see
     col.agents-tab-flow). It has no search: the table and the charts are ClickHouse aggregates, and a
     search would narrow the table and not the charts. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-tab-usage
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    allowedResources:
    - flexes
    items:
    - resourceRefId: agents-usage
  resourcesRefs:
    items:
    - id: agents-usage
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-usage
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
