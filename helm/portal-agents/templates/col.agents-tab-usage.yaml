{{/* Tab pane: Token usage — what the agents' model calls cost, read top to bottom: the window, */}}
{{/* the totals, the trend, then who spent it (agents, users, groups). Every widget reads */}}
{{/* restaction.agents-cost, so no two of them can disagree about a number. A Col because the Tabs */}}
{{/* enum carries `cols` and not `flexes`. */}}
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Col
metadata:
  name: agents-tab-usage
  namespace: {{ $.Values.namespace }}
  annotations:
    {{/* The page's filter keys plus this tab's window (`range`, `from`, `to`), which the range chips */}}
    {{/* and the day picker write. scripts/lint-keyextras.py checks every widget below declares them. */}}
    "krateo.io/filter-keys": "projects,kind,status,owner,q,view,range,from,to"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, from, to]
  widgetData:
    allowedResources:
    - flexes
    items:
    - resourceRefId: agents-cost
  resourcesRefs:
    items:
    - id: agents-cost
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
