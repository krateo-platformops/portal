{{/* Tab pane: Token usage — what the agents' model calls cost, in the layout of /incidents: the */}}
{{/* time range and the search, the figures, then who spent it (agents, users, groups) on the left */}}
{{/* two thirds beside the spend over time and by model on the right third. Every widget reads */}}
{{/* restaction.agents-cost, so no two of them can disagree about a number. A Col because the Tabs */}}
{{/* carry `cols` panes (see col.agents-tab-flow). The search narrows the tables only: the figures */}}
{{/* and the charts are ClickHouse aggregates over every call (input.agents-cost-search). */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-tab-usage
  namespace: {{ $.Values.namespace }}
  annotations:
    {{/* The page's filter keys plus the day picker's `from` and `to`. scripts/lint-keyextras.py checks */}}
    {{/* every widget below declares them. */}}
    "krateo.io/filter-keys": "projects,kind,status,owner,q,view,range,group,from,to"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  widgetData:
    allowedResources:
    - flexes
    items:
    - resourceRefId: agents-cost
  resourcesRefs:
    items:
    - id: agents-cost
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
