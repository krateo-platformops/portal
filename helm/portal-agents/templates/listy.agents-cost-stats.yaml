{{/* The figures: Spend, Per call, Cached input, Incident comparison, and Not priced only when a */}}
{{/* model is missing from the price list (orange and highlighted, and its caption names the model). */}}
{{/* The colour and the highlight come computed (agents-cost `color`, `highlight`; portal.tileDefs, */}}
{{/* frontend >= 1.8.93): the four measures are neutral. A caller who may not read the gateway gets */}}
{{/* every tile empty with "not shared with you", neutral, never a $0; a failed read is "—" in */}}
{{/* orange and highlighted, as on /incidents. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  apiRef:
    name: agents-cost
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
