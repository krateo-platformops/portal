kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-models
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  widgetData:
    title: Spend by model
    titleVariant: eyebrow
    tooltip: US dollars per model in the range, from every call the agent gateway served.
    variant: outlined
    allowedResources:
    - piecharts
    items:
    - resourceRefId: agents-cost-models
  resourcesRefs:
    items:
    - id: agents-cost-models
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-models
      namespace: {{ $.Values.namespace }}
      resource: piecharts
      verb: GET
