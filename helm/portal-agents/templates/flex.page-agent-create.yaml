{{/* Convention page root for /agents/new (nav item `page: agent-create` → resource `flexes`, name */}}
{{/* `page-<slug>`). Sibling of page-alert-create; no route params/extras, since the Agent GVR is */}}
{{/* static and agent-formdef needs no route identity. */}}
{{/* */}}
{{/* ORDER IS THE DESIGN. The gateway card sits BETWEEN the pagehead and the configuration card, so the */}}
{{/* sentence "this form cannot make the agent reachable" is read before a single field is typed — not */}}
{{/* discovered in a toast after the POST has already landed. That ordering is the whole reason this */}}
{{/* page has three sections instead of two; do not move the card below the form to "tidy up". */}}
{{/* */}}
{{/* NAMESPACE: the release namespace, and that is load-bearing rather than tidy. The `page:` */}}
{{/* convention resolves flexes/page-<slug> in the namespace the FRONTEND is configured with — */}}
{{/* Menu.tsx reads config.params.FRONTEND_NAMESPACE and hands it to buildNavModel, which builds the */}}
{{/* endpoint from it (navModel.ts resolveContentEndpoint). NO OTHER NAMESPACE EVER REACHES THAT */}}
{{/* LOOKUP, so a root reached by `page:` and installed anywhere else is a silent 404 — which is the */}}
{{/* hard limit on splitting page roots across namespaces for RBAC (#261): only a root addressed by */}}
{{/* `resourceRefId` can move, because that resourcesRefs row carries an explicit namespace. */}}
{{/* page-agent-detail, page-agents-policies and page-agents-policy-create carry the same note. */}}
{{/* It mattered less while /agents/new was URL-only; the /agents CTA now points here. */}}
{{/* */}}
{{/* Staying here loosens nothing: /agents/new is a label-less nav entry, so there is no sidebar item */}}
{{/* for RBAC to hide, and the real gate on creating an Agent is the Form's own POST, which snowplow */}}
{{/* authorizes as the caller. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-agent-create
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/nav-order": "936"
    "krateo.io/nav-path": "/agents/new"
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
      - pageheaders
      - cards
    vertical: true
    {{/* P9: page-root section rhythm is one step, `middle`, across every nav-declared root. */}}
    {{/* This root previously declared its own value; see design/03-composition.md P9. */}}
    gap: middle
    items:
      - resourceRefId: agent-create-page-header
      - resourceRefId: agent-create-gateway-card
      - resourceRefId: agent-create-form-card
  resourcesRefs:
    items:
      - id: agent-create-page-header
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: agent-create-page-header
        namespace: {{ .Release.Namespace }}
        resource: pageheaders
        verb: GET
      - id: agent-create-gateway-card
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: agent-create-gateway-card
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
      - id: agent-create-form-card
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: agent-create-form-card
        namespace: {{ .Release.Namespace }}
        resource: cards
        verb: GET
