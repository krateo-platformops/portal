{{/* The Tool servers body: the servers on the left two thirds, the charts on the right third; stacked
     when narrow. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-main
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    allowedResources:
    - cards
    - flexes
    alignment: top
    items:
    - resourceRefId: agents-servers-list-card
      size: 16
      xs: 24
      lg: 16
    - resourceRefId: agents-servers-side
      size: 8
      xs: 24
      lg: 8
  resourcesRefs:
    items:
    - id: agents-servers-list-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-list-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: agents-servers-side
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-side
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
