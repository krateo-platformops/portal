{{/* The spend charts, one third of the row: spend over time, then spend by model. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-side
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  widgetData:
    allowedResources:
    - cards
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-cost-trend-card
    - resourceRefId: agents-cost-models-card
  resourcesRefs:
    items:
    - id: agents-cost-trend-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-trend
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: agents-cost-models-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-models
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
