{{/* "Average per call": input and output tokens per call, per bucket with calls (linechart.agents-
     token-averages). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-token-averages-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    title: Average per call
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - linecharts
    items:
    - resourceRefId: agents-token-averages
  resourcesRefs:
    items:
    - id: agents-token-averages
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-token-averages
      namespace: {{ $.Values.namespace }}
      resource: linecharts
      verb: GET
