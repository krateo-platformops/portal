{{/* "Tokens over time": input, cached and output per bucket over the range (linechart.agents-token-
     totals). "Cached" is a subset of input, so the gap between those lines is what is billed at full
     rate. With nothing to chart, a line says why (paragraph.agents-token-none). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-token-totals-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-token-timeseries
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Tokens over time
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - linecharts
    - paragraphs
    items:
    - resourceRefId: agents-token-totals
  widgetDataTemplate:
  - forPath: items
    expression: '${ if .failed or (.buckets // 0) == 0 then [ { resourceRefId: "agents-token-none" } ] else [ { resourceRefId: "agents-token-totals" } ] end }'
  resourcesRefs:
    items:
    - id: agents-token-totals
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-token-totals
      namespace: {{ $.Values.namespace }}
      resource: linecharts
      verb: GET
    - id: agents-token-none
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-token-none
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
