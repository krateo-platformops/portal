{{/* "Summary | Full list", top right of the agents card: the group as cards or as the 12-column agents
     table (?view=table). Each route keeps every other param. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-view-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .viewChips // [] }'
  resourcesRefs:
    items: []
