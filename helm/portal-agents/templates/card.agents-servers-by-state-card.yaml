{{/* "By state": the tool servers, healthy, advisory or NotAccepted (piechart.agents-servers-by-state). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-by-state-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    title: By state
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - piecharts
    items:
    - resourceRefId: agents-servers-by-state
  resourcesRefs:
    items:
    - id: agents-servers-by-state
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-by-state
      namespace: {{ $.Values.namespace }}
      resource: piecharts
      verb: GET
