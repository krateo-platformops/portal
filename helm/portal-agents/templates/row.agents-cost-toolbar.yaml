{{/* The toolbar, as on /incidents: the time range on the left, the search on the right; both full */}}
{{/* width when the page is narrow. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-toolbar
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  widgetData:
    allowedResources:
    - flexes
    alignment: middle
    items:
    - resourceRefId: agents-cost-range
      size: 18
      xs: 24
      lg: 18
    - resourceRefId: agents-cost-search-wrap
      size: 6
      xs: 24
      lg: 6
  resourcesRefs:
    items:
    - id: agents-cost-range
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-range
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: agents-cost-search-wrap
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-search-wrap
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
