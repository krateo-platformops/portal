{{/* The whole page body when the Agent read returned nothing — either no such object, or the caller's */}}
{{/* `get agents` grant does not cover that namespace (userAccessFilter drops the object to {} rather */}}
{{/* than surfacing a 403). One honest sentence naming BOTH possibilities, instead of a page of "—" */}}
{{/* rows that would read as a broken agent. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agent-detail-empty
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the route params this widget's resolution varies by. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: agent-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ .emptyText // "" }'
  resourcesRefs:
    items: []
