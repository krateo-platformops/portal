{{/* The frame the create Form sits on — the same outlined surface every other panel in this feature */}}
{{/* uses, so the form does not float unframed under a framed warning. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policy-create-form-card
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: outlined
    items:
    - resourceRefId: agents-policy-create
  resourcesRefs:
    items:
    - id: agents-policy-create
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-policy-create
      namespace: {{ .Release.Namespace }}
      resource: forms
      verb: GET
