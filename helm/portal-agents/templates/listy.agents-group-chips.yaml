{{/* The group chips, the Overview list's filter (?group=): Needs attention (the default while anything
     in view needs it, else All), Orchestrators, Specialists (the healthy agents), All (every agent and
     tool server in view), each with its count. Each route keeps every other param; agents-list builds
     them. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-group-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .groupChips // [] }'
  resourcesRefs:
    items: []
