{{/* Tab pane: The seven-hop request walk. */}}
{{/* */}}
{{/* A Col, not a Flex, and that is forced rather than stylistic: the Tabs allowedResources enum */}}
{{/* carries `cols` but NOT `flexes` (verified on the live CRD), so a Flex cannot be a tab pane. */}}
{{/* Col DOES allow `flexes`, so this is the one-level wrapper that lets the existing section */}}
{{/* render unchanged inside a tab. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-tab-flow
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - flexes
    items:
    - resourceRefId: agents-flow-block
  resourcesRefs:
    items:
    - id: agents-flow-block
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-flow-block
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
