{{/* Token usage OVER TIME — totals and per-call averages, from the same gateway LLM spans as */}}
{{/* the breakdown table (see restaction.agents-token-usage for where `jwt.sub` comes from). */}}
{{/* */}}
{{/* TWO SERIES SETS, NOT ONE, and they are deliberately charted separately. Totals and averages */}}
{{/* differ by two orders of magnitude on real data (13.8M vs 126K in one hour), so plotting them */}}
{{/* on a shared linear axis flattens the averages onto the zero line — present, unreadable, and */}}
{{/* worse than absent because it looks like "no usage" rather than "wrong axis". */}}
{{/* */}}
{{/* The bucket follows the range, as every other chart RESTAction here does: a 2-minute bucket */}}
{{/* over 7 days would be 5,040 points for a 160px-high chart. */}}
{{/* */}}
{{/* COERCE BEFORE ARITHMETIC. ClickHouse returns the sums as JSON STRINGS (UInt64, to keep 64-bit */}}
{{/* precision) and the rounded averages as numbers — so the same response carries both shapes, and */}}
{{/* a chart that fed the strings straight through would plot them lexically. The breakdown table */}}
{{/* was bitten by exactly this: `add` over the raw values concatenated them. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: agents-token-timeseries
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: series
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then "1%20HOUR" elif $r=="6h" then "6%20HOUR" elif $r=="7d" then "7%20DAY" else "24%20HOUR" end) as $iv | (if $r=="1h" then "2%20MINUTE" elif $r=="6h" then "15%20MINUTE" elif $r=="7d" then "6%20HOUR" else "1%20HOUR" end) as $bk | "/?query=SELECT%20toUnixTimestamp%28toStartOfInterval%28Timestamp%2C%20INTERVAL%20" + $bk + "%29%29%20AS%20t%2C%20count%28%29%20AS%20calls%2C%20sum%28toUInt64OrZero%28SpanAttributes%5B%27gen_ai.usage.input_tokens%27%5D%29%29%20AS%20input_total%2C%20sum%28toUInt64OrZero%28SpanAttributes%5B%27gen_ai.usage.output_tokens%27%5D%29%29%20AS%20output_total%2C%20sum%28toUInt64OrZero%28SpanAttributes%5B%27gen_ai.usage.cache_read.input_tokens%27%5D%29%29%20AS%20cached_total%2C%20round%28avg%28toUInt64OrZero%28SpanAttributes%5B%27gen_ai.usage.input_tokens%27%5D%29%29%2C%200%29%20AS%20input_avg%2C%20round%28avg%28toUInt64OrZero%28SpanAttributes%5B%27gen_ai.usage.output_tokens%27%5D%29%29%2C%200%29%20AS%20output_avg%2C%20countIf%28SpanAttributes%5B%27http.status%27%5D%20%21%3D%20%27200%27%29%20AS%20errors%2C%20sumIf%28toFloat64OrZero%28SpanAttributes%5B%27agw.ai.time_to_first_token%27%5D%29%2C%20has%28mapKeys%28SpanAttributes%29%2C%20%27agw.ai.time_to_first_token%27%29%29%20AS%20ttft_sum%2C%20countIf%28has%28mapKeys%28SpanAttributes%29%2C%20%27agw.ai.time_to_first_token%27%29%29%20AS%20ttft_n%20FROM%20otel_traces%20WHERE%20has%28mapKeys%28SpanAttributes%29%2C%20%27gen_ai.usage.input_tokens%27%29%20AND%20Timestamp%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%20GROUP%20BY%20t%20ORDER%20BY%20t%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: seriesError
  {{/* Wide rows in, LONG format out — one {t, series, d} per point, which is the shape the */}}
  {{/* LineChart's colorField reads. Split into two arrays rather than one with a name prefix, so */}}
  {{/* each chart selects a set instead of parsing strings. */}}
  {{/* */}}
  {{/* OUTPUT (the A4 Token usage tab and the Overview's token card read it): */}}
  {{/*   totals      input, cached, output per bucket, ONE POINT PER BUCKET over the range (a bucket */}}
  {{/*               with no call is 0, not a gap), the newest bucket the current one: 1h -> 30 x 2 */}}
  {{/*               min, 6h -> 24 x 15 min, 24h -> 24 x 1 h, 7d -> 28 x 6 h; */}}
  {{/*   averages    input and output per call, only for the buckets that had calls (an average over */}}
  {{/*               no call is not 0); */}}
  {{/*   buckets     how many buckets had calls (0: nothing to chart); */}}
  {{/*   range / rangeLabel / unit   1h, 6h, 24h (absent) or 7d; "last 24 hours"; the x axis unit; */}}
  {{/*   stats       the Token usage figures: Tokens, LLM calls, Cached, Errors, First token, each */}}
  {{/*               with a tone of its own (the charts' colours where a chart draws the same */}}
  {{/*               thing); a failed read is "—", "could not be read", tone unread; */}}
  {{/*   rangeChips  1h / 6h / 24h / 7d, each a route that keeps every other param; */}}
  {{/*   failed / readError / emptyText   ClickHouse could not be read, and why; what to say in */}}
  {{/*               place of an empty chart. */}}
  filter: |
    {{ include "duration.label" . }}
    def num: if . == null then 0 else (tonumber? // 0) end;
    def errtext: if . == null then "" elif type == "array" then map(if type == "object" then (.message // tojson) else tostring end) | join("; ") elif type == "object" then (.message // tojson) else tostring end;
    def commas: tostring
      | if (length <= 3) then .
        else ((.[0:(length%3)]) as $h
              | ([$h] + [range(length%3; length; 3) as $i | .[$i:$i+3]])
              | map(select(. != "")) | join(","))
        end;
    . as $in
    | ((($in.range // "") | tostring) | if IN("1h", "6h", "7d") then . else "24h" end) as $range
    | ({ "1h": "last hour", "6h": "last 6 hours", "24h": "last 24 hours", "7d": "last 7 days" }[$range]) as $rangeLabel
    # The buckets the query groups by (toStartOfInterval aligns them to the epoch, so floor(now /
    # size) * size is the current one).
    | ({ "1h": { size: 120, n: 30 }, "6h": { size: 900, n: 24 }, "24h": { size: 3600, n: 24 }, "7d": { size: 21600, n: 28 } }[$range]) as $b
    | ((now / $b.size | floor) * $b.size - ($b.n - 1) * $b.size) as $start
    # Every link keeps the page's params, in the page's order; the range is the one it sets.
    | def href($rng): [ ("projects", "kind", "status", "owner", "q", "view") as $k | (($in[$k] // "") | tostring) as $v | select($v != "") | $k + "=" + ($v | @uri) ]
        + (if $rng != "24h" then [ "range=" + $rng ] else [] end)
        + ((($in.group // "") | tostring) as $g | if $g != "" then [ "group=" + ($g | @uri) ] else [] end)
        | if length == 0 then "/agents" else "/agents?" + join("&") end;
      ((.seriesError // null) | errtext) as $err
    | ($err != "") as $failed
    | ((.series.data) // []) as $rows
    | (reduce $rows[] as $r ({}; .[($r.t | num | tostring)] = $r)) as $at
    | ([ $rows[] | .calls | num ] | add // 0) as $calls
    | ([ $rows[] | .input_total | num ] | add // 0) as $input
    | ([ $rows[] | .output_total | num ] | add // 0) as $output
    | ([ $rows[] | .cached_total | num ] | add // 0) as $cached
    | ([ $rows[] | .errors | num ] | add // 0) as $errors
    | ([ $rows[] | .ttft_n | num ] | add // 0) as $ttftN
    | ([ $rows[] | .ttft_sum | num ] | add // 0) as $ttftSum
    | def pct($a; $b): if $b == 0 then "—" else ((($a * 1000 / $b) | round) / 10 | tostring) + "%" end;
      { totals: [ range(0; $b.n) as $i | ($start + $i * $b.size) as $t | ($at[$t | tostring] // {}) as $r
          | ( {t: $t, series: "input", d: ($r.input_total | num)},
              {t: $t, series: "cached", d: ($r.cached_total | num)},
              {t: $t, series: "output", d: ($r.output_total | num)} ) ],
        averages: [ $rows[] | (.t | num) as $t
          | ( {t: $t, series: "input per call", d: (.input_avg | num)},
              {t: $t, series: "output per call", d: (.output_avg | num)} ) ],
        buckets: ($rows | length),
        range: $range,
        rangeLabel: $rangeLabel,
        unit: (if $range == "7d" then "day" else "hour" end),
        failed: $failed,
        readError: $err,
        emptyText: (if $failed then "The token usage could not be read from ClickHouse (" + $err + ")."
                    else "No LLM call went through the gateway in the " + $rangeLabel + "." end),
        stats: ( [ { title: "Tokens", value: (($input + $output) | commas), tone: "tokens",
                     caption: (($input | commas) + " in · " + ($output | commas) + " out") },
                   { title: "LLM calls", value: ($calls | commas), tone: "calls", caption: ("through the gateway, " + $rangeLabel) },
                   { title: "Cached input", value: pct($cached; $input), tone: "cached",
                     caption: (($cached | commas) + " of " + ($input | commas) + " input tokens") },
                   { title: "Errors", value: ($errors | commas), tone: "errors",
                     caption: (if $calls == 0 then "no call in range" else pct($errors; $calls) + " of the calls not answered 200" end) },
                   { title: "First token", value: (if $ttftN == 0 then "—" else ($ttftSum / $ttftN * 1000 | durationLabel) end), tone: "ttft",
                     caption: (if $ttftN == 0 then "no call reports it" else "average over " + ($ttftN | commas) + (if $ttftN == 1 then " call" else " calls" end) + " that report it" end) } ]
                 | map(if $failed then { title, value: "", caption: "could not be read", tone: "unread" } else . end) ),
        rangeChips: ([ "1h", "6h", "24h", "7d" ] | map({ label: ., active: (. == $range), route: href(.) })) }
