{{/* Tokens through the gateway OVER TIME (input, cached, output per bucket), for the Overview's */}}
{{/* token card (card.agents-token-trend-card). The Token usage tab reads restaction.agents-cost. */}}
{{/* */}}
{{/* The bucket follows the range, as every other chart RESTAction here does: a 2-minute bucket */}}
{{/* over 7 days would be 5,040 points for a 160px-high chart. */}}
{{/* */}}
{{/* COERCE BEFORE ARITHMETIC. ClickHouse returns the sums as JSON STRINGS (UInt64, to keep 64-bit */}}
{{/* precision), so a chart fed them straight through would plot them lexically. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: agents-token-timeseries
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: series
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then "1%20HOUR" elif $r=="6h" then "6%20HOUR" elif $r=="7d" then "7%20DAY" else "24%20HOUR" end) as $iv | (if $r=="1h" then "2%20MINUTE" elif $r=="6h" then "15%20MINUTE" elif $r=="7d" then "6%20HOUR" else "1%20HOUR" end) as $bk | "/?query=SELECT%20toUnixTimestamp%28toStartOfInterval%28Timestamp%2C%20INTERVAL%20" + $bk + "%29%29%20AS%20t%2C%20sum%28toUInt64OrZero%28SpanAttributes%5B%27gen_ai.usage.input_tokens%27%5D%29%29%20AS%20input_total%2C%20sum%28toUInt64OrZero%28SpanAttributes%5B%27gen_ai.usage.output_tokens%27%5D%29%29%20AS%20output_total%2C%20sum%28toUInt64OrZero%28SpanAttributes%5B%27gen_ai.usage.cache_read.input_tokens%27%5D%29%29%20AS%20cached_total%20FROM%20otel_traces%20WHERE%20has%28mapKeys%28SpanAttributes%29%2C%20%27gen_ai.usage.input_tokens%27%29%20AND%20Timestamp%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%20GROUP%20BY%20t%20ORDER%20BY%20t%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: seriesError
  {{/* Wide rows in, LONG format out — one {t, series, d} per point, which is the shape the */}}
  {{/* LineChart's colorField reads. */}}
  {{/* */}}
  {{/* OUTPUT: */}}
  {{/*   totals      input, cached, output per bucket, ONE POINT PER BUCKET over the range (a bucket */}}
  {{/*               with no call is 0, not a gap), the newest bucket the current one: 1h -> 30 x 2 */}}
  {{/*               min, 6h -> 24 x 15 min, 24h -> 24 x 1 h, 7d -> 28 x 6 h; */}}
  {{/*   buckets     how many buckets had calls (0: nothing to chart); */}}
  {{/*   range / rangeLabel / unit   1h, 6h, 7d, or 24h for any other ?range (the Token usage */}}
  {{/*               tab's 12h, 3d and picked days included); "last 24 hours"; the x axis unit; */}}
  {{/*   failed / readError / emptyText   ClickHouse could not be read, and why; what to say in */}}
  {{/*               place of an empty chart. */}}
  filter: |
    def num: if . == null then 0 else (tonumber? // 0) end;
    def errtext: if . == null then "" elif type == "array" then map(if type == "object" then (.message // tojson) else tostring end) | join("; ") elif type == "object" then (.message // tojson) else tostring end;
    . as $in
    | ((($in.range // "") | tostring) | if IN("1h", "6h", "7d") then . else "24h" end) as $range
    | ({ "1h": "last hour", "6h": "last 6 hours", "24h": "last 24 hours", "7d": "last 7 days" }[$range]) as $rangeLabel
    # The buckets the query groups by (toStartOfInterval aligns them to the epoch, so floor(now /
    # size) * size is the current one).
    | ({ "1h": { size: 120, n: 30 }, "6h": { size: 900, n: 24 }, "24h": { size: 3600, n: 24 }, "7d": { size: 21600, n: 28 } }[$range]) as $b
    | ((now / $b.size | floor) * $b.size - ($b.n - 1) * $b.size) as $start
    | ((.seriesError // null) | errtext) as $err
    | ($err != "") as $failed
    | ((.series.data) // []) as $rows
    | (reduce $rows[] as $r ({}; .[($r.t | num | tostring)] = $r)) as $at
    | { totals: [ range(0; $b.n) as $i | ($start + $i * $b.size) as $t | ($at[$t | tostring] // {}) as $r
          | ( {t: $t, series: "input", d: ($r.input_total | num)},
              {t: $t, series: "cached", d: ($r.cached_total | num)},
              {t: $t, series: "output", d: ($r.output_total | num)} ) ],
        buckets: ($rows | length),
        range: $range,
        rangeLabel: $rangeLabel,
        unit: (if $range == "7d" then "day" else "hour" end),
        failed: $failed,
        readError: $err,
        emptyText: (if $failed then "The token usage could not be read from ClickHouse (" + $err + ")."
                    else "No LLM call went through the gateway in the " + $rangeLabel + "." end) }
