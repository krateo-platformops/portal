{{/* Host for the gateway-registration Alert. A Card, and the reason is a CRD fact rather than a */}}
{{/* preference: `alerts` is absent from the flexes v1beta1 widgetData.allowedResources enum (checked */}}
{{/* on krateo-057 — the enum is barcharts…yamlviewers, no alerts), so page-agent-detail cannot host */}}
{{/* the Alert directly, while cards v1beta1 declares no allowedResources at all and Card.tsx renders */}}
{{/* every items[] child through WidgetRenderer with no kind check. Same construction as */}}
{{/* agent-create-gateway-card, which hosts the sibling pre-flight warning on /agents/new. */}}
{{/* */}}
{{/* `borderless`, unlike every other card on this page: the Alert inside already draws its own red */}}
{{/* panel, and an outlined card around it renders a box in a box. The eyebrow title is what keeps it */}}
{{/* reading as a section of the page rather than a floating toast. */}}
{{/* */}}
{{/* No apiRef — this Card is pure structure; the Alert under it resolves everything. It still declares */}}
{{/* keyExtras, because the F6 guard keys on the extras a widget RECEIVES, not on whether it uses them: */}}
{{/* a widget on /agents/{namespace}/{name} that does not declare them is served but never cached */}}
{{/* (scripts/lint-keyextras.py fails the build on exactly this, as it did for the first draft of this */}}
{{/* file). Same as its sibling card-agent-detail-identity. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-agent-detail-registration
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the route params this widget's resolution varies by. */}}
  keyExtras: [name, namespace]
  widgetData:
    title: Reachability
    titleVariant: eyebrow
    variant: borderless
    items:
      - resourceRefId: agent-detail-registration
  resourcesRefs:
    items:
      - id: agent-detail-registration
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: agent-detail-registration
        namespace: {{ .Release.Namespace }}
        resource: alerts
        verb: GET
