{{/* The four Policies figures (agents-policies `stats`): Policies, Healthy, Not healthy, Not attached.
     The colour and the highlighted border come computed (`color`, `highlight`; portal.tileDefs,
     frontend >= 1.8.93): Not healthy (red, as the role tables tag a False condition) and Not attached
     (orange) are coloured and highlighted above 0 only; a 0, Policies and Healthy are neutral. An
     unread policy list is "—", "could not be read", in orange and highlighted. A state tile (Healthy,
     Not healthy, Not attached) opens the tab filtered to that state (?group=healthy, nothealthy,
     notattached), the route of its chip; Policies (a total) and a failed read are plain tiles. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-policies-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-policies
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      navigateTo: '{route}'
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
