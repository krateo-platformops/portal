{{/* Agent control plane — the inventory behind /agents (flex.page-agents). */}}
{{/* */}}
{{/* ONE RESTAction per page: every derived value below is computed HERE in jq and rendered verbatim */}}
{{/* by the widgets. The three steps are independent cluster-scope lists; the join happens in the */}}
{{/* global filter, so there is no dependsOn and no N+1. */}}
{{/* */}}
{{/* AN EMPTY TABLE MUST NEVER BE A CLAIM THAT THE CLUSTER IS EMPTY. Each step carries a */}}
{{/* userAccessFilter, so snowplow lists as its own SA and then REFILTERS to the namespaces where the */}}
{{/* CALLER holds the grant (internal/dynamic/sa_client.go). That means "no rows" has three causes: */}}
{{/* */}}
{{/* a. the step FAILED (CRD absent, apiserver 5xx, timeout). continueOnError swallows it and the */}}
{{/* reason lands on the declared errorKey. The filter BRANCHES on all three keys and says so — */}}
{{/* `(.rows | length) > 0` cannot tell this apart from an empty cluster, the errorKey can. */}}
{{/* b. the caller may not list the kind — the refilter returns an empty set and NO errorKey, so */}}
{{/* this case is invisible on the wire and must not be reported as an absence either. */}}
{{/* c. there really are no Agents. */}}
{{/* */}}
{{/* So the page never says "every agent on this cluster". It says what it can prove: (a) is named */}}
{{/* with its error text and turns the subtitle red; (b) and (c) share the wording "every agent you can */}}
{{/* read". Same rule inside the table — an unresolvable model renders "not readable" when the */}}
{{/* ModelConfig read failed, never the "—" that would read as "this agent has no model". */}}
{{/* */}}
{{/* The subtitle is computed HERE, server-side, and templated into paragraph.agents-subtitle. */}}
{{/* */}}
{{/* ROW LINKING: `routeName`/`routeNs` are emitted as SEPARATE fields from `name`/`namespace` and are */}}
{{/* what table.agents-list's rowNavigateTo interpolates. They exist because the DISPLAY name is not a */}}
{{/* safe route input — the table's `name` cell appends a "  (bench)" marker, and a rowNavigateTo built */}}
{{/* from it would produce /agents/<ns>/autopilot-bench%20%20(bench), a 404 dressed up as a link. */}}
{{/* The rows are also pre-filtered to objects that actually carry a name AND a namespace, so every */}}
{{/* emitted row has a non-empty value for both placeholders — a rowNavigateTo with ANY empty */}}
{{/* placeholder is silently dropped by the frontend and the row just stops responding to clicks. */}}
{{/* */}}
{{/* NOTE the resource: `remotemcpservers`, NOT `toolservers`. Both CRDs are installed, but */}}
{{/* toolservers.kagent.dev and mcpservers.kagent.dev hold ZERO objects on every cluster we run — */}}
{{/* all 9 real tool servers are RemoteMCPServer/v1alpha2. Listing toolservers renders an */}}
{{/* honest-but-permanently-empty table that looks like a data bug (verified live on krateo-057). */}}
{{/* */}}
{{/* GATEWAY REGISTRATION — the two extra reads (httproutes, agentgatewaypolicies), and why this page */}}
{{/* is where they belong. An Agent object going Ready says the CONTROLLER accepted it. It says */}}
{{/* nothing about whether anything can call it: every hop in this platform crosses the agentgateway, */}}
{{/* and the gateway only forwards to an agent that has BOTH */}}
{{/* (a) an HTTPRoute whose rule matches `x-kagent-host: <name>.<namespace>` — how the gateway picks */}}
{{/* the backend at all, and */}}
{{/* (b) Allow clauses naming that same host in the gateway's authorization policy — TWO of them, */}}
{{/* one for the anonymous `/.well-known/agent-card.json` discovery GET and one for the */}}
{{/* authenticated call, both rendered from the same agentgateway-policies subAgents entry. */}}
{{/* Miss either and the agent reports Ready and Accepted while every call to it is refused. That is */}}
{{/* not hypothetical: krateo-blueprint-agent was promoted 2026-09-03 and sat exactly like that for a */}}
{{/* week — Ready, delegated to by autopilot, 403 at the agent-card hop — until someone added it to the */}}
{{/* gateway's subAgents list by hand. The installer now derives that list from the deployed fleet so */}}
{{/* the same drift cannot recur (e779002, in 0.3.172), but derivation only covers agents that ARE a */}}
{{/* component pin; an agent created from /agents/new is not one. The create page has warned about this */}}
{{/* state at length since it existed; nothing ever SHOWED who was in it. This does, exception-only: a */}}
{{/* fully registered agent renders nothing at all. */}}
{{/* */}}
{{/* The (b) half is why a policy read is here and not just a route read. Routing an agent without */}}
{{/* allowing it is the exact shape of the bug above, and a route-only check would have called */}}
{{/* krateo-blueprint-agent healthy once someone added the HTTPRoute by hand. */}}
{{/* */}}
{{/* BOTH READS ARE THREE-STATE, like every other read on this page. "No route matches this host" is a */}}
{{/* finding ONLY when routes were readable AND some route came back; an empty list is the silent */}}
{{/* userAccessFilter refilter (a caller without the gateway.networking.k8s.io grant is served [], not */}}
{{/* a 403) and must never be rendered as "this agent is unreachable". Same for the policies: the */}}
{{/* verdict is withheld unless at least one Allow-action authorization policy is visible. When it is */}}
{{/* withheld the subtitle says so, and NO row is flagged — an unchecked agent must not look healthy */}}
{{/* by accident, so the page states the gap in prose instead of leaving it silent. */}}
{{/* */}}
{{/* A4 OUTPUT (the Overview tab, mockup A4, as /incidents), over the agents and tool servers the */}}
{{/* filters and the search (?q=) match: */}}
{{/*   stats       the five figures: Agents, Ready and registered, Needs attention, Gateway gaps, Tool */}}
{{/*               servers NotAccepted; each tile's tone is the state it counts (all, ok, bad; */}}
{{/*               `unchecked` for a gateway not checked, `unread` for a failed read), zero or not; */}}
{{/*               `route` opens the Overview filtered to the state a tile counts, keeping every other */}}
{{/*               param: Ready and registered ?group=ready, Needs attention the attention chip's */}}
{{/*               route, Gateway gaps ?status=notregistered, Tool servers NotAccepted */}}
{{/*               ?status=notaccepted (both with ?group= cleared, so the default group shows them); */}}
{{/*               Agents (a total), an unchecked gateway and a failed read are "", not clickable; */}}
{{/*   group       the group chips' pick (?group=): attention (default while anything needs it, else */}}
{{/*               all), ready (orchestrators and specialists together, the Ready and registered */}}
{{/*               tile's), orchestrators, specialists, all; groupChips / viewChips with */}}
{{/*               their routes; */}}
{{/*   cards       one per agent or tool server of the group, 24 at most (more / moreText say the rest); */}}
{{/*   tableRows   the agents of the group, for the 12-column table (?view=table); */}}
{{/*   listCount / emptyText / emptyType   what the list card shows, or says instead; */}}
{{/*   byHealth / byPattern / byModel   the donut and the two bar lists; */}}
{{/*   gatewayNotice   the warning above the toolbar while the gateway could not be checked. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: agents-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
  - name: agents
    path: /apis/kagent.dev/v1alpha2/agents
    verb: GET
    userAccessFilter:
      verb: list
      group: kagent.dev
      resource: agents
      namespaceFrom: .metadata.namespace
    continueOnError: true
    errorKey: agentsError
  - name: models
    path: /apis/kagent.dev/v1alpha2/modelconfigs
    verb: GET
    userAccessFilter:
      verb: list
      group: kagent.dev
      resource: modelconfigs
      namespaceFrom: .metadata.namespace
    continueOnError: true
    errorKey: modelsError
  - name: servers
    path: /apis/kagent.dev/v1alpha2/remotemcpservers
    verb: GET
    userAccessFilter:
      verb: list
      group: kagent.dev
      resource: remotemcpservers
      namespaceFrom: .metadata.namespace
    continueOnError: true
    errorKey: serversError
  {{/* v1 is the storage version of httproutes on the cluster (v1beta1 is still served but is not the */}}
  {{/* storage version); pin v1 so the rules read here are the canonical ones. Same pin as */}}
  {{/* restaction.agents-policies, which joins the same objects for a different question. */}}
  - name: routes
    path: /apis/gateway.networking.k8s.io/v1/httproutes
    verb: GET
    userAccessFilter:
      verb: list
      group: gateway.networking.k8s.io
      resource: httproutes
      namespaceFrom: .metadata.namespace
    continueOnError: true
    errorKey: routesError
  - name: policies
    path: /apis/agentgateway.dev/v1alpha1/agentgatewaypolicies
    verb: GET
    userAccessFilter:
      verb: list
      group: agentgateway.dev
      resource: agentgatewaypolicies
      namespaceFrom: .metadata.namespace
    continueOnError: true
    errorKey: policiesError
  filter: |
    # snowplow writes a swallowed step error to its errorKey as an ACCUMULATING SLICE
    # (accumulateErrorKey, internal/resolvers/restactions/api/resolve.go:189), each entry being the
    # apiserver Status decoded to a map or a bare message string. Flatten all three shapes; "" means
    # the step SUCCEEDED.
    def errText($e):
      if $e == null then ""
      else ( [ ( $e | if type == "array" then .[] else . end )
               | if type == "object" then ((.message // .reason // (. | tojson)))
                 elif . == null then ""
                 else tostring end ]
             | map(select(. != "")) | unique | join("; ") )
      end;
    {{- include "portal.agentsGateway" . | nindent 4 }}
    {{- include "portal.facets" . | nindent 4 }}
    # THE FILTERS (portal.facets; root-pages UX slice 3a, build plan §3.4, mockup screen 09). One
    # base set, the agents AND the tool servers, each with a per-item `f`:
    #   kind    agent / server;
    #   status  registered / notregistered (an agent, by the gateway check; neither while the check
    #           could not run), accepted / notaccepted (a tool server's Accepted condition);
    #   owner   the shipping composition (krateo.io/composition-name), else app.kubernetes.io/managed-by,
    #           else "—";
    #   q       search: name and description.
    # Not filters: view (`table`: the 12-column agents table), group (the Overview's group chips:
    # attention, orchestrators, specialists, all), range (the Token usage tab's window, carried by
    # every href so a link keeps it).
    . as $in
    | ["projects", "kind", "status", "owner", "q", "view", "range", "group"] as $pkeys
    | (($in.q // "") | tostring | gsub("^\\s+|\\s+$"; "") | ascii_downcase) as $q
    | (($in | fx_filters(["kind", "status", "owner"])) + { q: (if $q == "" then [] else ["1"] end) }) as $flt
    | ($in | fx_params($pkeys)) as $p
    | ((($in.view // "") | tostring) == "table") as $tableView
    | def shipper: (.metadata.labels // {}) as $l
        | if ($l["krateo.io/composition-name"] // "") != "" then $l["krateo.io/composition-name"]
          else ($l["app.kubernetes.io/managed-by"] // "—") end;
      def qmatch($text): if $q == "" then "" elif ($text | ascii_downcase | contains($q)) then "1" else "0" end;
    ( errText(.agentsError) )  as $agErr
    | ( errText(.modelsError) )  as $mcErr
    | ( errText(.serversError) ) as $srvErr
    | ( errText(.routesError) )   as $rtErr
    | ( errText(.policiesError) ) as $polErr
    | ( [ (if $agErr  != "" then ("Agents (" + $agErr + ")") else empty end),
          (if $mcErr  != "" then ("ModelConfigs (" + $mcErr + ")") else empty end),
          (if $srvErr != "" then ("RemoteMCPServers (" + $srvErr + ")") else empty end) ] ) as $failed
    # ── gateway registration ────────────────────────────────────────────────────────────────────
    # portal.agentsGateway (_agents-gateway.tpl, shared byte-for-byte with dashboard-page) decides
    # it: which hosts the gateway routes, which Allow clauses name them, and whether either read
    # gave enough to judge by. An unchecked fleet flags nobody; the subtitle says why instead.
    | agw_hosts as $routedHosts
    | agw_allow_exprs as $allowExprs
    | agw_known($rtErr; $polErr) as $gatewayKnown
    | agw_unknown_why($rtErr; $polErr) as $gatewayUnknownWhy
    | ( reduce ((.models.items // [])[]) as $m ({}; .[$m.metadata.name] = ($m.spec.model // "")) ) as $modelOf
    | ( if $srvErr != "" then null
        else ( [ (.servers.items // [])[] | (.status.discoveredTools // []) | length ] | add // 0 ) end ) as $toolsDiscovered
    | ( (.servers.items // []) | length ) as $serverCount
    # The tool servers as overview items: Accepted is the condition kagent writes once it has
    # connected and listed the server's tools.
    | ( [ (.servers.items // [])[]
          | ([ (.status.conditions // [])[] | select(.type == "Accepted") ][0] // {}) as $c
          | { name: (.metadata.name // ""), namespace: (.metadata.namespace // ""), item: "server",
              accepted: ($c.status == "True"), reason: ($c.reason // ""), message: (($c.message // "") | tostring | .[0:240]),
              description: ((.spec.description // "") | tostring | .[0:160]),
              tools: ((.status.discoveredTools // []) | length), owner: shipper,
              f: { kind: "server", status: (if $c.status == "True" then "accepted" else "notaccepted" end),
                   owner: (shipper | gsub(","; "")), q: qmatch((.metadata.name // "") + " " + ((.spec.description // "") | tostring)) } } ] ) as $serverItems
    | { rows: [ (.agents.items // [])[]
        | . as $a
        | select( (($a.metadata.name // "") != "") and (($a.metadata.namespace // "") != "") )
        | (.spec.declarative // {}) as $d
        | (($d.tools // [])) as $tools
        | ( $a.metadata.labels // {} ) as $lb
        | ( [ ($a.status.conditions // [])[]
              | select( ((.type == "Ready" or .type == "Accepted") and .status == "True") | not )
              | { label: ( if .status == "True" then .type
                           elif .status == "False" then ("Not" + .type)
                           else (.type + "Unknown") end ),
                  bad:   ( .status == "False" ) } ] ) as $exc
        | ( $d.modelConfig // "default-model-config" ) as $mc
        # The gateway addresses an agent by `<name>.<namespace>`, carried in x-kagent-host. The cell
        # names the MISSING ARTEFACT (agw_gap), not a verdict, because each one is fixed elsewhere.
        | ( ($a.metadata.name // "") + "." + ($a.metadata.namespace // "") ) as $host
        | agw_gap($host; $routedHosts; $allowExprs; $gatewayKnown) as $gw
        | {
            name:        $a.metadata.name,
            namespace:   $a.metadata.namespace,
            routeName:   ( $a.metadata.name // "" ),
            routeNs:     ( $a.metadata.namespace // "{{ .Release.Namespace }}" ),
            role:        ( ($a.spec.description // "") | if (. | length) > 120 then (.[0:120] + "…") else . end ),
            modelConfig: $mc,
            # Three distinct states, never collapsed into one dash: the ModelConfig read FAILED;
            # it succeeded but this agent's config was not among the ones we can read (deleted, or
            # outside the caller's grant); it resolved.
            model:       ( if $mcErr != "" then "not readable"
                           else ( $modelOf[$mc] // "unresolved" ) end ),
            runtime:     ( $d.runtime // "python" ),
            tools:       ( [ $tools[] | select(.type == "McpServer") | .mcpServer as $m | (($m.toolNames // [])[]) | { s: $m.name, t: . } ] | unique | length ),
            servers:     ( [ $tools[] | select(.type == "McpServer") | .mcpServer.name ] | unique | length ),
            delegates:   ( [ $tools[] | select(.type == "Agent") ] | length ),
            approvals:   ( [ $tools[] | select(.type == "McpServer") | .mcpServer as $m | (($m.requireApproval // [])[]) | { s: $m.name, t: . } ] | unique | length ),
            # WHO SHIPPED THIS AGENT. Read from the same label bag as `bench`, because the two
            # answer the same question from opposite ends: an agent rendered by a composition
            # carries krateo.io/composition-name + -installed-version, and an agent that is NOT
            # (the four bench ones) falls back to app.kubernetes.io/managed-by, which the kagent
            # chart sets to "Helm". Without this column the page cannot say which upgrade would
            # change an agent — every row looks hand-made. The version is appended rather than
            # given its own column: name and version are one fact (what to bump), and a second
            # column would be a column of repeated composition versions.
            owner:       ( if ($lb["krateo.io/composition-name"] // "") != ""
                           then ( $lb["krateo.io/composition-name"]
                                  + ( if ($lb["krateo.io/composition-installed-version"] // "") != ""
                                      then (" " + $lb["krateo.io/composition-installed-version"]) else "" end ) )
                           else ( $lb["app.kubernetes.io/managed-by"] // "—" ) end ),
            # An agent that binds tools[].type=Agent hands work to other agents rather than doing
            # it itself. That is the one structural distinction on this page the Delegates COUNT
            # does not name — a reader scanning a 15-row table sees "10" and not "this is the
            # thing the portal talks to, everything else is downstream of it".
            orchestrator: ( ( [ $tools[] | select(.type == "Agent") ] | length ) > 0 ),
            bench:       ( ( $lb["krateo.io/composition-id"] ) == null ),
            # Exception-only, and blank in TWO different situations that must not be confused:
            # registered (nothing to say) and unchecked (nothing we may say). The difference is
            # carried by the subtitle, not by this cell — a per-row "unknown" would put the same
            # sentence on every line of the table.
            gateway:      $gw,
            gatewayColor: ( if $gw == "agent card refused" then "orange" elif $gw != "" then "red" else "" end ),
            statusLabel: ( [ $exc[].label ] | join(" · ") ),
            statusColor: ( if ( [ $exc[] | select(.bad) ] | length ) > 0 then "red"
                           elif ( $exc | length ) > 0 then "orange"
                           else "" end ),
            item: "agent",
            shipper: ( $a | shipper ),
            f: { kind: "agent",
                 status: ( if ($gatewayKnown | not) then "" elif $gw != "" then "notregistered" else "registered" end ),
                 owner: ( $a | shipper | gsub(","; "") ),
                 q: qmatch( ($a.metadata.name // "") + " " + (($a.spec.description // "") | tostring) ) }
          } ]
        | sort_by( (if .bench then 1 else 0 end), .name ) }
    # THE OVERVIEW, over the filtered agents and servers. `rows` stays every agent (the 12-column
    # table and the stats read it); `agentsInView` / `serversInView` are what the filters match.
    | ( (.rows + $serverItems) ) as $items
    | ( $items | fx_apply($flt) ) as $inView
    | [ fx_facet($items; $flt; "kind"; "Kind"; { agent: "Agents", server: "Tool servers" }),
        fx_facet($items; $flt; "status"; "Status"; { registered: "Registered", notregistered: "NotRegistered", accepted: "Accepted", notaccepted: "NotAccepted" }),
        fx_facet($items; $flt; "owner"; "Owner"; {}) ] as $facets
    | ( [ $inView[] | select(.item == "agent") ] ) as $agentsInView
    | ( [ $inView[] | select(.item == "server") ] ) as $serversInView
    | ( [ $facets[] | select((.active | length) > 0) | .label + ": " + ([ .values[] | select(.active) | .label ] | join(", ")) ]
        + (if $q != "" then [ "search \"" + (($in.q // "") | tostring | .[0:80]) + "\"" ] else [] end) | join("; ") ) as $desc
    | . + { tableRows: [ .rows[] | . as $r | select(any($agentsInView[]; .name == $r.name and .namespace == $r.namespace)) ],
            agentsInView: $agentsInView, serversInView: $serversInView,
            facets: $facets, filteredBy: $desc, filteredAny: ($desc != ""),
            matched: ($inView | length),
            view: (if $tableView then "table" else "" end),
            chips: fx_chips("/agents"; $p; $facets),
            tableHref: fx_href("/agents"; fx_set($p; "view"; "table")),
            cardsHref: fx_href("/agents"; fx_set($p; "view"; "")),
            # The Tool servers tab, deep-linked by label (Tabs reads ?tab=), keeping only the project
            # scope: the tab lists every server and does not read the overview's facets.
            serversHref: fx_href("/agents"; [ $p[] | select(.[0] == "projects") ] + [["tab", "Tool servers"]]),
            strip: { agents: ($agentsInView | length),
                     gatewayGaps: (if $gatewayKnown then ([ $agentsInView[] | select((.gateway // "") != "") ] | length) else null end),
                     servers: ($serversInView | length),
                     serversNotAccepted: ([ $serversInView[] | select(.accepted | not) ] | length),
                     serversAccepted: ([ $serversInView[] | select(.accepted) ] | length),
                     # Tools on the ACCEPTED servers only. The tile captions them "on N servers" with N the
                     # accepted count, and a server kagent no longer accepts can keep a stale discoveredTools
                     # list that no agent can call. Summing every server credited those to the healthy ones
                     # (live check of slice 3a, 2026-11-14).
                     toolsDiscovered: (if $srvErr != "" then null else ([ $serversInView[] | select(.accepted) | .tools ] | add // 0) end),
                     models: ([ $agentsInView[] | .model ] | group_by(.) | map({ model: .[0], count: length })) },
            # The groups (mockup screen 09). Needs attention: an agent the gateway cannot reach (only
            # when the check ran), an agent whose Ready or Accepted is not True, a tool server not
            # Accepted. Then the healthy agents: orchestrators (they hand work to other agents, most
            # delegates first) and specialists.
            attention: ( [ $agentsInView[] | select((.gateway // "") != "" or (.statusLabel // "") != "") ]
                         + [ $serversInView[] | select(.accepted | not) ] ),
            orchestrators: ( [ $agentsInView[] | select((.gateway // "") == "" and (.statusLabel // "") == "" and .orchestrator) ] | sort_by(-.delegates, .name) ),
            specialists: ( [ $agentsInView[] | select((.gateway // "") == "" and (.statusLabel // "") == "" and (.orchestrator | not)) ] | sort_by(.name) ),
            gatewayUnknownWhy: $gatewayUnknownWhy }
    | ( [ .rows[] | select(.orchestrator) ] | sort_by(-.delegates, .name) ) as $orch
    | ( [ .rows[] | select((.gateway // "") != "") ] ) as $unreg
    | . + { total: (.rows | length),
            benchCount: ( [ .rows[] | select(.bench) ] | length ),
            orchCount: ( $orch | length ),
            unregisteredCount: ( $unreg | length ),
            # Counted separately from unregisteredCount because they are INDEPENDENT failures and
            # the header now shows one pill per cause. `subtitleType` alone cannot tell them apart:
            # it is danger when EITHER is non-zero, so a page with both would have reported only the
            # one the expression happened to test first.
            failedCount: ( $failed | length ),
            gatewayKnown: $gatewayKnown,
            toolsDiscovered: $toolsDiscovered,
            # Rendered verbatim by paragraph.agents-subtitle. A failed read is stated FIRST and in
            # full, because the table underneath it is the thing that would otherwise be misread.
            subtitle: (
              ( if ($failed | length) > 0 then
                  ( "Some of this page's reads FAILED — " + ($failed | join("; "))
                    + ". What is missing from the table below is missing because a read failed, not because it is not there." )
                else
                  ( "Every agent you can read on this cluster, the model it resolves to, the tools and tool servers it may call, and who it delegates to — read from the Agent, ModelConfig and RemoteMCPServer resources. "
                    + (.rows | length | tostring) + " readable; "
                    + ($toolsDiscovered | tostring) + " tools discovered across "
                    + ($serverCount | tostring) + " tool servers."
                    # The fan-out shape is the first thing worth knowing about a fleet, so it is
                    # stated here rather than left to be inferred from the Delegates column. Names
                    # the orchestrators explicitly: "one orchestrator" and "three" are different
                    # clusters, and so is a cluster where nothing delegates at all.
                    + ( if ($orch | length) == 0
                        then " No agent you can read delegates to another — each one works alone."
                        else ( " " + ($orch | length | tostring)
                               + ( if ($orch | length) == 1 then " agent hands work to others: " else " agents hand work to others: " end )
                               + ( [ $orch[] | (.name + " → " + (.delegates | tostring)) ] | join(", ") ) + "." ) end ) )
                end )
              # Appended, never substituted: a gateway finding does not replace a failed read, and a
              # withheld verdict has to be SAID. Silence here would let an unchecked fleet read as a
              # clean one — the whole failure mode this check exists for.
              + ( if ($unreg | length) > 0 then
                    ( "  " + ($unreg | length | tostring)
                      + ( if ($unreg | length) == 1 then " of them is Ready but not fully registered at the agent gateway"
                          else " of them are Ready but not fully registered at the agent gateway" end )
                      + " — " + ( [ $unreg[] | .name ] | join(", ") )
                      + ". The Gateway column says what each one is missing; until it is fixed the gateway refuses the traffic." )
                  elif ($gatewayKnown | not) then
                    ( "  Gateway registration could not be checked (" + $gatewayUnknownWhy
                      + "), so no agent here is shown as unreachable — that is a gap in this page, not a clean bill of health." )
                  else "" end ) ),
            # Paragraph.type is a hard CRD enum (secondary|success|warning|danger) — never "".
            # Exception-only: `secondary` is the healthy default, `danger` only on a real failure.
            # An agent the gateway refuses IS a real failure, so it turns the subtitle red on the
            # same footing as a failed read. A merely UNCHECKED registration does not: the sentence
            # it adds is a caveat, and colouring a caveat red would train the reader past the colour.
            subtitleType: ( if ($failed | length) > 0 or ($unreg | length) > 0 then "danger" else "secondary" end ) }
    # ── THE OVERVIEW TAB, A4 (figures, the agents on two thirds, the charts on one third) ─────────
    # The group chips (?group=) pick what the cards and the Full list show: attention (the default
    # while anything in view needs it, else all), orchestrators and specialists (the healthy agents,
    # as before), all (every agent and tool server in view, triage order). An unknown value (another
    # tab's, e.g. the Tool servers tab's `healthy`) falls back to the default. `ready` (the healthy
    # agents, orchestrators then specialists) is the Ready and registered tile's group, and its chip.
    | ( .attention | length ) as $attN
    | ( if $attN > 0 then "attention" else "all" end ) as $grpDefault
    | ( (($in.group // "") | tostring | ascii_downcase) as $g
        | if ($g | IN("attention", "orchestrators", "specialists", "all", "ready")) then $g else $grpDefault end ) as $grp
    | ( $agErr != "" ) as $agFailed
    | ( $srvErr != "" ) as $srvFailed
    | ( [ .serversInView[] | select(.accepted) ] ) as $okServers
    | { attention: .attention, orchestrators: .orchestrators, specialists: .specialists,
        all: (.attention + .orchestrators + .specialists + $okServers),
        ready: (.orchestrators + .specialists) } as $groups
    | ( $groups[$grp] ) as $members
    | ( [ .agentsInView[] | select((.gateway // "") == "" and (.statusLabel // "") == "") ] | length ) as $healthyN
    | ( [ .agentsInView[] | select(.orchestrator) ] | length ) as $orchN
    | ( .agentsInView | length ) as $agentN
    | 24 as $cap
    | def n($k; $one; $many): ($k | tostring) + " " + (if $k == 1 then $one else $many end);
      # The route a group chip (and a figure) opens: the default group is left out of the URL.
      def grpHref($k): fx_href("/agents"; fx_set($p; "group"; (if $k == $grpDefault then "" else $k end)));
      # The route a status figure opens: the Status facet set to that one value, the group cleared.
      def statusHref($v): fx_href("/agents"; fx_set(fx_set($p; "status"; $v); "group"; ""));
      # A card's tone is the state it shows: bad (red: refused by the gateway, not Ready, not
      # Accepted), warn (orange: the agent card refused, an advisory condition), ok (green). The
      # figures use the same map, so a tile and its cards read as one.
      def agentcard:
        ( if (.gateway // "") != "" then { tag: "NotRegistered", tone: (if .gatewayColor == "orange" then "warn" else "bad" end) }
          elif (.statusLabel // "") != "" then { tag: .statusLabel, tone: (if .statusColor == "red" then "bad" else "warn" end) }
          else { tag: (if $gatewayKnown then "Registered" else "Ready" end), tone: "ok" } end ) as $s
        | { title: .name, tag: $s.tag, tone: $s.tone,
            kind: ((if .orchestrator then "Orchestrator" else "Specialist" end) + (if .bench then " · bench" else "" end)),
            body: (if (.role // "") == "" then "No description." else .role end),
            foot: (if (.gateway // "") != "" then "Gateway: " + .gateway + " · owner " + .shipper
                   elif (.statusLabel // "") == "" and .orchestrator then n(.delegates; "delegate"; "delegates") + " · " + n(.tools; "tool"; "tools") + " on " + n(.servers; "server"; "servers")
                   else "owner " + .shipper end),
            cta: "Open agent", href: ("/agents/" + .routeNs + "/" + .routeName), icon: "fa-robot" };
      # A tool server has no page (the Tool servers tab is its list), so its card is inert.
      def servercard:
        { title: .name, tag: (if .accepted then "Accepted" else "NotAccepted" end), tone: (if .accepted then "ok" else "bad" end),
          kind: "Tool server",
          body: (if .accepted then (if (.description // "") != "" then .description else n(.tools; "tool"; "tools") + " discovered" end)
                 elif .message != "" then .message else "Accepted is not True, and no message was given." end),
          foot: ("RemoteMCPServer · " + (if .accepted then n(.tools; "tool"; "tools") + " · owner " + .owner
                                         else "reason " + (if .reason != "" then .reason else "none given" end) end)),
          cta: "", href: "", icon: "fa-server" };
      ( [ $members[] | select(.item == "agent") ] ) as $memberAgents
    | ( [ .rows[] | . as $r | select(any($memberAgents[]; .name == $r.name and .namespace == $r.namespace)) ] ) as $tableRows
    | ( (.toolsDiscovered // null) as $td | .strip + { toolsAll: $td } ) as $s
    | . + {
        group: $grp,
        tableRows: $tableRows,
        cards: [ $members[0:$cap][] | if .item == "server" then servercard else agentcard end ],
        listCount: (if $agFailed then 0 elif $tableView then ($tableRows | length) else ($members | length) end),
        more: (if $tableView then 0 else ([ ($members | length) - $cap, 0 ] | max) end),
        moreText: ( ($members | length) as $m | ([ $members[] | select(.item == "agent") ] | length) as $ma
                    | ($cap | tostring) + " of " + ($m | tostring) + " shown here. "
                      + (if $ma == $m then "Full list has all " + ($m | tostring) + "."
                         else "Full list has the " + n($ma; "agent"; "agents") + "; the tool servers are on the Tool servers tab." end) ),
        # Ready and registered (named as its tile) sits before the two halves it is made of.
        groupChips: ( [ { k: "attention", l: "Needs attention" },
                        { k: "ready", l: (if $gatewayKnown then "Ready and registered" else "Ready" end) },
                        { k: "orchestrators", l: "Orchestrators" }, { k: "specialists", l: "Specialists" }, { k: "all", l: "All" } ]
                      | map({ label: .l, count: ($groups[.k] | length), active: (.k == $grp),
                              route: grpHref(.k) }) ),
        viewChips: [ { label: "Summary", active: ($tableView | not), route: .cardsHref },
                     { label: "Full list", active: $tableView, route: .tableHref } ],
        # THE FIVE FIGURES over the agents and tool servers in view. Every tile wears the colour
        # of the state it counts, zero or not (tone, mapped as the cards map it): Agents all
        # (blue), Ready and registered ok (green), Needs attention and the two gaps bad (red).
        # A gateway that could not be checked is "—", "not checked", in orange, never 0 gaps; a
        # failed read is "—", "could not be read", in orange, on every tile that counts it.
        # A state tile opens the Overview filtered to that state (`route`, see A4 OUTPUT); the
        # total, an unchecked gateway and a failed read have route "", a plain tile.
        stats: ( [ { title: "Agents", value: $agentN, tone: "all", needs: "agents", route: "",
                     caption: (n($orchN; "orchestrator"; "orchestrators") + " · " + n($agentN - $orchN; "specialist"; "specialists")) },
                   { title: (if $gatewayKnown then "Ready and registered" else "Ready" end), value: $healthyN, tone: "ok", needs: "agents", route: grpHref("ready"),
                     caption: ("of " + n($agentN; "agent"; "agents") + (if $gatewayKnown then "" else "; gateway not checked" end)) },
                   { title: "Needs attention", value: $attN, tone: "bad", needs: "both", route: grpHref("attention"),
                     caption: "unreachable, not Ready or not Accepted" },
                   (if $gatewayKnown then { title: "Gateway gaps", value: ($s.gatewayGaps // 0), tone: "bad", needs: "agents", caption: "not routed or not allowed",
                             route: statusHref("notregistered") }
                    else { title: "Gateway gaps", value: "", tone: "unchecked", needs: "agents", caption: "not checked", route: "" } end),
                   { title: "Tool servers NotAccepted", value: ($s.serversNotAccepted // 0), tone: "bad", needs: "servers", route: statusHref("notaccepted"),
                     caption: ("of " + (($s.servers // 0) | tostring) + " · " + n($s.toolsDiscovered // 0; "tool"; "tools") + " discovered") } ]
                 | map(if (.needs == "agents" and $agFailed) or (.needs == "servers" and $srvFailed) or (.needs == "both" and ($agFailed or $srvFailed))
                       then { title, value: "", caption: "could not be read", tone: "unread", route: "" }
                       else { title, value: (.value | tostring), caption, tone, route } end) ),
        # THE CHARTS (agents-side): the health donut over everything in view, the agents by pattern,
        # the agents by resolved model. The token trend reads agents-token-timeseries itself.
        byHealth: (if $agFailed then [] else
                     [ { state: "Healthy", count: ($healthyN + ($okServers | length)) }, { state: "Needs attention", count: $attN } ]
                     | map(select(.count > 0)) end),
        byPattern: (if $agFailed or $agentN == 0 then [] else
                      [ { name: "Orchestrators", tone: "orchestrator", count: $orchN },
                        { name: "Specialists", tone: "specialist", count: ($agentN - $orchN) },
                        { name: "Bench (no composition)", tone: "bench", count: ([ .agentsInView[] | select(.bench) ] | length) } ]
                      | map(select(.count > 0) | . + { percent: ((.count * 100 / $agentN) | round), label: (.count | tostring) }) end),
        byModel: (if $agFailed or $agentN == 0 then [] else
                    [ .agentsInView[] | .model ] | group_by(.) | map({ name: .[0], count: length }) | sort_by(-.count, .name) | .[0:6]
                    | map(. + { percent: ((.count * 100 / $agentN) | round), label: (.count | tostring) }) end),
        gatewayNotice: (if $agFailed or $gatewayKnown then "" else
                          "Gateway registration could not be checked (" + $gatewayUnknownWhy + "), so no agent here is shown as unreachable." end),
        emptyType: (if $agFailed then "warning" else "secondary" end),
        emptyText: ( if $agFailed then "The agents could not be read (" + $agErr + "), so nothing on this tab counts them."
                     elif .matched == 0 and $q != "" then "No agent or tool server matches \"" + (($in.q // "") | tostring | gsub("^\\s+|\\s+$"; "")) + "\"."
                     elif .matched == 0 and .filteredAny then "No agent or tool server matches these filters."
                     elif .matched == 0 then "No agent or tool server you can read."
                     elif $tableView and ($tableRows | length) == 0 and ($members | length) > 0 then "The Full list has agents only; the tool servers in this group are on the Tool servers tab."
                     else ({ attention: "Nothing needs attention.", orchestrators: "No healthy agent in view hands work to another.",
                             ready: "No healthy agent in view.",
                             specialists: "No healthy specialist agent in view.", all: "No agent or tool server in view." }[$grp]) end ) }
    # "Ask Agentiko →" (button.agents-ask-agentiko): this page's route with an ?ask seed about the
    # fleet the table shows, built here and @uri-encoded so the Button is a plain literal navigate.
    # It claims no more than the subtitle does: a failed Agent read asks about the error and says
    # nothing about agents; another failed read is stated first; "registered" is said only when the
    # gateway check actually ran ($gatewayKnown), and an empty table is not "no agents".
    | ( [ .rows[] | select((.statusLabel // "") != "") ] ) as $sick
    | ( def numbered: .[0:8] | to_entries | map(((.key + 1) | tostring) + ". " + .value) | join(" ");
        ( if $agErr != "" then
            ( "The agent control plane could not be read: " + ($failed | join("; "))
              + ". Explain what that error means and what an administrator has to fix." )
          elif (.rows | length) == 0 then
            ( ( if ($failed | length) > 0 then ("Some of the reads behind my agent control plane failed — " + ($failed | join("; ")) + ". ") else "" end )
              + "I can read no agents on this cluster. Explain whether that means none is installed or that my permissions do not cover them, and how to tell." )
          elif .filteredAny then
            ( ( if ($failed | length) > 0 then ("Some of the reads behind my agent control plane failed — " + ($failed | join("; ")) + "; what is missing is missing for that reason. ") else "" end )
              + "Review the part of my agent control plane on screen (" + .filteredBy + "): "
              + (.agentsInView | length | tostring) + ( if (.agentsInView | length) == 1 then " agent and " else " agents and " end )
              + (.serversInView | length | tostring) + ( if (.serversInView | length) == 1 then " tool server." else " tool servers." end )
              + ( [ (.agentsInView[] | select((.gateway // "") != "") | .name + " cannot be reached through the gateway (" + .gateway + ")"),
                    (.agentsInView[] | select((.statusLabel // "") != "") | .name + " reports " + .statusLabel),
                    (.serversInView[] | select(.accepted | not) | .name + " is not Accepted (" + (if .reason != "" then .reason else "no reason given" end) + ")") ]
                  | if length == 0 then ( if $gatewayKnown then " None of them reports a problem." else " None reports a problem, but gateway registration could not be checked (" + $gatewayUnknownWhy + ")." end )
                    else " " + (to_entries | map(((.key + 1) | tostring) + ". " + .value) | .[0:8] | join(" ")) + "." end )
              + " Explain what is wrong with each and how to fix it, and anything that looks risky." )
          else
            ( ( if ($failed | length) > 0 then ("Some of the reads behind my agent control plane failed — " + ($failed | join("; ")) + "; what is missing is missing for that reason. ") else "" end )
              + "Review my agent control plane: " + (.rows | length | tostring) + ( if (.rows | length) == 1 then " agent, " else " agents, " end )
              + ($orch | length | tostring) + ( if ($orch | length) == 1 then " orchestrator." else " orchestrators." end )
              + ( if ($unreg | length) == 0 and ($sick | length) == 0 then
                    ( if $gatewayKnown and ($failed | length) == 0 then
                        ( " All " + (.rows | length | tostring) + " are registered at the gateway and report no problem. Explain how they delegate to one another, and anything that looks risky." )
                      elif $gatewayKnown then
                        " None of those I can read is unregistered at the gateway or reports a problem. Explain how they delegate to one another, and anything that looks risky."
                      else
                        ( " None reports a problem, but gateway registration could not be checked (" + $gatewayUnknownWhy + "). Explain how they delegate to one another, what that gap hides, and anything that looks risky." ) end )
                  else
                    ( " " + ($unreg | length | tostring) + " cannot be reached through the gateway"
                      + ( if ($unreg | length) > 0 then (" (" + ([ $unreg[] | (.name + " — " + .gateway) ] | numbered) + ")") else "" end )
                      + " and " + ($sick | length | tostring) + ( if ($sick | length) == 1 then " reports a problem" else " report a problem" end )
                      + ( if ($sick | length) > 0 then (" (" + ([ $sick[] | (.name + " — " + .statusLabel) ] | numbered) + ")") else "" end )
                      + ( if ($gatewayKnown | not) then (". Gateway registration could not be checked (" + $gatewayUnknownWhy + ")") else "" end )
                      + ". Explain what is wrong with each and how to fix it, starting with the one that breaks the most delegation." ) end ) )
          end ) ) as $prompt
    | . + { askHref: fx_href("/agents"; $p + [["ask", $prompt]]) }
