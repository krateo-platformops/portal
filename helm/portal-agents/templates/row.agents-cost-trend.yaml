{{/* Spend over time on the left two thirds, spend by model on the right third; both full width */}}
{{/* when the page is narrow. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-trend
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, from, to]
  widgetData:
    allowedResources:
    - cards
    alignment: top
    items:
    - resourceRefId: agents-cost-trend-card
      size: 16
      xs: 24
      lg: 16
    - resourceRefId: agents-cost-models-card
      size: 8
      xs: 24
      lg: 8
  resourcesRefs:
    items:
    - id: agents-cost-trend-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-trend
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: agents-cost-models-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cost-models
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
