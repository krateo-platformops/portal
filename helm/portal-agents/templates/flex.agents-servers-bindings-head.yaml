{{/* Title + subtitle stack for the agent x server binding table. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-bindings-head
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view]
  widgetData:
    allowedResources:
    - paragraphs
    vertical: true
    items:
    - resourceRefId: agents-servers-bindings-title
    - resourceRefId: agents-servers-bindings-subtitle
  resourcesRefs:
    items:
    {{- range (list "agents-servers-bindings-title" "agents-servers-bindings-subtitle") }}
    - id: {{ . }}
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: {{ . }}
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    {{- end }}
