{{/* Search on the Token usage tab: an agent's, a user's or a group's name, case-insensitive, written */}}
{{/* to ?q= on Enter and removed when cleared; the same ?q the Overview search writes. It narrows */}}
{{/* the three tables only: the figures and the charts are the gateway's totals for the range, which */}}
{{/* a name cannot split without counting a call twice (a call is one user's, but several groups'). */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-search
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  widgetData:
    name: q
    queryParam: q
    placeholder: Search agents, users, groups · press Enter
    allowClear: true
    size: middle
  resourcesRefs:
    items: []
