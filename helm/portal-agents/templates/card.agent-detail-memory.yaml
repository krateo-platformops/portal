{{/* "Memory & context" — what this agent carries between turns. Unlike the status chips, this card is */}}
{{/* NOT exception-only: "not configured" is a first-class answer here, because whether an agent has */}}
{{/* long-term memory or compacts its history is a design decision someone made, and a silent card */}}
{{/* would leave the reader unable to tell "no memory" from "we did not look". Rendered for every */}}
{{/* declarative agent; absent for a BYO agent, which manages its own context inside its image. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: card-agent-detail-memory
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the route params this widget's resolution varies by. */}}
  keyExtras: [name, namespace]
  widgetData:
    title: Memory & context
    titleVariant: eyebrow
    variant: outlined
    headerLeft: What this agent carries between turns — declarative.memory and declarative.context.
    items:
    - resourceRefId: descriptions-agent-detail-memory
  resourcesRefs:
    items:
    - id: descriptions-agent-detail-memory
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: descriptions-agent-detail-memory
      namespace: {{ .Release.Namespace }}
      resource: descriptions
      verb: GET
