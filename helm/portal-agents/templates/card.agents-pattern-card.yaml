{{/* "By pattern": the agents in view that hand work to others, the ones that do not, and the bench
     ones (listy.agents-pattern). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-pattern-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    title: By pattern
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - listies
    items:
    - resourceRefId: agents-pattern
  resourcesRefs:
    items:
    - id: agents-pattern
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-pattern
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
