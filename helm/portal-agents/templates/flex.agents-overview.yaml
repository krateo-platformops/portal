{{/* The Overview tab of /agents, in the A4 layout (as /incidents). Top to bottom: the gateway notice
     (only while the gateway registration could not be checked); the toolbar (the Kind, Status and
     Owner facets on the left, the search on the right); the applied filters as chips (only while one
     is applied); the five figures; then one row: the agents and tool servers in the picked group on
     the left two thirds (cards, or with ?view=table the 12-column agents table) and the charts on the
     right third. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-overview
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - paragraphs
    - rows
    - listies
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-toolbar
    - resourceRefId: agents-stats
    - resourceRefId: agents-overview-main
  widgetDataTemplate:
  - forPath: items
    expression: '${ (if (.gatewayNotice // "") != "" then [ { resourceRefId: "agents-gateway-notice" } ] else [] end) + [ { resourceRefId: "agents-toolbar" } ] + (if ((.chips // []) | length) > 0 then [ { resourceRefId: "agents-active-filters" } ] else [] end) + [ { resourceRefId: "agents-stats" }, { resourceRefId: "agents-overview-main" } ] }'
  resourcesRefs:
    items:
    - id: agents-gateway-notice
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-gateway-notice
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-toolbar
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-toolbar
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
    - id: agents-active-filters
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-active-filters
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-overview-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-overview-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
