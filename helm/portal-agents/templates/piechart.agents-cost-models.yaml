kind: PieChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-models
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, from, to]
  apiRef:
    name: agents-cost
    namespace: {{ $.Values.namespace }}
  widgetData:
    angleField: usd
    colorField: model
    innerRadius: 60
    legend: true
    legendPosition: bottom
    height: 220
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ .byModel // [] }'
  resourcesRefs:
    items: []
