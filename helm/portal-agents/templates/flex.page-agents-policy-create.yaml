{{/* /agents/policies/new — the mockup's Add-policy drawer as a route. */}}
{{/* */}}
{{/* Reached from the "+ Add policy" CTA in the policies page header (flex.agents-policy-new-cta). It */}}
{{/* is a ROUTE and not a drawer because the widget set has no drawer kind, and because a create that */}}
{{/* changes gateway enforcement deserves its own address: it can be linked to, and Cancel has a */}}
{{/* defined destination (/agents/policies) rather than an ambiguous dismiss. */}}
{{/* */}}
{{/* NAMESPACE: the release namespace. The `page:` convention resolves flexes/page-<slug> in the */}}
{{/* frontend's CONFIGURED namespace (Menu.tsx hands config.params.FRONTEND_NAMESPACE to */}}
{{/* buildNavModel), so a root installed anywhere else 404s — the same note page-agent-create and */}}
{{/* page-agent-detail carry, and the #261 limit on moving page roots for RBAC. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-agents-policy-create
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-order": "939"
    "krateo.io/nav-path": "/agents/policies/new"
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - cards
    vertical: true
    {{/* P9: page-root section rhythm is one step, `middle`, across every nav-declared root. */}}
    {{/* This root previously declared its own value; see design/03-composition.md P9. */}}
    gap: middle
    items:
    - resourceRefId: agents-policy-create-page-header
    - resourceRefId: agents-policy-ownership-card
    - resourceRefId: agents-policy-create-form-card
  resourcesRefs:
    items:
    - id: agents-policy-create-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-policy-create-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: agents-policy-ownership-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-policy-ownership-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: agents-policy-create-form-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-policy-create-form-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
