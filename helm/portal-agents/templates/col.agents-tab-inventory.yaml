{{/* Tab pane: The agent inventory table, in its frame. */}}
{{/* */}}
{{/* A Col, not a Flex, and that is forced rather than stylistic: the Tabs allowedResources enum */}}
{{/* carries `cols` but NOT `flexes` (verified on the live CRD), so a Flex cannot be a tab pane. */}}
{{/* Col DOES allow `flexes`, so this is the one-level wrapper that lets the existing section */}}
{{/* render unchanged inside a tab. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-tab-inventory
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view]
  widgetData:
    allowedResources:
    - flexes
    items:
    - resourceRefId: agents-overview
  resourcesRefs:
    items:
    - id: agents-overview
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-overview
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
