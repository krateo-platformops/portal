{{/* "Tools per server": the servers that discover the most tools (listy.agents-servers-tools). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-tools-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  widgetData:
    title: Tools per server
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - listies
    items:
    - resourceRefId: agents-servers-tools
  resourcesRefs:
    items:
    - id: agents-servers-tools
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-servers-tools
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
