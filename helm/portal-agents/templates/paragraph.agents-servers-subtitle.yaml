{{/* Subtitle for the Tool servers table. One sentence on the two columns that need it (Discovered is */}}
{{/* the server's own report, In use what agents bind). An unreadable routing is said by */}}
{{/* paragraph.agents-servers-notice, not here. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-servers-subtitle
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, from, to]
  widgetData:
    text: >-
      Every tool server the agents can reach: Discovered is how many tools it offers, In use how
      many of them an agent calls, and Status appears only when a server needs attention.
    type: secondary
  resourcesRefs:
    items: []
