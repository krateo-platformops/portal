{{/* The agents, two thirds of the Overview row: "Summary | Full list" top right, then the group chips
     (Needs attention by default while anything needs it, else All), then one card per agent or tool
     server in that group (the first 24, and a line saying where the rest are), or with ?view=table the
     12-column agents table (table.agents-list), listing the agents of the group. When there is nothing
     to list, or the Agent read failed, a line says so. Was the frameless table's frame; the table now
     sits in it as the Full list. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-list-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Agents
    titleVariant: eyebrow
    variant: outlined
    extraRefId: agents-view-chips
    allowedResources:
    - listies
    - tables
    - paragraphs
    items:
    - resourceRefId: agents-group-chips
    - resourceRefId: agents-cards
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "agents-group-chips" } ] + (if (.listCount // 0) == 0 then [ { resourceRefId: "agents-empty" } ] elif .view == "table" then [ { resourceRefId: "agents-list" } ] else [ { resourceRefId: "agents-cards" } ] + (if (.more // 0) > 0 then [ { resourceRefId: "agents-more" } ] else [] end) end) }'
  resourcesRefs:
    items:
    - id: agents-view-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-view-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-group-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-group-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-cards
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-cards
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: agents-list
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-list
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
    - id: agents-empty
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-empty
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: agents-more
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-more
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
