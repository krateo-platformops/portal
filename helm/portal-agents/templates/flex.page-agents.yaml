{{/* Convention page root for /agents — the agent control plane. */}}
{{/* */}}
{{/* Reached from the sidebar via `resourceRefId: agents` in menu.sidebar-nav, whose resourcesRefs */}}
{{/* entry carries this root's namespace explicitly. That indirection is what makes the entry */}}
{{/* RBAC-aware (snowplow resolves it as the caller, so the nav item disappears for a user who cannot */}}
{{/* GET this Flex) and it is also the only reason this root COULD be installed into another */}}
{{/* namespace — the bare `page:` convention would look for it in the frontend's configured */}}
{{/* namespace and 404 (#261). */}}
{{/* */}}
{{/* Pagehead + the tabs. The first tab, Overview (root-pages UX slice 3a, Diego 2026-11-14 Q3 (a)), */}}
{{/* holds the filter bar, the strip and the groups, and at ?view=table the 12-column agents table. */}}
{{/* The other five tabs are unchanged. */}}
{{/* */}}
{{/* THE "New agent" CTA IS NOW ON. It was withheld while the route did not exist: a Button navigating */}}
{{/* to an unrouted path falls through to the shell catch-all (RoutesContext.tsx `{ element: */}}
{{/* <WidgetPage />, path: '*' }`) and WidgetPage renders <Page404/>, so advertising it then would have */}}
{{/* shipped a primary call-to-action that dead-ends — and neither guard catches that (mockup-diff.mjs */}}
{{/* only flags an empty `actions`, lint-keyextras only covers parameterized routes). Both halves are */}}
{{/* in place now: menu.sidebar-nav carries `{ order: 936, path: "/agents/new", page: agent-create }`, */}}
# and page-agent-create lives in {{ `{{ .Release.Namespace }}` }} so that the `page:` convention
{{/* actually resolves it (Menu.tsx passes config.params.FRONTEND_NAMESPACE into buildNavModel, so */}}
{{/* `page: <slug>` looks for flexes/page-<slug> THERE, never in this root's namespace — see the */}}
{{/* header of flex.page-agent-create). Anywhere else the CTA would 404. */}}
{{/* */}}
{{/* WHY THE CTA MATTERS MORE THAN IT LOOKS: until now /agents/new was reachable by URL only. A create */}}
{{/* surface with no entry point anywhere in the product is, in practice, a surface that does not */}}
{{/* exist — the audit found it by reading the chart, not by using the portal. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-agents
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Observability"
    "krateo.io/nav-icon": "fa-robot"
    "krateo.io/nav-label": "Agents"
    "krateo.io/nav-order": "14"
    "krateo.io/nav-path": "/agents"
    {{/* The Overview tab's filter params (root-pages UX slice 3a). Every URL param reaches every */}}
    {{/* widget on the page, in EVERY tab, so every widget reachable from here declares them; */}}
    {{/* scripts/lint-keyextras.py fails one that does not (snowplow's F6 would decline to cache it). */}}
    "krateo.io/filter-keys": "projects,kind,status,owner,q,view"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view]
  widgetData:
    allowedResources:
    - pageheaders
    - tabs
    vertical: true
    gap: middle
    items:
    - resourceRefId: agents-page-header
    {{/* Both actions the page offers, paired in the header as the mockup shows them. Replaces the */}}
    {{/* single-button agents-new-cta: a reader looking for "how do I add a policy" should not have to */}}
    {{/* discover it on another page. */}}
    {{/* No summary band above the tabs any more: the Overview tab's strip replaces it (root-pages */}}
    {{/* UX slice 3a, Diego 2026-11-14 Q3 (a)). */}}
    {{/* THE PAGE IS TABBED. Every section below was already built and verified; they were simply */}}
    {{/* stacked, which is also why "the sections are not clearly divided" was reported — the mockup */}}
    {{/* never divided them, it separated them into tabs. */}}
    - resourceRefId: agents-main
  resourcesRefs:
    items:
    - id: agents-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    {{/* The four sections are resolved one level down, inside their tab panes (col.agents-tab-*), */}}
    {{/* so this page no longer composes them directly. */}}
    - id: agents-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: agents-main
      namespace: {{ $.Values.namespace }}
      resource: tabs
      verb: GET
