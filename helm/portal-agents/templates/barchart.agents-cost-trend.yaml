{{/* Spend per bucket, stacked by caller: spend is additive, so the bar is the total and its */}}
{{/* segments say who drove it. Every bucket of the window is present, zero where nothing ran. */}}
kind: BarChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-cost-trend
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group, from, to]
  apiRef:
    name: agents-cost
    namespace: {{ $.Values.namespace }}
  widgetData:
    xField: x
    yField: v
    colorField: series
    stack: true
    legend: true
    height: 220
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ .series // [] }'
  resourcesRefs:
    items: []
