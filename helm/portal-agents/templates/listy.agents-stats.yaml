{{/* The five Overview figures over the agents and tool servers in view (agents-list `stats`): Agents,
     Ready and registered ("Ready" while the gateway could not be checked), Needs attention, Gateway
     gaps and Tool servers NotAccepted. The colour and the highlighted border come computed (`color`,
     `highlight`; portal.tileDefs, frontend >= 1.8.93): the last three are red and highlighted above 0
     only; a 0, Agents and Ready are neutral. A gateway that could not be checked is "—", "not
     checked", in orange and highlighted, never 0 gaps; a failed read is "—", "could not be read", in
     orange and highlighted. Replaces the exception-only strip (listy.agents-strip). A state tile opens
     the list filtered to that state: Ready and registered ?group=ready, Needs attention the group chip's
     route, Gateway gaps and Tool servers NotAccepted the Status facet (NotRegistered, NotAccepted);
     Agents, an unchecked gateway and a failed read are plain tiles. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      navigateTo: '{route}'
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
