{{/* Under the cards when the group holds more than 24: how many are shown, and that the Full list has
     the rest (the agents; the tool servers are on their own tab). */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: agents-more
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, status, owner, q, view, range, group]
  apiRef:
    name: agents-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
  - forPath: text
    expression: '${ .moreText // "" }'
  resourcesRefs:
    items: []
