{{/* Projects = namespaces (platform model: tenant = cluster, project = namespace). Lists the */}}
{{/* namespaces the caller may `list` (UAF-gated, so each user sees only their projects) and shapes */}}
{{/* them into Select `options` for the MULTI-select project scope in the shell HEADER. The */}}
{{/* project-select widget binds this to the ?projects= URL param (comma-joined) → extras, which */}}
{{/* compositions-list and blueprints-cards read as `.projects` to scope server-side. */}}
{{/* */}}
{{/* ALL listable namespaces are offered — INCLUDING the installer's own namespace (krateo-system), */}}
{{/* where the platform's own compositions live. (An earlier build excluded the installer namespace */}}
{{/* via an installer-CR lookup; that exclusion was reverted, so the system namespace is selectable */}}
{{/* like any other project and its compositions can be scoped to.) */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: projects
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{/* THE QUESTION IS "WHERE MAY I LIST COMPOSITIONS", NOT "MAY I LIST NAMESPACES" (#261).
         */}}
    {{/* It used to be the latter, and that is a CLUSTER-SCOPED question: `list namespaces` can
         only be granted by a ClusterRole, so the picker was empty for anyone without one and the
         chart shipped `devs-list-any-namespace-in-cluster` to paper over it — a cluster-wide grant
         on a tenant persona, for a header dropdown. A userAccessFilter evaluates a
         SubjectAccessReview per item, so the verb it names has to be one a NAMESPACED Role can
         actually carry, or the only way to satisfy it is cluster-wide.

         `list` on the composition kinds is that question, and it is also the truer one: a project
         IS a namespace whose compositions you can see, which is exactly what the `?projects=`
         param then scopes. The plurals come from the same CompositionDefinition walk
         compositions-list uses, so the two agree by construction. */}}
    - name: crds
      path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
      verb: GET
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: compositiondefinitions
        namespaceFrom: .metadata.namespace
      filter: "[.crds.items[]? | select(.status.resource != null) | .status.resource] | unique"
      continueOnError: true
      errorKey: crdsError
    {{/* The namespaces where the caller may list at least one composition kind. */}}
    - name: namespaces
      path: /api/v1/namespaces
      verb: GET
      dependsOn:
        name: crds
      continueOnError: true
      errorKey: namespacesError
      userAccessFilter:
        verb: list
        group: composition.krateo.io
        resourcesFrom: "[ (.crds // [])[] ]"
        namespaceFrom: .metadata.name
  {{/* Build the Select options from every listable namespace — no exclusion. An empty selection */}}
  {{/* still means "All projects" (cluster-wide), shown via the placeholder. */}}
  filter: >
    {
      options: (
        [ .namespaces.items[]? | { label: .metadata.name, value: .metadata.name } ]
        | sort_by(.value)
      )
    }
