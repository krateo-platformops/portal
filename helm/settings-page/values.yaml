# @schema
# description: The namespace this chart CREATES and installs its page objects into. It is the RBAC boundary the chart exists for — a group with no RoleBinding here cannot `list` the page roots, so the portal sidebar never shows them and the page body 403s on a deep link. The release itself stays wherever the composition is created; only the page objects live here.
# type: string
# default: "krateo-settings"
# @schema
namespace: krateo-settings

# @schema
# description: Namespace holding the User CRs, their password Secrets and the portal-managed RoleBindings — the DATA, not the pages. Settings administers objects in the portal's release namespace and this chart does not move them.
# type: string
# default: "krateo-system"
# @schema
dataNamespace: krateo-system

# @schema
# description: Groups granted read of these pages in `namespace`. A group listed here sees /settings in the sidebar and can open it; a group absent cannot list the page roots, so the entry never renders. `devs` is deliberately NOT a default — keeping it out is the point of the split (#261).
# type: array
# @schema
readerGroups:
  - admins
