apiVersion: v2
name: reviews-page
description: The Krateo Composable Portal /reviews pages, as their own chart in their own namespace
type: application
version: CHART_VERSION
appVersion: CHART_VERSION
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - portal
  - pages
  - reviews
sources:
  - https://github.com/krateo-platformops/portal
annotations:
  krateo.io/category: application
  krateo.io/maturity: stable
  krateoSupportedVersion: ">= 2.5.1"
  # The first frontend-crds that admits what this chart ships: Listy itemTemplate.highlight (frontend 1.8.93), the computed tile border of reviews-stats, whose colour is now `color` straight from the data (no map). Before it, Flex role (reviews-filter-bar).
  # Installer's check-chart-requires-floors refuses a pin below it; lint-pinned-crds checks it still holds.
  krateo.io/requires-frontend-crd: ">= 1.8.93"
