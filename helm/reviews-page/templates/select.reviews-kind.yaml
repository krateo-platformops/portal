{{/* The Kind facet, written to ?kind= (comma-joined spec.kind values). Each option counts the
     proposals of that kind in the picked state (Open by default) under the other filters
     (portal.facets), largest first. */}}
kind: Select
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-kind
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    name: kind
    label: Kind
    queryParam: kind
    mode: multiple
    prefix: Kind
    placeholder: All
    size: small
    panelFooter: Counted in the state picked, under the other filters
    options: []
  widgetDataTemplate:
  - forPath: options
    expression: '${ [ ((.facets // [])[] | select(.key == "kind") | .values[]) | { label: .label, value: .value, count: .count } ] }'
  resourcesRefs:
    items: []
