kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-proposal-earlier
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-proposal
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Earlier proposals
    titleVariant: eyebrow
    variant: outlined
    size: small
    items:
    - resourceRefId: review-proposal-earlier-table
  widgetDataTemplate:
    - forPath: extra
      expression: '${ (((.earlierRows // []) | length) | tostring) + " superseded by this one" }'
  resourcesRefs:
    items:
    - id: review-proposal-earlier-table
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: review-proposal-earlier-table
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
