{{/* Search: a proposal's title, subject, kind or target repo, case-insensitive, written to ?q= on
     Enter and removed when cleared. platform-reviews applies it as one more filter to the whole
     page: the facet and state counts, the figures, the charts, the cards and the table. */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-search
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  widgetData:
    name: q
    queryParam: q
    {{/* The filter applies on SUBMIT (Enter), not per keystroke: say so in the placeholder or the */}}
    {{/* box reads as broken while the user types. */}}
    placeholder: Search proposals · press Enter
    allowClear: true
    size: middle
  resourcesRefs:
    items: []
