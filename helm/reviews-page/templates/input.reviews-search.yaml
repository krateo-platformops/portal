{{/* Search: a proposal's title and subject, case-insensitive, written to ?q= on Enter and removed
     when cleared. platform-reviews applies it as one more filter, so the facet counts follow it. */}}
kind: Input
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-search
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, group, view]
  widgetData:
    name: q
    queryParam: q
    placeholder: Search proposals
    allowClear: true
    size: small
  resourcesRefs:
    items: []
