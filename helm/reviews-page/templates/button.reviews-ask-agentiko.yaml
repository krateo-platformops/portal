{{/* "Ask Agentiko →" on /reviews — the assistant entry point for the open nightly-review proposals.
     It navigates to THIS page with an ?ask seed the rail consumes on mount, keeping every filter
     param (?kind, ?repo, ?today, ?q), ?group, ?view and the ?projects= scope, so the conversation
     starts on the same view: with a filter applied the prompt names it and is about the proposals
     it matches.

     Same object as service-desk-page's button.request-ask-agentiko — read the comment there. The
     label and `intent: agentiko` are fixed (A4); `type` and `icon` are ignored, so they are not set.
     It sits in flex.reviews-header-actions, immediately left of "Run review now", which keeps the
     header's one primary (P6).

     The href is built server-side (platform-reviews `.askHref`, @uri-encoded) from the open
     proposals in view and the last run the page already read. When the proposals could not be read — the
     review is not installed, the caller is refused, or the read failed — the prompt says which, and
     never "no open proposals". */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-ask-agentiko
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Every widget on /reviews receives the page's filter params (krateo.io/filter-keys on
       page-reviews); one it does not declare makes snowplow decline to cache it (F6). */}}
  keyExtras: [projects, kind, repo, today, q, group, view]
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /reviews
  widgetDataTemplate:
    {{/* Server-built self-page href with the ?ask seed. Falls back to the page — never a 404 — if
         askHref is empty, which platform-reviews never makes it, but a render with no data does. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.askHref // "") != "" then .askHref else "/reviews" end) } ] } }'
  resourcesRefs:
    items: []
