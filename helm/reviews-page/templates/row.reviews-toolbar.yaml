{{/* The row under the header: the filters (Kind, Target repo, New today, the time range) on the
     left, the search on the right in a quarter of the row, as on /incidents; stacked when narrow. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-toolbar
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  widgetData:
    allowedResources:
    - flexes
    alignment: middle
    items:
    - resourceRefId: reviews-filter-bar
      size: 18
      xs: 24
      lg: 18
    - resourceRefId: reviews-search-wrap
      size: 6
      xs: 24
      lg: 6
  resourcesRefs:
    items:
    - id: reviews-filter-bar
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-filter-bar
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: reviews-search-wrap
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-search-wrap
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
