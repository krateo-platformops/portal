{{/* /reviews (Platform review dashboard, the /incidents dashboard's layout, mockup A4): the nightly
     review's proposals and the runs that produced them.

     NOTHING HERE IS APPLIED. The review writes Proposal CRs and never opens a change request itself;
     a person opens one from a proposal's page, and the pull request is where it is decided.

     Top to bottom:
       - the header, with Ask Agentiko and Run review now (no subtitle: the breadcrumb above it says
         where this is);
       - a status line only when the latest run is not a clean Completed (exception-only), or the
         proposals cannot be read at all (not installed, refused: then nothing else is drawn);
       - the filters (Kind, Target repo, New today, the time range) and, on the same row, the
         search, which narrows the whole page; the filters applied, as removable chips;
       - the five figures: Waiting for a decision, Pull request open, Merged and Rejected in the
         range, the last run;
       - one row: the proposals on the left two thirds (the state chips, Open by default, then one
         card per proposal, or with ?view=table the full table; Merged and Rejected are where the
         decided ones are read), the charts on the right third (proposed vs decided over the range,
         by state, open by kind, the recent runs).
     The grouping by kind or repo (?group) is gone: the state chips, the Kind facet and the by-kind
     bars do its work.

     krateo.io/filter-keys names the URL params this page's widgets receive. scripts/lint-keyextras.py
     fails any widget reachable from here whose keyExtras misses one, because snowplow declines to
     cache a widget that receives an extra it does not declare (F6). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-reviews
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Observability"
    "krateo.io/nav-icon": "fa-clipboard-check"
    "krateo.io/nav-label": "Platform review"
    "krateo.io/nav-order": "14"
    "krateo.io/nav-path": "/reviews"
    "krateo.io/filter-keys": "projects,kind,repo,today,q,view,state,range"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - pageheaders
    - alerts
    - rows
    - listies
    vertical: true
    gap: middle
    items:
    - resourceRefId: reviews-page-header
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ [ { resourceRefId: "reviews-page-header" } ]
        + (if (.banner // null) != null then [ { resourceRefId: "reviews-banner" } ] else [] end)
        + (if (.installed != false) and (.denied != true) then
             [ { resourceRefId: "reviews-toolbar" } ]
             + (if ((.chips // []) | length) > 0 then [ { resourceRefId: "reviews-active-filters" } ] else [] end)
             + [ { resourceRefId: "reviews-stats" }, { resourceRefId: "reviews-main" } ]
           else [] end) }
  resourcesRefs:
    items:
    - id: reviews-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: reviews-banner
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-banner
      namespace: {{ $.Values.namespace }}
      resource: alerts
      verb: GET
    - id: reviews-toolbar
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-toolbar
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
    - id: reviews-active-filters
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-active-filters
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: reviews-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: reviews-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
