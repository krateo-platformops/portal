{{/* The proposal's facts. "Model says" is spec.confidence, marked unverified; the target is the */}}
{{/* model's claim in plain text, never a link. */}}
kind: Descriptions
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-proposal-facts-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-proposal
    namespace: {{ $.Values.namespace }}
  widgetData:
    column: 1
    size: small
    items:
    - label: Proposal
      value: '—'
  widgetDataTemplate:
    - forPath: items
      expression: '${ .facts // [] }'
  resourcesRefs:
    items: []
