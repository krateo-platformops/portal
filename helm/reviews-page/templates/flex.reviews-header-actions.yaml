{{/* The /reviews header's action line: the latest run, "Ask Agentiko →", then "Run review now".
     The latest run and "Run review now" are drawn only when the nightly review's CronJob is
     readable (.reviewCronJob). "Ask Agentiko →" is drawn ALWAYS — outside that condition — because
     it has the most to say exactly when the review is not installed, refused or has never run, and
     it sits immediately left of the primary when there is one (P6: it does not take that slot). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-header-actions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - paragraphs
    - buttons
    vertical: false
    gap: small
    align: center
    items:
    - resourceRefId: reviews-ask-agentiko
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ if (.reviewCronJob // null) != null then [ { resourceRefId: "reviews-last-run" }, { resourceRefId: "reviews-ask-agentiko" }, { resourceRefId: "reviews-run-now" } ]
           else [ { resourceRefId: "reviews-ask-agentiko" } ] end }
  resourcesRefs:
    items:
    - id: reviews-last-run
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-last-run
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: reviews-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    - id: reviews-run-now
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-run-now
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
