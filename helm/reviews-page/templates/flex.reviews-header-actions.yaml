{{/* The /reviews header's action line: "Ask Agentiko →", then "Run review now". The latest run is
     the strip's "Last run (all kinds)" tile. "Run review now" is drawn only when the nightly review's
     CronJob is readable (.reviewCronJob). "Ask Agentiko →" is drawn ALWAYS — outside that condition — because
     it has the most to say exactly when the review is not installed, refused or has never run, and
     it sits immediately left of the primary when there is one (P6: it does not take that slot). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-header-actions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Every widget on /reviews receives the page's filter params (krateo.io/filter-keys on
       page-reviews); one it does not declare makes snowplow decline to cache it (F6). */}}
  keyExtras: [projects, kind, repo, today, q, group, view]
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - buttons
    vertical: false
    gap: small
    align: center
    items:
    - resourceRefId: reviews-ask-agentiko
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ if (.reviewCronJob // null) != null then [ { resourceRefId: "reviews-ask-agentiko" }, { resourceRefId: "reviews-run-now" } ]
           else [ { resourceRefId: "reviews-ask-agentiko" } ] end }
  resourcesRefs:
    items:
    - id: reviews-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    - id: reviews-run-now
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-run-now
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
