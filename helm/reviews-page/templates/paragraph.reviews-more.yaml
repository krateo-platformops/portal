{{/* Under the cards, when the picked state holds more than the 24 drawn: how many, and that the
     full list has every one. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-more
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
  - forPath: text
    expression: '${ "24 of " + ((.matched // 0) | tostring) + " shown here. Full list has all " + ((.matched // 0) | tostring) + "." }'
  resourcesRefs:
    items: []
