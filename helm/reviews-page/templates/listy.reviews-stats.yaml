{{/* The five figures: Waiting for a decision (Proposed) and Pull request open (PrOpen) now,
     Merged and Rejected in the range, all over the proposals the filters and the search match;
     then the last review run of every kind. The colour and the highlighted border come computed
     (platform-reviews `color`, `highlight`; portal.tileDefs, frontend >= 1.8.93): a proposal
     waiting is work, not a fault, so the four proposal figures are neutral at any count; the last
     run is red and highlighted when it Failed, orange when PartiallyCompleted (its Recent runs
     colour, rv_run_color), neutral otherwise. The title says the state too, so colour is never the
     only signal. A failed read is an empty value (a muted "—") captioned "could not be read", in
     orange and highlighted, never a 0. No confidence anywhere (decision Q3). A state tile (the first
     four) opens the list filtered to that state, by its state chip's route (every other param
     kept), and that list holds as many as the tile counts (Merged and Rejected: in the range too);
     the last run, and any tile of a failed read, is plain. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      navigateTo: '{route}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
