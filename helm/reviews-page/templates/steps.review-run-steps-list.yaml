{{/* status.steps[] (0.1.22): gather, ask, validate, publish (always Skipped: the service stays on */}}
{{/* dry run and pull requests are opened from the portal), record. */}}
kind: Steps
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-run-steps-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-run
    namespace: {{ $.Values.namespace }}
  widgetData:
    # Vertical (UX audit RUN-1, 2026-11-25): laid out horizontally, five steps with a sentence of
    # detail each left some a column a few letters wide, and "Succeeded" broke one letter per line at
    # full desktop width. Down the page each step has the full width, as the incident steps do.
    orientation: vertical
    size: small
    items:
    - title: Gather
  widgetDataTemplate:
    - forPath: items
      expression: '${ .steps // [] }'
  resourcesRefs:
    items: []
