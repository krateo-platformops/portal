{{/* In place of the cards or the table when they would be empty: the proposals could not be read
     (and why: nothing on the page counts them), nothing matches the search or the filters, or no
     proposal is in the picked state (Merged and Rejected: decided in the range, said so). A warning when the read failed, muted otherwise. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-empty
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
  - forPath: text
    expression: '${ if .failed then "The proposals could not be read (" + (.readError // "") + "), so nothing on this page counts them." elif (.q // "") != "" and (.total // 0) == 0 then "No proposal matches \"" + .q + "\"." elif .filtered and (.total // 0) == 0 then "No proposal matches these filters." elif (.total // 0) == 0 then "There are no proposals." else ({ open: "No proposal is waiting for a decision.", proposed: "No proposal is waiting without a change request.", propen: "No proposal has a change request open.", merged: ("No proposal merged in " + ({ "24h": "the last 24 hours", "30d": "the last 30 days" }[.range // "7d"] // "the last 7 days") + "."), rejected: ("No proposal rejected in " + ({ "24h": "the last 24 hours", "30d": "the last 30 days" }[.range // "7d"] // "the last 7 days") + "."), failed: "No proposal failed.", all: "There are no proposals." }[.state // "open"] // "No proposal is in this state.") end }'
  - forPath: type
    expression: '${ if .failed then "warning" else "secondary" end }'
  resourcesRefs:
    items: []
