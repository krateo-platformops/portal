{{/* yaml changes only: the kind the file declares is not served by this cluster (discovery, read as the caller). */}}
kind: Alert
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-proposal-kind
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-proposal
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Kind not served
    type: warning
    showIcon: true
  widgetDataTemplate:
    - forPath: description
      expression: '${ .kindAlert // "" }'
  resourcesRefs:
    items: []
