{{/* The "Decided" panel's body while nothing in view has been decided. */}}
kind: Result
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-decided-empty
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Every widget on /reviews receives the page's filter params (krateo.io/filter-keys on
       page-reviews); one it does not declare makes snowplow decline to cache it (F6). */}}
  keyExtras: [projects, kind, repo, today, q, group, view]
  widgetData:
    status: info
    title: Nothing has been decided yet
    subTitle: >-
      A proposal is decided in one of two ways: someone opens a change request from it and the pull
      request is merged or closed, or someone rejects it with a reason. Decided proposals are listed
      here with who decided and when.
  resourcesRefs:
    items: []
