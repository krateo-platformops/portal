{{/* The proposals the filters match by state, every state (not the picked one alone), a slice per
     state that has any (Merged and Rejected: decided in the range, as the chips), coloured as the cards and the table colour the phase. */}}
kind: PieChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-by-state
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    angleField: count
    colorField: state
    colorMap:
      Proposed: gray
      Change request open: blue
      Merged: slate
      Rejected: gray
      Failed: red
    innerRadius: 60
    legend: true
    legendPosition: right
    height: 180
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ if .failed then [] else (.byState // []) end }'
  resourcesRefs:
    items: []
