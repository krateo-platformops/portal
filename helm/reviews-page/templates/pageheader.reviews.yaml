{{/* The /reviews page header. No subtitle: the breadcrumb says where this is, as on /incidents. The */}}
{{/* counter is the undecided proposals (all of them, whatever the filters), the only number anyone */}}
{{/* acts on. The action line on the right holds "Ask Agentiko →" and "Run review now" */}}
{{/* (flex.reviews-header-actions); the latest run is the last figure. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* Every widget on /reviews receives the page's filter params (krateo.io/filter-keys on
       page-reviews); one it does not declare makes snowplow decline to cache it (F6). */}}
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  apiRef:
    name: platform-reviews
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Platform review
    counterLabel: open
    allowedResources:
    - flexes
    items:
    - resourceRefId: reviews-header-actions
  widgetDataTemplate:
    - forPath: counter
      expression: '${ .open // 0 }'
  resourcesRefs:
    items:
    - id: reviews-header-actions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-header-actions
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
