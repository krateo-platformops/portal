{{/* A one-item Flex around the search, because a Row takes no `inputs` (as
     flex.incidents-search-wrap). The search fills it, up to the Input's own cap. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: reviews-search-wrap
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, kind, repo, today, q, view, state, range]
  widgetData:
    allowedResources:
    - inputs
    items:
    - resourceRefId: reviews-search
  resourcesRefs:
    items:
    - id: reviews-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: reviews-search
      namespace: {{ $.Values.namespace }}
      resource: inputs
      verb: GET
