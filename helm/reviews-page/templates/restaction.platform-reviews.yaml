{{/* /reviews — the nightly review's Proposals and ReviewRuns (review.krateo.io), shaped for both tabs. */}}
{{/* Every join, sort and derivation is here; the widgets only place values. */}}
{{/* */}}
{{/* GROUPED BY FINDING, NEWEST FIRST. spec.subject (0.1.21) names what a finding is about; a later */}}
{{/* run's proposal for the same subject supersedes the earlier one (status.supersededBy). A superseded */}}
{{/* proposal is not a row: it is counted on the row that replaced it, following the chain to its end. */}}
{{/* Rows sharing a subject sit together; a legacy proposal without one stands alone. */}}
{{/* */}}
{{/* NO CONFIDENCE, NO OBSERVED COUNT. Both are model-authored and unverified (the Proposal CRD says */}}
{{/* so), so neither is a column nor a sort key. They appear on the detail page, labelled as the */}}
{{/* model's own claim. Refused is historical (no longer written) and is excluded from both tabs. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: platform-reviews
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: proposals
      path: /apis/review.krateo.io/v1alpha1/namespaces/{{ $.Release.Namespace }}/proposals
      verb: GET
      headers:
        - 'Accept: application/json'
      userAccessFilter:
        verb: list
        group: review.krateo.io
        resource: proposals
        namespaceFrom: .metadata.namespace
      {{/* A cluster without the component has no review.krateo.io API: the page says so. */}}
      continueOnError: true
      errorKey: proposalsError
    - name: runs
      path: /apis/review.krateo.io/v1alpha1/namespaces/{{ $.Release.Namespace }}/reviewruns
      verb: GET
      headers:
        - 'Accept: application/json'
      userAccessFilter:
        verb: list
        group: review.krateo.io
        resource: reviewruns
        namespaceFrom: .metadata.namespace
      continueOnError: true
      errorKey: runsError
    {{/* The nightly review's CronJob, for "Run review now": a plain GET as the caller. Its */}}
    {{/* jobTemplate is what a manual run instantiates (`kubectl create job --from=cronjob/...`). */}}
    {{/* Absent or unreadable, the page simply offers no button. */}}
    - name: cronjob
      path: /apis/batch/v1/namespaces/{{ $.Release.Namespace }}/cronjobs/nightly-review
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: cronjobError
    {{- include "portal.reviewDiscoverySteps" (dict "source" "proposals") | nindent 4 }}
  filter: |
    {{- include "portal.reviewDefs" . | nindent 4 }}
    rv_served_gvs as $served
    | rv_kinds_by_gv as $kinds
    | ((.proposalsError // null) | if . == null then "" else tostring end) as $perr
    | ([ ((.proposals.items) // [])[] | select((.status.phase // "Proposed") != "Refused") ]) as $all
    | ([ ((.proposals.items) // [])[] | select((.status.phase // "") == "Refused") ] | length) as $refused
    | ([ $all[] | select((.status.phase // "") == "Superseded" and (.status.supersededBy // "") != "")
         | { key: .metadata.name, value: .status.supersededBy } ] | from_entries) as $up
    | ([ $all[] | select((.status.phase // "") != "Superseded") | .metadata.name ]) as $live
    | ([ $all[] | select((.status.phase // "") == "Superseded") | .metadata.name | rv_root($up; 0) ]
       | map(select(. as $r | $live | rv_has($r))) | group_by(.) | map({ key: .[0], value: length }) | from_entries) as $under
    | ([ $all[] | select((.status.phase // "") != "Superseded"
                         or (((.metadata.name | rv_root($up; 0)) as $r | $live | rv_has($r)) | not)) ]) as $visible
    | def row:
        rv_phase as $ph | rv_decision as $d
        | { name: .metadata.name,
            title: (.spec.title // .metadata.name),
            subject: (.spec.subject // "—"),
            kind: (.spec.kind // "—"),
            sources: (rv_sources | if . == "" then "—" else . end),
            checks: (rv_pills($served; $kinds) | tojson),
            phase: $ph,
            phaseColor: ($ph | rv_phase_color),
            superseded: (($under[.metadata.name] // 0) | if . == 0 then "—" else (tostring + " earlier") end),
            created: (.metadata.creationTimestamp // ""),
            target: (.spec.target.repo // "—"),
            decidedBy: (if $d.by == "" then "—" else $d.by end),
            decidedAt: $d.at,
            outcome: (if (.status.pullRequest.url // "") != "" then .status.pullRequest.url
                      elif $d.reason != "" then $d.reason else (.status.error // "—") end) };
      def grouped:
        group_by(.spec.subject // ("~" + .metadata.name))
        | map(sort_by(.metadata.creationTimestamp // "") | reverse)
        | sort_by(.[0].metadata.creationTimestamp // "") | reverse | add // [];
      ([ $visible[] | select(rv_phase as $p | $p == "Proposed" or $p == "PrOpen") ] | grouped | map(row)) as $open
    | ([ $visible[] | select(rv_phase as $p | $p == "Merged" or $p == "Rejected" or $p == "Failed") ] | grouped | map(row)) as $decided
    | ([ ((.runs.items) // [])[] ] | sort_by(.status.startedAt // .metadata.creationTimestamp // "") | reverse) as $runs
    | ($runs[0] // null) as $last
    | ((.cronjob // {}) | if type == "object" and (.kind // "") == "CronJob" and ((.metadata.name // "") != "") and (.spec.jobTemplate.spec != null) then . else null end) as $cron
    | ((.proposalsError // null) | if . == null then "" elif type == "array" then map(if type == "object" then (.message // tojson) else tostring end) | join("; ") elif type == "object" then (.message // tojson) else tostring end) as $perrText
    | ((.runsError // null) | if . == null then "" elif type == "array" then map(if type == "object" then (.message // tojson) else tostring end) | join("; ") elif type == "object" then (.message // tojson) else tostring end) as $rerr
    | def cap($k): if length > $k then (.[0:($k - 1)] + "…") else . end;
      def numbered: .[0:8] | to_entries
        | map(((.key + 1) | tostring) + ". \"" + (.value.title | cap(110)) + "\" (" + .value.kind + ", " + .value.phase + ")") | join(" ");
      # The "Ask Agentiko →" prompt (button.reviews-ask-agentiko). A refused, missing or failed read
      # of the proposals is said as such — never "no open proposals", which is a claim about a list
      # nobody managed to read.
      (if ($perr | test("404|not found|could not find"; "i")) then
         "The nightly review is not installed on this cluster: it serves no review.krateo.io API, so there are no proposals to read. Explain what the nightly review does and what installing it would take."
       elif ($perr | test("403|forbidden"; "i")) then
         "I cannot read the nightly review's proposals on this platform (" + ($perrText | cap(300)) + "). Explain what access I need and who can grant it."
       elif $perr != "" then
         "The nightly review's proposals could not be read (" + ($perrText | cap(300)) + "). Explain what that error means and what to check."
       else
         (if $rerr != "" then " The review runs could not be read (" + ($rerr | cap(300)) + ")."
          elif $last == null then " No review run is recorded."
          else " The last review run is " + $last.metadata.name + " (" + ($last.status.phase // "Pending") + ", started " + ($last.status.startedAt | rv_when) + ")." end) as $lastLine
         | if ($open | length) == 0 then
             "The nightly review has no open proposals." + $lastLine
             + (if $last == null and $rerr == "" then " Explain what the nightly review reads, and when its first proposals will appear."
                else " Check the platform's telemetry and tell me whether that matches what you see, or whether the review missed something." end)
           else
             "Help me work through the open nightly-review proposals: " + (($open | length) | tostring) + (if ($open | length) == 1 then " is" else " are" end)
             + " open — " + ($open | numbered) + "." + $lastLine
             + " Check each against the platform's telemetry, and say which I should act on first, which to reject, and why."
           end
       end) as $prompt
    | { askHref: ("/reviews?ask=" + ($prompt | @uri)),
        installed: ($perr | test("404|not found|could not find"; "i") | not),
        denied: ($perr | test("403|forbidden"; "i")),
        readError: $perr,
        open: ($open | length),
        rows: $open,
        decided: $decided,
        decidedCount: ($decided | length),
        refused: $refused,
        supersededHidden: ([ $under[] ] | add // 0),
        openCaption: (
          ([ (($open | length) | tostring) + " open"
           , (if ([ $under[] ] | add // 0) > 0 then (([ $under[] ] | add | tostring) + " superseded, counted on the proposal that replaced them") else empty end)
           , "newest first"
           , (if $refused > 0 then ($refused | tostring) + " historical Refused records not listed" else empty end) ]
           | join(" · "))
          + (if $last == null then "" else
              " · last review " + $last.metadata.name + " on " + ($last.status.startedAt | rv_when)
              + " (" + ($last.status.phase // "Pending") + ")" end)),
        decidedCaption: ([ ([ $decided[] | select(.phase == "Merged") ] | length | tostring) + " merged"
                         , ([ $decided[] | select(.phase == "Rejected") ] | length | tostring) + " rejected"
                         , ([ $decided[] | select(.phase == "Failed") ] | length | tostring) + " failed" ] | join(" · ")),
        runRows: [ $runs[] | (.status.phase // "Pending") as $ph
                   | { name: .metadata.name,
                       phase: $ph,
                       phaseColor: ($ph | rv_run_color),
                       started: (.status.startedAt // "" | rv_ts // ""),
                       took: rv_dur(.status.startedAt; .status.finishedAt),
                       result: (if $ph == "Failed" then (.status.error // "failed, no error recorded")
                                elif $ph == "Running" or $ph == "Pending" then "in progress"
                                else (((.status.proposals.created // 0) | tostring) + " proposed"
                                      + (if (.status.proposals.superseded // 0) > 0 then " · " + (.status.proposals.superseded | tostring) + " superseded" else "" end)
                                      + (if (.status.proposals.deduplicated // 0) > 0 then " · " + (.status.proposals.deduplicated | tostring) + " duplicate" else "" end)) end),
                       notRead: (rv_not_read | if . == "" then "—" else . end) } ],
        runCaption: (([ $runs | group_by(.status.phase // "Pending")[] | ((length | tostring) + " " + (.[0].status.phase // "Pending")) ] | join(" · "))
                     + (if ($runs | length) > 0 then " · since " + ($runs[-1].status.startedAt | rv_when) else "" end)),
        runCount: ($runs | length),
        lastRun: (if $last == null then null else { name: $last.metadata.name, phase: ($last.status.phase // "Pending"), started: ($last.status.startedAt | rv_when) } end),
        {{/* What a manual run instantiates: the CronJob's identity and its jobTemplate, verbatim. */}}
        reviewCronJob: (if $cron == null then null else
          { name: $cron.metadata.name, namespace: ($cron.metadata.namespace // "{{ $.Release.Namespace }}"), uid: ($cron.metadata.uid // ""),
            jobTemplate: { metadata: ($cron.spec.jobTemplate.metadata // {}), spec: $cron.spec.jobTemplate.spec } } end),
        {{/* The one line above the tabs, when the latest run is not a clean Completed. */}}
        banner: (
          if ($perr | test("404|not found|could not find"; "i")) then
            { type: "info", title: "The nightly review is not installed on this cluster",
              description: "This page lists review.krateo.io proposals and review runs, and this cluster serves no such API. Once the nightly review component is installed, its first run's proposals appear here." }
          elif ($perr | test("403|forbidden"; "i")) then
            { type: "warning", title: "Your role cannot read review proposals",
              description: "Listing review.krateo.io proposals in this namespace was refused for your account. An administrator can grant read access to proposals and reviewruns." }
          elif $last == null then
            { type: "info", title: "No review has run yet",
              description: "The nightly review reads the last 24 hours of this platform's telemetry and agent sessions. Its proposals appear here, and nothing is applied." }
          elif (($last.status.phase // "Pending") == "Running" or ($last.status.phase // "Pending") == "Pending") then
            { type: "info", title: ("A review is running: " + $last.metadata.name),
              description: ("Started " + ($last.status.startedAt | rv_when)
                            + ([ ($last.status.steps // [])[] | select(.phase == "Running") | " · current step: " + .name ][0] // "")
                            + ". The proposals below come from runs that finished.") }
          elif ($last.status.phase // "") == "Failed" then
            { type: "error", title: ("The last review failed: " + $last.metadata.name),
              description: ("It stopped after " + rv_dur($last.status.startedAt; $last.status.finishedAt) + ": "
                            + ($last.status.error // "no error recorded") + ". The proposals below come from earlier runs.") }
          elif ($last.status.phase // "") == "PartiallyCompleted" then
            { type: "warning", title: ("The last review saw part of the platform: " + $last.metadata.name),
              description: (($last | rv_not_read | if . == "" then "Some evidence sources were not read." else . end)
                            + ". Anything it proposed rests on incomplete evidence.") }
          else null end) }
