{{/* /reviews data source (Platform review dashboard, mockup A4): the nightly review's Proposals and */}}
{{/* ReviewRuns (review.krateo.io), filtered by the page's params. Every join, sort and derivation is */}}
{{/* here; the widgets only place values. */}}
{{/* */}}
{{/* GROUPED BY FINDING, NEWEST FIRST. spec.subject (0.1.21) names what a finding is about; a later */}}
{{/* run's proposal for the same subject supersedes the earlier one (status.supersededBy). A superseded */}}
{{/* proposal is not a row: it is counted on the row that replaced it, following the chain to its end. */}}
{{/* Rows sharing a subject sit together; a legacy proposal without one stands alone. */}}
{{/* */}}
{{/* NO CONFIDENCE, NO OBSERVED COUNT. Both are model-authored and unverified (the Proposal CRD says */}}
{{/* so), so neither is a column, a sort key, a facet nor a statistic (decision Q3, 2026-11-13). They */}}
{{/* appear on the detail page, labelled as the model's own claim. Refused is historical (no longer */}}
{{/* written) and is excluded everywhere. */}}
{{/* */}}
{{/* THE PARAMS. The filters (portal.facets, _facets.tpl), one URL param per facet, values comma-joined: */}}
{{/*   kind   spec.kind; */}}
{{/*   repo   spec.target.repo, "(no target repo)" when it names none; */}}
{{/*   today  1 for a proposal created on the server's today (UTC), 0 otherwise: the "New today" */}}
{{/*          toggle writes ?today=1. Day-granular: a cached resolve keeps its day (plan risk 4); */}}
{{/*   q      search: title, subject, kind and target repo, case-insensitive, trimmed. */}}
{{/* The facets and the search narrow the WHOLE page: the state chips' counts, the figures, the */}}
{{/* charts, the cards and the table. The runs are every kind's (the review runs once for all). */}}
{{/* Not filters: */}}
{{/*   state  open (absent: Proposed and PrOpen, what needs someone), proposed, propen, merged, */}}
{{/*          rejected, failed or all: which proposals the cards and the table list. Read */}}
{{/*          case-insensitively; a value that is no state lists nothing, its chips still drawn. */}}
{{/*          Merged and Rejected are the proposals decided IN THE RANGE (decidedAt, as the figures */}}
{{/*          and the trend read it, no older than the window; one with no readable decidedAt is in */}}
{{/*          no range), so a figure, its chip and the rows it lists agree. All is every proposal; */}}
{{/*   range  24h, 7d (absent) or 30d: the window of Merged and Rejected (figures, chips, list) and */}}
{{/*          the trend; */}}
{{/*   view   `table`: the full table instead of the cards. */}}
{{/* The facets count the proposals in the picked state under every OTHER filter. */}}
{{/* */}}
{{/* OUTPUT. */}}
{{/*   rows       the proposals in the picked state the filters match (the table; the cards take */}}
{{/*              the first 24 as `cards`, `more` the rest); matched / total (every state); */}}
{{/*   open       every open proposal, whatever the filters (the header counter); */}}
{{/*   counts     per state, over every proposal the filters match, Merged and Rejected in the */}}
{{/*              range (the chips, the donut); */}}
{{/*   stats      the five figures: Waiting for a decision (Proposed), Pull request open (PrOpen), */}}
{{/*              Merged and Rejected in the range (their chips' counts), the last run. Each tile's tone is the phase it */}}
{{/*              counts, so it wears the colour the cards (or the run rows) give that phase; */}}
{{/*              `unread` on a failed read (value "", drawn as "—"), `none` when no run is recorded. */}}
{{/*              `route`: a state tile's is its state chip's route (stateHref), so it opens the list */}}
{{/*              filtered to that state; the last run and a failed read have "" (a plain tile); */}}
{{/*   chips / viewChips / rangeChips   the state chips (label, count, active, route), Summary | */}}
{{/*              Full list, 24h | 7d | 30d: each route keeps every other param; */}}
{{/*   byState    the donut: a slice per state with proposals; */}}
{{/*   byKind     the open proposals per kind (every filter but kind), a bar against the largest, */}}
{{/*              each narrowing the page to its kind; */}}
{{/*   trend      per hour (24h) or day (7d, 30d), the newest bucket now: Proposed (created), */}}
{{/*              Decided (Merged or Rejected, at their decision) and Runs failed (started); */}}
{{/*   recentRuns the six newest runs: phase, when, how long, what it wrote; runCount, runsFailed; */}}
{{/*   lastRun, banner, reviewCronJob, askHref (the header's Ask Agentiko, every param kept), and */}}
{{/*   the superseded / Refused counts. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: platform-reviews
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: proposals
      path: /apis/review.krateo.io/v1alpha1/namespaces/{{ $.Release.Namespace }}/proposals
      verb: GET
      headers:
        - 'Accept: application/json'
      userAccessFilter:
        verb: list
        group: review.krateo.io
        resource: proposals
        namespaceFrom: .metadata.namespace
      {{/* A cluster without the component has no review.krateo.io API: the page says so. */}}
      continueOnError: true
      errorKey: proposalsError
    - name: runs
      path: /apis/review.krateo.io/v1alpha1/namespaces/{{ $.Release.Namespace }}/reviewruns
      verb: GET
      headers:
        - 'Accept: application/json'
      userAccessFilter:
        verb: list
        group: review.krateo.io
        resource: reviewruns
        namespaceFrom: .metadata.namespace
      continueOnError: true
      errorKey: runsError
    {{/* The nightly review's CronJob, for "Run review now": a plain GET as the caller. Its */}}
    {{/* jobTemplate is what a manual run instantiates (`kubectl create job --from=cronjob/...`). */}}
    {{/* Absent or unreadable, the page simply offers no button. */}}
    - name: cronjob
      path: /apis/batch/v1/namespaces/{{ $.Release.Namespace }}/cronjobs/nightly-review
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: cronjobError
    {{- include "portal.reviewDiscoverySteps" (dict "source" "proposals") | nindent 4 }}
  filter: |
    {{- include "portal.reviewDefs" . | nindent 4 }}
    {{- include "portal.facets" . | nindent 4 }}
    . as $in
    | ["projects", "kind", "repo", "today", "q", "view", "state", "range"] as $keys
    | (($in.q // "") | tostring | gsub("^\\s+|\\s+$"; "")) as $qraw
    | ($qraw | ascii_downcase) as $q
    # Search is one more filter on each row's `f` (f.q is "1" on a match), so the facet counts
    # follow it.
    | (($in | fx_filters(["kind", "repo", "today"])) + { q: (if $q == "" then [] else ["1"] end) }) as $flt
    # The params every link carries, in the page order; the search trimmed, as it is applied.
    | ($in | fx_params($keys) | map(if .[0] == "q" then ["q", $qraw] else . end)) as $p
    | ((($in.view // "") | tostring) == "table") as $tableView
    # The state chips, in the order they are drawn: what needs someone first.
    | [ { key: "open", label: "Open", phases: ["Proposed", "PrOpen"] },
        { key: "proposed", label: "Proposed", phases: ["Proposed"] },
        { key: "propen", label: "PR open", phases: ["PrOpen"] },
        { key: "merged", label: "Merged", phases: ["Merged"], windowed: true },
        { key: "rejected", label: "Rejected", phases: ["Rejected"], windowed: true },
        { key: "failed", label: "Failed", phases: ["Failed"] },
        { key: "all", label: "All", phases: ["Proposed", "PrOpen", "Merged", "Rejected", "Failed"] } ] as $states
    | ((($in.state // "") | tostring | ascii_downcase) | if . == "" then "open" else . end) as $sel
    | (([ $states[] | select(.key == $sel) ][0]) // { phases: [] }) as $selState
    | ((($in.range // "") | tostring) | if . == "24h" or . == "30d" then . else "7d" end) as $range
    | ({ "24h": 86400, "7d": 604800, "30d": 2592000 }[$range]) as $window
    | ({ "24h": "the last 24 hours", "7d": "the last 7 days", "30d": "the last 30 days" }[$range]) as $rangeText
    | (now | todate | .[0:10]) as $today
    | now as $now
    # A proposal's facet values. A comma would split a value in the URL, so it is dropped.
    | def rowf:
        { kind: ((.spec.kind // "—") | tostring | gsub(","; "")),
          repo: ((.spec.target.repo // "") | tostring | gsub(","; "") | if . == "" then "(no target repo)" else . end),
          today: (if ((.metadata.creationTimestamp // "") | .[0:10]) == $today then "1" else "0" end),
          q: (if $q == "" then ""
              elif ([ (.spec.title // .metadata.name // ""), (.spec.subject // ""), (.spec.kind // ""), (.spec.target.repo // "") ]
                    | map(tostring | ascii_downcase) | any(contains($q))) then "1" else "0" end) };
      rv_served_gvs as $served
    | rv_kinds_by_gv as $kinds
    | ((.proposalsError // null) | if . == null then "" else tostring end) as $perr
    | ([ ((.proposals.items) // [])[] | select((.status.phase // "Proposed") != "Refused") ]) as $all
    | ([ ((.proposals.items) // [])[] | select((.status.phase // "") == "Refused") ] | length) as $refused
    | ([ $all[] | select((.status.phase // "") == "Superseded" and (.status.supersededBy // "") != "")
         | { key: .metadata.name, value: .status.supersededBy } ] | from_entries) as $up
    | ([ $all[] | select((.status.phase // "") != "Superseded") | .metadata.name ]) as $live
    | ([ $all[] | select((.status.phase // "") == "Superseded") | .metadata.name | rv_root($up; 0) ]
       | map(select(. as $r | $live | rv_has($r))) | group_by(.) | map({ key: .[0], value: length }) | from_entries) as $under
    | ([ $all[] | select((.status.phase // "") != "Superseded"
                         or (((.metadata.name | rv_root($up; 0)) as $r | $live | rv_has($r)) | not)) ]) as $visible
    | def row:
        rv_phase as $ph | rv_decision as $d
        | (($under[.metadata.name] // 0) | if . == 0 then "—" else (tostring + " earlier") end) as $sup
        | { name: .metadata.name,
            title: (.spec.title // .metadata.name),
            subject: (.spec.subject // "—"),
            kind: (.spec.kind // "—"),
            sources: (rv_sources | if . == "" then "—" else . end),
            checks: (rv_pills($served; $kinds) | tojson),
            phase: $ph,
            phaseLabel: (if $ph == "PrOpen" then "PR open" else $ph end),
            phaseColor: ($ph | rv_phase_color),
            superseded: $sup,
            created: (.metadata.creationTimestamp // ""),
            target: (.spec.target.repo // "—"),
            decidedBy: (if $d.by == "" then "—" else $d.by end),
            # When it was decided, for the figures, the Merged and Rejected chips and the trend: a merge is the service's (status,
            # or the pull request's merge), never the PrOpen decision spec.decision still carries.
            decidedAt: (if $ph == "Merged" then (.status.decidedAt // .status.pullRequest.mergedAt // $d.at // "") else $d.at end),
            outcome: (if (.status.pullRequest.url // "") != "" then .status.pullRequest.url
                      elif $d.reason != "" then $d.reason else (.status.error // "—") end),
            # The card: the finding, the day it was proposed, what it replaces.
            body: ([ (if (.spec.subject // "") != "" then .spec.subject else empty end),
                     "proposed " + ((.metadata.creationTimestamp // "") | .[0:10]),
                     (if $sup != "—" then "replaces " + $sup else empty end) ] | join(" · ")),
            cta: (if $ph == "Proposed" or $ph == "PrOpen" then "Decide" else "Open proposal" end),
            f: rowf };
      def grouped:
        group_by(.spec.subject // ("~" + .metadata.name))
        | map(sort_by(.metadata.creationTimestamp // "") | reverse)
        | sort_by(.[0].metadata.creationTimestamp // "") | reverse | add // [];
      # A row in state $s: its phase is one of $s's and, for Merged and Rejected, it was decided in
      # the range, by the timestamp the figures and the trend read (decidedAt, no older than the window).
      def inState($s):
        (.phase as $ph | $s.phases | rv_has($ph))
        and ((($s.windowed // false) | not)
             or ((.decidedAt // "") as $d | ($d != "") and (($d | rv_epoch) as $at | $at != null and $at >= $now - $window)));
      ([ $visible[] | select(rv_phase as $ph | ["Proposed", "PrOpen", "Merged", "Rejected", "Failed"] | rv_has($ph)) ] | grouped | map(row)) as $allRows
    | ([ $allRows[] | select(.phase == "Proposed" or .phase == "PrOpen") ]) as $open
    | ($allRows | fx_apply($flt)) as $matchedAll
    | ([ $allRows[] | select(inState($selState)) ]) as $inState
    | ([ $matchedAll[] | select(inState($selState)) ]) as $shown
    | ([ $all[] | select((.status.phase // "") == "Superseded") | { f: rowf } ] | fx_apply($flt) | length) as $supersededInView
    | [ fx_facet($inState; $flt; "kind"; "Kind"; {}),
        fx_facet($inState; $flt; "repo"; "Target repo"; {}),
        fx_facet($inState; $flt; "today"; "New today"; { "1": "yes", "0": "no" }) ] as $facets
    | ($states | map(. as $s | { key: $s.key, value: ([ $matchedAll[] | select(inState($s)) ] | length) }) | from_entries) as $counts
    | ([ ((.runs.items) // [])[] ] | sort_by(.status.startedAt // .metadata.creationTimestamp // "") | reverse) as $runs
    | ($runs[0] // null) as $last
    | ((.cronjob // {}) | if type == "object" and (.kind // "") == "CronJob" and ((.metadata.name // "") != "") and (.spec.jobTemplate.spec != null) then . else null end) as $cron
    | ((.proposalsError // null) | if . == null then "" elif type == "array" then map(if type == "object" then (.message // tojson) else tostring end) | join("; ") elif type == "object" then (.message // tojson) else tostring end) as $perrText
    | ((.runsError // null) | if . == null then "" elif type == "array" then map(if type == "object" then (.message // tojson) else tostring end) | join("; ") elif type == "object" then (.message // tojson) else tostring end) as $rerr
    | ($perr != "") as $failed
    # THE FIGURES. Waiting and Pull request open count now; Merged and Rejected count the decisions
    # in the range. Each is its state chip's count, so the list a tile opens holds that many. A proposals read that failed is "—" on those four, never 0; a runs read that
    # failed is "—" on the last.
    # A state chip's route, and a state tile's: every other param kept.
    | def stateHref($k): fx_href("/reviews"; fx_set($p; "state"; (if $k == "open" then "" else $k end)));
      ([ $matchedAll[] | select(.decidedAt != "") | { phase, at: (.decidedAt | rv_epoch) } | select(.at != null) ]) as $decisions
    | ([ $matchedAll[] | select(.phase == "Proposed" and .f.today == "1") ] | length) as $newToday
    | ([ { title: "Waiting for a decision", value: $counts.proposed,
          caption: (if $newToday > 0 then ($newToday | tostring) + " new today" else "no pull request yet" end), tone: "Proposed", key: "proposed" },
        { title: "Pull request open", value: $counts.propen, caption: "waiting for its merge", tone: "PrOpen", key: "propen" },
        { title: "Merged", value: $counts.merged, caption: ("in " + $rangeText), tone: "Merged", key: "merged" },
        { title: "Rejected", value: $counts.rejected, caption: ("in " + $rangeText), tone: "Rejected", key: "rejected" } ]
      | map(if $failed then { title, value: "", caption: "could not be read", tone: "unread", route: "" } else { title, value: (.value | tostring), caption, tone, route: stateHref(.key) } end)
      | . + [ (if $rerr != "" then { title: "Last run (all kinds)", value: "", caption: "could not be read", tone: "unread", route: "" }
               elif $last == null then { title: "Last run (all kinds)", value: "", caption: "no review has run yet", tone: "none", route: "" }
               else ($last.status.phase // "Pending") as $lp
                 | { title: "Last run (all kinds)", value: $lp,
                     caption: ($last.metadata.name + " · " + ($last.status.startedAt | rv_when | .[11:])), tone: $lp, route: "" } end) ]) as $stats
    # THE TREND: per bucket, the newest bucket the current hour or day, so the chart ends now.
    | (if $range == "24h" then { size: 3600, n: 24, unit: "hour" } elif $range == "30d" then { size: 86400, n: 30, unit: "day" } else { size: 86400, n: 7, unit: "day" } end) as $b
    | ((($now / $b.size) | floor) * $b.size - ($b.n - 1) * $b.size) as $start
    | def bucket: select(. != null and . >= $start) | ((. - $start) / $b.size | floor);
      ([ $matchedAll[] | .created | rv_epoch | bucket ]) as $proposedB
    | ([ $decisions[] | select(.phase == "Merged" or .phase == "Rejected") | .at | bucket ]) as $decidedB
    | ([ $runs[] | select((.status.phase // "") == "Failed") | (.status.startedAt // .metadata.creationTimestamp // "") | rv_epoch | bucket ]) as $runsFailedB
    | ([ range(0; $b.n) as $i | ($start + $i * $b.size) as $t
         | { t: $t, series: "Proposed", v: ([ $proposedB[] | select(. == $i) ] | length) },
           { t: $t, series: "Decided", v: ([ $decidedB[] | select(. == $i) ] | length) },
           { t: $t, series: "Runs failed", v: ([ $runsFailedB[] | select(. == $i) ] | length) } ]) as $trend
    # OPEN BY KIND: every filter but kind, so the bars stay a choice; a bar opens the open ones of its kind.
    | ([ $open[] | select(fx_pass($flt; "kind")) ] | group_by(.f.kind)
       | map({ name: .[0].f.kind, count: length }) | sort_by(-.count, .name) | .[0:8]) as $kindRows
    | (($kindRows[0].count // 0)) as $kindMax
    | ([ $kindRows[] | . + { percent: (if $kindMax > 0 then (.count * 100 / $kindMax | floor) else 0 end),
                              href: fx_href("/reviews"; fx_set(fx_set($p; "kind"; .name); "state"; "")) } ]) as $byKind
    | def cap($k): if length > $k then (.[0:($k - 1)] + "…") else . end;
      def numbered: .[0:8] | to_entries
        | map(((.key + 1) | tostring) + ". \"" + (.value.title | cap(110)) + "\" (" + .value.kind + ", " + .value.phase + ")") | join(" ");
      # The "Ask Agentiko →" prompt (button.reviews-ask-agentiko). A refused, missing or failed read
      # of the proposals is said as such — never "no open proposals", which is a claim about a list
      # nobody managed to read.
      (if ($perr | test("404|not found|could not find"; "i")) then
         "The nightly review is not installed on this cluster: it serves no review.krateo.io API, so there are no proposals to read. Explain what the nightly review does and what installing it would take."
       elif ($perr | test("403|forbidden"; "i")) then
         "I cannot read the nightly review's proposals on this platform (" + ($perrText | cap(300)) + "). Explain what access I need and who can grant it."
       elif $perr != "" then
         "The nightly review's proposals could not be read (" + ($perrText | cap(300)) + "). Explain what that error means and what to check."
       else
         (if $rerr != "" then " The review runs could not be read (" + ($rerr | cap(300)) + ")."
          elif $last == null then " No review run is recorded."
          else " The last review run is " + $last.metadata.name + " (" + ($last.status.phase // "Pending") + ", started " + ($last.status.startedAt | rv_when) + ")." end) as $lastLine
         | ([ (if $sel != "open" then "state: " + (([ $states[] | select(.key == $sel) ][0].label) // ($sel | cap(40)))
                 + (if ($selState.windowed // false) then " in " + $rangeText else "" end) else empty end) ]
            + [ $facets[] | select((.active | length) > 0)
              | if .key == "today" then (if any(.active[]; . == "1") then "new today" else "not new today" end)
                else .label + ": " + (.active | join(", ")) end ]
            + (if $q != "" then [ "search \"" + ($qraw | cap(80)) + "\"" ] else [] end) | join("; ")) as $desc
         | if $sel != "open" then
             (if ($shown | length) == 0 then
                "No nightly-review proposal is in the view on screen (" + $desc + "), of " + (($allRows | length) | tostring) + " in all." + $lastLine
                + " Tell me whether that filter hides anything I should look at."
              else
                "Review the nightly-review proposals in the view on screen (" + $desc + "): " + (($shown | length) | tostring)
                + " of " + (($allRows | length) | tostring) + " — " + ($shown | numbered) + "." + $lastLine
                + " Tell me what they say about the review's suggestions: which were worth acting on, and whether any should be revisited."
              end)
           elif ($open | length) == 0 then
             "The nightly review has no open proposals." + $lastLine
             + (if $last == null and $rerr == "" then " Explain what the nightly review reads, and when its first proposals will appear."
                else " Check the platform's telemetry and tell me whether that matches what you see, or whether the review missed something." end)
           elif $desc == "" then
             "Help me work through the open nightly-review proposals: " + (($open | length) | tostring) + (if ($open | length) == 1 then " is" else " are" end)
             + " open — " + ($open | numbered) + "." + $lastLine
             + " Check each against the platform's telemetry, and say which I should act on first, which to reject, and why."
           elif ($shown | length) == 0 then
             "None of the " + (($open | length) | tostring) + " open nightly-review proposals is in the view on screen (" + $desc + ")." + $lastLine
             + " Tell me whether that filter hides anything I should look at."
           else
             "Help me work through the open nightly-review proposals in the view on screen (" + $desc + "): "
             + (($shown | length) | tostring) + " of " + (($open | length) | tostring) + " open — " + ($shown | numbered) + "." + $lastLine
             + " Check each against the platform's telemetry, and say which I should act on first, which to reject, and why."
           end
       end) as $prompt
    | { askHref: fx_href("/reviews"; $p + [["ask", $prompt]]),
        installed: ($perr | test("404|not found|could not find"; "i") | not),
        denied: ($perr | test("403|forbidden"; "i")),
        failed: $failed,
        readError: $perrText,
        open: ($open | length),
        {{/* The proposals in the picked state the filters match: the table and (capped) the cards. */}}
        rows: $shown,
        cards: $shown[0:24],
        more: ([ ($shown | length) - 24, 0 ] | max),
        matched: ($shown | length),
        total: ($matchedAll | length),
        state: $sel,
        q: $qraw,
        range: $range,
        view: (if $tableView then "table" else "" end),
        facets: $facets,
        filtered: ([ $flt[] | select(length > 0) ] | length > 0),
        counts: $counts,
        stats: $stats,
        chips: fx_chips("/reviews"; $p; $facets),
        stateChips: [ $states[] | { label, count: ($counts[.key] // 0), active: (.key == $sel),
                                    route: stateHref(.key) } ],
        viewChips: [ { label: "Summary", active: ($tableView | not), route: fx_href("/reviews"; fx_set($p; "view"; "")) },
                     { label: "Full list", active: $tableView, route: fx_href("/reviews"; fx_set($p; "view"; "table")) } ],
        rangeChips: [ ("24h", "7d", "30d") | { label: ., active: (. == $range), route: fx_href("/reviews"; fx_set($p; "range"; (if . == "7d" then "" else . end))) } ],
        todayToggle: ([ $facets[] | select(.key == "today") ][0] as $t
                      | { show: $t.show, active: any($t.active[]; . == "1"),
                          count: ([ $t.values[] | select(.value == "1") | .count ][0] // 0),
                          href: (if any($t.active[]; . == "1") then fx_href("/reviews"; fx_without($p; "today"; "1"))
                                 else fx_href("/reviews"; fx_set($p; "today"; "1")) end) }),
        byState: [ $states[] | select(.key != "open" and .key != "all") | { state: .label, count: ($counts[.key] // 0) } | select(.count > 0) ],
        byKind: $byKind,
        trend: $trend,
        trendUnit: $b.unit,
        refused: $refused,
        supersededHidden: ([ $under[] ] | add // 0),
        supersededInView: $supersededInView,
        recentRuns: [ $runs[0:6][] | (.status.phase // "Pending") as $ph
                   | { name: .metadata.name,
                       phase: $ph,
                       phaseColor: ($ph | rv_run_color),
                       started: (.status.startedAt // "" | rv_ts // ""),
                       took: rv_dur(.status.startedAt; .status.finishedAt),
                       result: (if $ph == "Failed" then (.status.error // "failed, no error recorded")
                                elif $ph == "Running" or $ph == "Pending" then "in progress"
                                else (((.status.proposals.created // 0) | tostring) + " proposed"
                                      + (if (.status.proposals.superseded // 0) > 0 then " · " + (.status.proposals.superseded | tostring) + " superseded" else "" end)
                                      + (if (.status.proposals.deduplicated // 0) > 0 then " · " + (.status.proposals.deduplicated | tostring) + " duplicate" else "" end)) end),
                       notRead: (rv_not_read | if . == "" then "—" else . end) }
                   | . + { caption: ((.started | rv_when) + " · " + .took + " · " + .result) } ],
        runCount: ($runs | length),
        lastRun: (if $last == null then null else { name: $last.metadata.name, phase: ($last.status.phase // "Pending"), started: ($last.status.startedAt | rv_when) } end),
        runsFailed: ($rerr != ""),
        {{/* What a manual run instantiates: the CronJob's identity and its jobTemplate, verbatim. */}}
        reviewCronJob: (if $cron == null then null else
          { name: $cron.metadata.name, namespace: ($cron.metadata.namespace // "{{ $.Release.Namespace }}"), uid: ($cron.metadata.uid // ""),
            jobTemplate: { metadata: ($cron.spec.jobTemplate.metadata // {}), spec: $cron.spec.jobTemplate.spec } } end),
        {{/* The one line under the header, when the latest run is not a clean Completed. */}}
        banner: (
          if ($perr | test("404|not found|could not find"; "i")) then
            { type: "info", title: "The nightly review is not installed on this cluster",
              description: "This page lists review.krateo.io proposals and review runs, and this cluster serves no such API. Once the nightly review component is installed, its first run's proposals appear here." }
          elif ($perr | test("403|forbidden"; "i")) then
            { type: "warning", title: "Your role cannot read review proposals",
              description: "Listing review.krateo.io proposals in this namespace was refused for your account. An administrator can grant read access to proposals and reviewruns." }
          elif $last == null then
            { type: "info", title: "No review has run yet",
              description: "The nightly review reads the last 24 hours of this platform's telemetry and agent sessions. Its proposals appear here, and nothing is applied." }
          elif (($last.status.phase // "Pending") == "Running" or ($last.status.phase // "Pending") == "Pending") then
            { type: "info", title: ("A review is running: " + $last.metadata.name),
              description: ("Started " + ($last.status.startedAt | rv_when)
                            + ([ ($last.status.steps // [])[] | select(.phase == "Running") | " · current step: " + .name ][0] // "")
                            + ". The proposals below come from runs that finished.") }
          elif ($last.status.phase // "") == "Failed" then
            { type: "error", title: ("The last review failed: " + $last.metadata.name),
              description: ("It stopped after " + rv_dur($last.status.startedAt; $last.status.finishedAt) + ": "
                            + ($last.status.error // "no error recorded") + ". The proposals below come from earlier runs.") }
          elif ($last.status.phase // "") == "PartiallyCompleted" then
            { type: "warning", title: ("The last review saw part of the platform: " + $last.metadata.name),
              description: (($last | rv_not_read | if . == "" then "Some evidence sources were not read." else . end)
                            + ". Anything it proposed rests on incomplete evidence.") }
          else null end) }
