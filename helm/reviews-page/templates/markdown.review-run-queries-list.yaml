kind: Markdown
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-run-queries-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-run
    namespace: {{ $.Values.namespace }}
  widgetData:
    markdown: None recorded.
    allowCopy: true
  widgetDataTemplate:
    - forPath: markdown
      expression: '${ if (.queriesMarkdown // "") == "" then "None recorded." else .queriesMarkdown end }'
  resourcesRefs:
    items: []
