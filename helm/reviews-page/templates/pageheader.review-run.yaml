{{/* The /reviews/runs/{name} header: the run's name, its window and duration, its phase, and
     "Ask Agentiko →" (button.review-run-ask-agentiko), which carries its own apiRef. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: review-run-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name]
  apiRef:
    name: review-run
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Review run
    allowedResources:
    - buttons
    items:
    - resourceRefId: review-run-ask-agentiko
  widgetDataTemplate:
    - forPath: title
      expression: '${ if (.found // false) then .name else (.title // "Review run") end }'
    - forPath: subtitle
      expression: '${ if (.found // false) then .subtitle else "" end }'
    - forPath: tags
      expression: '${ if (.found // false) then [ { label: .phase, color: .phaseColor } ] else [] end }'
  resourcesRefs:
    items:
    - id: review-run-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: review-run-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
