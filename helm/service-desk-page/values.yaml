# @schema
# description: The namespace this chart CREATES and installs its page objects into. It is the RBAC boundary for the PAGES: a group with no RoleBinding here cannot `list` the page roots, so the portal's sidebar never shows "Service desk" to them and a deep link 403s. It holds no Zendesk request: those live in each organisation's own namespace, beside its ZendeskRequestConfiguration, and who sees which is that namespace's RBAC. It still holds every Ticket filed before the page moved to Zendesk, which is why it stays kept on uninstall (see namespace.yaml). Changing it after install orphans the previous namespace's objects, which Helm will not prune because it no longer renders them.
# type: string
# default: "krateo-service-desk"
# @schema
namespace: krateo-service-desk

# @schema
# description: Groups granted read of these pages. A group listed here sees /service-desk in the sidebar and can open the queue, the raise form and a request's page. It does NOT decide whose requests anyone sees: the queue lists the ZendeskRequests the CALLER may list, namespace by namespace, so a tenant sees its own organisation's requests and an admin sees every organisation's. A group missing from here sees no page at all, whatever it may read.
# type: array
# @schema
readerGroups:
  - admins
