{{/* "Raise a request" — the queue's one primary action.

     Navigates rather than opening a modal: the form asks four things, and someone may need to go
     and look something up before writing the description. A route can be left and come back to.

     THE SHAPE IS LOAD-BEARING. The Button CRD requires `widgetData.clickActionId`; without it the
     CR does not apply and the whole chart fails to install. `path` belongs on the NAVIGATE ACTION:
     a `path` written on a resourcesRefs item is pruned silently and the click does nothing.
     Modelled on alerts-page/templates/button.alerts-new.yaml. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: service-desk-raise
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    label: Raise a request
    icon: fa-plus
    type: primary
    size: middle
    clickActionId: raise
    actions:
      navigate:
        - id: raise
          type: navigate
          path: /service-desk/new
  resourcesRefs:
    items: []
