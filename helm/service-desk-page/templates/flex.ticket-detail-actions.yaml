{{/* The ticket's actions, on the header's one action row: Assign to me (spec.assignee + its label
     mirror) · Ask Autopilot · Resolve (spec.state + its mirror).

     Resolve is this container's one primary. Ask Autopilot is filled too and does not take that
     slot: A4 makes every Autopilot entry point the same filled object everywhere, so it sits
     BESIDE the container's primary rather than instead of it (design rule P6 encodes exactly
     that). Assign to me is a default button — picking a ticket up is a step, not the outcome.

     identityContext: [username] because `canAssign` compares the assignee with the CALLER, and
     only snowplow can say who that is. Without it `me` is empty in this widget's own resolution,
     canAssign is false, and the button would never appear. The cost is that this Flex's cache cell
     is per-person, which is correct: whether "Assign to me" is a no-op depends on who is asking. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-detail-actions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  identityContext:
    - username
  apiRef:
    name: ticket-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    vertical: false
    gap: small
    align: center
    allowedResources:
    - buttons
    items:
    - resourceRefId: ticket-ask-autopilot
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ {{ if $.Values.deskActions }}(if (.canAssign // false) then [ { resourceRefId: "ticket-assign-to-me" } ] else [] end) +{{ end }}
        [ { resourceRefId: "ticket-ask-autopilot" } ]
        {{- if $.Values.deskActions }}
        + (if (.canResolve // false) then [ { resourceRefId: "ticket-resolve" } ] else [] end)
        {{- end }} }
  resourcesRefs:
    items:
    {{- if $.Values.deskActions }}
    - id: ticket-assign-to-me
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-assign-to-me
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    {{- end }}
    - id: ticket-ask-autopilot
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-ask-autopilot
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    {{- if $.Values.deskActions }}
    - id: ticket-resolve
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-resolve
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    {{- end }}
