{{/* The /service-desk/new header: title and one line saying what happens to the request — the first
     question someone has after pressing the button is who sees it.

     NO ACTIONS. The only action is the submit, and it belongs to the form below. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: request-new-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Raise a request
    subtitle: Your request goes to Zendesk, and the support team answers it there.
  resourcesRefs:
    items: []
