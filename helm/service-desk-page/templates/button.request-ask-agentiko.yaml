{{/* "Ask Agentiko →" on a request's page — the assistant entry point for this request. It navigates
     to THIS page with an ?ask seed the rail consumes on mount, so the conversation starts holding the
     request: its status, its Zendesk number and what the page's alert says are all on the page, and
     the page is the envelope. Other pages' "Ask Agentiko →" buttons point here for this comment.

     THE LABEL AND THE ROLE ARE FIXED. A4: every agent entry point in the portal is the same object —
     a button labelled exactly `Ask Agentiko →` with `intent: agentiko`, which the frontend draws
     filled with the Agentiko gradient and mark (outlined with a lock when the agent is not
     licensed); `type` and `icon` are ignored, so they are not set. The design lint recognises one by
     what it does as well as by its label (a Button that navigates to `?ask=`, or reads an `…Href`
     its RESTAction builds with one), so a differently-worded version of this button is a finding,
     not a variation. Here it is the header's only action.

     The href is built server-side (zendesk-request `.askHref`, @uri-encoded) and named `askHref` for
     the same reason — two "Diagnose" buttons once hid from this rule by calling it something else.
     The click is a plain literal navigate.

     Graceful when the agent is not licensed: the ?ask opens the rail's licence panel instead, and is
     stripped. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: request-ask-agentiko
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: zendesk-request
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /service-desk
  widgetDataTemplate:
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.askHref // "") != "" then .askHref else "/service-desk" end) } ] } }'
  resourcesRefs:
    items: []
