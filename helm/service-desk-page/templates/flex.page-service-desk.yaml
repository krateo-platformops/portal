{{/* Page root for /service-desk: the header, the state chips, then the queue — or, when the
     selected view holds no ticket, a sentence saying why in place of the table.

     IT READS tickets-list AND TEMPLATES ITS ITEMS, as reviews-page flex.reviews-decided does,
     because the Table hard-codes "No rows" and has no field to say anything else. The choice is
     made from the same RESTAction, with the same keyExtras, as the chips and the table, so the
     three cannot disagree about which tickets there are:
       read failed   → header, table. No chips (their counts would claim a quiet desk) and no
                       sentence ("no one has raised a ticket" would be false); the header's red tag
                       and subtitle say what happened, as they did before the chips.
       nothing shown → header, chips, result.service-desk-empty (tickets-list `emptyTitle`).
       otherwise     → header, chips, table.

     THE NAV ANNOTATIONS ARE HALF THE RBAC STORY. The portal discovers the namespaces where the
     CALLER may `list` page roots and lists the roots in each as that caller, so a group with no
     RoleBinding in this namespace never sees the entry — see rbac.page-readers.yaml. The annotations
     only say where it goes once someone is allowed to see it.

     Under "Platform" rather than its own group: a service desk is not an observability surface and
     not a builder. nav-order 40 puts it after the authoring and observability entries — someone
     raising a ticket is not in the middle of a task, they have stopped and gone looking.

     allowedResources lists the child PLURALS. It is an enum, so a child kind missing from it is
     refused rather than ignored — adding a widget below means adding its plural here. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-service-desk
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Platform"
    "krateo.io/nav-icon": "fa-headset"
    "krateo.io/nav-label": "Service desk"
    "krateo.io/nav-order": "40"
    "krateo.io/nav-path": "/service-desk"
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell: which child is drawn depends on
       the ?state= chip. */}}
  keyExtras: [state]
  apiRef:
    name: tickets-list
    namespace: {{ $.Values.namespace }}
  widgetData:
    allowedResources:
    - pageheaders
    - listies
    - tables
    - results
    vertical: true
    gap: middle
    items:
    - resourceRefId: service-desk-header
    - resourceRefId: service-desk-state-chips
    - resourceRefId: tickets-table
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ [ { resourceRefId: "service-desk-header" } ]
        + (if (.failed // false) then [ { resourceRefId: "tickets-table" } ]
           elif ((.rows // []) | length) == 0 then [ { resourceRefId: "service-desk-state-chips" }, { resourceRefId: "service-desk-empty" } ]
           else [ { resourceRefId: "service-desk-state-chips" }, { resourceRefId: "tickets-table" } ] end) }
  resourcesRefs:
    items:
    - id: service-desk-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: service-desk-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: tickets-table
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: tickets-table
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
    - id: service-desk-state-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: service-desk-state-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: service-desk-empty
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: service-desk-empty
      namespace: {{ $.Values.namespace }}
      resource: results
      verb: GET
