{{/* WHO SEES /service-desk. One grant: read of the pages in this chart's namespace.

     The sidebar mechanism is the same as every page chart (#261): the portal discovers the
     namespaces where the CALLER may `list` page roots and lists them as that caller, so a group with
     no RoleBinding here never sees the entry. A deep link still routes — routes are deliberately not
     RBAC-filtered — and the page's content /call returns 403, which is where the defence belongs.

     THIS GRANTS NOTHING ON ZENDESK REQUESTS, deliberately. The page reads and writes them AS THE
     CALLER, so what a person sees and may raise is their own RBAC in their own organisation's
     namespace, granted where that namespace is made. krateo-selfservice-blueprint 0.2.63 grants a
     tenant get/list/watch on zendeskrequests in its own namespace; the raise form also needs `list`
     on zendeskrequestconfigurations and `create` on zendeskrequests there, and without them the
     form says so (no configuration) or the submit says so (403). Granting any of it here would mean
     deciding, in a page chart, which organisation's requests a group may read — a decision this
     chart has no business making.

     The Ticket desk's grants are gone with the Ticket kind: the desk's get/list/create/patch/delete
     on tickets, and `requesterGroups` with its create-only Role and its read of the raise screen's
     namespace. Existing RoleBindings that named those Roles are removed with them on upgrade.

     No ClusterRole anywhere here, deliberately: `scripts/lint-caller-cluster-reads.py` enforces it,
     and a page that needs cluster-scoped reads to work is a page whose RBAC boundary has escaped.
     The queue's cross-namespace list is snowplow's own (userAccessFilter, see
     restaction.zendesk-requests.yaml), refiltered per object as the caller. */}}
{{- range $g := .Values.readerGroups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $g }}-read-service-desk-pages
  namespace: {{ $.Values.namespace }}
rules:
- apiGroups:
  - widgets.templates.krateo.io
  resources:
  - '*'
  verbs:
  - get
  - list
- apiGroups:
  - templates.krateo.io
  resources:
  - restactions
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $g }}-read-service-desk-pages
  namespace: {{ $.Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $g }}-read-service-desk-pages
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ $g }}
{{- end }}
