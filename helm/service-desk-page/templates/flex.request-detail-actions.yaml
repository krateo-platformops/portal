{{/* The request's actions, on the header's one action row: "Ask Agentiko →", then "Open in Zendesk
     ↗" — the primary, because Zendesk is where the request is worked now.

     "Open in Zendesk ↗" waits until there is something to open: status.html_url arrives with the
     Zendesk number, and zendesk-request passes it on only when it is https. It stays when Zendesk
     can't be reached, because following a link the portal already has does not go through the
     organisation's token.

     No edit and no delete. Every field of a ZendeskRequest except krateo_reference is create-only,
     and deleting one never touches Zendesk, so neither action would do what its label says. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: request-detail-actions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: zendesk-request
    namespace: {{ $.Values.namespace }}
  widgetData:
    vertical: false
    gap: small
    align: center
    allowedResources:
    - buttons
    items:
    - resourceRefId: request-ask-agentiko
  widgetDataTemplate:
    - forPath: items
      expression: '${ [ { resourceRefId: "request-ask-agentiko" } ] + (if (.url // "") != "" then [ { resourceRefId: "request-open-zendesk" } ] else [] end) }'
  resourcesRefs:
    items:
    - id: request-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: request-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    - id: request-open-zendesk
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: request-open-zendesk
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
