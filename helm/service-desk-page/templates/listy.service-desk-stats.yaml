{{/* The five figures over every request the caller may list: Active (of all), Pending (Zendesk is
     waiting for a reply from someone here), Need attention (refused by Zendesk, held, or an
     undocumented reason), Opened and Solved in the range. Colour is exception-only: Pending orange
     and Need attention red above zero; each caption carries the meaning too. A failed read never
     reaches this: the page draws the unavailable sentence in its place. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: service-desk-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [state, range, view]
  identityContext:
    - username
  apiRef:
    name: zendesk-requests
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      color:
        value: '{tone}'
        map:
          bad: red
          warn: orange
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
