{{/* A new activity entry on the ticket — one merge-PATCH of spec.activity, with the caller's own
     token.

     A MERGE-PATCH REPLACES AN ARRAY WHOLESALE, so the body carries every existing entry plus the
     new one. The CRD's `activity` declares no x-kubernetes-list-type, which makes it atomic: there
     is no per-item patch for it, and the request that would append one — a JSON-Patch
     `add /spec/activity/-` — is not something the Form widget can build, because its body is
     always a JSON object (buildPayload merges objects and lodash-sets the overrides; nothing makes
     it a top-level array). snowplow would forward such a patch untouched; the limit is the widget.

     THE CONSEQUENCE IS A LOST UPDATE, and it is worth knowing before it happens: a reply written
     against a page that was served before someone else replied overwrites their entry. Nothing in
     this chart can prevent it — appending needs a controller, and a `resourceVersion` precondition
     is not something this Form can send. At one desk's pace it is unlikely; it is not impossible,
     and it is not a thing to discover from a missing comment.

     HOW THE ENTRY IS ASSEMBLED, in three places for three different reasons:

       the existing entries   `payload`, built server-side from ticket-detail — the only place
                              that has them, since a Form's overrides see ONLY the submitted
                              values (`{ json: … }`), never the widget's data.
       `who`                  server-side too, from identityContext's JWT principal. Never a form
                              field: a name the browser chooses is a claim, not a fact.
       `text` and `at`        `payloadToOverride`, which resolves at SUBMIT time — so `at` is
                              `now` when the reply was sent, not when the page was served. The
                              server-side stub carries the serve time only as a fallback, so the
                              entry is still schema-valid if the override does not land.

     The override array is templated whole rather than value-by-value because its `name` carries
     the new entry's INDEX, which is only known at serve time. Templating name and value separately
     would be two expressions that have to agree about one number.

     ONE LINE, NOT A TEXTAREA. The schema-driven Form renders a `string` as an antd Input and has
     no multi-line control (there is no textarea anywhere in the widget set, nor in the composable
     `Input` widget's `type` enum). So a long reply is typed into one line. The CRD allows 8000
     characters and this caps at the same number rather than inventing a shorter limit.

     The posted entry appears on the next load of this page: the toast confirms the write, and
     nothing here re-reads the ticket afterwards. A `watch` would not help — it fires on a
     Kubernetes EVENT, and nothing reconciles a Ticket, so no event is ever written for one. */}}
kind: Form
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-reply-form
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  {{/* `who` is the server-trusted principal, injected into this widget's resolve input and folded
       into its cache key, so two people on this page never share a cell. */}}
  identityContext:
    - username
  apiRef:
    name: ticket-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    layout: vertical
    submitActionId: reply
    {{/* Required, so SchemaFields renders it up front rather than under "Advanced". */}}
    schema:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          title: Your reply
          maxLength: 8000
    buttonConfig:
      primary:
        label: Post reply
    actions:
      rest:
        - id: reply
          type: rest
          resourceRefId: patch-ticket
          headers:
            - 'Content-Type: application/merge-patch+json'
          successMessage: Reply posted
          {{/* Both replaced whole by the templates below. */}}
          payload: {}
          payloadToOverride: []
  widgetDataTemplate:
    {{/* Every existing entry, plus the new one with its text empty and its `at` set to the serve
         time — the fallback the submit-time override replaces. */}}
    - forPath: actions.rest[0].payload
      expression: >-
        ${ { spec: { activity: ((.activityExisting // [])
        + [ { at: (.servedAt // ""), who: (if (.me // "") != "" then .me else "unknown" end), kind: "comment", text: "" } ]) } } }
    {{/* The new entry's index is the count of the existing ones. The two `${ … }` strings are
         DATA here: they are resolved at submit time against the submitted values, which is the
         whole point — `now` has to be the clock at the click, not at the serve. */}}
    - forPath: actions.rest[0].payloadToOverride
      expression: >-
        ${ ((.activityCount // 0) | tostring) as $i
        | [ { name: ("spec.activity[" + $i + "].text"), value: "${ .json.text }" },
            { name: ("spec.activity[" + $i + "].at"), value: "${ now | todate }" } ] }
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    {{/* The ticket this page is about, named from the route params. */}}
    - template:
        id: patch-ticket
        apiVersion: ${ .ticketGvr.apiVersion }
        resource: ${ .ticketGvr.resource }
        name: ${ .ticketGvr.name }
        namespace: ${ .ticketGvr.namespace }
        verb: PATCH
