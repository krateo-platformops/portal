{{/* The referenced object's identity, straight from spec.objectRef: name, kind, apiVersion and the
     namespace it is in — the four things needed to go and look at it with kubectl.

     It comes from the REF and not from the live read, so it is still shown for an object that could
     not be read: what the ticket is about does not depend on whether the reader may see it. A ref
     with no namespace reads "cluster-scoped", which is also why its conditions are absent (see
     restaction.ticket-detail.yaml). */}}
kind: Descriptions
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-object-meta
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: ticket-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    {{/* Label/value pairs inline, not a stacked table: four short values on one line. */}}
    column: 4
    variant: default
    bordered: false
    size: small
    items: []
  widgetDataTemplate:
    - forPath: items
      expression: '${ .objectItems // [] }'
  resourcesRefs:
    items: []
