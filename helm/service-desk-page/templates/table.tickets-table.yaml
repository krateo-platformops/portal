{{/* The queue — one row per Ticket off tickets-list (which applies the ?state= chip as a LABEL
     SELECTOR, server-side). Summary, state, requester, assignee, age. Row click → the ticket.

     THE STATE COLOURS FOLLOW THE STATUS-PILL SPEC, which is stricter than it first looks and which
     parts of this repo do not follow — incidents-table maps `Resolved: "green"`, and green is
     reserved for HEALTH only (frontend#587 tracks the same class in the Table's `conditions` cell,
     which colours a True condition cyan).

       Open                  slate   a non-health state, the neutral-blue family
       In progress           gold    transitional
       Waiting on requester  gold    also transitional — it is waiting, not resting
       Resolved / Closed     faint   RECEDE

     Resolved does not go green, and that is deliberate rather than squeamish: a ticket never asserts
     health, and the portal's indicators are exception-only — "never mark healthy". Receding the done
     states is also simply the better queue: what still needs a person is what you see. These are
     PALETTE NAMES, resolved per theme by getColorCode, so the same four names work in dark mode.

     Every tag renders as getTagStyle's soft tint — 15% fill, 38% border, full-strength text — not a
     solid pill. Worth knowing before designing against it: a solid pill with white text is not
     something this widget can produce.

     ASSIGNEE IS PLAIN TEXT, NOT A TAG, and faint when unassigned — matching the approved mockup. A
     person's name is not a status and reads oddly as a pill.

     There is a real tension here that is deliberately left as the mockup has it: by the
     exception-only principle, UNASSIGNED is the actionable gap and arguably the thing that should
     stand out, yet faint de-emphasises it. The mockup greys it as an absence of value. That was
     approved, so it ships that way rather than being quietly "improved" — but it is a genuine
     question and not an oversight, so do not flip it without deciding. */}}
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: tickets-table
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. `state` drives the label selector, so
       a cell keyed without it would serve one chip's rows to another chip. */}}
  keyExtras: [state]
  widgetData:
    {{/* Shrink columns to the container rather than growing a horizontal scrollbar: a long summary
         ellipsis-truncates and carries its full text on hover. Unset is NOT neutral — it sets
         scroll.x: max-content, so omitting this chooses the scrollbar by default. */}}
    fitContent: true
    allowedResources: []
    bordered: false
    size: small
    rowNavigateTo: /service-desk/{namespace}/{name}
    pagination:
      defaultPageSize: 20
    columns:
    - valueKey: summary
      title: Ticket
    - valueKey: state
      title: State
    - valueKey: requester
      title: Requester
    - valueKey: assignee
      title: Assignee
    - valueKey: age
      title: Raised
    dataSource: []
  widgetDataTemplate:
  {{/* The summary is capped at ~110 chars so it cannot crush the trailing columns — the Table's
       columns carry no width knobs, so a long first cell is the one thing that wrecks the layout.
       The CRD caps it at 200, so this truncates rather than assuming. */}}
  - forPath: dataSource
    expression: '${ [ (.rows // [])[] | [ {valueKey:"summary",kind:"jsonSchemaType",type:"string",stringValue:((.summary // "") | if length > 110 then (.[0:109] + "…") else . end)}, {valueKey:"state",kind:"tag",stringValue:(.state // "Open"),color:({ "Open": "slate", "In progress": "gold", "Waiting on requester": "gold", "Resolved": "faint", "Closed": "faint" }[.state // "Open"] // "slate")}, {valueKey:"requester",kind:"jsonSchemaType",type:"string",stringValue:(.requester // "")}, {valueKey:"assignee",kind:"jsonSchemaType",type:"string",stringValue:(.assignee // "Unassigned"),color:(if .assigned then "text" else "faint" end)}, {valueKey:"age",kind:"jsonSchemaType",type:"string",stringValue:(.age // ""),format:"relative"}, {valueKey:"name",kind:"jsonSchemaType",type:"string",stringValue:(.name // "")}, {valueKey:"namespace",kind:"jsonSchemaType",type:"string",stringValue:(.namespace // "")} ] ] }'
  apiRef:
    name: tickets-list
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
