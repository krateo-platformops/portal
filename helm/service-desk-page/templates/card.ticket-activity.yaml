{{/* "Activity" — the ticket's conversation, oldest first. Shown only when there is one
     (`sections.activity`); a ticket nobody has answered yet shows the reply box and no empty log.

     A card of its own, above the reply, rather than the reply living in this card's footer: the
     Card footer slot takes widget children and no chart here uses it that way, and a conversation
     is readable without its composer being inside the same box.

     While ticket-detail derives Agentiko's resolve proposal (the linked incident is Resolved by its
     checks), the proposal's two answers follow the conversation here, on a desk that works tickets
     in this portal (deskActions). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-activity-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
{{- if $.Values.deskActions }}
  {{/* Read only for the resolve proposal's answers (button.ticket-keep-open.yaml), which follow the
       conversation while ticket-detail derives the proposal. */}}
  apiRef:
    name: ticket-detail
    namespace: {{ $.Values.namespace }}
{{- end }}
  widgetData:
    title: Activity
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - listies
{{- if $.Values.deskActions }}
    - flexes
{{- end }}
    items:
    - resourceRefId: ticket-activity
{{- if $.Values.deskActions }}
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ [ { resourceRefId: "ticket-activity" } ]
        + (if ((.sections // {}).resolveProposal // false) then [ { resourceRefId: "ticket-resolve-proposal-actions" } ] else [] end) }
{{- end }}
  resourcesRefs:
    items:
    - id: ticket-activity
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-activity
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
{{- if $.Values.deskActions }}
    - id: ticket-resolve-proposal-actions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-resolve-proposal-actions
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
{{- end }}
