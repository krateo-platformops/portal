{{/* /service-desk data source — one row per Ticket, shaped server-side.

     rows   : summary, state, requester, assignee, age, and the kind; filtered by the ?state= chip.
     counts : per-state totals, for the chips' live counts.

     THE FILTER IS A LABEL SELECTOR, NOT A jq PASS OVER THE WHOLE NAMESPACE, and that is the only
     mitigation available for the query ceiling a CRD gives us. The apiserver field-selects on
     `metadata.name` and `metadata.namespace` and nothing else, so filtering by state or assignee has
     to go through labels — which is why the Ticket CRD mirrors `spec.state` and `spec.assignee` into
     `krateo.io/ticket-state` and `krateo.io/ticket-assignee`. With a chip selected we ask the
     apiserver for that state's tickets; without one we ask for the open set. We never list the
     namespace and discard most of it.

     WHAT THIS STILL CANNOT DO, so nobody discovers it later: no full-text search of a description,
     no sort by an arbitrary field, and the counts below DO list the namespace (a count is a count of
     everything, and there is no aggregate API). At service-desk volumes that is fine. At thousands
     of tickets the counts leg is the first thing that hurts, and the answer then is a real database,
     not a cleverer jq.

     The jq runs in snowplow, as the caller, not in the browser — so a ticket the caller may not read
     is never shaped, never counted and never sent. The filtering is not a presentation convenience;
     it is where the data stops. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: tickets-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{/* ONE read, with a literal path. An earlier version of this file had a second, state-filtered
         leg whose path was a `${ … }` expression carrying a jq default:

             path: ${ "…/tickets?labelSelector=krateo.io%2Fticket-state%3D"
                      + ((.state // "open") | …) }

         `scripts/lint-ra-paths.py` rejects a `//` inside a path expression, and it is right to: on
         snowplow's Phase-1 walk the request extras are nil, so the default turns "no state asked
         for" into a real query and the step dials it on every prewarm. The lint's docstring records
         what that cost on 057 — one pod making hundreds of defaulted GETs in 20 minutes, every one
         hidden by continueOnError.

         The fix is not to gate that leg, it is that THE LEG WAS NEVER NEEDED. This leg already
         lists every ticket in the namespace, so the filtered leg could only ever return a subset of
         rows this one already has — a second request for data in hand. And the approved queue
         design has no state-filter control: every ticket is shown with its state as a pill, with
         counts in the header. There was nothing to filter server-side. So the state selection is
         gone rather than gated, which is one request fewer, no expression in any path, and nothing
         to dial at prewarm.

         This leg lists the namespace, deliberately and knowingly — see the header comment. It is the
         read here that does not scale, and now it is the only one, so when it has to become a paged
         walk there is exactly one place to change. */}}
    - name: tickets
      path: /apis/servicedesk.krateo.io/v1alpha1/namespaces/{{ $.Values.namespace }}/tickets
      verb: GET
      {{/* THE BOUNDARY IS THE APISERVER'S AUTHORIZER, NOT A jq PREDICATE.

           A requester may read their OWN tickets and no others, and Kubernetes RBAC has no way to
           say "mine" — so acmp's filing controller mints a per-ticket Role granting `get` on that
           one ticket by `resourceNames`, bound to the requester. `tickets-open` loses list/watch
           entirely; tenant-admin and org-admin hold `tickets-read-all` (get/list/watch).

           Declaring a userAccessFilter is what switches this dial from the caller's token to
           snowplow's ServiceAccount: snowplow lists the namespace once with its own credential,
           then re-evaluates RBAC per item as the caller and drops what the caller may not read.
           Without it this step dials as the requester, who cannot list, and the whole queue 403s.

           `verb: get` AND NOT `list`, which is the part that fails silently if it is wrong. The
           refilter passes the per-object name only for a name-scoped verb (snowplow#123); with
           `list` no name is threaded, so a resourceNames-scoped grant matches nothing and EVERY
           ticket is dropped — the page returns empty with no error, indistinguishable from a quiet
           desk. snowplow's end-to-end test covers that case specifically.

           namespaceFrom is explicit and verified rather than defaulted: the apiserver populates
           `metadata.namespace` on every item of a namespaced list (checked on krateo-057 —
           304 of 304 ConfigMaps in one namespace carry it), contrary to the comment this change
           corrects below. */}}
      userAccessFilter:
        verb: get
        group: servicedesk.krateo.io
        resource: tickets
        nameFrom: .metadata.name
        namespaceFrom: .metadata.namespace
      continueOnError: true
      errorKey: ticketsError
  filter: |
    def slug: (. // "") | ascii_downcase | gsub(" "; "-");
    # One leg now, so rows and counts are both derived from it. `// []` here is a GUARD on a step
    # result, not a default in a path: the step is absent from the dict when it failed under
    # continueOnError, and an absent key must render an empty queue rather than a jq error.
    ((.tickets.items) // []) as $all
    | $all as $items
    # A REFUSED READ MUST NOT RENDER AS A QUIET DESK. `continueOnError` plus the `// []` guard
    # above turned every failure into an empty queue: a 403, a 404 on an install with no Ticket
    # CRD, and a desk with nothing in it all drew the same empty table with no error anywhere.
    # That was already a defect; the per-ticket RBAC model makes it the DEFAULT failure, because
    # every misconfigured grant now produces exactly that shape. `denied` and `readError` follow
    # reviews-page/platform-reviews, which draws the same distinction for the same reason.
    | ((.ticketsError // "") | tostring) as $err
    | {
        failed: ($err != ""),
        denied: ($err | test("403|forbidden"; "i")),
        absent: ($err | test("404|not found|could not find"; "i")),
        readError: $err,
        rows: ($items | map({
          name: (.metadata.name // ""),
          # The chart namespace, not `.metadata.namespace` — and NOT because the field is absent.
          # The previous comment here said a namespaced list omits it per item; that is false. The
          # apiserver populates `metadata.namespace` on every item (checked on krateo-057: 304 of
          # 304 ConfigMaps in a single-namespace list carry it), which is also what makes the
          # userAccessFilter's namespaceFrom above correct. The literal is used because this leg
          # lists exactly one namespace, so the two are equal by construction and the literal says
          # so. WHEN THIS BECOMES MULTI-NAMESPACE for the CMP reshape, read `.metadata.namespace`
          # here — the field is there, and the old comment would have sent someone looking for a
          # workaround that is not needed.
          namespace: "{{ $.Values.namespace }}",
          summary: (.spec.summary // ""),
          state: (.spec.state // "Open"),
          stateKey: (.spec.state | slug),
          kind: (.spec.kind // ""),
          requester: (.spec.requester // ""),
          # ONLY when this install works tickets (deskActions). An absent assignee is then a FACT
          # about the ticket rather than a missing value — the queue's most important row — and reads
          # as "Unassigned". Where tickets are worked elsewhere the field is not emitted at all,
          # because "Unassigned" would be unactionable AND can be false while an external agent
          # has it.
{{- if $.Values.deskActions }}
          assignee: (.spec.assignee // "Unassigned"),
          assigned: ((.spec.assignee // "") != ""),
{{- end }}
          age: (.metadata.creationTimestamp // ""),
          urgency: (.spec.urgency // ""),
        }) | sort_by(.age) | reverse),
        counts: ($all
          | map(.spec.state // "Open")
          | group_by(.)
          | map({ key: (.[0] | slug), value: length })
          | from_entries),
        total: ($all | length),
      }
