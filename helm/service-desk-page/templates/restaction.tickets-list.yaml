{{/* /service-desk data source — one row per Ticket, shaped server-side.

     rows       : summary, state, requester, assignee, age, and the kind; filtered by the ?state= chip.
     counts     : per-state totals over EVERY ticket, plus `all`, for the chips' live counts.
     state      : the selected chip, echoed ("all" when none is asked for), and `stateValid`.
     emptyTitle/emptyText : the sentence the page draws in place of the table when `rows` is empty.
     askHref    : the "Ask Agentiko →" link, a prompt about the view the person is looking at.

     THE FILTER IS A jq `select` OVER THE ONE READ, NOT A LABEL SELECTOR. The Ticket CRD mirrors
     `spec.state` and `spec.assignee` into `krateo.io/ticket-state` and `krateo.io/ticket-assignee`
     because the apiserver field-selects on `metadata.name` and `metadata.namespace` only, and an
     earlier version of this file asked the apiserver for one state's tickets by that label. That
     leg is gone (see the step's comment): the counts already need every ticket, so the filtered
     list is a subset of rows in hand, and a second request for it was a second request for data
     this read already returned. The chips (listy.service-desk-state-chips) and the table read this
     same RESTAction with the same keyExtras, so they cannot disagree.

     WHAT THIS STILL CANNOT DO, so nobody discovers it later: no full-text search of a description,
     no sort by an arbitrary field, and the one read lists the namespace (a count is a count of
     everything, and there is no aggregate API). At service-desk volumes that is fine. At thousands
     of tickets that read is the first thing that hurts, and the answer then is a real database,
     not a cleverer jq.

     The jq runs in snowplow, as the caller, not in the browser — so a ticket the caller may not read
     is never shaped, never counted and never sent. The filtering is not a presentation convenience;
     it is where the data stops. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: tickets-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{/* ONE read, with a literal path. An earlier version of this file had a second, state-filtered
         leg whose path was a `${ … }` expression carrying a jq default:

             path: ${ "…/tickets?labelSelector=krateo.io%2Fticket-state%3D"
                      + ((.state // "open") | …) }

         `scripts/lint-ra-paths.py` rejects a `//` inside a path expression, and it is right to: on
         snowplow's Phase-1 walk the request extras are nil, so the default turns "no state asked
         for" into a real query and the step dials it on every prewarm. The lint's docstring records
         what that cost on 057 — one pod making hundreds of defaulted GETs in 20 minutes, every one
         hidden by continueOnError.

         The fix is not to gate that leg, it is that THE LEG WAS NEVER NEEDED. This leg already
         lists every ticket in the namespace, so the filtered leg could only ever return a subset of
         rows this one already has — a second request for data in hand. So the ?state= chip is a jq
         `select` in the filter below, over these rows: one request, no expression in any path, and
         nothing to dial at prewarm.

         This leg lists the namespace, deliberately and knowingly — see the header comment. It is the
         read here that does not scale, and now it is the only one, so when it has to become a paged
         walk there is exactly one place to change. */}}
    - name: tickets
      path: /apis/servicedesk.krateo.io/v1alpha1/namespaces/{{ $.Values.namespace }}/tickets
      verb: GET
      {{/* THE BOUNDARY IS THE APISERVER'S AUTHORIZER, NOT A jq PREDICATE.

           A requester may read their OWN tickets and no others, and Kubernetes RBAC has no way to
           say "mine" — so acmp's filing controller mints a per-ticket Role granting `get` on that
           one ticket by `resourceNames`, bound to the requester. `tickets-open` loses list/watch
           entirely; tenant-admin and org-admin hold `tickets-read-all` (get/list/watch).

           Declaring a userAccessFilter is what switches this dial from the caller's token to
           snowplow's ServiceAccount: snowplow lists the namespace once with its own credential,
           then re-evaluates RBAC per item as the caller and drops what the caller may not read.
           Without it this step dials as the requester, who cannot list, and the whole queue 403s.

           `verb: get` AND NOT `list`, which is the part that fails silently if it is wrong. The
           refilter passes the per-object name only for a name-scoped verb (snowplow#123); with
           `list` no name is threaded, so a resourceNames-scoped grant matches nothing and EVERY
           ticket is dropped — the page returns empty with no error, indistinguishable from a quiet
           desk. snowplow's end-to-end test covers that case specifically.

           namespaceFrom is explicit and verified rather than defaulted: the apiserver populates
           `metadata.namespace` on every item of a namespaced list (checked on krateo-057 —
           304 of 304 ConfigMaps in one namespace carry it), contrary to the comment this change
           corrects below. */}}
      userAccessFilter:
        verb: get
        group: servicedesk.krateo.io
        resource: tickets
        nameFrom: .metadata.name
        namespaceFrom: .metadata.namespace
      continueOnError: true
      errorKey: ticketsError
  filter: |
    def slug: (. // "") | ascii_downcase | gsub(" "; "-");
    # The five Ticket states (crd.tickets.yaml, spec.state) in queue order: the slug that ?state=
    # and the chips use, the label the table and the chips show, and the noun a sentence says.
    def states: [
      { key: "open", label: "Open", noun: "open tickets", active: true },
      { key: "in-progress", label: "In progress", noun: "tickets in progress", active: true },
      { key: "waiting-on-requester", label: "Waiting on requester", noun: "tickets waiting on the requester", active: true },
      { key: "resolved", label: "Resolved", noun: "resolved tickets", active: false },
      { key: "closed", label: "Closed", noun: "closed tickets", active: false } ];
    # WHAT ?state= MAY BE, checked the way audit-page checks ?auditOutcome= (okOutcome): one of the
    # five slugs, or `all`. Anything else selects nothing and the page SAYS so (emptyTitle below),
    # rather than drawing an empty table with no chip active, which reads as an empty state.
    def okState: . == "all" or IN(states[].key);
    def cap($n): if length > $n then (.[0:($n - 1)] + "…") else . end;
    def n($k; $one; $many): ($k | tostring) + " " + (if $k == 1 then $one else $many end);
    # One ticket in a prompt: its summary, then its urgency and the day it was raised. The DAY, not
    # an age: this string is cached with the widget, and "3 days old" would go on saying 3 days.
    def item: "\"" + (.summary | cap(110)) + "\""
      + ([ (if .urgency != "" then .urgency else empty end), (if .age != "" then ("raised " + .age[0:10]) else empty end) ]
         | if length > 0 then " (" + join(", ") + ")" else "" end);
    # The first eight, numbered — the cap the error digest's prompt uses.
    def numbered: .[0:8] | to_entries | map(((.key + 1) | tostring) + ". " + (.value | item)) | join(" ");
    {{ if $.Values.deskActions }}true{{ else }}false{{ end }} as $desk
    # One leg now, so rows and counts are both derived from it. `// []` here is a GUARD on a step
    # result, not a default in a path: the step is absent from the dict when it failed under
    # continueOnError, and an absent key must render an empty queue rather than a jq error.
    | ((.tickets.items) // []) as $all
    # A REFUSED READ MUST NOT RENDER AS A QUIET DESK. `continueOnError` plus the `// []` guard
    # above turned every failure into an empty queue: a 403, a 404 on an install with no Ticket
    # CRD, and a desk with nothing in it all drew the same empty table with no error anywhere.
    # That was already a defect; the per-ticket RBAC model makes it the DEFAULT failure, because
    # every misconfigured grant now produces exactly that shape. `denied` and `readError` follow
    # reviews-page/platform-reviews, which draws the same distinction for the same reason.
    | ((.ticketsError // "") | tostring) as $err
    | ($err != "") as $failed
    | ((.state // "") | tostring | ascii_downcase | if . == "" then "all" else . end) as $sel
    | ($sel | okState) as $valid
    | ([ states[] | select(.key == $sel) ] | .[0]) as $st
    | ($all | map({
          name: (.metadata.name // ""),
          # The chart namespace, not `.metadata.namespace` — and NOT because the field is absent.
          # The previous comment here said a namespaced list omits it per item; that is false. The
          # apiserver populates `metadata.namespace` on every item (checked on krateo-057: 304 of
          # 304 ConfigMaps in a single-namespace list carry it), which is also what makes the
          # userAccessFilter's namespaceFrom above correct. The literal is used because this leg
          # lists exactly one namespace, so the two are equal by construction and the literal says
          # so. WHEN THIS BECOMES MULTI-NAMESPACE for the CMP reshape, read `.metadata.namespace`
          # here — the field is there, and the old comment would have sent someone looking for a
          # workaround that is not needed.
          namespace: "{{ $.Values.namespace }}",
          summary: (.spec.summary // ""),
          state: (.spec.state // "Open"),
          # The same default as `state` and `counts`: a ticket with no state is Open everywhere.
          # `(.spec.state | slug)` made it "" here while the pill and the count said Open, so the
          # Open chip would not have shown it.
          stateKey: ((.spec.state // "Open") | slug),
          kind: (.spec.kind // ""),
          requester: (.spec.requester // ""),
          # ONLY when this install works tickets (deskActions). An absent assignee is then a FACT
          # about the ticket rather than a missing value — the queue's most important row — and reads
          # as "Unassigned". Where tickets are worked elsewhere the field is not emitted at all,
          # because "Unassigned" would be unactionable AND can be false while an external agent
          # has it.
{{- if $.Values.deskActions }}
          assignee: (.spec.assignee // "Unassigned"),
          assigned: ((.spec.assignee // "") != ""),
{{- end }}
          age: (.metadata.creationTimestamp // ""),
          urgency: (.spec.urgency // ""),
        }) | sort_by(.age) | reverse) as $rows
    | (if $sel == "all" then $rows elif $valid then [ $rows[] | select(.stateKey == $sel) ] else [] end) as $shown
    | ({ all: ($rows | length) } + (states | map(.key as $k | { key: $k, value: ([ $rows[] | select(.stateKey == $k) ] | length) }) | from_entries)) as $counts
    | ([ states[] | select(.active) | .key ]) as $activeKeys
    | ([ $rows[] | select(.stateKey | IN($activeKeys[])) ]) as $live
    | ([ $live[] | select(.assigned == false) ] | length) as $unassigned
    | ($counts.all) as $total
    # THE PROMPT DESCRIBES THE VIEW THE PERSON IS LOOKING AT: with a chip selected it is about that
    # chip's tickets, and the link keeps ?state= so the page behind the rail is the same page. A
    # ?state= that is not a state selected nothing, so the prompt is about the whole queue and the
    # link drops it.
    | (if $failed then
         "The service-desk queue could not be read (" + ($err | cap(300)) + "). Explain what that error means and what an administrator has to fix."
       elif $total == 0 then
         (if $desk then "The service-desk queue is empty: no one has raised a ticket on this platform yet."
          else "I have not raised any service-desk tickets." end)
         + " Explain what the service desk on this platform can be asked for, and what a good request includes."
       elif $desk then
         (if $sel == "all" or ($valid | not) then
            ([ $rows[] | select(.stateKey == "open") ] | reverse) as $oldest
            | "Triage the service-desk queue: " + n($total; "ticket"; "tickets") + " — "
              + ($counts.open | tostring) + " open, " + ($counts["in-progress"] | tostring) + " in progress, "
              + ($counts["waiting-on-requester"] | tostring) + " waiting on the requester, "
              + ($unassigned | tostring) + " unassigned."
              + (if ($oldest | length) == 0 then ""
                 elif ($oldest | length) == 1 then " The oldest open one is: " + ($oldest | numbered) + "."
                 else " The oldest open ones are: " + ($oldest | numbered) + "." end)
              + " Tell me which to pick up first and why, and what the desk should do next for each — grounded in the evidence on this page."
          elif ($shown | length) == 0 then
            "The service-desk queue has no " + $st.noun + "; its " + n($total; "ticket is"; "tickets are") + " in other states. Tell me whether anything in the queue needs the desk's attention — grounded in the evidence on this page."
          elif $st.active then
            ([ $shown[] | select(.assigned == false) ] | length) as $u
            | "Triage the " + $st.noun + " in the service-desk queue: " + ($shown | length | tostring) + " of " + n($total; "ticket"; "tickets")
              + ", " + ($u | tostring) + " unassigned. "
              + (if ($shown | length) == 1 then "It is: " else "The oldest are: " end) + ($shown | reverse | numbered) + "."
              + " Tell me which to pick up first and why, and what the desk should do next for each — grounded in the evidence on this page."
          else
            "Review the " + $st.noun + " in the service-desk queue: " + ($shown | length | tostring) + " of " + n($total; "ticket"; "tickets") + ". "
              + (if ($shown | length) == 1 then "It is: " else "The most recently raised are: " end) + ($shown | numbered) + "."
              + " Tell me whether any was " + ($st.label | ascii_downcase) + " without what was asked actually being done, and whether any should be reopened — grounded in the evidence on this page."
          end)
       else
         (if $sel == "all" or ($valid | not) or ($shown | length) == 0 then
            (if $sel != "all" and $valid then "I have no " + $st.noun + ". " else "" end)
            + "Go through the tickets I have raised (" + ($total | tostring) + "; " + ($live | length | tostring) + " still open): what is happening with each, and does any need something from me?"
          else
            "Go through the " + $st.noun + " I have raised (" + ($shown | length | tostring) + " of my " + ($total | tostring) + "): what is happening with each, and does any need something from me?"
          end)
       end) as $prompt
    | {
        failed: $failed,
        denied: ($err | test("403|forbidden"; "i")),
        absent: ($err | test("404|not found|could not find"; "i")),
        readError: $err,
        rows: $shown,
        counts: $counts,
        total: $total,
        state: $sel,
        stateValid: $valid,
        # The sentence the page draws INSTEAD of the table when `rows` is empty — never on a failed
        # read, where the header already says what happened and "no one has raised a ticket" would
        # be a claim about a queue nobody managed to read. Worded per case, because the next step
        # differs: nothing to do, choose All, or fix the address.
        emptyTitle: (if $failed or ($shown | length) > 0 then ""
                     elif ($valid | not) then "That is not a ticket state"
                     elif $total == 0 then (if $desk then "No one has raised a ticket yet." else "You have not raised a ticket yet." end)
                     else "No ticket is " + $st.label + "." end),
        emptyText: (if $failed or ($shown | length) > 0 then ""
                    elif ($valid | not) then "The state in this page's address is not one a ticket can be in. Choose a state above, or All to see every ticket."
                    elif $total == 0 then (if $desk then "When someone raises a request on this platform, it appears here with its state and who is working on it."
                                           else "When you raise a request, it appears here with its state and what is happening with it." end)
                    elif $total == 1 then "1 ticket is in another state. Choose All to see it."
                    else ($total | tostring) + " tickets are in other states. Choose All to see them." end),
        # "Ask Agentiko →" (button.service-desk-ask-agentiko): this page's own route, with the
        # chip kept, and an ?ask seed the rail consumes on mount. Built here, @uri-encoded, so the
        # Button is a plain literal navigate.
        askHref: ("/service-desk?" + (if $valid and $sel != "all" then "state=" + $sel + "&" else "" end) + "ask=" + ($prompt | @uri)),
      }
