{{/* The queue's chips: Active · All · New · Open · Pending · On-hold · Solved · Closed · Mine, built
     as incidents-page builds its status chips: one data-driven Listy(chip) whose state is URL state.
     Each chip navigates to /service-desk?state=<key>, which reaches zendesk-requests as an extra.

     ACTIVE IS THE DEFAULT (no ?state=), and hides Solved and Closed: what still needs a person is
     what the page opens on. All is one click away. The six status chips are Zendesk's statuses,
     worded verbatim; a request not yet in Zendesk has no status and appears under Active and All
     only. Mine is every request the caller raised (the raised-by label), whatever its status.

     A FIXED SET, not one chip per status that occurs: a status with no requests shows 0 rather than
     vanishing, so the row does not change shape as the queue moves. The chips, their counts, routes
     and which is selected all come from zendesk-requests (`.chips`); this widget only draws them. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: service-desk-state-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* `state` drives the active flag; the identity drives Mine's count. */}}
  keyExtras: [state]
  identityContext:
    - username
  apiRef:
    name: zendesk-requests
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ .chips // [] }'
  resourcesRefs:
    items: []
