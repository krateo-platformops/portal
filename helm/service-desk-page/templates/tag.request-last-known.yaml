{{/* "Last known", beside the status pill when Zendesk can't be reached for this request
     (Ready=Unknown, reason ObserveFailed) and the status shown is the last one the portal read.
     Static: the page root draws it only when zendesk-request says `lastKnown`. Gray, because it
     qualifies the status rather than being one. */}}
kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: request-last-known
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  widgetData:
    label: Last known
    color: gray
  resourcesRefs:
    items: []
