{{/* The /service-desk/{namespace}/{name} header: the request's subject as the title, its Zendesk
     number as the one line of context ("No Zendesk number yet" before the provider has filed it),
     and "Ask Agentiko →".

     NO "OPEN IN ZENDESK" AND NO OTHER ACTION. The requester Zendesk records is the organisation's
     support account, so a person following status.html_url would land on a page their own Zendesk
     login cannot open; the portal is the window onto the request (Diego, 2026-11-13). No edit and no
     delete either: every spec field but krateo_reference is create-only, and deleting a
     ZendeskRequest never touches Zendesk, so neither would do what its label says.

     THE STATUS PILL IS NOT IN THIS HEADER, and that is a schema fact rather than a layout choice.
     PageHeader draws its own pills from `widgetData.tags`, whose `color` is an ENUM — blue,
     darkBlue, orange, gray, red, green, violet — and the status vocabulary needs slate, gold and
     faint. snowplow validates RESOLVED widgetData against the CRD, so a templated colour would
     refuse the whole header. The Tag WIDGET takes any palette name, so the pill is a Tag directly
     under this header (flex.request-detail-pills.yaml) — the same StatusPill component. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: request-detail-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: zendesk-request
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Request
    allowedResources:
    - buttons
    items:
    - resourceRefId: request-ask-agentiko
  widgetDataTemplate:
    - forPath: title
      expression: '${ .title // "Request" }'
    - forPath: subtitle
      expression: '${ .subtitle // "" }'
  resourcesRefs:
    items:
    - id: request-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: request-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
