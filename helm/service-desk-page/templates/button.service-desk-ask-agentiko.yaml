{{/* "Ask Agentiko →" on the queue — the assistant entry point for the requests the person is looking
     at. It navigates to THIS page with an ?ask seed the rail consumes on mount, keeping the ?state=
     chip, so the conversation starts on the same view.

     THE LABEL AND THE ROLE ARE FIXED (A4): every agent entry point is a button labelled exactly
     `Ask Agentiko →` with `intent: agentiko`; `type` and `icon` are ignored, so they are not set.
     Being filled does not take the header's one primary: "Raise a request" keeps it (P6).

     The href is built server-side (zendesk-requests `.askHref`, @uri-encoded) from the rows the
     queue already read, and asks what an error means instead of describing a queue nobody managed
     to read. The click is a plain literal navigate. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: service-desk-ask-agentiko
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The prompt differs per chip, and "Mine" per person. */}}
  keyExtras: [state]
  identityContext:
    - username
  apiRef:
    name: zendesk-requests
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /service-desk
  widgetDataTemplate:
    {{/* Falls back to the queue — never a 404 — if askHref is empty, which zendesk-requests never
         makes it, but a render with no data does. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.askHref // "") != "" then .askHref else "/service-desk" end) } ] } }'
  resourcesRefs:
    items: []
