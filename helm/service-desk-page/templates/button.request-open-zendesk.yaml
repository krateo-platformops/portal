{{/* "Open in Zendesk ↗" — the request's end-user page in Zendesk (status.html_url, zendesk-kog
     0.2.1), in a new tab. Mounted only when zendesk-request has an https url for it. The frontend's
     navigate action opens an absolute http(s) address in a new tab (navigateOrExternal), as
     compositions-page's button.composition-detail-access-open does.

     status.url is an API address and is never used here. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: request-open-zendesk
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: zendesk-request
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Open in Zendesk ↗
    type: primary
    size: middle
    clickActionId: open
    actions:
      navigate:
        - id: open
          type: navigate
          path: /service-desk
  widgetDataTemplate:
    - forPath: actions
      expression: '${ { navigate: [ { id: "open", type: "navigate", path: (if (.url // "") != "" then .url else "/service-desk" end) } ] } }'
  resourcesRefs:
    items: []
