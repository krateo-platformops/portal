{{/* Page root for /service-desk/new: the header, then the one form.

     THIS ROOT AND ITS TWO CHILDREN LIVE IN `raiseNamespace`, NOT the queue's namespace, and that
     is the whole point of the second namespace: the namespace IS the RBAC boundary, and the people
     who raise tickets are not the desk that works them. Requesters are bound here and nowhere
     else, so they can read this screen and cannot list the queue. See values.yaml and
     namespace.yaml. The TICKET the form writes still goes to the QUEUE's namespace — only the
     screen lives here; form.ticket-new.yaml says why that works.

     THIS ROOT CARRIES A NAV-LABEL, UNLIKE EVERY OTHER SUB-ROUTE IN THIS REPO, AND THAT IS THE POINT.

     The convention for a create sub-route is to carry only its path: it then routes without earning
     a second sidebar entry, and the page it belongs to links to it with a Button. That is what
     page-alert-create does at /alerts/new, and this file followed it at first.

     It does not work here, because of the namespace split. The portal lists the page roots THE
     CALLER may `list` and shows the ones carrying a label, so a requester's sidebar is built only
     from `raiseNamespace`. The one link to this screen — the queue's "Raise a ticket" Button — lives
     in `namespace`, which requesters cannot read. No label plus no readable link is no way in: the
     screen would have shipped reachable only by someone typing the URL. Moving the Button does not
     help either, because a requester cannot read the queue page at all, wherever the Button sits.

     So the label is the entry point, not a convenience. The cost is accepted and worth stating: the
     DESK reads both namespaces, so the desk sees two sidebar entries — "Service desk" and "Raise a
     ticket" — for what they think of as one feature. That is cosmetic. An unreachable screen is not.
     nav-order 41 puts it directly after the queue's 40 for the readers who see both.

     Being an entry, it carries an icon like every other labelled root: without one it rendered as
     a bare text row among the iconed ones. `fa-ticket` (Font Awesome free-solid, which the
     frontend registers whole) reads as "a ticket" beside the queue's `fa-headset`.

     The queue's Button stays. It is the right affordance where the desk actually works, and the
     approved design put it there deliberately; it is simply not the requester's route in.

     allowedResources lists the child plurals. The released Flex CRD no longer declares an enum
     there (the per-widget enums drifted and enforced nothing), so a missing plural is now caught
     by the chart containment lint rather than by the apiserver — list them anyway: the lint is
     the thing that checks it.

     THE FORM IS A DIRECT CHILD, not wrapped in a Card the way /alerts/new wraps its form. That is
     the approved mockup — a header and one form — and `forms` is a listed Flex child. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-ticket-new
  namespace: {{ $.Values.raiseNamespace }}
  annotations:
    "krateo.io/nav-group": "Platform"
    "krateo.io/nav-icon": "fa-ticket"
    "krateo.io/nav-label": "Raise a ticket"
    "krateo.io/nav-order": "41"
    "krateo.io/nav-path": "/service-desk/new"
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - forms
    vertical: true
    {{/* P9: page-root section rhythm is one step, `middle`, across every nav-declared root. */}}
    gap: middle
    items:
    - resourceRefId: ticket-new-header
    - resourceRefId: ticket-new-form
  resourcesRefs:
    {{/* Both children are widgets this chart SHIPS, so they are a location: they name the
         namespace the screen lives in, which for this screen is raiseNamespace. */}}
    items:
    - id: ticket-new-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-new-header
      namespace: {{ $.Values.raiseNamespace }}
      resource: pageheaders
      verb: GET
    - id: ticket-new-form
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-new
      namespace: {{ $.Values.raiseNamespace }}
      resource: forms
      verb: GET
