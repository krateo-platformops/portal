{{/* What the queue says when there is no request to show, drawn by the page root IN PLACE OF the
     table, because the Table hard-codes "No rows".

     The sentence is zendesk-requests' `emptyTitle`/`emptyText`, worded per case — no request at all,
     none active, none of mine, none in the selected status, a ?state= that is not one — because what
     to do next differs. The chips stay above it, all at their counts, so the person can see that the
     read worked. It is never drawn on a failed read: result.service-desk-unavailable is. */}}
kind: Result
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: service-desk-empty
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [state]
  identityContext:
    - username
  apiRef:
    name: zendesk-requests
    namespace: {{ $.Values.namespace }}
  widgetData:
    status: info
    title: No Zendesk requests yet.
  widgetDataTemplate:
    - forPath: title
      expression: '${ if (.emptyTitle // "") != "" then .emptyTitle else "No Zendesk requests yet." end }'
    - forPath: subTitle
      expression: '${ .emptyText // "" }'
  resourcesRefs:
    items: []
