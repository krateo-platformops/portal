{{/* The /service-desk header: title, one line saying what the page is FOR, "Ask Agentiko →", and
     the one primary action, "Raise a request".

     "Raise a request" is the primary: this page's primary action is a human one. "Ask Agentiko →"
     sits immediately left of it and does not take that slot (P6). The portal puts it on every data
     page, and the queue is something to reason about (what is waiting, what is stuck).

     ITEMS ARE TEMPLATED for one case only: a cluster that does not serve the ZendeskRequest kind has
     nothing to raise, so the header keeps "Ask Agentiko →" and drops "Raise a request". Without a
     configuration the button stays, and the raise page says why (the decided design: the person
     lands there and reads the reason instead of finding the button missing). `.showRaise == false`
     and not `.showRaise // true`: jq's `//` replaces false as well as null, so the default would
     have kept the button on exactly the cluster it is meant to leave.

     The failure states are said in the content area (result.service-desk-unavailable), not with a
     red tag here as the Ticket page did: one sentence where the queue would be, said once. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: service-desk-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [state]
  identityContext:
    - username
  apiRef:
    name: zendesk-requests
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Service desk
    {{/* `subtitle`, not `description`: the PageHeader CRD has no `description`, and an undeclared
         key is pruned by the apiserver without error. */}}
    subtitle: Requests filed with Zendesk for your organisation. Agents answer them in Zendesk.
    allowedResources:
    - buttons
    items:
    - resourceRefId: service-desk-ask-agentiko
    - resourceRefId: service-desk-raise
  widgetDataTemplate:
    - forPath: items
      expression: '${ [ { resourceRefId: "service-desk-ask-agentiko" } ] + (if .showRaise == false then [] else [ { resourceRefId: "service-desk-raise" } ] end) }'
  resourcesRefs:
    items:
    - id: service-desk-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: service-desk-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    - id: service-desk-raise
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: service-desk-raise
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
