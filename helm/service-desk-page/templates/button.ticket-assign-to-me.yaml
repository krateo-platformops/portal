{{/* "Assign to me" — one merge-PATCH of spec.assignee, with the caller's own token. The desk's
     Role grants `patch` on tickets in this namespace (rbac.page-readers.yaml).

     IT WRITES THE LABEL MIRROR TOO, in the same patch. The queue reads by label selector
     (restaction.tickets-list), because the apiserver can field-select only on metadata.name and
     metadata.namespace — so a spec.assignee written without `krateo.io/ticket-assignee` is an
     assignment the queue cannot see. One patch, both fields, so they cannot be written apart.

     THE PAYLOAD IS BUILT SERVER-SIDE, and it has to be: a Button has no submitted values, so
     `payloadToOverride` is skipped for it entirely (buildPayload applies overrides only when a
     customPayload exists, and only a Form supplies one). So the whole body comes from a
     widgetDataTemplate over ticket-detail's `assignPatch` — the same shape
     button.review-proposal-record uses.

     identityContext: [username] is what makes "me" a fact. The username is the JWT principal
     snowplow injects into this widget's resolve input; there is no username parameter, because one
     a browser could send would let anyone assign a ticket in anyone's name.

     IT APPENDS NO ACTIVITY ENTRY, deliberately. An entry needs a timestamp, and the only clock a
     Button can reach is the one that ran when the page was SERVED — which, on a cached page, is
     not when the click happened. A wrong time in the conversation is worse than no line in it; the
     reply Form can do this properly because its override resolves at submit time. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-assign-to-me
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  identityContext:
    - username
  apiRef:
    name: ticket-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Assign to me
    type: default
    icon: fa-user-check
    size: middle
    clickActionId: assign
    actions:
      rest:
        - id: assign
          type: rest
          resourceRefId: patch-ticket
          headers:
            - 'Content-Type: application/merge-patch+json'
          successMessage: Ticket assigned to you
          payload: {}
          loading:
            display: true
  widgetDataTemplate:
    {{/* Empty on the prewarm walk, where there is no caller — but the action Flex shows this
         button only when `canAssign`, which is false without one, so an empty patch is never
         reachable from the page. */}}
    - forPath: actions.rest[0].payload
      expression: '${ .assignPatch // {} }'
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    {{/* The target is named from the route params, not from a chart value: the ticket this page is
         about. A ref naming a non-widget resource in a page chart's own namespace is otherwise the
         shape scripts/lint-ref-namespace.py reports — and rightly, for a ref written in the
         template. Here the namespace comes from the route. */}}
    - template:
        id: patch-ticket
        apiVersion: ${ .ticketGvr.apiVersion }
        resource: ${ .ticketGvr.resource }
        name: ${ .ticketGvr.name }
        namespace: ${ .ticketGvr.namespace }
        verb: PATCH
