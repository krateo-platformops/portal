{{/* The /service-desk/new header: title and one line of context.

     Lives in `raiseNamespace` with the rest of this screen — requesters are bound there and not in
     the queue's namespace. See create-flex.page-ticket-new.yaml.

     NO ACTIONS. This is a create page — the only action is the submit, and it belongs to the form
     below. A header button would either duplicate it or submit a form the reader cannot see.

     `subtitle`, not `description`: the released PageHeader CRD declares title, counter,
     counterLabel, subtitle, tags, allowedResources and items, and the widget schemas are strict
     (no x-kubernetes-preserve-unknown-fields), so a key it does not declare is pruned on apply
     rather than rendered.

     It says what happens to the request rather than restating the title — a requester's first
     question after pressing the button is who sees this and when. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-new-header
  namespace: {{ $.Values.raiseNamespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Raise a ticket
    {{- if $.Values.deskActions }}
    subtitle: >-
      The desk picks this up from the queue. You will be told the ticket's name when it is raised.
    {{- else }}
    {{/* No desk and no queue in this install — see values.yaml deskActions. Naming either promises
         the reader something they cannot see. */}}
    subtitle: >-
      Your request is sent to support. You will be told the ticket's name when it is raised.
    {{- end }}
  resourcesRefs:
    items: []
