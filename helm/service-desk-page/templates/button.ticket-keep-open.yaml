{{- if $.Values.deskActions }}
{{/* The resolve proposal's two answers, under the ticket's conversation: Resolve (the header's own
     ticket-resolve Button, the same patch) and Keep open.

     The proposal itself is an entry in the conversation, derived by ticket-detail when the linked
     incident is Resolved by its checks (see `$externalActs` there). A Listy's row actions apply to
     every row alike, so the two answers cannot sit on that one row; they sit directly under the
     list, shown only while the proposal is. Resolve is this container's one primary.

     Only where the desk works tickets in this portal (deskActions): elsewhere the entry shows its
     text and no buttons, as the approved design says. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-resolve-proposal-actions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    vertical: false
    gap: small
    align: center
    allowedResources:
    - buttons
    items:
    - resourceRefId: ticket-resolve
    - resourceRefId: ticket-keep-open
  resourcesRefs:
    items:
    - id: ticket-resolve
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-resolve
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
    - id: ticket-keep-open
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-keep-open
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
---
{{/* "Keep open" — the desk declines the resolve proposal. A merge-PATCH of one label,
     `krateo.io/resolve-proposal: kept`, with the caller's own token; ticket-detail stops deriving
     the proposal for a ticket carrying it.

     A LABEL, NOT AN ACTIVITY ENTRY. The reply form owns spec.activity and patches the array whole,
     so a button appending to it would race every reply. The decision is therefore not written into
     the conversation; whether it should be is an open question in the design note, not settled here.

     Not destructive and not final (removing the label brings the proposal back), so no
     confirmation, as for Resolve. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-keep-open
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: ticket-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Keep open
    type: default
    size: middle
    clickActionId: keep-open
    actions:
      rest:
        - id: keep-open
          type: rest
          resourceRefId: patch-ticket
          headers:
            - 'Content-Type: application/merge-patch+json'
          successMessage: Ticket kept open
          payload: {}
          loading:
            display: true
  widgetDataTemplate:
    - forPath: actions.rest[0].payload
      expression: '${ .keepOpenPatch // {} }'
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: patch-ticket
        apiVersion: ${ .ticketGvr.apiVersion }
        resource: ${ .ticketGvr.resource }
        name: ${ .ticketGvr.name }
        namespace: ${ .ticketGvr.namespace }
        verb: PATCH
{{- end }}
