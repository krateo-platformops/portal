{{/* The referenced object's conditions, in Kubernetes' own words.

     `Synced=False`, `Ready=True` — the condition type and status, verbatim, as one label. Not
     "Out of sync", not "Healthy": the reader is looking at a Kubernetes object, these are the
     words it uses about itself, and every other tool they will reach for next (kubectl, the
     object's own events) uses the same ones.

     `tag` CELLS AND NOT THE TABLE'S `conditions` CELL KIND. That kind takes an array of
     {type,status} and colours it for you — cyan for True, crimson for False — and cyan is not an
     available choice here: it is the healthy accent, and the status-pill spec bans a status colour
     that marks something healthy (frontend#587 tracks the same class). A `tag` cell carries its
     own `color`, so the colour is this page's decision:

       True  on a positive type   faint   RECEDE — the absence of a problem is not news
       False on a positive type   red     the exception, and the only thing meant to catch an eye
       Unknown / absent           gold    not knowing is its own state

     Polarity is not declared anywhere in Kubernetes, so a short list of negative-polarity types is
     inverted by hand in the RESTAction — which says why that list cannot be complete.

     The colours are palette NAMES resolved per theme by getColorCode, never hex: `faint` has a
     different value in each theme, and a hex would be right in one of them. */}}
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-object-conditions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: ticket-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    {{/* Shrink columns to the card rather than growing a horizontal scrollbar inside it. Unset is
         NOT neutral — it sets scroll.x: max-content, so omitting this chooses the scrollbar. */}}
    fitContent: true
    allowedResources: []
    bordered: false
    size: small
    columns:
    - valueKey: condition
      title: Condition
    - valueKey: reason
      title: Reason
    - valueKey: since
      title: Since
    dataSource: []
  widgetDataTemplate:
  {{/* No rowNavigateTo: a condition is not a place. The object's own page is not reachable from
       here either — this page knows the ref's GVK, not which portal route (if any) renders it. */}}
  - forPath: dataSource
    expression: '${ [ (.conditionRows // [])[] | [ {valueKey:"condition",kind:"tag",stringValue:(.label // ""),color:(.color // "gold")}, {valueKey:"reason",kind:"jsonSchemaType",type:"string",stringValue:(.reason // "")}, {valueKey:"since",kind:"jsonSchemaType",type:"string",stringValue:(.since // ""),format:"relative"} ] ] }'
  resourcesRefs:
    items: []
