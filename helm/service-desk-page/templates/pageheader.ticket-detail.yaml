{{/* The /service-desk/{namespace}/{name} header: the ticket's summary as the title, the ticket id
     as its one line of context, and the desk's three actions.

     THE STATE PILL IS NOT HERE, and that is a schema fact rather than a layout choice. PageHeader
     draws its own pills from `widgetData.tags`, whose `color` is an ENUM — blue, darkBlue, orange,
     gray, red, green, violet — and the ticket vocabulary needs `slate`, `gold` and `faint`, none of
     which are in it. snowplow validates RESOLVED widgetData against the CRD (the Marketplace
     install form records the same lesson for a payloadToOverride value), so injecting the colour
     through a widgetDataTemplate would not slip past it either: it would refuse the whole header.
     The Tag WIDGET takes any palette name, so the pill is a Tag directly under this header
     (tag.ticket-state.yaml) — the same StatusPill component PageHeader would have drawn, so the
     two cannot look different.

     The summary is the title and the id is the subtitle, each said ONCE: the subtitle must not
     restate the title, and a ticket's summary is the only sentence on the page that identifies it
     to a person. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-detail-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: ticket-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Ticket
    allowedResources:
    - flexes
    items:
    - resourceRefId: ticket-detail-actions
  widgetDataTemplate:
    - forPath: title
      expression: '${ .title // "Ticket" }'
    - forPath: subtitle
      expression: '${ .subtitle // "" }'
  resourcesRefs:
    items:
    - id: ticket-detail-actions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-detail-actions
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
