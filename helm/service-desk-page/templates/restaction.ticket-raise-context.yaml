{{/* The raise form's context — what /service-desk/new knows before the person types anything.

     ONE CASE TODAY: A TICKET RAISED FROM AN INCIDENT. The incident page links here with the incident
     in the query string (`/service-desk/new?incidentName=<name>&incidentNamespace=<ns>`, built by
     incidents-page's restaction.incident-detail as `raiseHref`), and the frontend forwards every query
     parameter into the request extras. This RESTAction reads that Incident AS THE CALLER and shapes
     what the form needs to raise a ticket about it: the summary and detail it is pre-filled with, the
     objectRef that points the ticket at the Incident, and the label the incident page finds it by.
     Without those two parameters nothing is dialled and the form is the plain raise form it always
     was.

     THE PARAMETERS ARE A CLIENT'S CLAIM, AND THAT IS SAFE HERE FOR ONE REASON: the read is the
     caller's own. No userAccessFilter and no endpointRef, so the step dials with the person's token
     and the apiserver decides whether they may read that Incident. A URL edited to name someone
     else's incident gets a 403, and the form says it could not read it rather than pre-filling from
     it. snowplow splices each value as ONE path segment (snowplow#1123), so neither can walk the
     path somewhere else.

     THE LABEL IS THE INCIDENT'S UID, NOT ITS NAME. An Incident is named `<alert name>-<yyyymmdd-hhmmss>`
     (incident-provider docs/api.md, Identity) and an alert name may be 63 characters, so an incident
     name reaches 79 — and a label VALUE stops at 63. A name label would make the create fail for
     exactly the incidents with long alert names. The uid is 36 characters, unique across namespaces,
     and names this incident and not a later one that reuses the name. The objectRef carries the
     readable name and namespace; the label is only for the incident page's label selector.

     WHAT THE DETAIL SAYS, AND WHAT IT LEAVES OUT. The detail is curated from the incident's own
     fields, as the approved mockup (frame E) draws it: the incident and when it opened, the root cause
     (statement, confidence, category), the owner verdict and each piece of evidence as `kind: ref`.
     It carries no log line, no excerpt, no script and no reasoning trace. It is ONE LINE because the
     raise form has no multi-line control (form.ticket-new.yaml says why) and the ticket page renders
     the detail as a Paragraph, where line breaks collapse anyway. An <input> would also strip the
     line breaks the moment the person edited the text, gluing two sentences together. The person
     reads and may edit all of it before raising the ticket.

     The output carries no `username` key, deliberately: the form declares identityContext and reads
     the injected `.username` from the resolve input, which snowplow folds in UNDER this RESTAction's
     result (mergeExtras, the result wins on a collision). A `username` here would shadow the
     authenticated principal. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: ticket-raise-context
  namespace: {{ $.Values.raiseNamespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    {{/* Gated on both parameters (scripts/lint-ra-paths.py): on snowplow's prewarm walk, and on every
         plain visit to /service-desk/new, the iterator is empty and nothing is dialled. */}}
    - name: incident
      dependsOn:
        name: ""
        iterator: '[ { namespace: (.incidentNamespace // ""), name: (.incidentName // "") } | select((.name | type) == "string" and (.namespace | type) == "string" and .name != "" and .namespace != "") ]'
      path: ${ "/apis/observability.krateo.io/v1alpha1/namespaces/" + .namespace + "/incidents/" + .name }
      verb: GET
      continueOnError: true
      errorKey: incidentError
  {{/* Literal `|` block: the filter carries `#` comments, which a folded block would join into one
       line and so comment out the rest of the program. */}}
  filter: |
    # fromdateiso8601 takes `...SSZ` only: drop a fractional part and fold a +00:00 offset to Z.
    def epoch: (if type == "string" then (sub("\\.[0-9]+"; "") | sub("(\\+00:?00)$"; "Z")) else "" end) | (fromdateiso8601? // null);
    # An absolute time: the form is cached until its inputs change.
    def stamp: (. // "") as $s | ($s | epoch) as $t
      | if $t == null then ($s | tostring | .[0:10]) else ($t | strftime("%Y-%m-%d %H:%M UTC")) end;
    def cap($n): if length > $n then (.[0:($n - 1)] + "…") else . end;
    # One line: the detail field is an <input>, which strips line breaks without replacing them.
    def oneline: gsub("[\\r\\n\\t]+"; " ") | gsub("  +"; " ") | sub("^ +"; "") | sub(" +$"; "");
    def sentence: if test("[.!?]$") then . else . + "." end;
    def str: if type == "string" then . else "" end;
    (.incidentName | str) as $askedName
    | (.incidentNamespace | str) as $askedNs
    # The Incident, only when the read came back AND is the one asked for, with the uid the label needs.
    | ((.incident // {}) | if type == "object" and ((.metadata.name // "") == $askedName) and $askedName != ""
                              and ((.metadata.uid // "") | str) != "" then . else null end) as $inc
    | ($inc != null) as $from
    | (if $from then $inc.metadata.namespace // $askedNs else "" end) as $ns
    | (if $from then $inc.metadata.name else "" end) as $n
    | (if $from then ($inc.status // {}) else {} end) as $st
    | ($st.rootCause // {}) as $rc
    | (($rc.statement // "") | str | oneline) as $statement
    # owner and ownerEvidence (incident-provider 0.10.0). Absent on an older CRD, or before an analysis
    # assessed it: then the detail says nothing about an owner.
    | (($rc.owner // "") | str | if IN("customer", "krateo", "unknown") then . else "" end) as $owner
    | (($rc.ownerEvidence // []) | if type == "array" then . else [] end
       | map(select(type == "object" and ((.ref // "") | str) != ""))) as $evidence
    | ($inc.spec.triggeredAt // $inc.metadata.creationTimestamp // "") as $opened
    | (if $statement != "" then ($statement | (capture("^(?<s>.*?[.!?])(\\s|$)").s // .) | sub("[.]$"; ""))
       else ("Incident " + $n) end | cap(200)) as $summary
    | ("Incident " + $n + " in " + $ns + (if $opened != "" then (", opened " + ($opened | stamp)) else "" end) + "."
       + (if $statement != "" then
            (" Root cause (Agentiko"
             + (if (($rc.confidence // "") | tostring) != "" then (", confidence " + ($rc.confidence | tostring)) else "" end)
             + (if (($rc.category // "") | str) != "" then (", category " + $rc.category) else "" end)
             + "): " + ($statement | sentence))
          else " Root cause: not determined yet." end)
       + ({ customer: " Owner: your organization.", krateo: " Owner: Krateo.", unknown: " Owner: not determined." }[$owner] // "")
       + (if ($evidence | length) > 0 then
            (" Evidence: " + ($evidence | map(((.kind // "") | str | if . == "" then "" else . + ": " end) + (.ref | oneline)) | join("; ")) + ".")
          else "" end)
       | cap(8000)) as $detail
    # The incident was asked for and did not come back: say so, and raise a plain ticket instead.
    | ($askedName != "" and ($from | not)) as $unread
    | {
        fromIncident: $from,
        # Which of the form's two submit actions runs (form.ticket-new.yaml): the plain one, or the
        # one that writes the incident's objectRef and label.
        submitActionId: (if $from then "submit-incident" else "submit" end),
        notice: (if $from then ("From incident " + $n + " in " + $ns + ". The ticket goes to this portal's service desk ({{ $.Values.namespace }}); nothing leaves this cluster.")
                 elif $unread then ("Incident " + $askedName + (if $askedNs != "" then (" in " + $askedNs) else "" end) + " could not be read, so this form is not filled in from it. It may be gone, or you may not have access to it.")
                 else "" end),
        initialValues: (if $from then { summary: $summary, detail: $detail } else {} end),
        # What the incident decides: the request kind (something is broken) and the object (the
        # Incident). Hidden fields are neither rendered, validated nor submitted.
        hide: (if $from then ["kind", "objectName"] else [] end),
        cancelTo: (if $from then ("/incidents/" + $ns + "/" + $n) else "/service-desk" end),
        incidentRef: (if $from then { apiVersion: "observability.krateo.io/v1alpha1", kind: "Incident", name: $n, namespace: $ns } else {} end),
        incidentUid: (if $from then $inc.metadata.uid else "" end),
        incidentRoute: (if $from then ("/incidents/" + $ns + "/" + $n) else "" end)
      }
