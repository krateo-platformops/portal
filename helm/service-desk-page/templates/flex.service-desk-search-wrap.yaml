{{/* A one-item Flex around the search, because a Row takes no `inputs` (as
     flex.marketplace-search-wrap). The search fills it, up to the Input's own cap. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: service-desk-search-wrap
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [state, range, view, q]
  widgetData:
    allowedResources:
    - inputs
    items:
    - resourceRefId: service-desk-search
  resourcesRefs:
    items:
    - id: service-desk-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: service-desk-search
      namespace: {{ $.Values.namespace }}
      resource: inputs
      verb: GET
