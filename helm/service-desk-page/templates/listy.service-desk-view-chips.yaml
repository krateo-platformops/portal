{{/* "Cards | Table · all columns", top right of the requests card: the same requests as cards
     or as the table (?view=table). Each route keeps ?state and ?range. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: service-desk-view-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [state, range, view]
  identityContext:
    - username
  apiRef:
    name: zendesk-requests
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .viewChips // [] }'
  resourcesRefs:
    items: []
