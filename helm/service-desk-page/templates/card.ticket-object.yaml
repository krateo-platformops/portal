{{/* "The object it is about" — shown only when the ticket names one (spec.objectRef), which the
     page root gates on `sections.object`.

     Two children: the ref's identity (name / kind / apiVersion / namespace), and the object's LIVE
     conditions as read from the apiserver a moment ago. That second read is the reason this card
     exists: a ticket saying "the payments composition is broken" is worth much less than the same
     ticket next to `Synced=False` on the object itself.

     The conditions table renders only when there ARE conditions. When there are none, `headerLeft`
     says why in words — cluster-scoped and not read, unreadable or gone, or an object that simply
     declares none — because an antd Empty reading "No data" is indistinguishable from a bug. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: ticket-object-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: ticket-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: The object it is about
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - descriptions
    - tables
    items:
    - resourceRefId: ticket-object-meta
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ [ { resourceRefId: "ticket-object-meta" } ]
        + (if ((.sections // {}).conditions // false) then [ { resourceRefId: "ticket-object-conditions" } ] else [] end) }
    - forPath: headerLeft
      expression: '${ .conditionsNote // "" }'
  resourcesRefs:
    items:
    - id: ticket-object-meta
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-object-meta
      namespace: {{ $.Values.namespace }}
      resource: descriptions
      verb: GET
    - id: ticket-object-conditions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: ticket-object-conditions
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
