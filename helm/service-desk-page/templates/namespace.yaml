{{/* The namespace is the RBAC boundary this chart exists for — see values.yaml and
     rbac.page-readers.yaml. It holds the page objects AND the tickets, which is why changing
     `namespace` after install is worse here than for a page-only chart: it orphans people's
     tickets, not just widgets, and Helm will not prune them because it no longer renders them. */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    "krateo.io/page-namespace": "true"
