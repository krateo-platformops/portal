{{/* ONE namespace, for the pages. It is the RBAC boundary for who sees /service-desk at all — see
     rbac.page-readers.yaml.

     There used to be two. The Ticket desk had two audiences, the requesters who raised tickets and
     the desk that worked them, and `resourceNames` does not apply to `list`, so the raise screen
     lived in a second namespace (`raiseNamespace`) that requesters could read without seeing the
     queue. Zendesk dissolves that split: the queue lists the requests THE CALLER may list, so a
     requester who opens it sees their own organisation's requests and nobody else's. The raise
     screen is an ordinary sub-route of the queue again. Helm deletes the old raise namespace on
     upgrade, with the three widgets in it; it held no data.

     NO ZENDESK REQUEST LIVES HERE. Each is created in its organisation's own namespace, beside the
     ZendeskRequestConfiguration that carries the organisation's token (form.request-new.yaml). */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
    # STILL KEPT, although no new data lands here. This namespace holds every Ticket filed before the
    # service desk moved to Zendesk. The Ticket CRD is no longer rendered, and its own `keep` left it
    # (and those Tickets) in the cluster when this chart stopped shipping it. Deleting a namespace
    # deletes everything in it whatever any CRD says, so dropping `keep` here would let the next
    # uninstall — which happens on every component version bump — take those Tickets with it.
    # Retention follows the data, and the data is still here.
    helm.sh/resource-policy: keep
  labels:
    "krateo.io/page-namespace": "true"
