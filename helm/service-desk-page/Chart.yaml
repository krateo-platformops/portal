apiVersion: v2
name: service-desk-page
description: The Krateo Composable Portal /service-desk pages, which file and track Zendesk requests (zendesk-kog ZendeskRequest), as their own chart in their own namespace
type: application
version: CHART_VERSION
appVersion: CHART_VERSION
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - portal
  - pages
  - service-desk
sources:
  - https://github.com/krateo-platformops/portal
annotations:
  krateo.io/category: application
  krateo.io/maturity: alpha
  krateoSupportedVersion: ">= 2.5.1"
  # The first frontend-crds that admits what this chart ships: Listy itemTemplate.highlight (frontend 1.8.93), the computed tile border of service-desk-stats, whose colour is now `color` straight from the data (no map). Before it, Form textareas (request-new).
  # Installer's check-chart-requires-floors refuses a pin below it; lint-pinned-crds checks it still holds.
  krateo.io/requires-frontend-crd: ">= 1.8.FRONTEND_CHARTS"
