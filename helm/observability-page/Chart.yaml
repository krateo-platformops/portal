apiVersion: v2
name: observability-page
description: The Krateo Composable Portal /observability pages, as their own chart in their own namespace
type: application
version: CHART_VERSION
appVersion: CHART_VERSION
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - portal
  - pages
  - observability
sources:
  - https://github.com/krateo-platformops/portal
annotations:
  krateo.io/category: application
  krateo.io/maturity: stable
  krateoSupportedVersion: ">= 2.5.1"
  # The first frontend-crds that admits what this chart ships: the Table `span` cell kind, the cell fields
  # offsetPercent, widthPercent, indent and secondaryText, and the column rulerStart/rulerEnd
  # (trace-detail-spans, the waterfall; frontend feat/table-span-cell). PLACEHOLDER until that frontend is
  # released: replace 1.8.FRONTEND_CHARTS with its version. Before it: FlowChart direction (1.8.35).
  # Installer's check-chart-requires-floors refuses a pin below it; lint-pinned-crds checks it still holds.
  krateo.io/requires-frontend-crd: ">= 1.8.FRONTEND_CHARTS"
