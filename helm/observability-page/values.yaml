# @schema
# description: The namespace this chart CREATES and installs its page objects into. It is the RBAC boundary the chart exists for — a group with no RoleBinding here cannot `list` the page roots, so the portal sidebar never shows them and the page body 403s on a deep link. The release itself stays wherever the composition is created; only the page objects live here.
# type: string
# default: "krateo-observability"
# @schema
namespace: krateo-observability

# @schema
# description: Groups granted read of these pages in `namespace`. A group listed here sees /observability in the sidebar and can open it; a group absent cannot list the page roots, so the entry never renders. `devs` is deliberately NOT a default — keeping it out is the point of the split (#261).
# type: array
# @schema
readerGroups:
  - admins

# @schema
# description: Optional URL of the external observability console. When set, a "View in console" link appears; empty hides it.
# type: string
# default: ""
# @schema
observabilityConsoleUrl: ""

# @schema
# description: The snowplow SLI sub-page. 74 of this chart's templates are gated on it and render nothing when it is off, which is the default.
# type: object
# @schema
observability:
  snowplowSli: false
