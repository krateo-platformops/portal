{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Dependency records held, per bucket: the `records` stat of sp-dep-marks, drawn apart from the dirty marks
     (sp-dep-marks) in the same card, one unit per axis (charts mockup, CHART-4; Diego, 2026-11-26). Unsmoothed,
     the bucket holding now partial (the RESTAction's `current`, from feat/chart-time-slots; absent, nothing is). */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-dep-records
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: Dep records
    xField: t
    yField: v
    colorField: series
    slotField: slot
    colorMap:
      "Dep records": teal
    area: false
    legend: false
    height: 150
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
        title: records
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ (.current // null) as $cur | [ (.rows // [])[] | select((.stat|tostring) == "records") | { t: (.t|tonumber), series: "Dep records", v: (.v|tonumber) } | . + (if .t == $cur then { slot: "partial" } else {} end) ] }'
  apiRef:
    name: sp-dep-marks
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
