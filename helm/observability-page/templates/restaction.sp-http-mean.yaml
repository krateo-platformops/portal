{{- if (.Values.observability | default dict).snowplowSli }}
{{/* VERIFIED against live ClickHouse on krateo-057 before it was written — see portal#201. */}}
{{/* Mean request duration per route per time bucket, from snowplow's cumulative */}}
{{/* http.server.request.duration histogram. Each series (service.instance.id = the pod, */}}
{{/* Attributes = method/status/route/..., StartTimeUnix = the process) contributes its */}}
{{/* POINT-TO-POINT increments (exported every 60 s), each in the bucket of its later point; a */}}
{{/* series' first point counts from 0 only when the series started inside the window, else it */}}
{{/* has no predecessor here and is dropped. It used to take max-min per (bucket, route), which */}}
{{/* mixed every method/status series of a route and both pods across a restart: on krateo-057 */}}
{{/* over 24h with one restart it read 2603073 /call requests at 61 ms; per series, 5651 at 6.7 ms */}}
{{/* (sampled server spans: 8.7 ms). No clamp: within one series a counter cannot fall, and a */}}
{{/* negative increment must show, not be hidden (none on 057). */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: sp-http-mean
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: q
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then "1%20HOUR" elif $r=="6h" then "6%20HOUR" elif $r=="24h" then "24%20HOUR" elif $r=="7d" then "7%20DAY" else "24%20HOUR" end) as $iv | (if $r=="1h" then "2%20MINUTE" elif $r=="6h" then "15%20MINUTE" elif $r=="24h" then "1%20HOUR" elif $r=="7d" then "6%20HOUR" else "1%20HOUR" end) as $bk | "/?query=" + "SELECT%20t%2C%20route%2C%20round%28sd%20%2F%20nullIf%28cd%2C%200%29%2C%204%29%20AS%20mean_s%20FROM%20%28%20SELECT%20toUnixTimestamp%28toStartOfInterval%28TimeUnix%2C%20INTERVAL%20" + $bk + "%29%29%20AS%20t%2C%20route%2C%20sum%28ds%29%20AS%20sd%2C%20sum%28dc%29%20AS%20cd%20FROM%20%28%20SELECT%20TimeUnix%2C%20Attributes%5B%27http.route%27%5D%20AS%20route%2C%20if%28row_number%28%29%20OVER%20w%20%3D%201%2C%20if%28StartTimeUnix%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%2C%20Sum%2C%20NULL%29%2C%20Sum%20-%20lagInFrame%28Sum%29%20OVER%20w%29%20AS%20ds%2C%20if%28row_number%28%29%20OVER%20w%20%3D%201%2C%20if%28StartTimeUnix%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%2C%20toInt64%28Count%29%2C%20NULL%29%2C%20toInt64%28Count%29%20-%20lagInFrame%28toInt64%28Count%29%29%20OVER%20w%29%20AS%20dc%20FROM%20otel_metrics_histogram%20WHERE%20ServiceName%3D%27snowplow%27%20AND%20MetricName%3D%27http.server.request.duration%27%20AND%20TimeUnix%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%20AND%20Attributes%5B%27http.route%27%5D%20%21%3D%20%27%2Frefreshes%27%20WINDOW%20w%20AS%20%28PARTITION%20BY%20ResourceAttributes%5B%27service.instance.id%27%5D%2C%20toString%28Attributes%29%2C%20StartTimeUnix%20ORDER%20BY%20TimeUnix%20ROWS%20BETWEEN%201%20PRECEDING%20AND%20CURRENT%20ROW%29%20%29%20GROUP%20BY%20t%2C%20route%20%29%20WHERE%20cd%20%3E%200%20ORDER%20BY%20t%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: qError
  filter: >
    { rows: ((.q.data) // []), failed: ((.qError // null) != null) }
{{- end }}
