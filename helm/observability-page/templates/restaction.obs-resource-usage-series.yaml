{{/* Cluster resource-usage TIME SERIES from ClickHouse (clickstack otel_metrics_gauge — the */}}
{{/* k8s cluster/kubelet receiver). The companion obs-resource-usage RA is a LIVE 5-min snapshot */}}
{{/* (top pods, one point); this one is the trend over the selected ?range window, bucketed, for */}}
{{/* the LineChart (R2 #15). Two cluster totals per bucket: CPU cores and Memory GiB. */}}
{{/* */}}
{{/* Shape mirrors obs-reconcile-metrics: the query is bucketed SERVER-SIDE (toStartOfInterval), */}}
{{/* so the charts just map series -> {t,v}. A gauge is a POINT SAMPLE, and each bucket's cluster */}}
{{/* total is the MEAN OF THE TOTALS AT EACH SAMPLE: per minute (one scrape round: kubeletstats */}}
{{/* collects every 60 s on every node, observability's otel-collector-daemonset) each pod's value */}}
{{/* (averaged, should a round land twice in a minute), summed across pods, then averaged over the */}}
{{/* bucket's minutes. It used to average each pod over the WHOLE bucket and sum those averages, so */}}
{{/* a pod replaced inside the bucket counted twice, the old pod's average beside the new one's: */}}
{{/* the 10:00 slot of the audit held an installer roll and read ~10 cores beside a 5.3-core figure */}}
{{/* (charts mockup, CHART-4). The snapshot (obs-resource-usage) counts each pod's latest value, */}}
{{/* which a per-sample total agrees with. CPU in cores, Memory in GiB, each its own chart. The */}}
{{/* window starts on a bucket boundary (toStartOfInterval(now() - range, bucket)), so the first */}}
{{/* bucket is whole; `current` is the bucket holding now, still filling. `ts` is UNIX seconds. */}}
{{/* */}}
{{/* Bucket width scales with the window (~24-60 points): 1h→2m, 6h→15m, 24h→1h, 7d→6h. Default */}}
{{/* 24h (R2 #10 — matches the range chips / dashboard). External-fetch endpointRef, FORMAT JSON. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: obs-resource-usage-series
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: usage
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then {iv:"1%20HOUR",bk:"2%20MINUTE"} elif $r=="6h" then {iv:"6%20HOUR",bk:"15%20MINUTE"} elif $r=="7d" then {iv:"7%20DAY",bk:"6%20HOUR"} else {iv:"24%20HOUR",bk:"1%20HOUR"} end) as $w | "/?query=SELECT%20toUnixTimestamp%28t%29%20AS%20ts%2C%20round%28avgIf%28v%2C%20m%3D%27cpu%27%29%2C%202%29%20AS%20cpu_cores%2C%20round%28avgIf%28v%2C%20m%3D%27mem%27%29%2F1073741824%2C%202%29%20AS%20mem_gib%20FROM%20%28%20SELECT%20t%2C%20s%2C%20m%2C%20sum%28v%29%20AS%20v%20FROM%20%28%20SELECT%20toStartOfInterval%28TimeUnix%2C%20INTERVAL%20" + $w.bk + "%29%20AS%20t%2C%20toStartOfMinute%28TimeUnix%29%20AS%20s%2C%20ResourceAttributes%5B%27k8s.namespace.name%27%5D%20AS%20ns%2C%20ResourceAttributes%5B%27k8s.pod.name%27%5D%20AS%20pod%2C%20multiIf%28MetricName%3D%27k8s.pod.cpu.usage%27%2C%27cpu%27%2C%27mem%27%29%20AS%20m%2C%20avg%28Value%29%20AS%20v%20FROM%20otel_metrics_gauge%20WHERE%20MetricName%20IN%20%28%27k8s.pod.cpu.usage%27%2C%27k8s.pod.memory.working_set%27%29%20AND%20TimeUnix%20%3E%3D%20toStartOfInterval%28now%28%29%20-%20INTERVAL%20" + $w.iv + "%2C%20INTERVAL%20" + $w.bk + "%29%20GROUP%20BY%20t%2C%20s%2C%20ns%2C%20pod%2C%20m%20%29%20GROUP%20BY%20t%2C%20s%2C%20m%20%29%20GROUP%20BY%20ts%20ORDER%20BY%20ts%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: usageError
  {{/* usage => {data:[{ts,cpu_cores,mem_gib}]}. Two LineCharts, CPU and Memory, one series each. */}}
  filter: >
    { series: ((.usage.data) // []),
      current: (({ "1h": 120, "6h": 900, "24h": 3600, "7d": 21600 }[(.range // "24h") | tostring] // 3600) as $bk | ((now / $bk | floor) * $bk)) }
