{{/* The /observability page header — title, subtitle, "Ask Agentiko →" and the optional console deep-link. */}}
{{/* */}}
{{/* Replaces SIX: row.obs-header-row, flex.obs-header, flex.obs-header-actions, */}}
{{/* paragraph.obs-eyebrow, paragraph.obs-title and paragraph.obs-subtitle. The Button stays — it */}}
{{/* carries the action; PageHeader only places it. */}}
{{/* */}}
{{/* THE CONDITIONAL Row/Col GRID GOES WITH THEM, and on this page that grid was doing real work: */}}
# obs-header-row sized its title column `{{ if .Values.observabilityConsoleUrl }}16{{ else }}24{{ end }}`
{{/* so the header reflowed to full width when the deep-link was absent. That is a column split */}}
{{/* recomputed from a values flag — two layouts to keep in step, and a wrong branch is invisible */}}
{{/* until someone installs with the other setting. PageHeader right-aligns whatever actions it has */}}
{{/* and fills the width when it has none, so the arithmetic disappears rather than moving. */}}
{{/* */}}
{{/* THE EYEBROW IS GONE, and that is a deletion rather than a regression: Paragraph.tsx already */}}
{{/* returns null for `variant: eyebrow`, so "Platform · tenant …" has been rendering as nothing. */}}
{{/* */}}
{{/* "Ask Agentiko →" is the page's ONE agent entry point (button.observability-ask-agentiko), and it */}}
{{/* is always there, so `allowedResources` and `items` are no longer inside the console-URL */}}
{{/* condition. It sits first, LEFT of "View in console" when that exists; neither is the primary. */}}
{{/* */}}
{{/* The console link keeps its guard: the SAME `.Values.observabilityConsoleUrl` condition wraps */}}
{{/* button.obs-console-link itself — that Button CR does not exist on installs without a console */}}
{{/* URL, so referencing it unconditionally would leave a dangling resourceRefId, which renders as */}}
{{/* silence (a Flex/Card drops a missing child with only a console message). X13 cannot catch this */}}
{{/* one: both sides are behind the same helm conditional. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: observability-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Observability
    subtitle: >-
      Platform health — reconciliation, performance, logs and resource usage; alerts and
      investigations live on Incidents
    allowedResources:
    - buttons
    items:
    - resourceRefId: observability-ask-agentiko
{{- if .Values.observabilityConsoleUrl }}
    - resourceRefId: obs-console-link
{{- end }}
  resourcesRefs:
    items:
    - id: observability-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: observability-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
{{- if .Values.observabilityConsoleUrl }}
    - id: obs-console-link
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-console-link
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
{{- end }}
