{{/* Caption of the Traces tab (installer#404). */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-sec-traces-desc
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the Traces tab's chips put these in the URL. */}}
  keyExtras: [projects, range, tab, traceService, traceUser, traceStatus]
  widgetData:
    text: "Newest spans first: the latest 200 in the time range, 25 a page. Click a row to open its trace."
    type: secondary
  resourcesRefs:
    items: []
