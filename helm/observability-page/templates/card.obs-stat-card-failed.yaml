kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-stat-card-failed
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: outlined
    clickActionId: view-failed
    widgetActions:
      navigate:
        - id: view-failed
          type: navigate
          path: /compositions?status=failed
    items:
    {{/* The page's OWN Statistic. It borrowed the dashboard's until #261 moved that object */}}
    {{/* into krateo-dashboard, leaving this ref pointing at a namespace that defines it */}}
    {{/* nowhere -- and a group with /observability but not /dashboard could not read it */}}
    {{/* there anyway. Same shape as obs-stat-pending and obs-stat-total. */}}
    - resourceRefId: obs-stat-failed
  resourcesRefs:
    items:
    - id: obs-stat-failed
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-stat-failed
      namespace: {{ $.Values.namespace }}
      resource: statistics
      verb: GET
