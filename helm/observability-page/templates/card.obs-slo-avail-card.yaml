kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-slo-avail-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: 'Availability · target ≥ 99.9 %'
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - rows
    items:
    - resourceRefId: obs-slo-avail-row
  widgetDataTemplate:
  - forPath: title
    expression: '${ .availTitle // "Availability · target ≥ 99.9 %" }'
  apiRef:
    name: obs-slo
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items:
    - id: obs-slo-avail-row
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-slo-avail-row
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
