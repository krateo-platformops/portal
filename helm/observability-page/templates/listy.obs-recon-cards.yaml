{{/* One card per composition in the picked state, the first 24: attention first (triage order), then
     overdue, then pending, then healthy. The name, its state as a coloured tag (the /compositions cards'
     colours), its kind, what is wrong in the controller's words, and the reconcile health in the foot:
     when it last reconciled and its p95 over the trace window, or "no reconcile in the trace window";
     without reconcile traces, when it was created. A clock top right marks an overdue composition. The
     whole card opens the composition. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-recon-cards
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-reconciliation
    namespace: {{ $.Values.namespace }}
  widgetData:
    grid:
      gutter: 12
      column: 1
    split: false
    pagination:
      pageSize: 8
    itemTemplate:
      rowVariant: card
      icon: fa-cubes
      iconVariant: tile
      primaryText: '{name}'
      secondaryText: '{stateLabel}'
      subPrimaryText: '{kind}'
      subSecondaryText: '{foot}'
      description: '{description}'
      cardCta: Open composition
      navigateTo: '/compositions/{ns}/{name}'
      color:
        value: '{tone}'
        map:
          failed: red
          degraded: red
          unreadable: orange
          drift: orange
          paused: gray
          pending: blue
          healthy: green
        default: gray
      status:
        icon: '{statusIcon}'
        color: '{statusColor}'
        tooltip: '{statusTooltip}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .rows // [] }'
  resourcesRefs:
    items: []
