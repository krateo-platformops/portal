{{/* GUARDED by observability.reconcileTracing, matching the Reconciliation tab (col.obs-tab-reconciliation, flex.obs-recon-side), which wraps */}}
{{/* both the items entry and the resourcesRefs entry that reach this CR. Without the guard here */}}
{{/* the CR rendered, applied and reconciled on every install while nothing could ever reach it. */}}
{{- if (.Values.observability | default dict).reconcileTracing }}
{{/* Live reconcile throughput — the composition-dynamic-controller's `reconcile` trace spans, */}}
{{/* bucketed 10-min, straight from ClickHouse (otel_traces) via restaction.obs-reconcile-metrics. */}}
{{/* `t` is UNIX epoch seconds (the widget localizes the axis label to the browser TZ). */}}
{{/* EVERY SLOT of the window is drawn (charts mockup, CHART-1): the query returns a row only for a */}}
{{/* slot that stored spans, so the template walks window.from..window.current and writes a slot */}}
{{/* with no row, or with no spans, as {v: null, slot: "missing"} (a break in the line over a */}}
{{/* "No data" band, never a zero); 0 reconciles among spans is a measured zero. The slot that */}}
{{/* holds now is slot: "partial" (a dashed end, "so far"). A failed read draws nothing. */}}
{{/* Unsmoothed and without a point per slot: 145 slots at 24h are a line, not dots. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-reconcile-throughput
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "20"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    xField: t
    yField: v
    colorField: series
    slotField: slot
    colorMap:
      reconciles: cyan
    legend: false
    height: 160
    xTimeUnit: hour
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
        title: reconciles
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ (.window // {}) as $w | (reduce (.series // [])[] as $r ({}; .[($r.ts | tonumber | tostring)] = $r)) as $at | if (.failed // false) or (($w.step // 0) <= 0) then [] else [ range($w.from; $w.current + 1; $w.step) as $t | $at[$t | tostring] as $r | if $r == null or (($r.spans // 0) | tonumber) == 0 then { t: $t, series: "reconciles", v: null, slot: "missing" } else { t: $t, series: "reconciles", v: ($r.reconciles | tonumber) } + (if $t == $w.current then { slot: "partial" } else {} end) end ] end }'
  apiRef:
    name: obs-reconcile-metrics
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
