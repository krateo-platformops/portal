{{/* Every span of the trace (installer#404), in start order as obs-trace-detail returns them, as a */}}
{{/* WATERFALL (approved charts mockup 2026-11-25, visual audit OBS-4): it used to be a table of */}}
{{/* offsets and durations, which says nothing about where the time went. */}}
{{/* */}}
{{/* Span: the span's name, its service as the second line, indented one level per span above it */}}
{{/* (parentId -> spanId; a span whose parent is not in the trace is a root, as the header finds it). */}}
{{/* Timeline: a bar that starts where the span starts and is as long as it lasts, on the trace's */}}
{{/* own scale: offset = (start - first start) / length, width = duration / length, length = last */}}
{{/* end - first start, the same length the header shows, written at the ruler's end ("0 … 5.81 s"). */}}
{{/* The duration is written after the bar, so there is no Duration column. Both come from the */}}
{{/* exporter's own clock (start in microseconds, duration in nanoseconds). Only an Error span's bar */}}
{{/* is red; every other bar is gray. Two clocks (a browser span before the server's) are drawn as */}}
{{/* recorded. */}}
{{/* */}}
{{/* Status says which span failed and how: the span's HTTP status code where its producer */}}
{{/* recorded one (obs-trace-detail reads all three keys), then "error" when the span's OTel */}}
{{/* StatusCode is Error — "403 · error" on the span that failed, "403" on the spans that only */}}
{{/* carried the answer back with StatusCode Unset, "—" where there is neither. Only an Error */}}
{{/* span is a red tag; every other row is plain text, so the failure is the one thing in the */}}
{{/* column that stands out. */}}
{{/* */}}
{{/* WHY IT FAILED, on hover and on keyboard focus: an Error span's red tag carries the span's OTel */}}
{{/* StatusMessage (obs-trace-detail's `message`, already cut to 1000 characters) as its tooltip. */}}
{{/* Only that tag: a span with no message gets no tooltip, and a span that is not Error gets none */}}
{{/* even if its producer wrote one. `tooltip` needs frontend-crds >= 1.8.38 (frontend #681); the */}}
{{/* `span` cell kind, `offsetPercent`, `widthPercent`, `indent`, `secondaryText` and the column's */}}
{{/* `rulerStart`/`rulerEnd` need the frontend's feat/table-span-cell. */}}
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: trace-detail-spans
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the route param. */}}
  keyExtras: [traceId]
  apiRef:
    name: obs-trace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    fitContent: true
    allowedResources: []
    bordered: false
    size: middle
    pagination:
      pageSize: 50
      hideOnSinglePage: true
    columns:
    - valueKey: span
      title: Span
    - valueKey: timeline
      title: Timeline
      minWidth: 240
    - valueKey: status
      title: Status
    dataSource: []
  widgetDataTemplate:
  - forPath: columns
    expression: '${ {{ include "obs.traces.format" . }} (.spans // []) as $s | [ {valueKey:"span",title:"Span"}, ({valueKey:"timeline",title:"Timeline",minWidth:240} + (if ($s | length) == 0 then {} else (([ $s[] | .startUs ] | min) as $t0 | ([ $s[] | .startUs + (.durationNs / 1000) ] | max) as $t1 | {rulerStart:"0", rulerEnd:((($t1 - $t0) * 1000) | traceDuration)}) end)), {valueKey:"status",title:"Status"} ] }'
  - forPath: dataSource
    expression: '${ {{ include "obs.traces.format" . }} def pct: (. * 100 | . * 100 | round / 100) | if . < 0 then 0 elif . > 100 then 100 else . end; (.spans // []) as $s | (([ $s[] | .startUs ] | min) // 0) as $t0 | (([ $s[] | .startUs + (.durationNs / 1000) ] | max) // 0) as $t1 | ($t1 - $t0) as $len | (reduce $s[] as $x ({}; .[$x.spanId] = $x.parentId)) as $par | [ $s[] | ([ limit(64; .spanId | recurse(($par[.] // "") | select(. != "" and $par[.] != null))) ] | length - 1) as $depth | (((if (.httpStatus // "") == "" then [] else [.httpStatus] end) + (if .status == "Error" then ["error"] else [] end)) | join(" · ")) as $st | (.durationNs | traceDuration) as $dur | [ ({valueKey:"span",kind:"jsonSchemaType",type:"string",stringValue:.span,secondaryText:(if .service == "" then "—" else .service end)} + (if $depth > 0 then {indent:$depth} else {} end)), {valueKey:"timeline",kind:"span",offsetPercent:(if $len > 0 then ((.startUs - $t0) / $len | pct) else 0 end),widthPercent:(if $len > 0 then ((.durationNs / 1000) / $len | pct) else 100 end),color:(if .status == "Error" then "red" else "gray" end),stringValue:$dur,tooltip:("starts at " + (((.startUs - $t0) * 1000) | traceDuration) + ", lasts " + $dur)}, (if .status == "Error" then {valueKey:"status",kind:"tag",stringValue:$st,color:"red"} + (if (.message // "") != "" then {tooltip:.message} else {} end) else {valueKey:"status",kind:"jsonSchemaType",type:"string",stringValue:(if $st == "" then "—" else $st end)} end) ] ] }'
  resourcesRefs:
    items: []
