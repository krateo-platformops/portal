{{- if (.Values.observability | default dict).snowplowSli }}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-card-dep-marks
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: Dirty-marks and dep records
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - linecharts
    items:
    - resourceRefId: sp-dep-marks
    - resourceRefId: sp-dep-records
  resourcesRefs:
    items:
      - id: sp-dep-marks
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-dep-marks
        namespace: {{ $.Values.namespace }}
        resource: linecharts
        verb: GET
      - id: sp-dep-records
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-dep-records
        namespace: {{ $.Values.namespace }}
        resource: linecharts
        verb: GET
{{- end }}
