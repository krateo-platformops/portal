{{/* The eight services with the most spans read, most first, each a bar against the first with its
     count and how many are in error (red then, blue otherwise). A row sets the Service filter
     (?traceService=), which reaches the SQL. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-traces-by-service
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "20"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-traces
    namespace: {{ $.Values.namespace }}
  widgetData:
    size: small
    split: false
    itemTemplate:
      primaryText: '{name}'
      navigateTo: '{route}'
      ellipsis: true
      bar:
        percent: '{percent}'
        label: '{count}'
        color:
          value: '{tone}'
          map:
            bad: red
            ok: blue
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .byService // [] }'
  resourcesRefs:
    items: []
