{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Dirty-marks issued, per bucket. The dependency records held are their own chart beside it in the same card
     (sp-dep-records, the same RESTAction): one unit per axis (charts mockup, CHART-4; Diego, 2026-11-26). */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-dep-marks
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: Dirty marks
    xField: t
    yField: v
    colorField: series
    colorMap:
      "Dirty marks": cyan
    shapeField: smooth
    area: false
    legend: false
    height: 150
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
        title: marks
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | select((.stat|tostring) == "dirty_mark_total") | { t: (.t|tonumber), series: "Dirty marks", v: (.v|tonumber) } ] }'
  apiRef:
    name: sp-dep-marks
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
