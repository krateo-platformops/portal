{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Dirty-marks issued and dependency records held. */}}
{{/* Series under plain names (visual audit CHART-4: "snowplow_cache_diagnostic_total" on a legend); the map is
     the SQL's raw series key to its name, and a key it does not know is drawn as itself. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-dep-marks
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    xField: t
    yField: v
    colorField: series
    slotField: slot
    colorMap:
      "Dirty marks": cyan
      "Dep records": teal
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ (.current // null) as $cur | [ (.rows // [])[] | { t: (.t|tonumber), series: ((.stat|tostring) as $k | {"dirty_mark_total": "Dirty marks", "records": "Dep records"}[$k] // $k), v: (.v|tonumber) } | . + (if .t == $cur then { slot: "partial" } else {} end) ] }'
  apiRef:
    name: sp-dep-marks
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
