{{/* Eyebrow label of the Traces tab's user filter (installer#404). "AI calls": only agentgateway */}}
{{/* spans carry jwt.sub (installer#398), so the filter can only find a user's calls through it. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-traces-user-label
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the Traces tab's chips put these in the URL. */}}
  keyExtras: [projects, range, tab, traceService, traceUser, traceStatus]
  widgetData:
    text: 'User (AI calls)'
    variant: eyebrow
  resourcesRefs:
    items: []
