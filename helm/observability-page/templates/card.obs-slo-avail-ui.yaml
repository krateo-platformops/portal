kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-slo-avail-ui
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: outlined
    allowedResources:
    - statistics
    - paragraphs
    items:
    - resourceRefId: obs-slo-avail-ui-value
    - resourceRefId: obs-slo-avail-ui-detail
  resourcesRefs:
    items:
    - id: obs-slo-avail-ui-value
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-slo-avail-ui-value
      namespace: {{ $.Values.namespace }}
      resource: statistics
      verb: GET
    - id: obs-slo-avail-ui-detail
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-slo-avail-ui-detail
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
