{{/* GUARDED by observability.reconcileTracing, matching the Reconciliation tab (col.obs-tab-reconciliation, flex.obs-recon-side), which wraps */}}
{{/* both the items entry and the resourcesRefs entry that reach this CR. Without the guard here */}}
{{/* the CR rendered, applied and reconciled on every install while nothing could ever reach it. */}}
{{- if (.Values.observability | default dict).reconcileTracing }}
{{/* Reconcile-latency percentile strip — p50 / p95 / p99 side by side (exact, trace-derived), */}}
{{/* at the top of "Reconcile time" (card.obs-phases-card), above the per-phase bars. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-perf-stat-row
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - statistics
    items:
    - resourceRefId: obs-perf-p50
      size: 8
    - resourceRefId: obs-perf-p95
      size: 8
    - resourceRefId: obs-perf-p99
      size: 8
  resourcesRefs:
    items:
    - id: obs-perf-p50
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-perf-p50
      namespace: {{ $.Values.namespace }}
      resource: statistics
      verb: GET
    - id: obs-perf-p95
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-perf-p95
      namespace: {{ $.Values.namespace }}
      resource: statistics
      verb: GET
    - id: obs-perf-p99
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-perf-p99
      namespace: {{ $.Values.namespace }}
      resource: statistics
      verb: GET
{{- end }}
