{{/* The row under the header: the time range on the left, the search on the right in a quarter of the
     row, as on /incidents (row.incidents-toolbar); stacked when narrow. Both sit above the tabs, so
     they scope every tab. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-toolbar
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - flexes
    alignment: middle
    items:
    - resourceRefId: obs-range-group
      size: 18
      xs: 24
      lg: 18
    - resourceRefId: obs-search-wrap
      size: 6
      xs: 24
      lg: 6
  resourcesRefs:
    items:
    - id: obs-range-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-range-group
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: obs-search-wrap
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-search-wrap
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
