kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-slo-avail-row
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - cards
    items:
    - resourceRefId: obs-slo-avail-api
      size: 12
    - resourceRefId: obs-slo-avail-ui
      size: 12
  resourcesRefs:
    items:
    - id: obs-slo-avail-api
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-slo-avail-api
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: obs-slo-avail-ui
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-slo-avail-ui
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
