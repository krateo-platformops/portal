{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Authorisation memo per bucket. */}}
{{/* Series under plain names (visual audit CHART-4: "snowplow_cache_diagnostic_total" on a legend); the map is
     the SQL's raw series key to its name, and a key it does not know is drawn as itself. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-authz-memo
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "Memo hits": green
      "Memo misses": orange
      "Uncached denials": red
    shapeField: smooth
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
        title: checks
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: ((.series|tostring) as $k | {"snowplow_authz_memo_hits": "Memo hits", "snowplow_authz_memo_misses": "Memo misses", "snowplow_authz_memo_deny_uncached_total": "Uncached denials"}[$k] // $k), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-authz-memo
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
