{{- if (.Values.observability | default dict).snowplowSli }}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-card-build-version
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: Running build
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - statistics
    items:
    - resourceRefId: sp-build-version
  resourcesRefs:
    items:
      - id: sp-build-version
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-build-version
        namespace: {{ $.Values.namespace }}
        resource: statistics
        verb: GET
{{- end }}
