{{/* Observability → Telemetry tab (the A4 dashboard layout), the platform's own logs and pods from the
     OTel → ClickHouse pipeline: the caption, the figures (error lines, distinct problems, services
     erroring, the window the logs were read over), then one row: the recurring errors on two thirds (one
     card per grouped error, or with ?view=table the chronological error & warning stream with its
     service filter and row limit), the charts on one third (errors by service, the resource-usage trend,
     the pods with the most memory). The page's range and search sit above the tabs. The reconcile
     performance group that used to open this tab (throughput, phases, p50/p95/p99, latency) moved to the
     Reconciliation tab, beside the compositions it measures. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-tab-telemetry
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - paragraphs
    - listies
    - rows
    items:
    - resourceRefId: obs-sec-logs-desc
    - resourceRefId: obs-tel-stats
    - resourceRefId: obs-tel-main
  resourcesRefs:
    items:
    - id: obs-sec-logs-desc
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-sec-logs-desc
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: obs-tel-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-tel-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: obs-tel-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-tel-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
