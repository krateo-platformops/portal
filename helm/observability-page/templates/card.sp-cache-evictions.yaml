{{- if (.Values.observability | default dict).snowplowSli }}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-card-cache-evictions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Cache evictions by route
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - linecharts
    items:
    - resourceRefId: sp-cache-evictions
  resourcesRefs:
    items:
      - id: sp-cache-evictions
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: sp-cache-evictions
        namespace: {{ $.Values.namespace }}
        resource: linecharts
        verb: GET
{{- end }}
