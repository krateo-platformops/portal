{{- if (.Values.observability | default dict).snowplowSli }}
{{/* p95 request duration per route over the window, from the cumulative histogram (last − first). /refreshes excluded. */}}
{{/* The RA answers in SECONDS (p95_s); the cell is that many ms through duration.label ("12 ms", "2.5 s"). */}}
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-http-p95
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  widgetData:
    allowedResources: []
    bordered: false
    size: small
    columns:
    - valueKey: route
      title: Route
    - valueKey: p95
      title: p95
    dataSource: []
  {{/* Audit fix: this emitted PLAIN OBJECTS ({reason, increase}) but the Table CRD's */}}
  {{/* dataSource is an array of ROWS, each row an array of CELL objects — the shape every */}}
  {{/* other table in this chart uses (see table.access-preview). snowplow rejected it with */}}
  {{/* "dataSource[0] in body must be of type array" and the card rendered as a red "Error */}}
  {{/* while rendering widget" result. It failed whenever the RA returned a row, which it */}}
  {{/* does — so the panel was an error card exactly when it had something to show. */}}
  widgetDataTemplate:
  - forPath: dataSource
    expression: >
      ${ {{ include "duration.label" . }} [ (.rows // [])[] | [
           {valueKey:"route",kind:"jsonSchemaType",type:"string",stringValue:(.route // "" | tostring)},
           {valueKey:"p95",kind:"jsonSchemaType",type:"string",stringValue:((.p95_s | tonumber? // null) | if . == null then null else . * 1000 end | durationLabel)}
         ] ] }
  apiRef:
    name: sp-http-p95
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
