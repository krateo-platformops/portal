{{/* Observability → Traces tab (installer#404, the A4 dashboard layout): the caption, the filter bar
     (service, user, and the HyperDX-internals note), the figures (spans, errors, services, users), then
     one row: the spans on two thirds (the status chips, then one card per span, or with ?view=table the
     span table), the charts on one third (by status, by service, the slowest spans). A span opens
     /observability/traces/{traceId}. The page's range and search sit above the tabs. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-tab-traces
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - paragraphs
    - flexes
    - listies
    - rows
    items:
    - resourceRefId: obs-sec-traces-desc
    - resourceRefId: obs-traces-filters
    - resourceRefId: obs-traces-stats
    - resourceRefId: obs-traces-main
  resourcesRefs:
    items:
    - id: obs-sec-traces-desc
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-sec-traces-desc
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: obs-traces-filters
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-traces-filters
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: obs-traces-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-traces-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: obs-traces-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-traces-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
