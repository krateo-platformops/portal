{{/* Caption of the Telemetry tab. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-sec-logs-desc
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    text: 'Error logs, the live error & warning stream and pod resource usage — from the OTel → ClickHouse pipeline.'
    type: secondary
  resourcesRefs:
    items: []
