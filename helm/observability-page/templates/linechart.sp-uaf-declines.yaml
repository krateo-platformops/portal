{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Non-zero is CORRECT in 1.12.x — the user-access-filter declines the Put rather than caching a per-identity body. Returns to 0 in 1.13.0. */}}
{{/* Series under plain names (visual audit CHART-4: "snowplow_cache_diagnostic_total" on a legend); the map is
     the SQL's raw series key to its name, and a key it does not know is drawn as itself. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-uaf-declines
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "RESTAction Put declined": orange
      "Widget Put declined": gold
      "Full-list bypass": cyan
    shapeField: smooth
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
        title: requests
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: ((.series|tostring) as $k | {"snowplow_restactions_uaf_put_declined_total": "RESTAction Put declined", "snowplow_widgets_uaf_put_declined_total": "Widget Put declined", "snowplow_ra_full_list_uaf_bypass_total": "Full-list bypass"}[$k] // $k), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-uaf-declines
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
