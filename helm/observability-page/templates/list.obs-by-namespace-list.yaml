{{/* The eight largest namespaces among the searched compositions, largest first, each a bar against the
     first with its count and how many need attention (red then, blue otherwise). A row searches the tab
     for that namespace (?q=), in every state, so the cards and the figures follow it. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-by-namespace-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-reconciliation
    namespace: {{ $.Values.namespace }}
  widgetData:
    size: small
    split: false
    itemTemplate:
      primaryText: '{name}'
      navigateTo: '{route}'
      ellipsis: true
      bar:
        percent: '{percent}'
        label: '{count}'
        color:
          value: '{tone}'
          map:
            bad: red
            ok: blue
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .byNamespace // [] }'
  resourcesRefs:
    items: []
