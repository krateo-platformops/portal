kind: Statistic
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-stat-pending
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, q, status]
  widgetData:
    title: Pending
    value: 0
    watch: []
  widgetDataTemplate:
  - forPath: watch
    expression: '${ [ .list[] | { apiVersion: .av, kind: .kind } ] | unique }'
  {{/* Ready neither True nor False, less a composition whose children the controller was refused */}}
  {{/* reading (Ready=Unknown/ChildrenForbidden, `.state == "unreadable"`): that is an RBAC defect, */}}
  {{/* not a composition waiting on anything, and the Compositions page labels it so. */}}
  - forPath: value
    expression: '${ ([.list[]|select(.state != "unreadable")|select((.conditions//[])|(any(.type=="Ready" and (.status=="True" or .status=="False"))|not))]|length) }'
  apiRef:
    name: compositions-list
    namespace: {{ $.Release.Namespace }}
  resourcesRefs:
    items: []
