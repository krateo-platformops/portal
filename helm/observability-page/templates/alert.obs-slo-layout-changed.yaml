kind: Alert
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-slo-layout-changed
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    type: warning
    showIcon: true
    title: 'No percentiles for this window'
    description: 'The latency buckets changed during this window, and a percentile over two bucket layouts would be made up. They come back once the older layout leaves the window. Shorter ranges show them already.'
  resourcesRefs:
    items: []
