{{/* The Reconciliation figures over every composition in scope (the search narrows them): Compositions
     (neutral), Healthy, Needs attention (NotReady, Degraded, Children unreadable, Drift; never Paused), Pending
     and, with reconcile tracing, Reconcile overdue. Each tile wears the colour the cards give the state
     it counts (obs-recon-cards), zero or not: Healthy green, Needs attention red (NotReady's), Pending
     blue, Overdue orange (the cards' overdue clock). The title says the state too, so colour is never
     the only signal. A failed read is an empty value (a muted "—") captioned "could not be read", in
     orange, never a 0. A state tile (Healthy, Needs attention, Pending, Reconcile overdue) opens the list
     filtered to that state: its route is the matching state chip's (?status=); the total and a failed
     read have none and stay plain tiles. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-recon-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-reconciliation
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      navigateTo: '{route}'
      color:
        value: '{tone}'
        map:
          healthy: green
          attention: red
          pending: blue
          overdue: orange
          unread: orange
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
