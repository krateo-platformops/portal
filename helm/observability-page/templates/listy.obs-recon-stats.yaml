{{/* The Reconciliation figures over every composition in scope (the search narrows them): Compositions
     (neutral), Healthy, Needs attention (NotReady, Degraded, Children unreadable, Drift, Paused), Pending
     and, with reconcile tracing, Reconcile overdue. The colour and the highlighted border come
     computed (obs-reconciliation `color`, `highlight`; portal.tileDefs, frontend >= 1.8.93): only a
     figure above 0 is coloured and highlighted, the cards' colour for its state: Needs attention red
     (NotReady's), Pending blue, Overdue orange (the cards' overdue clock); a 0, Compositions and
     Healthy are neutral. Overdue with no reconcile trace in 7 days has no count ("—") and stays
     orange and highlighted. The title says the state too, so colour is never the only signal. A
     failed read is an empty value (a muted "—") captioned "could not be read", in orange and
     highlighted, never a 0. A state tile (Healthy, Needs attention, Pending, Reconcile overdue) opens the list
     filtered to that state: its route is the matching state chip's (?status=); the total and a failed
     read have none and stay plain tiles. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-recon-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-reconciliation
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      navigateTo: '{route}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
