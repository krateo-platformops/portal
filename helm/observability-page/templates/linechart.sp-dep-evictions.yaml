{{- if (.Values.observability | default dict).snowplowSli }}
{{/* The #187 containment signal: evict_delete_total moving means the primary delete path works; the other two are fallbacks and should stay flat at 0. */}}
{{/* Series under plain names (visual audit CHART-4: "snowplow_cache_diagnostic_total" on a legend); the map is
     the SQL's raw series key to its name, and a key it does not know is drawn as itself. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-dep-evictions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "On delete": green
      "Object gone (404)": orange
      "Refresher 404": red
    shapeField: smooth
    area: false
    legend: true
    height: 180
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
        title: entries
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: ((.stat|tostring) as $k | {"evict_delete_total": "On delete", "evict_self_gone_total": "Object gone (404)", "self_notfound_evict_total": "Refresher 404"}[$k] // $k), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-dep-evictions
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
