{{/* Observability → Reconciliation tab (the A4 dashboard layout), one obs-reconciliation read for all of
     it: the caption, the figures (Compositions, Healthy, Needs attention, Pending and, with
     observability.reconcileTracing, Reconcile overdue), then one row: the compositions on two thirds
     (state chips, then one card per composition foregrounding its reconcile health, or with ?view=table
     the full list), the charts on one third (by state, reconcile throughput and where reconcile time goes
     with tracing, by kind, by namespace). With tracing, the reconcile latency card (by composition or by
     controller, a wide table) closes the tab at full width. A Col because the Tabs items are resolved
     through refs and every tab is one; the page's range and search sit above the tabs. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-tab-reconciliation
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - paragraphs
    - listies
    - rows
    items:
    - resourceRefId: obs-sec-reconciliation-desc
    - resourceRefId: obs-recon-stats
    - resourceRefId: obs-recon-main
    {{- if (.Values.observability | default dict).reconcileTracing }}
    - resourceRefId: obs-latency-row
    {{- end }}
  resourcesRefs:
    items:
    - id: obs-sec-reconciliation-desc
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-sec-reconciliation-desc
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: obs-recon-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: obs-recon-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
    {{- if (.Values.observability | default dict).reconcileTracing }}
    - id: obs-latency-row
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-latency-row
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
    {{- end }}
