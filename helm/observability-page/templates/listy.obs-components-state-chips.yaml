{{/* The state chips, the tab's filter (?componentStatus=): All (the default), Not ready, then Ready and
     Scaled to zero while some Deployment is, each with its count over the searched Deployments. Each
     route keeps every other page param. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-components-state-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-components
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .chips // [] }'
  resourcesRefs:
    items: []
