{{/* THE RECONCILIATION TAB of /observability (the A4 dashboard layout): every LIVE composition, its
     state, and — with observability.reconcileTracing — when it last reconciled and how long its
     reconciles take. It replaces obs-composition-staleness (which dated the compositions for one
     table) and the four Statistics and two lists that each read compositions-list's `.list`: one
     read, shaped once, for the figures, the chips, the cards, the full list and the side charts.

     THE STAGES.
       crds  CompositionDefinitions -> unique {plural, version} (compositions-list's shape);
       comps one cluster-scope LIST per composition kind -> name, ns, kind, created, conditions, the
             workload verdict and the child counts (compositions-list's projection);
       last  ONLY with reconcileTracing: ONE ClickHouse aggregate over the cdc `reconcile` spans of the
             last 7 days (the otel_traces TTL), per kind|ns|name: the newest and oldest span, the p95
             span duration and the count. No ParentSpanId filter: a composition stamped with
             krateo.io/traceparent reconciles as a CHILD span (about 18/min roots of 85/min on 057).
     Both apiserver stages carry a userAccessFilter, so snowplow's SA dials them and narrows per item;
     the caller needs no cluster grant (lint-caller-cluster-reads.py, #261). ClickHouse is reached
     through clickhouse-endpoint; the page namespace is admins-only (OTEL-11).

     THE STATE is compositions-list's railState, read the same way (portal.readyReasonDefs, copied
     into this chart): paused, failed (NotReady), degraded, healthy (Ready), drift, unreadable
     (Children unreadable), pending. `attention` is failed, degraded, unreadable, drift and paused,
     as on /compositions. OVERDUE (tracing only): no reconcile span in the trace window, or the last
     one over 5 min ago — a healthy composition reconciles every couple of minutes.

     THE PARAMS (request extras).
       projects  the shell scope: compositions in those namespaces only;
       status    the state chips: all (absent), attention, overdue, or one state; read in any case, a
                 value that is no state matches nothing and the chips are still drawn;
       q         the search: a composition whose name, namespace, kind, state or reason contains it
                 (case-insensitive, trimmed) is kept, every other one leaves the whole tab (figures,
                 chips, cards, table, charts);
       view      `table`: the full list instead of the cards.
     Every route built here keeps the others (obs.href).

     DEGRADED STATES, never a flag on every row.
       The lists unread, nothing listed -> `failed`: every figure "could not be read", no chart, one
         warning line in place of the cards.
       A list unread, some listed -> `listError`: a note says compositions may be missing.
       ClickHouse unreadable (`unavailable`) or holding no reconcile span (`empty`) -> no composition
         is dated or counted overdue; the Overdue figure says why and the note explains it.

     OUTPUT.
       tracing, telemetry (off | ok | unavailable | empty), failed, listError, readError;
       q, status, view; live (in scope), total (after the search), matched (in the picked state),
       more (beyond the 24 cards);
       counts    per state + attention, overdue, all, over the searched set;
       stats     the figures: Compositions, Healthy, Needs attention, Pending and, with tracing,
                 Reconcile overdue; each tile's tone is the state it counts (unread on a failed read);
       chips / viewChips   the state chips (label, count, active, route) and Summary | Full list;
       rows      the cards: the first 24 in the picked state, attention first, then overdue, then
                 pending, then healthy; each with its state, kind, reason and when it last reconciled;
       table     every composition in the picked state, the same order, for the full list;
       byState / byKind / byNamespace   the side charts (a kind or namespace row searches for it);
       extra     the trace window ("since <oldest span held> (7 days)");
       note      a warning above the cards when a list or the traces could not be read;
       emptyText the line in place of the cards when there is nothing to list. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: obs-reconciliation
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
  - name: crds
    path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
    verb: GET
    headers:
    - 'Accept: application/json'
    userAccessFilter:
      verb: list
      group: core.krateo.io
      resource: compositiondefinitions
      namespaceFrom: .metadata.namespace
    filter: "[.crds.items[]? | select(.status.resource != null and .status.apiVersion != null) | {plural: .status.resource, version: (.status.apiVersion | split(\"/\")[1])}] | unique"
    continueOnError: true
    errorKey: crdsError
  - name: comps
    dependsOn:
      name: crds
      iterator: .crds
    path: ${ "/apis/composition.krateo.io/" + .version + "/" + .plural }
    verb: GET
    headers:
    - 'Accept: application/json'
    userAccessFilter:
      verb: list
      group: composition.krateo.io
      resourcesFrom: "[ (.crds // [])[] | .plural ]"
      namespaceFrom: .metadata.namespace
    filter: "[.comps.items[]? | {name: .metadata.name, ns: .metadata.namespace, ts: (.metadata.creationTimestamp // \"\"), kind: .kind, conditions: (.status.conditions // []), wh: .status.workloadHealthy, whMsg: (.status.healthMessage // \"\"), evaluated: .status.healthEvaluatedChildren, managed: .status.managedChildrenCount}]"
    continueOnError: true
    errorKey: compsError
  {{- if (.Values.observability | default dict).reconcileTracing }}
  {{/* Decoded: SELECT SpanAttributes['k8s.object.kind'] AS kind, SpanAttributes['k8s.object.namespace'] AS ns,
       SpanAttributes['k8s.object.name'] AS name, toUnixTimestamp(max(Timestamp)) AS last,
       toUnixTimestamp(min(Timestamp)) AS first, toUnixTimestamp(now()) AS now,
       round(quantile(0.95)(Duration)/1e6, 0) AS p95_ms, count() AS n FROM otel_traces
       WHERE ServiceName = 'composition-dynamic-controller' AND SpanName = 'reconcile'
       AND Timestamp > now() - INTERVAL 7 DAY GROUP BY kind, ns, name FORMAT JSON
       No request input reaches it. ServiceName and SpanName lead otel_traces' sort key and the 7-day
       bound prunes its toDate partitions: on 057 (~87 reconcile spans/min, 114 compositions) the
       dating alone read 155k rows / 8.5 MiB in 32 ms; the p95 adds the Duration column. */}}
  - name: last
    endpointRef:
      name: clickhouse-endpoint
      namespace: {{ .Release.Namespace }}
    path: '${ "/?query=SELECT%20SpanAttributes%5B%27k8s.object.kind%27%5D%20AS%20kind%2C%20SpanAttributes%5B%27k8s.object.namespace%27%5D%20AS%20ns%2C%20SpanAttributes%5B%27k8s.object.name%27%5D%20AS%20name%2C%20toUnixTimestamp%28max%28Timestamp%29%29%20AS%20last%2C%20toUnixTimestamp%28min%28Timestamp%29%29%20AS%20first%2C%20toUnixTimestamp%28now%28%29%29%20AS%20now%2C%20round%28quantile%280.95%29%28Duration%29%2F1e6%2C%200%29%20AS%20p95_ms%2C%20count%28%29%20AS%20n%20FROM%20otel_traces%20WHERE%20ServiceName%20%3D%20%27composition-dynamic-controller%27%20AND%20SpanName%20%3D%20%27reconcile%27%20AND%20Timestamp%20%3E%20now%28%29%20-%20INTERVAL%207%20DAY%20GROUP%20BY%20kind%2C%20ns%2C%20name%20FORMAT%20JSON" }'
    verb: GET
    headers:
    - 'Accept: application/json'
    continueOnError: true
    errorKey: lastError
  {{- end }}
  {{/* Literal block: the filter carries # comments. FORMAT JSON quotes 64-bit integers on some
       servers, hence tonumber. Times are UTC. */}}
  filter: |
    {{ include "obs.href" . }}
    {{ include "obs.search" . }}
    {{ include "portal.readyReasonDefs" . }}
    {{ include "duration.label" . }}
    def errtext: if . == null then "" elif type == "array" then map(if type == "object" then (.message // tojson) else tostring end) | join("; ") elif type == "object" then (.message // tojson) else tostring end;
    def cap($n): if length > $n then (.[0:($n - 1)] + "…") else . end;
    def nn($k; $one; $many): ($k | tostring) + " " + (if $k == 1 then $one else $many end);
    # An age as a reader says it: "42 sec", "5 min", "3 h", "8 d".
    def ago($s): ($s | if . < 0 then 0 else . end | floor) as $x
      | if $x < 60 then ($x | tostring) + " sec"
        elif $x < 3600 then (($x / 60) | floor | tostring) + " min"
        elif $x < 86400 then (($x / 3600) | floor | tostring) + " h"
        else (($x / 86400) | floor | tostring) + " d" end;
    def pad2: tostring | if length < 2 then "0" + . else . end;
    def short($t): ($t | gmtime) as $g
      | ($g[2] | tostring) + " " + (["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][$g[1]]) + ", " + ($g[3] | pad2) + ":" + ($g[4] | floor | pad2);
    # compositions-list's railState, condition for condition.
    def railState: (.conditions // []) as $c
      | (any($c[]?; .type == "Ready" and .status == "True")) as $ready
      | (any($c[]?; .type == "Ready" and .status == "False" and (.reason | isConvergingFalse | not))
         or (any($c[]?; .type == "Ready" and .status == "Unknown" and .reason != "ZeroEvidence" and .reason != "ChildrenForbidden")
             and any($c[]?; .type == "Synced" and .status == "False"))) as $notready
      | (any($c[]?; .type == "Ready" and (.reason == "ReconcilePaused" or .reason == "ReconcileGracefullyPaused"))) as $paused
      | (any($c[]?; .type == "Synced" and .status == "False")) as $unsynced
      | (any($c[]?; .type == "Ready" and .status == "Unknown" and .reason == "ChildrenForbidden")) as $unreadable
      | if $paused then "paused" elif $notready then "failed" elif $ready and (.wh == false) then "degraded"
        elif $ready and ($unsynced | not) then "healthy" elif $ready and $unsynced then "drift"
        elif $unreadable then "unreadable" else "pending" end;
    # What is wrong, in the controller's words: the first Ready, Synced or workload verdict that is
    # not True (or a pause), its message, else its type=status · reason.
    def why: (((.conditions // []) + (if .wh == false then [{type: "Workload", status: "False", reason: "Unhealthy", message: (.whMsg // "")}] else [] end))
        | map(select(.type == "Ready" or .type == "Synced" or .type == "Workload")
              | select(.status != "True" or (.reason // "") == "ReconcilePaused" or (.reason // "") == "ReconcileGracefullyPaused"))
        | .[0] // {}) as $k
      | (($k.message // "") | tostring) as $m
      | if $m != "" then $m elif ($k.reason // "") != "" then $k.type + "=" + ($k.status // "") + " · " + $k.reason else "" end;
    . as $in
    | {{ if (.Values.observability | default dict).reconcileTracing }}true{{ else }}false{{ end }} as $tracing
    | 300 as $overdueAfter
    | 24 as $cardCap
    | qRaw as $qRaw
    | ($qRaw | ascii_downcase) as $q
    | ((.projects // "") | tostring | split(",") | map(select(. != ""))) as $projects
    | ((($in.status // "") | tostring | ascii_downcase) | if . == "" then "all" else . end) as $sel
    | ((($in.view // "") | tostring) == "table") as $tableView
    # THE TRACES. Read only when the step answered with an object and no error.
    | (.last | if type == "object" then . else null end) as $ch
    | ($tracing and $ch != null and (.lastError // null) == null) as $read
    | [ (($ch // {}).data // [])[] | select(type == "object" and (.name // "") != "") ] as $spans
    | (if ($tracing | not) then "off" elif ($read | not) then "unavailable" elif ($spans | length) == 0 then "empty" else "ok" end) as $telemetry
    | ($spans | map({ key: ((.kind // "") + "|" + (.ns // "") + "|" + (.name // "")),
                      value: { last: (.last | tonumber? // null), p95: (.p95_ms | tonumber? // null), n: (.n | tonumber? // 0) } }) | from_entries) as $byKey
    | (if $telemetry == "ok" then ($spans[0].now | tonumber? // null) else null end) as $chNow
    | ($chNow // now) as $now
    | (if $telemetry == "ok" then ([ $spans[] | .first | tonumber? // empty ] | min) else null end) as $since
    # THE LIST. A failed read with nothing listed is not a platform with no compositions.
    | ([ .crdsError, .compsError ] | map(select(. != null and . != [] and . != "")) | (first // null) | errtext | cap(300)) as $readError
    | ($readError != "") as $listError
    | [ (.comps // [])[] | select(type == "object" and (.name // "") != "")
        | select(($projects | length) == 0 or ((.ns // "") as $n | $projects | index($n)) != null) ] as $live
    | ($listError and ($live | length) == 0) as $failed
    | { failed: "NotReady", degraded: "Degraded", unreadable: "Children unreadable", drift: "Drift", paused: "Paused",
        pending: "Pending", healthy: "Ready", attention: "Needs attention", overdue: "Overdue", all: "All" } as $names
    | ["failed", "degraded", "unreadable", "drift", "paused", "pending", "healthy"] as $order
    | [ $live[]
        | railState as $st
        | (if $telemetry == "ok" then $byKey[(.kind // "") + "|" + (.ns // "") + "|" + (.name // "")] else null end) as $t
        | (($t // {}).last) as $l
        | ((.ts // "") | tostring) as $ts
        | (($ts | .[0:19] + "Z") | fromdateiso8601? // null) as $created
        | ($telemetry == "ok" and $l == null) as $never
        | (if $l != null then ([$now - $l, 0] | max) else null end) as $age
        | { name, ns: (.ns // ""), kind: (.kind // ""), state: $st, stateLabel: $names[$st],
            attention: ($st | IN("failed", "degraded", "unreadable", "drift", "paused")),
            never: $never, last: $l, ageSec: $age,
            overdue: ($never or (($age // 0) > $overdueAfter)),
            p95: (($t // {}).p95), n: (($t // {}).n // 0),
            created: $ts,
            createdText: (if $created != null then "created " + ago($now - $created) + " ago" else "—" end),
            why: why } ] as $all
    | ($all | map(select([.name, .ns, .kind, .stateLabel, .why] | hits($q)))) as $base
    | def inSel: if $sel == "all" then true elif $sel == "attention" then .attention elif $sel == "overdue" then .overdue else .state == $sel end;
      ($base | map(select(inSel))) as $shown
    | ($order | map(. as $s | { key: $s, value: ($base | map(select(.state == $s)) | length) }) | from_entries
       + { attention: ($base | map(select(.attention)) | length), overdue: ($base | map(select(.overdue)) | length), all: ($base | length) }) as $counts
    # Attention first (triage order), then overdue (none in the window first, then the oldest
    # reconcile), then pending, then healthy.
    | ($shown | map(. + { rank: (if .attention then 0 elif .overdue then 1 elif .state == "pending" then 2 else 3 end),
                          so: (.state as $s | $order | index($s)) })
       | sort_by(.rank, .so, (if .never then 0 else 1 end), (.last // 0), .created, .kind, .ns, .name)) as $sorted
    | def reconciled: if $telemetry != "ok" then "created " + (.created | .[0:10])
                      elif .never then "no reconcile in the trace window"
                      else "reconciled " + ago(.ageSec) + " ago" + (if .p95 != null and .n > 0 then " · p95 " + (.p95 | durationLabel) else "" end) end;
      ([ $order[] | . as $s | select(($counts[$s] // 0) > 0 and ($s | IN("failed", "degraded", "unreadable", "drift", "paused"))) | ($counts[$s] | tostring) + " " + $names[$s] ] | join(" · ")) as $attnText
    | ($base | map(select(.never)) | length) as $neverN
    | ([ { title: "Compositions", value: $counts.all, caption: nn($base | map(.kind) | unique | length; "kind"; "kinds"), tone: "total" },
         { title: "Healthy", value: $counts.healthy, caption: "Ready and in sync", tone: "healthy" },
         { title: "Needs attention", value: $counts.attention, caption: (if $attnText == "" then "nothing NotReady, drifted or paused" else $attnText end), tone: "attention" },
         { title: "Pending", value: $counts.pending, caption: "converging, no verdict yet", tone: "pending" } ]
       + (if ($tracing | not) then []
          elif $telemetry == "ok" then [ { title: "Reconcile overdue", value: $counts.overdue,
              caption: (if $neverN > 0 then ($neverN | tostring) + " with none in the trace window" elif $counts.overdue > 0 then "last reconcile over 5 min ago" else "all reconciled within 5 min" end), tone: "overdue" } ]
          elif $telemetry == "empty" then [ { title: "Reconcile overdue", value: "", caption: "no reconcile traces in 7 days", tone: "overdue" } ]
          else [ { title: "Reconcile overdue", value: "", caption: "traces could not be read", tone: "unread" } ] end)
       | map(if $failed then { title, value: "", caption: "could not be read", tone: "unread" } else . + { value: (.value | tostring) } end)) as $stats
    | (if $sel == "all" then "" else $sel end) as $selParam
    | ([ "all", "attention" ] + (if $telemetry == "ok" then [ "overdue" ] else [] end)
       + ($order | map(select(. as $s | ($counts[$s] // 0) > 0 or $sel == $s)))) as $chipKeys
    | def bars($field; $top):
        (group_by(.[$field]) | map({ name: .[0][$field], count: length, attention: (map(select(.attention)) | length) }) | sort_by(-.count, .name) | .[0:$top]) as $g
        | ($g | .[0].count // 1) as $max
        | [ $g[] | . as $r | { name, count: ((.count | tostring) + (if .attention > 0 then " · " + (.attention | tostring) + " need attention" else "" end)),
                     percent: (.count * 100 / $max | floor), tone: (if .attention > 0 then "bad" else "ok" end),
                     route: ($in | obsHref({ q: $r.name, status: "", view: (if $tableView then "table" else "" end) }; "Reconciliation")) } ];
      (if $telemetry == "unavailable" then "The reconcile traces could not be read, so last-reconcile times can't be shown right now. The compositions themselves are not affected."
       elif $telemetry == "empty" then "No reconcile traces from the last 7 days were found, so last-reconcile times can't be shown right now. Reconcile tracing may be off on this cluster. The compositions themselves are not affected."
       else "" end) as $traceNote
    | {
        tracing: $tracing,
        telemetry: $telemetry,
        failed: $failed,
        listError: $listError,
        readError: $readError,
        q: $qRaw,
        status: $sel,
        view: (if $tableView then "table" else "" end),
        live: ($all | length),
        total: ($base | length),
        matched: ($shown | length),
        more: (if ($shown | length) > $cardCap then ($shown | length) - $cardCap else 0 end),
        counts: $counts,
        stats: $stats,
        chips: [ $chipKeys[] as $k | { key: $k, label: $names[$k], count: ($counts[$k] // 0), active: ($k == $sel),
                                       route: ($in | obsHref({ status: (if $k == "all" then "" else $k end), q: $qRaw }; "Reconciliation")) } ],
        viewChips: [ { label: "Summary", active: ($tableView | not), route: ($in | obsHref({ status: $selParam, q: $qRaw, view: "" }; "Reconciliation")) },
                     { label: "Full list", active: $tableView, route: ($in | obsHref({ status: $selParam, q: $qRaw, view: "table" }; "Reconciliation")) } ],
        rows: [ $sorted[0:$cardCap][]
                | { name, ns, kind, tone: .state, stateLabel,
                    description: (if .why != "" then (.why | cap(220)) elif .state == "healthy" then "Ready and in sync." elif .state == "pending" then "Converging: no verdict yet." else "—" end),
                    foot: (.ns + " · " + reconciled),
                    statusIcon: (if .overdue then "fa-clock" else "" end),
                    statusColor: (if .overdue then "orange" else "" end),
                    statusTooltip: (if .overdue | not then "" elif .never then "No reconcile in the trace window" else "Last reconcile " + ago(.ageSec) + " ago: overdue after 5 min" end) } ],
        table: [ $sorted[] | { name, ns, kind, state: .stateLabel, tone: .state, never, overdue,
                               lastIso: (if .last != null then (.last | todate) else "" end),
                               p95: (if .p95 != null and .n > 0 then (.p95 | durationLabel) else "—" end),
                               createdText } ],
        byState: (if $failed then [] else [ $order[] | { state: $names[.], count: $counts[.] } | select(.count > 0) ] end),
        byKind: (if $failed then [] else ($base | bars("kind"; 8)) end),
        byNamespace: (if $failed then [] else ($base | bars("ns"; 8)) end),
        extra: (if $telemetry == "ok" then "trace window: since " + short($since) + " (7 days)" elif $tracing then "trace window: unavailable" else "" end),
        note: ([ (if $listError and ($failed | not) then "A CompositionDefinition or composition list could not be read (" + $readError + "), so some compositions may be missing below." else empty end),
                 (if $traceNote != "" then $traceNote else empty end) ] | join(" ")),
        emptyText: (if $failed then "The compositions could not be read (" + $readError + "), so nothing on this tab counts them."
                    elif $qRaw != "" and ($base | length) == 0 then "No composition matches \"" + $qRaw + "\"."
                    elif ($base | length) == 0 then "There are no compositions."
                    elif $sel == "all" then "There are no compositions."
                    elif $sel == "attention" then "No composition needs attention."
                    elif $sel == "overdue" then "Every composition reconciled within the last 5 min."
                    elif $names[$sel] != null then "No composition is " + $names[$sel] + "."
                    else "No composition is in this state." end)
      }
