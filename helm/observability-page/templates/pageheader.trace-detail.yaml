{{/* The /observability/traces/{traceId} page header (installer#404): "Trace 4f1c…a07e", one status */}}
{{/* pill, and who/when/how long — the root span's user, the trace's start, its wall-clock */}}
{{/* length (first start to last end) and the span count. The start is a {moment:<ISO>} time */}}
{{/* token (frontend #803, 1.8.105): the browser writes it in the viewer's zone ("8 Nov, 21:52" */}}
{{/* in Rome), with the full date on hover. It was written in UTC by jq (visual audit OBS-4). */}}
{{/* */}}
{{/* The pill is the trace's status in the exporter's words, drawn as the Traces tab draws a span's */}}
{{/* (traceStatusTag, one mapping): Error when any span is Error, else OK when any span is Ok, else */}}
{{/* Unset. It used to be OK whenever no span was Error, so a trace whose every span was Unset read */}}
{{/* "Unset" in the list and "OK" here (visual audit OBS-4): most instrumentation never sets a status, */}}
{{/* and nothing said it was OK. Three honest non-answers instead */}}
{{/* of a pill that claims something: "Not a trace id" (the route param is not 32 hex characters — */}}
{{/* obs-trace-detail made no call), "Not found" (no span with that id in the last 7 days) and */}}
{{/* "Unreadable" (ClickHouse did not answer). */}}
{{/* */}}
{{/* "Ask Agentiko →" (button.trace-detail-ask-agentiko) is the header's one action and not a */}}
{{/* primary; "Open in HyperDX" stays where it was, beside the topology. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: trace-detail-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the route param. */}}
  keyExtras: [traceId]
  apiRef:
    name: obs-trace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Trace
    subtitle: ""
    tags:
    - label: Unknown
      color: gray
    allowedResources:
    - buttons
    items:
    - resourceRefId: trace-detail-ask-agentiko
  widgetDataTemplate:
    - forPath: title
      expression: '${ {{ include "obs.traces.format" . }} if .valid then "Trace " + (.traceId | traceShort) else "Trace" end }'
    - forPath: tags
      expression: '${ {{ include "obs.traces.format" . }} (.spans // []) as $s | [ if (.valid | not) then {label: "Not a trace id", color: "gray"} elif .failed and ($s | length) == 0 then {label: "Unreadable", color: "gray"} elif ($s | length) == 0 then {label: "Not found", color: "gray"} elif any($s[]; .status == "Error") then ("Error" | traceStatusTag) elif any($s[]; .status == "Ok") then ("Ok" | traceStatusTag) else ("Unset" | traceStatusTag) end ] }'
    - forPath: subtitle
      expression: '${ {{ include "obs.traces.format" . }} (.spans // []) as $s | if (.valid | not) then "A trace id is 32 hexadecimal characters." elif .failed and ($s | length) == 0 then "ClickHouse did not answer, so this trace could not be read." elif ($s | length) == 0 then "No span with this trace id in the last 7 days." else ([ $s[] | .spanId ] ) as $ids | (([ $s[] | select(.parentId == "" or (.parentId as $p | any($ids[]; . == $p) | not)) ] | first) // $s[0]) as $root | ($root.user // "") as $u | ([ $s[] | .startUs ] | min) as $start | ([ $s[] | .startUs + (.durationNs / 1000) ] | max) as $end | ([ (if $u != "" then $u else ([ $s[] | .user | select(. != "") ] | first) // "unattributed" end), ((($start / 1000) | floor) as $ms | (($ms / 1000) | floor | todate) as $iso | "{moment:" + $iso[0:19] + "." + ("00" + (($ms % 1000) | tostring))[-3:] + "Z}"), ((($end - $start) * 1000) | traceDuration), (($s | length | tostring) + (if ($s | length) == 1 then " span" else " spans" end)) ] + (if .truncated then ["first 1000 spans shown"] else [] end)) | join(" · ") end }'
  resourcesRefs:
    items:
    - id: trace-detail-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: trace-detail-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
