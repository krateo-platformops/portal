{{/* The /observability/traces/{traceId} page header (installer#404): "Trace 4f1c…a07e", one status */}}
{{/* pill, and who/when/how long — the root span's user, the trace's start in UTC, its wall-clock */}}
{{/* length (first start to last end) and the span count. */}}
{{/* */}}
{{/* The pill is Error when any span is Error and OK otherwise: most instrumentation leaves */}}
{{/* StatusCode Unset, and a trace with no error span did not fail. Three honest non-answers instead */}}
{{/* of a pill that claims something: "Not a trace id" (the route param is not 32 hex characters — */}}
{{/* obs-trace-detail made no call), "Not found" (no span with that id in the last 7 days) and */}}
{{/* "Unreadable" (ClickHouse did not answer). */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: trace-detail-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the route param. */}}
  keyExtras: [traceId]
  apiRef:
    name: obs-trace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Trace
    subtitle: ""
    tags:
    - label: Unknown
      color: gray
  widgetDataTemplate:
    - forPath: title
      expression: '${ {{ include "obs.traces.format" . }} if .valid then "Trace " + (.traceId | traceShort) else "Trace" end }'
    - forPath: tags
      expression: '${ (.spans // []) as $s | [ if (.valid | not) then {label: "Not a trace id", color: "gray"} elif .failed and ($s | length) == 0 then {label: "Unreadable", color: "gray"} elif ($s | length) == 0 then {label: "Not found", color: "gray"} elif any($s[]; .status == "Error") then {label: "Error", color: "red"} else {label: "OK", color: "green"} end ] }'
    - forPath: subtitle
      expression: '${ {{ include "obs.traces.format" . }} (.spans // []) as $s | if (.valid | not) then "A trace id is 32 hexadecimal characters." elif .failed and ($s | length) == 0 then "ClickHouse did not answer, so this trace could not be read." elif ($s | length) == 0 then "No span with this trace id in the last 7 days." else ([ $s[] | .spanId ] ) as $ids | (([ $s[] | select(.parentId == "" or (.parentId as $p | any($ids[]; . == $p) | not)) ] | first) // $s[0]) as $root | ($root.user // "") as $u | ([ $s[] | .startUs ] | min) as $start | ([ $s[] | .startUs + (.durationNs / 1000) ] | max) as $end | ([ (if $u != "" then $u else ([ $s[] | .user | select(. != "") ] | first) // "unattributed" end), ((($start / 1000) | floor | traceUtc) + " UTC"), ((($end - $start) * 1000) | traceDuration), (($s | length | tostring) + (if ($s | length) == 1 then " span" else " spans" end)) ] + (if .truncated then ["first 1000 spans shown"] else [] end)) | join(" · ") end }'
  resourcesRefs:
    items: []
