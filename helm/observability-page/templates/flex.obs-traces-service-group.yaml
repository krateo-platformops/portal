{{/* One group of the Traces tab's filter bar: its label and its chips (installer#404). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-traces-service-group
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, traceService, traceUser, traceStatus]
  widgetData:
    allowedResources:
    - listies
    - paragraphs
    gap: small
    align: center
    wrap: true
    items:
    - resourceRefId: obs-traces-service-label
    - resourceRefId: obs-traces-service-chips
  resourcesRefs:
    items:
    - id: obs-traces-service-label
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-traces-service-label
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: obs-traces-service-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-traces-service-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
