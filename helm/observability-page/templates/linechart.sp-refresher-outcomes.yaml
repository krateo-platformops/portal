{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Refresh outcomes per bucket. `dropped` is the deterministic-failure path that leaves a stale entry resident. */}}
{{/* Series under plain names (visual audit CHART-4: "snowplow_cache_diagnostic_total" on a legend); the map is
     the SQL's raw series key to its name, and a key it does not know is drawn as itself. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-refresher-outcomes
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "Completed": green
      "Failed": red
      "Dropped": orange
      "Retried": gold
      "Skipped (stage error)": magenta
    shapeField: smooth
    area: false
    legend: true
    height: 180
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
        title: refreshes
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: ((.stat|tostring) as $k | {"completed": "Completed", "failed": "Failed", "dropped": "Dropped", "retried": "Retried", "skipped_stage_error": "Skipped (stage error)"}[$k] // $k), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-refresher-outcomes
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
