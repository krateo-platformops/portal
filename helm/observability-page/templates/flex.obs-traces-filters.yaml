{{/* The Traces tab's filter bar (installer#404): service and user, each an */}}
{{/* eyebrow label beside its chips, as the page's own range and row-limit groups are. Chips, not */}}
{{/* Selects: a Select writes only its own query param, and the Tabs widget remounts on any query */}}
{{/* change and opens on ?tab= — so a Select would drop the reader back on the first tab. Every chip */}}
{{/* route carries ?tab=Traces and the other filters (_traces.tpl, obs.traces.route). Last, the */}}
{{/* "HyperDX internals hidden" note, shown only while that service is left out. The time range is */}}
{{/* the page's (above the tabs), and the status chips are the spans card's state chips. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-traces-filters
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - flexes
    - listies
    gap: middle
    align: center
    wrap: true
    items:
    - resourceRefId: obs-traces-service-group
    - resourceRefId: obs-traces-user-group
    - resourceRefId: obs-traces-hidden-note
  resourcesRefs:
    items:
    - id: obs-traces-service-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-traces-service-group
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: obs-traces-user-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-traces-user-group
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: obs-traces-hidden-note
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-traces-hidden-note
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
