{{/* The note under the trace page's service diagram (installer#404, the issue's "say so in the */}}
{{/* UI"): FlowChart has no time axis. The timing is the Spans card's waterfall on this page, so the */}}
{{/* note points there and no longer at HyperDX (approved charts mockup, OBS-4); the link to */}}
{{/* HyperDX stays beside the diagram when it is configured. */}}
kind: Markdown
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: trace-detail-note
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the route param, which reaches every widget on the page. */}}
  keyExtras: [traceId]
  widgetData:
    markdown: "This diagram shows which services the request passed through, not how long each took. For timing, read the span list."
  resourcesRefs:
    items: []
