{{/* A one-item Flex around the search, because a Row takes no `inputs` (as flex.incidents-search-wrap). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-search-wrap
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - inputs
    items:
    - resourceRefId: obs-search
  resourcesRefs:
    items:
    - id: obs-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-search
      namespace: {{ $.Values.namespace }}
      resource: inputs
      verb: GET
