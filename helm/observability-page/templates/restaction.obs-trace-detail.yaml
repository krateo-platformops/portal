{{/* Every span of ONE trace, for /observability/traces/{traceId} (installer#404). The route param */}}
{{/* arrives as ?extras .traceId. */}}
{{/* */}}
{{/* The query, decoded: */}}
{{/*   SELECT toUnixTimestamp64Micro(Timestamp) AS start_us, SpanId AS span_id, */}}
{{/*          ParentSpanId AS parent_id, ServiceName AS svc, SpanName AS span, Duration AS dur_ns, */}}
{{/*          StatusCode AS status, StatusMessage AS msg, */}}
{{/*          coalesce(nullIf(SpanAttributes['http.response.status_code'], ''), */}}
{{/*                   nullIf(SpanAttributes['http.status_code'], ''), SpanAttributes['http.status']) AS http, */}}
{{/*          SpanAttributes['jwt.sub'] AS sub */}}
{{/*   FROM otel_traces */}}
{{/*   WHERE TraceId = '<traceId>' AND Timestamp > now() - INTERVAL 7 DAY */}}
{{/*   ORDER BY Timestamp ASC, SpanId ASC LIMIT 1000 FORMAT JSON */}}
{{/* */}}
{{/* THE SPAN'S HTTP STATUS CODE, under whichever key its producer writes it: */}}
{{/* `http.response.status_code` (current semconv: krateo-frontend, snowplow, sse-proxy, */}}
{{/* composition-dynamic-controller, kagent), `http.status_code` (the pre-1.21 semconv name: */}}
{{/* HyperDX, nightly_review_agent) and `http.status` (agentgateway). On krateo-057 no span */}}
{{/* carries more than one of them, so the order only matters if a producer ever writes two. A */}}
{{/* missing key reads '' (Map access), so a span with none is ''. The column is a String in */}}
{{/* SpanAttributes, so FORMAT JSON always quotes it. */}}
{{/* */}}
{{/* THE SPAN'S OTel StatusMessage, as `message`: why an Error span failed, in its producer's words */}}
{{/* ("context deadline exceeded", "dial tcp …: connect: connection refused"). The trace page shows */}}
{{/* it as the tooltip of the span's red Status tag. On krateo-057 (7 days to 2026-11-11) only */}}
{{/* Error spans carry one, and the longest is 1,173 characters (3 are over 1000), so the filter */}}
{{/* CUTS it to 1000 characters, the last an ellipsis: one pathological message cannot bloat the */}}
{{/* response the widgets resolve from. Not filtered further: the collector redacts JWTs, and a */}}
{{/* 7-day scan of 11,584 Error-span messages found no credential shape. */}}
{{/* */}}
{{/* GATED ON A WELL-FORMED TRACE ID. The iterator yields the request only for 32 hex characters */}}
{{/* (lowercased first: the exporter writes lowercase hex), so a missing id — snowplow's Phase-1 */}}
{{/* walk resolves with no extras — or one carrying a quote or an SQL fragment makes no call, and */}}
{{/* the page says "Not a trace id". The id that reaches the SQL can only be [0-9a-f]. */}}
{{/* */}}
{{/* BOUNDED: the 7-day window is the longest range the span list offers, so a trace opened from the */}}
{{/* list is always inside it, and TraceId has a bloom-filter index; LIMIT 1000 caps a runaway trace */}}
{{/* (the page says when it was reached). Start is kept in MICROseconds so offsets stay exact: an */}}
{{/* epoch in nanoseconds is past the 2^53 a jq number holds exactly. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: obs-trace-detail
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: spans
      dependsOn:
        name: ""
        iterator: '{{ include "obs.traces.valid" . }} [ ((.traceId // "") | tostring | ascii_downcase) as $t | select($t | okTraceId) | { tid: $t } ]'
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ "/?query=SELECT%20toUnixTimestamp64Micro%28Timestamp%29%20AS%20start_us%2C%20SpanId%20AS%20span_id%2C%20ParentSpanId%20AS%20parent_id%2C%20ServiceName%20AS%20svc%2C%20SpanName%20AS%20span%2C%20Duration%20AS%20dur_ns%2C%20StatusCode%20AS%20status%2C%20StatusMessage%20AS%20msg%2C%20coalesce%28nullIf%28SpanAttributes%5B%27http.response.status_code%27%5D%2C%20%27%27%29%2C%20nullIf%28SpanAttributes%5B%27http.status_code%27%5D%2C%20%27%27%29%2C%20SpanAttributes%5B%27http.status%27%5D%29%20AS%20http%2C%20SpanAttributes%5B%27jwt.sub%27%5D%20AS%20sub%20FROM%20otel_traces%20WHERE%20TraceId%20%3D%20%27" + .tid + "%27%20AND%20Timestamp%20%3E%20now%28%29%20-%20INTERVAL%207%20DAY%20ORDER%20BY%20Timestamp%20ASC%2C%20SpanId%20ASC%20LIMIT%201000%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: spansError
  {{/* 64-bit integers (start_us, dur_ns) arrive as JSON strings. Spans stay in start order; the */}}
  {{/* widgets derive offsets, the summary and the service graph from them. */}}
  {{/* */}}
  {{/* askHref: "Ask Agentiko →" in the page header (button.trace-detail-ask-agentiko) — THIS page */}}
  {{/* with an ?ask seed, @uri-encoded once: the span count, the services, the wall-clock length */}}
  {{/* (first start to last end, as the header subtitle measures it) and the spans in error (top 8, */}}
  {{/* numbered). "" when there is nothing to ask about — not a trace id, ClickHouse did not answer, */}}
  {{/* or no span came back — so the button falls back to the Traces tab rather than seed a prompt */}}
  {{/* about a trace nobody read. */}}
  filter: >
    {{ include "obs.traces.valid" . }} {{ include "obs.traces.format" . }}
    def cap($n): if length > $n then (.[0:($n - 1)] + "…") else . end;
    ((.traceId // "") | tostring | ascii_downcase) as $t
    | ($t | okTraceId) as $valid
    | [ ((.spans.data) // [])[]
        | { startUs: (.start_us | tonumber? // 0), spanId: (.span_id // ""), parentId: (.parent_id // ""),
            service: (.svc // ""), span: (.span // ""), durationNs: (.dur_ns | tonumber? // 0),
            status: (.status // ""), message: ((.msg // "") | tostring | cap(1000)),
            httpStatus: ((.http // "") | tostring), user: (.sub // "") } ] as $spans
    | (.spansError != null) as $failed
    | (($spans | length) >= 1000) as $truncated
    | ($spans | map(.service | select(. != "")) | unique) as $services
    | [ $spans[] | select(.status == "Error") ] as $errors
    | (if ($spans | length) == 0 then "" else
         (([ $spans[] | .startUs ] | min) as $start | ([ $spans[] | .startUs + (.durationNs / 1000) ] | max) as $end | ((($end - $start) * 1000) | traceDuration)) end) as $wall
    | ("Explain trace " + $t + ": " + ($spans | length | tostring) + (if ($spans | length) == 1 then " span" else " spans" end)
       + (if $truncated then " (the first 1000; the trace has more)" else "" end)
       + " across " + ($services | length | tostring) + (if ($services | length) == 1 then " service (" else " services (" end)
       + ($services[0:8] | join(", ")) + (if ($services | length) > 8 then ", and " + (($services | length) - 8 | tostring) + " more" else "" end) + "), "
       + $wall + " end to end, "
       + (if ($errors | length) == 0 then "and no span in error. Where is the time going, and what should I change?"
          else ($errors | length | tostring) + (if ($errors | length) == 1 then " span in error: " else " spans in error: " end)
            + ([ $errors[0:8] | to_entries[] | ((.key + 1) | tostring) + ". " + (if .value.service != "" then .value.service else "unknown" end) + " · " + (.value.span | cap(110))
                 + (if .value.httpStatus != "" then " (HTTP " + .value.httpStatus + ")" else "" end) ] | join(" "))
            + ". Where is the time going, what caused the errors, and what should I change?" end)) as $ask
    | { traceId: (if $valid then $t else "" end), valid: $valid, spans: $spans,
        truncated: $truncated, failed: $failed,
        askHref: (if $valid and ($failed | not) and ($spans | length) > 0 then ("/observability/traces/" + $t + "?ask=" + ($ask | @uri)) else "" end) }
