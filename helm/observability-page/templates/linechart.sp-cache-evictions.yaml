{{- if (.Values.observability | default dict).snowplowSli }}
{{/* Evictions per bucket by route. `delete` is the dependency-tracker path. */}}
{{/* Series under plain names (visual audit CHART-4: "snowplow_cache_diagnostic_total" on a legend); the map is
     the SQL's raw series key to its name, and a key it does not know is drawn as itself. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-cache-evictions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "Expired (TTL)": orange
      "Evicted (LRU)": gold
      "Deleted": cyan
    shapeField: smooth
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
        title: entries
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: ((.stat|tostring) as $k | {"evict_ttl_total": "Expired (TTL)", "evict_lru_total": "Evicted (LRU)", "evict_delete_total": "Deleted"}[$k] // $k), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-cache-evictions
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
