{{/* One card per control-plane Deployment in the picked state, Not ready first, then by name: the name,
     its state as a coloured tag (Ready green, Not ready red, Scaled to zero gray), its image, how many
     replicas are ready, and the first condition that is not True in the controller's words. The whole
     card opens the component page. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-components-cards
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-components
    namespace: {{ $.Values.namespace }}
  widgetData:
    grid:
      gutter: 12
      column: 1
    split: false
    pagination:
      pageSize: 8
    itemTemplate:
      rowVariant: card
      icon: fa-server
      iconVariant: tile
      primaryText: '{name}'
      secondaryText: '{stateLabel}'
      subPrimaryText: '{image}'
      subSecondaryText: '{foot}'
      description: '{description}'
      cardCta: Open component
      navigateTo: '/observability/components/{name}'
      color:
        value: '{tone}'
        map:
          ready: green
          notready: red
          scaled: gray
        default: gray
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .cards // [] }'
  resourcesRefs:
    items: []
