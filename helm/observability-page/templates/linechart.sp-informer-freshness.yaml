{{- if (.Values.observability | default dict).snowplowSli }}
{{/* How stale the informers are: the oldest event age, in seconds. A rising max_event_age means a watch has gone
     quiet. The GVRs stale over an hour are their own chart beside it in the same card (sp-informer-stale, the same
     RESTAction): one unit per axis (charts mockup, CHART-4; Diego, 2026-11-26). */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-informer-freshness
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: Oldest event age
    xField: t
    yField: v
    colorField: series
    colorMap:
      "Oldest event age": orange
    shapeField: smooth
    area: false
    legend: false
    height: 150
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
        title: seconds
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | select((.stat|tostring) == "max_event_age_seconds") | { t: (.t|tonumber), series: "Oldest event age", v: (.v|tonumber) } ] }'
  apiRef:
    name: sp-informer-freshness
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
