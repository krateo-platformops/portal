{{/* "By state": the compositions in each state, as a donut (piechart.obs-recon-by-state). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-recon-by-state-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: By state
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - piecharts
    items:
    - resourceRefId: obs-recon-by-state
  resourcesRefs:
    items:
    - id: obs-recon-by-state
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-by-state
      namespace: {{ $.Values.namespace }}
      resource: piecharts
      verb: GET
