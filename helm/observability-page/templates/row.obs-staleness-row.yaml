{{/* GUARDED by observability.reconcileTracing, like restaction.obs-composition-staleness.yaml and
     the Reconciliation tab entry that reaches this CR (col.obs-tab-reconciliation.yaml). */}}
{{- if (.Values.observability | default dict).reconcileTracing }}
{{/* Full-width strip for the "Last reconcile by composition" card, below the snapshot cards on
     the Reconciliation tab (the tab's Col holds rows, not cards). */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-staleness-row
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range]
  widgetData:
    allowedResources:
    - cards
    items:
    - resourceRefId: obs-staleness-card
      size: 24
  resourcesRefs:
    items:
    - id: obs-staleness-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-staleness-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
{{- end }}
