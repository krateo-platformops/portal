{{/* As drawn: while the window spans a bucket-layout change (the API statement returns two layouts),
     the card holds only the explanation; otherwise the table, every row with its sample count. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-slo-latency-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [range]
  widgetData:
    title: 'Latency p95 · API ≤ 500 ms · UI ≤ 2 s'
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - alerts
    - tables
    items:
    - resourceRefId: obs-slo-latency
  widgetDataTemplate:
  - forPath: items
    expression: '${ if .layoutChanged == true then [ { resourceRefId: "obs-slo-layout-changed" } ] else [ { resourceRefId: "obs-slo-latency" } ] end }'
  apiRef:
    name: obs-slo
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items:
    - id: obs-slo-layout-changed
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-slo-layout-changed
      namespace: {{ $.Values.namespace }}
      resource: alerts
      verb: GET
    - id: obs-slo-latency
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-slo-latency
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
