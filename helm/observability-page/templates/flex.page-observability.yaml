{{/* /observability — PLATFORM HEALTH (alerts and investigations live on /incidents). Top to bottom:
       - the header, with Ask Agentiko and the optional console link (no subtitle: the breadcrumb says
         where this is);
       - the toolbar: the time range (1h, 6h, 24h, 7d; 24h by default) on the left and the search on
         the right, both SHARED by every tab, above them, so a range change or a search re-scopes the
         page and keeps the open tab;
       - the tabs (obs-main), each laid out as the A4 dashboard where it lists something — its figures,
         then its list on two thirds (state chips, Summary cards | Full list) and its charts on one
         third: Reconciliation (the compositions and their reconcile health), Telemetry (the platform's
         errors, log stream and pods), Components (the control-plane Deployments) and Traces (the
         spans). SLOs and the snowplow SLI tabs are charts and cards only, kept as they were.

     krateo.io/filter-keys names the URL params this page's widgets receive: the range, the Telemetry log
     filters (serviceName, limit), the latency view (latencyBy), the Traces filters, the Reconciliation
     and Components state chips (status, componentStatus), the search (q), Summary | Full list (view),
     the shell scope (projects) and `tab` (which an older frontend still sends). scripts/lint-keyextras.py
     fails any widget reachable from here whose keyExtras misses one, because snowplow declines to cache
     a widget that receives an extra it does not declare (F6). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-observability
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/nav-group": "Observability"
    "krateo.io/nav-icon": "fa-chart-line"
    "krateo.io/nav-label": "Observability"
    "krateo.io/nav-order": "11"
    "krateo.io/nav-path": "/observability"
    "krateo.io/filter-keys": "projects,range,tab,serviceName,limit,traceService,traceUser,traceStatus,latencyBy,status,componentStatus,q,view"
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - pageheaders
    - rows
    - tabs
    vertical: true
    gap: middle
    items:
    - resourceRefId: observability-page-header
    - resourceRefId: obs-toolbar
    - resourceRefId: obs-main
  resourcesRefs:
    items:
    - id: observability-page-header
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: observability-page-header
      namespace: {{ $.Values.namespace }}
      resource: pageheaders
      verb: GET
    - id: obs-toolbar
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-toolbar
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
    - id: obs-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-main
      namespace: {{ $.Values.namespace }}
      resource: tabs
      verb: GET
