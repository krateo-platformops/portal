{{/* Observability → Components tab content. A Col wrapper — mirrors obs-tab-reconciliation / */}}
{{/* obs-tab-telemetry so every tab opens with the same section header (strong label + secondary */}}
{{/* caption) instead of dropping straight into a bare table. Stacks the header over the */}}
{{/* control-plane Deployment status table (obs-components). The Tabs allowedResources enum has */}}
{{/* `cols`/`tables` (not `flexes`), so this is a Col holding `paragraphs` + `tables`. Unlike the */}}
{{/* other two tabs, obs-components is a live apiserver Deployment GET that ignores ?range — the */}}
{{/* caption says so, so the shared range chips reading as inert here is intentional, not a bug. */}}
{{/* P3: the tab's own name is not repeated as a heading under it — the tab already says it, */}}
{{/* and the strong label that did rendered as large as the page title. The caption stays. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-tab-components
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - paragraphs
    - tables
    items:
    - resourceRefId: obs-sec-components-desc
    - resourceRefId: obs-components
    {{/* Declared pins, below the runtime table: what is running, then what is declared. */}}
    - resourceRefId: obs-sec-pins-label
    - resourceRefId: obs-sec-pins-desc
    - resourceRefId: platform-pins
  resourcesRefs:
    items:
    - id: obs-sec-components-desc
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-sec-components-desc
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: obs-components
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-components
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
    - id: obs-sec-pins-label
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-sec-pins-label
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: obs-sec-pins-desc
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-sec-pins-desc
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: platform-pins
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: platform-pins
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
