{{/* Observability → Components tab (the A4 dashboard layout): Krateo's own control-plane Deployments,
     live from the apiserver (the time range does not apply). The caption, the figures (Deployments,
     Ready, Not ready, Scaled to zero), then one row: the components on two thirds (state chips, then
     one card per Deployment, Not ready first, or with ?view=table the runtime table and, under it, the
     versions the platform declares), the charts on one third (by state, replicas ready). A component
     opens /observability/components/{name}. The page's search sits above the tabs. */}}
kind: Col
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-tab-components
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - paragraphs
    - listies
    - rows
    items:
    - resourceRefId: obs-sec-components-desc
    - resourceRefId: obs-components-stats
    - resourceRefId: obs-components-main
  resourcesRefs:
    items:
    - id: obs-sec-components-desc
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-sec-components-desc
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: obs-components-stats
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-components-stats
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: obs-components-main
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-components-main
      namespace: {{ $.Values.namespace }}
      resource: rows
      verb: GET
