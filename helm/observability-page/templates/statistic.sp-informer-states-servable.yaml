{{- if (.Values.observability | default dict).snowplowSli }}
kind: Statistic
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-informer-states-servable
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [range]
  apiRef:
    name: sp-informer-states
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Informers servable
    value: 0
  widgetDataTemplate:
  - forPath: value
    expression: '${ ([ (.rows // [])[] | select(.state=="servable") | (.latest|tonumber) ] | first // 0) }'
  resourcesRefs:
    items: []
{{- end }}
