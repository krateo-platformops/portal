{{/* "Ask Agentiko →" on /observability/traces/{traceId} — the agent entry point for this one trace. It navigates to THIS page with an
     ?ask seed the rail consumes on mount.

     Same object as service-desk-page's button.ticket-ask-autopilot — read the comment there. The
     label and `intent: agentiko` are fixed (A4); `type` and `icon` are ignored, so they are not set.
     The href is built server-side (obs-trace-detail `.askHref`, @uri-encoded); it is "" when there is no trace to ask about (not a trace id, an unanswered read, no span), and the
     click then falls back to /observability?tab=Traces — never a 404. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: trace-detail-ask-agentiko
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the route param. */}}
  keyExtras: [traceId]
  apiRef:
    name: obs-trace-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /observability?tab=Traces
  widgetDataTemplate:
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.askHref // "") != "" then .askHref else "/observability?tab=Traces" end) } ] } }'
  resourcesRefs:
    items: []
