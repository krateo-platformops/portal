{{/* The Components figures over the Deployments (the search narrows them): Deployments, Ready, Not
     ready, Scaled to zero. The colour and the highlighted border come computed (obs-components
     `color`, `highlight`; portal.tileDefs, frontend >= 1.8.93): Not ready above 0 is red and
     highlighted; a 0 and every other tile are neutral. A failed read is an empty value (a muted
     "—") captioned "could not be read", in orange and highlighted, never a 0. A state tile (Ready, Not ready, Scaled to zero) opens the list filtered to that
     state: its route is the matching state chip's (?componentStatus=); the total and a failed read have
     none and stay plain tiles. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-components-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-components
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      navigateTo: '{route}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
