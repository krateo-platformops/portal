{{/* The searched compositions by state, every state (not the picked one alone), a slice per state that
     has any, coloured as /compositions colours its donut (piechart.compositions-by-state). */}}
kind: PieChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-recon-by-state
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-reconciliation
    namespace: {{ $.Values.namespace }}
  widgetData:
    angleField: count
    colorField: state
    colorMap:
      NotReady: red
      Degraded: magenta
      Children unreadable: orange
      Drift: gold
      Paused: gray
      Pending: blue
      Ready: green
    innerRadius: 60
    legend: true
    legendPosition: right
    height: 180
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ .byState // [] }'
  resourcesRefs:
    items: []
