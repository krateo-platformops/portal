{{/* GUARDED by observability.reconcileTracing, matching col.obs-tab-telemetry.yaml, which wraps */}}
{{/* both the items entry and the resourcesRefs entry that reach this CR. Without the guard here */}}
{{/* the CR rendered, applied and reconciled on every install while nothing could ever reach it. */}}
{{- if (.Values.observability | default dict).reconcileTracing }}
{{/* Reconcile latency p95 — EXACT, from the reconcile span Duration (otel_traces) via */}}
{{/* obs-reconcile-perf. Amber = the slow tail worth watching. */}}
kind: Statistic
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-perf-p95
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "20"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [range]
  widgetData:
    title: Reconcile p95
    value: '—'
    valueStyle:
      color: var(--orange-color)
  {{/* HONESTY (IA obs-deepdive): show an em-dash, not "0 ms", when zero reconcile spans are in */}}
  {{/* range (.n == 0) — otherwise "no trace data" reads as "sub-millisecond reconciles". */}}
  {{/* The value is the WHOLE label (duration.label in _duration.tpl: "830 ms", "1.2 s") and */}}
  {{/* there is no suffix: antd groups a value that looks like a number ("1,189"). */}}
  widgetDataTemplate:
  - forPath: value
    expression: '${ {{ include "duration.label" . }} if (.n // 0) == 0 then "—" else (.p95 | durationLabel) end }'
  apiRef:
    name: obs-reconcile-perf
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
