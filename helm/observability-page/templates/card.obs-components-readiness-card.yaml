{{/* "Replicas ready": ready over wanted for the eight largest Deployments (listy.obs-components-readiness). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-components-readiness-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: Replicas ready
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - listies
    items:
    - resourceRefId: obs-components-readiness
  resourcesRefs:
    items:
    - id: obs-components-readiness
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-components-readiness
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
