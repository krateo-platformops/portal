{{/* "What's going wrong": one card per DISTINCT error in the window (obs-error-log-digest, otel_logs
     grouped by service and message, most frequent first; the search narrows them): the service, how
     many times (×N), when it was last seen, and the message. Red, the colour of an ERROR line. The whole
     card opens the full list (the chronological stream) scoped to that service; a group with no
     ServiceName has no route and stays inert. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-error-log-list
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "20"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-error-log-digest
    namespace: {{ $.Values.namespace }}
  widgetData:
    grid:
      gutter: 12
      column: 1
    split: false
    pagination:
      pageSize: 8
    itemTemplate:
      rowVariant: card
      icon: fa-bug
      iconVariant: tile
      primaryText: '{title}'
      secondaryText: '{occ}'
      subPrimaryText: ERROR
      subSecondaryText: '{seen}'
      description: '{msg}'
      cardCta: Open its logs
      navigateTo: '{route}'
      color:
        value: '{level}'
        map:
          ERROR: red
          WARN: orange
        default: red
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ [ (.rows // [])[] | { title: (if (.service // "") == "" then "unknown service" else .service end), msg: (.msg // ""), level: (.level // "ERROR"), occ: (.occ // ""), seen: (.seen // ""), route: (.route // "") } ] }'
  resourcesRefs:
    items: []
