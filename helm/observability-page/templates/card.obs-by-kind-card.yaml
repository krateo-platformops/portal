{{/* "By kind": the eight largest kinds among the searched compositions (listy.obs-by-kind-list). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-by-kind-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: By kind
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - listies
    items:
    - resourceRefId: obs-by-kind-list
  resourcesRefs:
    items:
    - id: obs-by-kind-list
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-by-kind-list
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
