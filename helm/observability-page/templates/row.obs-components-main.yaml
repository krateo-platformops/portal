{{/* The Components body: the components on the left two thirds, the charts on the right third. At
     narrow widths both take the full width and the charts go below. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-components-main
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    allowedResources:
    - cards
    - flexes
    alignment: top
    items:
    - resourceRefId: obs-components-list-card
      size: 16
      xs: 24
      lg: 16
    - resourceRefId: obs-components-side
      size: 8
      xs: 24
      lg: 8
  resourcesRefs:
    items:
    - id: obs-components-list-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-components-list-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: obs-components-side
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-components-side
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
