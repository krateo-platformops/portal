{{- if (.Values.observability | default dict).snowplowSli }}
{{/* ERROR and WARN lines per bucket, parsed from the log body (SeverityText is empty until observability#54). */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-log-levels
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    xField: t
    yField: v
    colorField: series
    slotField: slot
    colorMap:
      "ERROR": red
      "WARN": orange
    area: false
    legend: true
    height: 160
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ (.current // null) as $cur | [ (.rows // [])[] | { t: (.t|tonumber), series: (.level|tostring), v: (.n|tonumber) } | . + (if .t == $cur then { slot: "partial" } else {} end) ] }'
  apiRef:
    name: sp-log-levels
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
