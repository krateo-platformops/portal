{{/* "Top pods by memory", a side card of the Telemetry tab: the bars (listy.obs-top-pods). The `extra`
     shows the live cluster totals (pod CPU cores + memory GiB + pod count) from the RA's totals step —
     e.g. "<cores> cores · <mem> GiB · <n> pods". */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-resource-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "20"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: Top pods by memory
    titleVariant: eyebrow
    variant: outlined
    extra: 'top pods · live'
    allowedResources:
    - listies
    items:
    - resourceRefId: obs-top-pods
  widgetDataTemplate:
  - forPath: extra
    expression: '${ ((.cpu // 0)|tostring) + " cores · " + ((.mem // 0)|tostring) + " GiB · " + ((.pods // 0)|tostring) + " pods" }'
  apiRef:
    name: obs-resource-usage
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items:
    - id: obs-top-pods
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-top-pods
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
