{{/* The compositions, two thirds of the row: "Summary | Full list" top right, then the state chips
     (All by default), a warning when a list or the reconcile traces could not be read, then one card
     per composition in that state, or with ?view=table the full list. When there is nothing to list, or
     the read failed, a line says so instead of an empty list. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-recon-list-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-reconciliation
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Compositions
    titleVariant: eyebrow
    variant: outlined
    extraRefId: obs-recon-view-chips
    allowedResources:
    - listies
    - tables
    - paragraphs
    items:
    - resourceRefId: obs-recon-state-chips
    - resourceRefId: obs-recon-cards
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "obs-recon-state-chips" } ] + (if (.note // "") != "" then [ { resourceRefId: "obs-recon-note" } ] else [] end) + (if .failed or (.matched // 0) == 0 then [ { resourceRefId: "obs-recon-empty" } ] elif .view == "table" then [ { resourceRefId: "obs-recon-table" } ] elif (.more // 0) > 0 then [ { resourceRefId: "obs-recon-cards" }, { resourceRefId: "obs-recon-more" } ] else [ { resourceRefId: "obs-recon-cards" } ] end) }'
  resourcesRefs:
    items:
    - id: obs-recon-view-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-view-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: obs-recon-state-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-state-chips
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: obs-recon-note
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-note
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: obs-recon-cards
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-cards
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
    - id: obs-recon-more
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-more
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
    - id: obs-recon-table
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-table
      namespace: {{ $.Values.namespace }}
      resource: tables
      verb: GET
    - id: obs-recon-empty
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-recon-empty
      namespace: {{ $.Values.namespace }}
      resource: paragraphs
      verb: GET
