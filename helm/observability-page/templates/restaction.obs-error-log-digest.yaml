{{/* Error-log digest from ClickHouse (clickstack otel_logs). Component logs carry level+msg */}}
{{/* INSIDE the Body JSON (SeverityText is empty at ingest), so both are parsed with */}}
{{/* JSONExtractString(Body,'level'|'msg'). Only ERROR is surfaced — WARN is ~200x noisier */}}
{{/* (snowplow per-request warns) and drowns the signal. Step `digest` GROUPs the selected window by */}}
{{/* service+msg → the DISTINCT problems with an occurrence count + last-seen (collapses the */}}
{{/* same error repeating every reconcile into one row, ordered most-frequent-first). Step */}}
{{/* `tot` is the headline totals. External-fetch endpointRef, ClickHouse FORMAT JSON. */}}
{{/* */}}
{{/* COUNT-VS-ROWS (Vincenzo R): the grouping message is COALESCEd */}}
{{/* msg-from-Body-JSON → raw Body → 'unlabeled error' (truncated to 160), and `digest` NO LONGER */}}
{{/* filters `msg!=''`. Previously an error line whose Body wasn't the {level,msg} JSON shape */}}
{{/* extracted an empty msg, and the digest-only `AND msg!=''` guard dropped EVERY grouped row → */}}
{{/* digest.data=[] → the list rendered "No data" while the header (from `tot`, which had no such */}}
{{/* guard) still counted e.g. "130185 errors · 97 distinct". `tot`'s distinct_problems now uses the */}}
{{/* SAME coalesced expression so the headline reconciles with the rendered groups. */}}
{{/* */}}
{{/* PARTITION PRUNING (2026-09-14): the time filter is on TimestampTime, NOT Timestamp — the same */}}
{{/* rule already documented in restaction.obs-log-stream.yaml. otel_logs is PARTITION BY */}}
{{/* toDate(TimestampTime) with sorting key (ServiceName, TimestampTime, Timestamp), so a predicate */}}
{{/* on the DateTime64 `Timestamp` prunes NOTHING and reads the whole table. Measured live on */}}
{{/* krateo-057: `Timestamp >` read 51,278,220 rows / 604 MB in 3.56 s; `TimestampTime >` read */}}
{{/* 7,686,876 rows / 193 MB in 2.57 s for an identical 24h result — 6.7x less I/O. Both steps were */}}
{{/* timing out (`context deadline exceeded`) under concurrent load. Keep max(Timestamp) in the */}}
{{/* SELECT: display stays on the precise DateTime64; only the WHERE moves to the partition key. */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: obs-error-log-digest
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    - name: digest
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then "1%20HOUR" elif $r=="24h" then "24%20HOUR" elif $r=="7d" then "7%20DAY" else "24%20HOUR" end) as $iv | "/?query=SELECT%20ServiceName%20AS%20service%2C%20substring%28coalesce%28nullIf%28JSONExtractString%28Body%2C%27msg%27%29%2C%27%27%29%2C%20nullIf%28Body%2C%27%27%29%2C%20%27unlabeled%20error%27%29%2C1%2C160%29%20AS%20msg%2C%20count%28%29%20AS%20occurrences%2C%20formatDateTime%28max%28Timestamp%29%2C%20%27%25Y-%25m-%25dT%25H%3A%25i%3A%25SZ%27%29%20AS%20last_ts%20FROM%20otel_logs%20WHERE%20lower%28JSONExtractString%28Body%2C%27level%27%29%29%3D%27error%27%20AND%20TimestampTime%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%20GROUP%20BY%20service%2C%20msg%20ORDER%20BY%20occurrences%20DESC%20LIMIT%2040%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: digestError
    - name: tot
      endpointRef:
        name: clickhouse-endpoint
        namespace: {{ .Release.Namespace }}
      path: '${ (.range // "24h") as $r | (if $r=="1h" then "1%20HOUR" elif $r=="24h" then "24%20HOUR" elif $r=="7d" then "7%20DAY" else "24%20HOUR" end) as $iv | "/?query=SELECT%20count%28%29%20AS%20total%2C%20uniqExact%28%28ServiceName%2C%20substring%28coalesce%28nullIf%28JSONExtractString%28Body%2C%27msg%27%29%2C%27%27%29%2C%20nullIf%28Body%2C%27%27%29%2C%20%27unlabeled%20error%27%29%2C1%2C160%29%29%29%20AS%20distinct_problems%20FROM%20otel_logs%20WHERE%20lower%28JSONExtractString%28Body%2C%27level%27%29%29%3D%27error%27%20AND%20TimestampTime%20%3E%20now%28%29%20-%20INTERVAL%20" + $iv + "%20FORMAT%20JSON" }'
      verb: GET
      headers:
        - 'Accept: application/json'
      continueOnError: true
      errorKey: totError
  {{/* digest => {data:[{service,msg,occurrences,last_ts}]}; tot => {data:[{total,distinct_problems}]}. */}}
  {{/* Each row gains a server-baked `route` into the log stream scoped to its component */}}
  {{/* (/observability?serviceName= — the same hand-off the component-detail logs CTA uses); a row */}}
  {{/* with no ServiceName carries route:"" and stays INERT in the list. */}}
  {{/* */}}
  {{/* `failed`: A FAILED READ IS NOT A CLEAN ESTATE. Both steps run under continueOnError, and the */}}
  {{/* `// []` and `// 0` guards below turned a ClickHouse error (a timeout, an auth failure, the */}}
  {{/* endpoint missing) into rows:[] and total:0 — exactly what a platform with no errors returns, */}}
  {{/* so the page, and a prompt built from it, would have said "no errors". A step counts as read */}}
  {{/* only when it carries no error AND its result is an object (the obs-composition-staleness rule). */}}
  {{/* `readError` is the first step's error text, for the prompt. */}}
  {{/* */}}
  {{/* askHref: "Ask Agentiko →" in the page header (button.observability-ask-agentiko). THIS page */}}
  {{/* with the filters the person has on it (range, tab, the log and trace filters, projects) and an */}}
  {{/* ?ask seed, @uri-encoded once. Worded per case: the most frequent errors (top 8, numbered), a */}}
  {{/* clean window, or a read that failed — never the clean claim on a failure. The window named is */}}
  {{/* the one the SQL above READ: it knows 1h, 24h and 7d, and reads anything else (the page's 6h */}}
  {{/* chip included) as 24 hours, so a 6h prompt says "24 hours" rather than claim a window it did */}}
  {{/* not look at. */}}
  {{/* Literal `|` block (NOT folded `>`). */}}
  filter: |
    def cap($n): if length > $n then (.[0:($n - 1)] + "…") else . end;
    def stepRead($k; $e): ((.[$k] | type) == "object") and (.[$e] == null);
    ((.range // "24h") | tostring) as $r
    | (if $r == "1h" then "hour" elif $r == "7d" then "7 days" else "24 hours" end) as $window
    | (stepRead("digest"; "digestError") and stepRead("tot"; "totError") | not) as $failed
    | ([ .digestError, .totError ] | map(select(. != null) | if type == "string" then . else tojson end) | first // "") as $err
    | (((.digest | objects | .data) // []) | map(. + { route: ((.service // "") as $s | if $s == "" then "" else ("/observability?serviceName=" + ($s | @uri) + "&tab=Telemetry") end) })) as $rows
    | (((.tot | objects | .data) // [])[0].total // 0) as $total
    | (((.tot | objects | .data) // [])[0].distinct_problems // 0) as $distinct
    | ([ $rows[0:8] | to_entries[] | (((.key) + 1) | tostring) + ". " + (if (.value.service // "") != "" then .value.service else "unknown" end) + " — \"" + ((.value.msg // "") | cap(110)) + "\" (x" + ((.value.occurrences // 0) | tostring) + ")" ] | join(" ")) as $top
    | (if $failed then
         "The telemetry for this page could not be read (" + ($err | cap(300)) + "). Explain what that means and what to check."
       elif ($rows | length) == 0 then
         "My platform logged no errors in the last " + $window + ". Check reconciliation, performance and resource usage on this page and tell me whether anything needs attention."
       else
         "Assess my platform's health from its telemetry over the last " + $window + ": " + ($total | tostring) + " error lines, "
         + ($distinct | tostring) + " distinct problems; the most frequent are: " + $top + ". Explain the likely root causes and which ones matter,"
         + " and give concrete, ordered recovery steps; where a fix is a safe Kubernetes change, propose it so I can confirm it."
       end) as $ask
    | . as $x
    | ([ "range", "tab", "serviceName", "limit", "traceService", "traceUser", "traceStatus", "projects" ]
       | map(. as $k | (($x[$k] // "") | tostring) as $v | select($v != "") | $k + "=" + ($v | @uri) + "&") | join("")) as $keep
    | { rows: $rows,
        total: $total,
        distinct: $distinct,
        failed: $failed,
        readError: $err,
        askHref: ("/observability?" + $keep + "ask=" + ($ask | @uri)) }
