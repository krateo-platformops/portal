{{/* Titled panel around the ERROR-log digest list. GROUPED, COUNTED, most-frequent-first — the */}}
{{/* distinct problems, collapsing the same error repeating every reconcile into one counted row */}}
{{/* (the chronological complement is the "Live error & warning stream" card below). R2 #13: the */}}
{{/* title says "Top recurring errors" so grouped-vs-chronological reads at a glance; the `extra` */}}
{{/* shows the live headline totals (total error lines + distinct problems over the selected */}}
{{/* window) from the same RA's `tot` step + a "grouped" cue — so the header reads e.g. */}}
{{/* "1495 errors · 15 distinct · grouped". */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-errors-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "20"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [range]
  widgetData:
    title: Top recurring errors
    titleVariant: eyebrow
    variant: outlined
    extra: 'grouped · most frequent first'
    items:
    - resourceRefId: obs-error-log-list
  widgetDataTemplate:
  {{/* On a failed read the totals are not zero, they are unknown: obs-error-log-digest's `failed`
       says so, so the header does not read "0 errors · 0 distinct" over an estate nobody looked at. */}}
  - forPath: extra
    expression: '${ if (.failed // false) then "telemetry could not be read" else ((.total // 0)|tostring) + " errors · " + ((.distinct // 0)|tostring) + " distinct · grouped" end }'
  {{/* NO Agentiko button here any more. The page has ONE entry point, in its header
       (button.observability-ask-agentiko), and it carries these errors: its prompt is built from the
       same digest. This card used to host "Ask Agentiko →" (obs-errors-diagnose), which sent the top
       errors to /incidents, so the page had two entry points saying different things. */}}
  apiRef:
    name: obs-error-log-digest
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items:
    - id: obs-error-log-list
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-error-log-list
      namespace: {{ $.Values.namespace }}
      resource: listies
      verb: GET
