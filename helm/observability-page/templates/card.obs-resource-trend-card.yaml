{{/* Titled panel around the cluster resource-usage TREND (R2 #15): two line charts on one time */}}
{{/* axis, CPU in cores (obs-resource-usage-cpu) above Memory in GiB (obs-resource-usage-mem), both */}}
{{/* from obs-resource-usage-series (charts mockup, CHART-4). The trend companion to the live */}}
{{/* top-pods snapshot (obs-resource-card). Static eyebrow header; each chart's title names its */}}
{{/* series. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-resource-trend-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    title: Resource usage trend
    titleVariant: eyebrow
    variant: outlined
    extra: 'cluster total'
    items:
    - resourceRefId: obs-resource-usage-cpu
    - resourceRefId: obs-resource-usage-mem
  resourcesRefs:
    items:
    - id: obs-resource-usage-cpu
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-resource-usage-cpu
      namespace: {{ $.Values.namespace }}
      resource: linecharts
      verb: GET
    - id: obs-resource-usage-mem
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: obs-resource-usage-mem
      namespace: {{ $.Values.namespace }}
      resource: linecharts
      verb: GET
