{{- if (.Values.observability | default dict).snowplowSli }}
{{/* L1 dispatch lookups per bucket. After warm-up the invariant is ~100% hit. */}}
{{/* Series under plain names (visual audit CHART-4: "snowplow_cache_diagnostic_total" on a legend); the map is
     the SQL's raw series key to its name, and a key it does not know is drawn as itself. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: sp-l1-lookups
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "30"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      "Hit": green
      "Miss": orange
      "Seed hit": cyan
    shapeField: smooth
    area: false
    legend: true
    height: 180
    xTimeUnit: hour
    point: false
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 6
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ [ (.rows // [])[] | { t: (.t|tonumber), series: ((.outcome|tostring) as $k | {"hit": "Hit", "miss": "Miss", "seed_hit": "Seed hit"}[$k] // $k), v: (.d|tonumber) } ] }'
  apiRef:
    name: sp-l1-lookups
    namespace: {{ $.Values.namespace }}
  resourcesRefs:
    items: []
{{- end }}
