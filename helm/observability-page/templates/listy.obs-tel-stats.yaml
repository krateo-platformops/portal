{{/* The Telemetry figures, off obs-error-log-digest: Error lines, Distinct problems and Services erroring
     in the window (with a search, over the matching problems among the 40 most frequent), each red and
     highlighted above 0 only, the colour the error cards give an ERROR line, and neutral at 0; and the
     window the logs were read over, neutral. The colour and the highlight come computed
     (obs-error-log-digest `color`, `highlight`; portal.tileDefs, frontend >= 1.8.93). A failed read
     is an empty value (a muted "—") captioned "could not be read", in orange and highlighted, never a 0. No tile is a state with a filter, so every route is "" and each stays a plain
     tile; navigateTo is wired so a state tile would need only its route. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-tel-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
    "krateo.io/external-cache-ttl-seconds": "20"
spec:
  keyExtras: [projects, range, tab, serviceName, limit, traceService, traceUser, traceStatus, latencyBy, status, componentStatus, q, view]
  apiRef:
    name: obs-error-log-digest
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      navigateTo: '{route}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
