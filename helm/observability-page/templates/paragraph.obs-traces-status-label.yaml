{{/* Eyebrow label of the Traces tab's status filter (installer#404). */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: obs-traces-status-label
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): the Traces tab's chips put these in the URL. */}}
  keyExtras: [projects, range, tab, traceService, traceUser, traceStatus]
  widgetData:
    text: 'Status'
    variant: eyebrow
  resourcesRefs:
    items: []
