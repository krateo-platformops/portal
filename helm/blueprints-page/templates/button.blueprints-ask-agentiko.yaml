{{/* "Ask Agentiko →" on /blueprints — the assistant entry point for the blueprints in view. It
     navigates to THIS page with an ?ask seed the rail consumes on mount, keeping ?category, ?q and
     ?projects, so the prompt is about the cards the person is looking at.

     Same object as service-desk-page's button.ticket-ask-autopilot — read the comment there. The
     label and `intent: agentiko` are fixed (A4); `type` and `icon` are ignored, so they are not set.
     The header has no primary, so this is its only action.

     The href is built server-side (the shell's blueprints-cards `.askHref`, @uri-encoded) from the
     same `.cards` the grid shows: ready, failing to reconcile with the reason, still installing —
     or the read error when nothing could be read. The click is a plain literal navigate. */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprints-ask-agentiko
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* The extras keys that partition this widget's cache cell: the same set as the grid. */}}
  keyExtras: [category, projects, q]
  apiRef:
    name: blueprints-cards
    namespace: {{ .Release.Namespace }}
  widgetData:
    label: Ask Agentiko →
    intent: agentiko
    size: middle
    clickActionId: ask
    actions:
      navigate:
        - id: ask
          type: navigate
          path: /blueprints
  widgetDataTemplate:
    {{/* Server-built self-page href with the ?ask seed; falls back to the list, never a 404. */}}
    - forPath: actions
      expression: '${ { navigate: [ { id: "ask", type: "navigate", path: (if (.askHref // "") != "" then .askHref else "/blueprints" end) } ] } }'
  resourcesRefs:
    items: []
