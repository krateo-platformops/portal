{{/* The blueprint can't be served (portal#542): its CompositionDefinition's Ready is False with a */}}
{{/* reason core-provider declares failed. ONE red Alert, for the reason that applies, never a legend */}}
{{/* of all reasons: the title is the portal's sentence for it, the body core-provider's action (who */}}
{{/* acts is in those words, never a field name), the reason its tag, and the condition's message */}}
{{/* under the collapsed "Details". Built by blueprint-detail's definitionAlert (cdReadyFailedAlert, */}}
{{/* _reason-actions.tpl, generated by scripts/gen-reason-defs.py). Mounted by page-blueprint-detail */}}
{{/* under the header only when there is one. Approved mockup, revision 3, "cannot be served": */}}
{{/* https://claude.ai/artifact/Bph22m9bPiwBg17Yx1gpAQ (project/DefinitionFailed.dc.html). */}}
kind: Alert
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-blueprint-detail-definition-failed
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    title: ""
    type: error
    showIcon: true
  apiRef:
    name: blueprint-detail
    namespace: {{ $.Values.namespace }}
  widgetDataTemplate:
    - forPath: title
      expression: '${ .definitionAlert.title // "" }'
    - forPath: description
      expression: '${ .definitionAlert.action // "" }'
    - forPath: tag
      expression: '${ .definitionAlert.reason // "" }'
    - forPath: details
      expression: '${ .definitionAlert.message // "" }'
  resourcesRefs:
    items: []
