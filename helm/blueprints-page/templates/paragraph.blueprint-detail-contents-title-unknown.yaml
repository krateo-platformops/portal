{{/* card.blueprint-detail-contents: the title when the chart cannot render at its defaults (orange). */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-detail-contents-title-unknown
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace]
  apiRef:
    name: blueprint-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ""
    type: warning
    strong: true
  widgetDataTemplate:
    - forPath: text
      expression: '${ .contents.title // "" }'
  resourcesRefs:
    items: []
