{{/* Header action row for the blueprint detail page — Create (primary, instantiate) + */}}
{{/* Deploy to fleet (W3-1: fan out one CompositionDefinition per selected spoke, via drawer) */}}
{{/* + Delete (danger, uninstall), side by side. The version update is a separate Form lower */}}
{{/* on the page. "Ask Agentiko →" sits immediately left of Create: filled like every agent entry */}}
{{/* point (A4), it does not take the container's one primary (P6). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-detail-actions
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  widgetData:
    allowedResources:
      - buttons
    vertical: false
    gap: small
    items:
      - resourceRefId: blueprint-detail-marketplace
      - resourceRefId: blueprint-detail-fleet
      - resourceRefId: blueprint-detail-ask-agentiko
      - resourceRefId: blueprint-detail-create
      - resourceRefId: blueprint-detail-delete
  resourcesRefs:
    items:
      - id: blueprint-detail-marketplace
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-detail-marketplace
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
      - id: blueprint-detail-ask-agentiko
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-detail-ask-agentiko
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
      - id: blueprint-detail-create
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-detail-create
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
      - id: blueprint-detail-fleet
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-detail-fleet
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
      - id: blueprint-detail-delete
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-detail-delete
        namespace: {{ $.Values.namespace }}
        resource: buttons
        verb: GET
