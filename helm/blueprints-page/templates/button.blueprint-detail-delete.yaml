{{/* "Uninstall" — remove the blueprint by DELETEing its CompositionDefinition. The label pairs */}}
{{/* with the Marketplace "Install" verb (UX-audit #10: one verb per operation — Install/Uninstall */}}
{{/* for blueprints, Create/Delete reserved for composition and resource instances) and matches */}}
{{/* the success toast. Destructive, so requireConfirmation gates it behind the engine's confirm */}}
{{/* modal; RBAC via the user token. On success the engine redirects to /blueprints. Target GVR */}}
{{/* resolved server-side (.gvr) — no hardcode. A DELETE removes the object directly (no */}}
{{/* controller needed), effective on any cluster. */}}
{{/* */}}
{{/* It lives under the header's "⋯" menu (dropdown.blueprint-detail-more, UX audit BP-4). The confirm */}}
{{/* modal says the page's words through the rest action's `confirmation` (blueprint-detail's */}}
{{/* `confirmation`): "Uninstall <name>?", what it removes, and, when compositions were created from */}}
{{/* it, an amber Alert listing them with their state; the engine's own facts and YAML fold under */}}
{{/* "What will be sent". NEEDS the frontend release that reads `confirmation` */}}
{{/* (feat/rest-action-confirmation; blueprints-page's krateo.io/requires-frontend-crd floor). */}}
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-detail-delete
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: blueprint-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    label: Uninstall
    icon: fa-trash
    type: default
    danger: true
    size: middle
    clickActionId: delete
    actions:
      rest:
        - id: delete
          type: rest
          resourceRefId: delete-compdef
          headers:
            - 'Accept: application/json'
          requireConfirmation: true
          successMessage: Blueprint uninstalled
          onSuccessNavigateTo: /blueprints
          loading:
            display: true
  widgetDataTemplate:
    - forPath: actions.rest[0].confirmation
      expression: '${ .confirmation }'
  resourcesRefs:
    items: []
  resourcesRefsTemplate:
    - template:
        id: delete-compdef
        apiVersion: ${ .gvr.apiVersion }
        resource: ${ .gvr.resource }
        name: ${ .gvr.name }
        namespace: ${ .gvr.namespace }
        verb: DELETE
