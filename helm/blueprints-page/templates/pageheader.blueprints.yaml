{{/* The /blueprints page header — title and subtitle in one CR. */}}
{{/* */}}
{{/* Replaces three: flex.blueprints-header (a vertical Flex whose only job was to stack them), */}}
{{/* paragraph.blueprints-title and paragraph.blueprints-subtitle. */}}
{{/* */}}
{{/* There is no right-side action here and that is deliberate, carried over from the Flex it */}}
{{/* replaces: on this page the blueprint IS the entry point (selecting a tile starts "Configure"), */}}
{{/* so a generic header button would be a second, weaker route to the same thing. */}}
{{/* */}}
{{/* No `counter` either. The count belongs to blueprints-filterbar directly below, which already */}}
{{/* shows it per category — a bare total beside the title would be the same number twice, and the */}}
{{/* two would disagree the moment a filter is applied. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprints-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    title: Blueprints
    {{/* The decided verbs: a blueprint is INSTALLED (from the Marketplace) and a composition is */}}
    {{/* CREATED from it. Every blueprint on this page is installed already, so the page's verb is */}}
    {{/* Create; "install a blueprint to create a composition" put the Marketplace's verb on the */}}
    {{/* action this page does not offer (UX audit BP-3). */}}
    subtitle: >-
      The blueprints installed on this Platform. Create a composition, a running instance, from one
      of them in your namespace.
    {{/* "Ask Agentiko →" is the header's only action: the page has no primary. */}}
    allowedResources:
    - buttons
    items:
    - resourceRefId: blueprints-ask-agentiko
  resourcesRefs:
    items:
    - id: blueprints-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprints-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
