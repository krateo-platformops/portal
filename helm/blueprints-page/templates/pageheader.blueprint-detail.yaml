{{/* The /blueprints/{namespace}/{name} page header — the blueprint's name, its health pill, the */}}
{{/* CompositionDefinition line and the page's four actions, in one CR. */}}
{{/* */}}
{{/* Replaces SIX: flex.blueprint-detail-header-block, flex.blueprint-detail-title-line, */}}
{{/* flex.blueprint-detail-title-stack, paragraph.blueprint-detail-title, tag.blueprint-detail-status */}}
{{/* and paragraph.blueprint-detail-subtitle. Three levels of Flex to arrange four things. */}}
{{/* */}}
{{/* ACTIONS MOVE UP A ROW, and that is the intended shape rather than a side effect. They used to sit */}}
{{/* BESIDE the subtitle on row two (title-stack was `vertical: false`, subtitle and actions in one */}}
{{/* line); PageHeader right-aligns them on the title line, where a page's actions belong. The actions */}}
{{/* Flex itself is kept and referenced — it carries the four Buttons' order and grouping, and this */}}
{{/* migration has no business reshuffling them. */}}
{{/* */}}
{{/* TWO COLOURS HAD TO CHANGE, because PageHeader's tags take a palette colour NAME from a closed */}}
{{/* enum (blue|darkBlue|orange|gray|red|green|violet) and the Tag emitted two that are not in it: */}}
{{/* */}}
{{/* orange    -> orange   BYTE-IDENTICAL. tokens.ts gives orange and orange the same hex in both */}}
{{/* themes (#8A5C00 light, #FFAA00 dark), so the Pending pill is unchanged. */}}
{{/* default -> gray     A REAL CHANGE, and an improvement. `default` is not a palette key at all, */}}
{{/* so getColorCode fell through to `palette.dark` — near-black ink (#141414) */}}
{{/* on a 15% tint. That was the fallback, not a decision. `gray` (#5C5C5C) is */}}
{{/* the deliberate neutral. Only the Unknown pill (no conditions) is affected. */}}
{{/* */}}
{{/* THE TWO TAG TEMPLATES BECOME ONE. Both ran the same five-way branch over the same `$c`/`$ready`/ */}}
{{/* `$unsynced` prelude — once for `label`, once for `color` — so an edit to one and not the other */}}
{{/* produced a pill whose word and colour disagreed. Evaluated once now, word and colour together. */}}
{{/* */}}
{{/* THE PILL PRINTS THE KUBERNETES WORD (portal#543), as the composition header does: one PascalCase */}}
{{/* token from the object's own conditions, never an invented one ("Healthy", "Degraded", "Drift"): */}}
{{/*   ready       Ready         green   Ready=True (Available, ScaledToZero, UpdateWithheldByPolicy) */}}
{{/*   failed      NotReady      red     a Ready reason whose verdict is failed (Ready=False) */}}
{{/*               NotSynced     red     otherwise Synced=False: the pass failed (e.g. NotObserved + error) */}}
{{/*   drift       NotSynced     violet  Ready=True, Synced=False: still serving, the last pass failed */}}
{{/*   installing  <Ready reason> orange Creating / Deleting; Pending while there is no Ready condition yet */}}
{{/*   unobserved  <Ready reason> orange NotObserved (Unknown when the condition carries no reason) */}}
{{/*   paused      Paused        gray    Synced=False/ReconcilePaused */}}
{{/*   no conditions  Unknown    gray */}}
{{/* */}}
{{/* NOTREADY IS A FAILED READY, NOT "ANY CONDITION FALSE". A CompositionDefinition's health is Ready */}}
{{/* plus Synced (core-provider). Its other conditions can be False on a healthy definition: */}}
{{/* AuthnMappingApplied=False/AuthnNotInstalled (no authn CRD on the controller's cluster), */}}
{{/* ControllerActive=False/ScaledToZero (an idle opted-in controller), SchemaFullyEnforced=False and */}}
{{/* AuthnDelegation=False are informational, and ApiRefRBACComplete=False only explains a Synced=False. */}}
{{/* The old "any False" arm read a converging definition (Ready Unknown) carrying one of those as */}}
{{/* failed instead of converging. scripts/test-blueprint-header-pill.py runs this jq over each case. */}}
{{/* */}}
{{/* THE STATE IS cdState (_cd-ready-reasons.tpl), the same one the blueprint cards read: the Ready */}}
{{/* reason classified by the verdict core-provider declares for it (docs/cd-ready-reasons.md, */}}
{{/* CI-checked). So a CONVERGING Ready=False (Creating, Deleting) reads its reason in orange, not */}}
{{/* NotReady; a failed one (Unavailable, RemoteChartUnreachable, SchemaDefaultContradiction) reads */}}
{{/* NotReady; Synced=False/ReconcilePaused reads Paused (gray), as a paused composition's header does. */}}
{{/* */}}
{{/* keyExtras is the UNION: the Tag declared [name, namespace, status] where the others declared */}}
{{/* [name, namespace]. Union is the safe direction — an extra key that never arrives partitions */}}
{{/* consistently, while a missing one serves another blueprint's header from this one's cache cell. */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-detail-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  keyExtras: [name, namespace, status]
  apiRef:
    name: blueprint-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    title: Blueprint
    subtitle: ""
    tags:
    - label: Unknown
      color: gray
    allowedResources:
    - flexes
    items:
    - resourceRefId: blueprint-detail-actions
  widgetDataTemplate:
    {{/* Was paragraph.blueprint-detail-title's `forPath: text`. */}}
    - forPath: title
      expression: '${ .name }'
    {{/* Was paragraph.blueprint-detail-subtitle's `forPath: text`, lifted verbatim. */}}
    - forPath: subtitle
      expression: '${ "CompositionDefinition · " + (.namespace // "?") + " · created " + ((.created // "") as $ts | if ($ts | length) == 0 then "?" else ((now - ($ts | fromdateiso8601)) as $sec | if $sec < 60 then "just now" elif $sec < 3600 then ((($sec/60)|floor)|tostring) + "m ago" elif $sec < 86400 then ((($sec/3600)|floor)|tostring) + "h ago" else ((($sec/86400)|floor)|tostring) + "d ago" end) end) }'
    {{/* Was the Tag's TWO templates, fused into one branch so label and colour cannot disagree. */}}
    - forPath: tags
      expression: '${ {{ include "portal.cdReadyDefs" . }} (.detail.status.conditions // []) as $c | ([ $c[]? | select(.type == "Ready") ][0] // {}) as $r | (($r.reason // "") | tostring) as $why | [ ( if ($c | length) == 0 then {label:"Unknown", color:"gray"} else ($c | cdState | .state) as $st | if $st == "ready" then {label:"Ready", color:"green"} elif $st == "drift" then {label:"NotSynced", color:"violet"} elif $st == "failed" then (if ((cdReadyVerdict[$why] // (if $r.status == "False" then "failed" else "" end)) == "failed") then {label:"NotReady", color:"red"} else {label:"NotSynced", color:"red"} end) elif $st == "installing" then {label:(if $why != "" then $why else "Pending" end), color:"orange"} elif $st == "unobserved" then {label:(if $why != "" then $why else "Unknown" end), color:"orange"} elif $st == "paused" then {label:"Paused", color:"gray"} else {label:"Unknown", color:"gray"} end end ) ] }'
    {{/* THE STATE IS ABOUT AN OLDER SPEC (approved mockup "Older Spec Note", 2026-11-25): core-provider */}}
    {{/* >= 2.13.130 says which version its status describes (status.observedGeneration). While that is */}}
    {{/* below metadata.generation, a change was applied and not processed yet: the pill stays (still */}}
    {{/* true of what runs) and a quiet note says it is about to change. No observedGeneration (an older */}}
    {{/* core-provider), equal, or ahead: no note. core-provider advances it on every verdict about the */}}
    {{/* current spec, a failing one included, so a failure on the new spec shows as the pill; it stays */}}
    {{/* behind while the update applies, is paused or withheld, or errors before a verdict. Ignored */}}
    {{/* while the definition is being deleted. */}}
    - forPath: note
      expression: '${ (.detail.metadata.generation // null) as $g | (.detail.status.observedGeneration // null) as $o | if ($g | type) == "number" and ($o | type) == "number" and $o < $g and ((.detail.metadata.deletionTimestamp // "") == "") then { text: "about the previous version · updating", tooltip: ("This state is from version " + ($o | tostring) + " of the definition; version " + ($g | tostring) + " has not been evaluated yet: it may still be applying, be paused, or be failing before a verdict.") } else { text: "" } end }'
  resourcesRefs:
    items:
    - id: blueprint-detail-actions
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: blueprint-detail-actions
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
