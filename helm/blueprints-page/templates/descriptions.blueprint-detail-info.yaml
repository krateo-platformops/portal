{{/* Blueprint info rows (chart / installed version / latest version / upgrades / status / synced), */}}
{{/* shaped server-side by the blueprint-detail RA. Hosted inside card-blueprint-detail-info (the */}}
{{/* Flex allowedResources enum has no `descriptions`, so it must be nested in a Card). */}}
kind: Descriptions
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: descriptions-blueprint-detail-info
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: blueprint-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    column: 1
    bordered: true
    size: small
    items: []
  {{/* Ready/Synced arrive as raw condition strings ("True"/"False"/"Unknown") — mapped to human */}}
  {{/* words here (never leak a bare boolean into prose UI). No Created row: the page header says */}}
  {{/* "created 49d ago" already, and this row and the Metadata card's said it twice more, past ~60 */}}
  {{/* days as a date beside the header's age (UX audit BP-4). "Latest version" is latestLabel, which */}}
  {{/* says "not known: …" and why when the catalog holds no version of this chart. "Upgrades" follows it */}}
{{/* (portal#558): what spec.upgradePolicy means, and how many compositions are on an older version, */}}
{{/* linked to them; no upgradePolicy (an older core-provider), no row. */}}
  widgetDataTemplate:
    - forPath: items
      expression: '${ [ { label: "Chart", value: (.chart // "") }, { label: "Installed version", value: (.currentVersion // "") }, { label: "Latest version", value: (.latestLabel // .latestVersion // "") } ] + (if ((.upgrades.line // "") | tostring) != "" then [ { label: "Upgrades", value: (.upgrades.line | tostring) } + (if ((.upgrades.href // "") | tostring) != "" then { href: (.upgrades.href | tostring) } else {} end) ] else [] end) + (if ((.inputs // "") | tostring) != "" then [ { label: "Inputs", value: (.inputs | tostring) } + (if ((.inputsHref // "") | tostring) != "" then { href: (.inputsHref | tostring) } else {} end) ] else [] end) + (if ((.migratedValues.line // "") | tostring) != "" then [ { label: "Values check", value: (.migratedValues.line | tostring) } ] else [] end) + [ { label: "Ready", value: (.ready // "Unknown") }, { label: "Synced", value: (.synced // "Unknown") } ] }'
  resourcesRefs:
    items: []
