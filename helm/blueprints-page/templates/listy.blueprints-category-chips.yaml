{{/* Blueprints origin filter (UX audit BP-3, approved mockup) — ONE data-driven Listy(chip): All, */}}
{{/* Platform (installed with the Platform) and Added (installed from the Marketplace or a Builder), */}}
{{/* each with its count. The chips are the shell's blueprints-cards `.origins` ({label, count, */}}
{{/* active, route}), so the counts are the cards the grid's other filters (?q, ?projects) show and */}}
{{/* each route keeps ?q and ?projects; ?origin=platform|added is the `origin` extra blueprints-cards */}}
{{/* filters by. They replace three fixed tier chips (Platform, Observability, Blueprint), which */}}
{{/* named the installer's grouping (the krateo.io/tier label), not what a blueprint is. An old */}}
{{/* ?category= link shows All. The file keeps its name so the filter bar's ref is unchanged. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprints-category-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell — `origin` drives */}}
  {{/* the active flag, `q`/`projects` the counts and the routes. The same set as the grid. */}}
  keyExtras: [origin, projects, q]
  apiRef:
    name: blueprints-cards
    namespace: {{ .Release.Namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ .origins // [] }'
  resourcesRefs:
    items: []
