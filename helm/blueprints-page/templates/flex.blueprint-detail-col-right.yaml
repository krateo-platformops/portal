{{/* Right column (narrower): Update version (form card) + Preview update impact (the ?to= */}}
{{/* picker card, mounted server-side ONLY when the helm index lists a version other than the */}}
{{/* installed one — nothing to update to ⇒ no preview chrome) + Metadata. Items are templated */}}
{{/* off the same blueprint-detail RA the column's cards already read; resourcesRefs stay */}}
{{/* static (unmounted children are never fetched — page-incident-detail pattern). */}}
{{/* Both cards belong to the update flow, so both are mounted only for a caller allowed to PATCH */}}
{{/* the CompositionDefinition (blueprint-detail's `may.update`, SelfSubjectAccessReview). */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-detail-col-right
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): extras keys that partition this widget's cache cell. */}}
  keyExtras: [name, namespace]
  apiRef:
    name: blueprint-detail
    namespace: {{ $.Values.namespace }}
  widgetData:
    vertical: true
    gap: middle
    allowedResources:
      - cards
    items:
      - resourceRefId: card-blueprint-detail-contents
      - resourceRefId: card-blueprint-detail-update
  {{/* "What it creates" leads the column, for every reader (UX review round 3); the update card and */}}
  {{/* the impact picker follow only for one who may update the blueprint. */}}
  widgetDataTemplate:
    - forPath: items
      expression: >-
        ${ [ { resourceRefId: "card-blueprint-detail-contents" } ] + if .may.update == false then []
        else [ { resourceRefId: "card-blueprint-detail-update" } ]
        + (if (((.availableVersions // []) - [(.currentVersion // "")]) | length) > 0 then [ { resourceRefId: "card-blueprint-impact-picker" } ] else [] end) end }
  resourcesRefs:
    items:
      - id: card-blueprint-detail-contents
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-blueprint-detail-contents
        namespace: {{ $.Values.namespace }}
        resource: cards
        verb: GET
      - id: card-blueprint-detail-update
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-blueprint-detail-update
        namespace: {{ $.Values.namespace }}
        resource: cards
        verb: GET
      - id: card-blueprint-impact-picker
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-blueprint-impact-picker
        namespace: {{ $.Values.namespace }}
        resource: cards
        verb: GET
