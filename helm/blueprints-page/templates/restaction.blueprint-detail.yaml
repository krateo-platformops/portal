{{/* Blueprint DETAIL data source — resolves ONE installed blueprint (its CompositionDefinition, */}}
{{/* from ?extras .namespace/.name = route /blueprints/{namespace}/{name}) and joins the krateo-blueprints */}}
{{/* helm index to discover the AVAILABLE versions (for the version-picker / update). Returns ONLY */}}
{{/* raw, server-shaped data; each detail widget slices its own view from this: */}}
{{/* detail            : the full CompositionDefinition (managedFields stripped) */}}
{{/* name / namespace  : identity (echoed from the object, falling back to extras) */}}
{{/* chart             : the chart name (spec.chart.repo) or its url */}}
{{/* currentVersion    : spec.chart.version (installed) */}}
{{/* availableVersions : every version the helm index lists for this chart (+ current), unique */}}
{{/* latestVersion / updateAvailable : best-effort newest vs installed */}}
{{/* ready / synced / created : status surface */}}
{{/* versionSchema / versionInitial : the update Form's JSON schema (version enum) + initial value */}}
{{/* gvr               : PATCH/DELETE target (always core.krateo.io compositiondefinitions) */}}
{{/* Needs snowplow >= 1.4.0 for the external helm-index YAML fetch (GKE is on 1.4.1). */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: blueprint-detail
  namespace: {{ $.Values.namespace }}
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    {{/* The installed blueprint = its CompositionDefinition (core.krateo.io). Identity from extras. */}}
    {{/* NOTE: no per-step filter — a per-step filter's output REPLACES this step's key, so a */}}
    {{/* `del(.compdef…)` (which returns the whole accumulated root) would nest it as */}}
    # {compdef:{compdef:…}}. The managedFields strip happens in the top-level filter instead.
    {{/* GATED ON ?extras namespace + name (the input gate, scripts/lint-ra-paths.py): without them */}}
    {{/* the step makes no call — it used to GET `…/namespaces//compositiondefinitions/`. */}}
    - name: compdef
      dependsOn:
        name: ""
        iterator: '[ { namespace: (.namespace // ""), name: (.name // "") } | select(.namespace != "" and .name != "") ]'
      path: ${ "/apis/core.krateo.io/v1alpha1/namespaces/" + .namespace + "/compositiondefinitions/" + .name }
      verb: GET
      headers:
        - 'Accept: application/json'
    {{/* The helm index — used to enumerate the chart's available versions (update picker). */}}
    {{- include "portal.catalogStep" (dict "ctx" $ "name" "catalog" "index" "blueprints") | nindent 4 }}
    {{/* IA correlation (blueprint → running instances): the compositions CREATED FROM this */}}
    {{/* blueprint are the instances of the CD's GENERATED kind — its status.apiVersion + */}}
    {{/* status.resource (e.g. composition.krateo.io/v0-1-0 + keystonedemoes). Listed */}}
    {{/* cluster-wide (a blueprint's instances can live in any namespace). */}}
    {{/* ORDERED AFTER compdef AND GATED ON ITS STATUS: an unreconciled CD (no status.apiVersion), */}}
    {{/* or no CD at all, makes no call, and the card reads "no running compositions". It had no */}}
    {{/* dependsOn, so snowplow ran it in random order against compdef (resolvers/restactions/api */}}
    {{/* sort.go), and its `// "none.krateo.io/v1"` fallback then dialled `/apis/none.krateo.io/v1/none`. */}}
    - name: comps
      dependsOn:
        name: compdef
        iterator: '[ .compdef | objects | { apiVersion: (.status.apiVersion // ""), resource: (.status.resource // "") } | select(.apiVersion != "" and .resource != "") | select((.apiVersion // "") | test("^[^/]+/[^/]+$")) | . + ((.apiVersion | split("/")) as $p | { group: $p[0], version: $p[1] }) ]'
      {{/* #1123: every value spliced into a path is ONE segment, so a `group/version` apiVersion
           must be split. THE SPLIT HAPPENS IN THE ITERATOR, not here, and that is deliberate:
           `lint-ra-secrets` can only guard a data-driven path when each spliced value is a single
           field of the iterator item, so `(.apiVersion | split("/")) as [$g,$v]` inside the path
           defeats `fetchablePath` and the lint rejects it. Emitting `group` and `version` as their
           own fields satisfies both — one segment per value, and each one analysable.

           The iterator's `test("^[^/]+/[^/]+$")` is the other half. `split("/")` on a CORE-group
           apiVersion ("v1", no slash) binds the version to null, and jq's `+ null` is a no-op, so
           the path renders `/apis/v1//pods` — an empty segment, dialled silently. Excluded in the
           iterator, such an element is never dialled at all. */}}
      path: ${ "/apis/" + .group + "/" + .version + "/" + .resource }
      verb: GET
      headers:
        - 'Accept: application/json'
      {{/* A cluster-scoped LIST dialled AS THE CALLER demands a ClusterRole from every persona
           that opens a blueprint, and `devs` carries none by design (#261). It was denied,
           `continueOnError` swallowed it, and the blueprint's "running compositions" came back
           empty for every non-admin. `resourcesFrom` because the plural comes from the
           CompositionDefinition this page is about; `group` is static because every
           CompositionDefinition's status.apiVersion is in composition.krateo.io. Same form
           dashboard-page's allCompositions stage already ships with. */}}
      userAccessFilter:
        verb: list
        group: composition.krateo.io
        resourcesFrom: '[ .compdef | objects | (.status.resource // "") | select(. != "") ]'
        namespaceFrom: .metadata.namespace
      continueOnError: true
      errorKey: compsError
  filter: |
    (.name // "") as $n
    | (.namespace // "") as $ns
    | ((.compdef // {}) | del(.metadata.managedFields, .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"])) as $d
    | ($d.spec.chart // {}) as $chart
    | ($chart.repo // "") as $bp
    | ($chart.version // "") as $cur
    | ([ (.catalog.entries[$bp]? // [])[] | .version | select(. != null and . != "") ]) as $idxVers
    | (($idxVers + [$cur]) | map(select(. != "")) | unique) as $avail
    | (if ($idxVers | length) > 0 then ($idxVers | sort | last) else $cur end) as $latest
    | ([ $d.status.conditions[]? | select(.type == "Ready") ][0].status // "Unknown") as $ready
    | ([ $d.status.conditions[]? | select(.type == "Synced") ][0].status // "Unknown") as $synced
    | ([ (.comps.items // [])[]
         | { name: (.metadata.name // ""),
             namespace: (.metadata.namespace // ""),
             ready: ([ .status.conditions[]? | select(.type == "Ready") ][0].status // "Unknown"),
             synced: ([ .status.conditions[]? | select(.type == "Synced") ][0].status // "Unknown"),
             created: (.metadata.creationTimestamp // ""),
             navHref: ("/compositions/" + (.metadata.namespace // "") + "/" + (.metadata.name // "")),
             readyLabel: ([ .status.conditions[]? | select(.type == "Ready") ][0].status // "Unknown" | if . == "True" then "Ready" elif . == "False" then "Failed" else "Pending" end),
             readyColor: ([ .status.conditions[]? | select(.type == "Ready") ][0].status // "Unknown" | if . == "True" then "Healthy" elif . == "False" then "Down" else "Pending" end) }
       ] | sort_by(.created) | reverse) as $comps
    # ASK AGENTIKO (button.blueprint-detail-ask-agentiko): this page's own route with an ?ask seed
    # about the blueprint — its version against the catalog's latest, Ready and Synced, and the
    # compositions that run from it. "" when the CompositionDefinition was not read, so the Button
    # falls back to the list rather than asking about a blueprint nobody found. When the
    # compositions could not be listed (compsError, under continueOnError) the prompt says so
    # rather than "0 compositions run from it".
    | (($d.metadata.name // "") != "") as $found
    | ((.compsError // null) | if . == null or . == [] or . == "" then ""
        else ((if type == "array" then .[0] else . end) | if type == "object" then (.message // .reason // tojson) elif type == "string" then . else tojson end
              | if length > 200 then .[0:199] + "…" else . end) end) as $compsError
    | ([ $comps[] | select(.readyLabel != "Ready") ] | length) as $notReady
    | ($d.metadata.name // $n) as $bpName
    | ($d.metadata.namespace // $ns) as $bpNs
    | (if $found then
         ("/blueprints/" + $bpNs + "/" + $bpName + "?ask="
          + (("Explain blueprint \"" + $bpName + "\" in namespace \"" + $bpNs + "\": it is at version " + (if $cur != "" then $cur else "unknown" end)
              + (if ($idxVers | length) == 0 then " (not in the catalog)" elif $latest == $cur then " (the catalog's latest)" else " (latest " + $latest + ")" end)
              + ", Ready=" + $ready + ", Synced=" + $synced + ", and "
              + (if $compsError != "" then "the compositions running from it could not be listed (" + $compsError + ")"
                 else ($comps | length | tostring) + (if ($comps | length) == 1 then " composition runs" else " compositions run" end) + " from it (" + ($notReady | tostring) + " not ready)" end)
              + ". Is it healthy, should I upgrade it, and what would an upgrade change for those compositions?") | @uri))
       else "" end) as $askHref
    | {
        askHref: $askHref,
        detail: $d,
        compositions: $comps,
        compositionsCount: ($comps | length),
        name: ($d.metadata.name // $n),
        namespace: ($d.metadata.namespace // $ns),
        # IA followup F3: forward cross-link to the marketplace catalog entry. $bp is the
        # helm-repo chart name (== the catalog key == the /marketplace/{name} route key),
        # gated on catalog membership so an OCI/platform CD (empty repo) never builds a broken
        # /marketplace/oci://... route — it falls back to the /marketplace index instead.
        marketplaceHref: (if ((((.catalog.entries[$bp]? // []) | length) > 0) and ($bp != "")) then ("/marketplace/" + $bp) else "/marketplace" end),
        inCatalog: ((((.catalog.entries[$bp]? // []) | length) > 0) and ($bp != "")),
        chart: ($chart.repo // ($chart.url // "")),
        chartUrl: ($chart.url // ""),
        currentVersion: $cur,
        availableVersions: $avail,
        latestVersion: $latest,
        updateAvailable: ($latest != $cur and $latest != ""),
        ready: $ready,
        synced: $synced,
        created: ($d.metadata.creationTimestamp // ""),
        versionSchema: {
          type: "object",
          required: ["version"],
          properties: {
            version: { type: "string", title: "Chart version", description: "Select a version to update the blueprint to", enum: $avail }
          }
        },
        versionInitial: { version: $cur },
        gvr: {
          apiVersion: "core.krateo.io/v1alpha1",
          resource: "compositiondefinitions",
          name: ($d.metadata.name // $n),
          namespace: ($d.metadata.namespace // $ns)
        }
      }
