{{/* Blueprint DETAIL data source — resolves ONE installed blueprint (its CompositionDefinition, */}}
{{/* from ?extras .namespace/.name = route /blueprints/{namespace}/{name}) and joins the krateo-blueprints */}}
{{/* helm index to discover the AVAILABLE versions (for the version-picker / update). Returns ONLY */}}
{{/* raw, server-shaped data; each detail widget slices its own view from this: */}}
{{/* detail            : the full CompositionDefinition (managedFields stripped) */}}
{{/* name / namespace  : identity (echoed from the object, falling back to extras) */}}
{{/* chart             : the chart name (spec.chart.repo) or its url */}}
{{/* currentVersion    : spec.chart.version (installed) */}}
{{/* availableVersions : every version the helm index lists for this chart (+ current), unique */}}
{{/* latestVersion / updateAvailable : the catalog's newest version of this chart, as the Marketplace */}}
{{/*                   reads it (the ConfigMap catalog + the live index, withLive), newest by */}}
{{/*                   version number; "" when it is not known (latestLabel says why) */}}
{{/* ready / synced / created : status surface */}}
{{/* versionSchema / versionInitial : the update Form's JSON schema (version enum) + initial value */}}
{{/* gvr               : PATCH/DELETE target (always core.krateo.io compositiondefinitions) */}}
{{/* Needs snowplow >= 1.4.0 for the external helm-index YAML fetch (GKE is on 1.4.1). */}}
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: blueprint-detail
  namespace: {{ $.Values.namespace }}
  annotations:
    krateo.io/verbose: "true"
spec:
  api:
    {{/* The installed blueprint = its CompositionDefinition (core.krateo.io). Identity from extras. */}}
    {{/* NOTE: no per-step filter — a per-step filter's output REPLACES this step's key, so a */}}
    {{/* `del(.compdef…)` (which returns the whole accumulated root) would nest it as */}}
    # {compdef:{compdef:…}}. The managedFields strip happens in the top-level filter instead.
    {{/* GATED ON ?extras namespace + name (the input gate, scripts/lint-ra-paths.py): without them */}}
    {{/* the step makes no call — it used to GET `…/namespaces//compositiondefinitions/`. */}}
    - name: compdef
      dependsOn:
        name: ""
        iterator: '[ { namespace: (.namespace // ""), name: (.name // "") } | select(.namespace != "" and .name != "") ]'
      path: ${ "/apis/core.krateo.io/v1alpha1/namespaces/" + .namespace + "/compositiondefinitions/" + .name }
      verb: GET
      headers:
        - 'Accept: application/json'
    {{/* The blueprint's published values.schema.json (the <resource>-<version>-jsonschema-configmap */}}
    {{/* next to its CD, read as the CALLER, as the formdef reads it): only to say whether its inputs */}}
    {{/* were INFERRED from values.yaml (core-provider #568) and how many fields accept any value, on */}}
    {{/* the "Inputs" line. Gated on the CD's status like the formdef's step; continueOnError, so a */}}
    {{/* blueprint without the ConfigMap (or a caller who cannot read it) just shows no line. */}}
    - name: jsonschema
      path: ${ "/api/v1/namespaces/" + .namespace + "/configmaps/" + .resource + "-" + .version + "-jsonschema-configmap" }
      verb: GET
      headers:
        - 'Accept: application/json'
      dependsOn:
        name: compdef
        iterator: '[ .compdef | objects | { namespace: (.metadata.namespace // "{{ .Release.Namespace }}"), resource: (.status.resource // ""), version: (((.status.apiVersion // "") | split("/"))[1] // "") } | select(.resource != "" and .version != "") ]'
      continueOnError: true
      errorKey: jsonschemaError
    {{/* The helm index — used to enumerate the chart's available versions (update picker). */}}
    {{- include "portal.catalogStep" (dict "ctx" $ "name" "catalog" "index" "blueprints") | nindent 4 }}
    {{/* The live blueprints index too (marketplace.liveIndex), merged by withLive in the filter as */}}
    {{/* the Marketplace merges it (_catalog.tpl): the version a krateo-blueprints repository released */}}
    {{/* after the catalog ConfigMap was rendered. Without it this page said "Latest version 0.1.0, Up */}}
    {{/* to date" while /marketplace/<chart> said 0.1.1 (UX audit BP-2). */}}
    {{- include "portal.catalogLiveStep" $ | nindent 4 }}
    {{/* IA correlation (blueprint → running instances): the compositions CREATED FROM this */}}
    {{/* blueprint are the instances of the CD's GENERATED kind — its status.apiVersion + */}}
    {{/* status.resource (e.g. composition.krateo.io/v0-1-0 + keystonedemoes). Listed */}}
    {{/* cluster-wide (a blueprint's instances can live in any namespace). */}}
    {{/* ORDERED AFTER compdef AND GATED ON ITS STATUS: an unreconciled CD (no status.apiVersion), */}}
    {{/* or no CD at all, makes no call, and the card reads "no running compositions". It had no */}}
    {{/* dependsOn, so snowplow ran it in random order against compdef (resolvers/restactions/api */}}
    {{/* sort.go), and its `// "none.krateo.io/v1"` fallback then dialled `/apis/none.krateo.io/v1/none`. */}}
    - name: comps
      dependsOn:
        name: compdef
        iterator: '[ .compdef | objects | { apiVersion: (.status.apiVersion // ""), resource: (.status.resource // "") } | select(.apiVersion != "" and .resource != "") | select((.apiVersion // "") | test("^[^/]+/[^/]+$")) | . + ((.apiVersion | split("/")) as $p | { group: $p[0], version: $p[1] }) ]'
      {{/* #1123: every value spliced into a path is ONE segment, so a `group/version` apiVersion
           must be split. THE SPLIT HAPPENS IN THE ITERATOR, not here, and that is deliberate:
           `lint-ra-secrets` can only guard a data-driven path when each spliced value is a single
           field of the iterator item, so `(.apiVersion | split("/")) as [$g,$v]` inside the path
           defeats `fetchablePath` and the lint rejects it. Emitting `group` and `version` as their
           own fields satisfies both — one segment per value, and each one analysable.

           The iterator's `test("^[^/]+/[^/]+$")` is the other half. `split("/")` on a CORE-group
           apiVersion ("v1", no slash) binds the version to null, and jq's `+ null` is a no-op, so
           the path renders `/apis/v1//pods` — an empty segment, dialled silently. Excluded in the
           iterator, such an element is never dialled at all. */}}
      path: ${ "/apis/" + .group + "/" + .version + "/" + .resource }
      verb: GET
      headers:
        - 'Accept: application/json'
      {{/* A cluster-scoped LIST dialled AS THE CALLER demands a ClusterRole from every persona
           that opens a blueprint, and `devs` carries none by design (#261). It was denied,
           `continueOnError` swallowed it, and the blueprint's "running compositions" came back
           empty for every non-admin. `resourcesFrom` because the plural comes from the
           CompositionDefinition this page is about; `group` is static because every
           CompositionDefinition's status.apiVersion is in composition.krateo.io. Same form
           dashboard-page's allCompositions stage already ships with. */}}
      userAccessFilter:
        verb: list
        group: composition.krateo.io
        resourcesFrom: '[ .compdef | objects | (.status.resource // "") | select(. != "") ]'
        namespaceFrom: .metadata.namespace
      continueOnError: true
      errorKey: compsError
    {{/* THE CALLER'S OWN ACCESS, asked of the authorizer, so the page leaves out the controls they
         cannot use (Diego, 2026-11-16: hide, not disable). Each probe is the request its control
         makes, in the same namespace and on the same name:
           mayDelete  Uninstall        DELETE compositiondefinitions/<name> in the blueprint's ns
           mayPatch   Update version   PATCH  compositiondefinitions/<name> in the blueprint's ns
           mayCreate  Deploy to fleet  POST   compositiondefinitions in the blueprints-page namespace
         A control is left out only on an explicit NO (evaluated and not allowed). When a probe
         could not be evaluated the control stays, and the apiserver still refuses a write the
         caller may not make: a failed probe must not hide a working action from an admin. Same
         probe shape as blueprint-palette's mayListCrds. Gated on the route like `compdef`: no
         name, no probe. */}}
    - name: mayDelete
      dependsOn:
        name: ""
        iterator: '[ { namespace: (.namespace // ""), name: (.name // "") } | select(.namespace != "" and .name != "") ]'
      path: /apis/authorization.k8s.io/v1/selfsubjectaccessreviews
      verb: POST
      headers:
        - 'Content-Type: application/json'
        - 'Accept: application/json'
      continueOnError: true
      errorKey: mayDeleteError
      payload: '${ {apiVersion: "authorization.k8s.io/v1", kind: "SelfSubjectAccessReview", spec: {resourceAttributes: {group: "core.krateo.io", resource: "compositiondefinitions", verb: "delete", namespace: .namespace, name: .name}}} | tojson }'
      filter: >
        {allowed: (.mayDelete.status.allowed == true), evaluated: ((.mayDelete.status // null) != null)}
    - name: mayPatch
      dependsOn:
        name: ""
        iterator: '[ { namespace: (.namespace // ""), name: (.name // "") } | select(.namespace != "" and .name != "") ]'
      path: /apis/authorization.k8s.io/v1/selfsubjectaccessreviews
      verb: POST
      headers:
        - 'Content-Type: application/json'
        - 'Accept: application/json'
      continueOnError: true
      errorKey: mayPatchError
      payload: '${ {apiVersion: "authorization.k8s.io/v1", kind: "SelfSubjectAccessReview", spec: {resourceAttributes: {group: "core.krateo.io", resource: "compositiondefinitions", verb: "patch", namespace: .namespace, name: .name}}} | tojson }'
      filter: >
        {allowed: (.mayPatch.status.allowed == true), evaluated: ((.mayPatch.status // null) != null)}
    - name: mayCreate
      path: /apis/authorization.k8s.io/v1/selfsubjectaccessreviews
      verb: POST
      headers:
        - 'Content-Type: application/json'
        - 'Accept: application/json'
      continueOnError: true
      errorKey: mayCreateError
      payload: '{"apiVersion":"authorization.k8s.io/v1","kind":"SelfSubjectAccessReview","spec":{"resourceAttributes":{"group":"core.krateo.io","resource":"compositiondefinitions","verb":"create","namespace":"{{ .Release.Namespace }}"}}}'
      filter: >
        {allowed: (.mayCreate.status.allowed == true), evaluated: ((.mayCreate.status // null) != null)}
  filter: |
    {{- include "portal.catalogLiveDefs" . | nindent 4 }}
    {{- include "portal.blueprintContentsDefs" . | nindent 4 }}
    {{- include "portal.inferredInputsDefs" . | nindent 4 }}
    {{- include "portal.migratedValuesDefs" . | nindent 4 }}
    # A control is left out only on an explicit no: the probe was evaluated and did not allow.
    # A probe that was skipped or failed keeps the control (see the stages above).
    def shown($p): ($p // {}) | (if type == "array" then (.[0] // {}) else . end) | (((.evaluated == true) and (.allowed != true)) | not);
    # The catalog as the Marketplace reads it: the ConfigMap catalog with the live index merged in.
    withLive
    | (.name // "") as $n
    | (.namespace // "") as $ns
    | ((.compdef // {}) | del(.metadata.managedFields, .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"])) as $d
    | ($d.spec.chart // {}) as $chart
    | ($chart.repo // "") as $bp
    | ($chart.version // "") as $cur
    | ([ (if $bp == "" then [] else (.catalog.entries[$bp]? // []) end)[] | objects | .version | select(. != null and . != "") ]) as $idxVers
    | (($idxVers + [$cur]) | map(select(. != "")) | unique) as $avail
    # LATEST: the newest catalog version by version number (withLiveVer, the order the Marketplace
    # sorts by), never by string ("0.1.10" sorts before "0.1.9"). NOT KNOWN — "" — when the catalog
    # holds no version of this chart: a blueprint installed from a URL or an OCI registry (no
    # spec.chart.repo), which nothing here reads, or a catalog that could not be read. It used to fall
    # back to the installed version, which printed "Latest version <installed>" and "Up to date" for
    # every such blueprint without having looked anywhere.
    | (if ($idxVers | length) > 0 then ($idxVers | sort_by(withLiveVer) | last) else "" end) as $latest
    | (((.catalogError // null) | . != null and . != [] and . != "")) as $catalogFailed
    # The chart name an OCI/URL install points at (its last path segment), only to say what the
    # Marketplace lists under that name when this blueprint's own source is not read.
    | (if $bp == "" then (($chart.url // "") | sub("/+$"; "") | split("/") | last // "" | sub(":[^:/]*$"; "")) else "" end) as $urlChart
    | ([ ((if $urlChart == "" then [] else (.catalog.entries[$urlChart]? // []) end)[] | objects | .version | select(. != null and . != "")) ]
       | if length > 0 then (sort_by(withLiveVer) | last) else "" end) as $sameNameLatest
    | (if $latest != "" then $latest
       elif $catalogFailed and $bp != "" then "not known: the catalog could not be read"
       elif $bp == "" then ("not known: installed from " + (if (($chart.url // "") | startswith("oci://")) then "an OCI registry" else "a URL" end) + ", which is not read here"
                            + (if $sameNameLatest != "" then " (the Marketplace lists " + $urlChart + " " + $sameNameLatest + " from its own catalog)" else "" end))
       else "not known: this chart is not in the catalog" end) as $latestLabel
    | ([ $d.status.conditions[]? | select(.type == "Ready") ][0].status // "Unknown") as $ready
    | ([ $d.status.conditions[]? | select(.type == "Synced") ][0].status // "Unknown") as $synced
    | ([ (.comps.items // [])[]
         | { name: (.metadata.name // ""),
             namespace: (.metadata.namespace // ""),
             ready: ([ .status.conditions[]? | select(.type == "Ready") ][0].status // "Unknown"),
             synced: ([ .status.conditions[]? | select(.type == "Synced") ][0].status // "Unknown"),
             created: (.metadata.creationTimestamp // ""),
             navHref: ("/compositions/" + (.metadata.namespace // "") + "/" + (.metadata.name // "")),
             readyLabel: ([ .status.conditions[]? | select(.type == "Ready") ][0].status // "Unknown" | if . == "True" then "Ready" elif . == "False" then "Failed" else "Pending" end),
             readyColor: ([ .status.conditions[]? | select(.type == "Ready") ][0].status // "Unknown" | if . == "True" then "Healthy" elif . == "False" then "Down" else "Pending" end) }
       ] | sort_by(.created) | reverse) as $comps
    # ASK AGENTIKO (button.blueprint-detail-ask-agentiko): this page's own route with an ?ask seed
    # about the blueprint — its version against the catalog's latest, Ready and Synced, and the
    # compositions that run from it. "" when the CompositionDefinition was not read, so the Button
    # falls back to the list rather than asking about a blueprint nobody found. When the
    # compositions could not be listed (compsError, under continueOnError) the prompt says so
    # rather than "0 compositions run from it".
    # WHAT IT CREATES: the CompositionDefinition's status.contents in one of its states
    # (portal.blueprintContentsDefs, _blueprint-contents.tpl). $d is {} when the CD could not be
    # read, which is "Contents not available" here; "not installed" is only the marketplace's case.
    | ($d | blueprintContents($cur)) as $contents
    | (($d.metadata.name // "") != "") as $found
    | ((.compsError // null) | if . == null or . == [] or . == "" then ""
        else ((if type == "array" then .[0] else . end) | if type == "object" then (.message // .reason // tojson) elif type == "string" then . else tojson end
              | if length > 200 then .[0:199] + "…" else . end) end) as $compsError
    | ([ $comps[] | select(.readyLabel != "Ready") ] | length) as $notReady
    | ($d.metadata.name // $n) as $bpName
    | ($d.metadata.namespace // $ns) as $bpNs
    | (if $found then
         ("/blueprints/" + $bpNs + "/" + $bpName + "?ask="
          + (("Explain blueprint \"" + $bpName + "\" in namespace \"" + $bpNs + "\": it is at version " + (if $cur != "" then $cur else "unknown" end)
              + (if $latest == "" then " (its latest version is " + $latestLabel + ")" elif $latest == $cur then " (the catalog's latest)" else " (latest " + $latest + ")" end)
              + ", Ready=" + $ready + ", Synced=" + $synced + ", and "
              + (if $compsError != "" then "the compositions running from it could not be listed (" + $compsError + ")"
                 else ($comps | length | tostring) + (if ($comps | length) == 1 then " composition runs" else " compositions run" end) + " from it (" + ($notReady | tostring) + " not ready)" end)
              + ". Is it healthy, should I upgrade it, and what would an upgrade change for those compositions?") | @uri))
       else "" end) as $askHref
    | {
        askHref: $askHref,
        contents: $contents,
        # After a migration, compositions whose values the served version refuses (core-provider #623):
        # the "Values check" row and the Alert above the Details card (portal.migratedValuesDefs,
        # _migrated-values.tpl). {line: "", alert: null} when there is nothing to say.
        migratedValues: (($d.status.migratedValues // null) as $mv
          | ([ ($d.status.conditions // [])[]? | objects | select(.type == "MigratedValuesValid") ] | first) as $mvCond
          | migratedValuesDetails($mv; $mvCond)),
        # The "Inputs" line (portal.inferredInputsDefs, _inferred-inputs.tpl): "" for an authored
        # schema or no ConfigMap, so the row is left out; a follower says "Defined by another
        # blueprint <ns/name>", linking the owner (core-provider 2.13.126 status.owner).
        inputs: (([ ($d.status.conditions // [])[]? | objects | select(.type == "ValuesSchemaAuthored") ] | first) as $valuesSchemaCond
          | (((.jsonschema // {}) | if type == "object" then (.data["values.schema.json"]? // null) else null end) | inferredInputsLine($valuesSchemaCond; ($d.status.owner // null)))),
        # A follower's line links its owner (core-provider 2.13.126 status.owner); "" otherwise.
        inputsHref: (([ ($d.status.conditions // [])[]? | objects | select(.type == "ValuesSchemaAuthored") ] | first) as $valuesSchemaCond
          | inferredInputsHref($valuesSchemaCond; ($d.status.owner // null))),
        may: { uninstall: shown(.mayDelete), update: shown(.mayPatch), fleet: shown(.mayCreate) },
        detail: $d,
        compositions: $comps,
        compositionsCount: ($comps | length),
        name: ($d.metadata.name // $n),
        namespace: ($d.metadata.namespace // $ns),
        # IA followup F3: forward cross-link to the marketplace catalog entry. $bp is the
        # helm-repo chart name (== the catalog key == the /marketplace/{name} route key),
        # gated on catalog membership so an OCI/platform CD (empty repo) never builds a broken
        # /marketplace/oci://... route — it falls back to the /marketplace index instead.
        marketplaceHref: (if ((((.catalog.entries[$bp]? // []) | length) > 0) and ($bp != "")) then ("/marketplace/" + $bp) else "/marketplace" end),
        inCatalog: ((((.catalog.entries[$bp]? // []) | length) > 0) and ($bp != "")),
        chart: ($chart.repo // ($chart.url // "")),
        chartUrl: ($chart.url // ""),
        currentVersion: $cur,
        availableVersions: $avail,
        latestVersion: $latest,
        latestLabel: $latestLabel,
        # Newer by version number, not merely different: an installed version above the catalog's
        # (a prerelease, a chart from elsewhere) is not an update to an older one.
        updateAvailable: ($latest != "" and $cur != "" and (($latest | withLiveVer) > ($cur | withLiveVer))),
        ready: $ready,
        synced: $synced,
        created: ($d.metadata.creationTimestamp // ""),
        versionSchema: {
          type: "object",
          required: ["version"],
          properties: {
            version: { type: "string", title: "Chart version", description: "Select a version to update the blueprint to", enum: $avail }
          }
        },
        versionInitial: { version: $cur },
        gvr: {
          apiVersion: "core.krateo.io/v1alpha1",
          resource: "compositiondefinitions",
          name: ($d.metadata.name // $n),
          namespace: ($d.metadata.namespace // $ns)
        }
      }
