{{/* The chart creates its own target namespace. A Helm release cannot create the namespace it is
     installed INTO, so the release stays in the portal's namespace — the shell — and every page
     object renders into `.Values.namespace`, which this creates. `.Release.Namespace` therefore
     still means "the shell" everywhere in this chart, which is why no value points at it. */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    krateo.io/page-set: blueprints
