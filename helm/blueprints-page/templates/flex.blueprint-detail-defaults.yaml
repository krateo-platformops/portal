{{/* Under the blueprint's header, only when status.schemaDefaults is present (portal#576): the neutral */}}
{{/* notice and, under it, the fields it names. Mounted by page-blueprint-detail. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-detail-defaults
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    vertical: true
    gap: small
    allowedResources:
      - alerts
      - collapses
    items:
      - resourceRefId: alert-blueprint-detail-defaults
      - resourceRefId: collapse-blueprint-detail-defaults
  resourcesRefs:
    items:
      - id: alert-blueprint-detail-defaults
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: alert-blueprint-detail-defaults
        namespace: {{ $.Values.namespace }}
        resource: alerts
        verb: GET
      - id: collapse-blueprint-detail-defaults
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: collapse-blueprint-detail-defaults
        namespace: {{ $.Values.namespace }}
        resource: collapses
        verb: GET
