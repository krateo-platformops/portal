  # Now the Form's `notices` (frontend 1.8.68): the inferred-inputs notice on the Create form.
  # Installer's check-chart-requires-floors refuses a pin below it; lint-pinned-crds checks it still holds.
  krateo.io/requires-frontend-crd: ">= 1.8.68"
