{{/* Namespace chips of /audit: "All", then the 12 namespaces with the most records in the window and
     their counts (audit-facets), counted only over the namespaces the caller may read. A filter set
     to a value outside that list keeps its chip, active, so the bar always says what the table is
     filtered by — but only a value audit-records would accept. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-namespace-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every filter rides the URL, so every widget on /audit declares all five. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome]
  apiRef:
    name: audit-facets
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ {{ include "audit.route" . }} {{ include "audit.valid" . }} . as $x | ((.auditNamespace // "") | tostring) as $sel | [ (.facets.namespaces // [])[] | select(.name | okNs) ] as $top | [ {name: "", count: null} ] + [ $top[] | {name: .name, count: .count} ] + (if $sel != "" and ($sel | okNs) and (any($top[]; .name == $sel) | not) then [ {name: $sel, count: null} ] else [] end) | map(.name as $n | { label: (if $n == "" then "All" else ($n | .) end), active: ($n == $sel), route: ($x | auditRoute({auditNamespace: $n})) } + (if .count == null then {} else {count: .count} end)) }'
  resourcesRefs:
    items: []
