{{/* The /audit filters, the left of the toolbar (row.audit-toolbar): time range, namespace and user,
     each an eyebrow label beside its chips, as on the Traces tab; wrapped when narrow. The outcome
     chips sit at the top of the records card instead (the A4 state chips). Every chip is a link to
     /audit with one filter changed and the others, the view and the search kept (_audit-a4.tpl,
     audit.href), so the whole view is in the URL and can be shared. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-filters
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  widgetData:
    allowedResources:
    - flexes
    gap: middle
    align: center
    wrap: true
    items:
    - resourceRefId: audit-range-group
    - resourceRefId: audit-namespace-group
    - resourceRefId: audit-user-group
  resourcesRefs:
    items:
    - id: audit-range-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-range-group
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: audit-namespace-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-namespace-group
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
    - id: audit-user-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-user-group
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
