{{/* The note under the records' cards or table (audit-records' `note`): how many records the window
     holds, how many link to a trace and why the rest do not, previews left out, records missing a
     field this page reads, and the row-count check when it disagrees. A refused filter, no readable
     namespace or an unreadable trail is said by audit-empty instead, in place of an empty list. */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-note
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  apiRef:
    name: audit-records
    namespace: {{ $.Values.namespace }}
  widgetData:
    text: ''
    type: secondary
  widgetDataTemplate:
    - forPath: text
      expression: '${ (.note // "") }'
  resourcesRefs:
    items: []
