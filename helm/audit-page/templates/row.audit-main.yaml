{{/* The /audit body: the records on the left two thirds, the charts on the right third (mockup A4).
     At narrow widths, or with the Agentiko rail open, both take the full width and the charts go
     below the records. */}}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-main
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  widgetData:
    allowedResources:
    - cards
    - flexes
    alignment: top
    items:
    - resourceRefId: audit-list-card
      size: 16
      xs: 24
      lg: 16
    - resourceRefId: audit-side
      size: 8
      xs: 24
      lg: 8
  resourcesRefs:
    items:
    - id: audit-list-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-list-card
      namespace: {{ $.Values.namespace }}
      resource: cards
      verb: GET
    - id: audit-side
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-side
      namespace: {{ $.Values.namespace }}
      resource: flexes
      verb: GET
