{{/* The /audit page header: the title and "Ask Agentiko →" (button.audit-ask-agentiko), which carries
     its own apiRef, so the header itself reads nothing. No subtitle (mockup A4): the shell's
     breadcrumb (Observability / Audit) sits above the title, and whose records these are is said
     under the records (paragraph.audit-scope). */}}
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-page-header
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  widgetData:
    title: Audit
    allowedResources:
    - buttons
    items:
    - resourceRefId: audit-ask-agentiko
  resourcesRefs:
    items:
    - id: audit-ask-agentiko
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-ask-agentiko
      namespace: {{ $.Values.namespace }}
      resource: buttons
      verb: GET
