{{/* The line above the audit table: its order and its bounds. The count is in the note below it,
     which is resolved with the rows. Plain sentence-case text in the muted secondary colour, exactly
     like the Traces tab's caption (obs-sec-traces-desc), NOT `variant: eyebrow`: since frontend#654
     an eyebrow renders as an uppercase label, and a whole sentence set that way reads as one
     shouted line. The eyebrow stays on the four short chip-group labels
     (audit-{range,namespace,outcome,user}-label). */}}
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-table-caption
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every filter rides the URL, so every widget on /audit declares all five. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome]
  widgetData:
    text: 'Newest first · the latest 200 in the range, 25 a page'
    type: secondary
  resourcesRefs:
    items: []
