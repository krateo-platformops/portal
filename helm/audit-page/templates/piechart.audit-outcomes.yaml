{{/* The records by outcome, a slice per outcome that has any, coloured as the outcome tag, the cards
     and the figures colour it (Success gray: colour marks the exceptions); Other (slate, apart from
     Success's gray) holds the records with no outcome the library writes. */}}
kind: PieChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-outcomes
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  apiRef:
    name: audit-records
    namespace: {{ $.Values.namespace }}
  widgetData:
    angleField: count
    colorField: outcome
    colorMap:
      Success: gray
      Failure: red
      Denied: orange
      Other: slate
    innerRadius: 60
    legend: true
    legendPosition: right
    height: 180
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ .byOutcome // [] }'
  resourcesRefs:
    items: []
