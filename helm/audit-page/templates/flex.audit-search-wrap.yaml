{{/* A one-item Flex around the search, because a Row takes no `inputs` (as
     flex.incidents-search-wrap). The search fills it, up to the Input's own cap. */}}
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-search-wrap
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  widgetData:
    allowedResources:
    - inputs
    items:
    - resourceRefId: audit-search
  resourcesRefs:
    items:
    - id: audit-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-search
      namespace: {{ $.Values.namespace }}
      resource: inputs
      verb: GET
