{{/* Outcome chips of /audit, at the top of the records card (the A4 state chips): "All", then success,
     failure and denied (the audit library's three words) in that order, each where the window holds
     a record with it, with its count (audit-facets: the window and the search, not the chips). Each
     route keeps the other filters, the view and the search (audit.href). */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-outcome-chips
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  apiRef:
    name: audit-facets
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: chip
      primaryText: '{label}'
      navigateTo: '{route}'
    dataSource: []
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ {{ include "audit.href" . }} {{ include "audit.valid" . }} . as $x | ((.auditOutcome // "") | tostring) as $sel | ([ (.facets.outcomes // [])[] | select(.name | okOutcome) ]) as $f | [ ["success", "failure", "denied"][] as $o | $f[] | select(.name == $o) ] as $top | [ {name: "", count: null} ] + [ $top[] | {name: .name, count: .count} ] + (if $sel != "" and ($sel | okOutcome) and (any($top[]; .name == $sel) | not) then [ {name: $sel, count: null} ] else [] end) | map(.name as $n | { label: (if $n == "" then "All" else ($n | (.[0:1] | ascii_upcase) + .[1:]) end), active: ($n == $sel), route: ($x | auditHref({auditOutcome: $n})) } + (if .count == null then {} else {count: .count} end)) }'
  resourcesRefs:
    items: []
