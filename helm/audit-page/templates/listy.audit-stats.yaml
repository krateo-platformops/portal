{{/* The five figures over the window, the chips and the search: Records, Success, Failure, Denied and
     Untraced (written with no trace context). Each tile wears the colour the outcome tag and the
     cards give the outcome it counts (success green, failure red, denied orange), zero or not;
     Records is neutral slate and Untraced gray, the tag's colour for anything that is not an
     outcome. The title says the outcome too, so colour is never the only signal. A failed read is
     an empty value (drawn as a muted "—") captioned "could not be read", never a 0, in orange; so
     is a view that read nothing (a refused filter, no namespace shared). A state tile (Success,
     Failure, Denied) opens the list filtered to that state, the outcome chip's route; Records,
     Untraced and a failed read have no route and are plain tiles. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  apiRef:
    name: audit-records
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      navigateTo: '{route}'
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      color:
        value: '{tone}'
        map:
          records: slate
          success: green
          failure: red
          denied: orange
          untraced: gray
          unread: orange
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
