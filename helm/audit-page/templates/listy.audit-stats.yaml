{{/* The five figures over the window, the chips and the search: Records, Success, Failure, Denied and
     Untraced (written with no trace context). The colour and the highlighted border come computed
     (audit-records `color`, `highlight`; portal.tileDefs, frontend >= 1.8.93): only Failure (red)
     and Denied (orange) above 0 are coloured and highlighted, the outcome tag's colours; a 0,
     Records, Success and Untraced are neutral. The title says the outcome too, so colour is never
     the only signal. A failed read is an empty value (drawn as a muted "—") captioned "could not be
     read", never a 0, in orange and highlighted; so is a view that read nothing (a refused filter, no namespace shared). A state tile (Success,
     Failure, Denied) opens the list filtered to that state, the outcome chip's route; Records,
     Untraced and a failed read have no route and are plain tiles. */}}
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-stats
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  apiRef:
    name: audit-records
    namespace: {{ $.Values.namespace }}
  widgetData:
    itemTemplate:
      rowVariant: statistic
      navigateTo: '{route}'
      primaryText: '{title}'
      secondaryText: '{value}'
      subPrimaryText: '{caption}'
      color:
        value: '{color}'
      highlight: '{highlight}'
    dataSource: []
  widgetDataTemplate:
  - forPath: dataSource
    expression: '${ .stats // [] }'
  resourcesRefs:
    items: []
