{{/* The last hour per 5 minutes, one series per outcome, as linechart.audit-activity. The buckets
     are labelled HH:MM in UTC by audit-records (the LineChart's own time labels are hourly or
     daily), as every time on this page is. */}}
kind: LineChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-activity-minutes
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  apiRef:
    name: audit-records
    namespace: {{ $.Values.namespace }}
  widgetData:
    xField: t
    yField: v
    colorField: series
    colorMap:
      Success: green
      Failure: red
      Denied: orange
    shapeField: smooth
    legend: true
    height: 180
    scale:
      "y":
        zero: true
        nice: true
        domainMin: 0
        tickCount: 4
    axis:
      x:
        tickCount: 5
      "y":
        tickCount: 4
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ if .trendUnit == "minute" then (.trend // []) else [] end }'
  resourcesRefs:
    items: []
