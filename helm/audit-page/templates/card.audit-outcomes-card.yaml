{{/* "Outcomes": the records by outcome, as a donut (piechart.audit-outcomes). */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-outcomes-card
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  widgetData:
    title: Outcomes
    titleVariant: eyebrow
    variant: outlined
    allowedResources:
    - piecharts
    items:
    - resourceRefId: audit-outcomes
  resourcesRefs:
    items:
    - id: audit-outcomes
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: audit-outcomes
      namespace: {{ $.Values.namespace }}
      resource: piecharts
      verb: GET
