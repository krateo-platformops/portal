{{/* The last hour per 5 minutes, one series per outcome, as barchart.audit-activity. The buckets
     are labelled HH:MM in UTC by audit-records (the BarChart's own time labels are hourly or
     daily), as every time on this page is. */}}
{{/* COUNTS AS BARS (charts mockup, CHART-3): whole-number ticks, the top of the axis the smallest
     multiple of 4 at or above the largest count (at least 4: 0..4, 0..8, ...), so a single incident is
     never a bump on a 0.2 axis; a measured 0 is the BarChart's grey hairline on the baseline, so a red
     series never paints a zero. The newest bucket is the one still filling: slot "partial" (a hatched
     bar, "so far"). */}}
kind: BarChart
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: audit-activity-minutes
  namespace: {{ $.Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  {{/* F6 (snowplow#130): every page param rides the URL (krateo.io/filter-keys on page-audit), so every widget on /audit declares all of them. */}}
  keyExtras: [projects, range, auditNamespace, auditUser, auditOutcome, q, view]
  apiRef:
    name: audit-records
    namespace: {{ $.Values.namespace }}
  widgetData:
    xField: t
    yField: v
    colorField: series
    slotField: slot
    group: true
    colorMap:
      Success: green
      Failure: red
      Denied: orange
    legend: true
    height: 180
    scale:
      "y":
        zero: true
        domainMin: 0
        domainMax: 4
        tickCount: 5
    axis:
      "y":
        tickCount: 5
        title: records
    data: []
  widgetDataTemplate:
  - forPath: data
    expression: '${ (if .trendUnit == "minute" then (.trend // []) else [] end) as $rows | (($rows | last) // {} | .t) as $cur | [ $rows[] | . + (if .t == $cur then { slot: "partial" } else {} end) ] }'
  - forPath: scale
    expression: '${ ([ (if .trendUnit == "minute" then (.trend // []) else [] end)[] | (.v // 0) ] | max // 0) as $m | { "y": { zero: true, domainMin: 0, domainMax: (if $m <= 4 then 4 else (($m / 4) | ceil) * 4 end), tickCount: 5 } } }'
  resourcesRefs:
    items: []
