{{/* Screen 2's card: the username form, alone. No card title, for the reason
     request-access-card gives: the heading is the Form's, and goes with it. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: request-access-confirm-card
  namespace: {{ .Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: outlined
    allowedResources:
      - forms
    items:
      - resourceRefId: request-access-confirm
  resourcesRefs:
    items:
      - id: request-access-confirm
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: request-access-confirm
        namespace: {{ .Values.namespace }}
        resource: forms
        verb: GET
