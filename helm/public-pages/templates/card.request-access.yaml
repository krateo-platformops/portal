{{/* Screen 1's card: the request form, alone. No card title — the heading is the Form's own
     `title`, so it goes when a Result replaces the form, as every result state in the approved
     mockup drops the page heading. */}}
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: request-access-card
  namespace: {{ .Values.namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    variant: outlined
    allowedResources:
      - forms
    items:
      - resourceRefId: request-access
  resourcesRefs:
    items:
      - id: request-access
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: request-access
        namespace: {{ .Values.namespace }}
        resource: forms
        verb: GET
