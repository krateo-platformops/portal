# The same shapes, authored correctly. Every rule must stay silent on this file — a lint that
# cannot tell these two fixtures apart is either blind or noisy.
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-table}
spec:
  widgetData:
    # {namespace} is NOT a column — it is a navigation-only cell minted by the dataSource jq.
    # This is the case that made the naive version of P10 report 12 false positives.
    rowNavigateTo: "/compositions/{namespace}/{name}"
    columns:
      - valueKey: title
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ [ {valueKey:"title",stringValue:"x"}, {valueKey:"namespace",stringValue:"y"}, {valueKey:"name",stringValue:"z"} ] }'
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-flex}
spec:
  widgetData:
    items:
      - resourceRefId: real
  resourcesRefs:
    items:
      - id: real
---
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-button}
spec:
  widgetData:
    label: "New composition"
---
kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-tag-templated}
spec:
  # A templated label is COMPUTED, not missing — flagging it would be the false positive.
  widgetData:
    color: green
  widgetDataTemplate:
    - forPath: label
      expression: '${ .status }'
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: real-card}
spec:
  widgetData: {items: []}
  resourcesRefs: {items: []}
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: refs-a-real-card}
spec:
  widgetData:
    items:
      - resourceRefId: ok
      - resourceRefId: cfg
  resourcesRefs:
    items:
      - id: ok
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: real-card
        resource: cards
      # A NON-WIDGET ref. Secrets and ConfigMaps legitimately live outside this chart's template
      # set, so X13 must ignore them — flagging these would make the rule unusable.
      - id: cfg
        apiVersion: v1
        name: some-configmap
        resource: configmaps

---
# X5: the child's plural is declared. Also covers the two deliberate non-reports — a container
# with NO allowedResources is unconstrained, not a defect.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: x5-good
spec:
  widgetData:
    allowedResources:
    - tables
    items:
    - resourceRefId: a-table
  resourcesRefs:
    items:
    - id: a-table
      name: a-table
      resource: tables
      verb: GET
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: x5-unconstrained
spec:
  widgetData:
    items:
    - resourceRefId: a-table
  resourcesRefs:
    items:
    - id: a-table
      name: a-table
      resource: tables
      verb: GET
---
# P25 page-header: a nav whose routes both resolve to pages that name themselves. The second is the
# documented opt-out — a page with genuinely no single header, where the exception is written down
# on the CR and therefore reviewable, rather than living in an exclusion list inside the lint.
kind: Menu
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-nav-good
spec:
  widgetData:
    allowedResources:
    - flexes
    items:
    - label: Things
      path: /things
      resourceRefId: p25-good-root
    - order: 900
      path: "/things/{name}"
      page: p25-exempt
  resourcesRefs:
    items:
    - id: p25-good-root
      name: p25-good
      resource: flexes
      verb: GET
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-good
spec:
  widgetData:
    allowedResources:
    - pageheaders
    items:
    - resourceRefId: the-header
  resourcesRefs:
    items:
    - id: the-header
      name: p25-header
      resource: pageheaders
      verb: GET
---
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-header
spec:
  widgetData:
    title: Things
  resourcesRefs:
    items: []
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-p25-exempt
  annotations:
    "krateo.io/no-page-header": "two apiRefs — the title line is assembled from both"
spec:
  widgetData:
    allowedResources:
    - flexes
    items:
    - resourceRefId: title-stack
  resourcesRefs:
    items:
    - id: title-stack
      name: p25-title-stack
      resource: flexes
      verb: GET
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-title-stack
spec:
  widgetData:
    items: []
  resourcesRefs:
    items: []
---
# P25, the templated-items branch done right: `items` is assembled by jq, and the first literal in
# that template is a PageHeader. The rule must read through the template rather than exempt the page.
kind: Menu
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-nav-templated-good
spec:
  widgetData:
    allowedResources:
    - flexes
    items:
    - order: 901
      path: "/detail/{name}"
      page: p25-templated-good
  resourcesRefs:
    items: []
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-p25-templated-good
spec:
  widgetData:
    allowedResources:
    - pageheaders
    - cards
    items:
    - resourceRefId: the-hdr
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "the-hdr" } ] + (if (.extra // false) then [ { resourceRefId: "a-card" } ] else [] end) }'
  resourcesRefs:
    items:
    - id: the-hdr
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: p25-good-header
      resource: pageheaders
      verb: GET
    - id: a-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: p25-extra-card
      resource: cards
      verb: GET
---
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-good-header
spec:
  widgetData:
    title: Detail
  resourcesRefs:
    items: []
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-extra-card
spec:
  widgetData: {}
  resourcesRefs:
    items: []
---
# The same templated shape done right: every literal the template names is declared, and each
# child's plural is admitted by allowedResources.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: x4-x5-templated-good
spec:
  widgetData:
    allowedResources:
    - cards
    - tables
    items:
    - resourceRefId: a-card
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "a-card" } ] + (if .flag then [ { resourceRefId: "a-table" } ] else [] end) }'
  resourcesRefs:
    items:
    - id: a-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: good-card
      resource: cards
      verb: GET
    - id: a-table
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: good-table
      resource: tables
      verb: GET
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: good-card
spec:
  widgetData: {}
  resourcesRefs:
    items: []
---
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: good-table
spec:
  widgetData: {}
  resourcesRefs:
    items: []
