# The same shapes, authored correctly. Every rule must stay silent on this file — a lint that
# cannot tell these two fixtures apart is either blind or noisy.
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-table}
spec:
  widgetData:
    # {namespace} is NOT a column — it is a navigation-only cell minted by the dataSource jq.
    # This is the case that made the naive version of P10 report 12 false positives.
    rowNavigateTo: "/compositions/{namespace}/{name}"
    columns:
      - valueKey: title
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ [ {valueKey:"title",stringValue:"x"}, {valueKey:"namespace",stringValue:"y"}, {valueKey:"name",stringValue:"z"} ] }'
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-flex}
spec:
  widgetData:
    items:
      - resourceRefId: real
  resourcesRefs:
    items:
      - id: real
---
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-button}
spec:
  widgetData:
    label: "New composition"
---
kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-tag-templated}
spec:
  # A templated label is COMPUTED, not missing — flagging it would be the false positive.
  widgetData:
    color: green
  widgetDataTemplate:
    - forPath: label
      expression: '${ .status }'
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: real-card}
spec:
  widgetData: {items: []}
  resourcesRefs: {items: []}
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: refs-a-real-card}
spec:
  widgetData:
    items:
      - resourceRefId: ok
      - resourceRefId: cfg
  resourcesRefs:
    items:
      - id: ok
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: real-card
        resource: cards
      # A NON-WIDGET ref. Secrets and ConfigMaps legitimately live outside this chart's template
      # set, so X13 must ignore them — flagging these would make the rule unusable.
      - id: cfg
        apiVersion: v1
        name: some-configmap
        resource: configmaps

---
# X5: the child's plural is declared. Also covers the two deliberate non-reports — a container
# with NO allowedResources is unconstrained, not a defect.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: x5-good
spec:
  widgetData:
    allowedResources:
    - tables
    items:
    - resourceRefId: a-table
  resourcesRefs:
    items:
    - id: a-table
      name: a-table
      resource: tables
      verb: GET
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: x5-unconstrained
spec:
  widgetData:
    items:
    - resourceRefId: a-table
  resourcesRefs:
    items:
    - id: a-table
      name: a-table
      resource: tables
      verb: GET
---
# P25 page-header: a nav whose routes both resolve to pages that name themselves. The second is the
# documented opt-out — a page with genuinely no single header, where the exception is written down
# on the CR and therefore reviewable, rather than living in an exclusion list inside the lint.
kind: Menu
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-nav-good
spec:
  widgetData:
    allowedResources:
    - flexes
    items:
    - label: Things
      path: /things
      resourceRefId: p25-good-root
    - order: 900
      path: "/things/{name}"
      page: p25-exempt
  resourcesRefs:
    items:
    - id: p25-good-root
      name: p25-good
      resource: flexes
      verb: GET
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-good
spec:
  widgetData:
    gap: middle
    allowedResources:
    - pageheaders
    items:
    - resourceRefId: the-header
  resourcesRefs:
    items:
    - id: the-header
      name: p25-header
      resource: pageheaders
      verb: GET
---
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-header
spec:
  widgetData:
    title: Things
  resourcesRefs:
    items: []
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-p25-exempt
  annotations:
    "krateo.io/no-page-header": "two apiRefs — the title line is assembled from both"
spec:
  widgetData:
    gap: middle
    allowedResources:
    - flexes
    items:
    - resourceRefId: title-stack
  resourcesRefs:
    items:
    - id: title-stack
      name: p25-title-stack
      resource: flexes
      verb: GET
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-title-stack
spec:
  widgetData:
    items: []
  resourcesRefs:
    items: []
---
# P25, the templated-items branch done right: `items` is assembled by jq, and the first literal in
# that template is a PageHeader. The rule must read through the template rather than exempt the page.
kind: Menu
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-nav-templated-good
spec:
  widgetData:
    allowedResources:
    - flexes
    items:
    - order: 901
      path: "/detail/{name}"
      page: p25-templated-good
  resourcesRefs:
    items: []
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: page-p25-templated-good
spec:
  widgetData:
    gap: middle
    allowedResources:
    - pageheaders
    - cards
    items:
    - resourceRefId: the-hdr
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "the-hdr" } ] + (if (.extra // false) then [ { resourceRefId: "a-card" } ] else [] end) }'
  resourcesRefs:
    items:
    - id: the-hdr
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: p25-good-header
      resource: pageheaders
      verb: GET
    - id: a-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: p25-extra-card
      resource: cards
      verb: GET
---
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-good-header
spec:
  widgetData:
    title: Detail
  resourcesRefs:
    items: []
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: p25-extra-card
spec:
  widgetData: {}
  resourcesRefs:
    items: []
---
# The same templated shape done right: every literal the template names is declared, and each
# child's plural is admitted by allowedResources.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: x4-x5-templated-good
spec:
  widgetData:
    allowedResources:
    - cards
    - tables
    items:
    - resourceRefId: a-card
  widgetDataTemplate:
  - forPath: items
    expression: '${ [ { resourceRefId: "a-card" } ] + (if .flag then [ { resourceRefId: "a-table" } ] else [] end) }'
  resourcesRefs:
    items:
    - id: a-card
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: good-card
      resource: cards
      verb: GET
    - id: a-table
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: good-table
      resource: tables
      verb: GET
---
kind: Card
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: good-card
spec:
  widgetData: {}
  resourcesRefs:
    items: []
---
kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: good-table
spec:
  widgetData: {}
  resourcesRefs:
    items: []
---
# A PageHeader pill that carries its own word as well as its colour.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: c13-pageheader-good
spec:
  widgetData:
    title: Something
    tags:
    - label: Healthy
      color: green
---
# T8 clean — a bare palette key.
kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: t8-good-colour
spec:
  widgetData:
    label: Fine
    color: red
  resourcesRefs:
    items: []
---
# T8 clean — the legacy --*-color alias, which cssVariables emits for every palette key.
kind: Statistic
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: t8-good-alias
spec:
  widgetData:
    title: Fine
    color: var(--green-color)
  resourcesRefs:
    items: []
---
# T8 clean — the widget's OWN itemTemplate placeholder, substituted per row from the RA's data.
# The false positive that would get this rule switched off.
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: t8-good-placeholder
spec:
  widgetData:
    itemTemplate:
      status:
        color: "{readyColor}"
  resourcesRefs:
    items: []
---
# A context eyebrow is not a trail (P27).
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-context-eyebrow}
spec:
  widgetData:
    variant: eyebrow
    text: "Platform · tenant krateo-enterprise"
---
# A portal with no shell breadcrumb keeps its own, and says so (P27).
kind: Breadcrumb
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: good-own-breadcrumb
  annotations: {krateo.io/own-breadcrumb: "true"}
spec:
  widgetData:
    items:
      - title: Home
---
# A4: the Autopilot entry point among the header's actions: filled, wand icon, 'Ask Autopilot →'.
kind: PageHeader
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-autopilot-header}
spec:
  widgetData:
    title: Controller Builder
    items:
      - resourceRefId: good-ask
      - resourceRefId: good-build
  resourcesRefs:
    items:
      - {id: good-build, apiVersion: widgets.templates.krateo.io/v1beta1, name: good-build, namespace: krateo-system, resource: buttons, verb: GET}
      - {id: good-ask, apiVersion: widgets.templates.krateo.io/v1beta1, name: good-ask, namespace: krateo-system, resource: buttons, verb: GET}
---
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-build}
spec:
  widgetData:
    label: Build a controller
    type: primary
    clickActionId: go
    actions:
      navigate:
        - {id: go, type: navigate, path: /controller-builder/compose}
---
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-ask}
spec:
  widgetData:
    label: Ask Autopilot →
    icon: fa-wand-magic-sparkles
    type: primary
    clickActionId: ask
    actions:
      navigate:
        - {id: ask, type: navigate, path: "/controller-builder/compose?ask=help"}
---
# C26: the dismiss role amber, the destroy role red.
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-cancel}
spec:
  widgetData:
    label: Cancel
    intent: dismiss
    clickActionId: back
    actions:
      navigate:
        - {id: back, type: navigate, path: /compositions}
---
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: good-delete}
spec:
  widgetData:
    label: Delete composition
    danger: true
    type: default
    clickActionId: del
    actions:
      navigate:
        - {id: del, type: navigate, path: /compositions/delete}
