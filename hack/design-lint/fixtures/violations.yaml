kind: Table
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: bad-table}
spec:
  widgetData:
    rowNavigateTo: "/compositions/{namespace}/{missingKey}"
    columns:
      - valueKey: title
  widgetDataTemplate:
    - forPath: dataSource
      expression: '${ [ {valueKey:"title",stringValue:"x"}, {valueKey:"namespace",stringValue:"y"} ] }'
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: bad-flex}
spec:
  widgetData:
    items:
      - resourceRefId: ghost
      - resourceRefId: real
  resourcesRefs:
    items:
      - id: real
---
kind: Button
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: bad-button}
spec:
  widgetData:
    label: "← Back to compositions"
---
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: bad-title}
spec:
  widgetData:
    text: "🚨 Payments-API database failure"
---
kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: bad-tag}
spec:
  widgetData:
    color: green
---
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata: {name: refs-a-ghost}
spec:
  widgetData:
    items:
      - resourceRefId: vanished
  resourcesRefs:
    items:
      # X13 — names a Card that exists nowhere in this set. The parent renders without it,
      # silently, which is how a deleted CR takes a feature with it.
      - id: vanished
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: card-that-was-deleted
        resource: cards
