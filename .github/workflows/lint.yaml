# Canonical Krateo chart-repo lint workflow. PR-time validation for every chart in
# the repo — helm lint, values.schema.json well-formedness, and a render smoke test.
# Shape-agnostic: discovers chart/, crd-chart/ and charts/* (vendored dependency
# charts sit deeper and are skipped). Identical across all krateo-* chart repos.
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Lint, validate schema, render
        run: |
          set -euo pipefail
          # All first-class charts (chart/, crd-chart/, charts/*). Vendored dependency
          # charts live at depth >=4 (e.g. charts/x/charts/dep), so -maxdepth 3 excludes them.
          mapfile -t dirs < <(find . -maxdepth 3 -name Chart.yaml -printf '%h\n' | sort -u)
          fail=0
          for dir in "${dirs[@]}"; do
            echo "::group::${dir}"
            # Placeholder versions used by the release workflow must not break lint.
            sed -i 's/CHART_VERSION/0.0.0/g; s/APP_VERSION/0.0.0/g' "${dir}/Chart.yaml"
            if [ -f "${dir}/values.schema.json" ]; then
              python3 -c "import json; json.load(open('${dir}/values.schema.json'))" \
                && echo "values.schema.json: valid JSON" || { echo "values.schema.json: INVALID"; fail=1; }
            fi
            if grep -q '^dependencies:' "${dir}/Chart.yaml"; then
              helm dependency build "${dir}" >/dev/null 2>&1 || helm dependency update "${dir}" >/dev/null 2>&1 || true
            fi
            helm lint "${dir}" || fail=1
            helm template smoke "${dir}" >/dev/null || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # F6 cache-key declaration gate (issues #26/#27): every widget reachable from a
  # parameterized nav route must declare that route's params in spec.keyExtras,
  # else snowplow's post-F6 guard declines every cache Put for it (permanently
  # uncacheable). See README "Authoring rule: spec.keyExtras".
  keyextras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: keyExtras route lint
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip3 install --user pyyaml
          python3 scripts/lint-keyextras.py

  # The chart declares its configuration surface twice — `# @schema` blocks in values.yaml and the
  # checked-in values.schema.json the installer actually enforces (it applies the SCHEMA's
  # defaults, not values.yaml's). Nothing compared them, so they could drift silently; a drifted
  # schema makes `helm template` reject a valid values file, or ships a key unset.
  values-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: values.yaml and values.schema.json must agree
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip3 install --user pyyaml
          python3 scripts/lint-values-schema.py

  # Helm stores one release record as base64(gzip(json)) in a Secret, and k8s rejects a Secret whose
  # decoded data passes MaxSecretSize — a compiled-in 1 MiB constant. The portal crossed it on
  # 2026-09-11 and nothing noticed for two days: CDC applies content BEFORE writing the record, so
  # the cluster converged while helm history silently froze. This models the record and fails before
  # that can happen again. Do NOT replace it with a manifest-bytes or CR-count check — both have
  # moved opposite to the record in this chart's own history.
  release-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The Helm release record must stay writable
        run: python3 scripts/lint-release-size.py

  # Route-derivation fixtures for Table rowNavigateTo. This existed for months and NOTHING ran it,
  # so its model of Table.tsx buildRowPath silently fell behind the real one — it lacked the
  # whole-placeholder branch and modelled a pre-built route as a percent-encoded dead link. A
  # fixture nobody executes is a comment that costs maintenance; wired in so it is neither.
  rownavigateto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Table rowNavigateTo route derivation
        run: python3 scripts/test-rownavigateto-f8.py

  # The builder publish chain's Install step is four RESTActions and three widgets of jq, and each
  # defect found in it (a claim re-pointing an official marketplace card, Install offered for a
  # publish the form could not pre-fill, a page set told to install a release that never happened)
  # was a branch nobody had evaluated. This renders the chart and runs that jq on fixtures.
  builder-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every Form the checks resolve is validated, as resolved, against the NEWEST RELEASED Form CRD:
      # The frontend's own secret-field rules (frontend#424, vendored in scripts/frontend-secretjq):
      # test-controller-builder asks them, not a model of them, whether the Configure form's
      # overrides are refused, resolved in the browser, or sent to /jq.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend secret-field rules
        run: npm ci --prefix scripts/frontend-secretjq --no-audit --no-fund

      # snowplow refuses a resolved widget its CRD does not admit, and portal 1.8.45 shipped one.
      - name: Builder Install step, evaluated and validated
        run: |
          set -euo pipefail
          python3 -c "import yaml, jsonschema" 2>/dev/null || pip3 install --user pyyaml jsonschema
          jq --version
          helm pull oci://ghcr.io/krateo-platformops/charts/frontend-crds --untar -d "$RUNNER_TEMP/crds"
          grep '^version:' "$RUNNER_TEMP/crds/frontend-crds/Chart.yaml"
          python3 scripts/test-builder-install.py --crds "$RUNNER_TEMP/crds/frontend-crds"
          # /controller-builder: the deliverables ladder (claim -> PR -> definition -> install ->
          # RestDefinitions -> credentials) on 057-shaped fixtures, and the page's alignment with
          # /blueprint-builder, widget for widget; the Configure form under the frontend's rules.
          python3 scripts/test-controller-builder.py --crds "$RUNNER_TEMP/crds/frontend-crds"

  # The Builder CRs (files/builders/*.builder.yaml, rendered by templates/builders.yaml) are byte-identical copies of the frontend's fixtures
  # (krateo-platformops/frontend ui/src/builders/fixtures). This compares them with frontend main,
  # checks they agree with the chart (draft kinds, drafts cards, preview RESTActions), and that every
  # signed-in user (system:authenticated) may read them, demo users on or off. Red after a frontend
  # fixture change means: copy it here.
  builder-crs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Builder CRs match the frontend's fixtures
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip3 install --user pyyaml
          python3 scripts/test-builder-crs.py

  # No RESTAction reads Secrets: snowplow serves a secrets GET or LIST from a cluster-wide informer
  # it registers on first touch, data included and the Accept header ignored, so one step that
  # only wanted to know a Secret exists would cache every Secret's data (scripts/lint-ra-secrets.py).
  # Settings > Users and the data-driven reads (a composition's managed Secret, /resources on a
  # Secret) are resolved on fixtures and validated against the newest released CRDs.
  ra-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No RESTAction reads Secrets
        run: |
          set -euo pipefail
          python3 -c "import yaml, jsonschema" 2>/dev/null || pip3 install --user pyyaml jsonschema
          python3 scripts/lint-ra-secrets.py
          helm pull oci://ghcr.io/krateo-platformops/charts/frontend-crds --untar -d "$RUNNER_TEMP/crds"
          grep '^version:' "$RUNNER_TEMP/crds/frontend-crds/Chart.yaml"
          python3 scripts/test-settings-users.py --crds "$RUNNER_TEMP/crds/frontend-crds"
          python3 scripts/test-no-secret-reads.py --crds "$RUNNER_TEMP/crds/frontend-crds"

  # /reviews and its proposal and run pages: three RESTActions and ~40 widgets of jq over the
  # nightly review's Proposals and ReviewRuns. This resolves them on fixtures shaped like krateo-057
  # (superseded chains, legacy proposals, unanswered discovery, failed and partial runs), checks the
  # change-request claim against builder-publish's values schema, and validates every widget, as
  # resolved, against the newest released frontend CRDs.
  platform-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Platform Review pages, evaluated and validated
        run: |
          set -euo pipefail
          python3 -c "import yaml, jsonschema" 2>/dev/null || pip3 install --user pyyaml jsonschema
          jq --version
          helm pull oci://ghcr.io/krateo-platformops/charts/frontend-crds --untar -d "$RUNNER_TEMP/crds"
          grep '^version:' "$RUNNER_TEMP/crds/frontend-crds/Chart.yaml"
          python3 scripts/test-platform-review.py --crds "$RUNNER_TEMP/crds/frontend-crds"

  # A composition's topology on its detail page is one builder-publish template, one RESTAction of
  # nine jq programs and five widgets of jq, run by CDC's Helm, snowplow's resolver and snowplow's
  # widget resolver — and `helm template` evaluates none of it. Drafts of it read correctly and were
  # wrong on realistic input (an informer-served object with no apiVersion, a denial whose object
  # name snowplow does not keep in `details`). This renders both charts and runs that jq
  # on krateo-057 objects, then validates every topology widget CR, as authored and as resolved,
  # against the NEWEST RELEASED frontend-crds: snowplow refuses a resolved widget its CRD does not
  # admit (HTTP 400), so this job stays red until a frontend release carries the FlowChart CRD with
  # `variant: architecture` — which is the first half of this chart's merge order, not a flake.
  composition-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Composition topology, evaluated and validated
        run: |
          set -euo pipefail
          python3 -c "import yaml, jsonschema" 2>/dev/null || pip3 install --user pyyaml jsonschema
          jq --version
          helm pull oci://ghcr.io/krateo-platformops/charts/frontend-crds --untar -d "$RUNNER_TEMP/crds"
          grep '^version:' "$RUNNER_TEMP/crds/frontend-crds/Chart.yaml"
          python3 scripts/test-composition-architecture.py --crds "$RUNNER_TEMP/crds/frontend-crds"

  # snowplow resolves every widget with NO request extras on its Phase-1 walk, and a step path that
  # papers over a missing route param with a `//` default dials a half-built path anyway: krateo-057
  # logged 601 GETs of `…/builderpublishes/review-`, 358 of `/apis/none.krateo.io/v1/none` and 67 of
  # `/api/v1/namespaces//configmaps/-architecture` in 20 minutes, all 404s continueOnError hid. A step
  # that needs its input is gated on it (a dependsOn.iterator that yields nothing without it). The
  # lint checks every RESTAction; the test resolves the gated ones with and without their input and
  # validates the widgets they feed, as resolved, against the newest released frontend CRDs.
  ra-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No RESTAction step dials a half-built path
        run: |
          set -euo pipefail
          python3 -c "import yaml, jsonschema" 2>/dev/null || pip3 install --user pyyaml jsonschema
          jq --version
          python3 scripts/lint-ra-paths.py
          helm pull oci://ghcr.io/krateo-platformops/charts/frontend-crds --untar -d "$RUNNER_TEMP/crds"
          grep '^version:' "$RUNNER_TEMP/crds/frontend-crds/Chart.yaml"
          python3 scripts/test-ra-input-gates.py --crds "$RUNNER_TEMP/crds/frontend-crds"

  # The Controller Builder's preview (controller-render-draft) answers with blueprint-render-draft's
  # `objects`/`error`, so the frontend's verdict handling reads it unchanged. Every way it can go —
  # CRDs, a severity:error finding, oasgen-render missing or down, no draft — must be a sentence
  # there, never a jq error or an empty success. Resolved on /render answers shaped as
  # oasgen-provider 0.25.0 documents them.
  controller-render-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controller preview, resolved on every answer
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip3 install --user pyyaml
          jq --version
          python3 scripts/test-controller-render-draft.py
