# The portal's Ready-reason classification against core-provider's generated table
# (docs/ready-reasons.md on core-provider main). On every PR and push, and DAILY: core-provider can add
# or reclassify a reason without touching this repo, and a reason the portal does not know renders as a
# failure. The daily run is how that is noticed even when no portal PR is open. See ready-reasons.yaml.
name: ready-reasons

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ready-reasons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ready reasons match core-provider's table
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip3 install --user pyyaml
          python3 scripts/test-ready-reasons.py
