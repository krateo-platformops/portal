# The portal's reason definitions against core-provider's reason JSON (docs/ready-reasons.json for a
# composition, docs/cd-ready-reasons.json for a CompositionDefinition), at the core-provider ref that
# scripts/gen-reason-defs.py pins (CORE_PROVIDER_REF, the one place it is set; --fetch reads it there).
# On every PR and push: the generated maps in the .tpl files are what the generator writes from that
# JSON, and the two tests check, from the .tpl files on their own, that they mean what the JSON says.
# DAILY, the generator's --check also runs against core-provider main: core-provider can add or
# reclassify a reason without touching this repo, and a reason the portal does not know renders as a
# failure. A red scheduled run says main has moved past the pin: decide how the portal shows the
# change, then move the pin and regenerate.
name: ready-reasons

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ready-reasons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 @ 2026-11-23

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0 @ 2026-11-23
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 @ 2026-11-23
        with:
          python-version: "3.12"

      - name: Fetch core-provider's reason JSON at the pinned ref
        run: python3 scripts/gen-reason-defs.py --fetch "$RUNNER_TEMP/reasons"

      - name: The generated reason definitions are what the pinned JSON gives
        run: python3 scripts/gen-reason-defs.py --check --json-dir "$RUNNER_TEMP/reasons"

      - name: Ready reasons match core-provider's JSON
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip3 install --user pyyaml
          python3 scripts/test-ready-reasons.py --json-dir "$RUNNER_TEMP/reasons"

      - name: A blueprint's state matches core-provider's CompositionDefinition JSON
        run: python3 scripts/test-cd-ready-reasons.py --json-dir "$RUNNER_TEMP/reasons"

      - name: core-provider main has not moved past the pin
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          python3 scripts/gen-reason-defs.py --fetch "$RUNNER_TEMP/reasons-main" --ref main
          python3 scripts/gen-reason-defs.py --check --json-dir "$RUNNER_TEMP/reasons-main"
