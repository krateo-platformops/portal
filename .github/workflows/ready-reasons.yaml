# The portal's Ready-reason classification against core-provider's generated tables
# (docs/ready-reasons.md for a composition, docs/cd-ready-reasons.md for a CompositionDefinition, both
# on core-provider main). On every PR and push, and DAILY: core-provider can add
# or reclassify a reason without touching this repo, and a reason the portal does not know renders as a
# failure. The daily run is how that is noticed even when no portal PR is open. See ready-reasons.yaml.
name: ready-reasons

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ready-reasons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 @ 2026-11-23

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0 @ 2026-11-23
        with:
          version: v3.19.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 @ 2026-11-23
        with:
          python-version: "3.12"

      - name: Ready reasons match core-provider's table
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip3 install --user pyyaml
          python3 scripts/test-ready-reasons.py

      - name: A blueprint's state matches core-provider's CompositionDefinition table
        run: |
          set -euo pipefail
          python3 scripts/test-cd-ready-reasons.py
