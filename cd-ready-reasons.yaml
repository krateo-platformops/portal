# core-provider's table of a CompositionDefinition's condition reasons, as this portal was written
# against it, and how the portal shows each one. A composition's reasons are ready-reasons.yaml; the
# two are separate sets.
#
# core-provider GENERATES the complete, closed list (docs/cd-ready-reasons.md on its main, from code:
# core-provider#557). The portal reads a blueprint's state from it in ONE place, cdState in
# helm/portal/templates/_cd-ready-reasons.tpl (copied byte-identical into blueprints-page): the
# blueprint cards (marketplace grid, dashboard "Top blueprints", their Ask-Agentiko prompt) and the
# blueprint detail header pill. Before it, a card was red only on Synced=False, so a failed Ready
# (SchemaDefaultContradiction) read "still installing", and the pill read every Ready=False Degraded,
# so Creating and Deleting read as failures. scripts/test-cd-ready-reasons.py (the ready-reasons
# workflow: every PR, main and daily) fails when:
#   - core-provider's table differs from `table` below in any row (a reason added, removed, or given a
#     new status or parent verdict). Decide how the portal shows the change, update cdState, then
#     update this file;
#   - cdReadyVerdict in _cd-ready-reasons.tpl does not map every Ready reason to its verdict, or
#     cdSyncedPaused names a Synced reason the table does not have;
#   - the cards, run over one CompositionDefinition per Ready row, do not show the state its verdict
#     means.
#
# `portal` says what the portal shows, for the reader of this file; it is not parsed.
source: https://raw.githubusercontent.com/krateo-platformops/core-provider/main/docs/cd-ready-reasons.md
table:
  - {condition: Ready, reason: Available, status: "True", writer: core-provider, verdict: healthy, portal: ready (green) / Healthy}
  - {condition: Ready, reason: ScaledToZero, status: "True", writer: core-provider, verdict: healthy, portal: ready (green) / Healthy}
  - {condition: Ready, reason: Creating, status: "False", writer: core-provider, verdict: converging, portal: still installing (orange) / Pending}
  - {condition: Ready, reason: Unavailable, status: "False", writer: core-provider, verdict: failed, portal: failed (red) / Degraded, Ready's message}
  - {condition: Ready, reason: RemoteChartUnreachable, status: "False", writer: core-provider, verdict: failed, portal: failed (red) / Degraded, Ready's message}
  - {condition: Ready, reason: SchemaDefaultContradiction, status: "False", writer: core-provider, verdict: failed, portal: failed (red) / Degraded, Ready's message (the JSON pointers)}
  - {condition: Ready, reason: ValuesSchemaMissing, status: "False", writer: core-provider, verdict: failed, portal: failed (red) / Degraded, Ready's message (the chart has no values.schema.json)}
  - {condition: Ready, reason: DerivedNameTooLong, status: "False", writer: core-provider, verdict: failed, portal: failed (red) / Degraded, Ready's message (each derived name, its length and the problem)}
  - {condition: Ready, reason: Deleting, status: "False", writer: core-provider, verdict: converging, portal: still installing (orange) / Pending}
  - {condition: Ready, reason: NotObserved, status: Unknown, writer: provider-runtime, verdict: "unevaluated (rolls up as healthy)", portal: "pending (orange); failed when Synced=False, where its error is"}
  - {condition: Ready, reason: Creating, status: "False", writer: provider-runtime, verdict: converging, portal: still installing (orange) / Pending}
  - {condition: Ready, reason: Deleting, status: "False", writer: provider-runtime, verdict: converging, portal: still installing (orange) / Pending}
  - {condition: Ready, reason: CreateWithheldByPolicy, status: "False", writer: provider-runtime, verdict: failed, portal: "failed (red) / Degraded, Ready's message: the CRD is absent and the management policy withholds create; nothing happens until a human changes the policy"}
  - {condition: Ready, reason: UpdateWithheldByPolicy, status: "True", writer: provider-runtime, verdict: healthy, portal: "ready (green) / Healthy: the definition works at its installed state; the policy withholds bringing it to its desired one"}
  - {condition: Synced, reason: ReconcileSuccess, status: "True", writer: provider-runtime, verdict: "—", portal: no effect}
  - {condition: Synced, reason: ReconcileError, status: "False", writer: provider-runtime, verdict: "—", portal: "failed (red) / Degraded, or Drift when Ready=True; Synced's message unless Ready's verdict is failed"}
  - {condition: Synced, reason: ReconcilePaused, status: "False", writer: provider-runtime, verdict: "—", portal: paused (gray) / Paused}
  - {condition: Synced, reason: ManagementPolicyInvalid, status: "False", writer: provider-runtime, verdict: "—", portal: "failed (red) / Degraded, or Drift when Ready=True, as any Synced=False: the management-policy annotation does not parse, so the reconciler only observes; Synced's message names it"}
  - {condition: Synced, reason: DeletionPolicyInvalid, status: "False", writer: provider-runtime, verdict: "—", portal: "failed (red) / Degraded, or Drift when Ready=True, as any Synced=False: the deletion-policy value is invalid, so the resource is kept on delete; Synced's message names it"}
  # core-provider's other conditions (#595). Their verdict is "—": core-provider's rollup reads Ready
  # only, and so does the portal. cdState reads Ready and Synced and nothing else, and no page lists
  # a definition's raw conditions, so none of these changes what a card or the header pill shows
  # (the pill's reasoning is in helm/blueprints-page/templates/pageheader.blueprint-detail.yaml).
  - {condition: ApiRefRBACComplete, reason: InvalidApiRef, status: "False", writer: core-provider, verdict: "—", portal: "no effect: it only explains a Synced=False, which the card and the pill already show from Synced"}
  - {condition: ApiRefRBACComplete, reason: RESTActionForbidden, status: "False", writer: core-provider, verdict: "—", portal: "no effect: it only explains a Synced=False, which the card and the pill already show from Synced"}
  - {condition: ApiRefRBACComplete, reason: RESTActionNotFound, status: "False", writer: core-provider, verdict: "—", portal: "no effect: it only explains a Synced=False, which the card and the pill already show from Synced"}
  - {condition: ApiRefRBACComplete, reason: ReadSetResolved, status: "True", writer: core-provider, verdict: "—", portal: "no effect: it only explains a Synced=False, which the card and the pill already show from Synced"}
  - {condition: ApiRefRBACComplete, reason: SnowplowError, status: "False", writer: core-provider, verdict: "—", portal: "no effect: it only explains a Synced=False, which the card and the pill already show from Synced"}
  - {condition: ApiRefRBACComplete, reason: SnowplowNotConfigured, status: "False", writer: core-provider, verdict: "—", portal: "no effect: it only explains a Synced=False, which the card and the pill already show from Synced"}
  - {condition: ApiRefRBACComplete, reason: SnowplowUnavailable, status: "False", writer: core-provider, verdict: "—", portal: "no effect: it only explains a Synced=False, which the card and the pill already show from Synced"}
  - {condition: ApiRefRBACComplete, reason: StageUnresolvable, status: "False", writer: core-provider, verdict: "—", portal: "no effect: it only explains a Synced=False, which the card and the pill already show from Synced"}
  - {condition: ApiRefRBACComplete, reason: Unauthorized, status: "False", writer: core-provider, verdict: "—", portal: "no effect: it only explains a Synced=False, which the card and the pill already show from Synced"}
  - {condition: AuthnDelegation, reason: DelegationUnsupported, status: "False", writer: core-provider, verdict: "—", portal: "no effect: informational, a definition is healthy either way"}
  - {condition: AuthnDelegation, reason: Rendered, status: "True", writer: core-provider, verdict: "—", portal: "no effect: informational, a definition is healthy either way"}
  - {condition: AuthnMappingApplied, reason: Applied, status: "True", writer: core-provider, verdict: "—", portal: "no effect: False/AuthnNotInstalled is a healthy definition on a cluster with no authn CRD"}
  - {condition: AuthnMappingApplied, reason: AuthnNotInstalled, status: "False", writer: core-provider, verdict: "—", portal: "no effect: False/AuthnNotInstalled is a healthy definition on a cluster with no authn CRD"}
  - {condition: AuthnMappingApplied, reason: MappingMissing, status: "False", writer: core-provider, verdict: "—", portal: "no effect on the state pill, which reads Ready"}
  - {condition: AuthnMappingApplied, reason: NotObserved, status: Unknown, writer: core-provider, verdict: "—", portal: "no effect on the state pill, which reads Ready"}
  - {condition: ControllerActive, reason: NotObserved, status: Unknown, writer: core-provider, verdict: "—", portal: "no effect: Ready carries the controller state (Unavailable, ScaledToZero) the portal shows"}
  - {condition: ControllerActive, reason: Running, status: "True", writer: core-provider, verdict: "—", portal: "no effect: Ready carries the controller state (Unavailable, ScaledToZero) the portal shows"}
  - {condition: ControllerActive, reason: ScaledToZero, status: "False", writer: core-provider, verdict: "—", portal: "no effect: Ready carries the controller state (Unavailable, ScaledToZero) the portal shows"}
  - {condition: ControllerActive, reason: Unavailable, status: "False", writer: core-provider, verdict: "—", portal: "no effect: Ready carries the controller state (Unavailable, ScaledToZero) the portal shows"}
  - {condition: SchemaFullyEnforced, reason: ConstraintsNotEnforced, status: "False", writer: core-provider, verdict: "—", portal: "no effect: informational, the schema applies either way"}
  - {condition: SchemaFullyEnforced, reason: FullyEnforced, status: "True", writer: core-provider, verdict: "—", portal: "no effect: informational, the schema applies either way"}
  - {condition: SchemaFullyEnforced, reason: OwnedByAnotherDefinition, status: Unknown, writer: core-provider, verdict: "—", portal: "no effect: informational, the schema applies either way"}
  - {condition: SchemaFullyEnforced, reason: SchemaInferred, status: Unknown, writer: core-provider, verdict: "—", portal: "no effect: informational, the schema applies either way"}
  - {condition: SpecSchemaCurrent, reason: Current, status: "True", writer: core-provider, verdict: "—", portal: "no effect: informational, Ready says whether the definition serves"}
  - {condition: SpecSchemaCurrent, reason: GeneratedSchemaNotLooser, status: "False", writer: core-provider, verdict: "—", portal: "no effect: informational, Ready says whether the definition serves"}
  - {condition: SpecSchemaCurrent, reason: LooserSchemaPending, status: "False", writer: core-provider, verdict: "—", portal: "no effect: informational, Ready says whether the definition serves"}
  - {condition: SpecSchemaCurrent, reason: OwnedByAnotherDefinition, status: Unknown, writer: core-provider, verdict: "—", portal: "no effect: informational, Ready says whether the definition serves"}
  - {condition: ValuesSchemaAuthored, reason: Authored, status: "True", writer: core-provider, verdict: "—", portal: "no state effect. The inferred-inputs notice (portal 1.8.163, #568 child 7) keys on the x-krateo-values-schema marker in the schema ConfigMap; the Create form shows this condition's message verbatim under Details, and the blueprint Details \"Inputs\" line reads Unknown/OwnedByAnotherDefinition as \"Defined by another blueprint\""}
  - {condition: ValuesSchemaAuthored, reason: InferredFromValues, status: "False", writer: core-provider, verdict: "—", portal: "no state effect. The inferred-inputs notice (portal 1.8.163, #568 child 7) keys on the x-krateo-values-schema marker in the schema ConfigMap; the Create form shows this condition's message verbatim under Details, and the blueprint Details \"Inputs\" line reads Unknown/OwnedByAnotherDefinition as \"Defined by another blueprint\""}
  - {condition: ValuesSchemaAuthored, reason: OwnedByAnotherDefinition, status: Unknown, writer: core-provider, verdict: "—", portal: "no state effect. The inferred-inputs notice (portal 1.8.163, #568 child 7) keys on the x-krateo-values-schema marker in the schema ConfigMap; the Create form shows this condition's message verbatim under Details, and the blueprint Details \"Inputs\" line reads Unknown/OwnedByAnotherDefinition as \"Defined by another blueprint\""}
  - {condition: MigratedValuesValid, reason: AllValid, status: "True", writer: core-provider, verdict: "—", portal: "not shown yet (core-provider #622, 2.13.125); nothing to show when every instance passed"}
  - {condition: MigratedValuesValid, reason: ValidationIncomplete, status: Unknown, writer: core-provider, verdict: "—", portal: "not shown yet: a mockup for showing it on the blueprint Details page and the named compositions' Edit forms is pending (Diego, 2026-11-22)"}
  - {condition: MigratedValuesValid, reason: ValuesRefusedByNewVersion, status: "False", writer: core-provider, verdict: "—", portal: "not shown yet: a mockup for showing it on the blueprint Details page and the named compositions' Edit forms is pending (Diego, 2026-11-22). Never changes Ready, so the blueprint state is unaffected"}
