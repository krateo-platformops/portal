# Registers the demo blueprint. Package and push the chart first (README), then set the url.
# core-provider writes the chart's values.schema.json, unchanged, to the
# formoptionsdemos-v0-1-0-jsonschema-configmap in this namespace: the create form reads its
# x-krateo-* keywords from there (the generated CRD drops them).
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: form-options-demo
  namespace: demo-system
spec:
  chart:
    url: oci://<your-registry>/charts/form-options-demo
    version: "0.1.0"
